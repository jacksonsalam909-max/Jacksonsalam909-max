<script>
const firebaseConfig={apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
function toggleWhiteBar(){let bar=document.getElementById('whiteBar');let overlay=document.getElementById('overlay');let isFolded=bar.classList.contains('folded');if(window.innerWidth<=700){if(isFolded){bar.classList.remove('folded');overlay.classList.add('show');}else{bar.classList.add('folded');overlay.classList.remove('show');}}else{bar.classList.toggle('folded');}}
document.getElementById('menuBtnTop').addEventListener('click',function(e){e.preventDefault();toggleWhiteBar();});
document.getElementById('overlay').addEventListener('click',function(){toggleWhiteBar();});
(function(){let bar=document.getElementById('whiteBar');if(window.innerWidth<=700){bar.classList.add('folded');}else{bar.classList.remove('folded');}})();
function getTodayIST(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function formatDisplayDMY(s){if(!s)return'';let p=s.split('-');return `${p[2]}-${p[1]}-${p[0]}`;}
function addDays(s, days){let d=new Date(s+'T00:00:00');d.setDate(d.getDate()+days);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function updateDateDisplay(){document.getElementById('dateDisplay').innerText=formatDisplayDMY(document.getElementById('fDate').value);}
function openCalendar(){let el=document.getElementById('fDate');try{if(el.showPicker){el.showPicker();}}catch(e){}}
let fDateEl=document.getElementById('fDate');let urlParams=new URLSearchParams(location.search);fDateEl.value=urlParams.get('date')||getTodayIST();let fTypeEl=document.getElementById('fType');if(urlParams.get('type'))fTypeEl.value=urlParams.get('type');updateDateDisplay();
document.getElementById('datePrev').addEventListener('click',function(){fDateEl.value=addDays(fDateEl.value,-1);updateDateDisplay();loadData();});
document.getElementById('dateNext').addEventListener('click',function(){fDateEl.value=addDays(fDateEl.value,1);updateDateDisplay();loadData();});
document.getElementById('dateCenter').addEventListener('click',function(e){e.preventDefault();openCalendar();});
document.getElementById('calIcon').addEventListener('click',function(e){e.preventDefault();e.stopPropagation();openCalendar();});
fDateEl.addEventListener('change',function(){updateDateDisplay();loadData();});
let allPatients=[],statusMap={},enhancementMap={},masterMap={},searchQuery='',isListView=false,currentPage=1,pendingShri=null;
if(localStorage.getItem('gda_view')==='list')isListView=true;
const gridIconSVG=`<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>`;

function getPageSize(){return isListView?10:20;}
async function buildMasterMap(){masterMap={};try{let snap=await db.collection('patients').get();snap.forEach(d=>{let p=d.data();if(p.deleted)return;let shri=String(p.shriId||p.shri||d.id||'').trim().toUpperCase();let name=String(p.patientName||p.name||'').trim().toUpperCase();let age=p.age||'';let gender=p.gender||'';if(!shri)return;masterMap[shri]={pmjayName:name,cmhtName:'',age,gender};});}catch(e){}try{let snap2=await db.collection('cmht_patients').get();snap2.forEach(d=>{let p=d.data();if(p.deleted)return;let shri=String(p.shriId||p.shri||d.id||'').trim().toUpperCase();let name=String(p.patientName||p.name||'').trim().toUpperCase();let age=p.age||'';let gender=p.gender||'';if(!shri)return;if(!masterMap[shri])masterMap[shri]={pmjayName:'',cmhtName:'',age,gender};masterMap[shri].cmhtName=name;});}catch(e){}}
function enrichPatient(p){let k=String(p.shri||'').trim().toUpperCase();let m=masterMap[k];if(!m)return p;let scheme=document.getElementById('fType').value;if(scheme==='PMJAY'){if(m.pmjayName)p.name=m.pmjayName;}else{if(m.cmhtName)p.name=m.cmhtName;}p.age=m.age||'';p.gender=m.gender||'';return p;}
async function loadData(){try{let d=document.getElementById('fDate').value,s=document.getElementById('fType').value,id=d+'_'+s;document.getElementById('doneMeta').innerText="Loading...";await buildMasterMap();let snap=await db.collection('daily_dialysis_lists').doc(id).get();let patients=snap.exists?(snap.data().patients||[]):[];patients=patients.map((p,i)=>{let e=enrichPatient({...p});e.sl=i+1;return e;});allPatients=patients;let sSnap=await db.collection('daily_photo_opd').doc(id).get();statusMap=sSnap.exists?(sSnap.data().status||{}):{};let eSnap=await db.collection('daily_enhancement').doc(id).get();enhancementMap=eSnap.exists?(eSnap.data().status||{}):{};render();}catch(e){document.getElementById('doneMeta').innerText="Error: "+(e.message||e);}}

function showConfirm(sh){pendingShri=sh;let p=allPatients.find(x=>String(x.shri||'').toUpperCase()===sh);let name=p?p.name:sh;document.getElementById('confirmTitle').innerText='UNDO?';document.getElementById('confirmSub').innerText='Move '+name+' back to DONE LIST?';document.getElementById('confirmModal').style.display='flex';}
function hideConfirm(){document.getElementById('confirmModal').style.display='none';pendingShri=null;}

async function confirmSure(){
  if(!pendingShri)return;
  let btn=document.getElementById('btnSure');
  btn.innerText='...';btn.disabled=true;
  let d=document.getElementById('fDate').value;
  let s=document.getElementById('fType').value;
  let id=d+'_'+s;
  let shriToDelete=pendingShri;
  try{
    let docRef=db.collection('daily_enhancement').doc(id);
    let docSnap=await docRef.get();
    if(docSnap.exists){
      await docRef.update({
        [`status.${shriToDelete}`]: firebase.firestore.FieldValue.delete()
      });
    }
    if(enhancementMap[shriToDelete]) delete enhancementMap[shriToDelete];
    hideConfirm();
    render();
    let toast=document.getElementById('toast');
    toast.innerText='Returned to DONE List ✓';
    toast.classList.add('show');
    setTimeout(()=>toast.classList.remove('show'),1500);
  }catch(e){
    alert('Error: '+(e.message||e));
  }finally{
    btn.innerText='SURE';btn.disabled=false;
  }
}

function getInit(n){return(n||'A').charAt(0).toUpperCase();}
function getCol(name){const colors=['linear-gradient(135deg,#f59e0b,#f97316)','linear-gradient(135deg,#8B5CF6,#7C3AED)'];let h=0;for(let i=0;i<name.length;i++){h=name.charCodeAt(i)+((h<<5)-h);}return colors[Math.abs(h)%colors.length];}
function getFiltered(){let bf=document.getElementById('filterBlock').value;let sq=searchQuery.toLowerCase().trim();return allPatients.filter(p=>{let sh=String(p.shri||'').toUpperCase();if(!sh)return false;if(bf&&p.block!==bf)return false;let enh=enhancementMap[sh];if(!enh||!enh.enhanced)return false;if(sq){let nameL=String(p.name||'').toLowerCase();let shriL=sh.toLowerCase();if(!nameL.includes(sq)&&!shriL.includes(sq))return false;}return true;});}
function updateToggleBtn(){let b=document.getElementById('toggleViewBtn');if(b){b.innerHTML=isListView?listIconSVG:gridIconSVG;}}
function render(){let grid=document.getElementById('grid');if(!grid)return;grid.classList.toggle('listView',isListView);let filtered=getFiltered();let ps=getPageSize();let pages=Math.max(1,Math.ceil(filtered.length/ps));if(currentPage>pages)currentPage=pages;if(currentPage<1)currentPage=1;let items=filtered.slice((currentPage-1)*ps,currentPage*ps);grid.innerHTML='';items.forEach(p=>{let sh=String(p.shri||'').toUpperCase();let div=document.createElement('div');div.className='card';div.innerHTML=`<div class="cardTop"><div class="avatarSq" style="background:${getCol(p.name)}">${getInit(p.name)}</div><div class="info"><div class="name">${p.name||''}</div><div class="sub">${p.time||''} • ${sh}</div><div class="detail">${p.age? p.age+'Y • ':''}${p.gender||''}</div></div></div><div class="actions"><button class="btnAct btnRed" data-shri="${sh}">UNDO</button></div>`;grid.appendChild(div);});if(filtered.length===0){grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:30px;background:#fff;border-radius:14px;color:#0f172a;font-weight:700">No enhancement patients</div>`;}document.getElementById('pageIndicator').innerText=`${currentPage}/${pages}`;document.getElementById('prevBtn').disabled=currentPage<=1;document.getElementById('nextBtn').disabled=currentPage>=pages;document.getElementById('doneB').innerText=filtered.length;document.getElementById('searchInfo').innerText=`${filtered.length} enhancement • ${currentPage}/${pages}`;document.getElementById('doneMeta').innerText=`ENHANCEMENT ${filtered.length}`;updateToggleBtn();document.querySelectorAll('.btnAct').forEach(btn=>{const h=(e)=>{e.preventDefault();e.stopPropagation();showConfirm(btn.getAttribute('data-shri'));};btn.addEventListener('click',h);btn.addEventListener('touchend',h,{passive:false});});}
function goToDone(){let d=document.getElementById('fDate').value,t=document.getElementById('fType').value;location.href='gdacompleted.html?date='+encodeURIComponent(d)+'&type='+encodeURIComponent(t);}
function goToPending(){let d=document.getElementById('fDate').value,t=document.getElementById('fType').value;location.href='gda.html?date='+encodeURIComponent(d)+'&type='+encodeURIComponent(t);}
function addUniversal(el,fn){if(!el)return;el.addEventListener('click',fn);el.addEventListener('touchend',e=>{e.preventDefault();fn(e);},{passive:false});}
document.getElementById('filterBlock')?.addEventListener('change',()=>{currentPage=1;render();});
document.getElementById('fType')?.addEventListener('change',loadData);
addUniversal(document.getElementById('tabSync'),()=>location.reload());
addUniversal(document.getElementById('tabPending'),goToPending);
addUniversal(document.getElementById('tabDone'),goToDone);
addUniversal(document.getElementById('toggleViewBtn'),()=>{isListView=!isListView;localStorage.setItem('gda_view',isListView?'list':'grid');currentPage=1;render();});
addUniversal(document.getElementById('prevBtn'),()=>{currentPage--;if(currentPage<1)currentPage=1;render();});
addUniversal(document.getElementById('nextBtn'),()=>{currentPage++;render();});
addUniversal(document.getElementById('btnSure'),()=>confirmSure());
addUniversal(document.getElementById('btnNotSure'),()=>hideConfirm());
document.getElementById('confirmModal')?.addEventListener('click',e=>{if(e.target.id==='confirmModal')hideConfirm();});
const searchInput=document.getElementById('searchName');const clearBtn=document.getElementById('clearSearch');
searchInput?.addEventListener('input',e=>{searchQuery=e.target.value;if(clearBtn)clearBtn.style.display=searchQuery?'flex':'none';currentPage=1;render();});
addUniversal(clearBtn,()=>{searchInput.value='';searchQuery='';clearBtn.style.display='none';currentPage=1;render();});

const ADMIN_PASSWORD="jack8189";
const adminApp=initializeApp(firebaseConfig,"enhancement_admin_"+Math.random());
const adminDb=adminApp.firestore();
try{
  adminDb.collection("system").doc("global_logout").onSnapshot((snap)=>{
    if(!snap.exists) return;
    let lt=snap.data().logoutTime||0;
    let my=parseInt(localStorage.getItem('shija_login_time')||'0');
    if(lt>my && my!==0){
      localStorage.removeItem('shija_logged');
      localStorage.removeItem('shija_login_time');
      location.href='login.html';
    }
  });
}catch(e){}
document.addEventListener('DOMContentLoaded',()=>{
  const adminBtn=document.getElementById('adminBtn');
  const adminDropdown=document.getElementById('adminDropdown');
  adminBtn?.addEventListener('click',(e)=>{e.stopPropagation(); adminDropdown.style.display = adminDropdown.style.display==='none' || adminDropdown.style.display==='' ? 'block':'none';});
  document.addEventListener('click',(e)=>{ if(!e.target.closest('#adminMenuWrap')) adminDropdown.style.display='none'; });
  document.getElementById('btnLogout')?.addEventListener('click',()=>{ if(confirm('Logout from this device?')){ localStorage.removeItem('shija_logged'); localStorage.removeItem('shija_login_time'); location.href='login.html'; } });
  document.getElementById('btnLogoutAll')?.addEventListener('click',()=>{ adminDropdown.style.display='none'; document.getElementById('logoutAllModal').style.display='flex'; document.getElementById('adminPassInput').value=''; document.getElementById('passError').style.display='none'; });
  document.getElementById('cancelLogoutAll')?.addEventListener('click',()=>{ document.getElementById('logoutAllModal').style.display='none'; });
  document.getElementById('logoutAllModal')?.addEventListener('click',(e)=>{ if(e.target.id==='logoutAllModal') e.currentTarget.style.display='none'; });
  document.getElementById('confirmLogoutAll')?.addEventListener('click',async()=>{
    let pass=document.getElementById('adminPassInput').value.trim();
    if(pass!==ADMIN_PASSWORD){ document.getElementById('passError').style.display='block'; return; }
    document.getElementById('passError').style.display='none';
    let btn=document.getElementById('confirmLogoutAll'); btn.innerText='...'; btn.disabled=true;
    try{
      await adminDb.collection("system").doc("global_logout").set({ logoutTime: Date.now(), timestamp: firebase.firestore.FieldValue.serverTimestamp(), triggeredBy:'admin' },{merge:true});
      alert('All devices logged out!');
      localStorage.removeItem('shija_logged'); localStorage.removeItem('shija_login_time'); location.href='login.html';
    }catch(err){ alert(err.message); btn.innerText='Logout All'; btn.disabled=false; }
  });
});

window.addEventListener('load',()=>{setTimeout(()=>{updateToggleBtn();loadData();},300);});
</script>
