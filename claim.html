<script>
let allClaimed=[],filtered=[],masterPatients=[],currentPage=1,pageSize=12,urlClaimId='',selectedTotalPatient=null,currentView='table';
function toggleWhiteBar(){if(window.innerWidth<=900){document.getElementById('whiteBar').classList.toggle('mOpen');document.getElementById('mobOverlay').classList.toggle('show');}else{document.getElementById('whiteBar').classList.toggle('folded');}}
function closeMob(){document.getElementById('whiteBar').classList.remove('mOpen');document.getElementById('mobOverlay').classList.remove('show');}
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('menuBtnTop').addEventListener('click',e=>{e.preventDefault();toggleWhiteBar();})});
function getClaimIdFromURL(){return new URLSearchParams(location.search).get('claimId')||'';}
window.setView=(v)=>{currentView=v;document.getElementById('gridBtn').classList.toggle('active',v==='grid');document.getElementById('tableBtn').classList.toggle('active',v==='table');document.getElementById('patientGrid').classList.toggle('hidden',v!=='grid');document.getElementById('pagerGrid').classList.toggle('hidden',v!=='grid');document.getElementById('tableWrap').classList.toggle('hidden',v!=='table');renderAll();};
window.changePageSize=()=>{pageSize=parseInt(document.getElementById('pageSize').value);currentPage=1;renderAll();};
async function loadMaster(){
  masterPatients=[];
  let map={};
  function add(raw){
    let shri=String(raw.shri||raw.shriId||'').trim().toUpperCase();
    let name=String(raw.name||raw.patientName||'').trim().toUpperCase();
    let pmjay=String(raw.pmjay||raw.pmjayId||'').trim().toUpperCase();
    if(!shri) return;
    if(!map[shri]) map[shri]={shri,name,pmjayId:pmjay};
  }
  try{ if(typeof patientData!=='undefined' && Array.isArray(patientData)){ patientData.forEach(add); } }catch(e){}
  try{
    const snap=await window._fb.getDocs(window._fb.collection(window._fb.db,"patients"));
    snap.forEach(d=>{ let data=d.data(); if(data.deleted) return; add({shri:data.shri||data.shriId||d.id, name:data.name||data.patientName||'', pmjay:data.pmjay||data.pmjayId||''}); });
  }catch(e){}
  Object.values(map).forEach(v=>masterPatients.push(v));
  masterPatients.sort((a,b)=>a.name.localeCompare(b.name));
}
async function loadAll(){ try{ let snap=await window._fb.getDocs(window._fb.collection(window._fb.db,'discharges')); allClaimed=[]; snap.forEach(d=>{ let o=d.data(); o._id=d.id; if(o.claimId && o.claimStatus==='CLAIMED') allClaimed.push(o); }); allClaimed.sort((a,b)=> new Date(b.claimedAt||0)-new Date(a.claimedAt||0)); }catch(e){} applyFilter(); }
function applyFilter(){
  let s=document.getElementById('fSearch').value.toLowerCase().trim();
  filtered=allClaimed.filter(p=>{
    if(urlClaimId && (p.claimId||'').toUpperCase()!==urlClaimId.toUpperCase()) return false;
    if(s){ let t=`${p.patientName||p.name||''} ${p.shriId||p.shri||''} ${p.claimId||''}`.toLowerCase(); if(!t.includes(s)) return false; }
    return true;
  });
  currentPage=1; renderAll();
}
function getInitial(n){return (n||'P').charAt(0).toUpperCase();}
function renderAll(){
  let tp=Math.max(1,Math.ceil(filtered.length/pageSize)); if(currentPage>tp) currentPage=tp;
  let st=(currentPage-1)*pageSize; let data=filtered.slice(st,st+pageSize);
  document.getElementById('countBadge').innerText=`${filtered.length} CLAIMED`;
  let gh='';
  data.forEach(p=>{
    let pm=p.pmjayCmhtId||p.pmjayId||p.pmjay||'';
    gh+=`<div class="pCard"><div class="pCardTop"><div class="pCardAvatar">${getInitial(p.patientName||p.name)}</div><span class="claimBadge">${p.claimId||'-'}</span></div><div class="pCardBody"><div class="pCardName">${p.patientName||p.name||''}</div><div class="pCardRow"><span>SHRI</span><b>${p.shriId||p.shri||'-'}</b></div><div class="pCardRow"><span>PMJAY</span><b>${pm||'-'}</b></div><div class="pCardRow"><span>TIME • BLOCK</span><b>${p.time||'-'} • ${p.block||'-'}</b></div><div class="pCardActions"><button class="btnEditText" onclick="editClaim('${p._id}')">EDIT</button><button class="btnDelText" onclick="removeClaim('${p._id}')">DELETE</button></div></div></div>`;
  });
  if(!data.length) gh='<div style="grid-column:1/-1;text-align:center;padding:40px;background:#fff;border-radius:16px;border:1px solid #e2e8f0">No claimed patients</div>';
  document.getElementById('patientGrid').innerHTML=gh;
  let tb=document.getElementById('tbody'); tb.innerHTML='';
  if(!data.length) tb.innerHTML=`<tr><td colspan="8" style="padding:30px">NO CLAIMED PATIENTS</td></tr>`;
  else data.forEach((p,i)=>{
    let pm=p.pmjayCmhtId||p.pmjayId||p.pmjay||'';
    let tr=document.createElement('tr');
    tr.innerHTML=`<td>${st+i+1}</td><td class="nameCol"><b>${p.patientName||p.name||''}</b></td><td>${p.shriId||p.shri||''}</td><td style="font-weight:900">${pm}</td><td><span style="background:#0f172a;color:#fff;padding:4px 10px;border-radius:20px;font-weight:900;font-size:9px">${p.claimId}</span></td><td>${p.time||''}</td><td>${p.block||''}</td><td><div style="display:flex;gap:6px;justify-content:center"><button style="height:32px;padding:0 12px;border-radius:8px;border:0;background:#facc15;font-weight:800;font-size:11px;cursor:pointer" onclick="editClaim('${p._id}')">EDIT</button><button style="height:32px;padding:0 14px;border-radius:8px;border:0;background:#ef4444;color:#fff;font-weight:800;font-size:11px;cursor:pointer" onclick="removeClaim('${p._id}')">DEL</button></div></td>`;
    tb.appendChild(tr);
  });
  ['','Grid'].forEach(s=>{
    let pi=document.getElementById('pageInfo'+s);
    let pr=document.getElementById('prevBtn'+s);
    let ne=document.getElementById('nextBtn'+s);
    let nu=document.getElementById('pageNums'+s);
    if(pi) pi.textContent='Page '+currentPage+' of '+tp;
    if(pr) pr.disabled=currentPage<=1;
    if(ne) ne.disabled=currentPage>=tp;
    if(nu){ let h=''; for(let i=1;i<=Math.min(tp,10);i++){ h+=`<button class="pBtn" style="${i===currentPage?'background:#0f172a;color:#fff':''}" onclick="goPage(${i})">${i}</button>`; } nu.innerHTML=h; }
  });
}
function changePage(d){ let tp=Math.max(1,Math.ceil(filtered.length/pageSize)); currentPage+=d; if(currentPage<1) currentPage=1; if(currentPage>tp) currentPage=tp; renderAll(); }
function goPage(n){currentPage=n;renderAll();}
document.getElementById('searchTotal').addEventListener('input', e=>{
  let q=e.target.value.toLowerCase().trim();
  let box=document.getElementById('searchResults');
  if(q.length<1){box.classList.remove('open');return;}
  let res=masterPatients.filter(p=> `${p.name} ${p.shri} ${p.pmjayId}`.toLowerCase().includes(q)).slice(0,15);
  if(!res.length){box.innerHTML=`<div class="sItem">No patient found (loaded ${masterPatients.length})</div>`;box.classList.add('open');return;}
  box.innerHTML=res.map(p=>`<div class="sItem" onclick="openInlineBar('${p.shri}')"><div><div class="sName">${p.name}</div><div class="sMeta">SHRI: ${p.shri} | PMJAY: ${p.pmjayId}</div></div><div style="padding:5px 10px;background:#0f172a;color:#fff;border-radius:6px;font-size:10px;font-weight:800">ADD</div></div>`).join('');
  box.classList.add('open');
});
function openInlineBar(shri){
  selectedTotalPatient=masterPatients.find(x=>x.shri===shri);
  if(!selectedTotalPatient) return;
  document.getElementById('searchResults').classList.remove('open');
  document.getElementById('searchTotal').value='';
  document.getElementById('selPatientHead').textContent='Add Claim - '+selectedTotalPatient.name;
  document.getElementById('selPatientLabel').textContent=selectedTotalPatient.name+' • '+selectedTotalPatient.shri;
  document.getElementById('inlineClaimId').value=urlClaimId||'';
  document.getElementById('inlineDate').valueAsDate=new Date();
  document.getElementById('inlineTime').value='';
  document.getElementById('inlineBlock').value='';
  document.getElementById('inlineBar').classList.add('show');
  document.getElementById('inlineClaimId').focus();
}
function closeInlineBar(){document.getElementById('inlineBar').classList.remove('show');selectedTotalPatient=null;}
async function finalAddClaim(){
  let claimId=document.getElementById('inlineClaimId').value.trim().toUpperCase();
  let date=document.getElementById('inlineDate').value;
  let time=document.getElementById('inlineTime').value;
  let block=document.getElementById('inlineBlock').value;
  if(!selectedTotalPatient){alert('Select patient');return;}
  if(!claimId){alert('Enter Claim ID');return;}
  if(!date){alert('Select Date');return;}
  if(!time){alert('Select Time');return;}
  if(!block){alert('Select Block');return;}
  let docId=`${date}_${selectedTotalPatient.shri}_${Date.now()}`;
  try{
    await window._fb.setDoc(window._fb.doc(window._fb.db,'discharges',docId),{date,scheme:'PMJAY',shriId:selectedTotalPatient.shri,shri:selectedTotalPatient.shri,patientName:selectedTotalPatient.name,name:selectedTotalPatient.name,pmjayCmhtId:selectedTotalPatient.pmjayId,pmjayId:selectedTotalPatient.pmjayId,time,block,claimId,claimStatus:'CLAIMED',claimedAt:new Date().toISOString(),status:'DISCHARGE'});
    await window._fb.setDoc(window._fb.doc(window._fb.db,'claims',docId),{date,shriId:selectedTotalPatient.shri,shri:selectedTotalPatient.shri,patientName:selectedTotalPatient.name,name:selectedTotalPatient.name,pmjayCmhtId:selectedTotalPatient.pmjayId,pmjayId:selectedTotalPatient.pmjayId,time,block,claimId,claimStatus:'CLAIMED',claimedAt:new Date().toISOString()});
    closeInlineBar(); await loadAll();
  }catch(e){alert(e.message);}
}
// SAFE DELETE - ONLY FROM CLAIM
async function removeClaim(id){
  if(!confirm('Remove from CLAIM LIST only? Patient will STILL stay in TOTAL.html and Firebase. Continue?')) return;
  try{
    await window._fb.setDoc(window._fb.doc(window._fb.db,'discharges',id),{claimId:'',claimStatus:'',claimedAt:''},{merge:true});
    await window._fb.deleteDoc(window._fb.doc(window._fb.db,'claims',id));
    await loadAll();
  }catch(e){alert(e.message);}
}
async function editClaim(id){let p=allClaimed.find(x=>x._id===id); if(!p) return; let nid=prompt('EDIT CLAIM ID:',p.claimId); if(nid===null) return; nid=nid.trim().toUpperCase(); if(!nid) return; try{await window._fb.setDoc(window._fb.doc(window._fb.db,'discharges',id),{claimId:nid,claimedAt:new Date().toISOString(),claimStatus:'CLAIMED'},{merge:true});await window._fb.setDoc(window._fb.doc(window._fb.db,'claims',id),{...p,claimId:nid,claimedAt:new Date().toISOString(),claimStatus:'CLAIMED'},{merge:true});loadAll();}catch(e){alert(e.message);}}
document.getElementById('fSearch').addEventListener('input',applyFilter);
window.addEventListener('load', async ()=>{ urlClaimId=getClaimIdFromURL(); await loadMaster(); await loadAll(); });
</script>
