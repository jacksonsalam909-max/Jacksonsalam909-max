<style>

/* BIGGER GRID - NO GAPS */

.card{width:100% !important;height:230px !important;min-height:230px !important;max-height:230px !important;background:#fff;border-radius:18px !important;padding:16px 12px !important;display:flex !important;flex-direction:column !important;align-items:center !important;justify-content:space-between !important;text-align:center !important;box-shadow:0 8px 20px rgba(11,31,74,0.08);border:1px solid #e8eefb !important;border-left:5px solid #22c55e !important;overflow:hidden}

.btnComplete{width:100% !important;height:44px !important;min-height:44px !important;border-radius:12px !important;font-weight:900 !important;font-size:12px !important;cursor:pointer !important;display:flex !important;align-items:center !important;justify-content:center !important;background:linear-gradient(135deg,#0B1F4A,#12367F) !important;color:#ffffff !important;border:0 !important;box-shadow:0 6px 16px rgba(11,31,74,0.30) !important;letter-spacing:0.4px !important}
.grid.listView{display:flex !important;flex-direction:column !important;gap:12px !important}

.grid.listView .card .btnComplete{width:150px !important;min-width:150px !important;height:62px !important;border-radius:14px !important;font-size:14px !important}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:90;background:#fff;border-top:1px solid #dde4f0;display:flex;justify-content:space-around;padding:10px 0 16px}

.overlay{position:fixed;inset:0;background:rgba(11,31,74,0.55);z-index:9998;display:none}.overlay.show{display:block}

.drawerTop{background:linear-gradient(135deg,#0B1F4A,#12367F);padding:20px 16px;color:#fff}

#confirmModal{position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;background:rgba(11,31,74,0.55);backdrop-filter:blur(4px)}
#confirmModal.show{display:flex}
.confirmBox{background:#fff;width:90%;max-width:360px;border-radius:20px;padding:28px 22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.25);animation:pop .25s ease}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
.confirmTitle{font-size:20px;font-weight:900;color:#0B1F4A;margin-bottom:8px}
.confirmSub{font-size:14px;font-weight:700;color:#6f84a8;margin-bottom:22px;line-height:1.4}
.confirmBtns{display:flex;gap:12px}
.btnNoSure{flex:1;height:54px;border-radius:14px;border:2px solid #d0d9ea;background:#f4f7fd;color:#4a5f85;font-weight:900;font-size:14px;cursor:pointer}
.btnSure{flex:1;height:54px;border-radius:14px;border:0;background:#0B1F4A;color:#fff;font-weight:900;font-size:14px;cursor:pointer;box-shadow:0 6px 16px rgba(11,31,74,0.25)}
.swipeHint{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#0B1F4A;color:#fff;padding:8px 16px;border-radius:100px;font-size:11px;font-weight:800;z-index:80;opacity:0;pointer-events:none;transition:.3s}
.swipeHint.show{opacity:1}
</style>

<body>
<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
<div class="drawerTop"><div style="display:flex;justify-content:space-between;align-items:center"><div><b>SHIJA HOSPITALS</b></div><button id="closeDrawerBtn" style="width:48px;height:48px;border-radius:12px;border:0;background:rgba(255,255,255,0.22);color:#fff;font-size:24px;font-weight:900">✕</button></div><div style="margin-top:12px;display:flex;gap:8px"><div style="background:rgba(255,255,255,0.18);padding:8px 14px;border-radius:100px;font-size:11px">● ONLINE</div><div style="background:#fff;color:#0B1F4A;padding:8px 14px;border-radius:100px;font-size:11px;font-weight:800" id="drawerCount">0</div></div></div>
<div class="menuList"><div class="menuItem active" data-url="index.html">HOME</div><div class="menuItem" data-url="total.html">TOTAL PMJAY</div><div class="menuItem" data-url="cmht.html">TOTAL CMHT</div><div class="menuItem" data-url="searchpatient.html">SEARCH PATIENT</div><div class="menuItem" data-url="list.html">EXCEL LIST</div></div>
</div>
<div id="confirmModal"><div class="confirmBox"><div class="confirmTitle">Are you sure?</div><div class="confirmSub" id="confirmSub">Move this patient to completed list?</div><div class="confirmBtns"><button class="btnNoSure" id="btnNotSure">NOT SURE</button><button class="btnSure" id="btnSure">SURE</button></div></div></div>
<div class="swipeHint" id="swipeHint">Swipe ← → to change page</div>
<div class="top"><button class="menuBtn" id="menuBtn">☰</button><div class="hWrap"><div class="hTitle">SHIJA HOSPITALS</div><div class="hSub">DIALYSIS MANAGEMENT</div></div><div class="topActions"><button class="btnViewList" id="viewListBtn">VIEW LIST</button></div></div>
<div class="app">
<div style="background:linear-gradient(135deg,#0B1F4A,#12367F);padding:0 12px 14px"><div class="rowTop"><div class="dateBox"><input type="date" id="fDate"></div><div class="dateBox" style="max-width:130px"><select id="fType"><option>PMJAY</option><option>CMHT</option></select></div></div><div class="count"><span id="cLeft">Loading...</span><span id="cRight">PENDING 0</span></div></div>
<div class="filter"><div class="chipsWrap"><button class="chip on" data-time="">ALL</button><button class="chip" data-time="7:00 AM">7 AM</button><button class="chip" data-time="12:00 PM">12 PM</button><button class="chip" data-time="5:00 PM">5 PM</button><button class="chip" data-time="9:00 PM">9 PM</button><button class="chip" data-time="12:00 AM">12 AM</button><button class="chip" data-time="2:00 AM">2 AM</button></div><div class="timePager"><button class="pageBtnSmall" id="prevBtn">‹</button><div class="pageIndicatorSmall" id="pageIndicator">1/1</div><button class="pageBtnSmall" id="nextBtn">›</button></div></div>
<div class="searchBar"><div class="searchInputWrap"><input type="text" id="searchName" class="searchInput" placeholder="Search name or SHRI..."><button class="clearSearch" id="clearSearch">✕</button></div><select id="filterBlock" style="border:2px solid #d0d9ea;background:#f4f7fd;padding:0 18px;height:60px;border-radius:100px;font-weight:800;font-size:14px;color:#0B1F4A;min-width:130px"><option value="">All Block</option><option value="MAIN">MAIN</option><option value="ITOCHA">ITOCHA</option></select><button id="toggleViewBtn" class="viewIconSingle" title="Toggle Grid/List"></button></div>
<div class="searchMeta"><span id="searchInfo"></span><span>Swipe ← → • Click COMPLETE</span></div>
<div class="scroll" id="scroll"><div class="grid" id="grid"></div><div class="pagesBottom"></div></div>
<div class="bottom"><div class="tab active" id="tabHome"><div class="ic">⌂</div>Home</div><div class="tab" id="tabDone"><div class="ic">✓</div>Done <span id="doneB" style="background:#ef4444;color:#fff;padding:2px 6px;border-radius:100px;font-size:8px">0</span></div><div class="tab" id="tabSync"><div class="ic">↻</div>Sync</div></div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
(function(){
  const drawer=document.getElementById('drawer'),overlay=document.getElementById('overlay'),menuBtn=document.getElementById('menuBtn'),closeBtn=document.getElementById('closeDrawerBtn');
  function openMenu(e){if(e){e.preventDefault();e.stopPropagation();}drawer.classList.add('open');overlay.classList.add('show');document.body.style.overflow='hidden';}
  function closeMenu(e){if(e){e.preventDefault();e.stopPropagation();}drawer.classList.remove('open');overlay.classList.remove('show');document.body.style.overflow='';}
  function bindUniversal(el,fn){if(!el)return;el.addEventListener('click',fn);el.addEventListener('touchend',ev=>{ev.preventDefault();fn(ev);},{passive:false});}
  bindUniversal(menuBtn,openMenu);bindUniversal(closeBtn,closeMenu);bindUniversal(overlay,closeMenu);
  document.querySelectorAll('.menuItem').forEach(item=>{bindUniversal(item,()=>{let url=item.getAttribute('data-url');closeMenu();setTimeout(()=>{if(url)location.href=url;},250);});});
})();
function getTodayIST(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
document.getElementById('fDate').value=new URLSearchParams(location.search).get('date')||getTodayIST();
let allPatients=[],statusMap={},activeTimeFilter='',masterMap={},searchQuery='',isListView=false,currentPage=1,pendingShri=null;
if(localStorage.getItem('gda_view')==='list')isListView=true;
const gridIconSVG=`<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>`;
const listIconSVG=`<svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="4" rx="1"/><line x1="13" y1="6" x2="21" y2="6"/><rect x="3" y="10" width="7" height="4" rx="1"/><line x1="13" y1="12" x2="21" y2="12"/><rect x="3" y="16" width="7" height="4" rx="1"/><line x1="13" y1="18" x2="21" y2="18"/></svg>`;
function getPageSize(){return isListView?10:20;}
function normalizeTime(t){if(!t)return'';let s=String(t).toUpperCase().trim();let m=s.match(/(\d{1,2})(?::(\d{1,2}))?\s*([AP]M)?/);if(!m)return s;let h=parseInt(m[1]),mi=m[2]?m[2].padStart(2,'0'):'00',ap=m[3]||'';if(!ap){if(s.includes('AM'))ap='AM';else if(s.includes('PM'))ap='PM';}return ap?`${h}:${mi} ${ap}`:`${h}:${mi}`;}
async function buildMasterMap(){masterMap={};try{let snap=await db.collection('patients').get();snap.forEach(d=>{let p=d.data();if(p.deleted)return;let shri=String(p.shriId||p.shri||d.id||'').trim().toUpperCase();let name=String(p.patientName||p.name||'').trim().toUpperCase();if(!shri)return;masterMap[shri]={pmjayName:name,cmhtName:''};});}catch(e){}try{let snap2=await db.collection('cmht_patients').get();snap2.forEach(d=>{let p=d.data();if(p.deleted)return;let shri=String(p.shriId||p.shri||d.id||'').trim().toUpperCase();let name=String(p.patientName||p.name||'').trim().toUpperCase();if(!shri)return;if(!masterMap[shri])masterMap[shri]={pmjayName:'',cmhtName:''};masterMap[shri].cmhtName=name;});}catch(e){}}
function enrichPatient(p){let k=String(p.shri||'').trim().toUpperCase();let m=masterMap[k];if(!m)return p;let scheme=document.getElementById('fType').value;if(scheme==='PMJAY'){if(m.pmjayName)p.name=m.pmjayName;}else{if(m.cmhtName)p.name=m.cmhtName;}return p;}
async function loadData(){try{let d=document.getElementById('fDate').value,s=document.getElementById('fType').value,id=d+'_'+s;document.getElementById('cLeft').innerText="Loading...";await buildMasterMap();let snap=await db.collection('daily_dialysis_lists').doc(id).get();let patients=snap.exists?(snap.data().patients||[]):[];patients=patients.map((p,i)=>{let e=enrichPatient({...p});e.sl=i+1;return e;});allPatients=patients;let sSnap=await db.collection('daily_photo_opd').doc(id).get();statusMap=sSnap.exists?(sSnap.data().status||{}):{};if(allPatients.length===0){document.getElementById('grid').innerHTML=`<div style="text-align:center;padding:40px;background:#fff;border-radius:20px;color:#0B1F4A;font-weight:700">No data for ${d} ${s}</div>`;document.getElementById('cLeft').innerText=`0 patients`;return;}render();}catch(e){document.getElementById('cLeft').innerText="Error: "+(e.message||e);}}
async function saveStatus(){let d=document.getElementById('fDate').value,s=document.getElementById('fType').value,id=d+'_'+s;await db.collection('daily_photo_opd').doc(id).set({date:d,scheme:s,status:statusMap,updatedAt:new Date().toISOString()},{merge:true});}
function showConfirm(sh){pendingShri=sh;let p=allPatients.find(x=>String(x.shri||'').toUpperCase()===sh);document.getElementById('confirmSub').innerText=p?`Move ${p.name} (${sh}) to completed list?`:`Move ${sh} to completed?`;document.getElementById('confirmModal').classList.add('show');}
function hideConfirm(){document.getElementById('confirmModal').classList.remove('show');pendingShri=null;}
async function confirmSure(){if(!pendingShri)return;if(!statusMap[pendingShri])statusMap[pendingShri]={photoTaken:false,opdDone:false};statusMap[pendingShri].photoTaken=true;statusMap[pendingShri].opdDone=true;await saveStatus();let d=document.getElementById('fDate').value,t=document.getElementById('fType').value;location.href='gdacompleted.html?date='+encodeURIComponent(d)+'&type='+encodeURIComponent(t);}
function getInit(n){return(n||'A').charAt(0).toUpperCase();}
function getCol(name){const colors=['linear-gradient(135deg,#8B5CF6,#7C3AED)','linear-gradient(135deg,#3B82F6,#0EA5E9)','linear-gradient(135deg,#22C55E,#10B981)','linear-gradient(135deg,#F59E0B,#F97316)','linear-gradient(135deg,#EF4444,#EC4899)','linear-gradient(135deg,#06B6D4,#3B82F6)'];let h=0;for(let i=0;i<name.length;i++){h=name.charCodeAt(i)+((h<<5)-h);}return colors[Math.abs(h)%colors.length];}
function getFiltered(){let tn=normalizeTime(activeTimeFilter);let bf=document.getElementById('filterBlock').value;let sq=searchQuery.toLowerCase().trim();return allPatients.filter(p=>{let sh=String(p.shri||'').toUpperCase();if(!sh)return false;if(activeTimeFilter&&normalizeTime(p.time)!==tn)return false;if(bf&&p.block!==bf)return false;let st=statusMap[sh]||{photoTaken:false,opdDone:false};if(st.photoTaken&&st.opdDone)return false;if(sq){let nameL=String(p.name||'').toLowerCase();let shriL=sh.toLowerCase();if(!nameL.includes(sq)&&!shriL.includes(sq))return false;}return true;});}
function updateToggleBtn(){let b=document.getElementById('toggleViewBtn');if(b){b.innerHTML=isListView?gridIconSVG:listIconSVG;}}
function render(){
  let grid=document.getElementById('grid');if(!grid)return;
  grid.classList.toggle('listView',isListView);
  let filtered=getFiltered();let done=0;allPatients.forEach(p=>{let sh=String(p.shri||'').toUpperCase();let st=statusMap[sh];if(st&&st.photoTaken&&st.opdDone)done++;});
  let ps=getPageSize();let pages=Math.max(1,Math.ceil(filtered.length/ps));if(currentPage>pages)currentPage=pages;if(currentPage<1)currentPage=1;
  let items=filtered.slice((currentPage-1)*ps,currentPage*ps);grid.innerHTML='';
  items.forEach(p=>{
    let sh=String(p.shri||'').toUpperCase();
    let div=document.createElement('div');div.className='card';div.id='card_'+sh;
    div.innerHTML=`<div class="cardTop"><div class="avatarSq" style="background:${getCol(p.name)}">${getInit(p.name)}</div><div class="info"><div class="name">${p.name||''}</div><div class="sub">${p.time||''} • ${sh}</div></div></div><div class="actions"><button class="btnComplete" data-shri="${sh}">COMPLETE</button></div>`;
    grid.appendChild(div);
  });
  if(filtered.length===0){grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:40px;background:#fff;border-radius:20px;color:#0B1F4A;font-weight:700">All done ✓</div>`;}
  document.getElementById('pageIndicator').innerText=`${currentPage}/${pages}`;
  document.getElementById('prevBtn').disabled=currentPage<=1;
  document.getElementById('nextBtn').disabled=currentPage>=pages;
  document.getElementById('cLeft').innerText=`${allPatients.length} • ${done} done`;
  document.getElementById('cRight').innerText=`PENDING ${filtered.length}`;
  document.getElementById('doneB').innerText=done;
  document.getElementById('searchInfo').innerText=`${filtered.length} patients • ${currentPage}/${pages}`;
  document.getElementById('drawerCount').innerText=`${allPatients.length}`;
  updateToggleBtn();
  document.querySelectorAll('.btnComplete').forEach(btn=>{
    const h=(e)=>{e.preventDefault();e.stopPropagation();showConfirm(btn.getAttribute('data-shri'));};
    btn.addEventListener('click',h);btn.addEventListener('touchend',h,{passive:false});
  });
}
let startX=0,startY=0;const scrollEl=document.getElementById('scroll');
scrollEl.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;},{passive:true});
scrollEl.addEventListener('touchend',e=>{
  let endX=e.changedTouches[0].clientX;let endY=e.changedTouches[0].clientY;
  let diffX=endX-startX;let diffY=endY-startY;
  if(Math.abs(diffX)>Math.abs(diffY) && Math.abs(diffX)>80){
    if(diffX<0)goNextPage();else goPrevPage();
    let hint=document.getElementById('swipeHint');hint.classList.add('show');setTimeout(()=>hint.classList.remove('show'),1000);
  }
},{passive:true});
function goNextPage(){let ps=getPageSize();let pages=Math.max(1,Math.ceil(getFiltered().length/ps));if(currentPage<pages){currentPage++;render();window.scrollTo({top:0,behavior:'smooth'});}}
function goPrevPage(){if(currentPage>1){currentPage--;render();window.scrollTo({top:0,behavior:'smooth'});}}
function goToCompleted(){let d=document.getElementById('fDate').value,t=document.getElementById('fType').value;location.href='gdacompleted.html?date='+encodeURIComponent(d)+'&type='+encodeURIComponent(t);}
function addUniversal(el,fn){if(!el)return;el.addEventListener('click',fn);el.addEventListener('touchend',e=>{e.preventDefault();fn(e);},{passive:false});}
document.querySelectorAll('.chip').forEach(c=>{addUniversal(c,()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');activeTimeFilter=c.dataset.time;currentPage=1;render();});});
document.getElementById('filterBlock')?.addEventListener('change',()=>{currentPage=1;render();});
document.getElementById('fDate')?.addEventListener('change',loadData);
document.getElementById('fType')?.addEventListener('change',loadData);
addUniversal(document.getElementById('tabSync'),()=>location.reload());
addUniversal(document.getElementById('viewListBtn'),goToCompleted);
addUniversal(document.getElementById('tabDone'),goToCompleted);
addUniversal(document.getElementById('tabHome'),()=>location.href='index.html');
addUniversal(document.getElementById('toggleViewBtn'),()=>{isListView=!isListView;localStorage.setItem('gda_view',isListView?'list':'grid');currentPage=1;render();});
addUniversal(document.getElementById('prevBtn'),()=>goPrevPage());
addUniversal(document.getElementById('nextBtn'),()=>goNextPage());
addUniversal(document.getElementById('btnSure'),()=>confirmSure());
addUniversal(document.getElementById('btnNotSure'),()=>hideConfirm());
document.getElementById('confirmModal')?.addEventListener('click',e=>{if(e.target.id==='confirmModal')hideConfirm();});
const searchInput=document.getElementById('searchName');const clearBtn=document.getElementById('clearSearch');
searchInput?.addEventListener('input',e=>{searchQuery=e.target.value;if(clearBtn)clearBtn.style.display=searchQuery?'flex':'none';currentPage=1;render();});
addUniversal(clearBtn,()=>{searchInput.value='';searchQuery='';clearBtn.style.display='none';currentPage=1;render();});
window.addEventListener('resize',()=>render());
window.addEventListener('load',()=>{setTimeout(()=>{updateToggleBtn();loadData();},400);});
</script>
</body>
</html>
