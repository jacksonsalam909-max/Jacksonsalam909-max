<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SHIJA HOSPITALS - COMPLETED</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%;touch-action:pan-y}
body{background:#e9eef6;min-height:100dvh;display:flex;flex-direction:column}
button,.chip,.tab,.menuItem,.viewIconSingle,.pageBtnSmall{touch-action:manipulation;user-select:none}
.top{position:fixed;top:0;left:0;right:0;z-index:100;background:#0B1F4A;padding:8px 12px;color:#fff;display:flex;align-items:center;gap:10px;height:68px;justify-content:space-between}
.menuBtn{width:52px;height:52px;min-width:52px;border-radius:12px;border:0;background:rgba(255,255,255,0.18);color:#fff;font-size:24px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer}
.hWrap{flex:1;min-width:0}.hTitle{font-size:14px;font-weight:900;white-space:nowrap}.hSub{font-size:10px;opacity:0.8;white-space:nowrap}
.topTypeBox{background:#fff;border-radius:12px;height:48px;display:flex;align-items:center;padding:0 12px;min-width:110px}
.topTypeBox select{border:0;width:100%;font-weight:800;font-size:15px;outline:none;background:transparent;color:#0B1F4A;height:46px}
.app{padding-top:68px;display:flex;flex-direction:column;flex:1;width:100%}
.headerDark{background:#0B1F4A;padding:0 12px 14px}
.rowTop{display:flex;gap:10px;margin-top:10px}
.dateBox{flex:1;border-radius:14px;height:72px;display:flex;align-items:center;padding:0 16px;background:#fff;min-width:0}
.dateBox input,.dateBox select{border:0;width:100%;font-weight:800;font-size:18px;outline:none;background:transparent;color:#0B1F4A;height:70px;min-width:0}
.count{margin-top:12px;background:rgba(255,255,255,0.15);border-radius:14px;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:13px;font-weight:700;color:#fff;border:1px solid rgba(255,255,255,0.15)}
.count span:last-child{background:#fff;color:#0B1F4A;padding:8px 14px;border-radius:100px;font-size:12px;font-weight:800}
.filter{padding:10px 12px;display:flex;gap:10px;align-items:center;background:#fff;position:sticky;top:68px;z-index:10;border-bottom:1px solid #e2e8f0;height:84px;overflow:hidden}
.chipsWrap{display:flex;gap:12px;overflow-x:auto;flex:1;align-items:center;min-width:0}.chipsWrap::-webkit-scrollbar{display:none}
.chip{height:70px;padding:0 28px;border-radius:100px;border:2px solid #d0d9ea;background:#f4f7fd;font-weight:800;font-size:18px;white-space:nowrap;color:#4a5f85;flex-shrink:0;cursor:pointer}
.chip.on{background:#0B1F4A;color:#fff;border-color:#0B1F4A}
.searchBar{padding:10px 12px;display:flex;gap:10px;background:#fff;border-bottom:1px solid #e2e8f0;align-items:center;position:sticky;top:152px;z-index:9;height:90px}
.searchInputWrap{flex:1;position:relative;display:flex;align-items:center;min-width:0}
.searchInput{width:100%;height:70px;border:2px solid #d0d9ea;background:#f4f7fd;padding:0 20px;border-radius:100px;font-weight:700;font-size:19px;color:#0B1F4A;outline:none;min-width:0}
.clearSearch{position:absolute;right:10px;width:42px;height:42px;border-radius:50%;border:0;background:#dde4f0;display:none;align-items:center;justify-content:center}
.searchMeta{padding:8px 12px;background:#e9eef6;font-size:11px;font-weight:700;color:#5a7196;display:flex;justify-content:space-between;position:sticky;top:242px;z-index:8;height:36px;align-items:center}
.timePager{display:flex;align-items:center;gap:8px;flex-shrink:0;background:#f4f7fd;border:1.5px solid #d0d9ea;border-radius:100px;padding:6px 8px;height:70px;min-width:135px;justify-content:space-between}
.pageBtnSmall{height:56px;min-width:46px;padding:0 14px;border-radius:100px;border:0;background:#fff;color:#0B1F4A;font-weight:900;font-size:20px;box-shadow:0 2px 6px rgba(0,0,0,0.12);flex-shrink:0;cursor:pointer}
.pageIndicatorSmall{color:#0B1F4A;font-weight:900;font-size:16px;min-width:48px;text-align:center;flex-shrink:0}
.viewIconSingle{width:70px;height:70px;min-width:70px;border-radius:100px;border:2px solid #0B1F4A;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(11,31,74,0.15);flex-shrink:0}
.viewIconSingle svg{width:26px;height:26px;stroke:#0B1F4A;stroke-width:2.2;fill:none}
.scroll{flex:1;display:flex;flex-direction:column;background:#e9eef6;padding:12px}
.grid{display:grid !important;grid-template-columns:repeat(2,1fr) !important;gap:12px !important;width:100% !important;align-content:start !important}
.card{width:100% !important;height:260px !important;min-height:260px !important;background:#fff;border-radius:18px !important;padding:16px 12px !important;display:flex !important;flex-direction:column !important;align-items:center !important;justify-content:space-between !important;text-align:center !important;box-shadow:0 8px 20px rgba(11,31,74,0.08);border:1px solid #e8eefb !important;border-left:5px solid #16a34a !important;overflow:hidden}
.cardTop{display:flex !important;flex-direction:column !important;align-items:center !important;gap:12px !important;width:100% !important;flex:1}
.avatarSq{width:62px !important;height:62px !important;min-width:62px !important;border-radius:14px !important;display:flex !important;align-items:center !important;justify-content:center !important;color:#fff !important;font-weight:900 !important;font-size:26px !important}
.info{width:100% !important;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.card .name{font-size:26px !important;font-weight:900 !important;line-height:1.15 !important;color:#0B1F4A !important;text-transform:uppercase !important;text-align:center !important;min-height:44px !important;overflow:hidden !important;display:-webkit-box !important;-webkit-line-clamp:2 !important;-webkit-box-orient:vertical !important;word-break:break-word !important}
.card .sub{font-size:19px !important;font-weight:700 !important;color:#6f84a8 !important;text-align:center !important;margin-top:6px !important;white-space:nowrap !important;overflow:hidden !important;text-overflow:ellipsis !important;width:100% !important}
.actions{width:100% !important;margin-top:10px !important}
.btnUndo{width:100% !important;height:50px !important;min-height:50px !important;border-radius:12px !important;font-weight:900 !important;font-size:17px !important;cursor:pointer !important;display:flex !important;align-items:center !important;justify-content:center !important;background:#0B1F4A !important;color:#ffffff !important;border:0 !important;box-shadow:0 6px 16px rgba(11,31,74,0.30) !important}
.grid.listView{display:flex !important;flex-direction:column !important;gap:12px !important}
.grid.listView .card{height:150px !important;min-height:150px !important;flex-direction:row !important;padding:18px 20px !important;border-radius:20px !important;border-left:7px solid #16a34a !important;text-align:left !important}
.grid.listView .card .cardTop{flex-direction:row !important;gap:16px !important;text-align:left !important}
.grid.listView .card .info{align-items:flex-start !important;text-align:left !important}
.grid.listView .card .name{font-size:26px !important;text-align:left !important;min-height:auto !important;-webkit-line-clamp:1 !important}
.grid.listView .card .sub{font-size:19px !important;text-align:left !important}
.grid.listView .card .avatarSq{width:68px !important;height:68px !important;font-size:28px !important}
.grid.listView .card .actions{width:auto !important;min-width:160px;margin-left:16px;margin-top:0 !important}
.grid.listView .card .btnUndo{width:160px !important;min-width:160px !important;height:64px !important;border-radius:14px !important;font-size:17px !important}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:90;background:#fff;border-top:1px solid #dde4f0;display:flex;justify-content:space-around;padding:14px 0 20px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:800;color:#8aa0c5;cursor:pointer;min-height:68px;justify-content:center}
.tab.active{color:#0B1F4A}.tab .ic{width:46px;height:46px;border-radius:14px;background:#e8eefb;display:flex;align-items:center;justify-content:center;font-size:20px}
.tab.active .ic{background:#0B1F4A;color:#fff}
.pagesBottom{padding:20px 0 120px}
.overlay{position:fixed;inset:0;background:rgba(11,31,74,0.55);z-index:9998;display:none}.overlay.show{display:block}
.drawer{position:fixed;left:0;top:0;bottom:0;width:85%;max-width:320px;background:#fff;z-index:9999;transform:translateX(-100%);transition:0.35s;pointer-events:none;display:flex;flex-direction:column}.drawer.open{transform:translateX(0);pointer-events:auto}
.drawerTop{background:#0B1F4A;padding:20px 16px;color:#fff}
.menuList{padding:8px 0;flex:1;overflow-y:auto}
.menuItem{padding:20px 20px;font-size:14px;font-weight:800;color:#334155;cursor:pointer;border-left:4px solid transparent;min-height:56px;display:flex;align-items:center}
.menuItem.active{background:#e8eefb;color:#0B1F4A;border-left-color:#0B1F4A}
</style>
</head>
<body>
<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
<div class="drawerTop"><div style="display:flex;justify-content:space-between;align-items:center"><div><b>SHIJA HOSPITALS</b></div><button id="closeDrawerBtn" style="width:48px;height:48px;border-radius:12px;border:0;background:rgba(255,255,255,0.22);color:#fff;font-size:26px;font-weight:900">✕</button></div></div>
<div class="menuList"><div class="menuItem" data-url="index.html">HOME</div><div class="menuItem" data-url="gda.html">PENDING LIST</div><div class="menuItem active" data-url="gdacompleted.html">COMPLETED LIST</div></div>
</div>

<div class="top">
  <button class="menuBtn" id="menuBtn" type="button">☰</button>
  <div class="hWrap"><div class="hTitle">SHIJA HOSPITALS</div><div class="hSub">COMPLETED</div></div>
  <div class="topTypeBox"><select id="fType"><option>PMJAY</option><option>CMHT</option></select></div>
</div>

<div class="app">
<div class="headerDark">
  <div class="rowTop">
    <div class="dateBox"><input type="date" id="fDate"></div>
    <div class="dateBox" style="max-width:160px"><select id="filterBlock"><option value="">All Block</option><option value="MAIN">MAIN</option><option value="ITOCHA">ITOCHA</option></select></div>
  </div>
  <div class="count"><span id="cLeft">Loading...</span><span id="cRight">DONE 0</span></div>
</div>

<div class="filter">
  <div class="chipsWrap">
    <button class="chip on" data-time="">ALL</button>
    <button class="chip" data-time="7:00 AM">7 AM</button>
    <button class="chip" data-time="12:00 PM">12 PM</button>
    <button class="chip" data-time="5:00 PM">5 PM</button>
    <button class="chip" data-time="9:00 PM">9 PM</button>
    <button class="chip" data-time="12:00 AM">12 AM</button>
    <button class="chip" data-time="2:00 AM">2 AM</button>
  </div>
  <button id="toggleViewBtn" class="viewIconSingle"></button>
</div>

<div class="searchBar">
  <div class="searchInputWrap"><input type="text" id="searchName" class="searchInput" placeholder="Search completed..." autocomplete="off"><button class="clearSearch" id="clearSearch">✕</button></div>
  <div class="timePager"><button class="pageBtnSmall" id="prevBtn">‹</button><div class="pageIndicatorSmall" id="pageIndicator">1/1</div><button class="pageBtnSmall" id="nextBtn">›</button></div>
</div>

<div class="searchMeta"><span id="searchInfo"></span><span>Completed List</span></div>
<div class="scroll" id="scroll"><div class="grid" id="grid"></div><div class="pagesBottom"></div></div>
</div>

<div class="bottom"><div class="tab" id="tabHome"><div class="ic">⌂</div>HOME</div><div class="tab" id="tabPending"><div class="ic">↩</div>PENDING</div><div class="tab" id="tabSync"><div class="ic">↻</div>Refresh</div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,getDoc,setDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app=initializeApp(cfg,"gda_completed_"+Math.random());const db=getFirestore(app);window._fb={db,doc,getDoc,setDoc};
</script>
<script>
let params=new URLSearchParams(location.search);
document.getElementById('fDate').value=params.get('date')||new Date().toISOString().slice(0,10);
if(params.get('type')) document.getElementById('fType').value=params.get('type');
let allPatients=[],statusMap={},activeTimeFilter='',currentPage=1,searchQuery='',isListView=false;
const gridIconSVG=`<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>`;
const listIconSVG=`<svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="4" rx="1"/><line x1="13" y1="6" x2="21" y2="6"/><rect x="3" y="10" width="7" height="4" rx="1"/><line x1="13" y1="12" x2="21" y2="12"/><rect x="3" y="16" width="7" height="4" rx="1"/><line x1="13" y1="18" x2="21" y2="18"/></svg>`;
function getPageSize(){return isListView?10:20;}
function normalizeTime(t){if(!t)return'';let s=String(t).toUpperCase().trim();let m=s.match(/(\d{1,2})(?::(\d{1,2}))?\s*([AP]M)?/);if(!m)return s;let h=parseInt(m[1]),mi=m[2]?m[2].padStart(2,'0'):'00',ap=m[3]||'';if(!ap){if(s.includes('AM'))ap='AM';else if(s.includes('PM'))ap='PM';}return ap?`${h}:${mi} ${ap}`:`${h}:${mi}`;}
async function loadData(){let d=document.getElementById('fDate').value,s=document.getElementById('fType').value,id=d+'_'+s;let snap=await window._fb.getDoc(window._fb.doc(window._fb.db,'daily_dialysis_lists',id));allPatients=snap.exists()?(snap.data().patients||[]):[];let sSnap=await window._fb.getDoc(window._fb.doc(window._fb.db,'daily_photo_opd',id));statusMap=sSnap.exists()?(sSnap.data().status||{}):{};currentPage=1;render();}
async function saveStatus(){let d=document.getElementById('fDate').value,s=document.getElementById('fType').value,id=d+'_'+s;await window._fb.setDoc(window._fb.doc(window._fb.db,'daily_photo_opd',id),{date:d,scheme:s,status:statusMap,updatedAt:new Date().toISOString()});}
function bringBack(sh){if(statusMap[sh]){statusMap[sh].photoTaken=false;statusMap[sh].opdDone=false;}saveStatus();render();}
function getInit(n){return (n||'A').charAt(0).toUpperCase();}
function getCol(name){const colors=['linear-gradient(135deg,#8B5CF6,#6366F1)','linear-gradient(135deg,#F59E0B,#F97316)','linear-gradient(135deg,#10B981,#06B6D4)','linear-gradient(135deg,#EF4444,#EC4899)','linear-gradient(135deg,#3B82F6,#06B6D4)'];let hash=0;for(let i=0;i<name.length;i++){hash=name.charCodeAt(i)+((hash<<5)-hash);}return colors[Math.abs(hash)%colors.length];}
function getFilteredDone(){let tn=normalizeTime(activeTimeFilter);let bf=document.getElementById('filterBlock').value;let sq=searchQuery.toLowerCase().trim();return allPatients.filter(p=>{let sh=String(p.shri||'').toUpperCase();if(!sh)return false;if(activeTimeFilter&&normalizeTime(p.time)!==tn)return false;if(bf&&p.block!==bf)return false;let st=statusMap[sh]||{photoTaken:false,opdDone:false};if(!(st.photoTaken&&st.opdDone))return false;if(sq){let nameL=String(p.name||'').toLowerCase();let shriL=sh.toLowerCase();if(!nameL.includes(sq)&&!shriL.includes(sq))return false;}return true;});}
function updateToggleBtn(){let btn=document.getElementById('toggleViewBtn');if(btn){btn.innerHTML=isListView?gridIconSVG:listIconSVG;}}
function render(){let grid=document.getElementById('grid');grid.className='grid';if(isListView)grid.classList.add('listView');grid.innerHTML='';let filtered=getFilteredDone();let ps=getPageSize();let pages=Math.max(1,Math.ceil(filtered.length/ps));if(currentPage>pages)currentPage=pages;let items=filtered.slice((currentPage-1)*ps,currentPage*ps);items.forEach(p=>{let sh=String(p.shri||'').toUpperCase();let div=document.createElement('div');div.className='card';if(isListView)div.classList.add('listCard');div.innerHTML=`<div class="cardTop"><div class="avatarSq" style="background:${getCol(p.name)}">${getInit(p.name)}</div><div class="info"><div class="name">${p.name}</div><div class="sub">${p.time||''} • ${sh} • ✓ DONE</div></div></div><div class="actions"><button class="btnUndo" data-shri="${sh}">UNDO</button></div>`;grid.appendChild(div);});if(filtered.length===0){grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:40px;background:#fff;border-radius:16px;color:#0B1F4A;font-weight:700">No completed patients yet</div>`;}document.getElementById('pageIndicator').innerText=`${currentPage}/${pages}`;document.getElementById('prevBtn').disabled=currentPage<=1;document.getElementById('nextBtn').disabled=currentPage>=pages;let totalDone=allPatients.filter(p=>{let sh=String(p.shri||'').toUpperCase();let st=statusMap[sh];return st&&st.photoTaken&&st.opdDone;}).length;document.getElementById('cLeft').innerText=`${totalDone} COMPLETED • Showing ${filtered.length}`;document.getElementById('cRight').innerText=`DONE ${filtered.length}`;document.getElementById('searchInfo').innerText=`${filtered.length} patients • ${currentPage}/${pages}`;updateToggleBtn();document.querySelectorAll('.btnUndo').forEach(btn=>{const h=(e)=>{e.preventDefault();e.stopPropagation();bringBack(btn.getAttribute('data-shri'));};btn.addEventListener('click',h);btn.addEventListener('touchend',h,{passive:false});});}
function goNextPage(){let ps=getPageSize();let pages=Math.max(1,Math.ceil(getFilteredDone().length/ps));if(currentPage<pages){currentPage++;render();window.scrollTo({top:0,behavior:'smooth'});}}
function goPrevPage(){if(currentPage>1){currentPage--;render();window.scrollTo({top:0,behavior:'smooth'});}}
function goToPending(){let d=document.getElementById('fDate').value,t=document.getElementById('fType').value;location.href='gda.html?date='+encodeURIComponent(d)+'&type='+encodeURIComponent(t);}

(function(){
  const drawer=document.getElementById('drawer');const overlay=document.getElementById('overlay');const menuBtn=document.getElementById('menuBtn');const closeBtn=document.getElementById('closeDrawerBtn');
  function openMenu(e){if(e){e.preventDefault();e.stopPropagation();}drawer.classList.add('open');overlay.classList.add('show');}
  function closeMenu(e){if(e){e.preventDefault();e.stopPropagation();}drawer.classList.remove('open');overlay.classList.remove('show');}
  function bindUniversal(el,fn){if(!el)return;el.addEventListener('click',fn);el.addEventListener('touchend',function(ev){ev.preventDefault();fn(ev);},{passive:false});}
  bindUniversal(menuBtn,openMenu);bindUniversal(closeBtn,closeMenu);bindUniversal(overlay,closeMenu);
  document.querySelectorAll('.menuItem').forEach(item=>{bindUniversal(item,function(){let url=item.getAttribute('data-url');closeMenu();setTimeout(()=>{if(url)location.href=url;},200);});});
  function addUniversal(el,fn){if(!el)return;el.addEventListener('click',fn);el.addEventListener('touchend',(e)=>{e.preventDefault();fn(e);},{passive:false});}
  document.querySelectorAll('.chip').forEach(c=>{addUniversal(c,()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');activeTimeFilter=c.dataset.time;currentPage=1;render();});});
  addUniversal(document.getElementById('prevBtn'),()=>goPrevPage());
  addUniversal(document.getElementById('nextBtn'),()=>goNextPage());
  addUniversal(document.getElementById('tabPending'),()=>goToPending());
  addUniversal(document.getElementById('tabHome'),()=>location.href='index.html');
  addUniversal(document.getElementById('tabSync'),()=>location.reload());
  addUniversal(document.getElementById('toggleViewBtn'),()=>{isListView=!isListView;localStorage.setItem('gda_completed_view',isListView?'list':'grid');currentPage=1;render();});
  const searchInput=document.getElementById('searchName');const clearBtn=document.getElementById('clearSearch');
  searchInput.addEventListener('input',e=>{searchQuery=e.target.value;clearBtn.style.display=searchQuery?'flex':'none';currentPage=1;render();});
  addUniversal(clearBtn,()=>{searchInput.value='';searchQuery='';clearBtn.style.display='none';currentPage=1;render();});
  document.getElementById('fDate').addEventListener('change',loadData);
  document.getElementById('fType').addEventListener('change',loadData);
  document.getElementById('filterBlock').addEventListener('change',()=>{currentPage=1;render();});
})();

window.addEventListener('resize',()=>render());
window.addEventListener('load',()=>{let savedView=localStorage.getItem('gda_completed_view');if(savedView)isListView=(savedView==='list');updateToggleBtn();setTimeout(()=>loadData(),400);});
window.bringBack=bringBack;
</script>
</body>
</html>
