<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name=viewport content="width=device-width,initial-scale=1"><title>Bill</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{background:linear-gradient(135deg,#e0f2fe,#f0f9ff 40%,#fef3c7 100%);min-height:100vh}
.top{background:linear-gradient(90deg,#0f4c75,#1e7bb8,#0f4c75);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.box{max-width:900px;margin:20px auto;background:#fff;padding:20px;border-radius:16px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
input{padding:11px;border:1.5px solid #cbd5e1;border-radius:10px;width:100%;background:#f8fafc}
.btn{padding:11px 18px;border:0;border-radius:10px;background:linear-gradient(135deg,#0f4c75,#1e7bb8);color:#fff;font-weight:700;cursor:pointer}
.bill{max-width:800px;margin:20px auto;background:#fff;border:2px solid #0f4c75;border-radius:8px}
.bill-h{text-align:center;padding:8px;border-bottom:2px solid #0f4c75;background:#f8fafc}
.bill-i{display:flex;justify-content:space-between;padding:8px 12px;font-size:11px;border-bottom:1px solid #0f4c75}
.bill-t{width:100%;border-collapse:collapse}.bill-t th{background:#8b8b8b;font-size:10px;padding:4px;border:1px solid #000}.bill-t td{font-size:11px;padding:3px 6px;border:1px solid #000}
</style></head><body>
<div class="top"><a href="index.html" style="color:#fff;text-decoration:none;font-weight:800;background:rgba(255,255,255,.2);padding:8px 14px;border-radius:8px">← Home</a><h2>SHIJA Bill Generator</h2><div style="width:70px"></div></div>
<div class="box"><h3 style="color:#0f4c75;border-left:4px solid #ec4899;padding-left:10px">🧾 Bill Generator - Separate Page</h3><div class="grid"><input id="b_name" placeholder="Patient Name"><input id="b_shri" placeholder="SHRI ID"><input id="b_ip" placeholder="IP No"><input id="b_age" placeholder="Age/Sex" value="56Y/F"><input id="b_bed" placeholder="Bed No" value="D-3402"><input id="b_addr" placeholder="Address"><input type="date" id="b_date"><button class="btn" onclick="gen()">Generate Bill</button><button class="btn" style="background:#10b981" onclick="window.print()">Print</button></div>
<div class="bill" id="bill" style="margin-top:20px"><div class="bill-h"><h3>SHIJA HOSPITALS & RESEARCH INSTITUTE PVT LTD</h3><p style="font-size:10px">Langol, Imphal - Bill of Supply</p></div><div class="bill-i"><div>Name: <b id="o_name">-</b><br>Age/Sex: <b id="o_age">-</b><br>Bed: <b id="o_bed">-</b><br>SHRI: <b id="o_shri">-</b><br>IP: <b id="o_ip">-</b></div><div>Date: <b id="o_date">-</b><br>Bill No: <b id="o_bill">-</b></div></div><table class="bill-t"><tr><th>SL</th><th>ITEM</th><th>QTY</th><th>AMOUNT</th></tr><tr><td>1</td><td>Dialysis Session (4hrs)</td><td>1</td><td>Rs 2,660</td></tr></table></div></div>
<script>
function gen(){document.getElementById('o_name').textContent=document.getElementById('b_name').value;document.getElementById('o_shri').textContent=document.getElementById('b_shri').value;document.getElementById('o_ip').textContent=document.getElementById('b_ip').value;document.getElementById('o_age').textContent=document.getElementById('b_age').value;document.getElementById('o_bed').textContent=document.getElementById('b_bed').value;document.getElementById('o_date').textContent=document.getElementById('b_date').value;document.getElementById('o_bill').textContent='SHIJA-'+Math.floor(Math.random()*9000+1000);}
</script></body></html>
