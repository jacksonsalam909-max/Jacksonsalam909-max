<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>DISCHARGE PATIENT - SHIJA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f1f5f9}
.top{height:52px;background:#0a1931;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 10px;position:fixed;top:0;left:0;right:0;z-index:1000}
.btn{padding:6px 10px;border:0;border-radius:6px;font-weight:900;font-size:10px;cursor:pointer}
.btnDark{background:#0f172a;color:#fff}
.input{padding:7px 10px;border:1px solid #e2e8f0;border-radius:6px;font-weight:700;font-size:11px;background:#fff}
.content{max-width:1450px;margin:60px auto 0;padding:8px}
.card{background:#fff;border-radius:10px;padding:10px;margin-bottom:8px;border:1px solid #e2e8f0}
.sheetWrap{overflow:auto;border:1px solid #e2e8f0;background:#fff;max-height:80vh;border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:1000px;border:none}
th{position:sticky;top:0;background:#991b1b;color:#fff;padding:10px 6px;font-size:9px;text-align:center;border:none;z-index:2}
td{border:none;border-bottom:1px solid #f1f5f9;padding:8px 6px;height:44px;font-size:10px;font-weight:700;text-align:center;text-transform:uppercase;background:#fff}
td.nameCol{text-align:left;padding-left:10px;max-width:220px}
.nameInner{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.2;font-size:11px;word-break:break-word;text-align:left}
.menuBtn{font-size:22px;background:none;border:0;color:#fff;cursor:pointer}
.menuDrawer{position:fixed;top:52px;left:-300px;width:280px;height:calc(100vh - 52px);background:#fff;z-index:9999;transition:left .25s ease;overflow:auto;border-right:1px solid #e2e8f0}
.menuDrawer.open{left:0}
.menuItem{display:block;width:100%;padding:12px 16px;background:#fff;border:0;border-bottom:1px solid #f1f5f9;color:#334155;font-weight:700;font-size:12px;text-align:left;cursor:pointer}
.menuOverlay{position:fixed;top:52px;left:0;right:0;bottom:0;background:rgba(0,0,0,0.2);display:none;z-index:9998}
.menuOverlay.open{display:block}
.countBadge{background:#fee2e2;color:#991b1b;padding:5px 10px;border-radius:12px;font-weight:900;font-size:11px}
.clearBtn{height:32px;background:#0f172a;color:#fff;font-weight:900;font-size:10px;padding:6px 14px;border-radius:6px;border:0;cursor:pointer}
.btnRestore{background:#10b981;color:#fff;padding:6px 10px;border-radius:5px;border:0;font-weight:900;font-size:9px;cursor:pointer}
.btnDel{background:#ef4444;color:#fff;padding:6px 10px;border-radius:5px;border:0;font-weight:900;font-size:9px;cursor:pointer}
</style>
</head>
<body>
<script>if(localStorage.getItem('shija_logged')!=='1'){location.href='login.html'}</script>
<div class="top"><div style="display:flex;align-items:center;gap:8px"><button class="menuBtn" id="menuBtn">☰</button><div style="font-weight:900;font-size:13px">DISCHARGE PATIENT</div><div class="countBadge" id="count">0 DISCHARGED</div></div><div style="font-weight:800;font-size:10px">SHIJA DIALYSIS</div></div>
<div class="menuOverlay" id="menuOverlay"></div>
<div class="menuDrawer" id="menuDrawer"><div style="font-weight:900;padding:12px 14px;background:#0a1931;color:#fff">MENU</div>
<button class="menuItem" onclick="location.href='index.html'">HOME</button>
<button class="menuItem" onclick="location.href='total.html'">TOTAL PATIENT</button>
<button class="menuItem" onclick="location.href='cmht.html'">CMHT TOTAL PATIENT</button>
<button class="menuItem" onclick="location.href='list.html?scheme=CMHT&force=1'">CMHT DAILY DIALYSIS</button>
<button class="menuItem" onclick="location.href='list.html?scheme=PMJAY&force=1'">PMJAY DAILY DIALYSIS</button>
<button class="menuItem" style="background:#fee2e2;color:#991b1b" onclick="location.href='discharge.html'">DISCHARGE PATIENT</button>
<button class="menuItem" onclick="location.href='bill.html'">BILL</button>
</div>

<div class="content">
<div class="card">
<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:end">
<div><label style="font-size:8px;font-weight:800">DATE</label><br><input type="date" id="fDate" class="input"></div>
<div><label style="font-size:8px;font-weight:800">SCHEME</label><br><select id="fScheme" class="input"><option value="">ALL</option><option value="PMJAY">PMJAY</option><option value="CMHT">CMHT</option></select></div>
<div><label style="font-size:8px;font-weight:800">SEARCH</label><br><input type="text" id="fSearch" class="input" placeholder="NAME / SHRI / ID" style="min-width:200px"></div>
<button class="clearBtn" onclick="clearFilter()">CLEAR FILTER</button>
<button class="btn btnDark" style="margin-left:auto;height:32px" onclick="loadDischarge()">REFRESH</button>
</div>
<div id="info" style="font-size:10px;font-weight:800;margin-top:8px;background:#fffbeb;padding:6px;border-radius:6px;border:1px solid #fde68a">Only patients you selected DISCHARGE in list.html will appear here</div>
</div>

<div class="card" style="padding:6px">
<div class="sheetWrap"><table><thead><tr><th style="width:35px">SL</th><th style="width:85px">DATE</th><th style="width:90px">PMJAY/CMHT ID</th><th style="width:220px">PATIENT NAME</th><th style="width:120px">STATUS</th><th style="width:85px">SHRI ID</th><th style="width:70px">TIME</th><th style="width:70px">BLOCK</th><th style="width:100px">DISCHARGED AT</th><th style="width:110px">ACTION</th></tr></thead><tbody id="tbody"><tr><td colspan="10" style="padding:20px">LOADING...</td></tr></tbody></table></div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, deleteDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app=initializeApp(firebaseConfig,"discharge_"+Math.random());
const db=getFirestore(app);
window._fb={db,collection,getDocs,doc,deleteDoc,setDoc};
</script>

<script>
let allDischarge=[],filtered=[];
const menuBtn=document.getElementById('menuBtn'),menuDrawer=document.getElementById('menuDrawer'),menuOverlay=document.getElementById('menuOverlay');
function toggleMenu(){menuDrawer.classList.toggle('open');menuOverlay.classList.toggle('open');}
function closeMenu(){menuDrawer.classList.remove('open');menuOverlay.classList.remove('open');}
menuBtn.addEventListener('click', toggleMenu);menuOverlay.addEventListener('click', closeMenu);

function getTodayIST(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

async function loadDischarge(){
  document.getElementById('tbody').innerHTML=`<tr><td colspan="10" style="padding:20px;text-align:center">LOADING...</td></tr>`;
  try{
    let snap=await window._fb.getDocs(window._fb.collection(window._fb.db,'discharges'));
    allDischarge=[];
    snap.forEach(s=>{
      let d=s.data();
      d._id=s.id;
      allDischarge.push(d);
    });
    // newest first
    allDischarge.sort((a,b)=> new Date(b.dischargedAt||0) - new Date(a.dischargedAt||0));
    applyFilter();
  }catch(e){
    document.getElementById('tbody').innerHTML=`<tr><td colspan="10" style="padding:20px;color:red">ERROR: ${e.message}</td></tr>`;
  }
}

function applyFilter(){
  let date=document.getElementById('fDate').value;
  let scheme=document.getElementById('fScheme').value;
  let search=document.getElementById('fSearch').value.toLowerCase().trim();
  filtered=allDischarge.filter(p=>{
    if(date && p.date!==date) return false;
    if(scheme && p.scheme!==scheme) return false;
    if(search){
      let str=`${p.patientName||p.name||''} ${p.shriId||p.shri||''} ${p.pmjayCmhtId||''}`.toLowerCase();
      if(!str.includes(search)) return false;
    }
    return true;
  });
  renderTable();
}

function renderTable(){
  let tbody=document.getElementById('tbody');tbody.innerHTML='';
  document.getElementById('count').innerText=`${filtered.length} DISCHARGED`;
  if(filtered.length===0){
    tbody.innerHTML=`<tr><td colspan="10" style="padding:20px;text-align:center">NO DISCHARGED PATIENT - Select DISCHARGE in list.html</td></tr>`;
    return;
  }
  filtered.forEach((p,i)=>{
    let t='';try{t=new Date(p.dischargedAt).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}catch(e){t=p.dischargedAt||''}
    let tr=document.createElement('tr');
    tr.innerHTML=`<td>${i+1}</td><td>${p.date||''}</td><td>${p.pmjayCmhtId||''}</td><td class="nameCol"><div class="nameInner">${p.patientName||p.name||''}</div></td><td style="background:#fee2e2;color:#991b1b;font-weight:900;border-radius:4px">${p.status||'DISCHARGE'}</td><td>${p.shriId||p.shri||''}</td><td>${p.time||''}</td><td>${p.block||''}</td><td style="font-size:9px">${t}</td><td><div style="display:flex;gap:4px;justify-content:center"><button class="btnDel" onclick="deleteOne('${p._id}')">DELETE</button></div></td>`;
    tbody.appendChild(tr);
  });
}

async function deleteOne(id){
  if(!confirm('DELETE THIS DISCHARGE RECORD?'))return;
  try{await window._fb.deleteDoc(window._fb.doc(window._fb.db,'discharges',id));loadDischarge();}catch(e){alert(e.message)}
}

function clearFilter(){document.getElementById('fDate').value='';document.getElementById('fScheme').value='';document.getElementById('fSearch').value='';applyFilter();}

document.getElementById('fDate').addEventListener('change', applyFilter);
document.getElementById('fScheme').addEventListener('change', applyFilter);
document.getElementById('fSearch').addEventListener('input', applyFilter);
window.addEventListener('load', ()=>{document.getElementById('fDate').value='';loadDischarge();});
</script>
</body>
</html>
