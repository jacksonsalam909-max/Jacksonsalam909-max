<script>
var allPatients=[],filtered=[],currentPage=1,pageSize=18,lastOpenCleanShri=null,isGrid=false;
const CHUNK_SIZE=800000;
function getDocsForShri(shri){return window._fb._docsCache[shri]||[];}

function setView(mode){
  isGrid=(mode==='grid');
  var tableWrap=document.getElementById('tableWrap');
  var gridWrap=document.getElementById('gridWrap');
  var btnList=document.getElementById('btnList');
  var btnGrid=document.getElementById('btnGrid');
  if(isGrid){
    tableWrap.style.display='none';
    gridWrap.classList.add('show');
    btnGrid.classList.add('active'); btnList.classList.remove('active');
    pageSize=18;
  }else{
    tableWrap.style.display='block';
    gridWrap.classList.remove('show');
    btnList.classList.add('active'); btnGrid.classList.remove('active');
    pageSize=20;
  }
  currentPage=1; render();
}

async function loadMaster(){
  allPatients=[]; var map={};
  function addToMap(raw){var shri=String(raw.shri||raw.shriId||'').trim().toUpperCase();var name=String(raw.name||raw.patientName||'').trim().toUpperCase();var pmjay=String(raw.pmjay||raw.pmjayId||'').trim().toUpperCase();if(!shri)return false;if(map[shri])return false;map[shri]={shri:shri,name:name||'UNKNOWN',pmjayId:pmjay};return true;}
  try{if(typeof patientData!=='undefined'&&Array.isArray(patientData)){patientData.forEach(function(r){addToMap(r);});}}catch(e){}
  try{if(window._fb){var snap=await window._fb.getDocs(window._fb.collection(window._fb.db,"patients"));snap.forEach(function(d){addToMap(d.data());});}}catch(e){}
  Object.keys(map).forEach(function(k){allPatients.push(map[k]);});
  try{var snap2=await window._fb.getDocs(window._fb.collection(window._fb.db,"patient_docs"));snap2.forEach(function(d){var data=d.data();data._id=d.id;if(!window._fb._docsCache[data.shri])window._fb._docsCache[data.shri]=[];window._fb._docsCache[data.shri].push(data);});}catch(e){}
  filtered=allPatients.slice(); render();
}
function applyFilter(){var q=document.getElementById('fSearch').value.toLowerCase().trim();if(!q){filtered=allPatients.slice();}else{filtered=allPatients.filter(function(p){return (p.name+' '+p.shri+' '+p.pmjayId).toLowerCase().indexOf(q)!==-1;});}currentPage=1;render();}
function render(){
  var tbody=document.getElementById('tbody');
  var gridWrap=document.getElementById('gridWrap');
  if(!tbody||!gridWrap) return;
  tbody.innerHTML=''; gridWrap.innerHTML='';
  var totalPages=Math.max(1,Math.ceil(filtered.length/pageSize));
  if(currentPage>totalPages)currentPage=totalPages;
  var start=(currentPage-1)*pageSize; var page=filtered.slice(start,start+pageSize);
  document.getElementById('badgeD').innerText=filtered.length+' Patients';
  document.getElementById('pageInfo').innerText='Page '+currentPage+' of '+totalPages;
  if(page.length===0){
    tbody.innerHTML='<tr><td colspan="5" style="padding:20px">NO PATIENTS</td></tr>';
    gridWrap.innerHTML='<div style="padding:20px;grid-column:1/-1;text-align:center">NO PATIENTS</div>';
    return;
  }

  // LIST VIEW - TABLE
  page.forEach(function(p,i){
    var docs=getDocsForShri(p.shri);
    var mapCount={discharge_summary:0,discharge_photo:0,feedback_form:0};
    docs.forEach(function(d){if(mapCount.hasOwnProperty(d.type))mapCount[d.type]++;});
    var totalUp=mapCount.discharge_summary+mapCount.discharge_photo+mapCount.feedback_form;
    var cleanShri=p.shri.replace(/[^a-zA-Z0-9]/g,'_');
    var tr=document.createElement('tr');tr.className='mainRow';tr.id='tr_'+cleanShri;
    tr.setAttribute('onclick','toggleSlide(\''+cleanShri+'\')');
    tr.innerHTML='<td>'+(start+i+1)+'</td><td class="nameCol">'+p.name+'</td><td><span class="shriGray">'+p.shri+'</span></td><td><span class="pmjayBlue">'+p.pmjayId+'</span></td><td><button class="'+(totalUp>0?'uploadBtn done':'uploadBtn')+'">'+(totalUp>0?'✓ '+totalUp+' UPLOADED ▼':'UPLOAD ▼')+'</button></td>';
    tbody.appendChild(tr);
    var slideTr=document.createElement('tr');slideTr.className='slideRow';slideTr.id='slide_'+cleanShri;
    slideTr.innerHTML='<td colspan="5" class="slideCell"><div class="slideInner"><div class="horizontalBtns">'
      +'<div class="cardWrap"><div class="hCard summary '+(mapCount.discharge_summary?'done':'')+'" onclick="event.stopPropagation();triggerUpload(\''+cleanShri+'\',\'discharge_summary\',\''+p.shri+'\')"><b>DISCHARGE SUMMARY</b><div class="sub">'+(mapCount.discharge_summary?'✓ UPLOADED - Click to View':'Click to Upload / Drag & Drop')+'</div></div>'+(mapCount.discharge_summary?'<div class="delNextToCard" onclick="event.stopPropagation();deleteSpecific(\''+p.shri+'\',\'discharge_summary\')">X</div>':'')+'</div>'
      +'<div class="cardWrap"><div class="hCard photo '+(mapCount.discharge_photo?'done':'')+'" onclick="event.stopPropagation();triggerUpload(\''+cleanShri+'\',\'discharge_photo\',\''+p.shri+'\')"><b>DISCHARGE PHOTO</b><div class="sub">'+(mapCount.discharge_photo?'✓ UPLOADED - Click to View':'Click to Upload / Drag & Drop')+'</div></div>'+(mapCount.discharge_photo?'<div class="delNextToCard" onclick="event.stopPropagation();deleteSpecific(\''+p.shri+'\',\'discharge_photo\')">X</div>':'')+'</div>'
      +'<div class="cardWrap"><div class="hCard feedback '+(mapCount.feedback_form?'done':'')+'" onclick="event.stopPropagation();triggerUpload(\''+cleanShri+'\',\'feedback_form\',\''+p.shri+'\')"><b>FEEDBACK FORM</b><div class="sub">'+(mapCount.feedback_form?'✓ UPLOADED - Click to View':'Click to Upload / Drag & Drop')+'</div></div>'+(mapCount.feedback_form?'<div class="delNextToCard" onclick="event.stopPropagation();deleteSpecific(\''+p.shri+'\',\'feedback_form\')">X</div>':'')+'</div>'
      +'</div><input type="file" id="file_'+cleanShri+'_discharge_summary" style="display:none" accept="*/*" onchange="uploadFile(this.files[0],\''+p.shri+'\',\''+p.name.replace(/\'/g,"\\'")+'\',\''+p.pmjayId+'\',\'discharge_summary\')"><input type="file" id="file_'+cleanShri+'_discharge_photo" style="display:none" accept="*/*" onchange="uploadFile(this.files[0],\''+p.shri+'\',\''+p.name.replace(/\'/g,"\\'")+'\',\''+p.pmjayId+'\',\'discharge_photo\')"><input type="file" id="file_'+cleanShri+'_feedback_form" style="display:none" accept="*/*" onchange="uploadFile(this.files[0],\''+p.shri+'\',\''+p.name.replace(/\'/g,"\\'")+'\',\''+p.pmjayId+'\',\'feedback_form\')"></div></td>';
    tbody.appendChild(slideTr);
  });

  // GRID VIEW - CARDS
  page.forEach(function(p,i){
    var docs=getDocsForShri(p.shri);
    var mapCount={discharge_summary:0,discharge_photo:0,feedback_form:0};
    docs.forEach(function(d){if(mapCount.hasOwnProperty(d.type))mapCount[d.type]++;});
    var totalUp=mapCount.discharge_summary+mapCount.discharge_photo+mapCount.feedback_form;
    var cleanShri=p.shri.replace(/[^a-zA-Z0-9]/g,'_');
    var isOpen=(lastOpenCleanShri===cleanShri);
    var gc=document.createElement('div');gc.className='gridCard'+(isOpen?' openCard':'');
    gc.id='grid_'+cleanShri;
    gc.innerHTML='<div onclick="toggleSlide(\''+cleanShri+'\')"><div class="gridName">'+p.name+'</div><div class="gridMeta"><span class="shriGray">'+p.shri+'</span><span class="pmjayBlue">'+p.pmjayId+'</span><span class="uploadBtn '+(totalUp>0?'done':'')+'" style="pointer-events:none;min-width:auto;padding:4px 8px;font-size:8px;border-radius:12px">'+(totalUp>0?'✓ '+totalUp:'0')+'</span></div></div>'
      +'<div class="gridDocs" id="gridDocs_'+cleanShri+'" style="display:'+(isOpen?'block':'none')+'"><div class="horizontalBtns">'
      +'<div class="cardWrap"><div class="hCard summary '+(mapCount.discharge_summary?'done':'')+'" onclick="event.stopPropagation();triggerUpload(\''+cleanShri+'\',\'discharge_summary\',\''+p.shri+'\')"><b>DISCHARGE SUMMARY</b><div class="sub">'+(mapCount.discharge_summary?'✓ UPLOADED':'Upload')+'</div></div>'+(mapCount.discharge_summary?'<div class="delNextToCard" onclick="event.stopPropagation();deleteSpecific(\''+p.shri+'\',\'discharge_summary\')">X</div>':'')+'</div>'
      +'<div class="cardWrap"><div class="hCard photo '+(mapCount.discharge_photo?'done':'')+'" onclick="event.stopPropagation();triggerUpload(\''+cleanShri+'\',\'discharge_photo\',\''+p.shri+'\')"><b>DISCHARGE PHOTO</b><div class="sub">'+(mapCount.discharge_photo?'✓ UPLOADED':'Upload')+'</div></div>'+(mapCount.discharge_photo?'<div class="delNextToCard" onclick="event.stopPropagation();deleteSpecific(\''+p.shri+'\',\'discharge_photo\')">X</div>':'')+'</div>'
      +'<div class="cardWrap"><div class="hCard feedback '+(mapCount.feedback_form?'done':'')+'" onclick="event.stopPropagation();triggerUpload(\''+cleanShri+'\',\'feedback_form\',\''+p.shri+'\')"><b>FEEDBACK FORM</b><div class="sub">'+(mapCount.feedback_form?'✓ UPLOADED':'Upload')+'</div></div>'+(mapCount.feedback_form?'<div class="delNextToCard" onclick="event.stopPropagation();deleteSpecific(\''+p.shri+'\',\'feedback_form\')">X</div>':'')+'</div>'
      +'</div></div>';
    gridWrap.appendChild(gc);
  });

  if(lastOpenCleanShri){
    var s=document.getElementById('slide_'+lastOpenCleanShri);
    var r=document.getElementById('tr_'+lastOpenCleanShri);
    if(s)s.classList.add('show');
    if(r)r.classList.add('openRow');
    var gs=document.getElementById('gridDocs_'+lastOpenCleanShri);
    if(gs)gs.style.display='block';
  }
}
function changePage(d){var tp=Math.max(1,Math.ceil(filtered.length/pageSize));currentPage+=d;if(currentPage<1)currentPage=1;if(currentPage>tp)currentPage=tp;render();}
function toggleSlide(cleanShri){
  var slide=document.getElementById('slide_'+cleanShri);
  var row=document.getElementById('tr_'+cleanShri);
  var isShow=slide && slide.classList.contains('show');
  document.querySelectorAll('.slideRow').forEach(function(r){r.classList.remove('show');});
  document.querySelectorAll('.mainRow').forEach(function(r){r.classList.remove('openRow');});
  document.querySelectorAll('.gridDocs').forEach(function(r){r.style.display='none';});
  document.querySelectorAll('.gridCard').forEach(function(r){r.classList.remove('openCard');});
  if(!isShow){
    if(slide)slide.classList.add('show');
    if(row)row.classList.add('openRow');
    var gs=document.getElementById('gridDocs_'+cleanShri);
    var gc=document.getElementById('grid_'+cleanShri);
    if(gs)gs.style.display='block';
    if(gc)gc.classList.add('openCard');
    lastOpenCleanShri=cleanShri;
  }else{
    lastOpenCleanShri=null;
  }
}
function triggerUpload(cleanShri,type,shri){lastOpenCleanShri=cleanShri;var docs=getDocsForShri(shri).filter(function(d){return d.type===type;});if(docs.length>0){openFileModal(docs[0]._id,shri);}else{document.getElementById('file_'+cleanShri+'_'+type).click();}}
async function uploadFile(file,shri,name,pmjay,type){if(!file)return;if(file.size>10*1024*1024){alert('Max 10MB');return;}var cleanShri=shri.replace(/[^a-zA-Z0-9]/g,'_');lastOpenCleanShri=cleanShri;var base64=await new Promise(function(res){var r=new FileReader();r.onload=function(){res(r.result);};r.readAsDataURL(file);});var id=cleanShri+'_'+type+'_'+Date.now();try{var chunks=[];for(var i=0;i<base64.length;i+=CHUNK_SIZE){chunks.push(base64.substring(i,i+CHUNK_SIZE));}await window._fb.setDoc(window._fb.doc(window._fb.db,'patient_docs',id),{type:type,shri:shri,cleanShri:cleanShri,patientName:name,ip:pmjay,fileName:file.name,fileType:file.type||'application/octet-stream',size:file.size,chunkCount:chunks.length,createdAt:Date.now()});for(var j=0;j<chunks.length;j++){await window._fb.setDoc(window._fb.doc(window._fb.db,'patient_docs',id,'chunks',String(j)),{index:j,data:chunks[j]});}if(!window._fb._docsCache[shri])window._fb._docsCache[shri]=[];window._fb._docsCache[shri].push({_id:id,type:type,shri:shri,fileName:file.name});render();}catch(e){}}
async function getFullData(id){try{var snap=await window._fb.getDocs(window._fb.collection(window._fb.db,'patient_docs',id,'chunks'));var arr=[];snap.forEach(function(d){arr.push(d.data());});arr.sort(function(a,b){return a.index-b.index;});return arr.map(function(a){return a.data;}).join('');}catch(e){return null;}}
async function openFileModal(id,shri){window._fb._currentZoom=1;var cleanShri=shri.replace(/[^a-zA-Z0-9]/g,'_');lastOpenCleanShri=cleanShri;var snap=await window._fb.getDocs(window._fb.collection(window._fb.db,'patient_docs'));var meta=null;snap.forEach(function(d){if(d.id===id)meta=d.data();});if(!meta)return;var data=await getFullData(id);if(!data)return;document.getElementById('modalFileName').textContent=meta.fileName;document.getElementById('modalFileMeta').textContent=(meta.fileType.includes('pdf')?'PDF':'FILE')+' • '+(meta.size/1024/1024).toFixed(2)+' MB';var box=document.getElementById('paperBox');if(data.startsWith('data:application/pdf')){box.innerHTML='<iframe src="'+data+'"></iframe>';}else if(data.startsWith('data:image')){box.innerHTML='<img src="'+data+'">';}else{box.innerHTML='<div style="padding:20px;text-align:center"><b>'+meta.fileName+'</b></div>';}applyZoom();document.getElementById('fileModal').classList.add('show');document.getElementById('modalDelBtn').onclick=async function(){await delDoc(id,shri);closeModal();};document.getElementById('modalDownBtn').onclick=function(){var a=document.createElement('a');a.href=data;a.download=meta.fileName;a.click();};}
function zoomIn(){window._fb._currentZoom=Math.min(window._fb._currentZoom+0.25,3);applyZoom();}
function zoomOut(){window._fb._currentZoom=Math.max(window._fb._currentZoom-0.25,0.5);applyZoom();}
function resetZoom(){window._fb._currentZoom=1;applyZoom();}
function applyZoom(){var box=document.getElementById('paperBox');if(box)box.style.transform='scale('+window._fb._currentZoom+')';document.getElementById('zoomLabel').textContent=Math.round(window._fb._currentZoom*100)+'%';}
function closeModal(){document.getElementById('fileModal').classList.remove('show');}
async function delDoc(id,shri){var cleanShri=shri.replace(/[^a-zA-Z0-9]/g,'_');lastOpenCleanShri=cleanShri;var csnap=await window._fb.getDocs(window._fb.collection(window._fb.db,'patient_docs',id,'chunks'));for(var d of csnap.docs){await window._fb.deleteDoc(window._fb.doc(window._fb.db,'patient_docs',id,'chunks',d.id));}await window._fb.deleteDoc(window._fb.doc(window._fb.db,'patient_docs',id));if(window._fb._docsCache[shri]){window._fb._docsCache[shri]=window._fb._docsCache[shri].filter(function(d){return d._id!==id;});}render();}
async function deleteSpecific(shri,type){var docs=getDocsForShri(shri).filter(function(d){return d.type===type;});if(docs.length===0)return;var cleanShri=shri.replace(/[^a-zA-Z0-9]/g,'_');lastOpenCleanShri=cleanShri;await delDoc(docs[0]._id,shri);}
window.addEventListener('load',function(){try{if(localStorage.getItem('shija_menu_folded')==='1'){document.getElementById('whiteBar').classList.add('folded');}}catch(e){}setTimeout(function(){loadMaster();},800);document.getElementById('fSearch').addEventListener('input',applyFilter);});
</script>
