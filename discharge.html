<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SHIJA - Discharge (Auto Sync All PCs)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f5f5}
.top{height:46px;background:#0a1931;color:#fff;display:flex;align-items:center;gap:10px;padding:0 10px;position:fixed;top:0;left:0;right:0;z-index:1000}
.content{max-width:1300px;margin:52px auto 0;padding:6px}
.card{background:#fffbeb;background:linear-gradient(#fff8dc,#ffecb3);border-radius:6px;padding:10px;margin-bottom:8px;border:1px solid #f5d76e}
.label{font-size:7px;font-weight:900;color:#000;letter-spacing:0.5px}
.input,select{width:100%;padding:6px 8px;border:1px solid #cbd5e1;border-radius:4px;font-weight:700;font-size:11px;background:#fff}
.btn{padding:5px 12px;border:0;border-radius:4px;font-weight:900;font-size:10px;cursor:pointer}
.btnBlue{background:#0b5ed7;color:#fff}
.btnDark{background:#0f172a;color:#fff}
.badge{background:#0a1931;color:#fff;padding:6px 12px;border-radius:6px;font-weight:900;font-size:11px;display:inline-block}
.badgeBlue{background:#0b5ed7;color:#fff;padding:5px 12px;border-radius:5px;font-weight:900;font-size:10px;cursor:pointer}
.sheetWrap{background:#fff;border:1px solid #e2e8f0;overflow:auto;max-height:75vh;border-radius:4px}
table{border-collapse:collapse;width:100%;min-width:900px}
th{background:#fff3cd;color:#000;padding:8px 6px;font-size:9px;font-weight:900;text-align:left;border-bottom:2px solid #f5d76e;position:sticky;top:0;z-index:2}
td{padding:7px 6px;font-size:10px;font-weight:700;border-bottom:1px solid #f1f5f9;text-transform:uppercase;background:#fff}
td.id{color:#0b5ed7;font-weight:900}
.actionWrap{display:flex;gap:4px}
.claimBtn{background:#0b5ed7;color:#fff;padding:4px 10px;border-radius:4px;border:0;font-weight:900;font-size:9px;cursor:pointer}
.delBtn{background:#ef4444;color:#fff;padding:4px 6px;border-radius:4px;border:0;font-weight:900;font-size:9px;cursor:pointer}
.menuBtn{font-size:20px;background:none;border:0;color:#fff;cursor:pointer}
.menuDrawer{position:fixed;top:46px;left:-300px;width:280px;height:calc(100vh - 46px);background:#fff;z-index:9999;transition:left .25s ease;overflow:auto;border-right:1px solid #e2e8f0}
.menuDrawer.open{left:0}
.menuItem{display:block;width:100%;padding:12px 16px;background:#fff;border:0;border-bottom:1px solid #f1f5f9;color:#334155;font-weight:700;font-size:12px;text-align:left;cursor:pointer}
.menuOverlay{position:fixed;top:46px;left:0;right:0;bottom:0;background:rgba(0,0,0,0.2);display:none;z-index:9998}
.menuOverlay.open{display:block}
</style>
</head>
<body>
<script>if(localStorage.getItem('shija_logged')!=='1'){location.href='login.html'}</script>
<div class="top"><button class="menuBtn" id="menuBtn">☰</button><div style="font-weight:900;font-size:12px">SHIJA - Discharge (Auto Sync All PCs)</div><div id="syncInfo" style="margin-left:auto;font-size:9px;font-weight:700">Firebase: 0 discharged</div></div>
<div class="menuOverlay" id="menuOverlay"></div>
<div class="menuDrawer" id="menuDrawer"><div style="font-weight:900;padding:12px 14px;background:#0a1931;color:#fff">MENU</div>
<button class="menuItem" onclick="location.href='index.html'">HOME</button>
<button class="menuItem" onclick="location.href='total.html'">TOTAL PATIENT</button>
<button class="menuItem" onclick="location.href='cmht.html'">CMHT TOTAL PATIENT</button>
<button class="menuItem" onclick="location.href='list.html?scheme=CMHT&force=1'">CMHT DAILY DIALYSIS</button>
<button class="menuItem" onclick="location.href='list.html?scheme=PMJAY&force=1'">PMJAY DAILY DIALYSIS</button>
<button class="menuItem" style="background:#fee2e2" onclick="location.href='discharge.html'">DISCHARGE PATIENT</button>
<button class="menuItem" onclick="location.href='bill.html'">BILL</button>
</div>

<div class="content">
<div class="card">
<div style="display:grid;grid-template-columns:1fr 1fr 100px;gap:10px;align-items:end">
<div><div class="label">TIME FILTER (ALREADY ADDED)</div><select id="fTime" class="input"><option value="">All Time</option><option value="5pm" selected>5pm</option><option value="7:00 AM">7:00 AM</option><option value="12:00 PM">12:00 PM</option><option value="5:00 PM">5:00 PM</option><option value="9:00 PM">9:00 PM</option></select></div>
<div><div class="label">BLOCK FILTER (ALREADY ADDED)</div><select id="fBlock" class="input"><option value="">All Block</option><option value="Main" selected>Main</option><option value="MAIN">MAIN</option><option value="ITOCHA">ITOCHA</option></select></div>
<div><div class="label">PER PAGE</div><select id="perPage" class="input"><option value="10" selected>10</option><option value="20">20</option><option value="50">50</option></select></div>
</div>

<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
<button class="badge" id="btnDischarged">Discharged - 0 Firebase</button>
<button class="badgeBlue" style="background:#e2e8f0;color:#000" id="btnClaim">Claim - 0 Firebase</button>
<span id="dateInfo" style="font-size:10px;font-weight:800;margin-left:10px">2026-10-24 | 5pm | Main</span>
<div style="margin-left:auto;display:flex;gap:4px;align-items:center">
<input type="text" id="fSearch" placeholder="Search Discharged (Name / )" class="input" style="width:200px">
<button class="btn btnBlue" onclick="applyFilter()">Search</button>
<button class="btn btnDark" onclick="clearAll()">Clear</button>
<button class="btn btnDark" onclick="changePage(-1)">Prev</button>
<span id="pageInfo" style="font-size:10px;font-weight:800">Page 1 of 1</span>
<button class="btn btnDark" onclick="changePage(1)">Next</button>
</div>
</div>
</div>

<div class="card" style="background:#fff;padding:4px">
<div class="sheetWrap"><table><thead><tr><th style="width:30px">SL</th><th style="width:180px">NAME</th><th style="width:80px">SHRI ID</th><th style="width:120px">PMJAY ID</th><th style="width:60px">TIME</th><th style="width:60px">BLOCK</th><th style="width:100px">ACTION</th></tr></thead><tbody id="tbody"><tr><td colspan="7" style="padding:20px;text-align:center">LOADING DISCHARGED PATIENTS...</td></tr></tbody></table></div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, deleteDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app=initializeApp(firebaseConfig,"dischargeOld_"+Math.random());
const db=getFirestore(app);
window._fb={db,collection,getDocs,doc,deleteDoc,setDoc};
</script>

<script>
let all=[],filtered=[],currentPage=1,pageSize=10;
const menuBtn=document.getElementById('menuBtn'),menuDrawer=document.getElementById('menuDrawer'),menuOverlay=document.getElementById('menuOverlay');
function toggleMenu(){menuDrawer.classList.toggle('open');menuOverlay.classList.toggle('open');}
function closeMenu(){menuDrawer.classList.remove('open');menuOverlay.classList.remove('open');}
menuBtn.addEventListener('click', toggleMenu);menuOverlay.addEventListener('click', closeMenu);

async function load(){
  try{
    let snap=await window._fb.getDocs(window._fb.collection(window._fb.db,'discharges'));
    all=[];
    snap.forEach(d=>{let o=d.data();o._id=d.id;all.push(o);});
    all.sort((a,b)=> new Date(b.dischargedAt||0)-new Date(a.dischargedAt||0));
    document.getElementById('syncInfo').innerText=`Firebase: ${all.length} discharged, 0 claims - Synced all PCs`;
    document.getElementById('btnDischarged').innerText=`Discharged - ${all.length} Firebase`;
    applyFilter();
  }catch(e){
    document.getElementById('tbody').innerHTML=`<tr><td colspan="7" style="color:red">ERROR: ${e.message}</td></tr>`;
  }
}

function normalize(t){if(!t)return'';return String(t).toUpperCase().replace(/\./g,'').trim();}

function applyFilter(){
  let time=document.getElementById('fTime').value;
  let block=document.getElementById('fBlock').value;
  let search=document.getElementById('fSearch').value.toLowerCase().trim();
  pageSize=parseInt(document.getElementById('perPage').value)||10;
  
  filtered=all.filter(p=>{
    if(time){
      let pt=normalize(p.time);
      let ft=normalize(time);
      // allow 5pm = 5:00 PM
      if(ft==='5PM' && !(pt.includes('5'))) return false;
      else if(time!=='5pm' && pt!==ft && !pt.includes(ft)) return false;
    }
    if(block){
      if((p.block||'').toUpperCase()!==block.toUpperCase()) return false;
    }
    if(search){
      let s=`${p.patientName||p.name||''} ${p.shriId||p.shri||''} ${p.pmjayCmhtId||''}`.toLowerCase();
      if(!s.includes(search)) return false;
    }
    return true;
  });
  currentPage=1;
  render();
}

function render(){
  let tbody=document.getElementById('tbody');tbody.innerHTML='';
  let totalPages=Math.max(1,Math.ceil(filtered.length/pageSize));
  if(currentPage>totalPages) currentPage=totalPages;
  let start=(currentPage-1)*pageSize;
  let page=filtered.slice(start,start+pageSize);
  
  document.getElementById('pageInfo').innerText=`Page ${currentPage} of ${totalPages}`;
  document.getElementById('dateInfo').innerText=`${new Date().toISOString().slice(0,10)} | ${document.getElementById('fTime').value||'All'} | ${document.getElementById('fBlock').value||'All'}`;
  
  if(page.length===0){
    tbody.innerHTML=`<tr><td colspan="7" style="padding:20px;text-align:center">NO DISCHARGED PATIENT FOUND - Select DISCHARGE in list.html</td></tr>`;
    return;
  }
  page.forEach((p,i)=>{
    let tr=document.createElement('tr');
    tr.innerHTML=`<td>${start+i+1}</td><td>${p.patientName||p.name||''}</td><td>${p.shriId||p.shri||''}</td><td class="id">${p.pmjayCmhtId||''}</td><td>${p.time||''}</td><td>${p.block||''}</td><td><div class="actionWrap"><button class="claimBtn" onclick="claim('${p._id}')">Claim</button><button class="delBtn" onclick="del('${p._id}')">X</button></div></td>`;
    tbody.appendChild(tr);
  });
}

function changePage(d){let totalPages=Math.max(1,Math.ceil(filtered.length/pageSize));currentPage+=d;if(currentPage<1)currentPage=1;if(currentPage>totalPages)currentPage=totalPages;render();}
function clearAll(){document.getElementById('fTime').value='';document.getElementById('fBlock').value='';document.getElementById('fSearch').value='';applyFilter();}
async function del(id){if(!confirm('DELETE?'))return;await window._fb.deleteDoc(window._fb.doc(window._fb.db,'discharges',id));load();}
async function claim(id){alert('Claim feature - You can add bill logic here. ID: '+id);}
document.getElementById('fTime').addEventListener('change', applyFilter);
document.getElementById('fBlock').addEventListener('change', applyFilter);
document.getElementById('perPage').addEventListener('change', applyFilter);
document.getElementById('fSearch').addEventListener('input', applyFilter);
window.addEventListener('load', load);
</script>
</body>
</html>
