<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>DISCHARGE PATIENT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f1f5f9}
.top{height:52px;background:#0a1931;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 10px;position:fixed;top:0;left:0;right:0;z-index:1000}
.btn{padding:6px 10px;border:0;border-radius:6px;font-weight:900;font-size:10px;cursor:pointer}
.btnDark{background:#0f172a;color:#fff}.btnPurple{background:#7c3aed;color:#fff}
.input{padding:6px 8px;border:1px solid #e2e8f0;border-radius:6px;font-weight:700;font-size:11px;background:#fff}
.content{max-width:1450px;margin:60px auto 0;padding:8px}
.card{background:#fff;border-radius:10px;padding:8px;margin-bottom:6px;border:1px solid #e2e8f0}
.sheetWrap{overflow:auto;border:1px solid #e2e8f0;background:#fff;max-height:80vh;border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:950px;border:none}
th{position:sticky;top:0;background:#991b1b;color:#fff;padding:10px 6px;font-size:9px;text-align:center;border:none;border-bottom:2px solid #991b1b;z-index:2}
td{border:none;border-bottom:1px solid #f1f5f9;padding:8px 6px;height:42px;font-size:10px;font-weight:700;text-align:center;text-transform:uppercase;background:#fff}
.menuBtn{font-size:22px;background:none;border:0;color:#fff;cursor:pointer;padding:4px 8px}
.menuDrawer{position:fixed;top:52px;left:-300px;width:280px;height:calc(100vh - 52px);background:#fff;z-index:9999;transition:left .25s ease;overflow:auto;border-right:1px solid #e2e8f0}
.menuDrawer.open{left:0}
.menuItem{display:block;width:100%;padding:12px 16px;background:#fff;border:0;border-bottom:1px solid #f1f5f9;color:#334155;font-weight:700;font-size:12px;text-align:left;cursor:pointer}
.menuOverlay{position:fixed;top:52px;left:0;right:0;bottom:0;background:rgba(0,0,0,0.2);display:none;z-index:9998}
.menuOverlay.open{display:block}
.adminWrap{position:relative}
.adminCircle{width:34px;height:34px;border-radius:50%;background:#1e88e5;color:#fff;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:0}
.adminDropdown{position:absolute;top:42px;right:0;background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,0.25);width:200px;display:none;z-index:2000;overflow:hidden;padding:6px}
.adminDropdown.open{display:block}
.adminDropItem{width:100%;padding:14px 16px;border:0;background:#fff;text-align:left;font-weight:700;font-size:14px;cursor:pointer;border-radius:10px}
.clearBtn{height:30px;background:#0f172a;color:#fff;font-weight:900;font-size:9px;padding:6px 14px;border-radius:6px;border:0;cursor:pointer}
</style>
</head>
<body>
<script>if(localStorage.getItem('shija_logged')!=='1'){location.href='login.html'}</script>
<div class="top"><div style="display:flex;align-items:center;gap:6px"><button class="menuBtn" id="menuBtn">☰</button><div style="font-weight:900;font-size:13px">DISCHARGE PATIENT</div><div id="count" style="background:#fee2e2;color:#991b1b;padding:4px 8px;border-radius:12px;font-weight:900;font-size:10px">0</div></div><div class="adminWrap"><button class="adminCircle" onclick="toggleAdmin()">A</button><div class="adminDropdown" id="adminDropdown"><button class="adminDropItem" onclick="doLogout()">Logout</button><button class="adminDropItem" style="color:#ef4444" onclick="doLogoutAll()">Logout All Devices</button></div></div></div>
<div class="menuOverlay" id="menuOverlay"></div><div class="menuDrawer" id="menuDrawer"><div style="font-weight:900;padding:12px 14px;background:#0a1931;color:#fff">MENU</div><button class="menuItem" onclick="location.href='index.html'">HOME</button><button class="menuItem" onclick="location.href='total.html'">TOTAL PATIENT</button><button class="menuItem" onclick="location.href='cmht.html'">CMHT TOTAL PATIENT</button><button class="menuItem" onclick="location.href='list.html?scheme=CMHT&force=1'">CMHT DAILY DIALYSIS</button><button class="menuItem" onclick="location.href='list.html?scheme=PMJAY&force=1'">PMJAY DAILY DIALYSIS</button><button class="menuItem" style="background:#fee2e2" onclick="location.href='discharge.html'">DISCHARGE PATIENT</button><button class="menuItem" onclick="location.href='bill.html'">BILL</button></div>

<div class="content">
<div class="card">
<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:end">
<div><label style="font-size:8px;font-weight:800">DATE</label><br><input type="date" id="fDate" class="input"></div>
<div><label style="font-size:8px;font-weight:800">SCHEME</label><br><select id="fScheme" class="input"><option value="">ALL</option><option value="PMJAY">PMJAY</option><option value="CMHT">CMHT</option></select></div>
<div><label style="font-size:8px;font-weight:800">SEARCH</label><br><input type="text" id="fSearch" class="input" placeholder="NAME / SHRI / ID" style="min-width:180px"></div>
<button class="clearBtn" onclick="clearF()">CLEAR</button>
<button class="btn btnPurple" style="margin-left:auto" onclick="loadData()">REFRESH</button>
</div>
</div>

<div class="card" style="padding:6px">
<div class="sheetWrap"><table><thead><tr><th style="width:35px">SL</th><th style="width:85px">DATE</th><th style="width:95px">PMJAY/CMHT ID</th><th style="width:200px">PATIENT NAME</th><th style="width:85px">SHRI ID</th><th style="width:70px">TIME</th><th style="width:70px">BLOCK</th><th style="width:90px">DISCHARGED AT</th><th style="width:80px">ACTION</th></tr></thead><tbody id="tbody"><tr><td colspan="9" style="padding:20px">LOADING...</td></tr></tbody></table></div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDocs, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app=initializeApp(firebaseConfig,"dischargePage_"+Math.random());
const db=getFirestore(app);
window._fb={db,doc,setDoc,getDocs,collection,deleteDoc};
const app2=initializeApp(firebaseConfig,"logout_"+Math.random());const db2=getFirestore(app2);window._fb2={db:db2,doc,setDoc};
</script>
<script>
let allData=[],filtered=[];
const menuBtn=document.getElementById('menuBtn'),menuDrawer=document.getElementById('menuDrawer'),menuOverlay=document.getElementById('menuOverlay');
function toggleMenu(){menuDrawer.classList.toggle('open');menuOverlay.classList.toggle('open');}
function closeMenu(){menuDrawer.classList.remove('open');menuOverlay.classList.remove('open');}
menuBtn.addEventListener('click', toggleMenu);menuOverlay.addEventListener('click', closeMenu);
function toggleAdmin(){document.getElementById('adminDropdown').classList.toggle('open');}
function doLogout(){if(confirm('LOGOUT?')){localStorage.removeItem('shija_logged');location.href='login.html';}}
async function doLogoutAll(){if(!confirm('LOGOUT ALL?'))return;try{await window._fb2.setDoc(window._fb2.doc(window._fb2.db,'system','global_logout'),{logoutTime:Date.now()});}catch(e){}localStorage.removeItem('shija_logged');location.href='login.html';}
document.addEventListener('click', e=>{if(!e.target.closest('.adminWrap'))document.getElementById('adminDropdown').classList.remove('open');});

function getTodayIST(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

async function loadData(){
  document.getElementById('tbody').innerHTML=`<tr><td colspan="9" style="padding:20px">LOADING...</td></tr>`;
  try{
    let snap=await window._fb.getDocs(window._fb.collection(window._fb.db,'discharges'));
    allData=[];
    snap.forEach(docSnap=>{
      let d=docSnap.data();
      d._docId=docSnap.id;
      allData.push(d);
    });
    // sort by latest first
    allData.sort((a,b)=> new Date(b.dischargedAt||b.date) - new Date(a.dischargedAt||a.date));
    applyFilter();
  }catch(e){
    document.getElementById('tbody').innerHTML=`<tr><td colspan="9" style="padding:20px;color:red">ERROR: ${e.message}</td></tr>`;
  }
}

function applyFilter(){
  let date=document.getElementById('fDate').value;
  let scheme=document.getElementById('fScheme').value;
  let search=document.getElementById('fSearch').value.toLowerCase().trim();
  filtered=allData.filter(p=>{
    if(date && p.date!==date) return false;
    if(scheme && (p.scheme||'')!==scheme) return false;
    if(search){
      let hay=`${p.patientName||p.name||''} ${p.shriId||p.shri||''} ${p.pmjayCmhtId||''}`.toLowerCase();
      if(!hay.includes(search)) return false;
    }
    return true;
  });
  render();
}

function render(){
  let tbody=document.getElementById('tbody');tbody.innerHTML='';
  document.getElementById('count').innerText=filtered.length;
  if(filtered.length===0){
    tbody.innerHTML=`<tr><td colspan="9" style="padding:20px;text-align:center">NO DISCHARGE FOUND</td></tr>`;
    return;
  }
  filtered.forEach((p,i)=>{
    let tr=document.createElement('tr');
    let timeStr='';
    try{timeStr=new Date(p.dischargedAt).toLocaleString('en-IN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'short'});}catch(e){timeStr=p.dischargedAt||''}
    tr.innerHTML=`<td>${i+1}</td><td>${p.date||''}</td><td>${p.pmjayCmhtId||''}</td><td style="text-align:left;padding-left:8px">${p.patientName||p.name||''}</td><td>${p.shriId||p.shri||''}</td><td>${p.time||''}</td><td>${p.block||''}</td><td style="font-size:9px">${timeStr}</td><td><button class="btn" style="background:#10b981;color:#fff;padding:5px 8px;font-size:9px" onclick="restorePatient('${p._docId}')">RESTORE</button> <button class="btn" style="background:#ef4444;color:#fff;padding:5px 8px;font-size:9px" onclick="deleteDischarge('${p._docId}')">DEL</button></td>`;
    tbody.appendChild(tr);
  });
}

async function restorePatient(docId){
  if(!confirm('RESTORE THIS PATIENT TO DAILY LIST?'))return;
  try{
    let item=allData.find(x=>x._docId===docId);
    if(!item){alert('NOT FOUND');return;}
    // add back to daily list
    let dailyDocId=item.date+'_'+(item.scheme||'PMJAY');
    // fetch daily list
    const {doc,getDoc,setDoc}=window._fb;
    // Use dynamic import? we have via window._fb
    // simplified: just delete discharge and user can re-add manually
    await window._fb.deleteDoc(window._fb.doc(window._fb.db,'discharges',docId));
    alert('RESTORED - Now go to list.html and Add again if needed. Discharge removed.');
    loadData();
  }catch(e){alert(e.message)}
}

async function deleteDischarge(docId){
  if(!confirm('DELETE PERMANENTLY?'))return;
  try{await window._fb.deleteDoc(window._fb.doc(window._fb.db,'discharges',docId));loadData();}catch(e){alert(e.message)}
}

function clearF(){document.getElementById('fDate').value='';document.getElementById('fScheme').value='';document.getElementById('fSearch').value='';applyFilter();}

document.getElementById('fDate').addEventListener('change', applyFilter);
document.getElementById('fScheme').addEventListener('change', applyFilter);
document.getElementById('fSearch').addEventListener('input', applyFilter);

window.addEventListener('load', ()=>{document.getElementById('fDate').value='';loadData();});
</script>
</body>
</html>
