<input type="search" id="fSearch" placeholder="Search discharged..." class="input inputSmall" style="flex:1;max-width:280px;min-width:150px;border-radius:20px">
<div class="badge" style="font-size:8px;padding:4px 8px" id="badgeD">Discharged - 0</div>
<span id="dateInfo" style="font-size:9px;font-weight:800"></span>
<span id="pageInfo" style="font-size:9px;font-weight:800;color:#0f172a"></span>
</div>
<div style="display:flex;gap:6px;align-items:center;margin-left:auto">
<button class="btn btnDark btnSmall" onclick="changePage(-1)">PREV</button>
<button class="btn btnDark btnSmall" onclick="changePage(1)">NEXT</button>
<div style="display:flex;gap:4px;border:1.5px solid #e2e8f0;border-radius:8px;padding:2px;background:#f8fafc">
<button class="iconBtn active" id="btnList" onclick="setView('list')"><svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1.5"/><circle cx="4" cy="12" r="1.5"/><circle cx="4" cy="18" r="1.5"/></svg></button>
<button class="iconBtn" id="btnGrid" onclick="setView('grid')"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
</div></div></div></div></div>

<div class="card" style="padding:8px">
<div class="sheetWrap" id="tableWrap"><table><thead><tr><th>SL</th><th>PATIENT NAME</th><th>SHRI ID</th><th>PMJAY ID</th><th>TIME</th><th>BLOCK</th><th>UPLOAD</th><th>ACTION</th></tr></thead><tbody id="tbody"><tr><td colspan="8" style="padding:20px;text-align:center">LOADING...</td></tr></tbody></table></div>
<div class="gridWrap" id="gridWrap" style="display:none"></div>
</div></div></div>

<div id="fileModal"><div class="popupCard"><div class="popupHead"><b id="modalFileName">FILE</b><div class="headRight"><button class="iconTop" onclick="zoomIn()">+</button><button class="iconTop" onclick="zoomOut()">-</button><button class="iconTop" onclick="downloadCurrent()">⬇</button><button class="iconTop closeTop" onclick="closeModal()">X</button></div></div><div class="zoomBar"><span id="modalFileMeta">IMAGE</span><div style="display:flex;gap:4px;align-items:center"><button class="zoomBtn" onclick="zoomOut()">-</button><div class="zoomLabel" id="zoomLabel">100%</div><button class="zoomBtn" onclick="zoomIn()">+</button><button class="zoomBtn" onclick="resetZoom()">⟲</button></div></div><div class="popupBody"><div class="paperBox" id="paperBox"></div></div></div></div>

<script>
var allDischarge=[],filtered=[],masterPatients=[],selectedPatient=null,currentPage=1,pageSize=12,isGrid=false,openGridSet=new Set(),lastOpenCleanShri=null,currentFileData=null,currentFileName=null;
const CHUNK_SIZE=800000;
function getToday(){return new Date().toISOString().slice(0,10);}
function setView(m){isGrid=(m==='grid');document.getElementById('tableWrap').style.display=isGrid?'none':'block';document.getElementById('gridWrap').style.display=isGrid?'grid':'none';var bl=document.getElementById('btnList'),bg=document.getElementById('btnGrid');if(isGrid){bg.classList.add('active');bl.classList.remove('active')}else{bl.classList.add('active');bg.classList.remove('active')}pageSize=parseInt(document.getElementById('perPage').value)||12;currentPage=1;render();}
function getDocsForShri(s){return window._fb._docsCache[s]||[];}

// PATIENT LOAD DISABLED - AS PER YOUR REQUEST
async function loadMaster(){
  masterPatients=[];
  console.log('Patient auto-load disabled');
  return;
}

async function loadAll(){try{if(!window._fb){setTimeout(loadAll,500);return;}var snap=await window._fb.getDocs(window._fb.collection(window._fb.db,'discharges'));allDischarge=[];snap.forEach(function(d){var o=d.data();o._id=d.id;allDischarge.push(o);});allDischarge.sort(function(a,b){return new Date(b.dischargedAt||0)-new Date(a.dischargedAt||0);});}catch(e){}applyFilter();}
function applyFilter(){var date=document.getElementById('fDate').value;var time=document.getElementById('fTime').value;var block=document.getElementById('fBlock').value;var search=document.getElementById('fSearch').value.toLowerCase().trim();pageSize=parseInt(document.getElementById('perPage').value)||12;filtered=allDischarge.filter(function(p){if(date&&p.date!==date)return false;if(time&&(p.time||'')!==time)return false;if(block&&(p.block||'').toUpperCase()!==block.toUpperCase())return false;if(search){var s=(p.patientName||p.name||'')+" "+(p.shriId||p.shri||'')+" "+(p.pmjayCmhtId||'')+" "+(p.claimId||'');if(s.toLowerCase().indexOf(search)===-1)return false;}return true;});currentPage=1;render();}
function handleDragOver(e){e.preventDefault();e.stopPropagation();e.currentTarget.classList.add('dragOver');}
function handleDragLeave(e){e.preventDefault();e.stopPropagation();e.currentTarget.classList.remove('dragOver');}
function handleDrop(e){e.preventDefault();e.stopPropagation();e.currentTarget.classList.remove('dragOver');var shri=e.currentTarget.dataset.shri;var type=e.currentTarget.dataset.type;var name=e.currentTarget.dataset.name;var pmjay=e.currentTarget.dataset.pmjay;if(!e.dataTransfer.files||e.dataTransfer.files.length===0) return;uploadFile(e.dataTransfer.files[0],shri,name,pmjay,type);}
function render(){
var tbody=document.getElementById('tbody');var grid=document.getElementById('gridWrap');if(!tbody||!grid)return;tbody.innerHTML='';grid.innerHTML='';
var totalPages=Math.max(1,Math.ceil(filtered.length/pageSize));if(currentPage>totalPages)currentPage=totalPages;var start=(currentPage-1)*pageSize;var page=filtered.slice(start,start+pageSize);
document.getElementById('badgeD').innerText="Discharged - "+filtered.length;document.getElementById('pageInfo').innerText="Page "+currentPage+" of "+totalPages;document.getElementById('dateInfo').innerText=(document.getElementById('fTime').value||'ALL TIME')+" | "+(document.getElementById('fBlock').value||'ALL BLOCK');
if(page.length===0){tbody.innerHTML='<tr><td colspan="8" style="padding:20px;text-align:center">NO DISCHARGED</td></tr>';grid.innerHTML='<div style="padding:20px;text-align:center;grid-column:1/-1">NO DISCHARGED</div>';return;}
page.forEach(function(p,i){
var pmjayShow=p.pmjayCmhtId||p.pmjayId||p.pmjay||'';var shriVal=p.shriId||p.shri||'';var nameVal=p.patientName||p.name||'';var docs=getDocsForShri(shriVal);
var mapCount={discharge_summary:0,discharge_photo:0,feedback_form:0};docs.forEach(function(d){if(mapCount.hasOwnProperty(d.type))mapCount[d.type]++;});
var totalUp=mapCount.discharge_summary+mapCount.discharge_photo+mapCount.feedback_form;var cleanShri=shriVal.replace(/[^a-zA-Z0-9]/g,'_');
var tr=document.createElement('tr');tr.className='mainRow';tr.id='tr_'+cleanShri;
tr.innerHTML='<td>'+(start+i+1)+'</td><td class="nameCol">'+nameVal+'</td><td><span class="shriGray">'+shriVal+'</span></td><td><span class="pmjayBlue">'+pmjayShow+'</span></td><td>'+(p.time||'')+'</td><td>'+(p.block||'')+'</td><td><button class="uploadBtnFold '+(totalUp>0?'done':'')+'" onclick="toggleSlideList(\''+cleanShri+'\')">'+(totalUp>0?'✓ '+totalUp:'UPLOAD')+' '+(lastOpenCleanShri===cleanShri?'▲':'▼')+'</button></td><td class="actionTd"><div class="actionCell"><button class="claimBtn" onclick="openClaimInline(\''+p._id+'\')">CLAIM</button><div class="claimFold" id="fold-'+p._id+'"><input type="text" id="input-'+p._id+'" placeholder="CLAIM ID"><button class="btn btnDark btnSmall" onclick="saveClaimInline(\''+p._id+'\')">ADD</button><button class="btn btnSmall" style="background:#fff;border:1px solid #e2e8f0" onclick="closeClaimInline(\''+p._id+'\')">X</button></div><button class="delBtn" onclick="delDischarge(\''+p._id+'\')">DEL</button></div></td>';
tbody.appendChild(tr);
});
if(lastOpenCleanShri){var s=document.getElementById('slide_'+lastOpenCleanShri);if(s)s.classList.add('show');}
}
function changePage(d){var tp=Math.max(1,Math.ceil(filtered.length/pageSize));currentPage+=d;if(currentPage<1)currentPage=1;if(currentPage>tp)currentPage=tp;render();}
function clearFilters(){document.getElementById('fTime').value='';document.getElementById('fBlock').value='';document.getElementById('fSearch').value='';applyFilter();}
function setupSearch(){}
function openAddPanel(shri){var p=masterPatients.find(function(x){return x.shri===shri;});if(!p)return;selectedPatient=p;document.getElementById('searchResults').classList.remove('open');document.getElementById('searchTotal').value='';document.getElementById('addPanelInfo').innerHTML='PATIENT: '+p.name;document.getElementById('addPanel').classList.add('open');}
function closeAddPanel(){document.getElementById('addPanel').classList.remove('open');selectedPatient=null;}
async function confirmAddDischarge(){var time=document.getElementById('addTimeSelect').value;var block=document.getElementById('addBlockSelect').value;if(!selectedPatient||!time||!block){alert('Select TIME and BLOCK');return;}var date=document.getElementById('fDate').value||getToday();var docId=date+"_"+selectedPatient.shri+"_"+Date.now();try{await window._fb.setDoc(window._fb.doc(window._fb.db,'discharges',docId),{date:date,shriId:selectedPatient.shri,patientName:selectedPatient.name,pmjayCmhtId:selectedPatient.pmjayId,time:time,block:block,status:'DISCHARGE',dischargedAt:new Date().toISOString()});closeAddPanel();loadAll();}catch(e){alert(e.message);}}
async function delDischarge(id){if(!confirm('DELETE?'))return;try{await window._fb.deleteDoc(window._fb.doc(window._fb.db,'discharges',id));loadAll();}catch(e){alert(e.message);}}
function toggleSlideList(cleanShri){var slide=document.getElementById('slide_'+cleanShri);if(!slide) return;var isShow=slide.classList.contains('show');document.querySelectorAll('.slideRow').forEach(function(r){r.classList.remove('show');});if(!isShow){slide.classList.add('show');lastOpenCleanShri=cleanShri;}else{lastOpenCleanShri=null;}}
function openClaimInline(id){var fold=document.getElementById('fold-'+id);var isShow=fold.classList.contains('show');document.querySelectorAll('.claimFold').forEach(function(f){f.classList.remove('show');});if(!isShow){fold.classList.add('show');}}
function closeClaimInline(id){document.getElementById('fold-'+id).classList.remove('show');}
async function saveClaimInline(id){var claimId=document.getElementById('input-'+id).value.trim().toUpperCase();if(!claimId)return;var data=allDischarge.find(function(x){return x._id===id;});try{await window._fb.setDoc(window._fb.doc(window._fb.db,'discharges',id),{claimId:claimId},{merge:true});await window._fb.setDoc(window._fb.doc(window._fb.db,'claims',id),{...data,claimId:claimId},{merge:true});location.href='claim.html?claimId='+encodeURIComponent(claimId);}catch(e){alert(e.message);}}
window.addEventListener('load',function(){var fDate=document.getElementById('fDate');if(fDate)fDate.value=getToday();setupSearch();loadMaster().then(function(){loadAll();setView('list');});document.getElementById('fTime').addEventListener('change',applyFilter);document.getElementById('fBlock').addEventListener('change',applyFilter);document.getElementById('perPage').addEventListener('change',applyFilter);document.getElementById('fSearch').addEventListener('input',applyFilter);if(fDate)fDate.addEventListener('change',applyFilter);});
</script>
</body>
</html>
