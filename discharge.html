<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discharge Patient - SHIJA</title>
<script src="Patient.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{background:#f1f5f9;min-height:100vh}
.top{background:linear-gradient(90deg,#b91c1c,#ef4444);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.top a{color:#fff;text-decoration:none;background:#ffffff22;padding:6px 12px;border-radius:8px;font-size:13px}
.wrap{max-width:900px;margin:20px auto;padding:0 14px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}
.box{flex:1;min-width:160px;background:#fff;padding:12px 14px;border-radius:12px;box-shadow:0 2px 10px #0001}
.box label{font-size:11px;font-weight:700;color:#475569;display:block;margin-bottom:5px}
.box input,.box select{width:100%;padding:9px 10px;border:1.5px solid #cbd5e1;border-radius:8px;outline:0;font-size:13px}
.search-wrap{position:relative;background:#fff;border-radius:12px;box-shadow:0 2px 10px #0001;padding:12px 14px;margin:14px 0}
.search-wrap label{font-size:11px;font-weight:700;color:#475569;display:block;margin-bottom:5px}
.search-wrap input{width:100%;padding:11px 12px;border:1.5px solid #cbd5e1;border-radius:8px;outline:0;font-size:13px}
.suggest{position:absolute;left:14px;right:14px;top:72px;background:#fff;border:1px solid #e2e8f0;border-radius:10px;max-height:260px;overflow-y:auto;z-index:10;box-shadow:0 10px 30px #0002;display:none}
.suggest div{padding:9px 12px;border-bottom:1px solid #f1f5f9;cursor:pointer;font-size:13px}
.suggest div:hover{background:#fef2f2}
.suggest b{color:#b91c1c}
.suggest small{color:#64748b}
.detail{background:#fff;border-radius:14px;padding:16px;box-shadow:0 4px 15px #0001;margin-top:16px;display:none}
.detail h3{color:#0f4c75;margin-bottom:12px;font-size:15px;border-bottom:1px solid #e2e8f0;padding-bottom:8px}
.detail .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.detail .grid div{background:#f8fafc;padding:10px;border-radius:8px;font-size:13px}
.detail .grid div span{display:block;font-size:10px;color:#64748b;font-weight:700;margin-bottom:2px}
.btn{width:100%;padding:12px;border:0;border-radius:10px;background:#b91c1c;color:#fff;font-weight:800;font-size:14px;cursor:pointer;margin-top:14px}
.btn:disabled{background:#94a3b8;cursor:not-allowed}
.count{font-size:12px;color:#64748b;margin:8px 0}
@media(max-width:600px){.row{flex-direction:column}.detail .grid{grid-template-columns:1fr}}
</style></head><body>

<div class="top"><h3>Discharge Patient</h3><a href="index.html">← Home</a></div>

<div class="wrap">

<!-- 1. DATE + 4+5 TIME FILTER DROPDOWN -->
<div class="row">
 <div class="box"><label>1. Select Date</label><input type="date" id="disDate"></div>
 <div class="box"><label>4. Filter by Time (Dropdown)</label>
  <select id="timeFilter">
   <option value="All">All Time</option>
   <option value="Morning">Morning (6AM - 12PM)</option>
   <option value="Afternoon">Afternoon (12PM - 4PM)</option>
   <option value="Evening">Evening (4PM - 9PM)</option>
   <option value="Night">Night (9PM - 6AM)</option>
  </select>
 </div>
</div>

<!-- 2. SEARCH WITH HINT FROM TOTAL 510 + SHRI ID -->
<div class="search-wrap">
<label>2. Search Patient (Name / SHRI ID / PMJAY ID)</label>
<input id="search" placeholder="Type name or SHRI-0123 or PMJAY..." autocomplete="off" oninput="showHints()" onfocus="showHints()">
<div class="suggest" id="suggest"></div>
<div class="count" id="cnt"></div>
</div>

<!-- 3. DETAIL LIST WITH PMJAY -->
<div class="detail" id="detailBox">
<h3>3. Patient Details</h3>
<div class="grid" id="detailGrid"></div>
<button class="btn" id="disBtn" onclick="dischargeNow()">Confirm Discharge</button>
</div>

</div>

<script>
if(localStorage.getItem('shija_logged')!=='1') location.href='login.html';
document.getElementById('disDate').valueAsDate = new Date();

let selectedPatient = null;

function getAll(){
 let excel = (typeof patientData!=='undefined')?patientData:[];
 let local = JSON.parse(localStorage.getItem('shija_patients')||'[]');
 return [...excel, ...local];
}
function getDischarged(){return JSON.parse(localStorage.getItem('shija_discharged')||'[]');}

function showHints(){
 let q = document.getElementById('search').value.trim().toLowerCase();
 let all = getAll();
 let disIds = new Set(getDischarged().map(d=>String(d.id).toLowerCase()));
 let active = all.filter(p=>{
   let id = String(p.id||p.ID||p.sl_no||p.Sl_No||p.SHRI||p.shri_id||'').toLowerCase();
   return !disIds.has(id);
 });
 if(q){
   active = active.filter(p=>JSON.stringify(p).toLowerCase().includes(q));
 }
 document.getElementById('cnt').innerText = `Found ${active.length} from Total ${getAll().length} patients | Time: ${document.getElementById('timeFilter').value}`;
 let box = document.getElementById('suggest');
 if(!q || !active.length){ box.style.display='none'; return; }
 box.style.display='block';
 box.innerHTML = active.slice(0,50).map(p=>{
   let name = p.name||p.Name||p.patient||'Unknown';
   let shri = p.id||p.ID||p.sl_no||p.SHRI||p.shri_id||p.SHRI_ID||'-';
   let pmjay = p.pmjay||p.PMJAY||p.pmjay_id||p.PMJAY_ID||'-';
   return `<div onclick="selectPatient('${String(shri).replace(/'/g,"")}')"><b>${name}</b> <small>SHRI: ${shri} | PMJAY: ${pmjay}</small></div>`;
 }).join('');
}

function selectPatient(shriId){
 let all = getAll();
 let p = all.find(x=> String(x.id||x.ID||x.sl_no||x.SHRI||x.shri_id||x.SHRI_ID||'').toLowerCase() === String(shriId).toLowerCase());
 if(!p) return;
 selectedPatient = p;
 document.getElementById('suggest').style.display='none';
 document.getElementById('search').value = (p.name||p.Name||'') + ' - ' + shriId;
 
 // 3. SHOW DETAIL IN LIST FORMAT INCLUDING PMJAY
 let name = p.name||p.Name||'-';
 let shri = p.id||p.ID||p.sl_no||p.SHRI||p.shri_id||p.SHRI_ID||'-';
 let pmjay = p.pmjay||p.PMJAY||p.pmjay_id||p.PMJAY_ID||'-';
 let age = p.age||p.Age||'-';
 let gender = p.gender||p.Gender||'-';
 let phone = p.phone||p.Phone||p.contact||'-';
 let diagnosis = p.diagnosis||p.Diagnosis||'-';
 let doctor = p.doctor||p.Doctor||'-';
 let admission = p.admission||p.Admission||p.date||'-';

 document.getElementById('detailBox').style.display='block';
 document.getElementById('detailGrid').innerHTML=`
  <div><span>Patient Name</span>${name}</div>
  <div><span>SHRI ID</span>${shri}</div>
  <div><span>PMJAY ID</span><b style="color:#b91c1c">${pmjay}</b></div>
  <div><span>Age / Gender</span>${age} / ${gender}</div>
  <div><span>Phone</span>${phone}</div>
  <div><span>Diagnosis</span>${diagnosis}</div>
  <div><span>Doctor</span>${doctor}</div>
  <div><span>Admission Date</span>${admission}</div>
  <div><span>Discharge Date</span>${document.getElementById('disDate').value}</div>
  <div><span>Time Slot</span>${document.getElementById('timeFilter').value}</div>
 `;
 window.scrollTo({top: document.getElementById('detailBox').offsetTop, behavior:'smooth'});
}

function dischargeNow(){
 if(!selectedPatient){alert('Select patient first');return;}
 let date = document.getElementById('disDate').value;
 let time = document.getElementById('timeFilter').value;
 if(!date){alert('Select date');return;}
 let dis = getDischarged();
 let shri = selectedPatient.id||selectedPatient.ID||selectedPatient.sl_no||selectedPatient.SHRI||'';
 dis.push({id:shri, name:selectedPatient.name||selectedPatient.Name, pmjay:selectedPatient.pmjay||selectedPatient.PMJAY||'', date:date, time:time, discharged_at:new Date().toLocaleString()});
 localStorage.setItem('shija_discharged', JSON.stringify(dis));
 alert((selectedPatient.name||'Patient')+' discharged on '+date+' ('+time+')');
 location.href='index.html';
}

document.addEventListener('click',function(e){
 if(!e.target.closest('.search-wrap')) document.getElementById('suggest').style.display='none';
});
document.getElementById('timeFilter').addEventListener('change', showHints);
showHints();
</script>
</body></html>
