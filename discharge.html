<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discharge Patient - SHIJA</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Segoe UI',system-ui}
body{background:#f1f3f6;display:flex;flex-direction:column;min-height:100vh;color:#0f172a}
.top{height:64px;background:#0a1931;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:100}
.top h2{color:#fff;font-size:16px;font-weight:800}
.menuBtn{width:36px;height:36px;border-radius:8px;border:1.5px solid #1e2d55;background:#13264d;color:#fff;display:grid;place-items:center;cursor:pointer}
.menuBtn:hover{background:#1c3870}
.adBadge{display:flex;align-items:center;gap:8px;color:#fff}
.adCircle{width:30px;height:30px;border-radius:50%;background:#1a2a4f;color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;border:1.5px solid #2a3a6a}
.mainWrap{display:flex;flex:1;min-height:calc(100vh - 64px)}
.side{width:230px;min-width:230px;background:#0a1931;display:flex;flex-direction:column;justify-content:space-between;padding:16px 10px;position:fixed;left:0;top:64px;height:calc(100vh - 64px);transition:transform .3s ease;z-index:90;transform:translateX(0)}
.side.closed{transform:translateX(-100%)}
.menu{display:flex;flex-direction:column;gap:4px}
.menu a{padding:12px 14px;border-radius:10px;text-decoration:none;color:#8ea0c0;font-weight:600;font-size:14px}
.menu a.active{background:#1a56db;color:#fff;font-weight:700}
.menu a:hover{background:#13264d;color:#fff}
.sideBottom{border-top:1px solid #1a2a4f;padding:12px 10px;color:#6b7aa2;font-size:11px}
.sideOverlay{position:fixed;inset:0;top:64px;background:#0005;z-index:80;display:none}
.sideOverlay.show{display:block}
.content{flex:1;padding:16px 14px;max-width:1200px;width:100%;margin-left:230px;transition:margin .3s ease}
.content.full{margin-left:0;max-width:100%}
.headRow h1{font-size:32px;font-weight:900;letter-spacing:-1px;color:#0f1a34}
.bread{color:#6b7280;font-size:12px;margin-top:4px}
.card{background:#fff;border-radius:16px;box-shadow:0 10px 30px #00000008;border:1px solid #e5e7eb;padding:14px;margin-bottom:14px}
.boxRow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.box{flex:1;min-width:140px;background:#f8fafc;padding:10px 12px;border-radius:12px;border:1.5px solid #e5e7eb}
.box label{font-size:10px;font-weight:800;color:#0f172a;display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.box input,.box select{width:100%;padding:9px 10px;border:1.5px solid #e5e7eb;border-radius:8px;outline:0;font-size:13px;background:#fff;font-weight:600}
.search-wrap{position:relative;background:#fff;border-radius:12px;border:1.5px solid #e5e7eb;padding:12px 14px;margin:14px 0}
.search-wrap input{width:100%;padding:11px 12px;border:1.5px solid #e5e7eb;border-radius:10px;outline:0;font-size:13px;font-weight:600}
.suggest{position:absolute;left:14px;right:14px;top:56px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;max-height:280px;overflow-y:auto;z-index:20;box-shadow:0 12px 24px #0002;display:none}
.suggest div{padding:11px;border-bottom:1px solid #f1f5f9;cursor:pointer;font-size:12px}
.suggest div:hover{background:#eff6ff}
.count{font-size:11px;color:#64748b;margin-top:6px}
.list-box{background:#fff;border-radius:14px;box-shadow:0 4px 15px #00000008;margin-top:16px;overflow:hidden;border:1.5px solid #e5e7eb}
.list-head{padding:12px 14px;background:#f8fafc;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.tbl{width:100%;border-collapse:collapse;background:#fff}
.tbl th{background:#f8fafc;font-size:11px;color:#0f172a;padding:11px 8px;text-align:left;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid #e5e7eb;white-space:nowrap}
.tbl td{padding:11px 8px;font-size:12px;border-bottom:1px solid #f1f5f9}
.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#dbeafe;color:#1e40af;font-weight:700;font-size:11px;border:1px solid #bfdbfe}
.btn{padding:10px 16px;border:0;border-radius:10px;font-weight:800;cursor:pointer;font-size:13px}
.btn-save{background:#10b981;color:#fff}
.btn-edit{background:#0a1931;color:#fff}
