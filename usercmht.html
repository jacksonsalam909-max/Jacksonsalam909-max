const app2=initializeApp(firebaseConfig,"usercmhtMain_"+Math.random());const db2=getFirestore(app2);
let allPatients=[],filtered=[],currentPage=1,pageSize=12;
let photoCache={}, currentPhotoKey=null, currentPhotoShri=null;
function cleanKey(k){ return String(k).replace(/[^a-zA-Z0-9]/g,'_'); }
window.onSearch=()=>{currentPage=1;applyFilter();};
window.changePageSize=()=>{pageSize=parseInt(document.getElementById('pageSize').value);currentPage=1;renderAll();};
window.applyFilter=()=>{let q=document.getElementById('search').value.toLowerCase();filtered=allPatients.filter(p=>[p.name,p.shri,p.cmht,p.contact,p.aadhaar,p.addr].join(' ').toLowerCase().includes(q));renderAll();};
function getInitial(n){return (n||'P').trim().charAt(0).toUpperCase();}
async function getFullPhotoSmart(ukey){
  let c=cleanKey(ukey);
  try{
    let snap=await getDoc(doc(db2,"patient_photos",c+"_photo"));
    if(snap.exists()){
      let d=snap.data();
      if(d.full && d.full.length>100) return d.full;
      if(d.thumb && d.chunkCount===0) return d.thumb;
    }
    let snap2=await getDocs(collection(db2,"patient_photos",c+"_photo","chunks"));
    if(!snap2.empty){
      let arr=[]; snap2.forEach(d=>arr.push(d.data())); arr.sort((a,b)=>a.index-b.index);
      let full=arr.map(a=>a.data).join('');
      if(full) return full;
    }
    if(snap.exists() && snap.data().thumb) return snap.data().thumb;
  }catch(e){}
  return null;
}
window.openPhoto=async(ukey,shri,name)=>{
  currentPhotoKey=ukey; currentPhotoShri=shri;
  document.getElementById('photoName').textContent=name+' - '+shri;
  document.getElementById('photoView').src = photoCache[ukey+'_full'] || photoCache[ukey] || '';
  document.getElementById('photoModal').classList.add('show');
  let f=await getFullPhotoSmart(ukey);
  if(f){
    photoCache[ukey]=f; photoCache[ukey+'_full']=f;
    if(currentPhotoKey===ukey) document.getElementById('photoView').src=f;
    document.querySelectorAll(`.pCardAvatar[data-ukey="${CSS.escape(ukey)}"] img, .tAvatar[data-ukey="${CSS.escape(ukey)}"] img`).forEach(img=>img.src=f);
  }
}
window.closePhoto=()=>{ document.getElementById('photoModal').classList.remove('show'); }
async function loadPhotoCache(){
  let start=(currentPage-1)*pageSize;
  let pageData=filtered.slice(start,start+pageSize);
  let toLoad=pageData.filter(p=>!photoCache[p.key] && !p._photoLoading);
  if(toLoad.length===0) return;
  await Promise.all(toLoad.map(async p=>{
    p._photoLoading = true;
    let full = await getFullPhotoSmart(p.key);
    if(full){
      photoCache[p.key]=full; photoCache[p.key+'_full']=full;
      document.querySelectorAll(`.pCardAvatar[data-ukey="${CSS.escape(p.key)}"]`).forEach(el=>{
        if(!el.querySelector('img')) el.innerHTML = `<img src="${full}" style="width:100%;height:100%;object-fit:cover;display:block;border-radius:50%">`;
        else el.querySelector('img').src = full;
      });
      document.querySelectorAll(`.tAvatar[data-ukey="${CSS.escape(p.key)}"]`).forEach(el=>{
        if(!el.querySelector('img')) el.innerHTML = `<img src="${full}" style="width:100%;height:100%;object-fit:cover;display:block">`;
        else el.querySelector('img').src = full;
      });
    }
    p._photoLoading = false;
  }));
}
window.renderAll=()=>{
 let totalPages=Math.max(1,Math.ceil(filtered.length/pageSize));if(currentPage>totalPages)currentPage=totalPages;
 let start=(currentPage-1)*pageSize;let data=filtered.slice(start,start+pageSize);
 let gridHtml='';data.forEach((p,idx)=>{let ukey=p.key;let photo=photoCache[ukey];let avatar=photo?`<img src="${photo}">`:`${getInitial(p.name)}`;gridHtml+=`<div class="pCard"><div class="pCardBody"><div class="pCardAvatar" data-ukey="${ukey}" onclick="openPhoto('${ukey.replace(/'/g,"\\'")}','${(p.shri||'').replace(/'/g,"\\'")}','${(p.name||'').replace(/'/g,"\\'")}')">${avatar}</div><div class="pCardName">${p.name||'Unknown'}</div><div class="pCardSub">${p.addr||'No address'}</div><div class="pCardMeta"><div class="pCardRow2"><span>CMHT ID</span><b>${p.cmht||'-'}</b></div><div class="pCardRow2"><span>SHRI ID</span><b>${p.shri||'-'}</b></div><div class="pCardRow2"><span>Contact</span><b>${p.contact||'-'}</b></div></div></div></div>`;});
 if(!data.length) gridHtml='<div style="grid-column:1/-1;text-align:center;padding:40px;background:#fff;border-radius:16px;position:relative;z-index:2">No patients</div>';
 document.getElementById('patientGrid').innerHTML=gridHtml;
 let html='<tr><th>SL No</th><th>Patient Name</th><th>CMHT ID</th><th>SHRI ID</th><th>Contact</th><th>Photo</th><th>Aadhaar</th><th>Address</th></tr>';
 data.forEach((p,i)=>{let ukey=p.key;let photo=photoCache[ukey];let thumb=photo?`<img src="${photo}">`:`${getInitial(p.name)}`;html+=`<tr><td><div class="sl">${start+i+1}</div></td><td><b>${p.name}</b></td><td><span class="cmhtTable">${p.cmht}</span></td><td><span class="shriTable">${p.shri}</span></td><td>${p.contact}</td><td><div class="tAvatar" data-ukey="${ukey}" onclick="openPhoto('${ukey.replace(/'/g,"\\'")}','${(p.shri||'').replace(/'/g,"\\'")}','${(p.name||'').replace(/'/g,"\\'")}')">${thumb}</div></td><td>${p.aadhaar}</td><td class="addrCol">${p.addr}</td></tr>`;});
 if(!data.length) html+='<tr><td colspan="8" style="text-align:center;padding:20px">No patients</td></tr>';
 document.getElementById('tbl').innerHTML=html;
 document.getElementById('info').textContent=filtered.length+' CMHT patients • Page '+currentPage+' of '+totalPages;
 ['','Grid'].forEach(s=>{let pInfo=document.getElementById('pageInfo'+s);let prev=document.getElementById('prevBtn'+s);let next=document.getElementById('nextBtn'+s);let nums=document.getElementById('pageNums'+s);if(pInfo)pInfo.textContent='Page '+currentPage+' of '+totalPages;if(prev)prev.disabled=currentPage<=1;if(next)next.disabled=currentPage>=totalPages;if(nums){let n='';for(let i=1;i<=Math.min(totalPages,10);i++)n+=`<button class="pBtn" style="${i===currentPage?'background:#0f172a;color:#fff':''}" onclick="goPage(${i})">${i}</button>`;nums.innerHTML=n;}});
 setTimeout(loadPhotoCache,120);
};
window.prevPage=()=>{if(currentPage>1){currentPage--;renderAll();}};
window.nextPage=()=>{let totalPages=Math.ceil(filtered.length/pageSize);if(currentPage<totalPages){currentPage++;renderAll();}};
window.goPage=(n)=>{currentPage=n;renderAll();};
