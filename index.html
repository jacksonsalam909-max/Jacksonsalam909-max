<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name=viewport content="width=device-width,initial-scale=1"><title>SHIJA Dashboard - Login</title><script src="Patient.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{background:linear-gradient(135deg,#e0f2fe,#f0f9ff 40%,#fef3c7 100%);min-height:100vh}
#loginPage{position:fixed;inset:0;z-index:9999;background:#000 url('Shija_dome_night.jpeg') center/cover no-repeat;display:flex;align-items:center;justify-content:flex-end;padding-right:5vw}
#loginPage::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.15),rgba(0,0,0,.65))}
.loginBox{position:relative;z-index:2;width:440px;max-width:92vw;background:rgba(15,22,35,.38);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:24px}
.loginBox h2{color:#fff!important;font-size:30px!important}
.loginBox p{color:#c8d6e6!important;font-size:13px!important;margin-bottom:10px}
.loginBox input{background:rgba(0,0,0,.55)!important;border:1px solid rgba(255,255,255,.18)!important;border-radius:12px!important;padding:14px!important;color:#fff!important;width:100%;margin:8px 0}
.loginBtn{background:#f8d210!important;color:#111!important;border-radius:12px!important;padding:14px!important;font-weight:800!important;width:100%;cursor:pointer;border:0!important}
.top{background:linear-gradient(90deg,#0f4c75,#1e7bb8,#0f4c75);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.dash{max-width:1100px;margin:40px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:0 16px}
.card{padding:30px 20px;border-radius:20px;text-align:center;box-shadow:0 10px 25px #0001;color:#fff;cursor:pointer;text-decoration:none;display:block;transition:.3s}
.card:hover{transform:translateY(-6px)}
.card div{font-size:48px;margin-bottom:10px}
.card b{font-size:32px;display:block;font-weight:900}
.card span{font-size:14px;font-weight:600}
.card:nth-child(1){background:linear-gradient(135deg,#3b82f6,#1d4ed8)}
.card:nth-child(2){background:linear-gradient(135deg,#10b981,#059669)}
.card:nth-child(3){background:linear-gradient(135deg,#f59e0b,#d97706)}
.card:nth-child(4){background:linear-gradient(135deg,#8b5cf6,#6d28d9)}
.card:nth-child(5){background:linear-gradient(135deg,#ec4899,#be185d)}
@media(max-width:700px){.dash{grid-template-columns:repeat(2,1fr)} #loginPage{justify-content:center;padding-right:0}}
</style></head><body>
<!-- LOGIN PAGE - YOUR PREVIOUS NIGHT IMAGE LOGIN -->
<div id="loginPage">
<div class="loginBox">
<h2>SHIJA HOSPITALS</h2>
<p>Dialysis Dashboard Login</p>
<input id="l_user" placeholder="Username">
<input id="l_pass" type="password" placeholder="Password">
<button class="loginBtn" onclick="doLogin()">Login</button>
<p id="l_err" style="color:#ff6b6b!important;font-size:12px;margin-top:8px"></p>
<p style="font-size:11px!important;margin-top:12px;opacity:.7">Default: admin / admin123</p>
</div>
</div>

<!-- DASHBOARD HOME - ONLY SHOWS AFTER LOGIN -->
<div id="app" style="display:none">
<div class="top"><h2>🏥 SHIJA Dialysis Dashboard</h2><button onclick="doLogout()" style="padding:8px 14px;border:0;border-radius:8px;background:#fff;color:#0f4c75;font-weight:700;cursor:pointer">Logout</button></div>
<div style="max-width:1100px;margin:20px auto;padding:0 16px"><h2 style="color:#0f4c75">Welcome</h2><p style="color:#64748b">Click any card to open separate page</p></div>
<div class="dash">
<a href="total.html" class="card"><div>👥</div><b id="c_total">0</b><span>Total Patients</span></a>
<a href="add.html" class="card"><div>➕</div><b>Add New</b><span>Add Patient</span></a>
<a href="daily.html" class="card"><div>💉</div><b id="c_daily">0</b><span>Daily Dialysis</span></a>
<a href="kft.html" class="card"><div>🧪</div><b id="c_kft">0</b><span>KFT Report</span></a>
<a href="bill.html" class="card"><div>🧾</div><b>Bill</b><span>Bill Generator</span></a>
</div>
</div>

<script>
const DEFAULT_USER="admin", DEFAULT_PASS="admin123";
function doLogin(){
 let u=document.getElementById('l_user').value.trim();
 let p=document.getElementById('l_pass').value.trim();
 if(u===DEFAULT_USER && p===DEFAULT_PASS){
  localStorage.setItem('shija_logged','1');
  document.getElementById('loginPage').style.display='none';
  document.getElementById('app').style.display='block';
  updateCounts();
 }else{
  document.getElementById('l_err').textContent='❌ Wrong username or password!';
 }
}
function doLogout(){localStorage.removeItem('shija_logged'); location.reload();}
function updateCounts(){
 let excelRaw=(typeof patientData!=='undefined')?patientData:[]; 
 let daily=JSON.parse(localStorage.getItem('shija_daily')||'[]'); 
 let kft=JSON.parse(localStorage.getItem('shija_kft_entries')||'[]');
 let total=excelRaw.length + JSON.parse(localStorage.getItem('shija_patients')||'[]').length;
 document.getElementById('c_total').textContent=total;
 document.getElementById('c_daily').textContent=daily.length;
 document.getElementById('c_kft').textContent=kft.length;
}
// Auto login if already logged
if(localStorage.getItem('shija_logged')==='1'){
 document.getElementById('loginPage').style.display='none';
 document.getElementById('app').style.display='block';
 updateCounts();
}
</script></body></html>
