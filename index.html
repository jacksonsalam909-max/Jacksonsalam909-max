<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHIJA Dashboard - Home</title>
<script src="Patient.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{background:linear-gradient(135deg,#e0f2fe,#f0f9ff 40%,#fef3c7 100%);min-height:100vh}
.top{background:linear-gradient(90deg,#0f4c75,#1e7bb8,#0f4c75);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.dash{max-width:1100px;margin:40px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:0 16px}
.card{padding:30px 20px;border-radius:20px;text-align:center;box-shadow:0 10px 25px #0001;color:#fff;cursor:pointer;text-decoration:none;display:block;transition:.3s}
.card:hover{transform:translateY(-6px)}
.card div{font-size:48px;margin-bottom:10px}
.card b{font-size:32px;display:block;font-weight:900}
.card span{font-size:14px;font-weight:600}
.card:nth-child(1){background:linear-gradient(135deg,#3b82f6,#1d4ed8)}
.card:nth-child(2){background:linear-gradient(135deg,#10b981,#059669)}
.card:nth-child(3){background:linear-gradient(135deg,#f59e0b,#d97706)}
.card:nth-child(4){background:linear-gradient(135deg,#8b5cf6,#6d28d9)}
.card:nth-child(5){background:linear-gradient(135deg,#ec4899,#be185d)}
.card:nth-child(6){background:linear-gradient(135deg,#ef4444,#b91c1c)}
@media(max-width:700px){.dash{grid-template-columns:repeat(2,1fr)}}
.status{font-size:11px;color:#16a34a;background:#fff;padding:4px 8px;border-radius:20px}
</style>
</head>
<body>

<script>
if(localStorage.getItem('shija_logged')!=='1'){
  window.location.href='login.html';
}
function doLogout(){
  localStorage.removeItem('shija_logged');
  window.location.href='login.html';
}
</script>

<div class="top">
<h2>SHIJA Dialysis Dashboard - LIVE CLOUD</h2>
<div><span id="fbStatus" class="status">Connecting to Firebase...</span> <button onclick="doLogout()" style="padding:8px 14px;border:0;border-radius:8px;background:#fff;color:#0f4c75;font-weight:700;cursor:pointer;margin-left:8px">Logout</button></div>
</div>

<div style="max-width:1100px;margin:20px auto;padding:0 16px">
<h2 style="color:#0f4c75">Welcome</h2>
<p style="color:#64748b">Live counts from Firebase Cloud - Same on all phones!</p>
</div>

<div class="dash">
<a href="total.html" class="card"><div></div><b id="c_total">...</b><span>Total Patients (Cloud)</span></a>
<a href="add.html" class="card"><div></div><b>Add New</b><span>Add Patient</span></a>
<a href="daily.html" class="card"><div></div><b id="c_daily">...</b><span>Daily Dialysis (Cloud)</span></a>
<a href="kft.html" class="card"><div></div><b id="c_kft">...</b><span>KFT Report (Cloud)</span></a>
<a href="bill.html" class="card"><div></div><b id="c_bill">...</b><span>Bill Generator (Cloud)</span></a>
<a href="discharge.html" class="card"><div></div><b id="c_dis">...</b><span>Discharge Patient (Cloud)</span></a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const config = {
  apiKey: "AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",
  authDomain: "discharge-b9528.firebaseapp.com",
  projectId: "discharge-b9528",
  storageBucket: "discharge-b9528.firebasestorage.app",
  messagingSenderId: "1076050472607",
  appId: "1:1076050472607:web:736e0688a41462460efcaa"
};
const app = initializeApp(config);
const db = getFirestore(app);

async function loadCounts(){
 try{
  const [patients, daily, kft, bills, dis] = await Promise.all([
    getDocs(collection(db, "patients")),
    getDocs(collection(db, "daily_dialysis")),
    getDocs(collection(db, "kft_reports")),
    getDocs(collection(db, "bills")),
    getDocs(collection(db, "discharges"))
  ]);
  document.getElementById('c_total').textContent = patients.size;
  document.getElementById('c_daily').textContent = daily.size;
  document.getElementById('c_kft').textContent = kft.size;
  document.getElementById('c_bill').textContent = bills.size;
  document.getElementById('c_dis').textContent = dis.size;
  document.getElementById('fbStatus').innerText = `● Cloud: ${patients.size} patients | ${daily.size} dialysis | ${dis.size} discharge ✅`;
  document.getElementById('fbStatus').style.color = "#16a34a";
 }catch(e){
  document.getElementById('fbStatus').innerText = "● Error: "+e.message;
  // Fallback to local
  let excelRaw=(typeof patientData!=='undefined')?patientData:[]; 
  let daily=JSON.parse(localStorage.getItem('shija_daily')||'[]'); 
  let dis=JSON.parse(localStorage.getItem('shija_discharged')||'[]');
  let total=excelRaw.length + JSON.parse(localStorage.getItem('shija_patients')||'[]').length;
  document.getElementById('c_total').textContent=total||0; 
  document.getElementById('c_daily').textContent=daily.length; 
  document.getElementById('c_dis').textContent=dis.length;
  document.getElementById('c_kft').textContent="--";
  document.getElementById('c_bill').textContent="--";
 }
}
loadCounts();
</script>
</body>
</html>
