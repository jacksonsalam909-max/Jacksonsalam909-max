<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHIJA Dialysis Dashboard</title>
<script src="Patient.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{
  background: linear-gradient(135deg, #06182e 0%, #0a2a4a 25%, #0f4c75 55%, #1e7bb8 100%);
  min-height:100vh;
}
.top{background:linear-gradient(90deg,#082542,#0f4c75,#1a6fb0);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px #0003}
.top b{font-size:20px;letter-spacing:.3px}
.btn-out{background:#fff;color:#0a2a4a;border:0;padding:8px 16px;border-radius:20px;font-weight:800;cursor:pointer}
.wrap{max-width:900px;margin:20px auto;padding:0 14px}
h2{color:#ffffff;margin-bottom:18px;font-size:24px;font-weight:800;text-shadow:0 2px 4px #0003}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.card{border-radius:18px;padding:22px 18px;color:#fff;cursor:pointer;box-shadow:0 8px 20px #0004;transition:.2s;min-height:135px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:rgba(255,255,255,0.12);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.18)}
.card:hover{transform:translateY(-4px);background:rgba(255,255,255,0.18);box-shadow:0 12px 28px #0005}
.card h1{font-size:34px;margin-bottom:4px;font-weight:900}
.card p{font-size:15px;opacity:.95;font-weight:700}
.card small{font-size:12px;opacity:.85;margin-top:4px}
.blue{background:linear-gradient(135deg, rgba(37,99,235,0.9), rgba(30,64,175,0.9))}
.green{background:linear-gradient(135deg, rgba(16,185,129,0.9), rgba(4,120,87,0.9))}
.orange{background:linear-gradient(135deg, rgba(245,158,11,0.9), rgba(180,83,9,0.9))}
.purple{background:linear-gradient(135deg, rgba(139,92,246,0.9), rgba(91,33,182,0.9))}
.pink{background:linear-gradient(135deg, rgba(236,72,153,0.9), rgba(190,24,93,0.9))}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head><body>
<script>
if(localStorage.getItem('shija_logged')!=='1'){location.href='login.html'}
</script>
<div class="top"><b>SHIJA Dialysis Dashboard</b><button class="btn-out" onclick="localStorage.removeItem('shija_logged');location.href='login.html'">Logout</button></div>
<div class="wrap">
<h2>Welcome</h2>
<div class="grid">
<div class="card blue" onclick="location.href='total-patients.html'">
<h1>510</h1>
<p>Total Patients</p>
<small>View All Patients</small>
</div>
<div class="card green" onclick="location.href='add-patient.html'">
<h1>Add</h1>
<p>New</p>
<small>Add Patient</small>
</div>
<div class="card orange" onclick="location.href='daily-dialysis.html'">
<h1 id="dailyCount">0</h1>
<p>Daily Dialysis</p>
<small>Today's List</small>
</div>
<div class="card purple" onclick="location.href='kft.html'">
<h1 id="kftCount">0</h1>
<p>KFT Report</p>
<small>1st & 15th Report</small>
</div>
<div class="card pink" onclick="location.href='bill.html'">
<h1>Bill</h1>
<p>Billing</p>
<small>Patient Bills</small>
</div>
</div>
</div>
<script>
let daily=JSON.parse(localStorage.getItem('shija_daily')||'[]');
let today=new Date().toISOString().slice(0,10);
document.getElementById('dailyCount').textContent=daily.filter(x=>x.date===today).length;
let kftKeys=Object.keys(localStorage).filter(k=>k.startsWith('kft_')).length;
document.getElementById('kftCount').textContent=kftKeys?kftKeys:'0';
</script>
</body></html>
