<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" id="viewportMeta" content="width=device-width, initial-scale=1.0">
<title>SHIJA HOSPITALS DIALYSIS MANAGEMENT</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* ... (same CSS as before) ... */
.grid{display:grid;grid-template-columns:repeat(3,1fr) !important;gap:12px}
body.desktop-mode .grid{grid-template-columns:repeat(6,1fr) !important}
.viewSelect{height:38px;border-radius:12px;border:0;background:#fff;color:#0B1F4A;font-size:11px;font-weight:900;padding:0 10px}
.drawerSelect{margin-top:12px;width:100%;height:44px;border-radius:12px;border:0;background:#fff;color:#0B1F4A;font-size:12px;font-weight:900;padding:0 12px}
</style>
</head>
<body>
<div class="drawer" id="drawer">
<div class="drawerTop">
<b>SHIJA HOSPITALS</b><small>DIALYSIS MANAGEMENT</small>
<select id="viewModeDrawer" class="drawerSelect">
<option value="mobile">MOBILE VIEW - 3 Columns</option>
<option value="desktop">DESKTOP VIEW - 6 Columns</option>
</select>
</div>
...
</div>
<div class="app">
<div class="top">
<button id="menuBtn">☰</button>
<div class="hWrap"><div class="hTitle">SHIJA HOSPITALS</div></div>
<div class="topActions">
<select id="viewModeTop" class="viewSelect">
<option value="mobile">MOBILE</option>
<option value="desktop">DESKTOP</option>
</select>
<button id="refreshBtn">↻</button>
<button id="viewListBtn">VIEW LIST</button>
</div>
</div>
...
<div class="searchBar">
<div class="searchInputWrap">
<input type="text" id="searchName" class="searchInput" placeholder="Search by name or SHRI...">
<button id="clearSearch" class="clearSearch">✕</button>
</div>
<select id="filterBlock">...</select>
</div>
...
</div>
<script>
// Dropdown logic
let isDesktop = localStorage.getItem('gda_desktop') === '1';
function applyDesktop(state){
  isDesktop = state;
  if(isDesktop){
    document.body.classList.add('desktop-mode');
    viewModeTop.value='desktop'; viewModeDrawer.value='desktop';
    localStorage.setItem('gda_desktop','1');
  }else{
    document.body.classList.remove('desktop-mode');
    viewModeTop.value='mobile'; viewModeDrawer.value='mobile';
    localStorage.setItem('gda_desktop','0');
  }
}
viewModeTop.addEventListener('change', e=>applyDesktop(e.target.value==='desktop'));
viewModeDrawer.addEventListener('change', e=>{applyDesktop(e.target.value==='desktop'); setTimeout(()=>closeMenu(),350);});
</script>
</body>
</html>
