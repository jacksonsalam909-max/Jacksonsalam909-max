<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>GDA - DESIGN 11 SQUARE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;overflow:hidden}
body{background:#eef2f7;position:fixed;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
.app{width:100%;height:100vh;height:100dvh;display:flex;flex-direction:column;background:#eef2f7;overflow:hidden}
.top{flex-shrink:0;background:#fff;padding:12px 12px 10px;box-shadow:0 2px 12px rgba(0,0,0,0.06);z-index:10}
.hTitle{font-size:18px;font-weight:900;letter-spacing:-0.5px;color:#111}
.rowTop{display:flex;gap:8px;margin-top:10px}
.dateBox{flex:1;border:1.5px solid #111827;border-radius:12px;height:44px;display:flex;align-items:center;padding:0 10px;background:#fff}
.dateBox input,.dateBox select{border:0;width:100%;font-weight:700;font-size:13px;outline:none;background:transparent}
.count{background:#111827;color:#fff;border-radius:12px;height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:12px;font-weight:700;margin-top:8px}
.filter{padding:8px 12px;display:flex;gap:6px;overflow-x:auto;background:#f8fafc;border-bottom:1px solid #eee;flex-shrink:0}
.filter::-webkit-scrollbar{display:none}
.chip{height:32px;padding:0 12px;border-radius:100px;border:1.5px solid #e2e8f0;background:#fff;font-weight:700;font-size:10px;white-space:nowrap;flex-shrink:0;cursor:pointer}
.chip.on{background:#111827;color:#fff;border-color:#111827}
.scroll{flex:1;overflow-y:auto;padding:12px;background:#eef2f7;-webkit-overflow-scrolling:touch}

/* RESPONSIVE SQUARE GRID */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (orientation:landscape) and (max-height:600px){.grid{grid-template-columns:1fr 1fr 1fr;gap:10px}}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,1fr);gap:14px}}
@media (min-width:900px){.grid{grid-template-columns:repeat(4,1fr);gap:16px}.scroll{padding:20px}}
@media (min-width:1200px){.grid{grid-template-columns:repeat(5,1fr);gap:18px}}
@media (min-width:1600px){.grid{grid-template-columns:repeat(6,1fr);gap:20px}}

/* DESIGN 11 - EXACT */
.card{
background:#fff;
border-radius:18px;
aspect-ratio:1 / 1;
padding:14px 14px 12px;
display:flex;
flex-direction:column;
justify-content:space-between;
box-shadow:0 10px 24px rgba(15,23,42,0.08), 0 2px 8px rgba(15,23,42,0.06);
border:1px solid #fff;
position:relative;
overflow:hidden;
touch-action:manipulation;
}
.cardTop{display:flex;gap:12px;align-items:flex-start}
.avatarSq{width:68px;height:68px;border-radius:18px;background:#d1d5db;display:flex;align-items:center;justify-content:center;color:#9ca3af;font-weight:900;font-size:38px;flex-shrink:0}
.info{flex:1;min-width:0;padding-top:4px}
.name{font-size:14px;font-weight:900;color:#111827;text-transform:uppercase;line-height:1.15;letter-spacing:-0.3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sub{margin-top:6px;font-size:11px;font-weight:600;color:#6b7280;display:flex;align-items:center;gap:6px}
.sub span{white-space:nowrap}
.actions{display:flex;gap:14px;align-items:center;margin-top:auto;padding-top:12px;border-top:1px solid #f8fafc}
.toggleGroup{display:flex;align-items:center;gap:6px}
.toggleGroup .lab{font-size:8px;font-weight:800;letter-spacing:0.6px;color:#6b7280}
.switch{width:42px;height:24px;border-radius:100px;background:#e5e7eb;position:relative;transition:0.25s;cursor:pointer;flex-shrink:0}
.switch:after{content:'';width:18px;height:18px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:0.25s;box-shadow:0 2px 5px rgba(0,0,0,0.18)}
.switch.on{background:#22c55e;box-shadow:0 4px 10px rgba(34,197,94,0.25)}
.switch.on:after{left:21px}
.bottom{flex-shrink:0;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:6px 0 14px;box-shadow:0 -4px 16px rgba(0,0,0,0.03)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9px;font-weight:700;color:#9ca3af;cursor:pointer}
.tab.active{color:#111827}
.tab .ic{width:28px;height:28px;border-radius:10px;background:#f3f4f6;display:flex;align-items:center;justify-content:center;font-size:14px}
.tab.active .ic{background:#111827;color:#fff}
.pages{grid-column:1/-1;display:flex;justify-content:center;gap:6px;padding:12px 0;flex-wrap:wrap}
.pageBtn{min-width:40px;height:40px;border-radius:12px;border:1.5px solid #e5e7eb;background:#fff;font-weight:800;font-size:12px;cursor:pointer}
.pageBtn.active{background:#111827;color:#fff;border-color:#111827}
</style>
<script>
// BLOCK ZOOM FULLY
document.addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('gesturechange',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&(e.key=='+'||e.key=='-'||e.key=='0'||e.key=='='))e.preventDefault()});
let lastTouch=0;document.addEventListener('touchend',e=>{let now=Date.now();if(now-lastTouch<=300)e.preventDefault();lastTouch=now;},{passive:false});
</script>
</head>
<body>
<div class="app">
<div class="top">
<div style="display:flex;justify-content:space-between;align-items:center"><div class="hTitle">GDA APP</div><div style="display:flex;gap:6px"><button style="width:36px;height:36px;border-radius:10px;border:0;background:#f3f4f6;font-weight:800" onclick="loadData()">↻</button><button style="width:36px;height:36px;border-radius:10px;border:0;background:#111827;color:#fff;font-weight:800" onclick="openCompleted()">✓</button></div></div>
<div class="rowTop"><div class="dateBox"><input type="date" id="fDate"></div><div class="dateBox" style="max-width:105px"><select id="fType"><option value="PMJAY">PMJAY</option><option value="CMHT">CMHT</option></select></div></div>
<div class="count"><span id="cLeft">Loading</span><span id="cRight" style="background:#fff;color:#111827;padding:4px 10px;border-radius:100px;font-size:10px;font-weight:800">PENDING 0</span></div>
</div>
<div class="filter"><button class="chip on" data-time="">ALL</button><button class="chip" data-time="7:00 AM">7 AM</button><button class="chip" data-time="12:00 PM">12 PM</button><button class="chip" data-time="5:00 PM">5 PM</button><button class="chip" data-time="9:00 PM">9 PM</button><button class="chip" data-time="12:00 AM">12 AM</button><button class="chip" data-time="2:00 AM">2 AM</button></div>
<div style="padding:0 12px 6px;display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;color:#64748b;flex-shrink:0">BLOCK: <select id="filterBlock" style="border:1px solid #e2e8f0;background:#fff;padding:4px 10px;border-radius:100px;font-weight:700;font-size:10px"><option value="">All Block</option><option value="MAIN">MAIN</option><option value="ITOCHA">ITOCHA</option></select></div>
<div class="scroll" id="scroll"><div class="grid" id="grid"></div><div class="pages" id="pages"></div></div>
<div class="bottom"><div class="tab active"><div class="ic">◫</div>Home</div><div class="tab" onclick="openCompleted()"><div class="ic">✓</div>Done <span id="doneB" style="background:#ef4444;color:#fff;padding:1px 5px;border-radius:100px;font-size:8px">0</span></div><div class="tab" onclick="location.href='list.html'"><div class="ic">☰</div>List</div><div class="tab" onclick="loadData()"><div class="ic">↻</div>Sync</div></div>
</div>
<div id="completedModal" style="position:fixed;inset:0;background:rgba(15,23,42,0.45);backdrop-filter:blur(8px);display:none;z-index:200;align-items:flex-end;justify-content:center"><div style="background:#fff;width:100%;max-height:88vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column"><div style="padding:16px;display:flex;justify-content:space-between;border-bottom:1px solid #f1f5f9"><b>Completed</b><button onclick="closeCompleted()" style="width:32px;height:32px;border-radius:50%;border:0;background:#f3f4f6">✕</button></div><div id="completedBody" style="padding:12px;overflow:auto;display:grid;gap:10px;grid-template-columns:1fr 1fr"></div></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,getDoc,setDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app=initializeApp(cfg,"gda_"+Math.random());const db=getFirestore(app);window._fb={db,doc,getDoc,setDoc};
</script>
<script>
function getTodayIST(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
document.getElementById('fDate').value=new URLSearchParams(location.search).get('date')||getTodayIST();
let allPatients=[],statusMap={},activeTimeFilter='',currentPage=1,pageSize=30;
function normalizeTime(t){if(!t)return'';let s=String(t).toUpperCase().trim();let m=s.match(/(\d{1,2})(?::(\d{1,2}))?\s*([AP]M)?/);if(!m)return s;let h=parseInt(m[1]),mi=m[2]?m[2].padStart(2,'0'):'00',ap=m[3]||'';if(!ap){if(s.includes('AM'))ap='AM';else if(s.includes('PM'))ap='PM';}return ap?`${h}:${mi} ${ap}`:`${h}:${mi}`;}
async function loadData(){let d=document.getElementById('fDate').value,s=document.getElementById('fType').value,id=d+'_'+s;let snap=await window._fb.getDoc(window._fb.doc(window._fb.db,'daily_dialysis_lists',id));allPatients=snap.exists()?(snap.data().patients||[]):[];let sSnap=await window._fb.getDoc(window._fb.doc(window._fb.db,'daily_photo_opd',id));statusMap=sSnap.exists()?(sSnap.data().status||{}):{};currentPage=1;render();}
async function saveStatus(){let d=document.getElementById('fDate').value,s=document.getElementById('fType').value,id=d+'_'+s;await window._fb.setDoc(window._fb.doc(window._fb.db,'daily_photo_opd',id),{date:d,scheme:s,status:statusMap,updatedAt:new Date().toISOString()});}
function toggle(sh,type){if(!statusMap[sh])statusMap[sh]={photoTaken:false,opdDone:false};if(type==='photo')statusMap[sh].photoTaken=!statusMap[sh].photoTaken;else statusMap[sh].opdDone=!statusMap[sh].opdDone;saveStatus();let st=statusMap[sh];if(st.photoTaken&&st.opdDone){let el=document.getElementById('card_'+sh);if(el){el.style.transform='scale(0.85)';el.style.opacity='0';setTimeout(render,200);}}else render();}
function getInit(n){return (n||'A').charAt(0).toUpperCase();}
function getFiltered(){let tn=normalizeTime(activeTimeFilter);let bf=document.getElementById('filterBlock').value;return allPatients.filter(p=>{let sh=String(p.shri||'').toUpperCase();if(!sh)return false;if(activeTimeFilter&&normalizeTime(p.time)!==tn)return false;if(bf&&p.block!==bf)return false;let st=statusMap[sh]||{photoTaken:false,opdDone:false};if(st.photoTaken&&st.opdDone)return false;return true;});}
function render(){let grid=document.getElementById('grid');grid.innerHTML='';let filtered=getFiltered();let done=0;allPatients.forEach(p=>{let sh=String(p.shri||'').toUpperCase();let st=statusMap[sh];if(st&&st.photoTaken&&st.opdDone)done++;});let pages=Math.max(1,Math.ceil(filtered.length/pageSize));if(currentPage>pages)currentPage=pages;let items=filtered.slice((currentPage-1)*pageSize,currentPage*pageSize);items.forEach(p=>{let sh=String(p.shri||'').toUpperCase();let st=statusMap[sh]||{photoTaken:false,opdDone:false};let div=document.createElement('div');div.className='card';div.id='card_'+sh;div.innerHTML=`<div class="cardTop"><div class="avatarSq">${getInit(p.name)}</div><div class="info"><div class="name">${p.name}</div><div class="sub"><span>${p.time||''}</span><span>•</span><span>${p.block||'MAIN'}</span></div></div></div><div class="actions"><div class="toggleGroup"><span class="lab">PHOTO</span><div class="switch ${st.photoTaken?'on':''}" onclick="toggle('${sh}','photo')"></div></div><div class="toggleGroup"><span class="lab">OPD</span><div class="switch ${st.opdDone?'on':''}" onclick="toggle('${sh}','opd')"></div></div></div>`;grid.appendChild(div);});if(filtered.length===0)grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:40px;background:#fff;border-radius:18px;box-shadow:0 10px 24px rgba(0,0,0,0.08)">🎉 All done</div>`;let pg=document.getElementById('pages');pg.innerHTML='';if(pages>1){for(let i=1;i<=pages;i++){let b=document.createElement('button');b.className='pageBtn'+(i===currentPage?' active':'');b.innerText=i;b.onclick=()=>{currentPage=i;document.getElementById('scroll').scrollTo({top:0,behavior:'smooth'});render();};pg.appendChild(b);}}document.getElementById('cLeft').innerText=`${allPatients.length} patients • ${done} done`;document.getElementById('cRight').innerText=`PENDING ${filtered.length}`;document.getElementById('doneB').innerText=done;}
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');activeTimeFilter=c.dataset.time;currentPage=1;render();}));
document.getElementById('filterBlock').addEventListener('change',()=>{currentPage=1;render();});
document.getElementById('fDate').addEventListener('change',loadData);document.getElementById('fType').addEventListener('change',loadData);
function openCompleted(){let body=document.getElementById('completedBody');body.innerHTML='';allPatients.forEach(p=>{let sh=String(p.shri||'').toUpperCase();let st=statusMap[sh];if(!st||!(st.photoTaken&&st.opdDone))return;let d=document.createElement('div');d.className='card';d.innerHTML=`<div class="cardTop"><div class="avatarSq" style="background:#22c55e;color:#fff">${getInit(p.name)}</div><div class="info"><div class="name">${p.name}</div><div class="sub"><span>${p.time}</span><span>•</span><span>${p.block}</span></div></div></div><button onclick="bringBack('${sh}')" style="margin-top:auto;background:#111827;color:#fff;border:0;padding:8px;border-radius:100px;font-weight:800;font-size:10px;width:100%">UNDO</button>`;body.appendChild(d);});if(!body.innerHTML)body.innerHTML='<div style="grid-column:1/-1;text-align:center;color:#64748b;padding:20px">No completed</div>';document.getElementById('completedModal').style.display='flex';}
function closeCompleted(){document.getElementById('completedModal').style.display='none';}
function bringBack(sh){if(statusMap[sh]){statusMap[sh].photoTaken=false;statusMap[sh].opdDone=false;}saveStatus();render();openCompleted();}
window.addEventListener('load',loadData);
window.toggle=toggle;window.openCompleted=openCompleted;window.closeCompleted=closeCompleted;window.bringBack=bringBack;
window.addEventListener('orientationchange',()=>setTimeout(render,250));
</script>
</body>
</html>
