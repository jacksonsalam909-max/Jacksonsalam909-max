<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GDA TASK - FIXED</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,Arial;-webkit-tap-highlight-color:transparent}
body{background:#f6f7f9}
.header{padding:12px 14px 10px;background:#fff;position:sticky;top:0;z-index:100;border-bottom:1px solid #e2e8f0}
.titleRow{display:flex;justify-content:space-between;align-items:center}
.title{font-size:22px;font-weight:900;letter-spacing:-0.5px;color:#0f172a}
.sub{font-size:12px;color:#475569;margin-top:2px;font-weight:600}
.filterRow{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap;align-items:center}
.fBtn{padding:10px 16px;border-radius:30px;font-weight:800;font-size:12px;border:2px solid #e2e8f0;background:#fff;color:#64748b;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;min-height:42px}
.fBtn.active{background:#dbeafe;color:#1e40af;border-color:#93c5fd}
.infoTip{background:#e0f2fe;color:#0c4a6e;padding:10px 12px;border-radius:10px;font-size:12px;font-weight:700;margin-bottom:10px}
.content{max-width:700px;margin:0 auto;padding:0 10px 90px}
.card{background:#fff;border-radius:14px;padding:12px 12px 10px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,0.06);border:1px solid #f1f5f9;display:flex;gap:10px;align-items:center;position:relative}
.avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;color:#fff;flex-shrink:0}
.avatar.green{background:#22c55e}.avatar.orange{background:#f97316}.avatar.purple{background:#a855f7}.avatar.blue{background:#3b82f6}
.main{flex:1;min-width:0;padding-right:4px}
.name{font-size:14px;font-weight:800;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.meta{font-size:11px;color:#64748b;font-weight:600;margin-top:2px}
.statusCol{width:148px;flex-shrink:0;display:flex;flex-direction:column;gap:6px}
.statusRow{width:100%;display:flex;align-items:center;justify-content:space-between;background:#f8fafc;border-radius:30px;padding:4px 8px 4px 10px;border:1px solid #f1f5f9}
.sLabel{font-size:8px;font-weight:900;letter-spacing:0.3px;color:#475569;white-space:nowrap}
.toggle{width:52px;height:30px;border-radius:30px;background:#e2e8f0;position:relative;cursor:pointer;transition:0.3s;flex-shrink:0}
.toggle.on{background:#bbf7d0}
.toggleKnob{width:24px;height:24px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:0.3s;box-shadow:0 1px 4px rgba(0,0,0,0.2)}
.toggle.on .toggleKnob{left:25px;background:#22c55e}
.badgeTop{position:absolute;top:-6px;right:8px;font-size:8px;font-weight:900;padding:3px 8px;border-radius:20px}
.badgePending{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.badgeProgress{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
.badgeCompleted{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.footerBar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;z-index:100}
.inputBar{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.input{padding:10px;border:2px solid #0f172a;border-radius:10px;font-weight:800;font-size:13px;background:#fff;min-height:44px;flex:1}
.btnDark{background:#0f172a;color:#fff;padding:10px 14px;border-radius:10px;font-weight:900;font-size:11px;border:0;min-height:44px;cursor:pointer;white-space:nowrap}
.btnBlue{background:#1e40af;color:#fff;padding:10px 14px;border-radius:10px;font-weight:900;font-size:11px;border:0;min-height:44px;cursor:pointer}
.chipRow{display:flex;gap:6px;overflow:auto;margin-bottom:8px;padding-bottom:4px}
.chip{padding:8px 12px;border-radius:30px;font-weight:800;font-size:11px;border:2px solid #e2e8f0;background:#fff;white-space:nowrap;cursor:pointer}
.chip.active{background:#0f172a;color:#fff}
.menuBtn{font-size:24px;background:none;border:0;cursor:pointer;padding:4px}
</style>
</head>
<body>
<script>if(localStorage.getItem('shija_logged')!=='1'){location.href='login.html'}</script>

<div class="header">
<div class="titleRow">
<div style="display:flex;align-items:center;gap:8px"><button class="menuBtn" id="menuBtn">☰</button><div><div class="title">Dialysis Patient Checklist</div><div class="sub" id="subTitle">Today • Fri, 23 Oct 2026</div></div></div>
<div style="display:flex;gap:6px"><button class="btnBlue" onclick="openCompleted()" id="viewCompletedBtn">VIEW DONE (0)</button><button class="btnDark" onclick="location.href='list.html'">LIST</button></div>
</div>

<div class="inputBar">
<input type="date" id="fDate" class="input"><select id="fType" class="input" style="max-width:110px"><option value="PMJAY">PMJAY</option><option value="CMHT">CMHT</option></select><button class="btnDark" onclick="loadData()">LOAD</button>
</div>

<div class="filterRow">
<button class="fBtn active">◷ Time</button>
<button class="fBtn">▦ Block</button>
<select id="filterBlock" class="fBtn" style="padding:8px 12px"><option value="">All Block</option><option value="MAIN">MAIN</option><option value="ITOCHA">ITOCHA</option></select>
</div>

<div class="chipRow" id="timeChips">
<button class="chip active" data-time="">ALL</button>
<button class="chip" data-time="7:00 AM">7 AM</button>
<button class="chip" data-time="12:00 PM">12 PM</button>
<button class="chip" data-time="5:00 PM">5 PM</button>
<button class="chip" data-time="9:00 PM">9 PM</button>
<button class="chip" data-time="12:00 AM">12 AM</button>
<button class="chip" data-time="2:00 AM">2 AM</button>
</div>

<div class="infoTip">✨ Completed patients disappear automatically → Click VIEW DONE to see list</div>
</div>

<div class="content" id="list"></div>

<div class="footerBar">
<div style="font-size:12px;font-weight:700;color:#475569" id="footerCount">0 patients • 0 completed • 0 pending</div>
<div style="font-size:12px;color:#2563eb;font-weight:800;cursor:pointer" onclick="loadData()">↻ Sync now</div>
</div>

<div id="completedModal" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:none;z-index:9999;align-items:flex-end;justify-content:center">
<div style="background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:700px;max-height:85vh;overflow:hidden;display:flex;flex-direction:column">
<div style="padding:14px;background:#0f172a;color:#fff;display:flex;justify-content:space-between;align-items:center"><span style="font-weight:900;font-size:14px">COMPLETED LIST - <span id="completedCount">0</span></span><button class="btnDark" style="background:#fff;color:#000" onclick="closeCompleted()">CLOSE</button></div>
<div style="padding:10px;overflow:auto" id="completedBody"></div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app=initializeApp(firebaseConfig,"gda_"+Math.random());const db=getFirestore(app);window._fb={db,doc,setDoc,getDoc};
</script>
<script>
function getTodayIST(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
let urlParams=new URLSearchParams(window.location.search);
document.getElementById('fDate').value=urlParams.get('date')||getTodayIST();
document.getElementById('fType').value=urlParams.get('scheme')||'PMJAY';
let allPatients=[],statusMap={},activeTimeFilter='';
function normalizeTime(t){if(!t) return '';let s=String(t).toUpperCase().trim().replace(/\s+/g,' ').replace(/\./g,'');let m=s.match(/(\d{1,2})(?::(\d{1,2}))?\s*([AP]M)?/);if(!m) return s;let h=parseInt(m[1]), mi=m[2]?m[2].padStart(2,'0'):'00', ap=m[3]||''; if(!ap){if(s.includes('AM'))ap='AM'; else if(s.includes('PM'))ap='PM';}if(ap) return `${h}:${mi} ${ap}`; return `${h}:${mi}`;}
async function loadData(){
  let date=document.getElementById('fDate').value,scheme=document.getElementById('fType').value;
  try{
    let docId=date+'_'+scheme;
    let snap=await window._fb.getDoc(window._fb.doc(window._fb.db,'daily_dialysis_lists',docId));
    allPatients=snap.exists()?(snap.data().patients||[]):[];
    let statusSnap=await window._fb.getDoc(window._fb.doc(window._fb.db,'daily_photo_opd',docId));
    statusMap=statusSnap.exists()?(statusSnap.data().status||{}):{};
    renderTable();
  }catch(e){console.log(e)}
}
async function saveStatus(){let date=document.getElementById('fDate').value,scheme=document.getElementById('fType').value,docId=date+'_'+scheme;try{await window._fb.setDoc(window._fb.doc(window._fb.db,'daily_photo_opd',docId),{date,scheme,status:statusMap,updatedAt:new Date().toISOString()});}catch(e){}}
function togglePhoto(shri){
  if(!statusMap[shri])statusMap[shri]={photoTaken:false,opdDone:false};
  statusMap[shri].photoTaken=!statusMap[shri].photoTaken;saveStatus();
  let st=statusMap[shri];if(st.photoTaken&&st.opdDone){let el=document.getElementById('card_'+shri);if(el){el.style.transform='translateX(100%)';el.style.opacity='0';setTimeout(()=>renderTable(),350);}}else renderTable();
}
function toggleOpd(shri){
  if(!statusMap[shri])statusMap[shri]={photoTaken:false,opdDone:false};
  statusMap[shri].opdDone=!statusMap[shri].opdDone;saveStatus();
  let st=statusMap[shri];if(st.photoTaken&&st.opdDone){let el=document.getElementById('card_'+shri);if(el){el.style.transform='translateX(100%)';el.style.opacity='0';setTimeout(()=>renderTable(),350);}}else renderTable();
}
function getInitials(name){return (name||'A').trim().charAt(0).toUpperCase();}
function getColorClass(name){let c=['green','orange','purple','blue'];let hash=name.charCodeAt(0)||0;return c[hash%4];}
function renderTable(){
  let list=document.getElementById('list');list.innerHTML='';let pending=0,completed=0;
  let timeNorm=normalizeTime(activeTimeFilter);let blockFilter=document.getElementById('filterBlock').value;
  allPatients.forEach((p)=>{
    let shri=String(p.shri||'').toUpperCase();if(!shri)return;
    if(activeTimeFilter){if(normalizeTime(p.time)!==timeNorm) return;}
    if(blockFilter && p.block!==blockFilter) return;
    let st=statusMap[shri]||{photoTaken:false,opdDone:false};
    if(st.photoTaken&&st.opdDone){completed++;return;}
    pending++;
    let badge='',bClass='';
    if(st.photoTaken||st.opdDone){badge='IN PROGRESS';bClass='badgeProgress';}else{badge='PENDING';bClass='badgePending';}
    let div=document.createElement('div');div.className='card';div.id='card_'+shri;div.style.transition='all 0.35s';
    div.innerHTML=`
      <div class="badgeTop ${bClass}">${badge}</div>
      <div class="avatar ${getColorClass(p.name)}">${getInitials(p.name)}</div>
      <div class="main">
        <div class="name">${p.name||''}</div>
        <div class="meta">${p.time||''} • Block ${p.block||''}</div>
      </div>
      <div class="statusCol">
        <div class="statusRow"><span class="sLabel">PHOTO TAKEN</span><div class="toggle ${st.photoTaken?'on':''}" onclick="togglePhoto('${shri}')"><div class="toggleKnob"></div></div></div>
        <div class="statusRow"><span class="sLabel">OPD DONE</span><div class="toggle ${st.opdDone?'on':''}" onclick="toggleOpd('${shri}')"><div class="toggleKnob"></div></div></div>
      </div>`;
    list.appendChild(div);
  });
  if(pending===0){list.innerHTML=`<div style="text-align:center;padding:30px;background:#fff;border-radius:14px;font-weight:700;color:#64748b">🎉 All done<br>Filter: ${activeTimeFilter||'ALL'} ${blockFilter||''}</div>`;}
  document.getElementById('footerCount').innerText=`${allPatients.length} patients • ${completed} completed • ${pending} pending`;
  document.getElementById('viewCompletedBtn').innerText=`VIEW DONE (${completed})`;
  document.getElementById('completedCount').innerText=completed;
}
document.querySelectorAll('.chip').forEach(chip=>{
  chip.addEventListener('click',()=>{document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));chip.classList.add('active');activeTimeFilter=chip.dataset.time;renderTable();});
});
document.getElementById('filterBlock').addEventListener('change',renderTable);
document.getElementById('fDate').addEventListener('change',loadData);
document.getElementById('fType').addEventListener('change',loadData);
function openCompleted(){
  let body=document.getElementById('completedBody');body.innerHTML='';
  allPatients.forEach((p)=>{
    let shri=String(p.shri||'').toUpperCase();let st=statusMap[shri];if(!st||!(st.photoTaken&&st.opdDone))return;
    let div=document.createElement('div');div.className='card';
    div.innerHTML=`<div class="avatar green">${getInitials(p.name)}</div><div class="main"><div class="name">${p.name}</div><div class="meta">${p.time} • Block ${p.block}</div></div><button class="btnDark" onclick="bringBack('${shri}')">BRING BACK</button>`;
    body.appendChild(div);
  });
  if(body.innerHTML==='')body.innerHTML='<div style="padding:20px;text-align:center;color:#64748b">No completed yet</div>';
  document.getElementById('completedModal').style.display='flex';
}
function closeCompleted(){document.getElementById('completedModal').style.display='none';}
function bringBack(shri){if(statusMap[shri]){statusMap[shri].photoTaken=false;statusMap[shri].opdDone=false;}saveStatus();renderTable();openCompleted();}
document.getElementById('menuBtn').addEventListener('click',()=>{location.href='list.html';});
window.addEventListener('load',loadData);
</script>
</body>
</html>
