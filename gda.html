<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>GDA APP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial}
body{background:#f2f4f7}
.app{max-width:480px;margin:0 auto;background:#f2f4f7;min-height:100vh;padding-bottom:90px}
.header{background:#fff;padding:12px 14px;border-bottom:1px solid #eef0f3;position:sticky;top:0;z-index:50}
.hTop{display:flex;justify-content:space-between;align-items:center}
.hTitle{font-size:18px;font-weight:900;letter-spacing:-0.5px}
.hBtns{display:flex;gap:8px}
.hBtn{width:40px;height:40px;border-radius:12px;border:0;background:#f1f5f9;font-size:18px;font-weight:900;cursor:pointer}
.hBtn.blue{background:#1e40af;color:#fff}
.dateRow{display:flex;gap:8px;margin-top:10px}
.dateBox{flex:1;border:2px solid #0f172a;border-radius:12px;padding:0 12px;height:44px;display:flex;align-items:center;background:#fff}
.dateBox input,.dateBox select{border:0;width:100%;font-weight:800;font-size:13px;background:transparent;outline:none}
.countBar{margin-top:10px;background:#0f172a;color:#fff;border-radius:12px;height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-weight:800;font-size:13px}
.countBar span:last-child{background:#fff;color:#0f172a;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:900}

.filter{background:#fff;margin:12px;border-radius:16px;padding:12px 14px}
.fLabel{font-size:11px;font-weight:900;color:#64748b;letter-spacing:0.5px;margin-bottom:8px}
.chips{display:flex;gap:8px;overflow:auto}
.chips::-webkit-scrollbar{display:none}
.chip{height:36px;padding:0 16px;border-radius:100px;border:2px solid #e2e8f0;background:#fff;font-weight:800;font-size:12px;white-space:nowrap;cursor:pointer;flex-shrink:0}
.chip.on{background:#0f172a;color:#fff;border-color:#0f172a}
.blockRow{margin-top:10px;display:flex;gap:8px;align-items:center;font-size:12px;font-weight:800;color:#64748b}
.blockSel{border:0;background:#f1f5f9;padding:6px 12px;border-radius:20px;font-weight:800;font-size:12px}

.list{padding:0 12px}
.card{background:#fff;border-radius:18px;padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:10px;position:relative;box-shadow:0 1px 2px rgba(0,0,0,0.05)}
.avatar{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:20px;flex-shrink:0}
.info{flex:1;min-width:0}
.name{font-size:14px;font-weight:800;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{margin-top:4px;display:flex;gap:6px}
.tag{background:#f1f5f9;color:#64748b;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px}
.pending{position:absolute;top:8px;right:10px;background:#fee2e2;color:#dc2626;font-size:8px;font-weight:900;padding:3px 8px;border-radius:20px;letter-spacing:0.4px}

.actions{width:132px;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.aBtn{width:100%;height:38px;border-radius:10px;border:2px solid #e2e8f0;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 10px;cursor:pointer}
.aBtn .l{font-size:10px;font-weight:900;color:#475569}
.aBtn .t{width:36px;height:20px;border-radius:20px;background:#e2e8f0;position:relative;transition:0.2s}
.aBtn .t::after{content:'';width:16px;height:16px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:0.2s;box-shadow:0 1px 2px rgba(0,0,0,0.2)}
.aBtn.on{background:#dcfce7;border-color:#86efac}
.aBtn.on .t{background:#22c55e}
.aBtn.on .t::after{left:18px}
.aBtn.on .l{color:#166534}

.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #e2e8f0;display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,0.06);z-index:100}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;color:#94a3b8;cursor:pointer}
.tab.active{color:#0f172a}
.tab .ic{width:28px;height:28px;border-radius:10px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:16px}
.tab.active .ic{background:#0f172a;color:#fff}
</style>
</head>
<body>
<div class="app">
<div class="header">
<div class="hTop"><div class="hTitle">GDA APP</div><div class="hBtns"><button class="hBtn" onclick="loadData()">↻</button><button class="hBtn blue" onclick="openCompleted()">✓</button></div></div>
<div class="dateRow"><div class="dateBox"><input type="date" id="fDate"></div><div class="dateBox" style="max-width:110px"><select id="fType"><option value="PMJAY">PMJAY</option><option value="CMHT">CMHT</option></select></div></div>
<div class="countBar"><span id="cLeft">101 patients • 64 done</span><span id="cRight">PENDING 37</span></div>
</div>

<div class="filter">
<div class="fLabel">FILTER BY TIME</div>
<div class="chips" id="timeChips">
<button class="chip on" data-time="">ALL</button><button class="chip" data-time="7:00 AM">7 AM</button><button class="chip" data-time="12:00 PM">12 PM</button><button class="chip" data-time="5:00 PM">5 PM</button><button class="chip" data-time="9:00 PM">9 PM</button><button class="chip" data-time="12:00 AM">12 AM</button><button class="chip" data-time="2:00 AM">2 AM</button>
</div>
<div class="blockRow">BLOCK: <select id="filterBlock" class="blockSel"><option value="">All Block</option><option value="MAIN">MAIN</option><option value="ITOCHA">ITOCHA</option></select></div>
</div>

<div class="list" id="list"></div>

<div class="bottom">
<div class="tab active"><div class="ic">◫</div>Home</div>
<div class="tab" onclick="openCompleted()"><div class="ic">✓</div>Done <span id="doneB" style="background:#ef4444;color:#fff;padding:2px 6px;border-radius:20px;font-size:9px">0</span></div>
<div class="tab" onclick="location.href='list.html'"><div class="ic">☰</div>List</div>
<div class="tab" onclick="loadData()"><div class="ic">↻</div>Sync</div>
</div>
</div>

<div id="completedModal" style="position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;z-index:200;align-items:flex-end;justify-content:center">
<div style="background:#fff;width:100%;max-width:480px;max-height:85vh;border-radius:24px 24px 0 0;display:flex;flex-direction:column">
<div style="padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f1f5f9"><b>Completed</b><button onclick="closeCompleted()" style="width:32px;height:32px;border-radius:50%;border:0;background:#f1f5f9">✕</button></div>
<div id="completedBody" style="padding:12px;overflow:auto"></div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app=initializeApp(firebaseConfig,"gda_"+Math.random());const db=getFirestore(app);window._fb={db,doc,setDoc,getDoc};
</script>
<script>
function getTodayIST(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
document.getElementById('fDate').value=new URLSearchParams(location.search).get('date')||getTodayIST();
document.getElementById('fType').value=new URLSearchParams(location.search).get('scheme')||'PMJAY';
let allPatients=[],statusMap={},activeTimeFilter='';
function normalizeTime(t){if(!t) return '';let s=String(t).toUpperCase().trim().replace(/\s+/g,' ').replace(/\./g,'');let m=s.match(/(\d{1,2})(?::(\d{1,2}))?\s*([AP]M)?/);if(!m) return s;let h=parseInt(m[1]), mi=m[2]?m[2].padStart(2,'0'):'00', ap=m[3]||''; if(!ap){if(s.includes('AM'))ap='AM'; else if(s.includes('PM'))ap='PM';}if(ap) return `${h}:${mi} ${ap}`; return `${h}:${mi}`;}
async function loadData(){
 let date=document.getElementById('fDate').value,scheme=document.getElementById('fType').value;
 let docId=date+'_'+scheme;
 let snap=await window._fb.getDoc(window._fb.doc(window._fb.db,'daily_dialysis_lists',docId));
 allPatients=snap.exists()?(snap.data().patients||[]):[];
 let sSnap=await window._fb.getDoc(window._fb.doc(window._fb.db,'daily_photo_opd',docId));
 statusMap=sSnap.exists()?(sSnap.data().status||{}):{};
 renderTable();
}
async function saveStatus(){let d=document.getElementById('fDate').value,s=document.getElementById('fType').value,docId=d+'_'+s;await window._fb.setDoc(window._fb.doc(window._fb.db,'daily_photo_opd',docId),{date:d,scheme:s,status:statusMap,updatedAt:new Date().toISOString()});}
function togglePhoto(sh){if(!statusMap[sh])statusMap[sh]={photoTaken:false,opdDone:false};statusMap[sh].photoTaken=!statusMap[sh].photoTaken;saveStatus();let st=statusMap[sh];if(st.photoTaken&&st.opdDone){let el=document.getElementById('card_'+sh);if(el){el.style.transform='translateX(120%)';el.style.opacity='0';setTimeout(renderTable,280);}}else renderTable();}
function toggleOpd(sh){if(!statusMap[sh])statusMap[sh]={photoTaken:false,opdDone:false};statusMap[sh].opdDone=!statusMap[sh].opdDone;saveStatus();let st=statusMap[sh];if(st.photoTaken&&st.opdDone){let el=document.getElementById('card_'+sh);if(el){el.style.transform='translateX(120%)';el.style.opacity='0';setTimeout(renderTable,280);}}else renderTable();}
function getInit(n){return (n||'A').charAt(0).toUpperCase();}
function getCol(n){let c=['#ef4444','#22c55e','#a855f7','#3b82f6','#f97316','#06b6d4'];return c[(n.charCodeAt(0)||0)%c.length];}
function renderTable(){
 let list=document.getElementById('list');list.innerHTML='';let pending=0,completed=0;
 let tn=normalizeTime(activeTimeFilter);let bf=document.getElementById('filterBlock').value;
 allPatients.forEach(p=>{
  let sh=String(p.shri||'').toUpperCase();if(!sh)return;
  if(activeTimeFilter&&normalizeTime(p.time)!==tn)return;
  if(bf&&p.block!==bf)return;
  let st=statusMap[sh]||{photoTaken:false,opdDone:false};
  if(st.photoTaken&&st.opdDone){completed++;return;}
  pending++;
  let div=document.createElement('div');div.className='card';div.id='card_'+sh;div.style.transition='all 0.28s';
  div.innerHTML=`<span class="pending">PENDING</span><div class="avatar" style="background:${getCol(p.name)}">${getInit(p.name)}</div><div class="info"><div class="name">${p.name}</div><div class="tags"><span class="tag">${p.time}</span><span class="tag">Block ${p.block}</span></div></div><div class="actions"><button class="aBtn ${st.photoTaken?'on':''}" onclick="togglePhoto('${sh}')"><span class="l">PHOTO</span><span class="t"></span></button><button class="aBtn ${st.opdDone?'on':''}" onclick="toggleOpd('${sh}')"><span class="l">OPD</span><span class="t"></span></button></div>`;
  list.appendChild(div);
 });
 if(pending===0)list.innerHTML=`<div style="text-align:center;padding:30px;background:#fff;border-radius:18px;margin-top:8px"><b>🎉 All done</b></div>`;
 document.getElementById('cLeft').innerText=`${allPatients.length} patients • ${completed} done`;
 document.getElementById('cRight').innerText=`PENDING ${pending}`;
 document.getElementById('doneB').innerText=completed;
}
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');activeTimeFilter=c.dataset.time;renderTable();}));
document.getElementById('filterBlock').addEventListener('change',renderTable);
document.getElementById('fDate').addEventListener('change',loadData);
document.getElementById('fType').addEventListener('change',loadData);
function openCompleted(){
 let body=document.getElementById('completedBody');body.innerHTML='';
 allPatients.forEach(p=>{let sh=String(p.shri||'').toUpperCase();let st=statusMap[sh];if(!st||!(st.photoTaken&&st.opdDone))return;let d=document.createElement('div');d.className='card';d.innerHTML=`<div class="avatar" style="background:#22c55e">${getInit(p.name)}</div><div class="info"><div class="name">${p.name}</div><div class="tags"><span class="tag">${p.time}</span><span class="tag">${p.block}</span></div></div><button onclick="bringBack('${sh}')" style="background:#0f172a;color:#fff;border:0;padding:8px 12px;border-radius:10px;font-weight:800;font-size:11px">UNDO</button>`;body.appendChild(d);});
 if(!body.innerHTML)body.innerHTML='<div style="padding:30px;text-align:center;color:#64748b">No completed</div>';
 document.getElementById('completedModal').style.display='flex';
}
function closeCompleted(){document.getElementById('completedModal').style.display='none';}
function bringBack(sh){if(statusMap[sh]){statusMap[sh].photoTaken=false;statusMap[sh].opdDone=false;}saveStatus();renderTable();openCompleted();}
window.addEventListener('load',loadData);
</script>
</body>
</html>
