<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" id="viewportMeta" content="width=device-width, initial-scale=1.0">
<title>SHIJA HOSPITALS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,sans-serif}
html,body{height:100%}
body{background:#e9eef6;min-height:100dvh;display:flex;flex-direction:column}
.top{position:fixed;top:0;left:0;right:0;z-index:100;background:linear-gradient(135deg,#0B1F4A,#12367F);padding:12px;color:#fff;display:flex;align-items:center;gap:10px;height:58px}
.menuBtn{width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,0.18);color:#fff;font-size:22px;font-weight:900}
.hWrap{flex:1}.hTitle{font-size:13px;font-weight:900}.hSub{font-size:9px;opacity:0.8}
.topActions{display:flex;gap:8px}
.viewDropdown{height:38px;border-radius:12px;border:0;background:#fff;color:#0B1F4A;font-size:11px;font-weight:900;padding:0 12px}
.btnViewList{height:38px;padding:0 14px;border-radius:12px;border:0;background:#fff;color:#0B1F4A;font-size:11px;font-weight:900}
.app{padding-top:58px;display:flex;flex-direction:column;flex:1;min-height:100dvh;width:100%}
.rowTop{display:flex;gap:8px;margin-top:10px}
.dateBox{flex:1;border-radius:14px;height:46px;display:flex;align-items:center;padding:0 12px;background:#fff}
.dateBox input,.dateBox select{border:0;width:100%;font-weight:700;font-size:13px;outline:none;background:transparent;color:#0B1F4A}
.count{margin-top:10px;background:rgba(255,255,255,0.15);border-radius:14px;height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:12px;font-weight:700;color:#fff;border:1px solid rgba(255,255,255,0.15)}
.count span:last-child{background:#fff;color:#0B1F4A;padding:6px 12px;border-radius:100px;font-size:11px;font-weight:800}
.filter{padding:10px 12px;display:flex;gap:8px;overflow-x:auto;background:#fff;position:sticky;top:58px;z-index:5;border-bottom:1px solid #e2e8f0;width:100%}
.filter::-webkit-scrollbar{display:none}
.chip{height:36px;padding:0 16px;border-radius:100px;border:1.5px solid #d0d9ea;background:#f4f7fd;font-weight:800;font-size:11px;white-space:nowrap;color:#4a5f85;flex-shrink:0}
.chip.on{background:#0B1F4A;color:#fff;border-color:#0B1F4A}
.searchBar{padding:10px 12px;display:flex;gap:8px;background:#fff;border-bottom:1px solid #e2e8f0;align-items:center;position:sticky;top:108px;z-index:5}
.searchInputWrap{flex:1;position:relative;display:flex;align-items:center}
.searchInput{width:100%;height:42px;border:1.5px solid #d0d9ea;background:#f4f7fd;padding:0 14px;border-radius:100px;font-weight:700;font-size:13px;color:#0B1F4A;outline:none}
.clearSearch{position:absolute;right:8px;width:26px;height:26px;border-radius:50%;border:0;background:#dde4f0;display:none}
.searchMeta{padding:8px 12px;background:#e9eef6;font-size:10px;font-weight:700;color:#5a7196;display:flex;justify-content:space-between;position:sticky;top:160px;z-index:5}
.viewIconSingle{width:42px;height:42px;border-radius:100px;border:1.5px solid #d0d9ea;background:#f4f7fd;display:flex;align-items:center;justify-content:center}
.viewIconSingle svg{width:20px;height:20px}
.viewIconSingle svg rect{stroke:#0B1F4A;stroke-width:2.2;fill:none}
.viewIconSingle svg line{stroke:#0B1F4A;stroke-width:2.6;stroke-linecap:round}
.scroll{flex:1;display:flex;flex-direction:column;background:#e9eef6;padding:12px;min-height:calc(100dvh - 320px)}
.grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr) !important;gap:12px;width:100%;align-content:stretch;grid-auto-rows:1fr}
.grid.listView{grid-template-columns:1fr !important;grid-auto-rows:auto !important;align-content:start !important;flex:0 0 auto !important;min-height:auto !important}
.grid.desktopView{grid-template-columns:repeat(6,1fr) !important}
.grid.listView.desktopView{grid-template-columns:1fr !important}
.card{background:#fff;border-radius:20px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;border:0;box-shadow:0 8px 24px rgba(11,31,74,0.06), 0 2px 8px rgba(11,31,74,0.04);height:100%;min-height:0}
.cardTop{display:flex;gap:12px;align-items:flex-start}
.avatarSq{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:22px;flex-shrink:0;box-shadow:0 6px 14px rgba(0,0,0,0.15)}
.info{flex:1;min-width:0;overflow:hidden;padding-top:1px}
.name{font-size:16px;font-weight:900;color:#0B1F4A;text-transform:uppercase;line-height:1.22;white-space:normal;word-break:break-word;display:block;min-height:40px}
.sub{margin-top:6px;font-size:12px;font-weight:700;color:#6f84a8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{margin-top:14px;display:flex;flex-direction:column;gap:11px}
.toggleRow{display:flex;align-items:center;justify-content:space-between;width:100%}
.lab{font-size:13px;font-weight:800;color:#0B1F4A}
.switch{width:58px;height:32px;border-radius:100px;background:#dfe6f3;position:relative;cursor:pointer;flex-shrink:0;transition:.25s}
.switch:after{content:'';width:26px;height:26px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:.25s;box-shadow:0 2px 6px rgba(0,0,0,0.18)}
.switch.on{background:linear-gradient(135deg,#22c55e,#16a34a)}
.switch.on:after{left:29px}

/* LIST - FIX HUGE WHITE GAP FROM YOUR PHOTO */
.card.listCard{
  height:auto !important;
  min-height:92px !important;
  max-height:112px !important;
  flex:0 0 auto !important;
  flex-direction:row !important;
  align-items:center !important;
  padding:14px 16px !important;
  border-radius:16px !important;
  border-left:6px solid #0B1F4A !important;
}
.card.listCard .name{font-size:14px !important;min-height:auto !important;line-height:1.25 !important}
.card.listCard .cardTop{flex:1 !important;gap:12px !important;align-items:center !important}
.card.listCard .avatarSq{width:44px !important;height:44px !important;font-size:18px !important}
.card.listCard .sub{font-size:10px !important;margin-top:2px !important}
.card.listCard .actions{flex-direction:row !important;gap:14px !important;margin:0 0 0 10px !important;flex-shrink:0 !important}
.card.listCard .toggleRow{flex-direction:column !important;gap:4px !important}
.card.listCard .lab{font-size:10px !important}
.card.listCard .switch{width:46px !important;height:24px !important}
.card.listCard .switch:after{width:18px !important;height:18px !important}
.card.listCard .switch.on:after{left:24px !important}

.bottom{position:fixed;bottom:0;left:0;right:0;z-index:90;background:#fff;border-top:1px solid #dde4f0;display:flex;justify-content:space-around;padding:8px 0 14px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:8px;font-weight:700;color:#8aa0c5}
.tab.active{color:#0B1F4A}
.tab .ic{width:28px;height:28px;border-radius:10px;background:#e8eefb;display:flex;align-items:center;justify-content:center;font-size:13px}
.tab.active .ic{background:#0B1F4A;color:#fff}

/* ONLY PAGE NUMBER - NO BUTTONS */
.pages{grid-column:1/-1;display:flex;justify-content:center;align-items:center;padding:18px 0 80px;width:100%;flex-shrink:0}
.pageIndicator{background:#0B1F4A;color:#fff;padding:10px 22px;border-radius:100px;font-weight:900;font-size:13px;letter-spacing:0.5px;box-shadow:0 4px 14px rgba(11,31,74,0.25)}

.overlay{position:fixed;inset:0;background:rgba(11,31,74,0.55);z-index:9998;display:none}
.overlay.show{display:block}
.drawer{position:fixed;left:0;top:0;bottom:0;width:85%;max-width:300px;background:#fff;z-index:9999;transform:translateX(-100%);transition:.35s;pointer-events:none}
.drawer.open{transform:translateX(0);pointer-events:auto}
.drawerTop{background:linear-gradient(135deg,#0B1F4A,#12367F);padding:20px 16px;color:#fff}
.menuList{padding:8px 0;flex:1;overflow-y:auto}
.menuItem{padding:17px 20px;font-size:13px;font-weight:800;color:#334155;border-left:4px solid transparent}
.menuItem.active{background:#e8eefb;color:#0B1F4A;border-left-color:#0B1F4A}
.drawerDropdown{margin-top:12px;width:100%;height:44px;border-radius:12px;border:0;background:#fff;color:#0B1F4A;font-size:12px;font-weight:900;padding:0 12px}
body.desktop-mode .app{max-width:1280px;margin:0 auto}
body.desktop-mode .filter,body.desktop-mode .searchBar,body.desktop-mode .searchMeta,body.desktop-mode .scroll{max-width:1280px;margin:0 auto;width:100%}
</style>
</head>
<body>
<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
<div class="drawerTop">
<div style="display:flex;justify-content:space-between;align-items:center"><div><b>SHIJA HOSPITALS</b><small>DIALYSIS MANAGEMENT</small></div><button id="closeDrawerBtn" style="width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,0.22);color:#fff;font-size:22px;font-weight:900">✕</button></div>
<div style="margin-top:12px;display:flex;gap:8px"><div style="background:rgba(255,255,255,0.18);padding:6px 12px;border-radius:100px;font-size:10px;font-weight:700">● ONLINE</div><div style="background:#fff;color:#0B1F4A;padding:6px 12px;border-radius:100px;font-size:10px;font-weight:800" id="drawerCount">0</div></div>
<div style="margin-top:12px"><select id="viewModeDrawer" class="drawerDropdown"><option value="mobile">MOBILE ONLY PAGE NO</option><option value="desktop">DESKTOP ONLY PAGE NO</option></select></div>
</div>
<div class="menuList">
<div class="menuItem active" data-url="index.html">HOME</div>
<div class="menuItem" data-url="total.html">TOTAL PMJAY</div>
<div class="menuItem" data-url="cmht.html">TOTAL CMHT</div>
<div class="menuItem" data-url="searchpatient.html">SEARCH PATIENT</div>
<div class="menuItem" data-url="list.html">EXCEL LIST</div>
</div>
</div>
<div class="top"><button class="menuBtn" id="menuBtn">☰</button><div class="hWrap"><div class="hTitle">SHIJA HOSPITALS</div><div class="hSub">DIALYSIS MANAGEMENT</div></div><div class="topActions"><select id="viewModeTop" class="viewDropdown"><option value="mobile">MOBILE</option><option value="desktop">DESKTOP</option></select><button class="btnViewList" id="viewListBtn">VIEW LIST</button></div></div>
<div class="app">
<div style="background:linear-gradient(135deg,#0B1F4A,#12367F);padding:0 12px 12px"><div class="rowTop"><div class="dateBox"><input type="date" id="fDate"></div><div class="dateBox" style="max-width:100px"><select id="fType"><option>PMJAY</option><option>CMHT</option></select></div></div><div class="count"><span id="cLeft">Loading...</span><span id="cRight">PENDING 0</span></div></div>
<div class="filter"><button class="chip on" data-time="">ALL</button><button class="chip" data-time="7:00 AM">7 AM</button><button class="chip" data-time="12:00 PM">12 PM</button><button class="chip" data-time="5:00 PM">5 PM</button><button class="chip" data-time="9:00 PM">9 PM</button><button class="chip" data-time="12:00 AM">12 AM</button><button class="chip" data-time="2:00 AM">2 AM</button></div>
<div class="searchBar"><div class="searchInputWrap"><input type="text" id="searchName" class="searchInput" placeholder="Search name or SHRI..."><button class="clearSearch" id="clearSearch">✕</button></div><select id="filterBlock" style="border:1.5px solid #d0d9ea;background:#f4f7fd;padding:0 12px;height:42px;border-radius:100px;font-weight:800;font-size:10px;color:#0B1F4A;min-width:90px"><option value="">All Block</option><option value="MAIN">MAIN</option><option value="ITOCHA">ITOCHA</option></select><button id="toggleViewBtn" class="viewIconSingle"></button></div>
<div class="searchMeta"><span id="searchInfo"></span><span>← Swipe →</span></div>
<div class="scroll" id="scroll"><div class="grid" id="grid"></div><div class="pages" id="pages"></div></div>
<div class="bottom"><div class="tab active" id="tabHome"><div class="ic">⌂</div>Home</div><div class="tab" id="tabDone"><div class="ic">✓</div>Done <span id="doneB" style="background:#ef4444;color:#fff;padding:2px 6px;border-radius:100px;font-size:8px">0</span></div><div class="tab" id="tabSync"><div class="ic">↻</div>Sync</div></div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
(function(){
  const drawer=document.getElementById('drawer'); const overlay=document.getElementById('overlay'); const menuBtn=document.getElementById('menuBtn'); const closeBtn=document.getElementById('closeDrawerBtn'); let isOpen=false;
  function openMenu(e){if(e)e.stopPropagation();if(isOpen)return;isOpen=true;drawer.classList.add('open');overlay.classList.add('show');}
  function closeMenu(e){if(e)e.stopPropagation();if(!isOpen)return;isOpen=false;drawer.classList.remove('open');overlay.classList.remove('show');}
  menuBtn.addEventListener('click', openMenu); closeBtn.addEventListener('click', closeMenu); overlay.addEventListener('click', closeMenu);
  document.querySelectorAll('.menuItem').forEach(item=>{item.addEventListener('click', function(){let url=item.getAttribute('data-url');closeMenu();setTimeout(()=>{if(url)location.href=url;},300);});});
})();
let isDesktopView = localStorage.getItem('gda_desktop') === '1';
function applyDesktopView(state){
  try{
    isDesktopView = state;
    const gridEl = document.getElementById('grid');
    const vpMetaEl = document.getElementById('viewportMeta') || document.querySelector('meta[name="viewport"]');
    const selTopEl = document.getElementById('viewModeTop');
    const selDrawerEl = document.getElementById('viewModeDrawer');
    if(isDesktopView){
      document.body.classList.add('desktop-mode');
      if(gridEl) gridEl.classList.add('desktopView');
      if(vpMetaEl) vpMetaEl.setAttribute('content','width=1280');
      if(selTopEl) selTopEl.value='desktop';
      if(selDrawerEl) selDrawerEl.value='desktop';
      localStorage.setItem('gda_desktop','1');
    }else{
      document.body.classList.remove('desktop-mode');
      if(gridEl) gridEl.classList.remove('desktopView');
      if(vpMetaEl) vpMetaEl.setAttribute('content','width=device-width, initial-scale=1.0');
      if(selTopEl) selTopEl.value='mobile';
      if(selDrawerEl) selDrawerEl.value='mobile';
      localStorage.setItem('gda_desktop','0');
    }
    currentPage=1;render();
  }catch(e){console.warn(e);}
}
document.getElementById('viewModeTop')?.addEventListener('change', e=>applyDesktopView(e.target.value==='desktop'));
document.getElementById('viewModeDrawer')?.addEventListener('change', e=>{applyDesktopView(e.target.value==='desktop');});
function getTodayIST(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
document.getElementById('fDate').value=new URLSearchParams(location.search).get('date')||getTodayIST();
let allPatients=[],statusMap={},activeTimeFilter='',currentPage=1,masterMap={},searchQuery='',isListView=false;
if(localStorage.getItem('gda_view')==='list')isListView=true;
const gridIconSVG=`<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/></svg>`;
const listIconSVG=`<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="2.5" width="6.5" height="6.5" rx="1.2"/><line x1="13.5" y1="5.7" x2="21" y2="5.7"/><rect x="3" y="9.5" width="6.5" height="6.5" rx="1.2"/><line x1="13.5" y1="12.7" x2="21" y2="12.7"/><rect x="3" y="16.5" width="6.5" height="6.5" rx="1.2"/><line x1="13.5" y1="19.7" x2="21" y2="19.7"/></svg>`;
function getPageSize(){if(isListView)return 10;return 18;}
function normalizeTime(t){if(!t)return'';let s=String(t).toUpperCase().trim();let m=s.match(/(\d{1,2})(?::(\d{1,2}))?\s*([AP]M)?/);if(!m)return s;let h=parseInt(m[1]),mi=m[2]?m[2].padStart(2,'0'):'00',ap=m[3]||'';if(!ap){if(s.includes('AM'))ap='AM';else if(s.includes('PM'))ap='PM';}return ap?`${h}:${mi} ${ap}`:`${h}:${mi}`;}
function formatNameParagraph(fullName){
  if(!fullName) return '';
  let words = String(fullName).trim().split(/\s+/).filter(Boolean);
  if(words.length <= 1) return words[0] || '';
  let first = words[0];
  let rest = words.slice(1).join(' ');
  return first + '<br>' + rest;
}
async function buildMasterMap(){
  masterMap={};
  try{let snap=await db.collection('patients').get();snap.forEach(d=>{let p=d.data();if(p.deleted)return;let shri=String(p.shriId||p.shri||d.id||'').trim().toUpperCase();let pmjay=String(p.pmjayId||p.pmjay||'').trim().toUpperCase();let name=String(p.patientName||p.name||'').trim().toUpperCase();if(!shri)return;masterMap[shri]={shri:shri,pmjayId:pmjay,pmjayName:name,cmhtId:'',cmhtName:''};});}catch(e){}
  try{let snap2=await db.collection('cmht_patients').get();snap2.forEach(d=>{let p=d.data();if(p.deleted)return;let shri=String(p.shriId||p.shri||d.id||'').trim().toUpperCase();let cmht=String(p.cmhtId||p.cmht||p.pmjayId||p.pmjay||'').trim().toUpperCase();let name=String(p.patientName||p.name||'').trim().toUpperCase();if(!shri)return;if(!masterMap[shri])masterMap[shri]={shri:shri,pmjayId:'',pmjayName:'',cmhtId:'',cmhtName:''};masterMap[shri].cmhtId=cmht;masterMap[shri].cmhtName=name;});}catch(e){}
}
function enrichPatient(p){let shriKey=String(p.shri||'').trim().toUpperCase();if(!shriKey)return p;let m=masterMap[shriKey];if(!m)return p;let scheme=document.getElementById('fType').value;if(scheme==='PMJAY'){if(m.pmjayName)p.name=m.pmjayName;}else{if(m.cmhtName)p.name=m.cmhtName;}return p;}
async function loadData(){
  try{
    let d=document.getElementById('fDate').value;let s=document.getElementById('fType').value;let id=d+'_'+s;document.getElementById('cLeft').innerText="Loading...";
    await buildMasterMap();
    let snap=await db.collection('daily_dialysis_lists').doc(id).get();let patients=snap.exists?(snap.data().patients||[]):[];
    patients=patients.map((p,i)=>{let enriched=enrichPatient({...p});enriched.sl=i+1;return enriched;});
    allPatients=patients;
    let sSnap=await db.collection('daily_photo_opd').doc(id).get();statusMap=sSnap.exists?(sSnap.data().status||{}):{};
    if(allPatients.length===0){document.getElementById('grid').innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:40px;background:#fff;border-radius:20px;color:#0B1F4A;font-weight:700">No data for ${d} ${s}</div>`;document.getElementById('cLeft').innerText=`0 patients`;return;}
    applyDesktopView(isDesktopView);
  }catch(e){document.getElementById('cLeft').innerText="Error: "+(e.message||e);}
}
async function saveStatus(){let d=document.getElementById('fDate').value,s=document.getElementById('fType').value,id=d+'_'+s;await db.collection('daily_photo_opd').doc(id).set({date:d,scheme:s,status:statusMap,updatedAt:new Date().toISOString()},{merge:true});}
function toggle(sh,type){if(!statusMap[sh])statusMap[sh]={photoTaken:false,opdDone:false};if(type==='photo')statusMap[sh].photoTaken=!statusMap[sh].photoTaken;else statusMap[sh].opdDone=!statusMap[sh].opdDone;saveStatus();let st=statusMap[sh];if(st.photoTaken&&st.opdDone){let el=document.getElementById('card_'+sh);if(el){el.style.transform='scale(0.9)';el.style.opacity='0';setTimeout(render,200);}}else render();}
function getInit(n){return (n||'A').charAt(0).toUpperCase();}
function getCol(name){const colors=['linear-gradient(135deg,#8B5CF6,#7C3AED)','linear-gradient(135deg,#3B82F6,#0EA5E9)','linear-gradient(135deg,#22C55E,#10B981)','linear-gradient(135deg,#F59E0B,#F97316)','linear-gradient(135deg,#EF4444,#EC4899)','linear-gradient(135deg,#06B6D4,#3B82F6)'];let hash=0;for(let i=0;i<name.length;i++){hash=name.charCodeAt(i)+((hash<<5)-hash);}return colors[Math.abs(hash)%colors.length];}
function getFiltered(){let tn=normalizeTime(activeTimeFilter);let bf=document.getElementById('filterBlock').value;let sq=searchQuery.toLowerCase().trim();return allPatients.filter(p=>{let sh=String(p.shri||'').toUpperCase();if(!sh)return false;if(activeTimeFilter&&normalizeTime(p.time)!==tn)return false;if(bf&&p.block!==bf)return false;let st=statusMap[sh]||{photoTaken:false,opdDone:false};if(st.photoTaken&&st.opdDone)return false;if(sq){let nameL=String(p.name||'').toLowerCase();let shriL=sh.toLowerCase();if(!nameL.includes(sq)&&!shriL.includes(sq))return false;}return true;});}
function updateToggleBtn(){let btn=document.getElementById('toggleViewBtn');if(btn){btn.innerHTML=isListView?gridIconSVG:listIconSVG;}}
function render(){
  let grid=document.getElementById('grid'); if(!grid) return;
  grid.classList.toggle('listView',isListView);
  let filtered=getFiltered();let done=0;allPatients.forEach(p=>{let sh=String(p.shri||'').toUpperCase();let st=statusMap[sh];if(st&&st.photoTaken&&st.opdDone)done++;});
  let ps=getPageSize();let pages=Math.max(1,Math.ceil(filtered.length/ps));if(currentPage>pages)currentPage=pages;let items=filtered.slice((currentPage-1)*ps,currentPage*ps);
  grid.innerHTML='';
  items.forEach(p=>{let sh=String(p.shri||'').toUpperCase();let st=statusMap[sh]||{photoTaken:false,opdDone:false};let div=document.createElement('div');div.className=isListView?'card listCard':'card';div.id='card_'+sh;
  let displayName = formatNameParagraph(p.name);
  div.innerHTML=`<div class="cardTop"><div class="avatarSq" style="background:${getCol(p.name)}">${getInit(p.name)}</div><div class="info"><div class="name">${displayName}</div><div class="sub">${p.time||''} • ${p.block||'MAIN'} • ${sh}</div></div></div><div class="actions"><div class="toggleRow"><span class="lab">PHOTO</span><div class="switch ${st.photoTaken?'on':''}" onclick="toggle('${sh}','photo')"></div></div><div class="toggleRow"><span class="lab">OPD</span><div class="switch ${st.opdDone?'on':''}" onclick="toggle('${sh}','opd')"></div></div></div>`;grid.appendChild(div);});
  if(filtered.length===0){grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:40px;background:#fff;border-radius:20px;color:#0B1F4A;font-weight:700">All done</div>`;}
  let pg=document.getElementById('pages');
  if(pg){
    pg.innerHTML=`<div class="pageIndicator">PAGE ${currentPage} / ${pages}</div>`;
  }
  document.getElementById('cLeft').innerText=`${allPatients.length} • ${done} done`;
  document.getElementById('cRight').innerText=`PENDING ${filtered.length} (Page ${currentPage}/${pages})`;
  document.getElementById('doneB').innerText=done;
  document.getElementById('searchInfo').innerText=`${filtered.length} patients • Page ${currentPage} of ${pages} • Swipe ← →`;
  document.getElementById('drawerCount').innerText=`${allPatients.length}`;
  updateToggleBtn();
}
function goNextPage(){let ps=getPageSize();let pages=Math.max(1,Math.ceil(getFiltered().length/ps));if(currentPage<pages){currentPage++;render();return true;}}
function goPrevPage(){if(currentPage>1){currentPage--;render();return true;}}
function goToCompleted(){let d=document.getElementById('fDate').value;let t=document.getElementById('fType').value;location.href='gdacompleted.html?date='+encodeURIComponent(d)+'&type='+encodeURIComponent(t);}
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');activeTimeFilter=c.dataset.time;currentPage=1;render();}));
document.getElementById('filterBlock')?.addEventListener('change',()=>{currentPage=1;render();});
document.getElementById('fDate')?.addEventListener('change',loadData);
document.getElementById('fType')?.addEventListener('change',loadData);
document.getElementById('tabSync')?.addEventListener('click',()=>location.reload());
document.getElementById('viewListBtn')?.addEventListener('click',goToCompleted);
document.getElementById('tabDone')?.addEventListener('click',goToCompleted);
document.getElementById('tabHome')?.addEventListener('click',()=>location.href='index.html');
const searchInput=document.getElementById('searchName');
const clearBtn=document.getElementById('clearSearch');
searchInput?.addEventListener('input',e=>{searchQuery=e.target.value;if(clearBtn) clearBtn.style.display=searchQuery?'flex':'none';currentPage=1;render();});
clearBtn?.addEventListener('click',()=>{if(searchInput) searchInput.value='';searchQuery='';clearBtn.style.display='none';currentPage=1;render();});
document.getElementById('toggleViewBtn')?.addEventListener('click',()=>{isListView=!isListView;localStorage.setItem('gda_view',isListView?'list':'grid');currentPage=1;render();});
(function(){
  let startX=0,isSwipe=false,threshold=75;
  const scrollEl=document.getElementById('scroll');const gridEl=document.getElementById('grid');
  if(!scrollEl||!gridEl) return;
  scrollEl.addEventListener('touchstart',e=>{if(e.touches.length===1)startX=e.touches[0].clientX;isSwipe=false;},{passive:true});
  scrollEl.addEventListener('touchmove',e=>{if(!startX)return;let dx=e.touches[0].clientX-startX;if(Math.abs(dx)>18){isSwipe=true;gridEl.style.transform=`translateX(${dx*0.5}px)`;gridEl.style.opacity=`${1-Math.min(0.2,Math.abs(dx)/500)}`;}},{passive:true});
  scrollEl.addEventListener('touchend',e=>{if(!isSwipe){gridEl.style.transform='';gridEl.style.opacity='1';startX=0;return;}let dx=e.changedTouches[0].clientX-startX;gridEl.style.transform='';gridEl.style.opacity='1';if(dx<-threshold)goNextPage();else if(dx>threshold)goPrevPage();startX=0;isSwipe=false;},{passive:true});
})();
window.addEventListener('load',()=>{setTimeout(()=>{updateToggleBtn();loadData();},400);});
window.toggle=toggle;
</script>
</body>
