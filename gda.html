<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>GDA APP - FIXED TOP SCROLL FRAME</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto}
html,body{width:100%;height:100%;overflow:hidden;background:#eef1f5}
body{overscroll-behavior:none}
.app{width:100%;height:100vh;height:100dvh;display:flex;flex-direction:column;background:#eef1f5;overflow:hidden}

/* TOP FIXED - NOT MOVABLE */
.topFixed{flex-shrink:0;width:100%;background:#fff;z-index:20;box-shadow:0 4px 16px rgba(0,0,0,0.08);border-bottom:1px solid #e2e8f0}
.header{padding:12px 10px 10px}
.hTop{display:flex;justify-content:space-between;align-items:center}
.hTitle{font-size:22px;font-weight:900;letter-spacing:-0.5px}
.hBtn{width:46px;height:46px;border-radius:14px;border:0;background:#f1f5f9;font-size:22px;font-weight:900;cursor:pointer}
.hBtn.blue{background:#1e40af;color:#fff}
.dateRow{display:flex;gap:8px;margin-top:12px;width:100%}
.dateBox{flex:1;border:2.5px solid #0f172a;border-radius:14px;height:56px;display:flex;align-items:center;padding:0 14px;background:#fff}
.dateBox input,.dateBox select{border:0;width:100%;font-weight:800;font-size:16px;background:transparent;outline:none}
.countBar{margin-top:12px;background:#0f172a;color:#fff;border-radius:14px;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-weight:800;font-size:15px;width:100%}
.filter{padding:12px 10px 12px;background:#f8fafc;border-top:1px solid #eef2f7}
.chips{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{height:44px;padding:0 18px;border-radius:100px;border:2.5px solid #e2e8f0;background:#fff;font-weight:800;font-size:13px;white-space:nowrap;flex-shrink:0;cursor:pointer}
.chip.on{background:#0f172a;color:#fff;border-color:#0f172a}

/* SCROLL FRAME - ONLY THIS SCROLLS */
.scrollFrame{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:10px 6px 10px;background:#eef1f5}
.scrollFrame::-webkit-scrollbar{width:6px}
.scrollFrame::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:10px}
.list{width:100%;display:flex;flex-direction:column;gap:0}

/* BIGGER CARD */
.card{width:100%;background:#fff;border-radius:20px;padding:20px 12px 20px 14px;display:flex;align-items:center;gap:14px;margin-bottom:12px;position:relative;box-shadow:0 6px 18px rgba(0,0,0,0.08);border:1px solid #eef2f7;min-height:112px}
.avatar{width:72px;height:72px;border-radius:20px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:28px;flex-shrink:0;box-shadow:0 4px 10px rgba(0,0,0,0.15)}
.info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.name{font-size:19px;font-weight:900;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-0.3px;line-height:1.1;color:#0f172a}
.tags{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tag{background:#f1f5f9;color:#334155;font-size:12px;font-weight:800;padding:6px 12px;border-radius:20px;border:1px solid #e2e8f0}
.pending{position:absolute;top:10px;right:10px;background:#fee2e2;color:#dc2626;font-size:9px;font-weight:900;padding:4px 10px;border-radius:20px;letter-spacing:0.5px}
.actions{width:168px;display:flex;flex-direction:column;gap:10px;flex-shrink:0}
.aBtn{width:100%;height:58px;border-radius:14px;border:2.5px solid #e2e8f0;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;cursor:pointer;transition:0.2s}
.aBtn .l{font-size:13px;font-weight:900;color:#334155;letter-spacing:0.3px}
.aBtn .t{width:52px;height:30px;border-radius:20px;background:#e2e8f0;position:relative;transition:0.25s;flex-shrink:0}
.aBtn .t::after{content:'';width:24px;height:24px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:0.25s;box-shadow:0 2px 6px rgba(0,0,0,0.3)}
.aBtn.on{background:#dcfce7;border-color:#22c55e;box-shadow:0 2px 8px rgba(34,197,94,0.2)}
.aBtn.on .t{background:#22c55e}
.aBtn.on .t::after{left:25px}
.aBtn.on .l{color:#166534}
.pages{display:flex;justify-content:center;align-items:center;gap:8px;padding:16px 10px 20px;flex-wrap:wrap}
.pageBtn{min-width:46px;height:46px;padding:0 16px;border-radius:14px;border:2.5px solid #e2e8f0;background:#fff;font-weight:900;font-size:15px;cursor:pointer}
.pageBtn.active{background:#0f172a;color:#fff;border-color:#0f172a;box-shadow:0 4px 12px rgba(15,23,42,0.2)}
.bottom{flex-shrink:0;width:100%;background:#fff;border-top:1px solid #e2e8f0;display:flex;justify-content:space-around;padding:10px 0 16px;z-index:30;box-shadow:0 -4px 20px rgba(0,0,0,0.06)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:800;color:#94a3b8;cursor:pointer}
.tab.active{color:#0f172a}
.tab .ic{width:38px;height:38px;border-radius:14px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:20px}
.tab.active .ic{background:#0f172a;color:#fff}
</style>
<script>
document.addEventListener('touchstart', function(e){ if(e.touches.length>1) e.preventDefault(); }, {passive:false});
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
</script>
</head>
<body>
<div class="app">
<!-- TOP FIXED PART - DOES NOT MOVE -->
<div class="topFixed">
<div class="header">
<div class="hTop"><div class="hTitle">GDA APP</div><div style="display:flex;gap:8px"><button class="hBtn" onclick="loadData()">↻</button><button class="hBtn blue" onclick="openCompleted()">✓</button></div></div>
<div class="dateRow"><div class="dateBox"><input type="date" id="fDate"></div><div class="dateBox" style="max-width:125px"><select id="fType"><option value="PMJAY">PMJAY</option><option value="CMHT">CMHT</option></select></div></div>
<div class="countBar"><span id="cLeft">Loading...</span><span id="cRight" style="background:#fff;color:#0f172a;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:900">PENDING 0</span></div>
</div>
<div class="filter">
<div style="font-size:11px;font-weight:900;color:#64748b;margin-bottom:8px;letter-spacing:0.5px">FILTER BY TIME</div>
<div class="chips"><button class="chip on" data-time="">ALL</button><button class="chip" data-time="7:00 AM">7 AM</button><button class="chip" data-time="12:00 PM">12 PM</button><button class="chip" data-time="5:00 PM">5 PM</button><button class="chip" data-time="9:00 PM">9 PM</button><button class="chip" data-time="12:00 AM">12 AM</button><button class="chip" data-time="2:00 AM">2 AM</button></div>
<div style="margin-top:10px;font-size:13px;font-weight:800">BLOCK: <select id="filterBlock" style="border:0;background:#f1f5f9;padding:7px 16px;border-radius:20px;font-weight:800;margin-left:6px"><option value="">All Block</option><option value="MAIN">MAIN</option><option value="ITOCHA">ITOCHA</option></select></div>
</div>
</div>

<!-- SCROLLABLE FRAME - ONLY PATIENT CARDS SCROLL HERE -->
<div class="scrollFrame" id="scrollFrame">
<div class="list" id="list"></div>
<div class="pages" id="pages"></div>
</div>

<div class="bottom">
<div class="tab active"><div class="ic">◫</div>Home</div>
<div class="tab" onclick="openCompleted()"><div class="ic">✓</div>Done <span id="doneB" style="background:#ef4444;color:#fff;padding:3px 8px;border-radius:20px;font-size:10px">0</span></div>
<div class="tab" onclick="location.href='list.html'"><div class="ic">☰</div>List</div>
<div class="tab" onclick="loadData()"><div class="ic">↻</div>Sync</div>
</div>
</div>

<div id="completedModal" style="position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;z-index:200;align-items:flex-end;justify-content:center">
<div style="background:#fff;width:100%;max-height:85vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column"><div style="padding:18px;display:flex;justify-content:space-between;border-bottom:1px solid #f1f5f9"><b style="font-size:16px">Completed</b><button onclick="closeCompleted()" style="width:36px;height:36px;border-radius:50%;border:0;background:#f1f5f9;font-weight:900;font-size:18px">✕</button></div><div id="completedBody" style="padding:8px 6px;overflow:auto;-webkit-overflow-scrolling:touch"></div></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app=initializeApp(firebaseConfig,"gda_"+Math.random());const db=getFirestore(app);window._fb={db,doc,setDoc,getDoc};
</script>
<script>
function getTodayIST(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
document.getElementById('fDate').value=new URLSearchParams(location.search).get('date')||getTodayIST();
document.getElementById('fType').value=new URLSearchParams(location.search).get('scheme')||'PMJAY';
let allPatients=[],statusMap={},activeTimeFilter='',currentPage=1,pageSize=20;
function normalizeTime(t){if(!t) return '';let s=String(t).toUpperCase().trim().replace(/\s+/g,' ').replace(/\./g,'');let m=s.match(/(\d{1,2})(?::(\d{1,2}))?\s*([AP]M)?/);if(!m) return s;let h=parseInt(m[1]), mi=m[2]?m[2].padStart(2,'0'):'00', ap=m[3]||''; if(!ap){if(s.includes('AM'))ap='AM'; else if(s.includes('PM'))ap='PM';}if(ap) return `${h}:${mi} ${ap}`; return `${h}:${mi}`;}
async function loadData(){
 let date=document.getElementById('fDate').value,scheme=document.getElementById('fType').value;
 let docId=date+'_'+scheme;
 let snap=await window._fb.getDoc(window._fb.doc(window._fb.db,'daily_dialysis_lists',docId));
 allPatients=snap.exists()?(snap.data().patients||[]):[];
 let sSnap=await window._fb.getDoc(window._fb.doc(window._fb.db,'daily_photo_opd',docId));
 statusMap=sSnap.exists()?(sSnap.data().status||{}):{};
 currentPage=1;
 renderTable();
}
async function saveStatus(){let d=document.getElementById('fDate').value,s=document.getElementById('fType').value,docId=d+'_'+s;await window._fb.setDoc(window._fb.doc(window._fb.db,'daily_photo_opd',docId),{date:d,scheme:s,status:statusMap,updatedAt:new Date().toISOString()});}
function togglePhoto(sh){if(!statusMap[sh])statusMap[sh]={photoTaken:false,opdDone:false};statusMap[sh].photoTaken=!statusMap[sh].photoTaken;saveStatus();let st=statusMap[sh];if(st.photoTaken&&st.opdDone){let el=document.getElementById('card_'+sh);if(el){el.style.transform='translateX(120%)';el.style.opacity='0';setTimeout(renderTable,280);}}else renderTable();}
function toggleOpd(sh){if(!statusMap[sh])statusMap[sh]={photoTaken:false,opdDone:false};statusMap[sh].opdDone=!statusMap[sh].opdDone;saveStatus();let st=statusMap[sh];if(st.photoTaken&&st.opdDone){let el=document.getElementById('card_'+sh);if(el){el.style.transform='translateX(120%)';el.style.opacity='0';setTimeout(renderTable,280);}}else renderTable();}
function getInit(n){return (n||'A').charAt(0).toUpperCase();}
function getCol(n){let c=['#22c55e','#f97316','#a855f7','#3b82f6','#06b6d4','#ef4444','#ec4899'];return c[(n.charCodeAt(0)||0)%c.length];}
function getFiltered(){
 let tn=normalizeTime(activeTimeFilter);let bf=document.getElementById('filterBlock').value;
 return allPatients.filter(p=>{
  let sh=String(p.shri||'').toUpperCase();if(!sh)return false;
  if(activeTimeFilter&&normalizeTime(p.time)!==tn)return false;
  if(bf&&p.block!==bf)return false;
  let st=statusMap[sh]||{photoTaken:false,opdDone:false};
  if(st.photoTaken&&st.opdDone)return false;
  return true;
 });
}
function renderTable(){
 let list=document.getElementById('list');list.innerHTML='';
 let filtered=getFiltered();
 let actualCompleted=0;
 allPatients.forEach(p=>{let sh=String(p.shri||'').toUpperCase();let st=statusMap[sh];if(st&&st.photoTaken&&st.opdDone) actualCompleted++;});
 let totalPages=Math.max(1,Math.ceil(filtered.length/pageSize));
 if(currentPage>totalPages) currentPage=totalPages;
 let start=(currentPage-1)*pageSize;
 let pageItems=filtered.slice(start,start+pageSize);
 pageItems.forEach(p=>{
  let sh=String(p.shri||'').toUpperCase();
  let st=statusMap[sh]||{photoTaken:false,opdDone:false};
  let div=document.createElement('div');div.className='card';div.id='card_'+sh;
  div.innerHTML=`<span class="pending">PENDING</span><div class="avatar" style="background:${getCol(p.name)}">${getInit(p.name)}</div><div class="info"><div class="name">${p.name}</div><div class="tags"><span class="tag">${p.time||''}</span><span class="tag">Block ${p.block||''}</span></div></div><div class="actions"><button class="aBtn ${st.photoTaken?'on':''}" onclick="togglePhoto('${sh}')"><span class="l">PHOTO</span><span class="t"></span></button><button class="aBtn ${st.opdDone?'on':''}" onclick="toggleOpd('${sh}')"><span class="l">OPD</span><span class="t"></span></button></div>`;
  list.appendChild(div);
 });
 if(filtered.length===0)list.innerHTML=`<div style="text-align:center;padding:50px;background:#fff;border-radius:18px;margin:6px"><b>🎉 All done</b></div>`;
 let pagesDiv=document.getElementById('pages');pagesDiv.innerHTML='';
 if(totalPages>1){
  for(let i=1;i<=totalPages;i++){
   let btn=document.createElement('button');btn.className='pageBtn'+(i===currentPage?' active':'');btn.innerText=i;
   btn.onclick=()=>{currentPage=i;document.getElementById('scrollFrame').scrollTo({top:0,behavior:'smooth'});renderTable();};
   pagesDiv.appendChild(btn);
  }
  let info=document.createElement('div');info.style.cssText='width:100%;text-align:center;font-size:12px;font-weight:800;color:#64748b;margin-top:8px';
  info.innerText=`Page ${currentPage} of ${totalPages} • ${filtered.length} patients`;
  pagesDiv.appendChild(info);
 }
 document.getElementById('cLeft').innerText=`${allPatients.length} patients • ${actualCompleted} done`;
 document.getElementById('cRight').innerText=`PENDING ${filtered.length}`;
 document.getElementById('doneB').innerText=actualCompleted;
}
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');activeTimeFilter=c.dataset.time;currentPage=1;renderTable();}));
document.getElementById('filterBlock').addEventListener('change',()=>{currentPage=1;renderTable();});
document.getElementById('fDate').addEventListener('change',loadData);
document.getElementById('fType').addEventListener('change',loadData);
function openCompleted(){
 let body=document.getElementById('completedBody');body.innerHTML='';
 allPatients.forEach(p=>{let sh=String(p.shri||'').toUpperCase();let st=statusMap[sh];if(!st||!(st.photoTaken&&st.opdDone))return;let d=document.createElement('div');d.className='card';d.innerHTML=`<div class="avatar" style="background:#22c55e">${getInit(p.name)}</div><div class="info"><div class="name">${p.name}</div><div class="tags"><span class="tag">${p.time}</span><span class="tag">${p.block}</span></div></div><button onclick="bringBack('${sh}')" style="background:#0f172a;color:#fff;border:0;padding:14px 20px;border-radius:14px;font-weight:800;font-size:14px">UNDO</button>`;body.appendChild(d);});
 if(!body.innerHTML)body.innerHTML='<div style="padding:30px;text-align:center;color:#64748b">No completed</div>';
 document.getElementById('completedModal').style.display='flex';
}
function closeCompleted(){document.getElementById('completedModal').style.display='none';}
function bringBack(sh){if(statusMap[sh]){statusMap[sh].photoTaken=false;statusMap[sh].opdDone=false;}saveStatus();renderTable();openCompleted();}
window.addEventListener('load',loadData);
</script>
</body>
</html>
