<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>GDA APP - INDEX SQUARE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#eef2f7}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:#eef2f7;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:10;background:#fff;padding:14px 14px 10px;box-shadow:0 4px 20px rgba(0,0,0,0.07)}
.hTitle{font-size:20px;font-weight:900;letter-spacing:-0.5px}
.row{display:flex;gap:8px;margin-top:10px}
.dateBox{flex:1;border:1.5px solid #111827;border-radius:12px;height:46px;display:flex;align-items:center;padding:0 12px;background:#fff}
.dateBox input,.dateBox select{border:0;width:100%;font-weight:700;font-size:13px;outline:none;background:transparent}
.count{background:#111827;color:#fff;border-radius:12px;height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:12px;font-weight:700;margin-top:10px}
.filter{padding:10px 12px;background:#f8fafc;display:flex;gap:6px;overflow-x:auto}
.chip{height:34px;padding:0 12px;border-radius:100px;border:1.5px solid #e2e8f0;background:#fff;font-weight:700;font-size:10px;white-space:nowrap;flex-shrink:0}
.chip.on{background:#111827;color:#fff}
.list{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* INDEX SQUARE - PERFECT SQUARE */
.card{
background:#fff;
border-radius:18px;
aspect-ratio:1 / 1;
display:flex;
flex-direction:column;
padding:14px 10px 12px;
box-shadow:0 10px 24px rgba(15,23,42,0.10), 0 2px 8px rgba(15,23,42,0.06);
border:1px solid #fff;
position:relative;
overflow:hidden;
}
.avatar{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:24px;box-shadow:0 6px 16px rgba(0,0,0,0.15);margin:0 auto}
.name{margin-top:10px;font-size:12px;font-weight:900;text-align:center;color:#0f172a;text-transform:uppercase;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:28px;letter-spacing:-0.2px}
.meta{display:flex;gap:4px;justify-content:center;margin-top:6px;flex-wrap:wrap}
.meta span{background:#f1f5f9;color:#475569;font-size:8px;font-weight:700;padding:3px 6px;border-radius:6px}
.actions{margin-top:auto;display:flex;flex-direction:column;gap:6px;width:100%;padding-top:8px}
.btnRow{display:flex;align-items:center;justify-content:space-between;background:#f8fafc;border:1px solid #f1f5f9;border-radius:100px;padding:3px 5px 3px 10px}
.btnRow .l{font-size:8px;font-weight:800;letter-spacing:0.6px;color:#64748b}
.switch{width:38px;height:22px;border-radius:100px;background:#e2e8f0;position:relative;transition:0.2s;cursor:pointer}
.switch:after{content:'';width:16px;height:16px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:0.2s;box-shadow:0 2px 5px rgba(0,0,0,0.2)}
.switch.on{background:#22c55e}
.switch.on:after{left:19px}

.bottom{position:sticky;bottom:0;background:rgba(255,255,255,0.96);backdrop-filter:blur(12px);border-top:1px solid #f1f5f9;display:flex;justify-content:space-around;padding:8px 0 14px;margin-top:auto}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;font-weight:700;color:#94a3b8}
.tab.active{color:#111827}
.tab .ic{width:28px;height:28px;border-radius:8px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:14px}
.tab.active .ic{background:#111827;color:#fff}
.pages{grid-column:1/-1;display:flex;justify-content:center;gap:6px;padding:10px 0;flex-wrap:wrap}
.pageBtn{min-width:40px;height:40px;border-radius:10px;border:1.5px solid #e2e8f0;background:#fff;font-weight:800;font-size:12px}
.pageBtn.active{background:#111827;color:#fff}
</style>
</head>
<body>
<div class="app">
<div class="top">
<div style="display:flex;justify-content:space-between;align-items:center"><div class="hTitle">GDA APP</div><div style="display:flex;gap:6px"><button style="width:38px;height:38px;border-radius:10px;border:0;background:#f1f5f9" onclick="loadData()">↻</button><button style="width:38px;height:38px;border-radius:10px;border:0;background:#111827;color:#fff" onclick="openCompleted()">✓</button></div></div>
<div class="row"><div class="dateBox"><input type="date" id="fDate"></div><div class="dateBox" style="max-width:100px"><select id="fType"><option value="PMJAY">PMJAY</option><option value="CMHT">CMHT</option></select></div></div>
<div class="count"><span id="cLeft">Loading</span><span id="cRight" style="background:#fff;color:#111827;padding:4px 10px;border-radius:100px;font-size:10px">PENDING 0</span></div>
</div>
<div class="filter"><button class="chip on" data-time="">ALL</button><button class="chip" data-time="7:00 AM">7 AM</button><button class="chip" data-time="12:00 PM">12 PM</button><button class="chip" data-time="5:00 PM">5 PM</button><button class="chip" data-time="9:00 PM">9 PM</button><button class="chip" data-time="12:00 AM">12 AM</button><button class="chip" data-time="2:00 AM">2 AM</button></div>
<div style="padding:0 12px 6px;display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;color:#64748b">BLOCK: <select id="filterBlock" style="border:1px solid #e2e8f0;background:#fff;padding:4px 10px;border-radius:100px;font-weight:700;font-size:10px"><option value="">All Block</option><option value="MAIN">MAIN</option><option value="ITOCHA">ITOCHA</option></select></div>
<div class="list" id="list"></div>
<div class="pages" id="pages"></div>
<div class="bottom"><div class="tab active"><div class="ic">◫</div>Home</div><div class="tab" onclick="openCompleted()"><div class="ic">✓</div>Done <span id="doneB" style="background:#ef4444;color:#fff;padding:1px 5px;border-radius:100px;font-size:8px">0</span></div><div class="tab" onclick="location.href='list.html'"><div class="ic">☰</div>List</div><div class="tab" onclick="loadData()"><div class="ic">↻</div>Sync</div></div>
</div>
<div id="completedModal" style="position:fixed;inset:0;background:rgba(15,23,42,0.45);backdrop-filter:blur(8px);display:none;z-index:200;align-items:flex-end;justify-content:center"><div style="background:#fff;width:100%;max-height:88vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column"><div style="padding:16px;display:flex;justify-content:space-between;border-bottom:1px solid #f1f5f9"><b>Completed</b><button onclick="closeCompleted()" style="width:32px;height:32px;border-radius:50%;border:0;background:#f1f5f9">✕</button></div><div id="completedBody" style="padding:12px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px"></div></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app=initializeApp(cfg,"gda_"+Math.random());const db=getFirestore(app);window._fb={db,doc,setDoc,getDoc};
</script>
<script>
function getTodayIST(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
document.getElementById('fDate').value=new URLSearchParams(location.search).get('date')||getTodayIST();
let allPatients=[],statusMap={},activeTimeFilter='',currentPage=1,pageSize=30;
function normalizeTime(t){if(!t)return'';let s=String(t).toUpperCase().trim();let m=s.match(/(\d{1,2})(?::(\d{1,2}))?\s*([AP]M)?/);if(!m)return s;let h=parseInt(m[1]),mi=m[2]?m[2].padStart(2,'0'):'00',ap=m[3]||'';if(!ap){if(s.includes('AM'))ap='AM';else if(s.includes('PM'))ap='PM';}return ap?`${h}:${mi} ${ap}`:`${h}:${mi}`;}
async function loadData(){let d=document.getElementById('fDate').value,s=document.getElementById('fType').value,id=d+'_'+s;let snap=await window._fb.getDoc(window._fb.doc(window._fb.db,'daily_dialysis_lists',id));allPatients=snap.exists()?(snap.data().patients||[]):[];let ss=await window._fb.getDoc(window._fb.doc(window._fb.db,'daily_photo_opd',id));statusMap=ss.exists()?(ss.data().status||{}):{};currentPage=1;render();}
async function saveStatus(){let d=document.getElementById('fDate').value,s=document.getElementById('fType').value,id=d+'_'+s;await window._fb.setDoc(window._fb.doc(window._fb.db,'daily_photo_opd',id),{date:d,scheme:s,status:statusMap,updatedAt:new Date().toISOString()});}
function toggle(sh,type){if(!statusMap[sh])statusMap[sh]={photoTaken:false,opdDone:false};if(type==='photo')statusMap[sh].photoTaken=!statusMap[sh].photoTaken;else statusMap[sh].opdDone=!statusMap[sh].opdDone;saveStatus();render();}
function getInit(n){return (n||'A').charAt(0).toUpperCase();}
function getCol(n){let c=['#a78bfa','#fbbf24','#34d399','#60a5fa','#f472b6','#fb7185','#38bdf8'];return c[(n.charCodeAt(0)||0)%c.length];}
function getFiltered(){let tn=normalizeTime(activeTimeFilter);let bf=document.getElementById('filterBlock').value;return allPatients.filter(p=>{let sh=String(p.shri||'').toUpperCase();if(!sh)return false;if(activeTimeFilter&&normalizeTime(p.time)!==tn)return false;if(bf&&p.block!==bf)return false;let st=statusMap[sh]||{photoTaken:false,opdDone:false};if(st.photoTaken&&st.opdDone)return false;return true;});}
function render(){let list=document.getElementById('list');list.innerHTML='';let filtered=getFiltered();let done=0;allPatients.forEach(p=>{let sh=String(p.shri||'').toUpperCase();let st=statusMap[sh];if(st&&st.photoTaken&&st.opdDone)done++;});let pages=Math.max(1,Math.ceil(filtered.length/pageSize));if(currentPage>pages)currentPage=pages;let items=filtered.slice((currentPage-1)*pageSize,currentPage*pageSize);items.forEach(p=>{let sh=String(p.shri||'').toUpperCase();let st=statusMap[sh]||{photoTaken:false,opdDone:false};let div=document.createElement('div');div.className='card';div.id='card_'+sh;div.innerHTML=`<div class="avatar" style="background:${getCol(p.name)}">${getInit(p.name)}</div><div class="name">${p.name}</div><div class="meta"><span>${p.time||''}</span><span>${p.block||'MAIN'}</span></div><div class="actions"><div class="btnRow"><span class="l" style="color:${st.photoTaken?'#16a34a':'#64748b'}">PHOTO</span><div class="switch ${st.photoTaken?'on':''}" onclick="toggle('${sh}','photo')"></div></div><div class="btnRow"><span class="l" style="color:${st.opdDone?'#16a34a':'#64748b'}">OPD</span><div class="switch ${st.opdDone?'on':''}" onclick="toggle('${sh}','opd')"></div></div></div>`;list.appendChild(div);});if(filtered.length===0)list.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:40px;background:#fff;border-radius:18px;box-shadow:0 10px 24px rgba(0,0,0,0.08)">🎉 All done</div>`;let pg=document.getElementById('pages');pg.innerHTML='';if(pages>1){for(let i=1;i<=pages;i++){let b=document.createElement('button');b.className='pageBtn'+(i===currentPage?' active':'');b.innerText=i;b.onclick=()=>{currentPage=i;render();window.scrollTo(0,0);};pg.appendChild(b);}}document.getElementById('cLeft').innerText=`${allPatients.length} patients • ${done} done`;document.getElementById('cRight').innerText=`PENDING ${filtered.length}`;document.getElementById('doneB').innerText=done;}
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');activeTimeFilter=c.dataset.time;currentPage=1;render();}));
document.getElementById('filterBlock').addEventListener('change',()=>{currentPage=1;render();});
document.getElementById('fDate').addEventListener('change',loadData);document.getElementById('fType').addEventListener('change',loadData);
function openCompleted(){let body=document.getElementById('completedBody');body.innerHTML='';allPatients.forEach(p=>{let sh=String(p.shri||'').toUpperCase();let st=statusMap[sh];if(!st||!(st.photoTaken&&st.opdDone))return;let d=document.createElement('div');d.className='card';d.innerHTML=`<div class="avatar" style="background:#22c55e">${getInit(p.name)}</div><div class="name">${p.name}</div><div class="meta"><span>${p.time}</span><span>${p.block}</span></div><button onclick="bringBack('${sh}')" style="margin-top:auto;background:#111827;color:#fff;border:0;padding:8px;border-radius:100px;font-weight:800;font-size:10px;width:100%">UNDO</button>`;body.appendChild(d);});if(!body.innerHTML)body.innerHTML='<div style="grid-column:1/-1;text-align:center;color:#64748b;padding:20px">No completed</div>';document.getElementById('completedModal').style.display='flex';}
function closeCompleted(){document.getElementById('completedModal').style.display='none';}
function bringBack(sh){if(statusMap[sh]){statusMap[sh].photoTaken=false;statusMap[sh].opdDone=false;}saveStatus();render();openCompleted();}
window.addEventListener('load',loadData);
window.toggle=toggle;window.openCompleted=openCompleted;window.closeCompleted=closeCompleted;window.bringBack=bringBack;
</script>
</body>
</html>
