</style>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,getDoc,setDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};

<script>
(function(){
  const drawer=document.getElementById('drawer'); const overlay=document.getElementById('overlay'); const menuBtn=document.getElementById('menuBtn'); const closeBtn=document.getElementById('closeDrawerBtn'); let isOpen=false;
  function openMenu(e){if(e)e.stopPropagation();if(isOpen)return;isOpen=true;drawer.classList.add('open');overlay.classList.add('show');document.body.classList.add('menu-open');}
  function closeMenu(e){if(e)e.stopPropagation();if(!isOpen)return;isOpen=false;drawer.classList.remove('open');overlay.classList.remove('show');document.body.classList.remove('menu-open');}
  menuBtn.addEventListener('click', openMenu); closeBtn.addEventListener('click', closeMenu); overlay.addEventListener('click', closeMenu);
  document.querySelectorAll('.menuItem').forEach(item=>{
    item.addEventListener('click', function(){let url=item.getAttribute('data-url');document.querySelectorAll('.menuItem').forEach(i=>i.classList.remove('active'));item.classList.add('active');closeMenu();setTimeout(()=>{if(url)location.href=url;},300);});
  });
  window.openMenu=openMenu; window.closeMenu=closeMenu;
})();
(function(){
  const sheet=document.getElementById('doneSheet'); const overlay=document.getElementById('doneOverlay'); const handle=document.getElementById('dragHandle'); const body=document.getElementById('completedBody'); let startY=0, currentY=0, isDragging=false, startHeight=0;
  function openCompletedSheet(){sheet.classList.add('open');overlay.classList.add('show');sheet.classList.remove('small');sheet.classList.remove('full');document.body.style.overflow='hidden';}
  function closeCompletedSheet(){sheet.classList.remove('open');sheet.classList.remove('full');sheet.classList.remove('small');overlay.classList.remove('show');document.body.style.overflow='';setTimeout(()=>{sheet.style.transform='';},300);}
  function onStart(y){isDragging=true;startY=y;startHeight=sheet.offsetHeight;sheet.style.transition='none';}
  function onMove(y){if(!isDragging)return;currentY=y;let diff=startY-y;let newHeight=startHeight+diff;let minH=window.innerHeight*0.4;let maxH=window.innerHeight*0.92;newHeight=Math.max(minH,Math.min(maxH,newHeight));if(diff<-80){let translate=Math.max(0,-diff-80);sheet.style.transform=`translate3d(0,${translate}px,0)`;overlay.style.opacity=Math.max(0,1-translate/200);}else{sheet.style.transform='';sheet.style.height=newHeight+'px';}}
  function onEnd(){if(!isDragging)return;isDragging=false;sheet.style.transition='';sheet.style.height='';let diff=startY-currentY;if(diff<-120){closeCompletedSheet();}else if(diff>100){sheet.classList.add('full');sheet.classList.remove('small');sheet.style.transform='';}else if(diff<-40){sheet.classList.add('small');sheet.classList.remove('full');sheet.style.transform='';}else{sheet.style.transform='';}}
  handle.addEventListener('touchstart', e=>{onStart(e.touches[0].clientY);},{passive:true}); handle.addEventListener('touchmove', e=>{onMove(e.touches[0].clientY);},{passive:true}); handle.addEventListener('touchend', onEnd,{passive:true});
  handle.addEventListener('mousedown', e=>{onStart(e.clientY);}); window.addEventListener('mousemove', e=>{if(isDragging)onMove(e.clientY);}); window.addEventListener('mouseup', onEnd);
  let bodyStartY=0; body.addEventListener('touchstart', e=>{if(body.scrollTop<=0){bodyStartY=e.touches[0].clientY;}else{bodyStartY=0;}},{passive:true});
  body.addEventListener('touchmove', e=>{if(bodyStartY&&body.scrollTop<=0){let curY=e.touches[0].clientY;let diff=curY-bodyStartY;if(diff>0){e.preventDefault();sheet.style.transform=`translate3d(0,${diff*0.6}px,0)`;overlay.style.opacity=Math.max(0,1-diff/300);if(diff>140){body.style.overflow='hidden';}} }},{passive:false});
  body.addEventListener('touchend', e=>{if(bodyStartY){let endY=e.changedTouches[0].clientY;let diff=endY-bodyStartY;body.style.overflow='';if(diff>120){closeCompletedSheet();}else{sheet.style.transform='';overlay.style.opacity='';}bodyStartY=0;}},{passive:true});
  overlay.addEventListener('click', closeCompletedSheet);
  window.openCompleted=function(){openCompletedSheet();}; window._closeCompletedSheet=closeCompletedSheet; window.closeCompleted=closeCompletedSheet;
})();
function zoomIn(){let cur=parseFloat(document.body.style.zoom||1);document.body.style.zoom=Math.min(cur+0.25,3);}
function zoomReset(){document.body.style.zoom=1;window.scrollTo(0,0);}
function getTodayIST(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
document.getElementById('fDate').value=new URLSearchParams(location.search).get('date')||getTodayIST();
let allPatients=[],statusMap={},activeTimeFilter='',currentPage=1,pageSize=36;
function normalizeTime(t){if(!t)return'';let s=String(t).toUpperCase().trim();let m=s.match(/(\d{1,2})(?::(\d{1,2}))?\s*([AP]M)?/);if(!m)return s;let h=parseInt(m[1]),mi=m[2]?m[2].padStart(2,'0'):'00',ap=m[3]||'';if(!ap){if(s.includes('AM'))ap='AM';else if(s.includes('PM'))ap='PM';}return ap?`${h}:${mi} ${ap}`:`${h}:${mi}`;}
function hardRefresh(){location.reload();}
async function loadData(){let d=document.getElementById('fDate').value,s=document.getElementById('fType').value,id=d+'_'+s;let snap=await window._fb.getDoc(window._fb.doc(window._fb.db,'daily_dialysis_lists',id));allPatients=snap.exists()?(snap.data().patients||[]):[];let sSnap=await window._fb.getDoc(window._fb.doc(window._fb.db,'daily_photo_opd',id));statusMap=sSnap.exists()?(sSnap.data().status||{}):{};currentPage=1;render();}
async function saveStatus(){let d=document.getElementById('fDate').value,s=document.getElementById('fType').value,id=d+'_'+s;await window._fb.setDoc(window._fb.doc(window._fb.db,'daily_photo_opd',id),{date:d,scheme:s,status:statusMap,updatedAt:new Date().toISOString()});}
function toggle(sh,type){if(!statusMap[sh])statusMap[sh]={photoTaken:false,opdDone:false};if(type==='photo')statusMap[sh].photoTaken=!statusMap[sh].photoTaken;else statusMap[sh].opdDone=!statusMap[sh].opdDone;saveStatus();let st=statusMap[sh];if(st.photoTaken&&st.opdDone){let el=document.getElementById('card_'+sh);if(el){el.style.transform='scale(0.85)';el.style.opacity='0';setTimeout(render,200);}}else render();}
function getInit(n){return (n||'A').charAt(0).toUpperCase();}
function getCol(name){const colors=['linear-gradient(135deg,#8B5CF6,#6366F1)','linear-gradient(135deg,#F59E0B,#F97316)','linear-gradient(135deg,#10B981,#06B6D4)','linear-gradient(135deg,#EF4444,#EC4899)','linear-gradient(135deg,#3B82F6,#06B6D4)','linear-gradient(135deg,#14B8A6,#8B5CF6)','linear-gradient(135deg,#F97316,#EAB308)','linear-gradient(135deg,#EC4899,#8B5CF6)','linear-gradient(135deg,#06B6D4,#3B82F6)','linear-gradient(135deg,#84CC16,#10B981)','linear-gradient(135deg,#F43F5E,#F97316)','linear-gradient(135deg,#6366F1,#EC4899)','linear-gradient(135deg,#0EA5E9,#10B981)','linear-gradient(135deg,#A855F7,#F43F5E)','linear-gradient(135deg,#EAB308,#EF4444)','linear-gradient(135deg,#06B6D4,#8B5CF6)','linear-gradient(135deg,#10B981,#F59E0B)','linear-gradient(135deg,#3B82F6,#A855F7)'];let hash=0;for(let i=0;i<name.length;i++){hash=name.charCodeAt(i)+((hash<<5)-hash);}return colors[Math.abs(hash)%colors.length];}
function getFiltered(){let tn=normalizeTime(activeTimeFilter);let bf=document.getElementById('filterBlock').value;return allPatients.filter(p=>{let sh=String(p.shri||'').toUpperCase();if(!sh)return false;if(activeTimeFilter&&normalizeTime(p.time)!==tn)return false;if(bf&&p.block!==bf)return false;let st=statusMap[sh]||{photoTaken:false,opdDone:false};if(st.photoTaken&&st.opdDone)return false;return true;});}
function render(){let grid=document.getElementById('grid');grid.innerHTML='';let filtered=getFiltered();let done=0;allPatients.forEach(p=>{let sh=String(p.shri||'').toUpperCase();let st=statusMap[sh];if(st&&st.photoTaken&&st.opdDone)done++;});let pages=Math.max(1,Math.ceil(filtered.length/pageSize));if(currentPage>pages)currentPage=pages;let items=filtered.slice((currentPage-1)*pageSize,currentPage*pageSize);items.forEach(p=>{let sh=String(p.shri||'').toUpperCase();let st=statusMap[sh]||{photoTaken:false,opdDone:false};let div=document.createElement('div');div.className='card';div.id='card_'+sh;div.innerHTML=`<div class="cardTop"><div class="avatarSq" style="background:${getCol(p.name)}">${getInit(p.name)}</div><div class="info"><div class="name">${p.name}</div><div class="sub">${p.time||''} • ${p.block||'MAIN'}</div></div></div><div class="actions"><div class="toggleRow"><span class="lab">PHOTO</span><div class="switch ${st.photoTaken?'on':''}" onclick="toggle('${sh}','photo')"></div></div><div class="toggleRow"><span class="lab">OPD</span><div class="switch ${st.opdDone?'on':''}" onclick="toggle('${sh}','opd')"></div></div></div>`;grid.appendChild(div);});if(filtered.length===0)grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:40px;background:#fff;border-radius:16px;color:#0B1F4A">🎉 All done</div>`;let pg=document.getElementById('pages');pg.innerHTML='';if(pages>1){for(let i=1;i<=pages;i++){let b=document.createElement('button');b.className='pageBtn'+(i===currentPage?' active':'');b.innerText=i;b.onclick=()=>{currentPage=i;document.getElementById('scroll').scrollTo({top:0,behavior:'smooth'});render();};pg.appendChild(b);}}document.getElementById('cLeft').innerText=`${allPatients.length} • ${done} done`;document.getElementById('cRight').innerText=`PENDING ${filtered.length}`;document.getElementById('doneB').innerText=done;let dc=document.getElementById('drawerCount');if(dc)dc.innerText=`${allPatients.length} PATIENTS`;}
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');activeTimeFilter=c.dataset.time;currentPage=1;render();}));
document.getElementById('filterBlock').addEventListener('change',()=>{currentPage=1;render();});
document.getElementById('fDate').addEventListener('change',loadData);
document.getElementById('fType').addEventListener('change',loadData);
document.getElementById('refreshBtn').addEventListener('click', hardRefresh);
document.getElementById('tabSync').addEventListener('click', hardRefresh);
document.getElementById('viewListBtn').addEventListener('click', ()=>{prepareDoneList();});
document.getElementById('tabDone').addEventListener('click', ()=>{prepareDoneList();});
document.getElementById('tabHome').addEventListener('click', ()=>{location.href='index.html';});
function prepareDoneList(){
  let body=document.getElementById('completedBody'); body.innerHTML=''; let doneCount=0;
  allPatients.forEach(p=>{let sh=String(p.shri||'').toUpperCase();let st=statusMap[sh];if(!st||!(st.photoTaken&&st.opdDone))return;doneCount++;let d=document.createElement('div');d.className='card';d.innerHTML=`<div class="cardTop"><div class="avatarSq" style="background:${getCol(p.name)}">${getInit(p.name)}</div><div class="info"><div class="name">${p.name}</div><div class="sub">${p.time} • ${p.block}</div></div></div><button onclick="bringBack('${sh}')" style="margin-top:12px;background:#0B1F4A;color:#fff;border:0;padding:8px;border-radius:100px;font-weight:800;font-size:9px;width:100%">UNDO</button>`;body.appendChild(d);});
  if(doneCount===0) body.innerHTML='<div style="grid-column:1/-1;text-align:center;color:#6b7fa3;padding:20px">No completed patients</div>';
  document.getElementById('doneCountText').innerText = doneCount + ' patients completed';
  openCompleted();
}
function bringBack(sh){if(statusMap[sh]){statusMap[sh].photoTaken=false;statusMap[sh].opdDone=false;}saveStatus();render();prepareDoneList();}
window.addEventListener('load',loadData);
window.toggle=toggle;window.bringBack=bringBack;
</script>
</body>
</html>
