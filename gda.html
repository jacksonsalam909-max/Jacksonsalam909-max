<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, minimum-scale=0.5, user-scalable=yes, viewport-fit=cover">
<title>SHIJA HOSPITALS DIALYSIS MANAGEMENT</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,sans-serif}
body{background:#eef2f8;min-height:100dvh;overflow:auto}
.top{position:fixed;top:0;left:0;right:0;z-index:100;background:linear-gradient(135deg,#0B1F4A 0%,#12367F 100%);padding:12px;color:#fff;display:flex;align-items:center;gap:10px;height:58px}
.menuBtn{width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,0.18);color:#fff;font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer}
.hWrap{flex:1;min-width:0}.hTitle{font-size:13px;font-weight:900;text-transform:uppercase}.hSub{font-size:9px;opacity:0.85}
.topActions{display:flex;gap:8px;align-items:center}
.viewDropdown{height:38px;border-radius:12px;border:0;background:#fff;color:#0B1F4A;font-size:11px;font-weight:900;padding:0 12px;min-width:130px;cursor:pointer}
.btnViewList{height:38px;padding:0 14px;border-radius:12px;border:0;background:#fff;color:#0B1F4A;font-size:11px;font-weight:900;cursor:pointer}
.app{min-height:100dvh;display:flex;flex-direction:column;padding-top:58px}
.rowTop{display:flex;gap:8px;margin-top:10px}
.dateBox{flex:1;border-radius:14px;height:46px;display:flex;align-items:center;padding:0 12px;background:#fff}
.dateBox input,.dateBox select{border:0;width:100%;font-weight:700;font-size:13px;outline:none;background:transparent;color:#0B1F4A}
.count{margin-top:10px;background:rgba(255,255,255,0.15);border-radius:14px;height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:12px;font-weight:700;border:1px solid rgba(255,255,255,0.15)}
.count span:last-child{background:#fff;color:#0B1F4A;padding:6px 12px;border-radius:100px;font-size:11px;font-weight:800}
.filter{padding:10px 12px;display:flex;gap:6px;overflow-x:auto;background:#fff;border-bottom:1px solid #dde4f0;position:sticky;top:58px;z-index:5}
.filter::-webkit-scrollbar{display:none}
.chip{height:34px;padding:0 14px;border-radius:100px;border:1.5px solid #d0d9ea;background:#f4f7fd;font-weight:800;font-size:10px;white-space:nowrap;flex-shrink:0;color:#4a5f85}
.chip.on{background:#0B1F4A;color:#fff;border-color:#0B1F4A}
.searchBar{padding:10px 12px;display:flex;gap:8px;background:#fff;border-bottom:1px solid #dde4f0;align-items:center;flex-wrap:wrap;position:sticky;top:106px;z-index:5}
.searchInputWrap{flex:1;position:relative;display:flex;align-items:center;min-width:140px}
.searchInput{width:100%;height:42px;border:1.5px solid #d0d9ea;background:#f4f7fd;padding:0 14px;border-radius:100px;font-weight:700;font-size:12px;color:#0B1F4A;outline:none}
.clearSearch{position:absolute;right:8px;width:28px;height:28px;border-radius:50%;border:0;background:#dde4f0;color:#0B1F4A;font-weight:900;font-size:14px;display:none;align-items:center;justify-content:center;cursor:pointer}
.searchMeta{padding:6px 12px 8px;background:#fff;font-size:10px;font-weight:700;color:#5a7196;display:flex;justify-content:space-between;position:sticky;top:158px;z-index:5}
.viewIconSingle{width:46px;height:42px;border-radius:100px;border:2px solid #0B1F4A;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.viewIconSingle svg{width:22px;height:22px}
.viewIconSingle svg rect{stroke:#0B1F4A;stroke-width:2.2;fill:none}
.viewIconSingle svg line{stroke:#0B1F4A;stroke-width:2.6;stroke-linecap:round}
.scroll{flex:1;padding:4px !important;background:#eef2f8 !important;min-height:calc(100dvh - 210px) !important;display:flex !important;flex-direction:column !important}
.grid{width:100% !important;display:grid !important;gap:8px !important;flex:1 !important;align-content:start !important}
.grid.listView{grid-template-columns:1fr !important;gap:14px !important}
.grid.gridView{grid-template-columns:repeat(3,1fr) !important;gap:8px !important}
.grid.gridView.desktopView{grid-template-columns:repeat(6,1fr) !important}

/* GRID VIEW - FILLS PAGE - TALLER */
.card{background:#fff;border-radius:18px;padding:14px 8px 14px;display:flex;flex-direction:column;box-shadow:0 10px 26px rgba(11,31,74,0.10);border:1.5px solid #e8eefb;border-left:6px solid #0B1F4A;align-self:stretch;min-height:190px;justify-content:space-between;width:100%}
.card .avatarSq{width:56px !important;height:56px !important;border-radius:16px !important;font-size:18px !important;font-weight:900 !important;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 8px 18px rgba(0,0,0,0.18)}
.card .name{font-size:22px !important;font-weight:900 !important;color:#0B1F4A;text-transform:uppercase;line-height:1.1}
.card .sub{margin-top:6px;font-size:10px !important;font-weight:800 !important;color:#5a7196}
.card .actions{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.card .toggleRow{display:flex;align-items:center;justify-content:space-between;width:100%}
.card .lab{font-size:10px;font-weight:800;color:#0B1F4A}
.card .switch{width:46px;height:26px;border-radius:100px;background:#d6deef;position:relative;transition:.25s;cursor:pointer;flex-shrink:0}
.card .switch:after{content:'';width:20px;height:20px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:.25s;box-shadow:0 2px 6px rgba(0,0,0,0.2)}
.card .switch.on{background:linear-gradient(135deg,#22c55e,#16a34a)}
.card .switch.on:after{left:23px}

/* LIST VIEW - TALLER - 10 CARDS */
.card.listCard{display:flex !important;flex-direction:row !important;justify-content:space-between !important;align-items:center !important;gap:0 !important;padding:24px 16px !important;border-radius:20px !important;width:calc(100% - 6px) !important;margin:0 auto !important;min-height:132px !important;background:#fff !important;border:1.5px solid #e3eaf5 !important;border-left:8px solid #0B1F4A !important;box-shadow:0 10px 26px rgba(11,31,74,0.12) !important}
.card.listCard .cardTop{flex:1 !important;display:flex !important;align-items:center !important;gap:16px !important;min-width:0 !important}
.card.listCard .avatarSq{width:62px !important;height:62px !important;font-size:20px !important;border-radius:18px !important}
.card.listCard .info{flex:1 !important;min-width:0 !important}
.card.listCard .name{font-size:28px !important;line-height:1.1 !important;white-space:nowrap !important;overflow:hidden !important;text-overflow:ellipsis !important}
.card.listCard .sub{font-size:13px !important;margin-top:6px !important}
.card.listCard .actions{margin-left:12px !important;display:flex !important;flex-direction:row !important;gap:18px !important;flex-shrink:0 !important;margin-top:0 !important;align-items:center !important}
.card.listCard .toggleRow{width:auto !important;gap:10px !important;flex-direction:column !important;align-items:center !important}
.card.listCard .lab{font-size:11px !important;font-weight:900 !important}
.card.listCard .switch{width:74px !important;height:42px !important}
.card.listCard .switch:after{width:36px !important;height:36px !important;top:3px !important;left:3px !important}
.card.listCard .switch.on:after{left:35px !important}

.cardTop{display:flex;gap:10px;align-items:center}
.info{flex:1;min-width:0}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:90;background:#fff;border-top:1px solid #dde4f0;display:flex;justify-content:space-around;padding:8px 0 max(16px,env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;font-weight:700;color:#8aa0c5;cursor:pointer}
.tab.active{color:#0B1F4A}
.tab .ic{width:30px;height:30px;border-radius:12px;background:#e8eefb;display:flex;align-items:center;justify-content:center;font-size:14px;color:#0B1F4A}
.tab.active .ic{background:#0B1F4A;color:#fff}
.pages{grid-column:1/-1;display:flex !important;justify-content:center !important;gap:6px !important;padding:16px 0 90px !important;flex-wrap:wrap !important;background:#eef2f8 !important}
.pageBtn{min-width:42px;height:42px;border-radius:12px;border:1.5px solid #d0d9ea;background:#fff;font-weight:800;font-size:12px;color:#0B1F4A}
.pageBtn.active{background:#0B1F4A;color:#fff;transform:scale(1.1)}
.overlay{position:fixed;inset:0;background:rgba(11,31,74,0.55);backdrop-filter:blur(5px);z-index:9998;display:none;opacity:0;pointer-events:none}
.overlay.show{display:block;opacity:1;pointer-events:auto}
.drawer{position:fixed;left:0;top:0;bottom:0;width:85%;max-width:300px;background:#fff;z-index:9999;transform:translate3d(-100%,0,0);transition:transform 0.35s;box-shadow:8px 0 40px rgba(11,31,74,0.3);display:flex;flex-direction:column;overflow:hidden;pointer-events:none}
.drawer.open{transform:translate3d(0,0,0);pointer-events:auto}
.drawerTop{background:linear-gradient(135deg,#0B1F4A,#12367F);padding:20px 16px 16px;color:#fff}
.menuList{padding:8px 0;flex:1;overflow-y:auto}
.menuItem{padding:17px 20px;font-size:13px;font-weight:800;color:#334155;cursor:pointer;border-left:4px solid transparent;min-height:54px;display:block}
.menuItem.active{background:#e8eefb;color:#0B1F4A;border-left-color:#0B1F4A}
</style>
</head>
<body>
<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer"><div class="drawerTop"><div style="display:flex;justify-content:space-between;align-items:center"><div><b>SHIJA HOSPITALS</b><small>DIALYSIS MANAGEMENT</small></div><button id="closeDrawerBtn" style="width:48px;height:48px;border-radius:12px;border:0;background:rgba(255,255,255,0.22);color:#fff;font-size:26px;font-weight:900">✕</button></div></div><div class="menuList"><div class="menuItem active" data-url="index.html">HOME</div><div class="menuItem" data-url="total.html">TOTAL PMJAY PATIENT</div><div class="menuItem" data-url="cmht.html">TOTAL CMHT PATIENT</div><div class="menuItem" data-url="searchpatient.html">SEARCH PATIENT</div><div class="menuItem" data-url="list.html">EXCEL LIST</div></div></div>
<div class="top"><button class="menuBtn" id="menuBtn">☰</button><div class="hWrap"><div class="hTitle">SHIJA HOSPITALS</div><div class="hSub">DIALYSIS MANAGEMENT</div></div><div class="topActions"><select id="viewModeTop" class="viewDropdown"><option value="mobile">MOBILE VIEW</option><option value="desktop">DESKTOP VIEW</option></select><button class="btnViewList" id="viewListBtn">VIEW LIST</button></div></div>
<div class="app" id="appRoot">
<div style="background:linear-gradient(135deg,#0B1F4A 0%,#12367F 100%);padding:0 12px 12px"><div class="rowTop"><div class="dateBox"><input type="date" id="fDate"></div><div class="dateBox" style="max-width:100px"><select id="fType"><option>PMJAY</option><option>CMHT</option></select></div></div><div class="count"><span id="cLeft">Loading</span><span id="cRight">PENDING 0</span></div></div>
<div class="filter"><button class="chip on" data-time="">ALL</button><button class="chip" data-time="7:00 AM">7 AM</button><button class="chip" data-time="12:00 PM">12 PM</button><button class="chip" data-time="5:00 PM">5 PM</button><button class="chip" data-time="9:00 PM">9 PM</button><button class="chip" data-time="12:00 AM">12 AM</button><button class="chip" data-time="2:00 AM">2 AM</button></div>
<div class="searchBar"><div class="searchInputWrap"><input type="text" id="searchName" class="searchInput" placeholder="Search by name or SHRI..." autocomplete="off"><button class="clearSearch" id="clearSearch">✕</button></div><select id="filterBlock" style="border:1.5px solid #d0d9ea;background:#f4f7fd;padding:0 12px;height:42px;border-radius:100px;font-weight:800;font-size:10px;color:#0B1F4A;min-width:105px"><option value="">All Block</option><option value="MAIN">MAIN</option><option value="ITOCHA">ITOCHA</option></select><button id="toggleViewBtn" class="viewIconSingle" title="GRID VIEW"></button></div>
<div class="searchMeta"><span id="searchInfo"></span><span id="blockInfo"></span><span style="color:#0B1F4A;font-weight:900">GRID VIEW • 10/page TALL • Swipe</span></div>
<div class="scroll" id="scroll"><div class="grid" id="grid"></div><div class="pages" id="pages"></div></div>
<div class="bottom"><div class="tab active" id="tabHome"><div class="ic">⌂</div>Home</div><div class="tab" id="tabDone"><div class="ic">✓</div>Done <span id="doneB" style="background:#ef4444;color:#fff;padding:2px 6px;border-radius:100px;font-size:8px">0</span></div><div class="tab" id="tabSync"><div class="ic">↻</div>Sync</div></div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,getDoc,setDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app=initializeApp(cfg,"gda_"+Math.random());const db=getFirestore(app);window._fb={db,doc,getDoc,setDoc};
</script>
<script>
localStorage.setItem('gda_view','grid');
let allPatients=[],statusMap={},activeTimeFilter='',currentPage=1;
let gridPageSize=12, listPageSize=10;
let searchQuery='';
let isListView = false;

const gridIconSVG = `<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/></svg>`;
const listIconSVG = `<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="2.5" width="6.5" height="6.5" rx="1.2"/><line x1="13.5" y1="5.7" x2="21" y2="5.7"/><rect x="3" y="9.5" width="6.5" height="6.5" rx="1.2"/><line x1="13.5" y1="12.7" x2="21" y2="12.7"/><rect x="3" y="16.5" width="6.5" height="6.5" rx="1.2"/><line x1="13.5" y1="19.7" x2="21" y2="19.7"/></svg>`;

function getPageSize(){ return isListView ? listPageSize : gridPageSize; }
function normalizeTime(t){if(!t)return'';let s=String(t).toUpperCase().trim();let m=s.match(/(\d{1,2})(?::(\d{1,2}))?\s*([AP]M)?/);if(!m)return s;let h=parseInt(m[1]),mi=m[2]?m[2].padStart(2,'0'):'00',ap=m[3]||'';if(!ap){if(s.includes('AM'))ap='AM';else if(s.includes('PM'))ap='PM';}return ap?`${h}:${mi} ${ap}`:`${h}:${mi}`;}
function hardRefresh(){localStorage.setItem('gda_view','grid');location.reload();}
async function loadData(){let d=document.getElementById('fDate').value,s=document.getElementById('fType').value,id=d+'_'+s;let snap=await window._fb.getDoc(window._fb.doc(window._fb.db,'daily_dialysis_lists',id));allPatients=snap.exists()?(snap.data().patients||[]):[];let sSnap=await window._fb.getDoc(window._fb.doc(window._fb.db,'daily_photo_opd',id));statusMap=sSnap.exists()?(sSnap.data().status||{}):{};currentPage=1;render();}
async function saveStatus(){let d=document.getElementById('fDate').value,s=document.getElementById('fType').value,id=d+'_'+s;await window._fb.setDoc(window._fb.doc(window._fb.db,'daily_photo_opd',id),{date:d,scheme:s,status:statusMap,updatedAt:new Date().toISOString()});}
function toggle(sh,type){if(!statusMap[sh])statusMap[sh]={photoTaken:false,opdDone:false};if(type==='photo')statusMap[sh].photoTaken=!statusMap[sh].photoTaken;else statusMap[sh].opdDone=!statusMap[sh].opdDone;saveStatus();let st=statusMap[sh];if(st.photoTaken&&st.opdDone){let el=document.getElementById('card_'+sh);if(el){el.style.transform='scale(0.85)';el.style.opacity='0';setTimeout(render,200);}}else render();}
function getInit(n){return (n||'A').charAt(0).toUpperCase();}
function getCol(name){const colors=['linear-gradient(135deg,#8B5CF6,#6366F1)','linear-gradient(135deg,#F59E0B,#F97316)','linear-gradient(135deg,#10B981,#06B6D4)','linear-gradient(135deg,#EF4444,#EC4899)','linear-gradient(135deg,#3B82F6,#06B6D4)'];let hash=0;for(let i=0;i<name.length;i++){hash=name.charCodeAt(i)+((hash<<5)-hash);}return colors[Math.abs(hash)%colors.length];}
function getFiltered(){let tn=normalizeTime(activeTimeFilter);let bf=document.getElementById('filterBlock').value;let sq=searchQuery.toLowerCase().trim();return allPatients.filter(p=>{let sh=String(p.shri||'').toUpperCase();if(!sh)return false;if(activeTimeFilter&&normalizeTime(p.time)!==tn)return false;if(bf&&p.block!==bf)return false;let st=statusMap[sh]||{photoTaken:false,opdDone:false};if(st.photoTaken&&st.opdDone)return false;if(sq){let nameL=String(p.name||'').toLowerCase();let shriL=sh.toLowerCase();let blockL=String(p.block||'').toLowerCase();if(!nameL.includes(sq)&&!shriL.includes(sq)&&!blockL.includes(sq))return false;}return true;});}
function updateToggleBtn(){let btn=document.getElementById('toggleViewBtn');if(btn){btn.innerHTML=isListView?gridIconSVG:listIconSVG;}}
function render(){
  let grid=document.getElementById('grid');
  grid.className='grid';
  if(isListView){grid.classList.add('listView');}else{grid.classList.add('gridView');if(localStorage.getItem('gda_desktop')==='1'){grid.classList.add('desktopView');}}
  grid.innerHTML='';let filtered=getFiltered();let done=0;allPatients.forEach(p=>{let sh=String(p.shri||'').toUpperCase();let st=statusMap[sh];if(st&&st.photoTaken&&st.opdDone)done++;});let ps=getPageSize();let pages=Math.max(1,Math.ceil(filtered.length/ps));if(currentPage>pages)currentPage=pages;let items=filtered.slice((currentPage-1)*ps,currentPage*ps);
  items.forEach(p=>{
    let sh=String(p.shri||'').toUpperCase();let st=statusMap[sh]||{photoTaken:false,opdDone:false};
    let div=document.createElement('div');div.className=isListView?'card listCard':'card';div.id='card_'+sh;
    div.innerHTML=`<div class="cardTop"><div class="avatarSq" style="background:${getCol(p.name)}">${getInit(p.name)}</div><div class="info"><div class="name">${p.name}</div><div class="sub">${p.time||''} • ${p.block||'MAIN'} • ${sh}</div></div></div><div class="actions"><div class="toggleRow"><span class="lab">PHOTO</span><div class="switch ${st.photoTaken?'on':''}" onclick="toggle('${sh}','photo')"></div></div><div class="toggleRow"><span class="lab">OPD</span><div class="switch ${st.opdDone?'on':''}" onclick="toggle('${sh}','opd')"></div></div></div>`;
    grid.appendChild(div);
  });
  if(filtered.length===0){let msg = searchQuery ? `No results for "${searchQuery}"` : 'All done'; grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:40px;background:#fff;border-radius:16px;color:#0B1F4A;font-weight:700">${msg}</div>`;}
  let pg=document.getElementById('pages');pg.innerHTML='';if(pages>1){for(let i=1;i<=pages;i++){let b=document.createElement('button');b.className='pageBtn'+(i===currentPage?' active':'');b.innerText=i;b.onclick=()=>{currentPage=i;render();window.scrollTo({top:0,behavior:'smooth'});};pg.appendChild(b);}}
  document.getElementById('cLeft').innerText=`${allPatients.length} • ${done} done`;document.getElementById('cRight').innerText=`PENDING ${filtered.length} (${ps}/page)`;document.getElementById('doneB').innerText=done;
  document.getElementById('searchInfo').innerText = `${filtered.length} patients • GRID VIEW - 10 tall cards - FILLS PAGE`;
  updateToggleBtn();
}
function goNextPage(){let ps=getPageSize();let pages=Math.max(1,Math.ceil(getFiltered().length/ps));if(currentPage<pages){currentPage++;render();return true;}}
function goPrevPage(){if(currentPage>1){currentPage--;render();return true;}}
function goToCompleted(){let d=document.getElementById('fDate').value;let t=document.getElementById('fType').value;location.href='gdacompleted.html?date='+encodeURIComponent(d)+'&type='+encodeURIComponent(t);}
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');activeTimeFilter=c.dataset.time;currentPage=1;render();}));
document.getElementById('filterBlock').addEventListener('change',()=>{currentPage=1;render();});
document.getElementById('fDate').addEventListener('change',loadData);
document.getElementById('fType').addEventListener('change',loadData);
document.getElementById('tabSync').addEventListener('click', hardRefresh);
document.getElementById('viewListBtn').addEventListener('click', goToCompleted);
document.getElementById('tabDone').addEventListener('click', goToCompleted);
document.getElementById('tabHome').addEventListener('click', ()=>{location.href='index.html';});
const searchInput = document.getElementById('searchName');
const clearBtn = document.getElementById('clearSearch');
searchInput.addEventListener('input', (e)=>{searchQuery = e.target.value;clearBtn.style.display = searchQuery ? 'flex' : 'none';currentPage=1;render();});
clearBtn.addEventListener('click', ()=>{searchInput.value='';searchQuery='';clearBtn.style.display='none';currentPage=1;render();});
document.getElementById('toggleViewBtn').addEventListener('click', ()=>{
  isListView = !isListView;
  localStorage.setItem('gda_view', isListView?'list':'grid');
  currentPage=1;
  render();
});
(function(){
  const drawer=document.getElementById('drawer'); const overlay=document.getElementById('overlay'); const menuBtn=document.getElementById('menuBtn'); const closeBtn=document.getElementById('closeDrawerBtn'); let isOpen=false;
  function openMenu(e){if(e)e.stopPropagation();if(isOpen)return;isOpen=true;drawer.classList.add('open');overlay.classList.add('show');}
  function closeMenu(e){if(e)e.stopPropagation();if(!isOpen)return;isOpen=false;drawer.classList.remove('open');overlay.classList.remove('show');}
  menuBtn.addEventListener('click', openMenu); closeBtn.addEventListener('click', closeMenu); overlay.addEventListener('click', closeMenu);
})();
(function(){
  let isDesktop = localStorage.getItem('gda_desktop') === '1';
  const selTop = document.getElementById('viewModeTop');
  function applyDesktop(state){
    isDesktop = state;
    if(isDesktop){document.getElementById('grid').classList.add('desktopView');selTop.value='desktop';localStorage.setItem('gda_desktop','1');}
    else{document.getElementById('grid').classList.remove('desktopView');selTop.value='mobile';localStorage.setItem('gda_desktop','0');}
  }
  applyDesktop(isDesktop);
  selTop.addEventListener('change', e=>{applyDesktop(e.target.value==='desktop');render();});
})();
window.addEventListener('load',()=>{
  isListView = false;
  localStorage.setItem('gda_view','grid');
  updateToggleBtn();loadData();
});
window.toggle=toggle;
</script>
</body>
</html>
