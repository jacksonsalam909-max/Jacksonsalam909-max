<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}

.menuBtn{width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,0.18);color:#fff;font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.hWrap{flex:1;min-width:0}.hTitle{font-size:13px;font-weight:900;letter-spacing:0.5px;line-height:1.2;text-transform:uppercase}.hSub{font-size:9px;font-weight:700;opacity:0.85;margin-top:2px;letter-spacing:0.8px}

.searchBar{padding:10px 12px;display:flex;gap:8px;background:#fff;border-bottom:1px solid #dde4f0;align-items:center;flex-shrink:0;flex-wrap:wrap;position:sticky;top:106px;z-index:5;width:100%;max-width:100%}
.searchInputWrap{flex:1;position:relative;display:flex;align-items:center;min-width:140px}
.searchInput{width:100%;height:44px;border:1.5px solid #d0d9ea;background:#f4f7fd;padding:0 14px;border-radius:100px;font-weight:700;font-size:13px;color:#0B1F4A;outline:none}

/* GRID FILLS PAGE */
.scroll{flex:1;overflow:visible;padding:8px;background:#eef2f8;position:relative;display:flex;flex-direction:column;min-height:calc(100dvh - 240px);width:100%;max-width:100%}
.grid{display:grid;grid-template-columns:repeat(3,1fr) !important;gap:14px;width:100%;max-width:100%;align-items:stretch;grid-auto-rows:1fr;min-height:calc(100dvh - 300px);flex:1}

/* GRID CARD - BIGGER - SIMILAR TO SCREENSHOT */
.card{background:#fff;border-radius:18px;padding:16px 14px 16px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 22px rgba(11,31,74,0.10);border:1.5px solid #e8eefb;align-self:stretch;min-height:168px;height:100%}
.cardTop{display:flex;gap:12px;align-items:center}

.info{flex:1;min-width:0}
.name{font-size:17px;font-weight:900;color:#0B1F4A;text-transform:uppercase;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0.2px}

.switch{width:60px;height:32px;border-radius:100px;background:#d6deef;position:relative;transition:.25s;cursor:pointer;flex-shrink:0}

.switch.on{background:linear-gradient(135deg,#22c55e,#16a34a)}
.switch.on:after{left:31px}

/* LIST CARD - TALLER - NAME BIGGER THAN LOGO */
.card.listCard{flex-direction:row !important;align-items:center !important;gap:0 !important;padding:26px 18px !important;border-radius:20px !important;width:100% !important;min-height:140px !important;height:auto !important;box-shadow:0 8px 22px rgba(11,31,74,0.12) !important;border:1.5px solid #e3eaf5 !important;border-left:8px solid #0B1F4A !important}

.card.listCard .info{flex:1 !important;min-width:0 !important}

.card.listCard .toggleRow{width:auto !important;gap:10px !important;flex-direction:column !important;align-items:center !important;justify-content:center !important}
.card.listCard .lab{font-size:11px !important;font-weight:900 !important;letter-spacing:0.6px !important;color:#0B1F4A !important}
.card.listCard .switch{width:74px !important;height:42px !important;border-radius:100px !important}
.card.listCard .switch:after{width:36px !important;height:36px !important;top:3px !important;left:3px !important}
.card.listCard .switch.on:after{left:35px !important}

.bottom{position:fixed;bottom:0;left:0;right:0;z-index:90;background:#fff;border-top:1px solid #dde4f0;display:flex;justify-content:space-around;padding:8px 0 max(16px,env(safe-area-inset-bottom))}

.pages{grid-column:1/-1;display:flex;justify-content:center;gap:6px;padding:14px 0 80px;flex-wrap:wrap;width:100%}
.pageBtn{min-width:44px;height:44px;border-radius:12px;border:1.5px solid #d0d9ea;background:#fff;font-weight:800;font-size:12px;color:#0B1F4A}

.overlay{position:fixed;inset:0;background:rgba(11,31,74,0.55);backdrop-filter:blur(5px);z-index:9998;display:none;opacity:0;transition:opacity 0.3s ease;pointer-events:none}
.overlay.show{display:block;opacity:1;pointer-events:auto}
.drawer{position:fixed;left:0;top:0;bottom:0;width:85%;max-width:300px;background:#fff;z-index:9999;transform:translate3d(-100%,0,0);transition:transform 0.35s cubic-bezier(0.32,0.72,0,1);box-shadow:8px 0 40px rgba(11,31,74,0.3);display:flex;flex-direction:column;overflow:hidden;pointer-events:none}
.drawer.open{transform:translate3d(0,0,0);pointer-events:auto}
.drawerTop{background:linear-gradient(135deg,#0B1F4A,#12367F);padding:20px 16px 16px;color:#fff;flex-shrink:0;padding-top:max(20px,env(safe-area-inset-top))}
.drawerTop b{font-size:14px;letter-spacing:0.5px;display:block}
.drawerTop small{font-size:10px;opacity:0.85;letter-spacing:0.8px;margin-top:3px;display:block}
.menuList{padding:8px 0;flex:1;overflow-y:auto}
.menuItem{padding:17px 20px;font-size:13px;font-weight:800;color:#334155;cursor:pointer;border-left:4px solid transparent;min-height:54px;display:block;letter-spacing:0.3px}
.menuItem.active{background:#e8eefb;color:#0B1F4A;border-left-color:#0B1F4A}
.drawerDropdown{margin-top:12px;width:100%;height:44px;border-radius:12px;border:0;background:#fff;color:#0B1F4A;font-size:12px;font-weight:900;padding:0 12px;outline:none}

/* DESKTOP MODE - UPPER TABS FILL SAME WIDTH AS GRID */
body.desktop-mode{background:#eef2f8}
body.desktop-mode .top{width:100%;left:0;right:0}
body.desktop-mode .app{width:100%;max-width:1280px;margin:0 auto;padding-top:58px}
body.desktop-mode .filter,
body.desktop-mode .searchBar,
body.desktop-mode .searchMeta,
body.desktop-mode .scroll{width:100%;max-width:1280px;margin-left:auto;margin-right:auto}
body.desktop-mode .filter{position:sticky;top:58px;z-index:5}
body.desktop-mode .searchBar{top:106px}
body.desktop-mode .searchMeta{top:158px}
body.desktop-mode .grid.desktopView{min-height:calc(100dvh - 300px)}
</style>
</head>

<script>
const firebaseConfig={apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
(function(){
  const drawer=document.getElementById('drawer'); const overlay=document.getElementById('overlay'); const menuBtn=document.getElementById('menuBtn'); const closeBtn=document.getElementById('closeDrawerBtn'); let isOpen=false;
  function openMenu(e){if(e)e.stopPropagation();if(isOpen)return;isOpen=true;drawer.classList.add('open');overlay.classList.add('show');}
  function closeMenu(e){if(e)e.stopPropagation();if(!isOpen)return;isOpen=false;drawer.classList.remove('open');overlay.classList.remove('show');}
  menuBtn.addEventListener('click', openMenu); closeBtn.addEventListener('click', closeMenu); overlay.addEventListener('click', closeMenu);
  document.querySelectorAll('.menuItem').forEach(item=>{item.addEventListener('click', function(){let url=item.getAttribute('data-url');document.querySelectorAll('.menuItem').forEach(i=>i.classList.remove('active'));item.classList.add('active');closeMenu();setTimeout(()=>{if(url)location.href=url;},300);});});
  window.openMenu=openMenu; window.closeMenu=closeMenu;
})();
let isDesktopView = localStorage.getItem('gda_desktop') === '1';
const vpMeta = document.getElementById('viewportMeta');
const selTop = document.getElementById('viewModeTop');
const selDrawer = document.getElementById('viewModeDrawer');
const gridElGlobal = document.getElementById('grid');
function applyDesktopView(state){
  isDesktopView = state;
  if(isDesktopView){
    document.body.classList.add('desktop-mode');
    gridElGlobal.classList.add('desktopView');
    vpMeta.setAttribute('content','width=1280');
    selTop.value='desktop'; selDrawer.value='desktop';
    localStorage.setItem('gda_desktop','1');
  }else{
    document.body.classList.remove('desktop-mode');
    gridElGlobal.classList.remove('desktopView');
    vpMeta.setAttribute('content','width=device-width, initial-scale=1.0, maximum-scale=5.0, minimum-scale=0.5, user-scalable=yes, viewport-fit=cover');
    selTop.value='mobile'; selDrawer.value='mobile';
    localStorage.setItem('gda_desktop','0');
  }
  currentPage=1;
  render();
}
selTop.addEventListener('change', e=>applyDesktopView(e.target.value==='desktop'));
selDrawer.addEventListener('change', e=>{applyDesktopView(e.target.value==='desktop'); setTimeout(()=>{window.closeMenu();},300);});
function getTodayIST(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
document.getElementById('fDate').value=new URLSearchParams(location.search).get('date')||getTodayIST();
let allPatients=[],statusMap={},activeTimeFilter='',currentPage=1;
let masterMap={};
let searchQuery='';
let isListView = false;
if(localStorage.getItem('gda_view') === 'list'){isListView = true;}
const gridIconSVG = `<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/></svg>`;
const listIconSVG = `<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="2.5" width="6.5" height="6.5" rx="1.2"/><line x1="13.5" y1="5.7" x2="21" y2="5.7"/><rect x="3" y="9.5" width="6.5" height="6.5" rx="1.2"/><line x1="13.5" y1="12.7" x2="21" y2="12.7"/><rect x="3" y="16.5" width="6.5" height="6.5" rx="1.2"/><line x1="13.5" y1="19.7" x2="21" y2="19.7"/></svg>`;
function getPageSize(){ if(isListView) return 10; if(isDesktopView) return 25; return 15; }
function normalizeTime(t){if(!t)return'';let s=String(t).toUpperCase().trim();let m=s.match(/(\d{1,2})(?::(\d{1,2}))?\s*([AP]M)?/);if(!m)return s;let h=parseInt(m[1]),mi=m[2]?m[2].padStart(2,'0'):'00',ap=m[3]||'';if(!ap){if(s.includes('AM'))ap='AM';else if(s.includes('PM'))ap='PM';}return ap?`${h}:${mi} ${ap}`:`${h}:${mi}`;}
function hardRefresh(){location.reload();}
async function buildMasterMap(){
  masterMap={};
  try{let snap = await db.collection('patients').get();snap.forEach(d=>{let p=d.data();if(p.deleted) return;let shri = String(p.shriId||p.shri||d.id||'').trim().toUpperCase();let pmjay = String(p.pmjayId||p.pmjay||'').trim().toUpperCase();let name = String(p.patientName||p.name||'').trim().toUpperCase();if(!shri) return;masterMap[shri]={shri:shri,pmjayId:pmjay,pmjayName:name,cmhtId:'',cmhtName:''};});}catch(e){}
  try{let snap2 = await db.collection('cmht_patients').get();snap2.forEach(d=>{let p=d.data();if(p.deleted) return;let shri = String(p.shriId||p.shri||d.id||'').trim().toUpperCase();let cmht = String(p.cmhtId||p.cmht||p.pmjayId||p.pmjay||'').trim().toUpperCase();let name = String(p.patientName||p.name||'').trim().toUpperCase();if(!shri) return;if(!masterMap[shri]) masterMap[shri]={shri:shri,pmjayId:'',pmjayName:'',cmhtId:'',cmhtName:''};masterMap[shri].cmhtId=cmht;masterMap[shri].cmhtName=name;});}catch(e){}
}
function enrichPatient(p){let shriKey = String(p.shri||'').trim().toUpperCase();if(!shriKey) return p;let m = masterMap[shriKey];if(!m) return p;let scheme = document.getElementById('fType').value;if(scheme==='PMJAY'){if(m.pmjayName) p.name = m.pmjayName;if(m.pmjayId) p.pmjayCmhtId = m.pmjayId;} else {if(m.cmhtName) p.name = m.cmhtName;if(m.cmhtId) p.pmjayCmhtId = m.cmhtId;else if(m.pmjayId) p.pmjayCmhtId = m.pmjayId;}return p;}
async function loadData(){
  try{
    let d=document.getElementById('fDate').value;let s=document.getElementById('fType').value;let id=d+'_'+s;document.getElementById('cLeft').innerText="Loading "+id+"...";
    await buildMasterMap();
    let snap=await db.collection('daily_dialysis_lists').doc(id).get();let patients = snap.exists?(snap.data().patients||[]):[];
    patients = patients.map((p,i)=>{let enriched = enrichPatient({...p});enriched.sl = i+1;return enriched;});
    allPatients=patients;
    let sSnap=await db.collection('daily_photo_opd').doc(id).get();statusMap=sSnap.exists?(sSnap.data().status||{}):{};
    if(allPatients.length===0){
      document.getElementById('grid').innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:40px;background:#fff;border-radius:16px;color:#0B1F4A;font-weight:700">No data for ${d} ${s}<br><br>Go to list.html and add patients</div>`;
      document.getElementById('cLeft').innerText=`0 patients | MASTER ${Object.keys(masterMap).length}`;document.getElementById('cRight').innerText=`PENDING 0`;document.getElementById('searchInfo').innerText=`No data for ${id}`;document.getElementById('doneB').innerText='0';return;
    }
    applyDesktopView(isDesktopView);currentPage=1;render();
  }catch(e){document.getElementById('cLeft').innerText="Error: "+e.message;document.getElementById('grid').innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:20px;background:#fff;border-radius:16px;color:#ef4444;font-weight:700">Load failed: ${e.message}</div>`;}
}
async function saveStatus(){let d=document.getElementById('fDate').value,s=document.getElementById('fType').value,id=d+'_'+s;await db.collection('daily_photo_opd').doc(id).set({date:d,scheme:s,status:statusMap,updatedAt:new Date().toISOString()},{merge:true});}
function toggle(sh,type){if(!statusMap[sh])statusMap[sh]={photoTaken:false,opdDone:false};if(type==='photo')statusMap[sh].photoTaken=!statusMap[sh].photoTaken;else statusMap[sh].opdDone=!statusMap[sh].opdDone;saveStatus();let st=statusMap[sh];if(st.photoTaken&&st.opdDone){let el=document.getElementById('card_'+sh);if(el){el.style.transform='scale(0.85)';el.style.opacity='0';setTimeout(render,200);}}else render();}
function getInit(n){return (n||'A').charAt(0).toUpperCase();}
function getCol(name){const colors=['linear-gradient(135deg,#8B5CF6,#6366F1)','linear-gradient(135deg,#F59E0B,#F97316)','linear-gradient(135deg,#10B981,#06B6D4)','linear-gradient(135deg,#EF4444,#EC4899)','linear-gradient(135deg,#3B82F6,#06B6D4)'];let hash=0;for(let i=0;i<name.length;i++){hash=name.charCodeAt(i)+((hash<<5)-hash);}return colors[Math.abs(hash)%colors.length];}
function getFiltered(){let tn=normalizeTime(activeTimeFilter);let bf=document.getElementById('filterBlock').value;let sq=searchQuery.toLowerCase().trim();return allPatients.filter(p=>{let sh=String(p.shri||'').toUpperCase();if(!sh)return false;if(activeTimeFilter&&normalizeTime(p.time)!==tn)return false;if(bf&&p.block!==bf)return false;let st=statusMap[sh]||{photoTaken:false,opdDone:false};if(st.photoTaken&&st.opdDone)return false;if(sq){let nameL=String(p.name||'').toLowerCase();let shriL=sh.toLowerCase();let blockL=String(p.block||'').toLowerCase();if(!nameL.includes(sq)&&!shriL.includes(sq)&&!blockL.includes(sq))return false;}return true;});}
function updateToggleBtn(){let btn=document.getElementById('toggleViewBtn');if(btn){btn.innerHTML=isListView?gridIconSVG:listIconSVG;}}
function render(direction){
  let grid=document.getElementById('grid');grid.classList.toggle('listView', isListView);if(isDesktopView){grid.classList.add('desktopView');}else{grid.classList.remove('desktopView');}
  if(direction){grid.style.opacity='0.6';grid.style.transform=direction==='next'?'translateX(-20px)':'translateX(20px)';setTimeout(()=>{ doRender(); grid.style.opacity='1'; grid.style.transform='translateX(0)';},180);}else{ doRender(); }
  function doRender(){
    grid.innerHTML='';let filtered=getFiltered();let done=0;allPatients.forEach(p=>{let sh=String(p.shri||'').toUpperCase();let st=statusMap[sh];if(st&&st.photoTaken&&st.opdDone)done++;});let ps=getPageSize();let pages=Math.max(1,Math.ceil(filtered.length/ps));if(currentPage>pages)currentPage=pages;let items=filtered.slice((currentPage-1)*ps,currentPage*ps);
    items.forEach(p=>{let sh=String(p.shri||'').toUpperCase();let st=statusMap[sh]||{photoTaken:false,opdDone:false};let div=document.createElement('div');div.className=isListView?'card listCard':'card';div.id='card_'+sh;div.innerHTML=`<div class="cardTop"><div class="avatarSq" style="background:${getCol(p.name)}">${getInit(p.name)}</div><div class="info"><div class="name">${p.name}</div><div class="sub">${p.time||''} • ${p.block||'MAIN'} • ${sh}</div></div></div><div class="actions"><div class="toggleRow"><span class="lab">PHOTO</span><div class="switch ${st.photoTaken?'on':''}" onclick="toggle('${sh}','photo')"></div></div><div class="toggleRow"><span class="lab">OPD</span><div class="switch ${st.opdDone?'on':''}" onclick="toggle('${sh}','opd')"></div></div></div>`;grid.appendChild(div);});
    if(filtered.length===0){let msg = searchQuery ? `No results for "${searchQuery}"` : 'All done'; grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:40px;background:#fff;border-radius:16px;color:#0B1F4A;font-weight:700">${msg}</div>`;}
    let pg=document.getElementById('pages');pg.innerHTML='';if(pages>1){for(let i=1;i<=pages;i++){let b=document.createElement('button');b.className='pageBtn'+(i===currentPage?' active':'');b.innerText=i;b.onclick=()=>{currentPage=i;render();window.scrollTo({top:0,behavior:'smooth'});};pg.appendChild(b);}}
    document.getElementById('cLeft').innerText=`${allPatients.length} • ${done} done | MASTER ${Object.keys(masterMap).length}`;document.getElementById('cRight').innerText=`PENDING ${filtered.length} (${ps}/page)`;document.getElementById('doneB').innerText=done;
    let modeText = isListView ? 'LIST 10/page TALL' : (isDesktopView ? 'DESKTOP 5 COL x 5 ROWS = 25/page' : 'MOBILE 3 COL x 5 ROWS = 15/page');
    document.getElementById('searchInfo').innerText = `${filtered.length} patients • ${modeText} • EXACT NAME`;document.getElementById('drawerCount').innerText=`${allPatients.length} PATIENTS`;updateToggleBtn();
  }
}
function goNextPage(){let ps=getPageSize();let pages=Math.max(1,Math.ceil(getFiltered().length/ps));if(currentPage<pages){currentPage++;render('next');return true;}}
function goPrevPage(){if(currentPage>1){currentPage--;render('prev');return true;}}
function goToCompleted(){let d=document.getElementById('fDate').value;let t=document.getElementById('fType').value;location.href='gdacompleted.html?date='+encodeURIComponent(d)+'&type='+encodeURIComponent(t);}
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');activeTimeFilter=c.dataset.time;currentPage=1;render();}));
document.getElementById('filterBlock').addEventListener('change',()=>{currentPage=1;render();});
document.getElementById('fDate').addEventListener('change',loadData);
document.getElementById('fType').addEventListener('change',loadData);
document.getElementById('tabSync').addEventListener('click', hardRefresh);
document.getElementById('viewListBtn').addEventListener('click', goToCompleted);
document.getElementById('tabDone').addEventListener('click', goToCompleted);
document.getElementById('tabHome').addEventListener('click', ()=>{location.href='index.html';});
const searchInput = document.getElementById('searchName');
const clearBtn = document.getElementById('clearSearch');
searchInput.addEventListener('input', (e)=>{searchQuery = e.target.value;clearBtn.style.display = searchQuery ? 'flex' : 'none';currentPage=1;render();});
clearBtn.addEventListener('click', ()=>{searchInput.value='';searchQuery='';clearBtn.style.display='none';currentPage=1;render();});
document.getElementById('toggleViewBtn').addEventListener('click', ()=>{isListView = !isListView;localStorage.setItem('gda_view', isListView?'list':'grid');currentPage=1;render();});
(function(){
  let startX=0,startY=0,isSwipe=false,threshold=80;
  const scrollEl=document.getElementById('scroll');const gridEl=document.getElementById('grid');
  function onStart(x,y){startX=x;startY=y;isSwipe=false;}
  function onMove(x,y){if(!startX)return;let dx=x-startX, dy=y-startY;if(Math.abs(dx)>20 && Math.abs(dx)>Math.abs(dy)*1.2){isSwipe=true;gridEl.style.transform=`translate3d(${dx*0.6}px,0,0)`;gridEl.style.opacity=`${1-Math.min(0.3,Math.abs(dx)/300)}`;}}
  function onEnd(x,y){if(!isSwipe){gridEl.style.transform='';gridEl.style.opacity='';startX=0;return;}let dx=x-startX;gridEl.style.transform='';gridEl.style.opacity='';if(dx<-threshold){goNextPage();}else if(dx>threshold){goPrevPage();}startX=0;isSwipe=false;}
  scrollEl.addEventListener('touchstart', e=>{if(e.touches.length===1){onStart(e.touches[0].clientX,e.touches[0].clientY);}},{passive:true});
  scrollEl.addEventListener('touchmove', e=>{if(e.touches.length===1){onMove(e.touches[0].clientX,e.touches[0].clientY);}},{passive:true});
  scrollEl.addEventListener('touchend', e=>{let x=e.changedTouches[0].clientX,y=e.changedTouches[0].clientY;onEnd(x,y);},{passive:true});
})();
window.addEventListener('load',()=>{setTimeout(()=>{updateToggleBtn();loadData();}, 500);});
window.toggle=toggle;
</script>
</body>
