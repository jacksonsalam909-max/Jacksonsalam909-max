<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name=viewport content="width=device-width,initial-scale=1"><title>Daily Dialysis</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{background:linear-gradient(135deg,#e0f2fe,#f0f9ff 40%,#fef3c7 100%);min-height:100vh}
.top{background:linear-gradient(90deg,#0f4c75,#1e7bb8,#0f4c75);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.box{max-width:1100px;margin:20px auto;background:#fff;padding:20px;border-radius:16px;box-shadow:0 8px 24px #0000000d}
table{width:100%;border-collapse:separate;border-spacing:0;margin-top:14px;border-radius:12px;overflow:hidden;border:1px solid #e2e8f0}
th{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;padding:10px 8px;font-size:11px}
td{padding:9px 8px;font-size:12px;background:#fff;border-bottom:1px solid #f1f5f9}
</style></head><body>
<div class="top"><a href="index.html" style="color:#fff;text-decoration:none;font-weight:800;background:rgba(255,255,255,.2);padding:8px 14px;border-radius:8px">← Home</a><h2>Daily Dialysis</h2><div style="width:70px"></div></div>
<div class="box"><h3 style="color:#0f4c75;border-left:4px solid #f59e0b;padding-left:10px">💉 Daily Dialysis Records - Separate Page</h3><p style="color:#64748b">Only daily records shown here — no total patient table underneath</p><div id="list" style="margin-top:14px"></div></div>
<script>
let daily=JSON.parse(localStorage.getItem('shija_daily')||'[]');
let html = daily.length ? '<table><tr><th>SL</th><th>Name</th><th>SHRI ID</th><th>Time</th><th>Block</th><th>Prev Date</th><th>Action</th></tr>' : '<p style="color:#999;padding:20px;text-align:center">No daily records yet. Add from old dashboard daily section.</p>';
daily.forEach(function(d,i){
 html+='<tr><td>'+(i+1)+'</td><td>'+d.name+'</td><td>'+(d.shri||'-')+'</td><td>'+d.time+'</td><td>'+d.block+'</td><td>'+(d.prevDate||'-')+'</td><td><button onclick="if(confirm(\'Delete?\')){let a=JSON.parse(localStorage.getItem(\'shija_daily\')||\'[]\');a.splice('+i+',1);localStorage.setItem(\'shija_daily\',JSON.stringify(a));location.reload();}" style="padding:5px 10px;background:#ef4444;color:#fff;border:0;border-radius:6px;cursor:pointer">Delete</button></td></tr>';
});
if(daily.length) html+='</table>';
document.getElementById('list').innerHTML=html;
</script></body></html>
