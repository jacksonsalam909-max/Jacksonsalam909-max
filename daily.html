<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Dialysis - SHIJA</title>
<script src="Patient.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{background:#f1f5f9}
.top{background:linear-gradient(90deg,#0f4c75,#1e7bb8);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.top a{color:#fff;text-decoration:none;background:#ffffff22;padding:6px 12px;border-radius:8px}
.wrap{max-width:1200px;margin:14px auto;padding:0 12px}
.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 4px 12px #0001;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select{padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;outline:0}
.btn{padding:10px 16px;border:0;border-radius:10px;font-weight:700;cursor:pointer}
.btn-blue{background:#0f4c75;color:#fff}
.btn-green{background:#10b981;color:#fff}
.btn-dark{background:#334155;color:#fff}
.suggest{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #cbd5e1;border-radius:10px;max-height:220px;overflow:auto;z-index:50;display:none}
.suggest div{padding:10px;border-bottom:1px solid #f1f5f9;cursor:pointer}
.suggest div:hover{background:#e0f2fe}
.searchBox{position:relative;flex:1;min-width:220px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px;border:1px solid #e2e8f0;text-align:left}
th{background:#0f4c75;color:#fff;position:sticky;top:0}
tr:nth-child(even){background:#f8fafc}
.popup{position:fixed;inset:0;background:#0008;z-index:999;display:none;align-items:center;justify-content:center}
.popupBox{background:#fff;border-radius:16px;padding:18px;min-width:300px;max-width:90vw;box-shadow:0 20px 40px #0003}
.grid2{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.timeBtn{padding:12px;border:2px solid #e2e8f0;border-radius:12px;background:#fff;font-weight:700;cursor:pointer}
.timeBtn.sel{background:#0f4c75;color:#fff;border-color:#0f4c75}
.blockBtn{padding:14px;border:2px solid #e2e8f0;border-radius:12px;background:#fff;font-weight:800;cursor:pointer;text-align:center}
.blockBtn.sel{background:#f59e0b;color:#111;border-color:#f59e0b}
.filterRow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.editable{background:#fff!important;border:1.5px dashed #f59e0b!important}
.readonly{background:#f1f5f9!important}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;left:0;top:0;width:210mm}@page{size:A4;margin:12mm}.noPrint{display:none!important}}
</style></head><body>
<script>if(localStorage.getItem('shija_logged')!=='1'){location.href='index.html'}</script>
<div class="top"><b>💉 Daily Dialysis Entry</b><div><a href="index.html">Home</a> <button class="btn btn-dark noPrint" onclick="exportExcel()" style="margin-left:6px">📤 Export Excel</button> <button class="btn btn-dark noPrint" onclick="window.print()" style="margin-left:6px">🖨️ Print A4</button></div></div>

<div class="wrap">
<div class="card noPrint">
<div class="row">
<div>📅 Date: <input type="date" id="d_date"></div>
<div class="searchBox">
<input id="p_search" placeholder="Type Patient Name or SHRI ID... (hint from 510)" style="width:100%" oninput="showSuggest(this.value)" autocomplete="off">
<div id="suggest" class="suggest"></div>
</div>
<div>Name: <input id="p_name" placeholder="Patient Name" style="width:160px"></div>
<div>SHRI ID: <input id="p_shri" placeholder="Enter SHRI if blank" style="width:140px" class="editable"></div>
<div><button class="btn btn-blue" onclick="startEntry()">➕ ADD</button></div>
</div>
<div style="margin-top:8px;color:#64748b;font-size:12px">Total: <b id="totalLoaded">0</b> | SHRI blank? You can type manually in SHRI ID box</div>
</div>

<div class="card">
<div class="filterRow noPrint">
<label style="font-weight:800">Filter by TIME:</label>
<select id="timeFilter" onchange="renderTable()" style="min-width:150px">
<option value="all">All Time</option>
<option value="7am">7 AM</option>
<option value="12pm">12 PM</option>
<option value="5pm">5 PM</option>
<option value="9pm">9 PM</option>
<option value="12am">12 AM</option>
<option value="2am">2 AM</option>
</select>

<label style="font-weight:800;margin-left:10px">View Dialysis List:</label>
<input type="date" id="view_date" onchange="renderTable()">
<span style="margin-left:auto;font-size:12px;color:#64748b">Total: <b id="totalCount">0</b></span>
</div>

<div id="printArea">
<h3 style="text-align:center;margin-bottom:6px">SHIJA HOSPITALS - Daily Dialysis List</h3>
<p style="text-align:center;font-size:12px;margin-bottom:8px">Dialysis List Date: <b id="printDate"></b> | Time: <span id="printFilter"></span></p>
<table>
<thead><tr><th>Sl No</th><th>Name</th><th>SHRI ID</th><th>TIME</th><th>BLOCK</th><th>PREVIOUS DIALYSIS DATE</th><th class="noPrint">Action</th></tr></thead>
<tbody id="tblBody"></tbody>
</table>
</div>
</div>
</div>

<div id="popTime" class="popup"><div class="popupBox"><h3>⏰ Select TIME</h3><div class="grid2">
<button class="timeBtn" onclick="selectTime('7am',this)">7 AM</button>
<button class="timeBtn" onclick="selectTime('12pm',this)">12 PM</button>
<button class="timeBtn" onclick="selectTime('5pm',this)">5 PM</button>
<button class="timeBtn" onclick="selectTime('9pm',this)">9 PM</button>
<button class="timeBtn" onclick="selectTime('12am',this)">12 AM</button>
<button class="timeBtn" onclick="selectTime('2am',this)">2 AM</button>
</div><button class="btn btn-dark" style="margin-top:12px;width:100%" onclick="closePop('popTime')">Cancel</button></div></div>

<div id="popBlock" class="popup"><div class="popupBox"><h3>🏢 Select BLOCK</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<button class="blockBtn" onclick="selectBlock('Itocha',this)">Itocha</button>
<button class="blockBtn" onclick="selectBlock('Main',this)">Main</button>
</div><button class="btn btn-dark" style="margin-top:12px;width:100%" onclick="closePop('popBlock')">Cancel</button></div></div>

<div id="popPrev" class="popup"><div class="popupBox"><h3>📅 Previous Dialysis Date</h3><input type="date" id="prev_date" style="width:100%"><div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-green" style="flex:1" onclick="confirmAdd()">Add to List ✅</button><button class="btn btn-dark" style="flex:1" onclick="closePop('popPrev')">Cancel</button></div></div></div>

<script>
let excelRaw=(typeof patientData!=='undefined')?patientData:[]; 
let extra=JSON.parse(localStorage.getItem('shija_patients')||'[]');
let allPatients=[...excelRaw,...extra];
document.getElementById('totalLoaded').textContent=allPatients.length;
let today=new Date().toISOString().slice(0,10);
document.getElementById('d_date').value=today;
document.getElementById('view_date').value=today;
document.getElementById('printDate').textContent=today;
let temp={name:'',shri:'',time:'',block:'',prev:''};

function showSuggest(q){
 q=q.toLowerCase().trim();
 let box=document.getElementById('suggest');
 if(q.length<1){box.style.display='none';return;}
 let filtered=allPatients.filter(p=>{
  let n=(p.patientName||'').toLowerCase();
  let s=(p.shriId||'').toLowerCase();
  return n.includes(q) || s.includes(q);
 }).slice(0,20);
 if(!filtered.length){box.style.display='none';return;}
 box.innerHTML=filtered.map(p=>`<div onclick="pickPatient('${(p.patientName||'').replace(/'/g,"&#39;")}','${(p.shriId||'').replace(/'/g,"&#39;")}')"><b>${p.patientName}</b> - <span style="color:#64748b">${p.shriId||'No SHRI - you can enter'}</span></div>`).join('');
 box.style.display='block';
}
function pickPatient(name,shri){
 document.getElementById('p_name').value=name;
 document.getElementById('p_shri').value=shri;
 document.getElementById('p_search').value=name;
 document.getElementById('suggest').style.display='none';
 // If SHRI blank, make it editable and focus
 let shriInput=document.getElementById('p_shri');
 if(!shri){shriInput.classList.add('editable');shriInput.placeholder='Enter SHRI ID here';shriInput.focus();}
 else{shriInput.classList.remove('editable');}
 temp.name=name; temp.shri=shri;
}
// Allow manual typing in SHRI and Name boxes
document.getElementById('p_name').addEventListener('input',e=>{temp.name=e.target.value.trim();});
document.getElementById('p_shri').addEventListener('input',e=>{temp.shri=e.target.value.trim();});

function startEntry(){
 // Read latest values from inputs (allow manual entry)
 temp.name=document.getElementById('p_name').value.trim() || temp.name;
 temp.shri=document.getElementById('p_shri').value.trim() || temp.shri;
 if(!temp.name){alert('Enter Patient Name');return;}
 if(!temp.shri){
   if(!confirm('SHRI ID is blank. Continue without SHRI or enter now? Click OK to continue blank, Cancel to enter SHRI')) return;
 }
 document.getElementById('popTime').style.display='flex';
}
function selectTime(t,el){
 document.querySelectorAll('.timeBtn').forEach(b=>b.classList.remove('sel'));
 el.classList.add('sel');
 temp.time=t;
 setTimeout(()=>{closePop('popTime'); document.getElementById('popBlock').style.display='flex';},250);
}
function selectBlock(b,el){
 document.querySelectorAll('.blockBtn').forEach(x=>x.classList.remove('sel'));
 el.classList.add('sel');
 temp.block=b;
 setTimeout(()=>{closePop('popBlock'); document.getElementById('popPrev').style.display='flex';},250);
}
function confirmAdd(){
 let prev=document.getElementById('prev_date').value;
 if(!prev){alert('Select previous dialysis date');return;}
 temp.prev=prev;
 let dialDate=document.getElementById('d_date').value||today;
 let list=JSON.parse(localStorage.getItem('shija_daily')||'[]');
 // final SHRI from input box again
 temp.shri=document.getElementById('p_shri').value.trim();
 temp.name=document.getElementById('p_name').value.trim();
 list.push({id:Date.now(),date:dialDate,name:temp.name,shriId:temp.shri||'N/A',time:temp.time,block:temp.block,prevDate:temp.prev});
 localStorage.setItem('shija_daily',JSON.stringify(list));
 closePop('popPrev');
 temp={name:'',shri:'',time:'',block:'',prev:''};
 document.getElementById('p_search').value=''; document.getElementById('p_name').value=''; document.getElementById('p_shri').value='';
 document.getElementById('prev_date').value='';
 renderTable();
}
function closePop(id){document.getElementById(id).style.display='none';}
function renderTable(){
 let viewDate=document.getElementById('view_date').value||today;
 let timeFilter=document.getElementById('timeFilter').value;
 document.getElementById('printDate').textContent=viewDate;
 document.getElementById('printFilter').textContent=timeFilter.toUpperCase();
 let list=JSON.parse(localStorage.getItem('shija_daily')||'[]').filter(x=>x.date===viewDate);
 if(timeFilter!=='all'){list=list.filter(x=>x.time===timeFilter);}
 let tbody=document.getElementById('tblBody');
 tbody.innerHTML=list.map((r,i)=>`<tr><td>${i+1}</td><td>${r.name}</td><td>${r.shriId}</td><td>${r.time}</td><td>${r.block}</td><td>${r.prevDate}</td><td class="noPrint"><button onclick="delEntry(${r.id})" style="background:#ef4444;color:#fff;border:0;padding:4px 8px;border-radius:6px;cursor:pointer">✕</button></td></tr>`).join('') || `<tr><td colspan="7" style="text-align:center;color:#94a3b8">No patients for ${viewDate}</td></tr>`;
 document.getElementById('totalCount').textContent=list.length;
}
function delEntry(id){
 if(!confirm('Delete?'))return;
 let list=JSON.parse(localStorage.getItem('shija_daily')||'[]');
 list=list.filter(x=>x.id!==id);
 localStorage.setItem('shija_daily',JSON.stringify(list));
 renderTable();
}
function exportExcel(){
 let viewDate=document.getElementById('view_date').value||today;
 let timeFilter=document.getElementById('timeFilter').value;
 let list=JSON.parse(localStorage.getItem('shija_daily')||'[]').filter(x=>x.date===viewDate);
 if(timeFilter!=='all') list=list.filter(x=>x.time===timeFilter);
 if(!list.length){alert('No data for '+viewDate);return;}
 let exportData=list.map((r,i)=>({"Sl No":i+1,"Name":r.name,"SHRI ID":r.shriId,"TIME":r.time,"BLOCK":r.block,"PREVIOUS DIALYSIS DATE":r.prevDate,"DIALYSIS DATE":r.date}));
 let ws=XLSX.utils.json_to_sheet(exportData);
 ws['!cols']=[{wch:6},{wch:28},{wch:14},{wch:10},{wch:12},{wch:20},{wch:14}];
 let wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,ws,'Daily_'+viewDate);
 XLSX.writeFile(wb,`SHIJA_Daily_${viewDate}_${timeFilter}.xlsx`);
}
document.addEventListener('click',e=>{if(!e.target.closest('.searchBox'))document.getElementById('suggest').style.display='none';});
renderTable();
</script></body></html>
