<script>
let savedZoom = parseFloat(localStorage.getItem('gda_completed_zoom') || '1');
if(savedZoom < 1 || savedZoom > 3 || isNaN(savedZoom)) {savedZoom = 1; localStorage.setItem('gda_completed_zoom','1');}
let zoomLevel = savedZoom;
const zoomWrap = document.getElementById('zoomWrap');
const scrollEl = document.getElementById('scroll');
const zoomInfo = document.getElementById('zoomInfo');
const zoomBtns = document.getElementById('zoomBtns');
let zoomBtnsTimeout,initialDistance=0,initialZoom=1,isPinching=false;
function showZoomBtns(){zoomBtns.classList.add('show');clearTimeout(zoomBtnsTimeout);zoomBtnsTimeout=setTimeout(()=>{if(zoomLevel<=1.01)zoomBtns.classList.remove('show');},4000);}
function applyZoom(smooth=true){
  if(!zoomWrap) return;
  zoomWrap.style.transition=smooth?'transform 0.35s cubic-bezier(0.25,0.8,0.25,1)':'none';
  zoomWrap.style.transform=`scale(${zoomLevel})`;
  if(zoomInfo){zoomInfo.textContent=Math.round(zoomLevel*100)+'%';zoomInfo.style.display=zoomLevel>1.01?'block':'none';}
  if(zoomLevel>1.01) showZoomBtns();
}
function zoomIn(){zoomLevel=Math.min(zoomLevel+0.15,2.5);localStorage.setItem('gda_completed_zoom',zoomLevel);applyZoom(true);showZoomBtns();}
function zoomOut(){zoomLevel=Math.max(zoomLevel-0.15,1);localStorage.setItem('gda_completed_zoom',zoomLevel);applyZoom(true);showZoomBtns();}
let lastTap=0;
zoomWrap.addEventListener('touchend', e=>{
  if(isPinching) return;
  if(e.target.closest('button, .chip, .pageBtn, .tab, input, select, .viewIconSingle, .btnUndo')) return;
  let now=Date.now();
  if(now-lastTap<350){e.preventDefault();zoomIn();}
  lastTap=now;
},{passive:false});
zoomWrap.addEventListener('touchstart', e=>{
  if(e.touches.length===2){
    isPinching=true;
    initialDistance=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    initialZoom=zoomLevel;showZoomBtns();zoomWrap.style.transition='none';
  }
},{passive:true});
zoomWrap.addEventListener('touchmove', e=>{
  if(e.touches.length===2 && isPinching){
    e.preventDefault();
    let cur=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    zoomLevel=Math.max(1,Math.min(initialZoom*(cur/initialDistance),2.5));
    localStorage.setItem('gda_completed_zoom',zoomLevel);
    applyZoom(false);
  }
},{passive:false});
zoomWrap.addEventListener('touchend', e=>{if(e.touches.length<2){isPinching=false;zoomWrap.style.transition='transform 0.35s cubic-bezier(0.25,0.8,0.25,1)';}},{passive:true});
let params=new URLSearchParams(location.search);
document.getElementById('fDate').value=params.get('date')||new Date().toISOString().slice(0,10);
if(params.get('type')) document.getElementById('fType').value=params.get('type');
let allPatients=[],statusMap={},activeTimeFilter='',currentPage=1,gridPageSize=36,listPageSize=10,searchQuery='',isListView=true;
const gridIconSVG=`<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/></svg>`;
const listIconSVG=`<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="2.5" width="6.5" height="6.5" rx="1.2"/><line x1="13.5" y1="5.7" x2="21" y2="5.7"/><rect x="3" y="9.5" width="6.5" height="6.5" rx="1.2"/><line x1="13.5" y1="12.7" x2="21" y2="12.7"/><rect x="3" y="16.5" width="6.5" height="6.5" rx="1.2"/><line x1="13.5" y1="19.7" x2="21" y2="19.7"/></svg>`;
function getPageSize(){return isListView?listPageSize:gridPageSize;}
function normalizeTime(t){if(!t)return'';let s=String(t).toUpperCase().trim();let m=s.match(/(\d{1,2})(?::(\d{1,2}))?\s*([AP]M)?/);if(!m)return s;let h=parseInt(m[1]),mi=m[2]?m[2].padStart(2,'0'):'00',ap=m[3]||'';if(!ap){if(s.includes('AM'))ap='AM';else if(s.includes('PM'))ap='PM';}return ap?`${h}:${mi} ${ap}`:`${h}:${mi}`;}
async function loadData(){let d=document.getElementById('fDate').value,s=document.getElementById('fType').value,id=d+'_'+s;let snap=await window._fb.getDoc(window._fb.doc(window._fb.db,'daily_dialysis_lists',id));allPatients=snap.exists()?(snap.data().patients||[]):[];let sSnap=await window._fb.getDoc(window._fb.doc(window._fb.db,'daily_photo_opd',id));statusMap=sSnap.exists()?(sSnap.data().status||{}):{};currentPage=1;render();}
async function saveStatus(){let d=document.getElementById('fDate').value,s=document.getElementById('fType').value,id=d+'_'+s;await window._fb.setDoc(window._fb.doc(window._fb.db,'daily_photo_opd',id),{date:d,scheme:s,status:statusMap,updatedAt:new Date().toISOString()});}
function bringBack(sh){if(statusMap[sh]){statusMap[sh].photoTaken=false;statusMap[sh].opdDone=false;}saveStatus();render();}
function getInit(n){return (n||'A').charAt(0).toUpperCase();}
function getCol(name){const colors=['linear-gradient(135deg,#8B5CF6,#6366F1)','linear-gradient(135deg,#F59E0B,#F97316)','linear-gradient(135deg,#10B981,#06B6D4)','linear-gradient(135deg,#EF4444,#EC4899)','linear-gradient(135deg,#3B82F6,#06B6D4)','linear-gradient(135deg,#8B5CF6,#EC4899)','linear-gradient(135deg,#F97316,#EF4444)'];let hash=0;for(let i=0;i<name.length;i++){hash=name.charCodeAt(i)+((hash<<5)-hash);}return colors[Math.abs(hash)%colors.length];}
function getFilteredDone(){let tn=normalizeTime(activeTimeFilter);let bf=document.getElementById('filterBlock').value;let sq=searchQuery.toLowerCase().trim();return allPatients.filter(p=>{let sh=String(p.shri||'').toUpperCase();if(!sh)return false;if(activeTimeFilter&&normalizeTime(p.time)!==tn)return false;if(bf&&p.block!==bf)return false;let st=statusMap[sh]||{photoTaken:false,opdDone:false};if(!(st.photoTaken&&st.opdDone))return false;if(sq){let nameL=String(p.name||'').toLowerCase();let shriL=sh.toLowerCase();if(!nameL.includes(sq)&&!shriL.includes(sq))return false;}return true;});}
function updateToggleBtn(){let btn=document.getElementById('toggleViewBtn');if(btn){if(isListView){btn.innerHTML=gridIconSVG;}else{btn.innerHTML=listIconSVG;}}}
function render(direction){
  let grid=document.getElementById('grid');grid.classList.toggle('listView', isListView);
  if(direction){grid.classList.add(direction==='next'?'swipe-out-left':'swipe-out-right');setTimeout(()=>{doRender();grid.classList.remove('swipe-out-left','swipe-out-right');},180);}else{doRender();}
  function doRender(){
    grid.innerHTML='';let filtered=getFilteredDone();let ps=getPageSize();let pages=Math.max(1,Math.ceil(filtered.length/ps));if(currentPage>pages)currentPage=pages;let items=filtered.slice((currentPage-1)*ps,currentPage*ps);
    items.forEach(p=>{
      let sh=String(p.shri||'').toUpperCase();
      let div=document.createElement('div');div.className=isListView?'card listCard doneCard':'card doneCard';
      if(isListView){
        div.innerHTML=`<div class="cardTop"><div class="avatarSq" style="background:${getCol(p.name)}">${getInit(p.name)}</div><div class="info"><div class="name">${p.name}</div><div class="sub">${p.time||''} • ${p.block||'MAIN'} • ${sh} • ✓ DONE</div></div></div><div class="actions"><button class="btnUndo list" onclick="bringBack('${sh}')">UNDO</button></div>`;
      } else {
        div.innerHTML=`<div class="badgeDone">✓ DONE</div><div class="cardTop"><div class="avatarSq" style="background:${getCol(p.name)}">${getInit(p.name)}</div><div class="info"><div class="name">${p.name}</div><div class="sub">${p.time||''} • ${p.block||'MAIN'} • ${sh}</div></div></div><div class="actions"><button class="btnUndo" onclick="bringBack('${sh}')">UNDO</button></div>`;
      }
      grid.appendChild(div);
    });
    if(filtered.length===0){grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:40px;background:#fff;border-radius:16px;color:#0B1F4A;font-weight:700">No completed patients yet</div>`;}
    let pg=document.getElementById('pages');pg.innerHTML='';if(pages>1){for(let i=1;i<=pages;i++){let b=document.createElement('button');b.className='pageBtn'+(i===currentPage?' active':'');b.innerText=i;b.onclick=()=>{currentPage=i;render();};pg.appendChild(b);}}
    let totalDone = allPatients.filter(p=>{let sh=String(p.shri||'').toUpperCase();let st=statusMap[sh];return st&&st.photoTaken&&st.opdDone;}).length;
    document.getElementById('cLeft').innerText=`${totalDone} COMPLETED • Showing ${filtered.length}`;document.getElementById('cRight').innerText=`DONE ${filtered.length}`;document.getElementById('doneB').innerText=totalDone;
    updateToggleBtn();
  }
}
function goNextPage(){let ps=getPageSize();let pages=Math.max(1,Math.ceil(getFilteredDone().length/ps));if(currentPage<pages){currentPage++;render('next');return true;}}
function goPrevPage(){if(currentPage>1){currentPage--;render('prev');return true;}}
document.getElementById('toggleViewBtn').addEventListener('click', e=>{e.stopPropagation();isListView=!isListView;localStorage.setItem('gda_completed_view',isListView?'list':'grid');currentPage=1;render();});
(function(){
  let startX=0,startY=0,isSwipe=false,threshold=80;
  function onStart(x,y){startX=x;startY=y;isSwipe=false;}
  function onMove(x,y){
    if(!startX || isPinching) return;
    let dx=x-startX,dy=y-startY;
    if(Math.abs(dx)>25 && Math.abs(dx)>Math.abs(dy)*1.3){
      isSwipe=true;
      document.getElementById('grid').style.transform=`translate3d(${dx*0.5}px,0,0)`;
    }
  }
  function onEnd(x,y){
    document.getElementById('grid').style.transform='';
    if(!isSwipe){startX=0;return;}
    let dx=x-startX;
    if(dx<-threshold) goNextPage();
    else if(dx>threshold) goPrevPage();
    startX=0;isSwipe=false;
  }
  scrollEl.addEventListener('touchstart', e=>{if(e.touches.length===1)onStart(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
  scrollEl.addEventListener('touchmove', e=>{if(e.touches.length===1)onMove(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
  scrollEl.addEventListener('touchend', e=>{onEnd(e.changedTouches[0].clientX,e.changedTouches[0].clientY);},{passive:true});
})();
const drawer=document.getElementById('drawer');const overlay=document.getElementById('overlay');const menuBtn=document.getElementById('menuBtn');const closeBtn=document.getElementById('closeDrawerBtn');let isOpen=false;
function openMenu(){isOpen=true;drawer.classList.add('open');overlay.classList.add('show');}
function closeMenu(){isOpen=false;drawer.classList.remove('open');overlay.classList.remove('show');}
menuBtn.addEventListener('click', openMenu);closeBtn.addEventListener('click', closeMenu);overlay.addEventListener('click', closeMenu);
document.getElementById('fDate').addEventListener('change',loadData);
document.getElementById('fType').addEventListener('change',loadData);
document.getElementById('backBtn').addEventListener('click', ()=>{let d=document.getElementById('fDate').value,t=document.getElementById('fType').value;location.href='gda.html?date='+encodeURIComponent(d)+'&type='+encodeURIComponent(t);});
window.addEventListener('load',()=>{updateToggleBtn();loadData();applyZoom();});
window.bringBack=bringBack;window.zoomIn=zoomIn;window.zoomOut=zoomOut;
</script>
</body>
</html>
