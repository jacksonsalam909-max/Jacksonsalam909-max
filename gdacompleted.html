<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SHIJA HOSPITALS - COMPLETED</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#eef2f8;width:100%;min-height:100dvh;overflow:auto}
.top{position:fixed;top:0;left:0;right:0;z-index:100;background:linear-gradient(135deg,#0B1F4A 0%,#12367F 100%);padding:12px;color:#fff;display:flex;align-items:center;gap:10px;box-shadow:0 4px 20px rgba(11,31,74,0.3);height:58px}
.menuBtn{width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,0.18);color:#fff;font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer}
.hWrap{flex:1;min-width:0}.hTitle{font-size:13px;font-weight:900;text-transform:uppercase}.hSub{font-size:9px;opacity:0.85;margin-top:2px}
.topActions{display:flex;gap:8px;align-items:center}
.viewDropdown{height:38px;border-radius:12px;border:0;background:#fff;color:#0B1F4A;font-size:11px;font-weight:900;padding:0 12px;min-width:130px}
.btnBack{height:38px;padding:0 14px;border-radius:12px;border:0;background:#fff;color:#0B1F4A;font-size:11px;font-weight:900;cursor:pointer}
.app{min-height:100dvh;display:flex;flex-direction:column;padding-top:58px}
.rowTop{display:flex;gap:8px;margin-top:10px}
.dateBox{flex:1;border-radius:14px;height:46px;display:flex;align-items:center;padding:0 12px;background:#fff}
.dateBox input,.dateBox select{border:0;width:100%;font-weight:700;font-size:13px;outline:none;background:transparent;color:#0B1F4A}
.count{margin-top:10px;background:rgba(255,255,255,0.15);border-radius:14px;height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:12px;font-weight:700;border:1px solid rgba(255,255,255,0.15)}
.count span:last-child{background:#fff;color:#0B1F4A;padding:6px 12px;border-radius:100px;font-size:11px;font-weight:800}
.filter{padding:10px 12px;display:flex;gap:6px;overflow-x:auto;background:#fff;border-bottom:1px solid #dde4f0;position:sticky;top:58px;z-index:5}
.filter::-webkit-scrollbar{display:none}
.chip{height:34px;padding:0 14px;border-radius:100px;border:1.5px solid #d0d9ea;background:#f4f7fd;font-weight:800;font-size:10px;white-space:nowrap;flex-shrink:0;color:#4a5f85}
.chip.on{background:#0B1F4A;color:#fff;border-color:#0B1F4A}
.searchBar{padding:10px 12px;display:flex;gap:8px;background:#fff;border-bottom:1px solid #dde4f0;align-items:center;flex-wrap:wrap;position:sticky;top:106px;z-index:5}
.searchInputWrap{flex:1;position:relative;display:flex;align-items:center;min-width:140px}
.searchInput{width:100%;height:42px;border:1.5px solid #d0d9ea;background:#f4f7fd;padding:0 14px;border-radius:100px;font-weight:700;font-size:12px;color:#0B1F4A;outline:none}
.clearSearch{position:absolute;right:8px;width:28px;height:28px;border-radius:50%;border:0;background:#dde4f0;color:#0B1F4A;font-weight:900;font-size:14px;display:none;align-items:center;justify-content:center;cursor:pointer}
.searchMeta{padding:6px 12px 8px;background:#fff;font-size:10px;font-weight:700;color:#5a7196;display:flex;justify-content:space-between;min-height:18px;position:sticky;top:158px;z-index:5}
.viewIconSingle{width:46px;height:42px;border-radius:100px;border:1.5px solid #d0d9ea;background:#f4f7fd;display:flex;align-items:center;justify-content:center;cursor:pointer}
.viewIconSingle svg{width:22px;height:22px}
.viewIconSingle svg rect{stroke:#0B1F4A;stroke-width:2.2;fill:none}
.viewIconSingle svg line{stroke:#0B1F4A;stroke-width:2.6;stroke-linecap:round}

/* === BROADER WIDER BIGGER === */
.scroll{padding:0px !important;background:#eef2f8 !important}
.grid{width:100%}
.grid.listView{grid-template-columns:1fr !important;gap:8px !important;padding:8px 0 !important;width:100% !important}
.card.listCard{
  flex-direction:row !important;justify-content:flex-start !important;align-items:center !important;gap:14px !important;
  padding:20px 16px !important;border-radius:18px !important;
  width:calc(100% - 12px) !important;margin:0 auto !important;
  min-height:110px !important;background:#fff !important;border:0 !important;
  border-left:7px solid #16a34a !important;box-shadow:0 8px 24px rgba(11,31,74,0.12) !important;
}
.card.listCard .cardTop{flex:1 !important;display:flex !important;align-items:center !important;gap:14px !important;min-width:0 !important}
.card.listCard .avatarSq{width:64px !important;height:64px !important;font-size:28px !important;font-weight:900 !important;border-radius:18px !important;color:#fff !important;box-shadow:0 6px 16px rgba(0,0,0,0.18) !important;display:flex !important;align-items:center !important;justify-content:center !important}
.card.listCard .info{flex:1 !important;min-width:0 !important}
.card.listCard .name{font-size:18.5px !important;font-weight:900 !important;color:#0B1F4A !important;line-height:1.15 !important;text-transform:uppercase !important;white-space:nowrap !important;overflow:hidden !important;text-overflow:ellipsis !important}
.card.listCard .sub{font-size:12.5px !important;font-weight:800 !important;color:#5a7196 !important;margin-top:5px !important}
.card.listCard .actions{margin-left:auto !important;flex-shrink:0 !important}
.btnUndo.list{height:62px !important;min-width:132px !important;padding:0 26px !important;font-size:14px !important;font-weight:900 !important;letter-spacing:0.8px !important;border-radius:16px !important;background:#0B1F4A !important;color:#fff !important;border:0 !important;box-shadow:0 8px 20px rgba(11,31,74,0.35) !important}
.cardTop{display:flex;gap:9px;align-items:center}
.avatarSq{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:17px;flex-shrink:0}
.info{flex:1;min-width:0}
.name{font-size:13px;font-weight:900;color:#0B1F4A;text-transform:uppercase}
.sub{margin-top:3px;font-size:8.5px;font-weight:700;color:#6b7fa3}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:90;background:#fff;border-top:1px solid #dde4f0;display:flex;justify-content:space-around;padding:8px 0 max(16px,env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;font-weight:700;color:#8aa0c5;cursor:pointer}
.tab.active{color:#0B1F4A}
.tab .ic{width:30px;height:30px;border-radius:12px;background:#e8eefb;display:flex;align-items:center;justify-content:center;font-size:14px;color:#0B1F4A}
.tab.active .ic{background:#0B1F4A;color:#fff}
.pages{display:flex;justify-content:center;gap:8px;padding:16px 0 90px;flex-wrap:wrap}
.pageBtn{min-width:42px;height:42px;border-radius:12px;border:1.5px solid #d0d9ea;background:#fff;font-weight:800;font-size:13px;color:#0B1F4A}
.pageBtn.active{background:#0B1F4A;color:#fff}
.overlay{position:fixed;inset:0;background:rgba(11,31,74,0.55);backdrop-filter:blur(5px);z-index:9998;display:none;opacity:0;transition:opacity 0.3s ease;pointer-events:none}
.overlay.show{display:block;opacity:1;pointer-events:auto}
.drawer{position:fixed;left:0;top:0;bottom:0;width:85%;max-width:300px;background:#fff;z-index:9999;transform:translate3d(-100%,0,0);transition:transform 0.35s cubic-bezier(0.32,0.72,0,1);box-shadow:8px 0 40px rgba(11,31,74,0.3);display:flex;flex-direction:column;overflow:hidden;pointer-events:none}
.drawer.open{transform:translate3d(0,0,0);pointer-events:auto}
.drawerTop{background:linear-gradient(135deg,#0B1F4A,#12367F);padding:20px 16px 16px;color:#fff;flex-shrink:0}
.menuList{padding:8px 0;flex:1;overflow-y:auto}
.menuItem{padding:17px 20px;font-size:13px;font-weight:800;color:#334155;cursor:pointer;border-left:4px solid transparent;min-height:54px;display:block}
.menuItem.active{background:#e8eefb;color:#0B1F4A;border-left-color:#0B1F4A}
.drawerDropdown{margin-top:12px;width:100%;height:44px;border-radius:12px;border:0;background:#fff;color:#0B1F4A;font-size:12px;font-weight:900;padding:0 12px;outline:none}
</style>
</head>
<body>
<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer"><div class="drawerTop"><div style="display:flex;justify-content:space-between;align-items:center"><div><b>SHIJA HOSPITALS</b><small>COMPLETED LIST</small></div><button id="closeDrawerBtn" style="width:48px;height:48px;border-radius:12px;border:0;background:rgba(255,255,255,0.22);color:#fff;font-size:26px;font-weight:900">✕</button></div></div><div class="menuList"><div class="menuItem" data-url="gda.html">PENDING LIST</div><div class="menuItem active" data-url="gdacompleted.html">COMPLETED LIST</div><div class="menuItem" data-url="index.html">HOME</div></div></div>
<div class="top"><button class="menuBtn" id="menuBtn">☰</button><div class="hWrap"><div class="hTitle">SHIJA HOSPITALS</div><div class="hSub">COMPLETED - DONE LIST</div></div><div class="topActions"><select id="viewModeTop" class="viewDropdown"><option value="mobile">MOBILE VIEW</option><option value="desktop">DESKTOP VIEW</option></select><button class="btnBack" id="backBtn">BACK</button></div></div>
<div class="app"><div style="background:linear-gradient(135deg,#0B1F4A 0%,#12367F 100%);padding:0 12px 12px"><div class="rowTop"><div class="dateBox"><input type="date" id="fDate"></div><div class="dateBox" style="max-width:100px"><select id="fType"><option>PMJAY</option><option>CMHT</option></select></div></div><div class="count"><span id="cLeft">Loading completed...</span><span id="cRight">DONE 0</span></div></div><div class="filter"><button class="chip on" data-time="">ALL</button><button class="chip" data-time="7:00 AM">7 AM</button><button class="chip" data-time="12:00 PM">12 PM</button><button class="chip" data-time="5:00 PM">5 PM</button></div><div class="searchBar"><div class="searchInputWrap"><input type="text" id="searchName" class="searchInput" placeholder="Search completed..." autocomplete="off"><button class="clearSearch" id="clearSearch">✕</button></div><select id="filterBlock" style="border:1.5px solid #d0d9ea;background:#f4f7fd;padding:0 12px;height:42px;border-radius:100px;font-weight:800;font-size:10px;color:#0B1F4A;min-width:105px"><option value="">All Block</option><option value="MAIN">MAIN</option><option value="ITOCHA">ITOCHA</option></select><button id="toggleViewBtn" class="viewIconSingle" title="Toggle View"></button></div><div class="searchMeta"><span id="searchInfo"></span><span id="blockInfo"></span></div><div class="scroll" id="scroll"><div class="grid" id="grid"></div><div class="pages" id="pages"></div></div></div>
<div class="bottom">
  <div class="tab" id="tabHome"><div class="ic">⌂</div>Home</div>
  <div class="tab active" id="tabDone"><div class="ic">✓</div>Done <span id="doneB" style="background:#22c55e;color:#fff;padding:2px 6px;border-radius:100px;font-size:8px">0</span></div>
  <div class="tab" id="tabSync"><div class="ic">↻</div>Refresh</div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,getDoc,setDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app=initializeApp(cfg,"gda_completed_"+Math.random());const db=getFirestore(app);window._fb={db,doc,getDoc,setDoc};
</script>
<script>
let params=new URLSearchParams(location.search);
document.getElementById('fDate').value=params.get('date')||new Date().toISOString().slice(0,10);
if(params.get('type')) document.getElementById('fType').value=params.get('type');
let allPatients=[],statusMap={},activeTimeFilter='',currentPage=1,gridPageSize=36,listPageSize=10,searchQuery='',isListView=true;
const gridIconSVG=`<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/></svg>`;
const listIconSVG=`<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="2.5" width="6.5" height="6.5" rx="1.2"/><line x1="13.5" y1="5.7" x2="21" y2="5.7"/><rect x="3" y="9.5" width="6.5" height="6.5" rx="1.2"/><line x1="13.5" y1="12.7" x2="21" y2="12.7"/><rect x="3" y="16.5" width="6.5" height="6.5" rx="1.2"/><line x1="13.5" y1="19.7" x2="21" y2="19.7"/></svg>`;
function getPageSize(){return isListView?listPageSize:gridPageSize;}
function normalizeTime(t){if(!t)return'';let s=String(t).toUpperCase().trim();let m=s.match(/(\d{1,2})(?::(\d{1,2}))?\s*([AP]M)?/);if(!m)return s;let h=parseInt(m[1]),mi=m[2]?m[2].padStart(2,'0'):'00',ap=m[3]||'';if(!ap){if(s.includes('AM'))ap='AM';else if(s.includes('PM'))ap='PM';}return ap?`${h}:${mi} ${ap}`:`${h}:${mi}`;}
async function loadData(){let d=document.getElementById('fDate').value,s=document.getElementById('fType').value,id=d+'_'+s;let snap=await window._fb.getDoc(window._fb.doc(window._fb.db,'daily_dialysis_lists',id));allPatients=snap.exists()?(snap.data().patients||[]):[];let sSnap=await window._fb.getDoc(window._fb.doc(window._fb.db,'daily_photo_opd',id));statusMap=sSnap.exists()?(sSnap.data().status||{}):{};currentPage=1;render();}
async function saveStatus(){let d=document.getElementById('fDate').value,s=document.getElementById('fType').value,id=d+'_'+s;await window._fb.setDoc(window._fb.doc(window._fb.db,'daily_photo_opd',id),{date:d,scheme:s,status:statusMap,updatedAt:new Date().toISOString()});}
function bringBack(sh){if(statusMap[sh]){statusMap[sh].photoTaken=false;statusMap[sh].opdDone=false;}saveStatus();render();}
function getInit(n){return (n||'A').charAt(0).toUpperCase();}
function getCol(name){const colors=['linear-gradient(135deg,#8B5CF6,#6366F1)','linear-gradient(135deg,#F59E0B,#F97316)','linear-gradient(135deg,#10B981,#06B6D4)','linear-gradient(135deg,#EF4444,#EC4899)','linear-gradient(135deg,#3B82F6,#06B6D4)'];let hash=0;for(let i=0;i<name.length;i++){hash=name.charCodeAt(i)+((hash<<5)-hash);}return colors[Math.abs(hash)%colors.length];}
function getFilteredDone(){let tn=normalizeTime(activeTimeFilter);let bf=document.getElementById('filterBlock').value;let sq=searchQuery.toLowerCase().trim();return allPatients.filter(p=>{let sh=String(p.shri||'').toUpperCase();if(!sh)return false;if(activeTimeFilter&&normalizeTime(p.time)!==tn)return false;if(bf&&p.block!==bf)return false;let st=statusMap[sh]||{photoTaken:false,opdDone:false};if(!(st.photoTaken&&st.opdDone))return false;if(sq){let nameL=String(p.name||'').toLowerCase();let shriL=sh.toLowerCase();if(!nameL.includes(sq)&&!shriL.includes(sq))return false;}return true;});}
function updateToggleBtn(){let btn=document.getElementById('toggleViewBtn');if(btn){if(isListView){btn.innerHTML=gridIconSVG;}else{btn.innerHTML=listIconSVG;}}}
function render(){
  let grid=document.getElementById('grid');grid.classList.toggle('listView', isListView);
  grid.innerHTML='';let filtered=getFilteredDone();let ps=getPageSize();let pages=Math.max(1,Math.ceil(filtered.length/ps));if(currentPage>pages)currentPage=pages;let items=filtered.slice((currentPage-1)*ps,currentPage*ps);
  items.forEach(p=>{
    let sh=String(p.shri||'').toUpperCase();
    let div=document.createElement('div');div.className='card listCard doneCard';
    div.innerHTML=`<div class="cardTop"><div class="avatarSq" style="background:${getCol(p.name)}">${getInit(p.name)}</div><div class="info"><div class="name">${p.name}</div><div class="sub">${p.time||''} • ${p.block||'MAIN'} • ${sh} • ✓ DONE</div></div></div><div class="actions"><button class="btnUndo list" onclick="bringBack('${sh}')">UNDO</button></div>`;
    grid.appendChild(div);
  });
  if(filtered.length===0){grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:40px;background:#fff;border-radius:16px;color:#0B1F4A;font-weight:700">No completed patients yet</div>`;}
  let pg=document.getElementById('pages');pg.innerHTML='';if(pages>1){for(let i=1;i<=pages;i++){let b=document.createElement('button');b.className='pageBtn'+(i===currentPage?' active':'');b.innerText=i;b.onclick=()=>{currentPage=i;render();};pg.appendChild(b);}}
  let totalDone = allPatients.filter(p=>{let sh=String(p.shri||'').toUpperCase();let st=statusMap[sh];return st&&st.photoTaken&&st.opdDone;}).length;
  document.getElementById('cLeft').innerText=`${totalDone} COMPLETED • Showing ${filtered.length}`;document.getElementById('cRight').innerText=`DONE ${filtered.length}`;document.getElementById('doneB').innerText=totalDone;
  updateToggleBtn();
}
document.getElementById('toggleViewBtn').addEventListener('click', e=>{e.stopPropagation();isListView=!isListView;localStorage.setItem('gda_completed_view',isListView?'list':'grid');currentPage=1;render();});
const drawer=document.getElementById('drawer');const overlay=document.getElementById('overlay');const menuBtn=document.getElementById('menuBtn');const closeBtn=document.getElementById('closeDrawerBtn');
function openMenu(){drawer.classList.add('open');overlay.classList.add('show');}
function closeMenu(){drawer.classList.remove('open');overlay.classList.remove('show');}
menuBtn.addEventListener('click', openMenu);closeBtn.addEventListener('click', closeMenu);overlay.addEventListener('click', closeMenu);
document.getElementById('fDate').addEventListener('change',loadData);
document.getElementById('fType').addEventListener('change',loadData);
document.getElementById('backBtn').addEventListener('click', ()=>{let d=document.getElementById('fDate').value,t=document.getElementById('fType').value;location.href='gda.html?date='+encodeURIComponent(d)+'&type='+encodeURIComponent(t);});
document.getElementById('tabHome').addEventListener('click', ()=>{let d=document.getElementById('fDate').value,t=document.getElementById('fType').value;location.href='gda.html?date='+encodeURIComponent(d)+'&type='+encodeURIComponent(t);});
document.getElementById('tabSync').addEventListener('click', ()=>{location.reload();});
window.addEventListener('load',()=>{updateToggleBtn();loadData();});
window.bringBack=bringBack;
</script>
</body>
</html>
