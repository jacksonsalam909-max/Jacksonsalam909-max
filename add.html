<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add Patient - SHIJA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Segoe UI',system-ui}
body{background:#f1f3f6;display:flex;flex-direction:column;min-height:100vh;color:#0f172a}
.top{height:64px;background:#0a1931;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:100}
.top h2{color:#fff;font-size:16px;font-weight:800}
.menuBtn{width:36px;height:36px;border-radius:8px;border:1.5px solid #1e2d55;background:#13264d;color:#fff;display:grid;place-items:center;cursor:pointer}
.side{width:230px;min-width:230px;background:#0a1931;display:flex;flex-direction:column;justify-content:space-between;padding:16px 10px;position:fixed;left:0;top:64px;height:calc(100vh - 64px);z-index:90}
.side a{padding:12px 14px;border-radius:10px;text-decoration:none;color:#8ea0c0;font-weight:600;font-size:14px}
.side a.active{background:#13264d;color:#fff;border-left:3px solid #1a56db}
.content{flex:1;padding:16px 14px;max-width:700px;width:100%;margin-left:230px}
.card{background:#fff;border-radius:16px;box-shadow:0 10px 30px #00000008;border:1px solid #e5e7eb;padding:20px;margin-top:14px}
.field{margin-bottom:14px}
.field label{font-size:12px;font-weight:700;display:block;margin-bottom:6px}
.field input{padding:12px;border:1.5px solid #e5e7eb;border-radius:10px;width:100%;background:#f8fafc;font-size:13px;font-weight:600;outline:0}
.btnRow{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.btn{padding:11px 22px;border-radius:10px;font-weight:800;cursor:pointer;font-size:13px;border:1.5px solid #e5e7eb;text-decoration:none}
.btn-cancel{background:#f8fafc;color:#64748b;display:grid;place-items:center}
.btn-add{background:#0a1931;color:#fff;border-color:#0a1931}
.status{font-size:12px;font-weight:700;margin-top:12px;text-align:center}
</style>
</head>
<body>
<script>if(localStorage.getItem('shija_logged')!=='1'){location.href='index.html'}</script>
<div class="top"><h2>SHIJA Dialysis Management</h2><span style="color:#fff">Admin</span></div>
<div style="display:flex"><div class="side"><div><a href="index.html">Home</a><br><a href="total.html">Total Patient</a><br><a href="daily.html">Daily Dialysis</a><br><a href="add.html" class="active">Add Patient</a><br><a href="bill.html">Bill</a></div><div style="color:#6b7aa2;font-size:11px">v2.4.1 | <span id="fbStatus">Connecting...</span></div></div>
<div class="content">
<h1>Add Patient</h1>
<div class="card">
<div class="field"><label>Patient Name *</label><input id="n_name" placeholder="Enter patient name"></div>
<div class="field"><label>Aadhar Number</label><input id="n_aadhar" placeholder="Enter Aadhar number"></div>
<div class="field"><label>SHRI ID *</label><input id="n_shri" placeholder="Enter SHRI ID"></div>
<div class="field"><label>Contact Number</label><input id="n_contact" placeholder="Enter contact number"></div>
<div class="field"><label>PMJAY ID</label><input id="n_pmjay" placeholder="Enter PMJAY ID"></div>
<div class="field"><label>Address</label><input id="n_addr" placeholder="Enter address"></div>
<div class="btnRow">
<a href="index.html" class="btn btn-cancel">Cancel</a>
<button class="btn btn-add" id="addBtn" onclick="add()">Add Patient</button>
</div>
<p id="msg" class="status"></p>
</div>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const config={apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app=initializeApp(config);
const db=getFirestore(app);
window.db=db; window.fb={doc, setDoc, serverTimestamp};
document.getElementById('fbStatus').innerText="Connected - Ready";
</script>
<script>
async function add(){
 let name=document.getElementById('n_name').value.trim();
 let aadhar=document.getElementById('n_aadhar').value.trim();
 let shri=document.getElementById('n_shri').value.trim();
 let contact=document.getElementById('n_contact').value.trim();
 let pmjay=document.getElementById('n_pmjay').value.trim();
 let addr=document.getElementById('n_addr').value.trim();
 if(!name){alert('Enter patient name');return;}
 if(!shri){alert('Enter SHRI ID - required for Total page');return;}
 let btn=document.getElementById('addBtn'); btn.disabled=true; btn.textContent='Saving...';
 try{
   await fb.setDoc(fb.doc(db,"patients",shri),{
     patientName:name, aadharNo:aadhar, aadhar:aadhar, shriId:shri, shri:shri,
     contactNo:contact, contact:contact, pmjayId:pmjay, pmjay:pmjay,
     address:addr, addr:addr, name:name,
     age:30, gender:'Male',
     createdAt:fb.serverTimestamp(), localTime:new Date().toLocaleString()
   });
   document.getElementById('msg').textContent='✓ Added: '+name+' - Opening Total Patients...';
   document.getElementById('msg').style.color='#10b981';
   setTimeout(()=>{location.href='total.html?added='+encodeURIComponent(shri)},800);
 }catch(e){
   document.getElementById('msg').textContent='Error: '+e.message;
   document.getElementById('msg').style.color='red';
   btn.disabled=false; btn.textContent='Add Patient';
   alert(e.message);
 }
}
</script>
</body>
</html>
