<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name=viewport content="width=device-width,initial-scale=1"><title>Add Patient</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{background:linear-gradient(135deg,#e0f2fe,#f0f9ff 40%,#fef3c7 100%);min-height:100vh}
.top{background:linear-gradient(90deg,#0f4c75,#1e7bb8,#0f4c75);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.box{max-width:700px;margin:30px auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 8px 24px #0000000d}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input{padding:12px;border:1.5px solid #cbd5e1;border-radius:10px;width:100%;background:#f8fafc}
.btn{padding:12px 18px;border:0;border-radius:10px;background:linear-gradient(135deg,#10b981,#059669);color:#fff;font-weight:700;cursor:pointer;margin-top:14px;width:100%;font-size:15px}
</style></head><body>
<div class="top"><a href="index.html" style="color:#fff;text-decoration:none;font-weight:800;background:rgba(255,255,255,.2);padding:8px 14px;border-radius:8px">← Home</a><h2>SHIJA Add Patient</h2><div style="width:70px"></div></div>
<div class="box"><h3 style="color:#0f4c75;margin-bottom:16px;border-left:4px solid #10b981;padding-left:10px">➕ Add New Patient - Dedicated Page</h3><div class="grid"><input id="n_name" placeholder="Patient Name *"><input id="n_shri" placeholder="SHRI ID"><input id="n_contact" placeholder="Contact"><input id="n_pmjay" placeholder="PMJAY ID"><input id="n_addr" placeholder="Address" style="grid-column:span 2"></div><button class="btn" onclick="add()">Add Patient</button><p id="msg" style="margin-top:14px;font-weight:700"></p><a href="total.html" style="display:block;margin-top:16px;text-align:center;color:#0f4c75;font-weight:700">View All Patients →</a></div>
<script>
function add(){
 let p={name:document.getElementById('n_name').value.trim(), shri:document.getElementById('n_shri').value.trim(), contact:document.getElementById('n_contact').value.trim(), pmjay:document.getElementById('n_pmjay').value.trim(), addr:document.getElementById('n_addr').value.trim()};
 if(!p.name){alert('Enter name');return;}
 let arr=JSON.parse(localStorage.getItem('shija_patients')||'[]'); arr.push(p); localStorage.setItem('shija_patients',JSON.stringify(arr));
 document.getElementById('msg').textContent='✅ Added: '+p.name; document.getElementById('msg').style.color='green';
 document.getElementById('n_name').value='';
}
</script></body></html>
