<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add Patient - SHIJA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Segoe UI',system-ui}
body{background:#f1f3f6;display:flex;flex-direction:column;min-height:100vh;color:#0f172a}
.top{height:64px;background:#0a1931;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:40}
.top h2{color:#fff;font-size:16px;font-weight:800}
.menuBtn{width:36px;height:36px;border-radius:8px;border:1.5px solid #1e2d55;background:#13264d;color:#fff;display:grid;place-items:center;cursor:pointer}
.adBadge{display:flex;align-items:center;gap:8px;color:#fff}
.adCircle{width:30px;height:30px;border-radius:50%;background:#1a2a4f;color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;border:1.5px solid #2a3a6a}
.mainWrap{display:flex;flex:1;min-height:calc(100vh - 64px)}
.side{width:230px;min-width:230px;background:#0a1931;display:flex;flex-direction:column;justify-content:space-between;padding:16px 10px;position:sticky;top:64px;height:calc(100vh - 64px);transition:transform.3s ease}
.menu{display:flex;flex-direction:column;gap:4px}
.menu a{padding:12px 14px;border-radius:10px;text-decoration:none;color:#8ea0c0;font-weight:600;font-size:14px}
.menu a:hover{background:#13264d;color:#fff}
.sideBottom{border-top:1px solid #1a2a4f;padding:12px 10px;color:#6b7aa2;font-size:11px}
.sideOverlay{position:fixed;inset:0;background:#0005;z-index:55;display:none}
.sideOverlay.show{display:block}
.content{flex:1;padding:16px 14px;max-width:700px;width:100%}
.head h1{font-size:28px;font-weight:900;letter-spacing:-1px;color:#0f1a34}
.bread{color:#6b7280;font-size:12px;margin-top:4px}
.card{background:#fff;border-radius:16px;box-shadow:0 10px 30px #00000008;border:1px solid #e5e7eb;padding:20px;margin-top:14px}
.field{margin-bottom:14px}
.field label{font-size:12px;font-weight:700;display:block;margin-bottom:6px;color:#0f172a}
.field input{padding:12px 12px;border:1.5px solid #e5e7eb;border-radius:10px;width:100%;background:#f8fafc;font-size:13px;font-weight:600;outline:0}
.field input:focus{border-color:#1a56db;background:#fff}
.btnRow{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.btn{padding:11px 22px;border-radius:10px;font-weight:800;cursor:pointer;font-size:13px;border:1.5px solid #e5e7eb;text-decoration:none}
.btn-cancel{background:#f8fafc;color:#64748b;display:grid;place-items:center}
.btn-add{background:#0a1931;color:#fff;border-color:#0a1931}
.status{font-size:12px;font-weight:700;margin-top:12px;text-align:center}
@media(max-width:900px){.side{position:fixed;left:0;top:64px;transform:translateX(-100%);z-index:60;height:calc(100vh - 64px)}.side.open{transform:translateX(0)}}
</style>
</head>
<body>
<script>if(localStorage.getItem('shija_logged')!=='1'){location.href='index.html'}</script>

<div class="top">
<div style="display:flex;align-items:center;gap:10px">
<button class="menuBtn" onclick="toggleSide()">
<div style="display:flex;flex-direction:column;gap:4px"><div style="width:18px;height:2px;background:#fff;border-radius:2px"></div><div style="width:18px;height:2px;background:#fff;border-radius:2px"></div><div style="width:18px;height:2px;background:#fff;border-radius:2px"></div></div>
</button>
<h2>SHIJA Dialysis Management</h2>
</div>
<div class="adBadge"><div class="adCircle">AD</div><span style="font-weight:700;font-size:13px">Admin</span></div>
</div>

<div class="sideOverlay" id="overlay" onclick="toggleSide()"></div>

<div class="mainWrap">
<div class="side" id="side">
<div class="menu">
<a href="index.html">Home</a>
<a href="total.html">Total Patient</a>
<a href="daily.html">Daily Dialysis</a>
<a href="discharge.html">Discharge Patient</a>
<a href="kft.html">KFT Report</a>
<a href="bill.html">Bill</a>
</div>
<div class="sideBottom">Help and Support<br>v2.4.1 | <span id="fbStatus">Connected</span></div>
</div>

<div class="content">
<div class="head"><h1>Add Patient</h1><div class="bread">Dashboard / Add Patient</div></div>

<div class="card">
<div class="field"><label>Patient Name</label><input id="n_name" placeholder="Enter patient name"></div>
<div class="field"><label>Aadhar Number</label><input id="n_aadhar" placeholder="Enter Aadhar number"></div>
<div class="field"><label>SHRI ID</label><input id="n_shri" placeholder="Enter SHRI ID"></div>
<div class="field"><label>Contact Number</label><input id="n_contact" placeholder="Enter contact number"></div>
<div class="field"><label>PMJAY ID</label><input id="n_pmjay" placeholder="Enter PMJAY ID"></div>
<div class="field"><label>Address</label><input id="n_addr" placeholder="Enter address"></div>

<div class="btnRow">
<a href="index.html" class="btn btn-cancel">Cancel</a>
<button class="btn btn-add" onclick="add()">Add Patient</button>
</div>
<p id="msg" class="status"></p>
</div>

</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const config = {apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app = initializeApp(config);
const db = getFirestore(app);
window.db = db;
window.fb = { collection, addDoc, serverTimestamp };
document.getElementById('fbStatus').innerText = "Connected";
</script>

<script>
function toggleSide(){document.getElementById('side').classList.toggle('open');document.getElementById('overlay').classList.toggle('show');}
async function add(){
 let p={
   patientName: document.getElementById('n_name').value.trim(),
   aadharNo: document.getElementById('n_aadhar').value.trim(),
   shriId: document.getElementById('n_shri').value.trim(),
   contactNo: document.getElementById('n_contact').value.trim(),
   pmjayId: document.getElementById('n_pmjay').value.trim(),
   address: document.getElementById('n_addr').value.trim()
 };
 if(!p.patientName){alert('Enter patient name');return;}
 let arr=JSON.parse(localStorage.getItem('shija_patients')||'[]'); arr.push(p); localStorage.setItem('shija_patients',JSON.stringify(arr));
 try{
   await fb.addDoc(fb.collection(db, "patients"), {
     patientName: p.patientName, aadharNo: p.aadharNo, shriId: p.shriId, contactNo: p.contactNo, pmjayId: p.pmjayId, address: p.address,
     name: p.patientName, shri: p.shriId, pmjay: p.pmjayId,
     createdAt: fb.serverTimestamp(), localTime: new Date().toLocaleString()
   });
   document.getElementById('msg').textContent='Added: '+p.patientName;
   document.getElementById('msg').style.color='#10b981';
   document.getElementById('fbStatus').innerText='Saved to Firebase';
 }catch(e){
   document.getElementById('fbStatus').innerText='Error: '+e.message;
   document.getElementById('msg').textContent='Saved locally only';
   document.getElementById('msg').style.color='#ef4444';
 }
 document.getElementById('n_name').value=''; document.getElementById('n_aadhar').value=''; document.getElementById('n_shri').value=''; document.getElementById('n_contact').value=''; document.getElementById('n_pmjay').value=''; document.getElementById('n_addr').value='';
}
</script>
</body>
</html>
