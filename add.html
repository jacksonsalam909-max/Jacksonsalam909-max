<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add Patient - SHIJA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
body{background:#f6f7fb;display:flex;flex-direction:column;min-height:100vh}
.top{height:64px;background:#0a1931;display:flex;align-items:center;padding:0 14px;justify-content:space-between;position:fixed;top:0;left:0;right:0;z-index:9999}
.top h2{color:#fff;font-size:16px;font-weight:800}
.menuBtn{width:44px;height:44px;border-radius:8px;border:1.5px solid #1e2d55;background:#13264d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.menuBtn span{display:block;width:20px;height:2px;background:#fff;pointer-events:none}
.mainWrap{display:flex;flex:1;margin-top:64px}
.side{width:260px;background:#0a1931;padding:16px 10px;position:fixed;left:0;top:64px;bottom:0;z-index:9998;overflow-y:auto;transition:0.3s;transform:translateX(-100%)}
.side.show{transform:translateX(0)!important}
.side a{padding:12px 14px;border-radius:10px;text-decoration:none;color:#8ea0c0;font-weight:600;font-size:14px;display:block;margin-bottom:4px}
.side a.active{background:#1a56db;color:#fff;font-weight:700}
.content{flex:1;padding:12px;width:100%;max-width:100%}
.sideOverlay{position:fixed;inset:0;top:64px;background:rgba(0,0,0,0.5);z-index:9997;display:none}
.sideOverlay.show{display:block}
.box{background:#fff;border:1.5px solid #e2e8f0;border-radius:16px;padding:16px;width:100%;max-width:100%}
.box label{font-size:12px;font-weight:700;color:#334155;display:block;margin:14px 0 6px}
.box input,.box select{width:100%;padding:13px 14px;border:1.5px solid #cbd5e1;border-radius:10px;margin:0;font-size:15px;font-weight:600;background:#fff;outline:0}
.box input:focus,.box select:focus{border-color:#1868db}
.row{display:flex;gap:10px}
.row>div{flex:1}
.btn{width:100%;padding:14px;background:#1868db;color:#fff;border:0;border-radius:10px;font-weight:800;cursor:pointer;margin-top:18px;font-size:15px}
</style>
</head>
<body>
<div class="top"><div style="display:flex;align-items:center;gap:10px"><button type="button" class="menuBtn" id="menuBtn" aria-label="Menu"><span></span><span></span><span></span></button><h2>SHIJA Dialysis Management</h2></div><span style="color:#fff">Admin</span></div>
<div class="sideOverlay" id="overlay"></div>
<div class="mainWrap">
<div class="side" id="side">
<a href="index.html">HOME</a>
<a href="total.html">TOTAL PATIENT</a>
<a href="cmht.html">CMHT TOTAL PATIENT</a>
<a href="cmhtkft.html">CMHT KFT REPORT</a>
<a href="cmhtdaily.html">CMHT DAILY DIALYSIS</a>
<a href="addcmht.html">CMHT ADD PATIENT</a>
<a href="daily.html">DAILY DIALYSIS</a>
<a href="discharge.html">DISCHARGE PATIENT</a>
<a href="kft.html">KFT REPORT</a>
<a href="add.html" class="active">ADD PATIENT</a>
<a href="bill.html">BILL</a>
<a href="dischargesummary.html">DISCHARGE SUMMARY</a>
<a href="upload.html" style="background:#1868db;color:#fff;font-weight:800;margin-top:10px;border-radius:10px;padding:12px 14px;text-align:center">UPLOAD PATIENTS</a>
</div>
<div class="content" id="content">
<h1 style="font-size:18px;margin-bottom:4px">ADD PATIENT</h1><p id="msg" style="margin:0 0 10px;color:#64748b;font-size:13px;font-weight:600">Will show in Total Patients on all devices</p>
<div class="box">

<label>PATIENT NAME *</label>
<input id="name">

<label>SHRI ID (Leave empty to auto generate)</label>
<input id="shri">

<label>CONTACT NO</label>
<input id="contact">

<label>PMJAY ID</label>
<input id="pmjay">

<label>AADHAAR NUMBER</label>
<input id="aadhaar" maxlength="12">

<div class="row">
<div>
<label>AGE</label>
<input id="age" type="number">
</div>
<div>
<label>SEX</label>
<select id="sex">
<option value=""></option>
<option value="MALE">MALE</option>
<option value="FEMALE">FEMALE</option>
<option value="OTHER">OTHER</option>
</select>
</div>
</div>

<label>ADDRESS</label>
<input id="addr">

<button class="btn" onclick="addPatient()">ADD PATIENT</button>
</div>
</div>
</div>

<script>
function toggleMenu(){
 var s=document.getElementById('side');
 var o=document.getElementById('overlay');
 s.classList.toggle('show');
 o.classList.toggle('show');
}
document.addEventListener('DOMContentLoaded', function(){
 var btn = document.getElementById('menuBtn');
 var overlay = document.getElementById('overlay');
 var lastTap = 0;
 function handleMenu(e){
   var now = Date.now();
   if(now - lastTap < 400) return;
   lastTap = now;
   if(e){ e.preventDefault(); e.stopPropagation(); }
   toggleMenu();
 }
 btn.addEventListener('click', handleMenu);
 btn.addEventListener('touchend', handleMenu, {passive:false});
 overlay.addEventListener('click', toggleMenu);
 overlay.addEventListener('touchend', handleMenu, {passive:false});
});
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
function saveEditedLocal(key,data){
  let m={}; try{m=JSON.parse(localStorage.getItem('editedKeys')||'{}');}catch{}
  m[key]=data; localStorage.setItem('editedKeys',JSON.stringify(m));
  let added=[]; try{added=JSON.parse(localStorage.getItem('addedKeys')||'[]');}catch{}
  if(!added.includes(key)){ added.push(key); localStorage.setItem('addedKeys',JSON.stringify(added)); }
}
window.addPatient=async()=>{
 let name=document.getElementById('name').value.trim();
 let shri=document.getElementById('shri').value.trim();
 let contact=document.getElementById('contact').value.trim();
 let pmjay=document.getElementById('pmjay').value.trim();
 let addr=document.getElementById('addr').value.trim();
 let aadhaar=document.getElementById('aadhaar').value.trim();
 let age=document.getElementById('age').value.trim();
 let sex=document.getElementById('sex').value.trim();
 if(!name){ alert('Enter Name'); return; }
 if(!shri){ shri='SHRI'+Date.now().toString().slice(-6); }
 let data={ patientName:name,name:name, shriId:shri,shri:shri, contactNo:contact,contact:contact, pmjayId:pmjay,pmjay:pmjay, address:addr,addr:addr, aadhaarNo:aadhaar,aadhaar:aadhaar, age:age, sex:sex, key:shri,deleted:false, createdAt:new Date().toISOString() };
 document.getElementById('msg').textContent='Saving '+shri+'...';
 try{
   await setDoc(doc(db,"patients",shri),data,{merge:true});
   saveEditedLocal(shri,data);
   document.getElementById('msg').textContent='✅ Added '+name+' ('+shri+') - Now go to Total Patients page';
   document.getElementById('name').value=''; document.getElementById('shri').value=''; document.getElementById('contact').value=''; document.getElementById('pmjay').value=''; document.getElementById('addr').value=''; document.getElementById('aadhaar').value=''; document.getElementById('age').value=''; document.getElementById('sex').value='';
 }catch(e){
   saveEditedLocal(shri,data);
   document.getElementById('msg').textContent='Saved locally (Firebase error: '+e.message+')';
 }
};
</script>
</body>
</html>
