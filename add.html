<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add Patient - SHIJA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter}
body{background:#f6f7fb;display:flex;flex-direction:column;min-height:100vh}
.top{height:64px;background:#0a1931;display:flex;align-items:center;padding:0 14px;justify-content:space-between;position:sticky;top:0;z-index:10}
.top h2{color:#fff;font-size:16px;font-weight:800}
.mainWrap{display:flex;flex:1}
.side{width:230px;background:#0a1931;padding:16px 10px;position:fixed;left:0;top:64px;bottom:0}
.side a{padding:12px 14px;border-radius:10px;text-decoration:none;color:#8ea0c0;font-weight:600;font-size:14px;display:block;margin-bottom:4px}
.side a.active{background:#13264d;color:#fff;border-left:3px solid #1a56db}
.content{flex:1;margin-left:230px;padding:20px}
.box{background:#fff;border:1.5px solid #e2e8f0;border-radius:14px;padding:20px;max-width:600px}
.box input{width:100%;padding:12px;border:1.5px solid #cbd5e1;border-radius:10px;margin:8px 0}
.btn{width:100%;padding:12px;background:#1868db;color:#fff;border:0;border-radius:10px;font-weight:800;cursor:pointer;margin-top:10px}
@media(max-width:900px){.side{display:none}.content{margin-left:0}}
</style>
</head>
<body>
<div class="top"><h2>SHIJA Dialysis Management</h2><span style="color:#fff">Admin</span></div>
<div class="mainWrap">
<div class="side">
<a href="index.html">Home</a>
<a href="total.html">Total Patient</a>
<a href="daily.html">Daily Dialysis</a>
<a href="discharge.html">Discharge Patient</a>
<a href="kft.html">KFT Report</a>
<a href="add.html" class="active">Add Patient</a>
<a href="bill.html">Bill</a>
</div>
<div class="content">
<h1>Add Patient</h1><p id="msg" style="margin:8px 0;color:#64748b;font-size:13px">Will show in Total Patients on all devices</p>
<div class="box">
<input id="name" placeholder="Patient Name *">
<input id="shri" placeholder="SHRI ID (e.g. SHRI123) - Leave empty to auto generate">
<input id="contact" placeholder="Contact No">
<input id="pmjay" placeholder="PMJAY ID">
<input id="addr" placeholder="Address">
<button class="btn" onclick="addPatient()">Add Patient</button>
</div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

function saveEditedLocal(key,data){
  let m={}; try{m=JSON.parse(localStorage.getItem('editedKeys')||'{}');}catch{}
  m[key]=data; localStorage.setItem('editedKeys',JSON.stringify(m));
  // Also add to added list
  let added=[]; try{added=JSON.parse(localStorage.getItem('addedKeys')||'[]');}catch{}
  if(!added.includes(key)){ added.push(key); localStorage.setItem('addedKeys',JSON.stringify(added)); }
}

window.addPatient=async()=>{
 let name=document.getElementById('name').value.trim();
 let shri=document.getElementById('shri').value.trim();
 let contact=document.getElementById('contact').value.trim();
 let pmjay=document.getElementById('pmjay').value.trim();
 let addr=document.getElementById('addr').value.trim();
 if(!name){ alert('Enter Name'); return; }
 if(!shri){
   // Auto generate SHRI if empty
   shri='SHRI'+Date.now().toString().slice(-6);
 }
 let data={
   patientName:name,name:name,
   shriId:shri,shri:shri,
   contactNo:contact,contact:contact,
   pmjayId:pmjay,pmjay:pmjay,
   address:addr,addr:addr,
   key:shri,deleted:false,
   createdAt:new Date().toISOString()
 };
 document.getElementById('msg').textContent='Saving '+shri+'...';
 try{
   await setDoc(doc(db,"patients",shri),data,{merge:true});
   saveEditedLocal(shri,data);
   document.getElementById('msg').textContent='✅ Added '+name+' ('+shri+') - Now go to Total Patients page - It will show there';
   document.getElementById('name').value=''; document.getElementById('shri').value=''; document.getElementById('contact').value=''; document.getElementById('pmjay').value=''; document.getElementById('addr').value='';
 }catch(e){
   // Even if Firebase fails, save locally so it shows in Total
   saveEditedLocal(shri,data);
   document.getElementById('msg').textContent='Saved locally (Firebase error: '+e.message+') - Will show in Total Patients on this device';
 }
};
</script>
</body>
</html>
