<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name=viewport content="width=device-width,initial-scale=1"><title>Add Patient - SHIJA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{background:linear-gradient(135deg,#e0f2fe,#f0f9ff 40%,#fef3c7 100%);min-height:100vh}
.top{background:linear-gradient(90deg,#0f4c75,#1e7bb8,#0f4c75);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.box{max-width:700px;margin:30px auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 8px 24px #0000000d}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input{padding:12px;border:1.5px solid #cbd5e1;border-radius:10px;width:100%;background:#f8fafc}
.btn{padding:12px 18px;border:0;border-radius:10px;background:linear-gradient(135deg,#10b981,#059669);color:#fff;font-weight:700;cursor:pointer;margin-top:14px;width:100%;font-size:15px}
.status{font-size:13px;font-weight:700;margin-top:10px;text-align:center}
</style></head><body>
<div class="top"><a href="index.html" style="color:#fff;text-decoration:none;font-weight:800;background:rgba(255,255,255,.2);padding:8px 14px;border-radius:8px">← Home</a><h2>SHIJA Add Patient</h2><div style="width:70px"></div></div>
<div class="box"><h3 style="color:#0f4c75;margin-bottom:16px;border-left:4px solid #10b981;padding-left:10px">➕ Add New Patient - Firebase Master</h3><div class="grid"><input id="n_name" placeholder="Patient Name *"><input id="n_shri" placeholder="SHRI ID"><input id="n_contact" placeholder="Contact"><input id="n_pmjay" placeholder="PMJAY ID"><input id="n_addr" placeholder="Address" style="grid-column:span 2"></div><button class="btn" onclick="add()">Add Patient to Cloud</button><p id="msg" class="status"></p><p id="fbStatus" class="status" style="color:#16a34a">● Firebase Connected</p><a href="total.html" style="display:block;margin-top:16px;text-align:center;color:#0f4c75;font-weight:700">View All Patients →</a></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const config = {
  apiKey: "AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",
  authDomain: "discharge-b9528.firebaseapp.com",
  projectId: "discharge-b9528",
  storageBucket: "discharge-b9528.firebasestorage.app",
  messagingSenderId: "1076050472607",
  appId: "1:1076050472607:web:736e0688a41462460efcaa"
};
const app = initializeApp(config);
const db = getFirestore(app);
window.db = db;
window.fb = { collection, addDoc, serverTimestamp };
document.getElementById('fbStatus').innerText = "● Firebase Connected: patients master";
</script>

<script>
async function add(){
 let p={
   patientName: document.getElementById('n_name').value.trim(),
   shriId: document.getElementById('n_shri').value.trim(),
   contactNo: document.getElementById('n_contact').value.trim(),
   pmjayId: document.getElementById('n_pmjay').value.trim(),
   address: document.getElementById('n_addr').value.trim()
 };
 if(!p.patientName){alert('Enter name');return;}
 // Local also
 let arr=JSON.parse(localStorage.getItem('shija_patients')||'[]'); arr.push(p); localStorage.setItem('shija_patients',JSON.stringify(arr));
 
 // Firebase MASTER
 try{
   document.getElementById('fbStatus').innerText = "Saving...";
   await fb.addDoc(fb.collection(db, "patients"), {
     patientName: p.patientName,
     shriId: p.shriId,
     contactNo: p.contactNo,
     pmjayId: p.pmjayId,
     address: p.address,
     name: p.patientName, // for compatibility
     shri: p.shriId,
     pmjay: p.pmjayId,
     createdAt: fb.serverTimestamp(),
     localTime: new Date().toLocaleString()
   });
   document.getElementById('msg').textContent='✅ Added to Cloud: '+p.patientName;
   document.getElementById('msg').style.color='green';
   document.getElementById('fbStatus').innerText='● Saved to Firebase patients ✅';
 }catch(e){
   document.getElementById('fbStatus').innerText='● Error: '+e.message;
   document.getElementById('msg').textContent='⚠️ Saved locally only (Firebase error)';
 }
 document.getElementById('n_name').value=''; document.getElementById('n_shri').value=''; document.getElementById('n_contact').value=''; document.getElementById('n_pmjay').value=''; document.getElementById('n_addr').value='';
}
</script></body></html>
