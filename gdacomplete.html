<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COMPLETED PATIENTS - SHIJA HOSPITALS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,-apple-system,sans-serif}
body{background:#eef2f8;min-height:100vh}
.top{flex-shrink:0;background:linear-gradient(135deg,#0B1F4A 0%,#12367F 100%);padding:12px;color:#fff;position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px}
.menuBtn{width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,0.18);color:#fff;font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer}
.hTitle{font-size:13px;font-weight:900}
.hSub{font-size:9px;opacity:0.85;margin-top:2px}
.rowTop{display:flex;gap:8px;margin-top:10px}
.dateBox{flex:1;border-radius:14px;height:46px;display:flex;align-items:center;padding:0 12px;background:#fff}
.dateBox input,.dateBox select{border:0;width:100%;font-weight:700;font-size:13px;outline:none;background:transparent;color:#0B1F4A}
.count{margin-top:10px;background:rgba(255,255,255,0.15);border-radius:14px;height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:12px;font-weight:700;border:1px solid rgba(255,255,255,0.15)}
.count span:last-child{background:#fff;color:#0B1F4A;padding:6px 12px;border-radius:100px;font-size:11px;font-weight:800}
.filter{padding:10px 12px;display:flex;gap:6px;overflow-x:auto;background:#fff;flex-shrink:0;border-bottom:1px solid #dde4f0}
.filter::-webkit-scrollbar{display:none}
.chip{height:34px;padding:0 14px;border-radius:100px;border:1.5px solid #d0d9ea;background:#f4f7fd;font-weight:800;font-size:10px;white-space:nowrap;flex-shrink:0;color:#4a5f85;cursor:pointer}
.chip.on{background:#0B1F4A;color:#fff;border-color:#0B1F4A}
.searchBar{padding:10px 12px;display:flex;gap:8px;background:#fff;border-bottom:1px solid #dde4f0;align-items:center;flex-wrap:wrap}
.searchInput{flex:1;min-width:140px;height:42px;border:1.5px solid #d0d9ea;background:#f4f7fd;padding:0 14px;border-radius:100px;font-weight:700;font-size:12px;color:#0B1F4A;outline:none}
.blockSelect{border:1.5px solid #d0d9ea;background:#f4f7fd;padding:0 12px;height:42px;border-radius:100px;font-weight:800;font-size:10px;color:#0B1F4A;min-width:105px;outline:none}
.viewToggle{height:42px;padding:0 16px;border-radius:100px;border:1.5px solid #0B1F4A;background:#0B1F4A;color:#fff;font-weight:800;font-size:10px;cursor:pointer;white-space:nowrap}
.viewToggle.list{background:#fff;color:#0B1F4A;border-color:#d0d9ea}
.searchMeta{padding:0 12px 8px;background:#fff;font-size:10px;font-weight:700;color:#5a7196;display:flex;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:12px;transition:0.2s}
@media(min-width:769px){.grid{grid-template-columns:repeat(6,1fr)}}
.grid.listView{grid-template-columns:1fr !important;gap:8px}
.card{background:#fff;border-radius:16px;padding:11px 10px 12px;display:flex;flex-direction:column;box-shadow:0 6px 18px rgba(11,31,74,0.08);border:1px solid #e8eefb}
.card.listCard{flex-direction:row;align-items:center;gap:12px;padding:12px 14px;border-radius:12px}
.card.listCard .avatarSq{width:42px;height:42px;font-size:18px}
.card.listCard .info{flex:1}
.card.listCard .btnUndo{width:auto;margin-top:0;padding:8px 18px;margin-left:auto;flex-shrink:0}
.avatarSq{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:17px;flex-shrink:0}
.info{flex:1;min-width:0}
.name{font-size:13px;font-weight:900;color:#0B1F4A;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{margin-top:3px;font-size:8.5px;font-weight:700;color:#6b7fa3}
.btnUndo{margin-top:12px;background:#ef4444;color:#fff;border:0;padding:10px;border-radius:100px;font-weight:800;font-size:10px;width:100%;cursor:pointer}
.btnView{background:#fff;color:#0B1F4A;border:0;padding:8px 14px;border-radius:12px;font-weight:800;font-size:11px;cursor:pointer}
.overlay{position:fixed;inset:0;background:rgba(11,31,74,0.55);z-index:9998;display:none}
.overlay.show{display:block}
.drawer{position:fixed;left:0;top:0;bottom:0;width:85%;max-width:300px;background:#fff;z-index:9999;transform:translateX(-100%);transition:0.3s}
.drawer.open{transform:translateX(0)}
.menuItem{padding:17px 20px;font-size:13px;font-weight:800;color:#334155;cursor:pointer;border-left:4px solid transparent}
.menuItem.active{background:#e8eefb;color:#0B1F4A;border-left-color:#0B1F4A}
</style>
</head>
<body>
<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
<div style="background:linear-gradient(135deg,#0B1F4A,#12367F);padding:20px 16px;color:#fff"><div style="display:flex;justify-content:space-between;align-items:center"><div><b>SHIJA HOSPITALS</b><div style="font-size:10px;opacity:0.85">DIALYSIS MANAGEMENT</div></div><button id="closeDrawerBtn" style="width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,0.22);color:#fff;font-size:22px">✕</button></div><div style="margin-top:12px;background:#fff;color:#0B1F4A;padding:6px 12px;border-radius:100px;font-size:10px;font-weight:800;display:inline-block" id="drawerCount">0 COMPLETED</div></div>
<div><div class="menuItem" data-url="gda.html">GDA PAGE - PENDING</div><div class="menuItem" data-url="index.html">HOME - index.html</div><div class="menuItem active" data-url="gdacompleted.html">COMPLETED - PHOTO + OPD DONE</div></div>
</div>
<div class="top">
<button class="menuBtn" id="menuBtn">☰</button>
<div style="flex:1"><div class="hTitle">COMPLETED PATIENTS</div><div class="hSub">PHOTO + OPD DONE</div></div>
<button class="btnView" onclick="location.href='gda.html'">BACK TO GDA</button>
</div>
<div style="background:linear-gradient(135deg,#0B1F4A 0%,#12367F 100%);padding:0 12px 12px">
<div class="rowTop"><div class="dateBox"><input type="date" id="fDate"></div><div class="dateBox" style="max-width:100px"><select id="fType"><option>PMJAY</option><option>CMHT</option></select></div></div>
<div class="count"><span id="cLeft">Loading</span><span id="cRight">DONE 0</span></div>
</div>
<div class="filter"><button class="chip on" data-time="">ALL TIME</button><button class="chip" data-time="7:00 AM">7 AM</button><button class="chip" data-time="12:00 PM">12 PM</button><button class="chip" data-time="5:00 PM">5 PM</button><button class="chip" data-time="9:00 PM">9 PM</button><button class="chip" data-time="12:00 AM">12 AM</button><button class="chip" data-time="2:00 AM">2 AM</button></div>
<div class="searchBar">
<input type="text" id="searchName" class="searchInput" placeholder="Search completed...">
<select id="filterBlock" class="blockSelect"><option value="">All Block</option><option value="MAIN">MAIN</option><option value="ITOCHA">ITOCHA</option></select>
<button id="toggleViewBtn" class="viewToggle">GRID VIEW</button>
</div>
<div class="searchMeta"><span id="searchInfo"></span><span id="blockInfo"></span></div>
<div class="grid" id="grid"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,getDoc,setDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app=initializeApp(cfg,"gdacompleted_"+Math.random());const db=getFirestore(app);window._fb={db,doc,getDoc,setDoc};
</script>
<script>
(function(){
  const drawer=document.getElementById('drawer'); const overlay=document.getElementById('overlay');
  document.getElementById('menuBtn').addEventListener('click', ()=>{drawer.classList.add('open');overlay.classList.add('show');});
  document.getElementById('closeDrawerBtn').addEventListener('click', ()=>{drawer.classList.remove('open');overlay.classList.remove('show');});
  overlay.addEventListener('click', ()=>{drawer.classList.remove('open');overlay.classList.remove('show');});
  document.querySelectorAll('.menuItem').forEach(item=>{item.addEventListener('click', function(){let url=item.getAttribute('data-url');location.href=url;});});
})();
function getTodayIST(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
document.getElementById('fDate').value=new URLSearchParams(location.search).get('date')||getTodayIST();
let allPatients=[],statusMap={},searchQuery='',activeTimeFilter='',activeBlockFilter='';
let isListView = localStorage.getItem('gda_completed_view') === 'list';
function normalizeTime(t){if(!t)return'';let s=String(t).toUpperCase().trim();let m=s.match(/(\d{1,2})(?::(\d{1,2}))?\s*([AP]M)?/);if(!m)return s;let h=parseInt(m[1]),mi=m[2]?m[2].padStart(2,'0'):'00',ap=m[3]||'';if(!ap){if(s.includes('AM'))ap='AM';else if(s.includes('PM'))ap='PM';}return ap?`${h}:${mi} ${ap}`:`${h}:${mi}`;}
async function loadData(){let d=document.getElementById('fDate').value,s=document.getElementById('fType').value,id=d+'_'+s;document.getElementById('cLeft').innerText='Loading...';let snap=await window._fb.getDoc(window._fb.doc(window._fb.db,'daily_dialysis_lists',id));allPatients=snap.exists()?(snap.data().patients||[]):[];let sSnap=await window._fb.getDoc(window._fb.doc(window._fb.db,'daily_photo_opd',id));statusMap=sSnap.exists()?(sSnap.data().status||{}):{};render();}
async function saveStatus(){let d=document.getElementById('fDate').value,s=document.getElementById('fType').value,id=d+'_'+s;await window._fb.setDoc(window._fb.doc(window._fb.db,'daily_photo_opd',id),{date:d,scheme:s,status:statusMap,updatedAt:new Date().toISOString()});}
function getInit(n){return (n||'A').charAt(0).toUpperCase();}
function getCol(name){const colors=['linear-gradient(135deg,#8B5CF6,#6366F1)','linear-gradient(135deg,#F59E0B,#F97316)','linear-gradient(135deg,#10B981,#06B6D4)','linear-gradient(135deg,#EF4444,#EC4899)','linear-gradient(135deg,#3B82F6,#06B6D4)'];let hash=0;for(let i=0;i<name.length;i++){hash=name.charCodeAt(i)+((hash<<5)-hash);}return colors[Math.abs(hash)%colors.length];}
function getFilteredDone(){
  let sq=searchQuery.toLowerCase().trim();
  let tn=normalizeTime(activeTimeFilter);
  let bf=activeBlockFilter;
  return allPatients.filter(p=>{
    let sh=String(p.shri||'').toUpperCase();
    let st=statusMap[sh];
    if(!st||!(st.photoTaken&&st.opdDone))return false;
    if(activeTimeFilter && normalizeTime(p.time)!==tn) return false;
    if(bf && p.block!==bf) return false;
    if(sq){
      let nameL=String(p.name||'').toLowerCase();
      let shriL=sh.toLowerCase();
      let blockL=String(p.block||'').toLowerCase();
      if(!nameL.includes(sq)&&!shriL.includes(sq)&&!blockL.includes(sq))return false;
    }
    return true;
  });
}
function render(){
  let grid=document.getElementById('grid');
  grid.classList.toggle('listView', isListView);
  grid.innerHTML='';
  let filtered=getFilteredDone();
  let totalDone=allPatients.filter(p=>{let sh=String(p.shri||'').toUpperCase();let st=statusMap[sh];return st&&st.photoTaken&&st.opdDone;}).length;
  
  filtered.forEach(p=>{
    let sh=String(p.shri||'').toUpperCase();
    let div=document.createElement('div');
    div.className = isListView ? 'card listCard' : 'card';
    if(isListView){
      div.innerHTML=`<div class="avatarSq" style="background:${getCol(p.name)}">${getInit(p.name)}</div><div class="info"><div class="name">${p.name}</div><div class="sub">${p.time||''} • ${p.block||'MAIN'} • ${sh} • ✓ DONE</div></div><button class="btnUndo" onclick="bringBack('${sh}')">UNDO</button>`;
    } else {
      div.innerHTML=`<div style="display:flex;gap:9px;align-items:center"><div class="avatarSq" style="background:${getCol(p.name)}">${getInit(p.name)}</div><div class="info"><div class="name">${p.name}</div><div class="sub">${p.time||''} • ${p.block||'MAIN'} • ${sh}</div><div class="sub" style="color:#16a34a;font-weight:800;margin-top:4px">✓ ${p.time} • ${p.block} • DONE</div></div></div><button class="btnUndo" onclick="bringBack('${sh}')">UNDO</button>`;
    }
    grid.appendChild(div);
  });
  if(filtered.length===0){
    let msg='No completed patients';
    if(searchQuery) msg=`No completed for "${searchQuery}"`;
    else if(activeTimeFilter) msg=`No completed for ${activeTimeFilter}${activeBlockFilter?' + '+activeBlockFilter:''}`;
    else if(activeBlockFilter) msg=`No completed for Block ${activeBlockFilter}`;
    grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:40px;background:#fff;border-radius:16px;color:#0B1F4A;font-weight:700">${msg}</div>`;
  }
  document.getElementById('cLeft').innerText=`${allPatients.length} TOTAL • ${totalDone} DONE`;
  document.getElementById('cRight').innerText=`DONE ${filtered.length}/${totalDone}`;
  let infoParts=[];
  if(activeTimeFilter) infoParts.push(activeTimeFilter);
  if(activeBlockFilter) infoParts.push(activeBlockFilter);
  let filterText=infoParts.length?` [${infoParts.join(' + ')}] `:'';
  document.getElementById('searchInfo').innerText=searchQuery?`Found ${filtered.length} for "${searchQuery}"${filterText}`:`${filtered.length} completed${filterText} • ${isListView?'LIST':'GRID'}`;
  document.getElementById('blockInfo').innerText=activeBlockFilter?`Block: ${activeBlockFilter}`:'';
  document.getElementById('drawerCount').innerText=`${totalDone} COMPLETED`;
  updateToggleBtn();
}
function updateToggleBtn(){
  let btn=document.getElementById('toggleViewBtn');
  if(isListView){btn.innerText='LIST VIEW'; btn.classList.remove('list');}
  else {btn.innerText='GRID VIEW'; btn.classList.add('list');}
}
function toggleView(){
  isListView = !isListView;
  localStorage.setItem('gda_completed_view', isListView?'list':'grid');
  render();
}
function bringBack(sh){if(statusMap[sh]){statusMap[sh].photoTaken=false;statusMap[sh].opdDone=false;}saveStatus();render();}
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');activeTimeFilter=c.dataset.time;render();}));
document.getElementById('filterBlock').addEventListener('change',(e)=>{activeBlockFilter=e.target.value;render();});
document.getElementById('fDate').addEventListener('change',loadData);
document.getElementById('fType').addEventListener('change',loadData);
document.getElementById('searchName').addEventListener('input',(e)=>{searchQuery=e.target.value;render();});
document.getElementById('toggleViewBtn').addEventListener('click', toggleView);
window.bringBack=bringBack;
window.addEventListener('load',()=>{updateToggleBtn(); loadData();});
</script>
</body>
</html>
