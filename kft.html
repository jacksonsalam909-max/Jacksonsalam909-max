<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name=viewport content="width=device-width,initial-scale=1"><title>KFT Report</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{background:linear-gradient(135deg,#e0f2fe,#f0f9ff 40%,#fef3c7 100%);min-height:100vh}
.top{background:linear-gradient(90deg,#0f4c75,#1e7bb8,#0f4c75);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.box{max-width:1100px;margin:20px auto;background:#fff;padding:20px;border-radius:16px;box-shadow:0 8px 24px #0000000d}
.kft-card{padding:12px;background:linear-gradient(135deg,#f0f9ff,#e0f2fe);margin-bottom:10px;border-radius:12px;border-left:5px solid #8b5cf6;display:flex;justify-content:space-between;align-items:center}
</style></head><body>
<div class="top"><a href="index.html" style="color:#fff;text-decoration:none;font-weight:800;background:rgba(255,255,255,.2);padding:8px 14px;border-radius:8px">← Home</a><h2>KFT Report</h2><div style="width:70px"></div></div>
<div class="box"><h3 style="color:#0f4c75;border-left:4px solid #8b5cf6;padding-left:10px">🧪 KFT Report - Separate Page</h3><p style="color:#64748b;margin-bottom:14px">Only KFT entries shown here — no other tables underneath</p><div id="kft_list"></div></div>
<script>
let kft=JSON.parse(localStorage.getItem('shija_kft_entries')||'[]');
let html='';
if(!kft.length) html='<p style="color:#999;padding:20px;text-align:center">No KFT entries yet</p>';
else {
 kft.forEach(function(e,i){
  let color = e.status=='received' ? '#10b981' : '#ef4444';
  html+='<div class="kft-card"><div><b>'+e.name+'</b> | SHRI: '+(e.shri||'-')+'<br><span style="font-size:11px;color:#64748b">Date: '+e.date+' | Status: <b style="color:'+color+'">'+e.status.toUpperCase()+'</b></span></div><button onclick="if(confirm(\'Delete KFT?\')){let a=JSON.parse(localStorage.getItem(\'shija_kft_entries\')||\'[]\');a.splice('+i+',1);localStorage.setItem(\'shija_kft_entries\',JSON.stringify(a));location.reload();}" style="padding:6px 12px;background:#ef4444;color:#fff;border:0;border-radius:8px;cursor:pointer">Delete</button></div>';
 });
}
document.getElementById('kft_list').innerHTML=html;
</script></body></html>
