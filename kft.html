<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KFT Report - SHIJA</title>
<script src="Patient.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{background:#f1f5f9}
.top{background:linear-gradient(90deg,#0f4c75,#1e7bb8);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.top a{color:#fff;text-decoration:none;background:#ffffff22;padding:6px 12px;border-radius:8px}
.wrap{max-width:1100px;margin:14px auto;padding:0 12px}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 4px 12px #0001;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select,input{padding:11px 14px;border:1px solid #cbd5e1;border-radius:10px;outline:0;font-weight:600}
.btn{padding:11px 18px;border:0;border-radius:10px;font-weight:800;cursor:pointer;font-size:13px}
.btn-green{background:#10b981;color:#fff}
.btn-orange{background:#f59e0b;color:#111}
.dateBox{display:flex;gap:10px}
.dateOpt{padding:12px 20px;border:2px solid #cbd5e1;border-radius:12px;background:#fff;font-weight:800;cursor:pointer;min-width:130px;text-align:center}
.dateOpt.active{background:#0f4c75;color:#fff;border-color:#0f4c75}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
th,td{padding:9px;border:1px solid #e2e8f0;text-align:left}
th{background:#0f4c75;color:#fff;position:sticky;top:0}
tr:nth-child(even){background:#f8fafc}
.toggle{width:115px;padding:8px;border-radius:20px;border:0;font-weight:800;cursor:pointer}
.yes{background:#10b981;color:#fff}
.no{background:#ef4444;color:#fff}
.toggle:disabled{opacity:0.5;cursor:not-allowed}
.locked{background:#e0f2fe;border:1px solid #bae6fd;color:#0f4c75;padding:10px;border-radius:10px;margin:10px 0;font-weight:700;text-align:center}
.statBox{flex:1;padding:10px;border-radius:12px;text-align:center;border:2px solid #e2e8f0;background:#fff;min-width:100px}
</style></head><body>
<script>if(localStorage.getItem('shija_logged')!=='1'){location.href='index.html'}</script>
<div class="top"><b>🧪 KFT Report - 1st & 15th</b><a href="index.html">Home</a></div>
<div class="wrap">
<div class="card">
<div class="row"><div>Year: <select id="yearSel"></select></div><div>Month: <select id="monthSel"><option value="0">January</option><option value="1">February</option><option value="2">March</option><option value="3">April</option><option value="4">May</option><option value="5">June</option><option value="6">July</option><option value="7">August</option><option value="8">September</option><option value="9">October</option><option value="10">November</option><option value="11">December</option></select></div></div>
<div style="margin-top:14px;font-weight:800;color:#0f4c75">2. Select Date:</div>
<div class="dateBox" style="margin-top:8px"><div id="d1" class="dateOpt active" onclick="setDate('1')">📅 1st of Every Month</div><div id="d15" class="dateOpt" onclick="setDate('15')">📅 15th of Every Month</div></div>
<div class="row" style="margin-top:14px"><input id="search" placeholder="Search Name / SHRI ID (510 patients)" oninput="render()" style="flex:1;min-width:200px"><button class="btn btn-green" id="saveBtn" onclick="saveLock()">💾 SAVE</button><button class="btn btn-orange" id="editBtn" onclick="enableEdit()" style="display:none">✏️ EDIT</button></div>
<div id="lockMsg" class="locked" style="display:none">🔒 Saved & Locked. Click EDIT to change</div>
<div class="row" style="margin-top:10px"><div class="statBox"><div>Total</div><b style="font-size:22px;color:#0f4c75" id="totalP">0</b><div>Patients</div></div><div class="statBox" style="border-color:#10b981;background:#dcfce7"><div>Submit</div><b style="font-size:22px;color:#10b981" id="cYes">0</b><div>Completed</div></div><div class="statBox" style="border-color:#ef4444;background:#fee2e2"><div>Not Submit</div><b style="font-size:22px;color:#ef4444" id="cNo">0</b><div>Pending</div></div></div>
</div>
<div class="card"><h3 style="text-align:center;color:#0f4c75" id="titleH">KFT Report</h3><table><thead><tr><th>Sl No</th><th>Patient Name</th><th>SHRI ID</th><th>Contact</th><th id="statusHead">KFT Status</th></tr></thead><tbody id="tbl"></tbody></table></div>
</div>
<script>
let raw=(typeof patientData!=='undefined')?patientData:[];let extra=JSON.parse(localStorage.getItem('shija_patients')||'[]');let patients=[...raw,...extra];if(!patients.length)patients=[{patientName:'Demo Patient 1',shriId:'1001',contactNo:'98765'},{patientName:'Demo Patient 2',shriId:'1002',contactNo:''}];
let yearSel=document.getElementById('yearSel'),now=new Date();for(let y=now.getFullYear()-2;y<=now.getFullYear()+1;y++){let o=document.createElement('option');o.value=y;o.textContent=y;if(y===now.getFullYear())o.selected=true;yearSel.appendChild(o);}document.getElementById('monthSel').value=now.getMonth();
let selDate='1',isLocked=false;
function getKey(y,m,day){return `kft_lock_${y}_${m}_${day}`;}function getPKey(y,m,shri,day){return `kft_${y}_${m}_${shri}_${day}`;}function load(y,m,shri,day){return localStorage.getItem(getPKey(y,m,shri,day))==='1';}function setVal(y,m,shri,day,v){localStorage.setItem(getPKey(y,m,shri,day), v?'1':'0');}
function setDate(d){selDate=d;document.getElementById('d1').classList.toggle('active',d==='1');document.getElementById('d15').classList.toggle('active',d==='15');checkLock();render();}
function checkLock(){let y=yearSel.value,m=document.getElementById('monthSel').value;isLocked=localStorage.getItem(getKey(y,m,selDate))==='1';document.getElementById('saveBtn').style.display=isLocked?'none':'inline-block';document.getElementById('editBtn').style.display=isLocked?'inline-block':'none';document.getElementById('lockMsg').style.display=isLocked?'block':'none';}
function saveLock(){let y=yearSel.value,m=document.getElementById('monthSel').value;if(!confirm(`Save KFT for ${selDate} ${document.getElementById('monthSel').options[m].text} ${y}?`))return;localStorage.setItem(getKey(y,m,selDate),'1');checkLock();render();alert('✅ Saved & Locked');}
function enableEdit(){if(!confirm('Enable Edit?'))return;let y=yearSel.value,m=document.getElementById('monthSel').value;localStorage.setItem(getKey(y,m,selDate),'0');checkLock();render();}
function render(){let y=yearSel.value,m=document.getElementById('monthSel').value;let months=["January","February","March","April","May","June","July","August","September","October","November","December"];let search=document.getElementById('search').value.toLowerCase();document.getElementById('titleH').textContent=`KFT Report - ${months[m]} ${selDate}, ${y} - All ${patients.length} Patients`;document.getElementById('statusHead').textContent=`KFT Status - ${months[m]} ${selDate}`;let filtered=patients.filter(p=>!search||(p.patientName||'').toLowerCase().includes(search)||(p.shriId||'').toLowerCase().includes(search));let yes=0;filtered.forEach(p=>{let s=p.shriId||p.patientName;if(load(y,m,s,selDate))yes++;});document.getElementById('totalP').textContent=patients.length;document.getElementById('cYes').textContent=yes;document.getElementById('cNo').textContent=filtered.length-yes;document.getElementById('tbl').innerHTML=filtered.map((p,i)=>{let s=p.shriId||p.patientName;let v=load(y,m,s,selDate);return `<tr><td>${i+1}</td><td>${p.patientName}</td><td>${p.shriId||''}</td><td>${p.contactNo||''}</td><td><button class="toggle ${v?'yes':'no'}" ${isLocked?'disabled':''} onclick="toggle('${s.replace(/'/g,"\\'")}')">${v?'✅ Submit':'❌ Not Submit'}</button></td></tr>`;}).join('');}
function toggle(shri){if(isLocked){alert('Locked! Click EDIT');return;}let y=yearSel.value,m=document.getElementById('monthSel').value;let cur=load(y,m,shri,selDate);setVal(y,m,shri,selDate,!cur);render();}
yearSel.addEventListener('change',()=>{checkLock();render();});document.getElementById('monthSel').addEventListener('change',()=>{checkLock();render();});checkLock();render();
</script></body></html>
