<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, getDocs, collection } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app=initializeApp(cfg,"view_"+Math.random());const db=getFirestore(app);
window._viewDb={db,doc,getDoc,getDocs,collection};

<script>
let allPatients=[],filtered=[],currentPage=1,pageSize=12,view='grid',masterMap={},photoMap={},photoMapDigits={},scheme='PMJAY';
function getToday(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function fmt(iso){if(!iso)return'';let p=iso.split('-');return `${p[2]}-${p[1]}-${p[0]}`;}
function shiftDate(d){let inp=document.getElementById('fDate');let dt=inp.value?new Date(inp.value+'T00:00:00'):new Date();dt.setDate(dt.getDate()+d);inp.value=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;onDateChange();}
function toggleWhiteBar(){if(window.innerWidth<=900){document.getElementById('whiteBar').classList.toggle('mOpen');document.getElementById('mobOverlay').classList.toggle('show');}else{document.getElementById('whiteBar').classList.toggle('folded');}}
function closeMob(){document.getElementById('whiteBar').classList.remove('mOpen');document.getElementById('mobOverlay').classList.remove('show');}
function switchView(v){view=v;document.getElementById('btnListView').classList.toggle('active',v==='list');document.getElementById('btnGridView').classList.toggle('active',v==='grid');let sheet=document.getElementById('sheetWrap');let grid=document.getElementById('gridWrap');if(v==='grid'){sheet.classList.add('hide');grid.classList.add('show');}else{sheet.classList.remove('hide');grid.classList.remove('show');}renderPagination();}
function clearFiltersDirect(){document.getElementById('filterTime').value='';document.getElementById('filterBlock').value='';let s=document.getElementById('searchName');if(s)s.value='';applyFilter();}
function initials(name){if(!name)return'?';let w=name.trim().split(/\s+/);if(w.length===1)return w[0].substring(0,2).toUpperCase();return (w[0][0]+w[1][0]).toUpperCase();}
function digitsOnly(s){return String(s||'').replace(/[^0-9]/g,'');}
function rebuildChunkPhoto(p){
  if(!p) return '';
  let direct=p.photoUrl||p.photoURL||p.imageUrl||p.imageURL||'';
  if(direct && (String(direct).startsWith('data:')||String(direct).startsWith('http'))) return String(direct);
  let arr=p.photoChunks||p.photo_parts||p.photoParts||p.chunks||p.parts||p.imageChunks||null;
  if(Array.isArray(arr)&&arr.length>0){let j=arr.join('');if(j.startsWith('data:'))return j;return 'data:image/jpeg;base64,'+j;}
  let chunkKeys=Object.keys(p).filter(k=>/^(photo|image|chunk|part)[_\-]?(\d+)$/i.test(k)||/^(photoChunks|chunks)[_\-]\d+$/i.test(k));
  if(chunkKeys.length>0){chunkKeys.sort((a,b)=>parseInt(a.match(/(\d+)$/)[1])-parseInt(b.match(/(\d+)$/)[1]));let j=chunkKeys.map(k=>String(p[k]||'')).join('');if(j.startsWith('data:'))return j;return 'data:image/jpeg;base64,'+j.replace(/^data:image\/\w+;base64,[STRIPPED],'');}
  let single=p.photo||p.image||p.img||'';
  if(single&&String(single).length>100){let s=String(single);if(s.startsWith('data:'))return s;return 'data:image/jpeg;base64,'+s;}
  return '';
}
async function fetchSubCollectionChunks(docId){
  let tries=['photoChunks','chunks','photo_chunks','photoParts'];
  for(let sub of tries){try{let snap=await window._viewDb.getDocs(window._viewDb.collection(window._viewDb.db,'patients',docId,sub));if(snap.size>0){let arr=[];snap.forEach(d=>{let data=d.data();let idx=data.index??data.i??parseInt(d.id.replace(/[^0-9]/g,''))??0;let val=data.chunk||data.data||data.value||data.photo||'';arr[idx]=val;});let j=arr.join('');if(j)return j.startsWith('data:')?j:'data:image/jpeg;base64,'+j;}}catch(e){}}
  return '';
}
async function buildMaster(){
  masterMap={};photoMap={};photoMapDigits={};
  let loadColl=async(coll,isCMHT)=>{
    try{let s=await window._viewDb.getDocs(window._viewDb.collection(window._viewDb.db,coll));
    for(let d of s.docs){let p=d.data();if(p.deleted)continue;let shriRaw=String(p.shriId||p.shri||d.id||'').trim().toUpperCase();if(!shriRaw)continue;if(!masterMap[shriRaw])masterMap[shriRaw]={};if(isCMHT)masterMap[shriRaw].cmhtName=String(p.patientName||p.name||'').trim().toUpperCase();else masterMap[shriRaw].name=String(p.patientName||p.name||'').trim().toUpperCase();let ph=rebuildChunkPhoto(p);if(!ph&&coll==='patients'){ph=await fetchSubCollectionChunks(d.id);}if(ph){photoMap[shriRaw]=ph;let dg=digitsOnly(shriRaw);if(dg)photoMapDigits[dg]=ph;}}
    }catch(e){}
  };
  await loadColl('patients',false);await loadColl('cmht_patients',true);
}
async function enrichAsync(p){let k=String(p.shri||'').trim().toUpperCase();let m=masterMap[k];if(m){if(scheme==='CMHT'&&m.cmhtName)p.name=m.cmhtName;else if(m.name)p.name=m.name;}let ph=rebuildChunkPhoto(p)||photoMap[k]||photoMapDigits[digitsOnly(k)]||'';if(ph)p._photo=ph;return p;}
async function onDateChange(){
  let date=document.getElementById('fDate').value;
  if(!date){date=getToday();document.getElementById('fDate').value=date;}
  document.getElementById('dateDisplay').innerText=fmt(date);
  document.getElementById('statDate2').innerText=fmt(date);
  document.getElementById('statScheme').innerText=scheme;
  let docId=date+'_'+scheme;
  try{let snap=await window._viewDb.getDoc(window._viewDb.doc(window._viewDb.db,'daily_dialysis_lists',docId));let list=snap.exists()?(snap.data().patients||[]):[];let out=[];for(let i=0;i<list.length;i++){out.push(await enrichAsync({...list[i],sl:i+1}));}if(scheme==='PMJAY')out=out.filter(p=>(p.patientStatus||'ENHANCEMENT')!=='DISCHARGE');allPatients=out;applyFilter();}catch(e){allPatients=[];applyFilter();}
}
function norm(t){if(!t)return'';let s=String(t).toUpperCase().trim();let m=s.match(/(\d{1,2})(?::(\d{1,2}))?\s*([AP]M)?/);if(!m)return s;return `${parseInt(m[1])}:${(m[2]||'00').padStart(2,'0')} ${m[3]||''}`.trim();}
function applyFilter(){let q=(document.getElementById('searchName').value||'').toLowerCase().trim();let tf=document.getElementById('filterTime').value;let bf=document.getElementById('filterBlock').value;filtered=allPatients.filter(p=>{if(q){let n=String(p.name||'').toLowerCase();let sh=String(p.shri||'').toLowerCase();if(!n.includes(q)&&!sh.includes(q))return false;}if(tf&&norm(p.time)!==norm(tf))return false;if(bf&&p.block!==bf)return false;return true;});currentPage=1;renderPagination();updateBottom();}
function updateBottom(){document.getElementById('statTotal').innerText=allPatients.length;document.getElementById('statFiltered').innerText=filtered.length;document.getElementById('filterNoMid').innerText=`Filtered: ${filtered.length}`;document.getElementById('bottomStats').innerText=`Total: ${allPatients.length} | Filtered: ${filtered.length} | Scheme: ${scheme}`;}
function photoHTML(p,cls){let ph=p._photo||'';if(ph){return `<div class="${cls}"><img src="${ph}" alt="" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add('noPhoto');this.remove();this.parentNode.innerHTML='<span>${initials(p.name)}</span>'"></div>`;}return `<div class="${cls} noPhoto"><span>${initials(p.name)}</span></div>`;}
function renderPagination(){
  pageSize=parseInt(document.getElementById('rowsPerPage').value)||12;
  let totalPages=Math.max(1,Math.ceil(filtered.length/pageSize));if(currentPage>totalPages)currentPage=totalPages;
  let pag=document.getElementById('pagination');pag.innerHTML='';
  function addBtn(i){let b=document.createElement('button');b.className='pageBtn'+(i===currentPage?' active':'');b.innerText=i;b.onclick=()=>{currentPage=i;renderTable();renderGrid();renderPagination();};pag.appendChild(b);}
  if(totalPages<=5){for(let i=1;i<=totalPages;i++)addBtn(i);}else{addBtn(1);addBtn(2);addBtn(3);if(currentPage>4){let s=document.createElement('span');s.innerText='...';pag.appendChild(s);}if(currentPage>3&&currentPage<totalPages)addBtn(currentPage);if(currentPage<totalPages-1){let s=document.createElement('span');s.innerText='...';pag.appendChild(s);}addBtn(totalPages);}
  renderTable();renderGrid();updateBottom();
}
function renderTable(){
  let tbody=document.getElementById('tbody');tbody.innerHTML='';
  let start=(currentPage-1)*pageSize;let page=filtered.slice(start,start+pageSize);
  page.forEach((p,idx)=>{let tr=document.createElement('tr');tr.innerHTML=`<td><div class="sl">${p.sl||start+idx+1}</div></td><td><div class="photoName">${photoHTML(p,'pPhoto')}<div class="nameInner">${p.name||''}</div></div></td><td><span class="shriTable">${p.shri||'No ID'}</span></td><td>${p.time||''}</td><td>${p.block||''}</td><td>${p.prev||''}</td>`;tbody.appendChild(tr);});
  if(page.length===0){let tr=document.createElement('tr');tr.innerHTML=`<td colspan="6" style="padding:16px;text-align:center;font-size:12px">NO PATIENTS</td>`;tbody.appendChild(tr);}
}
function renderGrid(){
  let grid=document.getElementById('gridWrap');grid.innerHTML='';
  let start=(currentPage-1)*pageSize;let page=filtered.slice(start,start+pageSize);
  page.forEach((p,idx)=>{let div=document.createElement('div');div.className='pCard';div.innerHTML=`${photoHTML(p,'pPhotoBig')}<div class="pCardName">${p.name||'NO NAME'}</div><div class="pCardSub">SHRI: ${p.shri||'—'}</div><div class="pCardInfo"><span>${p.time||''}</span><span>${p.block||''}</span><span>PREV: ${p.prev||'-'}</span></div>`;grid.appendChild(div);});
  if(page.length===0){grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:24px;background:#fff;border-radius:12px;border:1px solid #e2e8f0;font-size:12px;font-weight:700">No patients</div>';}
}
function changePage(d){let totalPages=Math.max(1,Math.ceil(filtered.length/pageSize));currentPage+=d;if(currentPage<1)currentPage=1;if(currentPage>totalPages)currentPage=totalPages;renderPagination();}
document.addEventListener('DOMContentLoaded',function(){
  document.getElementById('menuBtnTop').addEventListener('click',function(e){e.preventDefault();toggleWhiteBar();});
  document.getElementById('datePrev').addEventListener('click',()=>shiftDate(-1));
  document.getElementById('dateNext').addEventListener('click',()=>shiftDate(1));
  document.getElementById('fDate').addEventListener('change',onDateChange);
  document.getElementById('fType').addEventListener('change',()=>{scheme=document.getElementById('fType').value;onDateChange();});
  document.getElementById('rowsPerPage').addEventListener('change',renderPagination);
  document.getElementById('filterTime').addEventListener('change',applyFilter);
  document.getElementById('filterBlock').addEventListener('change',applyFilter);
  document.getElementById('searchName').addEventListener('input',applyFilter);
  // DATE INIT - MUST RUN HERE
  let url=new URLSearchParams(location.search);
  if(url.get('scheme')){scheme=url.get('scheme');document.getElementById('fType').value=scheme;}
  if(url.get('date'))document.getElementById('fDate').value=url.get('date');else document.getElementById('fDate').value=getToday();
  document.getElementById('dateDisplay').innerText=fmt(document.getElementById('fDate').value);
  document.getElementById('statDate2').innerText=fmt(document.getElementById('fDate').value);
});
window.addEventListener('load',async()=>{await buildMaster();onDateChange();});
</script>
<script type="module" src="maintenance.js"></script>
</body>
