body{background:#f1f5f9;display:flex;min-height:100vh;overflow-x:hidden;overflow-anchor:none}
.whiteBar{position:fixed;left:0;top:0;bottom:0;width:270px;min-width:270px;height:100vh;background:#0f172a;color:#94a3b8;display:flex;flex-direction:column;justify-content:space-between;z-index:90;overflow:hidden;transition:width .32s ease, transform .32s ease}

.sMenu a:hover .mi{background:#2563eb}

.ml{overflow:hidden;text-overflow:ellipsis}
.whiteBar.folded .ml{display:none}

.top{height:68px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:20}

.content{flex:1;padding:20px 24px;position:relative;background:#f8fafc;overflow-anchor:none}
.fInput,.fSelect{width:100%;height:48px;padding:0 14px;border:1.5px solid #e2e8f0;border-radius:10px;background:#fff;font-size:15px;font-weight:500;color:#334155;outline:none;appearance:none;-webkit-appearance:none}

.fInput:focus,.fSelect:focus{border-color:#2563eb}
.fInput:hover,.fSelect:hover{border-color:#94a3b8}
.searchWrap{position:relative;width:100%}
.searchWrap .fInput{padding-right:44px;transition:border-color .2s,box-shadow .2s}
.searchWrap .fInput:hover{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.08)}
.searchWrap .fInput:focus{box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.searchIcon{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:22px;height:22px;display:grid;place-items:center;color:#64748b;pointer-events:none}
.searchIcon svg{width:20px;height:20px;stroke:#64748b;stroke-width:2.2;fill:none;stroke-linecap:round}
.datePill{display:flex;align-items:stretch;height:48px;border:1.5px solid #e2e8f0;border-radius:10px;overflow:hidden;background:#fff;flex-shrink:0;position:relative;transition:border-color .2s,box-shadow .2s}
.datePill:hover{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.08)}
.dateArrow{width:36px;border:0;background:#fff!important;color:#1e3a5f!important;font-size:20px;font-weight:900;cursor:pointer;display:grid;place-items:center;flex-shrink:0;position:relative;z-index:2;transition:background .15s,color .15s}

.dateMiddle{flex:1;display:grid;place-items:center;font-size:14px;font-weight:600;color:#334155;cursor:pointer;min-width:110px;padding:0 6px;white-space:nowrap;position:relative;overflow:hidden}
.dateMiddle:hover{background:#eff6ff}
.dateMiddle span{position:relative;z-index:1;pointer-events:none}
#fDate{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0}

.pageHead{padding:2px 2px 18px}
.pageHead h1{font-size:42px;font-weight:900;color:#0f172a;line-height:1.05;letter-spacing:-1px}
.pageHead p{font-size:15px;color:#64748b;margin-top:8px;font-weight:500}
.topToolbar{background:#fff;border:1.5px solid #e2e8f0;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topToolbar .searchWrap{flex:1;min-width:220px}
.topToolbar .fInput{height:48px;border-radius:10px;font-size:14px}

.toolSelect{height:48px;padding:0 12px;border:1.5px solid #cbd5e1;border-radius:10px;background:#f8fafc;font-size:14px;font-weight:600;color:#0f172a;cursor:pointer;white-space:nowrap;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,[STRIPPED]");background-repeat:no-repeat;background-position:right 10px center;padding-right:32px;transition:border-color .2s,background .2s,box-shadow .2s}

.tableWrap{background:#fff;border:1.5px solid #e2e8f0;border-radius:16px;overflow:hidden;margin-top:16px;position:relative;min-height:520px;box-shadow:0 4px 20px rgba(0,0,0,.04)}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:1250px}
th{padding:18px 14px;font-size:13px;color:#0f172a;background:#eef1f4;text-align:left;text-transform:uppercase;white-space:nowrap;position:sticky;top:0;z-index:1;font-weight:600;letter-spacing:.2px;transition:background .15s}
th:hover{background:#e2e8f0}
td{padding:18px 14px;font-size:14px;color:#0f172a;border-bottom:1px solid #f1f5f9;vertical-align:middle;white-space:nowrap;font-weight:500}
td.nameTd{white-space:normal!important;word-break:break-word!important;min-width:180px;max-width:260px;line-height:1.4;font-weight:600}
td.remarkTd{white-space:normal!important;word-break:break-word!important;min-width:120px;max-width:200px;line-height:1.35;font-weight:500}
.remarkText{font-size:14px;font-weight:500;color:#0f172a}
.remarkText.cash{color:#b45309}
.remarkText.kft{color:#dc2626}
.remarkText.na{color:#94a3b8}
.sl{font-weight:500;color:#0f172a;font-size:14px}

.shiftPill.Evening{background:#8b5cf6}
.shiftPill.Night{background:#7c3aed}

.pCard{width:100%;border-radius:16px;background:#fff;border:1.5px solid #e2e8f0;box-shadow:0 4px 20px rgba(0,0,0,.04);overflow:hidden;display:flex;flex-direction:column;padding:18px 14px 14px;text-align:center;transition:border-color .25s,box-shadow .25s;cursor:pointer}

.pCard:hover .pCardAvatar{border-color:#2563eb;box-shadow:0 6px 16px rgba(37,99,235,.3)}
.pCardAvatar img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.pCardName{font-weight:700;font-size:14px;color:#0f172a;line-height:1.45;white-space:normal;word-break:break-word;margin:12px 0 4px;min-height:40px;display:flex;align-items:flex-start;justify-content:center;transition:color .2s}
.pCard:hover .pCardName{color:#2563eb}
.pCardBody{display:flex;flex-direction:column}
.pCardRow2{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-top:1px solid #f1f5f9;transition:background .15s}
.pCardRow2:hover{background:#f8fafc}
.pCardRow2 span{font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;flex-shrink:0;margin-right:8px}
.pCardRow2 b{font-size:13px;font-weight:700;color:#0f172a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.pager{display:flex;align-items:center;justify-content:space-between;padding:14px;flex-wrap:wrap;gap:10px}
.pagerCenter{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pagerGrid{display:flex;align-items:center;justify-content:space-between;padding:14px 2px;flex-wrap:wrap;gap:8px}
.showingText{font-size:14px;color:#0f172a;font-weight:500}
.pBtn{padding:9px 14px;border-radius:8px;border:0;background:#e2e8f0;font-weight:600;cursor:pointer;font-size:14px;color:#0f172a;min-width:38px;transition:background .18s,color .18s,box-shadow .18s}
.pBtn:hover{background:#0f172a!important;color:#fff!important;box-shadow:0 6px 14px rgba(0,0,0,.18)}
.pBtn.active{background:#2563eb!important;color:#fff!important}
.pBtn.active:hover{background:#1d4ed8!important}
.hidden{display:none!important}
#mobOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:89}
#mobOverlay.show{display:block}
#photoModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:10001;align-items:center;justify-content:center;padding:20px;flex-direction:column}
#photoModal.show{display:flex}
.photoBox{position:relative;width:90vw;max-width:420px;margin-top:46px}
#photoView{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:20px;border:4px solid #fff;display:block}
.photoClose{position:absolute;top:-46px;right:0;width:36px;height:36px;border-radius:50%;border:0;background:#fff;color:#0f172a;font-size:20px;font-weight:900;line-height:1;cursor:pointer;display:grid;place-items:center;z-index:2;box-shadow:0 4px 12px rgba(0,0,0,.4);transition:background .2s,color .2s}
.photoClose:hover{background:#dc2626;color:#fff}
#photoName{color:#fff;font-weight:800;margin-top:14px;font-size:15px;text-align:center}
@media(max-width:1100px){.patientGrid{grid-template-columns:repeat(3,1fr)}.pageHead h1{font-size:34px}}
@media(max-width:900px){.whiteBar{transform:translateX(-100%);width:270px!important}.whiteBar.mOpen{transform:translateX(0)}.mainWrap{margin-left:0!important;width:100%!important}.patientGrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.patientGrid{grid-template-columns:1fr;gap:10px}.topToolbar .searchWrap{flex-basis:100%}.pageHead h1{font-size:30px}.datePill{flex-basis:100%}.dateMiddle{flex:1}}
</style>
</head>

function closeMob(){document.getElementById('whiteBar').classList.remove('mOpen');document.getElementById('mobOverlay').classList.remove('show');}

<script type="module">

const firebaseConfig = {apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app = initializeApp(firebaseConfig,"userlistTotal_"+Date.now());const db = getFirestore(app);
let allPatients=[],filtered=[],currentPage=1,pageSize=10,masterMap={},photoCache={},currentPhotoKey=null,photoLoadingSet=new Set(),loadToken=0;
function getTodayIST(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function fmtPrev(v){if(!v)return'-';let s=String(v).trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s)){let p=s.split('-');let months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return `${parseInt(p[2])} ${months[parseInt(p[1])-1]} ${p[0]}`;}return s;}
function fmtDateDisplay(iso){if(!iso)return'';let p=String(iso).split('-');if(p.length!==3)return iso;return `${p[1]}/${p[2]}/${p[0]}`;}
function updateDateDisplay(){document.getElementById('dateDisplay').innerText=fmtDateDisplay(document.getElementById('fDate').value);}
function shiftDate(d){let input=document.getElementById('fDate');let dt=input.value?new Date(input.value):new Date();if(isNaN(dt))dt=new Date();dt.setDate(dt.getDate()+d);let nd=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;input.value=nd;updateDateDisplay();onDateChange();}
function normalizeTime(t){if(!t)return'';let s=String(t).toUpperCase().trim().replace(/\s+/g,' ').replace(/\./g,'');let m=s.match(/(\d{1,2})(?::(\d{1,2}))?\s*([AP]M)?/);if(!m)return s;let h=parseInt(m[1]);let min=m[2]?m[2].padStart(2,'0'):'00';let ap=m[3]||'';if(!ap){if(s.includes('AM'))ap='AM';else if(s.includes('PM'))ap='PM';}return ap?`${h}:${min} ${ap}`:`${h}:${min}`;}
function shiftFromTime(t){let n=normalizeTime(t);let m=n.match(/(\d{1,2}):(\d{2})\s*([AP]M)/);if(!m) return 'Morning';let h=parseInt(m[1]); let ap=m[3];let h24 = ap==='PM' ? (h===12?12:h+12) : (h===12?0:h);if(h24===0) return 'Midnight';if(h24>=1 && h24<12) return 'Morning';if(h24>=12 && h24<=15) return 'Afternoon';if(h24>=16 && h24<=19) return 'Evening';return 'Night';}
function getInitial(name){return (name||'P').trim().charAt(0).toUpperCase();}
function cleanKey(k){return String(k).replace(/[^a-zA-Z0-9]/g,'_');}
function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function remarkText(p){let r=String(p.remark||'N/A').trim();return r||'N/A';}
function remarkClass(r){if(r==='CASH PAYMENT')return'cash';if(r==='KFT DUE')return'kft';if(r==='N/A')return'na';return'custom';}
function getIds(p){let id=p.pmjayCmhtId||'-';if(p.scheme==='CMHT')return{pmjay:'N/A',cmht:id};if(p.scheme==='PMJAY')return{pmjay:id,cmht:'N/A'};return{pmjay:id,cmht:'N/A'};}
let urlParams=new URLSearchParams(window.location.search);

function mergeMaster(shri,pmjayData,cmhtData){if(!shri)return;let m=masterMap[shri]||{shri,pmjayId:'',pmjayName:'',cmhtId:'',cmhtName:'',photo:''};if(pmjayData){if(pmjayData.pmjayId||pmjayData.pmjay)m.pmjayId=String(pmjayData.pmjayId||pmjayData.pmjay||'').trim().toUpperCase();if(pmjayData.patientName||pmjayData.name)m.pmjayName=String(pmjayData.patientName||pmjayData.name||'').trim().toUpperCase();if(pmjayData.photo||pmjayData.photoUrl||pmjayData.image)m.photo=pmjayData.photo||pmjayData.photoUrl||pmjayData.image;}if(cmhtData){if(cmhtData.cmhtId||cmhtData.cmht||cmhtData.pmjayId||cmhtData.pmjay)m.cmhtId=String(cmhtData.cmhtId||cmhtData.cmht||cmhtData.pmjayId||cmhtData.pmjay||'').trim().toUpperCase();if(cmhtData.patientName||cmhtData.name)m.cmhtName=String(cmhtData.patientName||cmhtData.name||'').trim().toUpperCase();let ph=cmhtData.photo||cmhtData.photoUrl||cmhtData.image;if(ph)m.photo=ph;}masterMap[shri]=m;}
async function loadMasterForShri(shri){if(!shri||masterMap[shri])return;try{let [a,b]=await Promise.all([getDoc(doc(db,"patients",shri)).catch(()=>null),getDoc(doc(db,"cmht_patients",shri)).catch(()=>null)]);mergeMaster(shri,a&&a.exists()?a.data():null,b&&b.exists()?b.data():null);}catch(e){}}
async function buildMasterMapFor(list){let shris=[...new Set(list.map(p=>String(p.shri||p.shriId||'').trim().toUpperCase()).filter(Boolean))];let missing=shris.filter(s=>!masterMap[s]);await Promise.all(missing.map(s=>loadMasterForShri(s)));return masterMap;}
async function buildMasterMap(){return buildMasterMapFor(allPatients);}
function enrichPatient(p,scheme){let k=String(p.shri||'').trim().toUpperCase();if(!k)return p;let m=masterMap[k];if(!m)return p;if(scheme==='PMJAY'){if(m.pmjayName)p.name=m.pmjayName;if(m.pmjayId)p.pmjayCmhtId=m.pmjayId;}else if(scheme==='CMHT'){if(m.cmhtName)p.name=m.cmhtName;if(m.cmhtId)p.pmjayCmhtId=m.cmhtId;else if(m.pmjayId)p.pmjayCmhtId=m.pmjayId;}if(m.photo)p.photo=m.photo;if(!p.patientStatus)p.patientStatus='ENHANCEMENT';return p;}
function normDischargeDate(v){if(!v)return'';let s=String(v).trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;let d=new Date(s);if(!isNaN(d))return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;return s;}
function extractPatientsFromDocData(d,scheme){if(!d)return[];if(Array.isArray(d.patients))return d.patients;if(Array.isArray(d.list))return d.list;if(Array.isArray(d.data))return d.data;if(d.shri||d.patientName||d.name)return[d];return[];}
function inferSchemeFromMaster(p){let shri=String(p.shri||p.shriId||'').trim().toUpperCase();let id=String(p.pmjayCmhtId||p.pmjayId||p.cmhtId||'').trim().toUpperCase();if(!shri||!id)return'';let m=masterMap[shri];if(!m)return'';if(m.cmhtId&&m.cmhtId===id)return'CMHT';if(m.pmjayId&&m.pmjayId===id)return'PMJAY';return'';}
function inferSchemeFromFields(p){if(String(p.cmhtId||'').trim()&&!String(p.pmjayId||'').trim())return'CMHT';if(String(p.pmjayId||'').trim()&&!String(p.cmhtId||'').trim())return'PMJAY';let cmhtField=String(p.cmhtId||'').trim().toUpperCase();let pmjayField=String(p.pmjayId||'').trim().toUpperCase();let main=String(p.pmjayCmhtId||'').trim().toUpperCase();if(main&&cmhtField&&main===cmhtField)return'CMHT';if(main&&pmjayField&&main===pmjayField)return'PMJAY';return inferSchemeFromMaster(p);}
function resolveDischargeScheme(raw,docScheme){let explicit=String(raw.scheme||raw.Scheme||raw.schemeType||'').trim().toUpperCase();if(explicit==='PMJAY'||explicit==='CMHT')return explicit;let byField=inferSchemeFromFields(raw);if(byField)return byField;if(docScheme==='PMJAY'||docScheme==='CMHT')return docScheme;return'';}
async function loadDischargedPatients(date,filterScheme){let out=[];let seenKeys=new Set();let push=(arr,docScheme)=>{arr.forEach(raw=>{let p={...raw};let pScheme=resolveDischargeScheme(raw,docScheme);if(filterScheme&&pScheme&&pScheme!==filterScheme)return;if(filterScheme&&!pScheme)return;let d1=normDischargeDate(p.dischargeDate||p.date||p.discharge_date||p.createdAt||p.timestamp);if(date&&d1&&d1!==date)return;if(!p.name&&p.patientName)p.name=p.patientName;if(!p.shri&&p.shriId)p.shri=p.shriId;if(!p.pmjayCmhtId&&(p.pmjayId||p.cmhtId||p.pmjayCmhtId))p.pmjayCmhtId=p.pmjayId||p.cmhtId||p.pmjayCmhtId;if(!p.patientStatus)p.patientStatus='DISCHARGE';let displayScheme=pScheme||filterScheme||'';let e=enrichPatient({...p},displayScheme||'PMJAY');e.scheme=displayScheme;e.patientStatus='DISCHARGE';if(!e.remark)e.remark='N/A';e.key=String(e.shri||e.pmjayCmhtId||e.name||'').trim();e._fromDischarge=true;let dk=e.shri+'|'+normalizeTime(e.time)+'|'+e.scheme;if(seenKeys.has(dk))return;seenKeys.add(dk);out.push(e);});};let specs=[{id:date+'_PMJAY_DISCHARGE',scheme:'PMJAY'},{id:date+'_CMHT_DISCHARGE',scheme:'CMHT'},{id:date+'_DISCHARGE',scheme:''},{id:date+'_PMJAY',scheme:'PMJAY'},{id:date+'_CMHT',scheme:'CMHT'}];let results=await Promise.all(specs.map(s=>getDoc(doc(db,"daily_dialysis_lists",s.id)).catch(()=>null)));results.forEach((snap,idx)=>{if(!snap||!snap.exists())return;let spec=specs[idx];let arr=extractPatientsFromDocData(snap.data(),spec.scheme);if(spec.id.includes('DISCHARGE'))push(arr,spec.scheme);else push(arr.filter(x=>String(x.patientStatus||x.status||'').toUpperCase().includes('DISCHARGE')),spec.scheme);});let extra=await Promise.all([getDoc(doc(db,"discharge_lists",date+'_PMJAY')).catch(()=>null),getDoc(doc(db,"discharge_lists",date+'_CMHT')).catch(()=>null),getDoc(doc(db,"discharge_lists",date)).catch(()=>null),getDocs(collection(db,"discharged_patients")).catch(()=>null)]);if(extra[0]&&extra[0].exists())push(extractPatientsFromDocData(extra[0].data(),'PMJAY'),'PMJAY');if(extra[1]&&extra[1].exists())push(extractPatientsFromDocData(extra[1].data(),'CMHT'),'CMHT');if(extra[2]&&extra[2].exists())push(extractPatientsFromDocData(extra[2].data(),''),'');if(extra[3]&&!extra[3].empty){extra[3].forEach(d=>{let p=d.data();if(p.deleted)return;let dd=normDischargeDate(p.dischargeDate||p.date||p.discharge_date||p.createdAt);if(date&&dd&&dd!==date)return;push([p],'');});}return out;}
async function loadRawScheme(date,scheme){try{let snap=await getDoc(doc(db,"daily_dialysis_lists",date+'_'+scheme));let patients=snap.exists()?(snap.data().patients||[]):[];return patients.map(p=>({...p,scheme}));}catch(e){return[];}}
async function loadOneScheme(date,scheme){let raw=await loadRawScheme(date,scheme);let patients=raw.map((p,i)=>{let e=enrichPatient({...p,sl:i+1},scheme);e.sl=i+1;e.scheme=scheme;if(!e.patientStatus)e.patientStatus='ENHANCEMENT';if(!e.remark)e.remark='N/A';e.key=String(e.shri||e.pmjayCmhtId||e.name||'').trim();return e;});if(scheme==='PMJAY')patients=patients.filter(p=>(p.patientStatus||'ENHANCEMENT')!=='DISCHARGE');return patients;}
async function onDateChange(){let myToken=++loadToken;updateDateDisplay();let date=document.getElementById('fDate').value;let scheme=document.getElementById('fType').value;try{let schemes=scheme?[scheme]:['PMJAY','CMHT'];let [rawLists]=await Promise.all([Promise.all(schemes.map(s=>loadRawScheme(date,s)))]);if(myToken!==loadToken)return;let rawAll=[];rawLists.forEach((arr,idx)=>arr.forEach(p=>rawAll.push({...p,scheme:schemes[idx]})));await buildMasterMapFor(rawAll);if(myToken!==loadToken)return;let disList=await loadDischargedPatients(date,scheme);if(myToken!==loadToken)return;await buildMasterMapFor(disList);if(myToken!==loadToken)return;disList=disList.map(p=>{let trueScheme=resolveDischargeScheme(p,p.scheme)||p.scheme||scheme;if(scheme&&trueScheme!==scheme)return null;let e=enrichPatient({...p},trueScheme||'PMJAY');e.scheme=trueScheme;e.patientStatus='DISCHARGE';return e;}).filter(Boolean);let seen=new Set();allPatients=[];rawAll.forEach(p=>{let e=enrichPatient({...p},p.scheme);e.scheme=p.scheme;if(!e.patientStatus)e.patientStatus='ENHANCEMENT';if(!e.remark)e.remark='N/A';e.key=String(e.shri||e.pmjayCmhtId||e.name||'').trim();if(p.scheme==='PMJAY'&&(e.patientStatus||'ENHANCEMENT')==='DISCHARGE')return;let k=e.shri+'|'+normalizeTime(e.time)+'|'+e.scheme;if(seen.has(k))return;seen.add(k);allPatients.push(e);});disList.forEach(p=>{let k=p.shri+'|'+normalizeTime(p.time)+'|'+p.scheme;if(seen.has(k))return;seen.add(k);allPatients.push(p);});allPatients.forEach((p,i)=>p.sl=i+1);applyFilter();}catch(e){if(myToken!==loadToken)return;allPatients=[];applyFilter();}}
window.onSearch=()=>{currentPage=1;applyFilter();};
window.changePageSize=()=>{pageSize=parseInt(document.getElementById('pageSize').value);let g=document.getElementById('pageSizeGrid');if(g)g.value=pageSize;currentPage=1;renderAll();};
window.changePageSizeFrom=(el)=>{pageSize=parseInt(el.value);let m=document.getElementById('pageSize');if(m)m.value=pageSize;currentPage=1;renderAll();};
window.applyFilter=()=>{let q=document.getElementById('search').value.trim().toLowerCase();let timeF=document.getElementById('filterTime').value;let timeN=normalizeTime(timeF);let shiftF=document.getElementById('filterShift')?document.getElementById('filterShift').value:'';let blockF=document.getElementById('filterBlock').value;filtered=allPatients.filter(p=>{if(q){let n=String(p.name||'').toLowerCase(),s=String(p.shri||'').toLowerCase(),id=String(p.pmjayCmhtId||'').toLowerCase();if(!n.includes(q)&&!s.includes(q)&&!id.includes(q))return false;}if(timeF&&normalizeTime(p.time)!==timeN)return false;if(shiftF&&shiftFromTime(p.time)!==shiftF)return false;if(blockF&&String(p.block||'').toUpperCase()!==blockF)return false;return true;});renderAll();};
async function getFullPhotoSmart(ukey,needFull){if(photoCache[ukey]&&(!needFull||photoCache[ukey].length>1000))return photoCache[ukey];let c=cleanKey(ukey);try{let snap=await getDoc(doc(db,"patient_photos",c+"_photo"));if(!snap.exists())return null;let d=snap.data();if(d.thumb&&!photoCache[ukey]){photoCache[ukey]=d.thumb;applyPhotoToDOM(ukey,d.thumb);}if(!needFull){if(d.thumb)return d.thumb;if(d.full)return d.full;}if(d.full&&d.full.length>100){photoCache[ukey]=d.full;return d.full;}if(d.thumb&&d.chunkCount===0)return d.thumb;let snap2=await getDocs(collection(db,"patient_photos",c+"_photo","chunks"));if(!snap2.empty){let arr=[];snap2.forEach(x=>arr.push(x.data()));arr.sort((a,b)=>a.index-b.index);let full=arr.map(a=>a.data).join('');if(full){photoCache[ukey]=full;return full;}}if(d.thumb)return d.thumb;}catch(e){}return null;}
function applyPhotoToDOM(ukey,src){document.querySelectorAll(`.pCardAvatar[data-ukey="${CSS.escape(ukey)}"]`).forEach(el=>{let img=el.querySelector('img');if(!img){el.innerHTML=`<img src="${src}" loading="eager" decoding="async">`;}else if(img.src!==src){img.src=src;}});document.querySelectorAll(`.tAvatar[data-ukey="${CSS.escape(ukey)}"]`).forEach(el=>{let img=el.querySelector('img');if(!img){el.innerHTML=`<img src="${src}" loading="eager" decoding="async">`;}else if(img.src!==src){img.src=src;}});}
window.openPhoto=async(ukey,shri,name)=>{currentPhotoKey=ukey;document.getElementById('photoName').textContent=name+' - '+shri;document.getElementById('photoView').src=photoCache[ukey]||'';document.getElementById('photoModal').classList.add('show');let f=await getFullPhotoSmart(ukey,true);if(f){photoCache[ukey]=f;if(currentPhotoKey===ukey)document.getElementById('photoView').src=f;applyPhotoToDOM(ukey,f);}};

async function loadPhotoCache(){let start=(currentPage-1)*pageSize;let pageData=filtered.slice(start,start+pageSize);let toLoad=pageData.filter(p=>!photoCache[p.key]&&!photoLoadingSet.has(p.key));if(toLoad.length===0)return;let run=()=>Promise.all(toLoad.map(async p=>{photoLoadingSet.add(p.key);let thumb=await getFullPhotoSmart(p.key,false);if(thumb){photoCache[p.key]=thumb;applyPhotoToDOM(p.key,thumb);}photoLoadingSet.delete(p.key);}));if(window.requestIdleCallback)requestIdleCallback(run,{timeout:300});else setTimeout(run,0);}
window.renderAll=()=>{
  let totalPages=Math.max(1,Math.ceil(filtered.length/pageSize));if(currentPage>totalPages)currentPage=totalPages;let start=(currentPage-1)*pageSize;let data=filtered.slice(start,start+pageSize);
  let showingTxt=`Showing ${data.length?start+1:0}-${start+data.length} of ${filtered.length} patients`;
  let showingEl=document.getElementById('showingText');if(showingEl)showingEl.innerText=showingTxt;
  let gridHtml='';data.forEach((p,idx)=>{let avatar=(photoCache[p.key]||p.photo)?`<img src="${escHtml(photoCache[p.key]||p.photo)}" loading="eager" decoding="async">`:getInitial(p.name);let shift=shiftFromTime(p.time);
  gridHtml+=`<div class="pCard"><div class="pCardAvatar" data-ukey="${escHtml(p.key)}" onclick="openPhoto('${escHtml(p.key)}','${escHtml(p.shri||'')}','${escHtml(p.name||'')}')">${avatar}</div><div class="pCardName">${escHtml(p.name||'Unknown')}</div><div style="margin-bottom:10px"><span class="shiftPill ${shift}">${shift}</span></div><div class="pCardBody"><div class="pCardRow2"><span>PMJAY ID</span><b>${escHtml(p.pmjayCmhtId||'-')}</b></div><div class="pCardRow2"><span>SHRI ID</span><b>${escHtml(p.shri||'-')}</b></div><div class="pCardRow2"><span>TIME</span><b>${escHtml(normalizeTime(p.time)||'-')}</b></div><div class="pCardRow2"><span>BLOCK</span><b>${escHtml(p.block||'Main')}</b></div></div></div>`;});
  if(data.length===0)gridHtml='<div style="grid-column:1/-1;text-align:center;padding:40px;background:#fff;border-radius:16px;border:1px solid #e2e8f0">No patients</div>';document.getElementById('patientGrid').innerHTML=gridHtml;
  let html='<tr><th>SL No</th><th>Patient Name</th><th>Photo</th><th>PMJAY ID</th><th>SHRI ID</th><th>CMHT ID</th><th>Block</th><th>Shift</th><th>Time</th><th>Last Dialysis</th><th>Remarks</th></tr>';
  data.forEach((p)=>{let r=remarkText(p);let rc=remarkClass(r);let slNo=start+data.indexOf(p)+1;let thumb=(photoCache[p.key]||p.photo)?`<img src="${escHtml(photoCache[p.key]||p.photo)}" loading="eager" decoding="async">`:getInitial(p.name);let ids=getIds(p);let shift=shiftFromTime(p.time);
  html+=`<tr><td><span class="sl">${String(slNo).padStart(2,'0')}</span></td><td class="nameTd">${escHtml(p.name||'-')}</td><td><div class="tAvatar" data-ukey="${escHtml(p.key)}" onclick="openPhoto('${escHtml(p.key)}','${escHtml(p.shri||'')}','${escHtml(p.name||'')}')">${thumb}</div></td><td>${escHtml(ids.pmjay)}</td><td>${escHtml(p.shri||'-')}</td><td>${escHtml(ids.cmht)}</td><td>${escHtml(p.block||'Main')}</td><td><span class="shiftPill ${shift}">${shift}</span></td><td>${escHtml(normalizeTime(p.time)||'-')}</td><td>${escHtml(fmtPrev(p.prev||p.lastDialysis||''))}</td><td class="remarkTd"><span class="remarkText ${rc}">${escHtml(r)}</span></td></tr>`;});
  if(data.length===0)html+='<tr><td colspan="11" style="text-align:center;padding:20px">No patients</td></tr>';document.getElementById('tbl').innerHTML=html;['','Grid'].forEach(suffix=>{let numsEl=document.getElementById('pageNums'+suffix);if(numsEl){let nums='';for(let i=1;i<=Math.min(totalPages,5);i++){nums+=`<button class="pBtn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;}numsEl.innerHTML=nums;}});loadPhotoCache();};
window.prevPage=()=>{if(currentPage>1){currentPage--;renderAll();}};
window.nextPage=()=>{let totalPages=Math.ceil(filtered.length/pageSize);if(currentPage<totalPages){currentPage++;renderAll();}};
