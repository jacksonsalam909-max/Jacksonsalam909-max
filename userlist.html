function toggleWhiteBar(){if(window.innerWidth<=900){document.getElementById('whiteBar').classList.toggle('mOpen');document.getElementById('mobOverlay').classList.toggle('show');}else{let bar=document.getElementById('whiteBar');bar.classList.toggle('folded');localStorage.setItem('whiteBarFolded', bar.classList.contains('folded') ? 'true' : 'false');}}
function closeMob(){document.getElementById('whiteBar').classList.remove('mOpen');document.getElementById('mobOverlay').classList.remove('show');}
document.addEventListener('DOMContentLoaded',function(){
  let saved = localStorage.getItem('whiteBarFolded');if(saved === 'true' && window.innerWidth>900){ document.getElementById('whiteBar').classList.add('folded'); }

  document.getElementById('btnLogout').addEventListener('click',()=>{if(confirm('Logout from this device?')){localStorage.removeItem('shija_logged'); location.href='login.html';}});
  document.getElementById('btnLogoutAll').addEventListener('click',()=>{adminDropdown.style.display='none';document.getElementById('logoutAllModal').style.display='flex';});

function getInitial(name){ return (name||'P').trim().charAt(0).toUpperCase(); }
function normalizeTime(t){if(!t)return'';let s=String(t).toUpperCase().trim().replace(/\s+/g,' ');let m=s.match(/(\d{1,2})(?::(\d{1,2}))?\s*([AP]M)?/);if(!m)return s;let h=parseInt(m[1]);let mn=m[2]?m[2].padStart(2,'0'):'00';let ap=m[3]||(s.includes('AM')?'AM':s.includes('PM')?'PM':'');return ap?`${h}:${mn} ${ap}`:`${h}:${mn}`;}
/* SPEED: buildMasterMap once, cache 5 min, both collections in parallel */
async function buildMasterMap(){
  if(Date.now()-masterMapLoadedAt < 5*60*1000 && Object.keys(masterMap).length) return;
  if(masterMapLoading) return masterMapLoading;
  masterMapLoading=(async()=>{
  let edited={}; try{ edited=JSON.parse(localStorage.getItem('editedKeys')||'{}'); }catch(e){}
  let snaps=await Promise.all([getDocs(collection(db,'patients')), getDocs(collection(db,'cmht_patients'))]);
  let map={};
  for(let snap of snaps){
    snap.forEach(d=>{
      let p=d.data(); if(p.deleted) return;
      let shri=String(p.shri||p.shriId||d.id||'').trim().toUpperCase(); if(!shri) return;
      let fullName=String(p.patientName||p.name||'').trim();
      let contact=String(p.contact||p.contactNo||p.phone||p.mobile||'').trim();
      let ed=edited[shri]||edited[d.id];
      if(ed){ if(ed.name) fullName=String(ed.name).trim(); if(ed.contact) contact=String(ed.contact).trim(); }
      if(!map[shri]) map[shri]={name:'',contact:''};
      if(fullName) map[shri].name=fullName; if(contact) map[shri].contact=contact;
    });
  }
  masterMap=map; masterMapLoadedAt=Date.now(); masterMapLoading=null;
  })();
  return masterMapLoading;
}
async function getFullPhotoSmart(ukey){
  let c=cleanKey(ukey);
  try{
    let snap=await getDoc(doc(db,"patient_photos",c+"_photo"));
    if(snap.exists()){
      let d=snap.data();
      if(d.full && d.full.length>100) return d.full;
      if(d.thumb && d.chunkCount===0) return d.thumb;
    }
    let snap2=await getDocs(collection(db,"patient_photos",c+"_photo","chunks"));
    if(!snap2.empty){
      let arr=[]; snap2.forEach(d=>arr.push(d.data())); arr.sort((a,b)=>a.index-b.index);
      let full=arr.map(a=>a.data).join(''); if(full) return full;
    }
    if(snap.exists() && snap.data().thumb) return snap.data().thumb;
  }catch(e){}
  return null;
}
window.openPhoto=async(ukey,shri,name)=>{
  currentPhotoKey=ukey;
  document.getElementById('photoName').textContent=name+' - '+shri;
  document.getElementById('photoView').src = photoCache[ukey] || '';
  document.getElementById('photoModal').classList.add('show');
  let f=await getFullPhotoSmart(ukey);
  if(f){ photoCache[ukey]=f; if(currentPhotoKey===ukey) document.getElementById('photoView').src=f; }
}
window.closePhoto=()=>{ document.getElementById('photoModal').classList.remove('show'); }
/* SPEED: debounce search so typing does not re-render every keystroke */
let searchTimer=null;
window.onSearch=()=>{ clearTimeout(searchTimer); searchTimer=setTimeout(()=>{currentPage=1;applyFilter();},120); };
window.changePageSize=()=>{pageSize=parseInt(document.getElementById('pageSize').value);currentPage=1;renderAll();};
window.applyFilter=()=>{
  let q=document.getElementById('search').value.trim().toLowerCase();
  let scheme=document.getElementById('fScheme').value;
  let tf=document.getElementById('filterTime').value;
  let bf=document.getElementById('filterBlock').value;
  filtered=allPatients.filter(p=>{
    if(p.scheme!==scheme)return false;
    if(tf&&normalizeTime(p.time)!==normalizeTime(tf))return false;
    if(bf&&p.block!==bf)return false;
    if(q && !((p.name||'').toLowerCase().includes(q) || (p.shri||'').toLowerCase().includes(q) || (p.contact||'').toLowerCase().includes(q)))return false;
    return true;
  });
  renderAll();
};
/* SPEED: photos only for visible page, max 4 at a time, after paint */
async function loadPhotoCache(){
  let start=(currentPage-1)*pageSize;
  let pageData=filtered.slice(start,start+pageSize);
  let toLoad=pageData.filter(p=>!photoCache[p.key] && !p._photoLoading);
  if(toLoad.length===0) return;
  for(let i=0;i<toLoad.length;i+=4){
    await Promise.all(toLoad.slice(i,i+4).map(async p=>{
      p._photoLoading=true;
      let full=await getFullPhotoSmart(p.key);
      if(full){
        photoCache[p.key]=full;
        document.querySelectorAll(`.pCardAvatar[data-ukey="${CSS.escape(p.key)}"]`).forEach(el=>{ if(!el.querySelector('img')) el.innerHTML=`<img src="${full}">`; else el.querySelector('img').src=full; });
        document.querySelectorAll(`.tAvatar[data-ukey="${CSS.escape(p.key)}"]`).forEach(el=>{ if(!el.querySelector('img')) el.innerHTML=`<img src="${full}">`; else el.querySelector('img').src=full; });
      }
      p._photoLoading=false;
    }));
  }
}
window.renderAll=()=>{
 let totalPages=Math.max(1,Math.ceil(filtered.length/pageSize));
 if(currentPage>totalPages) currentPage=totalPages;
 let start=(currentPage-1)*pageSize;
 let data=filtered.slice(start,start+pageSize);
 let gridHtml='';
 data.forEach((p)=>{
   let ukey=p.key;
   let photo=photoCache[ukey];
   let avatar=photo?`<img src="${photo}">`:`${getInitial(p.name)}`;
   gridHtml+=`<div class="pCard"><div class="pCardBody"><div class="pCardAvatar" data-ukey="${ukey}" onclick="openPhoto('${ukey.replace(/'/g,"\\'")}','${(p.shri||'').replace(/'/g,"\\'")}','${(p.name||'').replace(/'/g,"\\'")}')">${avatar}</div><div class="pCardName">${p.name||'Unknown'}</div><div class="pCardSub">${p.scheme||''} • ${p.time||''} • ${p.block||''}</div><div class="pCardMeta"><div class="pCardRow2"><span>CONTACT NUMBER</span><b>${p.contact||'-'}</b></div><div class="pCardRow2"><span>SHRI ID</span><b>${p.shri||'-'}</b></div><div class="pCardRow2"><span>TIME</span><b>${p.time||'-'}</b></div><div class="pCardRow2"><span>BLOCK</span><b>${p.block||'-'}</b></div></div></div></div>`;
 });
 if(data.length===0) gridHtml='<div style="grid-column:1/-1;text-align:center;padding:40px;background:#fff;border-radius:16px;border:1px solid #e2e8f0">No patients in list for this date</div>';
 document.getElementById('patientGrid').innerHTML=gridHtml;
 let html='<tr><th>SL No</th><th>Patient Name</th><th>Contact Number</th><th>SHRI ID</th><th>Photo</th><th>Time</th><th>Block</th><th>Scheme</th></tr>';
 data.forEach((p,idx)=>{
   let ukey=p.key;
   let photo=photoCache[ukey];
   let thumb=photo?`<img src="${photo}">`:`${getInitial(p.name)}`;
   let slNo=start+idx+1;
   html+=`<tr><td><div class="sl">${slNo}</div></td><td><b>${p.name||'-'}</b></td><td><span class="pmjayTable">${p.contact||'-'}</span></td><td><span class="shriTable">${p.shri||'-'}</span></td><td><div class="tAvatar" data-ukey="${ukey}" onclick="openPhoto('${ukey.replace(/'/g,"\\'")}','${(p.shri||'').replace(/'/g,"\\'")}','${(p.name||'').replace(/'/g,"\\'")}')">${thumb}</div></td><td>${p.time||'-'}</td><td>${p.block||'-'}</td><td>${p.scheme||'-'}</td></tr>`;
 });
 if(data.length===0) html+='<tr><td colspan="8" style="text-align:center;padding:20px">No patients in list for this date</td></tr>';
 document.getElementById('tbl').innerHTML=html;
 document.getElementById('info').textContent=filtered.length+' patients • Page '+currentPage+' of '+totalPages+' • Date: '+fmtDisp(document.getElementById('fDate').value);
 let pInfo=document.getElementById('pageInfoTop');let numsEl=document.getElementById('pageNumsTop');if(pInfo) pInfo.textContent='Page '+currentPage+' of '+totalPages;if(numsEl){let nums='';for(let i=1;i<=Math.min(totalPages,8);i++){nums+=`<button class="pBtn" style="${i===currentPage?'background:#0f172a;color:#fff':''}" onclick="goPage(${i})">${i}</button>`;}numsEl.innerHTML=nums;}
 /* SPEED: paint list first, photos after */
 requestAnimationFrame(()=>setTimeout(loadPhotoCache,80));
};
window.prevPage=()=>{if(currentPage>1){currentPage--;renderAll();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});}};
window.nextPage=()=>{let totalPages=Math.ceil(filtered.length/pageSize);if(currentPage<totalPages){currentPage++;renderAll();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});}};
window.goPage=(n)=>{currentPage=n;renderAll();};
/* SPEED: PMJAY + CMHT daily lists in parallel, render immediately */
async function loadToday(){
 document.getElementById('info').textContent='Loading...';
 let date=document.getElementById('fDate').value;
 let [_, snaps]=await Promise.all([buildMasterMap(), Promise.all(['PMJAY','CMHT'].map(s=>getDoc(doc(db,"daily_dialysis_lists",date+'_'+s))))]);
 let list=[];
 snaps.forEach((snap,si)=>{
   let scheme=['PMJAY','CMHT'][si];
   if(snap.exists()){
     let ps=snap.data().patients||[];
     ps.forEach(p=>{
       if((p.patientStatus||'ENHANCEMENT')==='DISCHARGE')return;
       let shri=String(p.shri||'').trim().toUpperCase();
       let key=shri||String(p.pmjayCmhtId||p.name||'').trim();
       let m=masterMap[shri];
       let fullName=(m && m.name) ? m.name : String(p.name||'').trim();
       let contact=(m && m.contact) ? m.contact : '';
       list.push({key:key,name:fullName,shri:shri,contact:contact,time:p.time||'',block:p.block||'',prev:p.prev||'',scheme:scheme,sl:p.sl||0});
     });
   }
 });
 list.sort((a,b)=> (a.scheme||'').localeCompare(b.scheme||'') || (a.sl||0)-(b.sl||0));
 list.forEach((p,i)=>p.sl=i+1);
 allPatients=list; currentPage=1; applyFilter();
}
loadToday();
