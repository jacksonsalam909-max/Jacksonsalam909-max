body{background:#f1f5f9;display:flex;min-height:100vh;overflow-x:hidden}
.whiteBar{position:fixed;left:0;top:0;bottom:0;width:270px;min-width:270px;height:100vh;background:#0f172a;color:#94a3b8;display:flex;flex-direction:column;justify-content:space-between;z-index:90;overflow:hidden;transition:width .32s ease, transform .32s ease}

.sTitle b{color:#0f172a;font-size:16px;font-weight:900}

.ml{overflow:hidden;text-overflow:ellipsis}

#tbl tbody tr{transition:background 0.18s ease}

.pager{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#f8fafc;border-top:1px solid #e2e8f0;flex-wrap:wrap;gap:8px}
.pagerGrid{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#fff;border:1.5px solid #e2e8f0;border-radius:16px;margin-top:16px;flex-wrap:wrap;gap:8px}
.pBtn{padding:8px 14px;border-radius:8px;border:1.5px solid #cbd5e1;background:#fff;font-weight:700;cursor:pointer;font-size:13px;transition:all .2s}

#mobOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:89}

#remarkModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10001;align-items:center;justify-content:center;padding:20px}
#remarkModal.show{display:flex}
@media(max-width:1100px){.patientGrid{grid-template-columns:repeat(3,1fr)}.whiteBar.folded ~ .mainWrap .patientGrid{grid-template-columns:repeat(4,1fr)}}

</style>

<script>
function toggleWhiteBar(){if(window.innerWidth<=900){document.getElementById('whiteBar').classList.toggle('mOpen');document.getElementById('mobOverlay').classList.toggle('show');}else{let bar=document.getElementById('whiteBar');bar.classList.toggle('folded');localStorage.setItem('whiteBarFolded', bar.classList.contains('folded') ? 'true' : 'false');}}
function closeMob(){document.getElementById('whiteBar').classList.remove('mOpen');document.getElementById('mobOverlay').classList.remove('show');}
document.addEventListener('DOMContentLoaded',function(){let saved=localStorage.getItem('whiteBarFolded');if(saved==='true'&&window.innerWidth>900){document.getElementById('whiteBar').classList.add('folded');}document.getElementById('menuBtnTop').addEventListener('click',function(e){e.preventDefault();toggleWhiteBar();});});
let currentView='table';window.setView=(v)=>{currentView=v;document.getElementById('gridBtn').classList.toggle('active',v==='grid');document.getElementById('tableBtn').classList.toggle('active',v==='table');document.getElementById('patientGrid').classList.toggle('hidden',v!=='grid');document.getElementById('pagerGrid').classList.toggle('hidden',v!=='grid');document.getElementById('tableWrap').classList.toggle('hidden',v!=='table');renderAll();};

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app = initializeApp(firebaseConfig,"userlistTotal_"+Date.now());const db = getFirestore(app);
let allPatients=[],filtered=[],currentPage=1,pageSize=12,masterMap={};
function getTodayIST(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function fmtPrev(v){if(!v)return'-';let s=String(v).trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s)){let p=s.split('-');return `${p[2]}-${p[1]}-${p[0]}`;}return s;}
function normalizeTime(t){if(!t)return'';let s=String(t).toUpperCase().trim().replace(/\s+/g,' ').replace(/\./g,'');let m=s.match(/(\d{1,2})(?::(\d{1,2}))?\s*([AP]M)?/);if(!m)return s;let h=parseInt(m[1]);let min=m[2]?m[2].padStart(2,'0'):'00';let ap=m[3]||'';if(!ap){if(s.includes('AM'))ap='AM';else if(s.includes('PM'))ap='PM';}return ap?`${h}:${min} ${ap}`:`${h}:${min}`;}
function shiftFromTime(t){let n=normalizeTime(t);if(n.includes('7:')||n.includes('8:')||n.includes('9:')||n.includes('10:')||n.includes('11:'))return'Morning';if(n.includes('12:')||n.includes('1:')||n.includes('2:')||n.includes('3:'))return'Afternoon';if(n.includes('4:')||n.includes('5:')||n.includes('6:'))return'Evening';return'Night';}
function getInitial(name){return (name||'P').trim().charAt(0).toUpperCase();}
let urlParams=new URLSearchParams(window.location.search);
document.getElementById('fDate').value=urlParams.get('date')&&urlParams.get('force')==='1'?urlParams.get('date'):getTodayIST();
if(urlParams.get('scheme'))document.getElementById('fType').value=urlParams.get('scheme');
async function buildMasterMap(){masterMap={};try{let snap=await getDocs(collection(db,"patients"));snap.forEach(d=>{let p=d.data();if(p.deleted)return;let shri=String(p.shriId||p.shri||d.id||'').trim().toUpperCase();let pmjay=String(p.pmjayId||p.pmjay||'').trim().toUpperCase();let name=String(p.patientName||p.name||'').trim().toUpperCase();let photo=p.photo||p.photoUrl||p.image||'';if(!shri)return;masterMap[shri]={shri,pmjayId:pmjay,pmjayName:name,cmhtId:'',cmhtName:'',photo};});}catch(e){}try{let snap2=await getDocs(collection(db,"cmht_patients"));snap2.forEach(d=>{let p=d.data();if(p.deleted)return;let shri=String(p.shriId||p.shri||d.id||'').trim().toUpperCase();let cmht=String(p.cmhtId||p.cmht||p.pmjayId||p.pmjay||'').trim().toUpperCase();let name=String(p.patientName||p.name||'').trim().toUpperCase();let photo=p.photo||p.photoUrl||p.image||'';if(!shri)return;if(!masterMap[shri])masterMap[shri]={shri,pmjayId:'',pmjayName:'',cmhtId:'',cmhtName:'',photo};masterMap[shri].cmhtId=cmht;masterMap[shri].cmhtName=name;if(photo)masterMap[shri].photo=photo;});}catch(e){}return masterMap;}
function enrichPatient(p){let k=String(p.shri||'').trim().toUpperCase();if(!k)return p;let m=masterMap[k];if(!m)return p;let scheme=document.getElementById('fType').value;if(scheme==='PMJAY'){if(m.pmjayName)p.name=m.pmjayName;if(m.pmjayId)p.pmjayCmhtId=m.pmjayId;}else{if(m.cmhtName)p.name=m.cmhtName;if(m.cmhtId)p.pmjayCmhtId=m.cmhtId;else if(m.pmjayId)p.pmjayCmhtId=m.pmjayId;}if(m.photo)p.photo=m.photo;if(!p.patientStatus)p.patientStatus='ENHANCEMENT';return p;}
async function onDateChange(){let date=document.getElementById('fDate').value;let scheme=document.getElementById('fType').value;document.getElementById('topStatus').innerText='LOADING...';try{let snap=await getDoc(doc(db,"daily_dialysis_lists",date+'_'+scheme));let patients=snap.exists()?(snap.data().patients||[]):[];patients=patients.map((p,i)=>{let e=enrichPatient({...p,sl:i+1});e.sl=i+1;if(!e.patientStatus)e.patientStatus='ENHANCEMENT';if(!e.remark)e.remark='N/A';if(!e.remarkView)e.remarkView='N/A';return e;});if(scheme==='PMJAY')patients=patients.filter(p=>(p.patientStatus||'ENHANCEMENT')!=='DISCHARGE');allPatients=patients;document.getElementById('topStatus').innerText=patients.length+' PATIENTS';applyFilter();}catch(e){allPatients=[];applyFilter();}}
window.onSearch=()=>{currentPage=1;applyFilter();};
window.changePageSize=()=>{pageSize=parseInt(document.getElementById('pageSize').value);currentPage=1;renderAll();};
window.applyFilter=()=>{let q=document.getElementById('search').value.trim().toLowerCase();let timeF=document.getElementById('filterTime').value;let timeN=normalizeTime(timeF);let blockF=document.getElementById('filterBlock').value;filtered=allPatients.filter(p=>{if(q){let n=String(p.name||'').toLowerCase(),s=String(p.shri||'').toLowerCase(),id=String(p.pmjayCmhtId||'').toLowerCase();if(!n.includes(q)&&!s.includes(q)&&!id.includes(q))return false;}if(timeF&&normalizeTime(p.time)!==timeN)return false;if(blockF&&String(p.block||'').toUpperCase()!==blockF)return false;return true;});renderAll();};
window.showRemark=(idx)=>{let p=allPatients[idx];if(!p)return;let r=String(p.remark||'').trim();document.getElementById('remarkTitle').innerText='REMARK: '+(p.name||'');document.getElementById('remarkText').innerText=(r&&r.toUpperCase()!=='N/A')?r:'N/A - No remark';document.getElementById('remarkModal').classList.add('show');};
window.closeRemarkModal=()=>document.getElementById('remarkModal').classList.remove('show');
window.handleRemarkView=(idx,sel)=>{let v=sel.value;let p=allPatients[idx];if(!p)return;p.remarkView=v;if(v==='SHOW REMARK')showRemark(idx);};
window.renderAll=()=>{let totalPages=Math.max(1,Math.ceil(filtered.length/pageSize));if(currentPage>totalPages)currentPage=totalPages;let start=(currentPage-1)*pageSize;let data=filtered.slice(start,start+pageSize);let gridHtml='';data.forEach((p)=>{let realIdx=allPatients.indexOf(p);let rv=p.remarkView||'N/A';let avatar=p.photo?`<img src="${p.photo}">`:getInitial(p.name);gridHtml+=`<div class="pCard"><div class="pCardBody"><div class="pCardAvatar">${avatar}</div><div class="pCardName">${p.name||'Unknown'}</div><div class="pCardSub">${p.pmjayCmhtId||'NO ID'} • SHRI ${p.shri||'-'}</div><div class="pCardMeta"><div class="pCardRow2"><span>PMJAY ID</span><b>${p.pmjayCmhtId||'-'}</b></div><div class="pCardRow2"><span>SHRI ID</span><b>${p.shri||'-'}</b></div><div class="pCardRow2"><span>Block</span><b>${p.block||'Main'}</b></div><div class="pCardRow2"><span>Shift / Time</span><b>${shiftFromTime(p.time)} / ${normalizeTime(p.time)||'-'}</b></div><div class="pCardRow2"><span>Last Dialysis</span><b>${fmtPrev(p.prev||p.lastDialysis||'')}</b></div></div><div class="pCardActions"><select class="remarkSelect" onchange="handleRemarkView(${realIdx},this)"><option value="N/A" ${rv==='N/A'?'selected':''}>N/A</option><option value="SHOW REMARK" ${rv==='SHOW REMARK'?'selected':''}>SHOW REMARK</option></select></div></div></div>`;});if(data.length===0)gridHtml='<div style="grid-column:1/-1;text-align:center;padding:40px;background:#fff;border-radius:16px;border:1px solid #e2e8f0">No patients</div>';document.getElementById('patientGrid').innerHTML=gridHtml;let html='<tr><th>SL No</th><th>Patient Name</th><th>PMJAY ID</th><th>SHRI ID</th><th>Block</th><th>Shift</th><th>Time</th><th>Photo</th><th>Last Dialysis</th><th>Remarks</th></tr>';data.forEach((p)=>{let realIdx=allPatients.indexOf(p);let rv=p.remarkView||'N/A';let slNo=start+data.indexOf(p)+1;let thumb=p.photo?`<img src="${p.photo}">`:getInitial(p.name);html+=`<tr><td><div class="sl">${slNo}</div></td><td><b>${p.name||'-'}</b></td><td><span class="pmjayTable">${p.pmjayCmhtId||'-'}</span></td><td><span class="shriTable">${p.shri||'-'}</span></td><td>${p.block||'Main'}</td><td>${shiftFromTime(p.time)}</td><td>${normalizeTime(p.time)||'-'}</td><td><div class="tAvatar">${thumb}</div></td><td>${fmtPrev(p.prev||p.lastDialysis||'')}</td><td><select class="remarkSelect" style="width:150px" onchange="handleRemarkView(${realIdx},this)"><option value="N/A" ${rv==='N/A'?'selected':''}>N/A</option><option value="SHOW REMARK" ${rv==='SHOW REMARK'?'selected':''}>SHOW REMARK</option></select></td></tr>`;});if(data.length===0)html+='<tr><td colspan="10" style="text-align:center;padding:20px">No patients</td></tr>';document.getElementById('tbl').innerHTML=html;document.getElementById('info').textContent=filtered.length+' patients • Page '+currentPage+' of '+totalPages;['','Grid'].forEach(suffix=>{let pInfo=document.getElementById('pageInfo'+suffix);let numsEl=document.getElementById('pageNums'+suffix);if(pInfo)pInfo.textContent='Page '+currentPage+' of '+totalPages;if(numsEl){let nums='';for(let i=1;i<=Math.min(totalPages,8);i++){nums+=`<button class="pBtn" style="${i===currentPage?'background:#0f172a;color:#fff':''}" onclick="goPage(${i})">${i}</button>`;}numsEl.innerHTML=nums;}});};
window.prevPage=()=>{if(currentPage>1){currentPage--;renderAll();}};
window.nextPage=()=>{let totalPages=Math.ceil(filtered.length/pageSize);if(currentPage<totalPages){currentPage++;renderAll();}};
window.goPage=(n)=>{currentPage=n;renderAll();};
document.getElementById('fType').addEventListener('change',onDateChange);
document.getElementById('fDate').addEventListener('change',onDateChange);
document.getElementById('filterTime').addEventListener('change',applyFilter);
document.getElementById('filterBlock').addEventListener('change',applyFilter);
window.addEventListener('load',async()=>{let scheme=urlParams.get('scheme')||document.getElementById('fType').value;document.querySelectorAll('.sMenu a').forEach(a=>a.classList.remove('active'));if(scheme==='CMHT'){document.getElementById('cmhtLink')?.classList.add('active');}else{document.getElementById('pmjayLink')?.classList.add('active');}await buildMasterMap();setTimeout(onDateChange,200);});
</script>
<script type="module" src="maintenance.js"></script>
</body>
</html>
