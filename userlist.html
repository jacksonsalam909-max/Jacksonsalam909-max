<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Daily Dialysis Patient List</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui}
body{background:#f1f5f9;color:#1e293b;font-size:14px}
.topbar{background:#00695c;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
.topbar b{font-size:17px;font-weight:800;white-space:nowrap}
.hamburger{font-size:20px;line-height:1}
.sub{padding:10px 16px;font-size:12.5px;color:#334155;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;gap:6px;align-items:flex-start}
.sub i{color:#00695c;font-style:normal}
.wrap{padding:12px;max-width:1280px;margin:0 auto}
.filters{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px;display:flex;flex-wrap:wrap;gap:12px 14px}
.fGroup{flex:1 1 160px;min-width:150px;display:flex;flex-direction:column;gap:5px}
.fGroup label{font-size:11.5px;font-weight:700;color:#475569}
.fGroup label span{color:#ef4444}
.fInput,.fSelect{height:38px;padding:0 10px;border:1px solid #cbd5e1;border-radius:6px;font-size:13.5px;font-weight:600;background:#fff;outline:none;width:100%}
.fInput:focus,.fSelect:focus{border-color:#00695c}
.searchRow{flex:1 1 260px;min-width:220px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;margin-top:12px;overflow:hidden}
.tableWrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:1050px}
th{background:#f8fafc;padding:12px 10px;font-size:11.5px;font-weight:800;color:#334155;text-align:left;text-transform:uppercase;border-bottom:1px solid #e2e8f0;white-space:nowrap}
td{padding:12px 10px;font-size:13.5px;font-weight:600;border-bottom:1px solid #f1f5f9;vertical-align:middle;white-space:nowrap}
td.nameCol{white-space:normal;word-break:break-word;min-width:180px;max-width:260px;font-weight:700;text-transform:uppercase}
.photo{width:38px;height:38px;border-radius:50%;background:#e0f2f1;color:#00695c;display:grid;place-items:center;font-size:12px;font-weight:900;overflow:hidden;flex-shrink:0}
.photo img{width:100%;height:100%;object-fit:cover}
.pmjay{color:#334155}
.shri{color:#334155}
.remarkSelect{border:none;background:transparent;font-size:13.5px;font-weight:700;color:#334155;cursor:pointer;outline:none;appearance:none;-webkit-appearance:none}
.remarkSelect:hover{color:#00695c}
.bottomBar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;flex-wrap:wrap;font-size:13px;font-weight:600;color:#475569}
.pager{display:flex;gap:8px;align-items:center}
.pBtn{padding:7px 12px;border-radius:6px;border:1px solid #e2e8f0;background:#fff;font-weight:700;font-size:12.5px;cursor:pointer}
.pBtn:disabled{opacity:.45;cursor:not-allowed}
.pdfBtn{background:#dc2626;color:#fff;border:0;padding:7px 12px;border-radius:6px;font-weight:800;font-size:12.5px;cursor:pointer}
.empty{padding:22px;text-align:center;color:#64748b;font-weight:700}
@media(max-width:700px){.fGroup{flex:1 1 45%}.topbar b{font-size:15px}}
@media print{body{background:#fff}.topbar,.filters,.bottomBar .pager,.pdfBtn{display:none!important}.wrap{padding:0}.card{border:0}}
</style>
</head>
<body>
<div class="topbar"><span class="hamburger">☰</span><b>Daily Dialysis Patient List</b></div>
<div class="sub"><i>ℹ️</i><span>Public read-only list - no login required. Only administrators can edit or delete dialysis records.</span></div>
<div class="wrap">
<div class="filters">
<div class="fGroup"><label>❤️ Health Scheme</label><select id="fType" class="fSelect"><option value="PMJAY" selected>PMJAY</option><option value="CMHT">CMHT</option></select></div>
<div class="fGroup"><label>📅 Filter by date</label><input type="date" id="fDate" class="fInput"></div>
<div class="fGroup searchRow"><label>🔍 Search patient or shri id</label><input type="search" id="searchName" class="fInput" placeholder="Search name, PMJAY ID, SHRI ID, or site"></div>
<div class="fGroup"><label>⏰ Filter by timing</label><select id="filterTime" class="fSelect"><option value="">All timings</option><option value="7:00 AM">7 AM</option><option value="12:00 PM">12 PM</option><option value="5:00 PM">5 PM</option><option value="9:00 PM">9 PM</option></select></div>
<div class="fGroup"><label>🌞 Filter by shift</label><select id="filterShift" class="fSelect"><option value="">All shifts</option><option value="Morning">Morning</option><option value="Afternoon">Afternoon</option><option value="Evening">Evening</option><option value="Night">Night</option></select></div>
<div class="fGroup"><label>🏥 Filter by block</label><select id="filterBlock" class="fSelect"><option value="">All blocks</option><option value="MAIN">Main</option><option value="ITOCHA">Itocha</option></select></div>
</div>
<div class="card">
<div class="tableWrap"><table><thead><tr><th style="width:55px">SL NO</th><th>PATIENT NAME</th><th style="width:70px">PHOTO</th><th>PMJAY ID</th><th>SHRI ID</th><th>BLOCK</th><th>SHIFT</th><th>TIME</th><th>LAST DIALYSIS</th><th>REMARKS</th></tr></thead><tbody id="tbody"></tbody></table></div>
<div class="bottomBar"><span id="showing">Showing 0 of 0 records</span><div class="pager"><button class="pdfBtn" onclick="window.print()">📄 Export to PDF</button><button class="pBtn" id="prevBtn" onclick="changePage(-1)">Previous</button><button class="pBtn" id="nextBtn" onclick="changePage(1)">Next</button></div></div>
</div>
</div>
<div id="remarkModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;align-items:center;justify-content:center"><div style="background:#fff;padding:18px;border-radius:12px;width:90%;max-width:420px;display:flex;flex-direction:column;gap:10px"><h3 id="remarkTitle" style="font-size:15px;font-weight:900">REMARK</h3><div id="remarkText" style="font-size:14px;font-weight:600;line-height:1.5;white-space:pre-wrap;word-break:break-word"></div><div style="display:flex;justify-content:flex-end"><button onclick="closeRemarkModal()" style="padding:10px 14px;border-radius:8px;border:0;background:#00695c;color:#fff;font-weight:800;cursor:pointer">Close</button></div></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, getDocs, collection } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app=initializeApp(firebaseConfig,"userlistVideo_"+Math.random());const db=getFirestore(app);window._fb={db,doc,setDoc,getDoc,getDocs,collection};
</script>
<script>
let allPatients=[],filteredPatients=[],currentPage=1,pageSize=20,masterMap={};
function getTodayIST(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function fmtDate(iso){if(!iso)return'-';let p=String(iso).split('-');if(p.length!==3)return iso;return `${p[2]}-${p[1]}-${p[0]}`;}
function fmtPrev(v){if(!v)return'-';let s=String(v).trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s))return fmtDate(s);return s;}
function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function normalizeTime(t){if(!t)return'';let s=String(t).toUpperCase().trim().replace(/\s+/g,' ').replace(/\./g,'');let m=s.match(/(\d{1,2})(?::(\d{1,2}))?\s*([AP]M)?/);if(!m)return s;let h=parseInt(m[1]);let min=m[2]?m[2].padStart(2,'0'):'00';let ap=m[3]||'';if(!ap){if(s.includes('AM'))ap='AM';else if(s.includes('PM'))ap='PM';}return ap?`${h}:${min} ${ap}`:`${h}:${min}`;}
function shiftFromTime(t){let n=normalizeTime(t);if(n.includes('7:')||n.includes('8:')||n.includes('9:')||n.includes('10:')||n.includes('11:'))return'Morning';if(n.includes('12:')||n.includes('1:')||n.includes('2:')||n.includes('3:'))return'Afternoon';if(n.includes('4:')||n.includes('5:')||n.includes('6:')||n.includes('7:'))return'Evening';if(n.includes('8:')||n.includes('9:'))return'Night';return'Morning';}
function shortTime(t){let n=normalizeTime(t);if(!n)return'-';return n.replace(':00','').replace(' ','').toLowerCase().replace('am','am').replace('pm','pm');}
function cap(s){s=String(s||'').toLowerCase();return s? s.charAt(0).toUpperCase()+s.slice(1):'-';}
let urlParams=new URLSearchParams(window.location.search);
document.getElementById('fDate').value=urlParams.get('date')&&urlParams.get('force')==='1'?urlParams.get('date'):getTodayIST();
if(urlParams.get('scheme'))document.getElementById('fType').value=urlParams.get('scheme');
async function buildMasterMap(){masterMap={};try{let snap=await window._fb.getDocs(window._fb.collection(window._fb.db,'patients'));snap.forEach(d=>{let p=d.data();if(p.deleted)return;let shri=String(p.shriId||p.shri||d.id||'').trim().toUpperCase();let pmjay=String(p.pmjayId||p.pmjay||'').trim().toUpperCase();let name=String(p.patientName||p.name||'').trim().toUpperCase();let photo=p.photo||p.photoUrl||p.image||'';if(!shri)return;masterMap[shri]={shri,pmjayId:pmjay,pmjayName:name,cmhtId:'',cmhtName:'',photo};});}catch(e){}try{let snap2=await window._fb.getDocs(window._fb.collection(window._fb.db,'cmht_patients'));snap2.forEach(d=>{let p=d.data();if(p.deleted)return;let shri=String(p.shriId||p.shri||d.id||'').trim().toUpperCase();let cmht=String(p.cmhtId||p.cmht||p.pmjayId||p.pmjay||'').trim().toUpperCase();let name=String(p.patientName||p.name||'').trim().toUpperCase();let photo=p.photo||p.photoUrl||p.image||'';if(!shri)return;if(!masterMap[shri])masterMap[shri]={shri,pmjayId:'',pmjayName:'',cmhtId:'',cmhtName:'',photo};masterMap[shri].cmhtId=cmht;masterMap[shri].cmhtName=name;if(photo)masterMap[shri].photo=photo;});}catch(e){}return masterMap;}
function enrichPatient(p){let k=String(p.shri||'').trim().toUpperCase();if(!k)return p;let m=masterMap[k];if(!m)return p;let scheme=document.getElementById('fType').value;if(scheme==='PMJAY'){if(m.pmjayName)p.name=m.pmjayName;if(m.pmjayId)p.pmjayCmhtId=m.pmjayId;}else{if(m.cmhtName)p.name=m.cmhtName;if(m.cmhtId)p.pmjayCmhtId=m.cmhtId;else if(m.pmjayId)p.pmjayCmhtId=m.pmjayId;}if(m.photo)p.photo=m.photo;if(!p.patientStatus)p.patientStatus='ENHANCEMENT';return p;}
async function onDateChange(){let date=document.getElementById('fDate').value;let scheme=document.getElementById('fType').value;let docId=date+'_'+scheme;try{let snap=await window._fb.getDoc(window._fb.doc(window._fb.db,'daily_dialysis_lists',docId));let patients=snap.exists()?(snap.data().patients||[]):[];patients=patients.map((p,i)=>{let e=enrichPatient({...p,sl:i+1});e.sl=i+1;if(!e.patientStatus)e.patientStatus='ENHANCEMENT';if(!e.remark)e.remark='N/A';if(!e.remarkView)e.remarkView='N/A';return e;});if(scheme==='PMJAY')patients=patients.filter(p=>(p.patientStatus||'ENHANCEMENT')!=='DISCHARGE');allPatients=patients;filteredPatients=[...allPatients];currentPage=1;applyFilter();}catch(e){allPatients=[];filteredPatients=[];renderTable();}}
function applyFilter(){let search=document.getElementById('searchName').value.toLowerCase().trim();let timeF=document.getElementById('filterTime').value;let timeN=normalizeTime(timeF);let shiftF=document.getElementById('filterShift').value;let blockF=document.getElementById('filterBlock').value;filteredPatients=allPatients.filter(p=>{if(search){let n=String(p.name||'').toLowerCase(),s=String(p.shri||'').toLowerCase(),id=String(p.pmjayCmhtId||'').toLowerCase();if(!n.includes(search)&&!s.includes(search)&&!id.includes(search))return false;}if(timeF&&normalizeTime(p.time)!==timeN)return false;if(shiftF&&shiftFromTime(p.time)!==shiftF)return false;if(blockF&&String(p.block||'').toUpperCase()!==blockF)return false;return true;});currentPage=1;renderTable();}
function showRemark(idx){let p=allPatients[idx];if(!p)return;let r=String(p.remark||'').trim();document.getElementById('remarkTitle').innerText='REMARK: '+(p.name||'');document.getElementById('remarkText').innerText=(r&&r.toUpperCase()!=='N/A')?r:'N/A - No remark';document.getElementById('remarkModal').style.display='flex';}
function closeRemarkModal(){document.getElementById('remarkModal').style.display='none';}
function handleRemarkView(idx,sel){let v=sel.value;let p=allPatients[idx];if(!p)return;p.remarkView=v;if(v==='SHOW REMARK')showRemark(idx);}
function initials(name){let parts=String(name||'').trim().split(/\s+/);return ((parts[0]||'')[0]||'P')+((parts[1]||'')[0]||'');}
function renderTable(){let tbody=document.getElementById('tbody');tbody.innerHTML='';let totalPages=Math.max(1,Math.ceil(filteredPatients.length/pageSize));if(currentPage>totalPages)currentPage=totalPages;let start=(currentPage-1)*pageSize;let pagePatients=filteredPatients.slice(start,start+pageSize);pagePatients.forEach((p,idx)=>{let g=allPatients.indexOf(p);let tr=document.createElement('tr');let rv=p.remarkView||'N/A';let photoHtml=p.photo?`<div class="photo"><img src="${escHtml(p.photo)}"></div>`:`<div class="photo">${escHtml(initials(p.name))}</div>`;tr.innerHTML=`<td>${p.sl||start+idx+1}</td><td class="nameCol">${escHtml(p.name||'')}</td><td>${photoHtml}</td><td class="pmjay">${escHtml(p.pmjayCmhtId||'-')}</td><td class="shri">${escHtml(p.shri||'-')}</td><td>${cap(p.block||'Main')}</td><td>${shiftFromTime(p.time)}</td><td>${shortTime(p.time)}</td><td>${fmtPrev(p.prev||p.lastDialysis||p.lastDate||'')}</td><td><select class="remarkSelect" onchange="handleRemarkView(${g},this)"><option value="N/A" ${rv==='N/A'?'selected':''}>N/A</option><option value="SHOW REMARK" ${rv==='SHOW REMARK'?'selected':''}>SHOW REMARK</option></select></td>`;tbody.appendChild(tr);});if(pagePatients.length===0){tbody.innerHTML=`<tr><td colspan="10" class="empty">No patients found</td></tr>`;}let from=filteredPatients.length?start+1:0;let to=Math.min(start+pageSize,filteredPatients.length);document.getElementById('showing').innerText=`Showing ${from}-${to} of ${filteredPatients.length} records`;document.getElementById('prevBtn').disabled=currentPage<=1;document.getElementById('nextBtn').disabled=currentPage>=totalPages;}
function changePage(d){let totalPages=Math.max(1,Math.ceil(filteredPatients.length/pageSize));currentPage+=d;if(currentPage<1)currentPage=1;if(currentPage>totalPages)currentPage=totalPages;renderTable();}
document.getElementById('fType').addEventListener('change',onDateChange);
document.getElementById('fDate').addEventListener('change',onDateChange);
document.getElementById('searchName').addEventListener('input',applyFilter);
document.getElementById('filterTime').addEventListener('change',applyFilter);
document.getElementById('filterShift').addEventListener('change',applyFilter);
document.getElementById('filterBlock').addEventListener('change',applyFilter);
window.addEventListener('load',async()=>{await buildMasterMap();setTimeout(onDateChange,200);});
</script>
</body>
</html>
