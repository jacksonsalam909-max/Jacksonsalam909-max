<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Total Patients - SHIJA</title>
<script src="Patient.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui}
body{background:#f1f5f9;display:flex;min-height:100vh}
.whiteBar{position:fixed;left:0;top:0;bottom:0;width:270px;min-width:270px;height:100vh;background:#0f172a;color:#94a3b8;display:flex;flex-direction:column;justify-content:space-between;z-index:90;overflow:hidden;transition:width .32s ease}
.whiteBar.folded{width:72px!important;min-width:72px!important}
.mainWrap{flex:1;margin-left:270px;transition:margin-left .32s ease;min-height:100vh;display:flex;flex-direction:column;background:#eef2ff}
.whiteBar.folded ~ .mainWrap{margin-left:72px!important}
.sHead{padding:16px 12px;display:flex;align-items:center;gap:12px;background:#fff!important;border-bottom:1px solid #e2e8f0;flex-shrink:0;overflow:hidden}
.sLogo{width:42px;min-width:42px;height:42px;background:#fff;border-radius:12px;display:grid;place-items:center;overflow:hidden;padding:3px;border:1px solid #e2e8f0}
.sLogo img{width:100%;height:100%;object-fit:contain}
.sTitle b{color:#0f172a;font-size:16px;font-weight:900}
.sTitle span{font-size:9px;color:#64748b;text-transform:uppercase;font-weight:700}
.whiteBar.folded .sTitle{display:none}
.whiteBar.folded .sHead{justify-content:center;padding:14px 0}
.sMenu{flex:1;padding:8px 8px;overflow-y:auto}
.sMenu::-webkit-scrollbar{width:0}
.sMenu a{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:12px;text-decoration:none;color:#94a3b8;font-size:13px;font-weight:500;margin-bottom:2px;white-space:nowrap;overflow:hidden;transition:.2s}
.sMenu a:hover{background:#1e293b;color:#fff}
.sMenu a.active{background:#1e293b;color:#fff;font-weight:600;box-shadow:inset 0 0 0 1px #334155}
.mi{width:36px;min-width:36px;height:36px;display:grid;place-items:center;background:#1e293b;border-radius:10px;flex-shrink:0}
.mi svg{width:18px;height:18px;stroke:#94a3b8;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ml{overflow:hidden;text-overflow:ellipsis}
.whiteBar.folded .ml{display:none}
.whiteBar.folded .sMenu a{justify-content:center;padding:12px 0}
.sFoot{padding:12px;border-top:1px solid #1e293b;font-size:10px;color:#64748b;overflow:hidden;white-space:nowrap}
.whiteBar.folded .sFoot{display:none}
.top{height:68px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;color:#0f172a}
.menuBtnTop{width:40px;height:36px;background:transparent!important;border:none!important;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.menuBtnTop span{display:block;width:20px;height:2.5px;background:#0f172a;border-radius:2px}
.content{flex:1;padding:20px 24px;position:relative;background-color:#f8fafc;background-image: radial-gradient(circle at 1px 1px, rgba(37,99,235,0.08) 1px, transparent 0);background-size:22px 22px}
.pageHead{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.pageHead h1{font-size:26px;font-weight:900;color:#0f172a}
.pageHead p{color:#64748b;font-size:13px;font-weight:600;margin-top:4px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#fff;border:1.5px solid #e2e8f0;padding:12px;border-radius:16px}
.controls input{flex:1;min-width:180px;padding:11px 14px;border-radius:10px;border:1.5px solid #cbd5e1;font-size:13px;outline:0;background:#f8fafc}
.viewToggle{display:flex;background:#f1f5f9;border-radius:10px;padding:3px;border:1px solid #e2e8f0}
.vBtn{width:42px;height:36px;border-radius:8px;border:0;background:transparent;font-weight:700;font-size:18px;cursor:pointer;display:grid;place-items:center}
.vBtn.active{background:#0f172a;color:#fff}
.pSelect{padding:10px;border-radius:8px;border:1.5px solid #cbd5e1;font-weight:700;background:#fff}
.dateFilter{display:flex;gap:8px;align-items:center;background:#fff;border:1.5px solid #e2e8f0;padding:8px 12px;border-radius:10px}
.dateFilter input{padding:8px 10px;border:1.5px solid #cbd5e1;border-radius:8px;font-weight:700;font-size:13px}
.patientGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.pCard{border-radius:14px;overflow:hidden;background:#fff;border:1px solid #e2e8f0;box-shadow:0 2px 10px #00000006;transition:.22s}
.pCard.discharged{border:1.5px solid #ef4444 !important;background:#fef2f2 !important}
.pCardTop{height:52px;padding:10px 12px;display:flex;align-items:center;color:#fff}
.pCardAvatar{width:30px;height:30px;background:rgba(255,255,255,.92);border-radius:8px;display:grid;place-items:center;font-weight:900;color:#0f172a;font-size:12px}
.pCardBody{padding:10px 12px}
.pCardName{font-weight:800;font-size:13px;color:#0f172a;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shri{background:#2563eb;color:#fff;padding:3px 8px;border-radius:20px;font-weight:800;font-size:9.5px;display:inline-flex;margin-top:4px}
.pmjayBlue{background:#f1f5f9;color:#64748b;border:1px solid #e2e8f0;padding:3px 8px;border-radius:20px;font-weight:700;font-size:9.5px}
.pCardRow{display:flex;justify-content:space-between;margin-top:4px;font-size:11px}
.pCardRow span{color:#64748b;font-weight:600;font-size:10px}
.pCardRow b{color:#0f172a;font-weight:700;font-size:11px}
.pCardActions{display:flex;gap:8px;margin-top:8px}
.btnEdit{flex:1;padding:7px 10px;border-radius:7px;border:0;background:#facc15;font-weight:800;font-size:11px;cursor:pointer}
.btnDel{flex:1;padding:7px 10px;border-radius:7px;border:0;background:#ef4444;color:#fff;font-weight:700;font-size:11px;cursor:pointer}
.gc1{background:linear-gradient(135deg,#C850C0,#4158D0)} .gc2{background:linear-gradient(135deg,#FF5E3A,#FF2A68)} .gc3{background:linear-gradient(135deg,#38BDF8,#2563EB)} .gc4{background:linear-gradient(135deg,#6366F1,#4F46E5)} .gc5{background:linear-gradient(135deg,#22D3EE,#06B6D4)} .gc6{background:linear-gradient(135deg,#FBBF24,#F97316)} .gc7{background:linear-gradient(135deg,#E879F9,#A855F7)} .gc8{background:linear-gradient(135deg,#34D399,#059669)}
.tableWrap{background:#fff;border:1.5px solid #e2e8f0;border-radius:16px;overflow:hidden;margin-top:16px}
table{width:100%;border-collapse:collapse;min-width:900px}
th{padding:14px 12px;font-size:11px;color:#64748b;background:#f8fafc;text-align:left;text-transform:uppercase;white-space:nowrap}
td{padding:14px 12px;font-size:13px;border-bottom:1px solid #f1f5f9;white-space:nowrap}
tr.discharged-row{background:#fef2f2 !important}
.hidden{display:none!important}
.addBtn{background:#2563eb;color:#fff;padding:10px 18px;border-radius:10px;border:0;font-weight:800;font-size:13px;text-decoration:none;display:inline-flex;gap:6px}
</style>
</head>
<body>
<div class="whiteBar" id="whiteBar">
<div style="display:flex;flex-direction:column;height:100%;overflow:hidden">
<div class="sHead"><div class="sLogo"><img src="logoc.png" onerror="this.style.display='none'"></div><div class="sTitle"><b>SHIJA</b><span>DIALYSIS CARE</span></div></div>
<div class="sMenu" id="sMenu">
<a href="index.html"><span class="mi"><svg viewBox="0 0 24 24"><path d="M3 9L12 2l9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span><span class="ml">HOME</span></a>
<a href="total.html" class="active"><span class="mi"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></span><span class="ml">TOTAL PATIENT</span></a>
<a href="discharge.html"><span class="mi"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></svg></span><span class="ml">DISCHARGE PATIENT</span></a>
</div>
</div>
<div class="sFoot">System Online • SHIJA</div>
</div>
<div class="mainWrap">
<div class="top"><div class="logo"><button type="button" class="menuBtnTop" id="menuBtnTop"><span></span><span></span><span></span></button> SHIJA Dialysis</div><span style="font-weight:800;color:#0f172a">Total Patients</span></div>
<div class="content">
<div class="pageHead"><div><h1>PMJAY Total Patients</h1><p id="info">Loading...</p></div>
<div style="display:flex;gap:8px;align-items:center">
<div class="dateFilter"><span style="font-size:11px;font-weight:800;color:#64748b">DATE:</span><input type="date" id="dischargeDateFilter"></div>
<a href="add.html" class="addBtn">+ Add</a>
</div>
</div>
<div class="controls">
<input id="search" placeholder="Search name, SHRI ID..." oninput="onSearch()">
<div class="viewToggle"><button class="vBtn" id="gridBtn" onclick="setView('grid')">⊞</button><button class="vBtn active" id="tableBtn" onclick="setView('table')">☰</button></div>
<select id="pageSize" class="pSelect" onchange="changePageSize()"><option value="12">12 / page</option><option value="24">24 / page</option><option value="48">48 / page</option></select>
</div>
<div class="patientGrid hidden" id="patientGrid"></div>
<div class="tableWrap" id="tableWrap"><div style="overflow-x:auto"><table id="tbl"></table></div></div>
</div>
</div>
<script>
// SAME MENU BUTTON AS INDEX.HTML
function toggleWhiteBar(){ document.getElementById('whiteBar').classList.toggle('folded'); }
document.addEventListener('DOMContentLoaded',function(){
  document.getElementById('menuBtnTop').addEventListener('click',function(e){
    e.preventDefault();
    toggleWhiteBar();
  });
});
let currentView='table';
window.setView=(v)=>{currentView=v;document.getElementById('gridBtn').classList.toggle('active',v==='grid');document.getElementById('tableBtn').classList.toggle('active',v==='table');document.getElementById('patientGrid').classList.toggle('hidden',v!=='grid');document.getElementById('tableWrap').classList.toggle('hidden',v!=='table');renderAll();};
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app = initializeApp(firebaseConfig,"totalMain_"+Math.random());
const db = getFirestore(app);
let allPatients=[],filtered=[],currentPage=1,pageSize=12;
let dischargedMap = {};
let selectedDischargeDate = new Date().toISOString().slice(0,10);
let dateInput = document.getElementById('dischargeDateFilter');
if(dateInput){ dateInput.value = selectedDischargeDate; dateInput.addEventListener('change',()=>{ selectedDischargeDate = dateInput.value; renderAll(); }); }
function getGradient(i){ const g=['gc1','gc2','gc3','gc4','gc5','gc6','gc7','gc8']; return g[i%8]; }
function getInitial(name){ return (name||'P').trim().charAt(0).toUpperCase(); }
async function loadDischarges(){
  dischargedMap = {};
  try{ const snap = await getDocs(collection(db,"discharges")); snap.forEach(d=>{ let data=d.data(); let shri=String(data.shriId||data.shri||d.id).trim(); let date=String(data.dischargeDate||data.date||'').slice(0,10); if(shri){ if(!dischargedMap[shri]) dischargedMap[shri]=[]; dischargedMap[shri].push(date); } }); }catch(e){}
}
function isDischargedOnDate(shri, date){ if(!shri || !date) return false; let list = dischargedMap[shri]; if(!list) return false; return list.includes(date); }
window.onSearch=()=>{ let q=document.getElementById('search').value.toLowerCase(); filtered=allPatients.filter(p=>[p.name,p.shri].join(' ').toLowerCase().includes(q)); renderAll(); };
window.changePageSize=()=>{ pageSize=parseInt(document.getElementById('pageSize').value); renderAll(); };
window.renderAll=()=>{
 let data=filtered.length?filtered:allPatients;
 let gridHtml='';
 data.forEach((p,idx)=>{
   let grad=getGradient(idx);
   let discharged = isDischargedOnDate(p.shri, selectedDischargeDate);
   gridHtml+=`<div class="pCard ${discharged?'discharged':''}"><div class="pCardTop ${grad}"><div class="pCardAvatar">${getInitial(p.name)}</div></div><div class="pCardBody"><div class="pCardName">${p.name}${discharged?' <span style="color:#ef4444;font-weight:900">*</span>':''}</div><div class="pCardRow"><span>SHRI</span><b>${p.shri}</b></div></div></div>`;
 });
 document.getElementById('patientGrid').innerHTML=gridHtml;
 let html='<tr><th>SL</th><th>Patient</th><th>SHRI</th></tr>';
 data.forEach((p,idx)=>{
   let discharged = isDischargedOnDate(p.shri, selectedDischargeDate);
   html+=`<tr class="${discharged?'discharged-row':''}"><td>${idx+1}</td><td><b>${p.name}${discharged?' <span style="color:#ef4444;font-weight:900">*</span>':''}</b></td><td>${p.shri}</td></tr>`;
 });
 document.getElementById('tbl').innerHTML=html;
 let c=data.filter(p=>isDischargedOnDate(p.shri, selectedDischargeDate)).length;
 document.getElementById('info').textContent=data.length+' patients • '+c+' discharged on '+selectedDischargeDate;
};
async function init(){
 await loadDischarges();
 let map={};
 (typeof patientData!=='undefined'?patientData:[]).forEach(pd=>{ let shri=String(pd.shri||'').trim(); if(shri) map[shri]={name:String(pd.name||'').trim(), shri:shri}; });
 try{ const snap=await getDocs(collection(db,"patients")); snap.forEach(d=>{ let data=d.data(); if(data.deleted) return; let shri=String(data.shriId||data.shri||d.id).trim(); if(shri) map[shri]={name:String(data.patientName||data.name||'').trim(), shri:shri}; }); }catch(e){}
 allPatients=Object.values(map); filtered=[...allPatients]; renderAll();
 try{ onSnapshot(collection(db,"discharges"), async()=>{ await loadDischarges(); renderAll(); }); }catch(e){}
}
init();
</script>
</body>
</html>
