<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Total Patient - SHIJA</title>
<script src="Patient.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
body{background:#f6f7fb;display:flex;min-height:100vh}
.top{height:64px;background:#0a1931;color:#fff;display:flex;align-items:center;padding:0 16px;position:fixed;top:0;left:0;right:0;z-index:100;font-weight:900}
.side{position:fixed;left:0;top:64px;bottom:0;width:230px;background:#0a1931;padding:16px 10px;display:flex;flex-direction:column;gap:4px;z-index:90}
.side a{padding:12px 14px;border-radius:10px;text-decoration:none;color:#8ea0c0;font-weight:600;font-size:14px}
.side a.active{background:#13264d;color:#fff;border-left:3px solid #1a56db}
.content{flex:1;padding:20px;margin-left:230px;margin-top:64px}
.tableWrap{background:#fff;border:1.5px solid #e2e8f0;border-radius:14px;overflow:hidden}
table{width:100%;border-collapse:collapse;min-width:800px}
th{padding:12px;font-size:11px;color:#64748b;background:#f8fafc;text-align:left}
td{padding:12px;font-size:13px;border-bottom:1px solid #f1f5f9}
.sl{background:#f1f5f9;width:32px;height:26px;display:grid;place-items:center;border-radius:6px;font-weight:800;font-size:12px}
.shri{background:#1868db;color:#fff;padding:4px 10px;border-radius:6px;font-weight:700;font-size:12px}
</style>
</head>
<body>
<div class="top">SHIJA Dialysis Management</div>
<div class="side">
<a href="index.html">Home</a>
<a href="total.html" class="active">Total Patient</a>
<a href="daily.html">Daily Dialysis</a>
<a href="discharge.html">Discharge Patient</a>
<a href="add.html">Add Patient</a>
<a href="bill.html">Bill</a>
</div>
<div class="content">
<h1 id="h1">Total Patients</h1>
<p id="info" style="margin:8px 0;color:#64748b;font-size:13px">Loading...</p>
<input id="search" oninput="onSearch()" placeholder="Search name, SHRI, PMJAY..." style="width:100%;padding:11px 14px;border-radius:10px;border:1.5px solid #cbd5e1;margin:12px 0">
<div class="tableWrap"><div style="overflow-x:auto"><table id="tbl"></table></div></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const config={apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app=initializeApp(config);
const db=getFirestore(app);
let all=[];
window.onSearch=()=>{
 let q=document.getElementById('search').value.toLowerCase();
 render(all.filter(p=>[p.name,p.shri,p.pmjay,p.addr,p.contact].join(' ').toLowerCase().includes(q)));
};
function render(list){
 let html='<tr><th>SL</th><th>Patient</th><th>SHRI ID</th><th>Contact</th><th>PMJAY ID</th><th>Address</th></tr>';
 list.forEach((p,i)=>{html+=`<tr><td><div class="sl">${i+1}</div></td><td><b>${p.name}</b></td><td><span class="shri">${p.shri}</span></td><td>${p.contact}</td><td>${p.pmjay}</td><td>${p.addr}</td></tr>`;});
 document.getElementById('tbl').innerHTML=html;
 document.getElementById('h1').textContent=`Total Patients (${list.length})`;
}
async function init(){
 let fromJs=0;
 if(typeof patientData!=='undefined'){
   all=patientData.map(p=>({name:(p.patientName||p.name||'').toString(),shri:(p.shriId||p.shri||'').toString(),contact:(p.contactNo||p.contact||'').toString(),pmjay:(p.pmjayId||p.pmjay||'').toString(),addr:(p.address||p.addr||'').toString()}));
   fromJs=all.length;
   render(all);
   document.getElementById('info').textContent=`Loaded ${fromJs} from Patient.js, syncing Firebase...`;
 }
 try{
   const snap=await getDocs(collection(db,"patients"));
   let fbCount=0;
   snap.forEach(d=>{
     let c=d.data(); if(c.deleted) return;
     let id=(c.shriId||c.shri||d.id).toString().trim();
     if(!id) return;
     if(!all.find(x=>x.shri===id)){
       all.push({name:(c.patientName||c.name||'').toString(),shri:id,contact:(c.contactNo||c.contact||'').toString(),pmjay:(c.pmjayId||c.pmjay||'').toString(),addr:(c.address||c.addr||'').toString()});
       fbCount++;
     }
   });
   render(all);
   document.getElementById('info').textContent=`✓ TOTAL ${all.length} PATIENTS (${fromJs} from Patient.js + ${fbCount} from Firebase added on any device) - Permanent ✓`;
 }catch(e){
   document.getElementById('info').textContent=`Showing ${all.length} from Patient.js | Firebase error: ${e.message} (Fix Firestore Rules to allow read)`;
 }
 // Highlight if coming from add.html
 let added=new URLSearchParams(location.search).get('added');
 if(added){document.getElementById('search').value=added; window.onSearch();}
}
init();
</script>
</body>
</html>
