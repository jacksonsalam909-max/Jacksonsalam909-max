<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Total Patients - SHIJA Dialysis</title>
<script src="Patient.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Segoe UI',system-ui}
body{background:#f6f7fb;color:#1a2332;display:flex;min-height:100vh}
.top{height:68px;background:#0b1b32;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:fixed;top:0;left:0;right:0;z-index:100}
.shija{font-size:28px;font-weight:900;color:#fff}.dialysis{font-size:15px;font-weight:600;color:#fff}
.side{position:fixed;left:0;top:68px;bottom:0;width:260px;background:#0b1b32;padding:18px 10px;display:flex;flex-direction:column;gap:6px;z-index:90}
.side a{padding:13px 14px;border-radius:10px;text-decoration:none;color:#8ea0bf;font-weight:600;font-size:14px}
.side a.active{background:#132845;color:#fff;border-left:3px solid #1868db}
.content{flex:1;padding:22px;margin-left:260px;margin-top:68px}
.tableWrap{background:#fff;border:1.5px solid #e2e8f0;border-radius:14px;overflow:hidden}
table{width:100%;border-collapse:collapse;min-width:1100px}
th{padding:14px 12px;font-size:12px;color:#64748b;background:#f8fafc;border-bottom:1px solid #e2e8f0;text-align:left}
td{padding:14px 12px;font-size:13px;border-bottom:1px solid #f1f5f9;color:#334155}
.sl{background:#f1f5f9;width:36px;height:28px;display:grid;place-items:center;border-radius:6px;font-weight:800;font-size:12px}
.shri{background:#1868db;color:#fff;padding:4px 10px;border-radius:6px;font-weight:700;font-size:12px}
.aadhar{background:#f1f5f9;color:#334155;padding:4px 8px;border-radius:6px;font-weight:600;font-size:11px;font-family:monospace}
.btnEdit{padding:6px 14px;border-radius:6px;border:0;background:#facc15;color:#000;font-weight:700;font-size:12px;cursor:pointer;margin-right:4px}
.btnDel{padding:6px 14px;border-radius:6px;border:0;background:#ef4444;color:#fff;font-weight:700;font-size:12px;cursor:pointer}
.pg{padding:6px 12px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;cursor:pointer;font-weight:600;font-size:12px;margin:2px}.pg.active{background:#1868db;color:#fff}
.modal{position:fixed;inset:0;background:#0006;z-index:99;display:none;place-items:center}.modal.show{display:grid}
.modalBox{background:#fff;border-radius:14px;padding:18px;width:90%;max-width:420px}.modalBox input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;margin:6px 0}
.mBtns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.mBtns button{padding:8px 14px;border-radius:8px;border:0;font-weight:700;cursor:pointer}.save{background:#1868db;color:#fff}.cancel{background:#f1f5f9}
.highlight{background:#e0f2fe!important}
</style>
</head>
<body>
<div class="top"><div><div class="shija">SHIJA</div><div class="dialysis">Dialysis</div></div><div style="color:#fff;font-weight:800">Admin</div></div>
<div class="side"><a href="index.html">Home</a><a href="total.html" class="active">Total Patient</a><a href="daily.html">Daily Dialysis</a><a href="add.html">Add Patient</a><a href="bill.html">Bill</a></div>
<div class="content">
<h1>Total Patients</h1><p id="info" style="color:#64748b;font-size:14px">Loading...</p>
<div style="display:flex;gap:10px;margin:14px 0"><input id="search" style="flex:1;padding:11px 14px;border-radius:10px;border:1.5px solid #cbd5e1" placeholder="Search name, Aadhaar, PMJAY, SHRI..." oninput="onSearch()"><select id="pageSize" onchange="changeSize()" style="padding:8px 12px;border-radius:8px;border:1.5px solid #cbd5e1"><option value="10">10</option><option value="20">20</option><option value="50">50</option><option value="9999">All</option></select></div>
<div class="tableWrap"><div style="overflow-x:auto"><table id="tbl"></table></div></div>
<div id="pager" style="margin-top:14px;display:flex;justify-content:flex-end"></div>
</div>
<div class="modal" id="editModal"><div class="modalBox"><h3>Edit Patient</h3><input id="eName" placeholder="Patient Name"><input id="eAadhar" placeholder="Aadhaar Number"><input id="eShri" placeholder="SHRI ID"><input id="eContact" placeholder="Contact"><input id="ePmjay" placeholder="PMJAY ID"><input id="eAddr" placeholder="Address"><div class="mBtns"><button class="cancel" onclick="closeEdit()">Cancel</button><button class="save" onclick="saveEdit()">Save to Firebase</button></div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let allPatients=[],filtered=[],curPage=1,pageSize=10,editIndex=-1;
window.onSearch=()=>{curPage=1;applyFilter();};
window.changeSize=()=>{pageSize=parseInt(document.getElementById('pageSize').value);curPage=1;renderTable();};
window.goPage=(n)=>{curPage=n;renderTable();};
window.openEdit=(idx)=>{editIndex=idx;let p=allPatients[idx];document.getElementById('eName').value=p.name;document.getElementById('eAadhar').value=p.aadhar;document.getElementById('eShri').value=p.shri;document.getElementById('eContact').value=p.contact;document.getElementById('ePmjay').value=p.pmjay;document.getElementById('eAddr').value=p.addr;document.getElementById('editModal').classList.add('show');};
window.closeEdit=()=>document.getElementById('editModal').classList.remove('show');
window.deletePatient=async(idx)=>{
 let p=allPatients[idx];
 if(!confirm('Delete patient?\nName: '+p.name+'\nSHRI: '+p.shri+'\nAadhaar: '+p.aadhar+'\n\nThis will delete from ALL computers and mobiles permanently')) return;
 document.getElementById('info').textContent='Deleting '+p.shri+'...';
 try{
   await setDoc(doc(db,"patients",p.shri),{deleted:true,deletedAt:new Date()},{merge:true});
   try{ await deleteDoc(doc(db,"patients",p.shri)); }catch(e){}
   allPatients.splice(idx,1);
   applyFilter();
   document.getElementById('info').textContent='Deleted '+p.shri+' - Removed from all devices';
 }catch(e){ alert('Delete failed: '+e.message); }
};
function applyFilter(){
 let q=document.getElementById('search').value.toLowerCase().trim();
 filtered=allPatients.filter(p=>[p.name,p.shri,p.contact,p.addr,p.pmjay,p.aadhar].join(' ').toLowerCase().includes(q));
 renderTable();
}
function renderTable(){
 let addedParam=new URLSearchParams(location.search).get('added');
 let totalPages=pageSize>=9999?1:Math.ceil(filtered.length/pageSize)||1;
 let start=(curPage-1)*pageSize;
 let data=filtered.slice(start,start+pageSize);
 let html='<tr><th>SL No</th><th>Patient</th><th>Aadhaar No</th><th>SHRI ID</th><th>Contact</th><th>PMJAY ID</th><th>Address</th><th>Action</th></tr>';
 data.forEach((p,i)=>{
   let realIdx=allPatients.indexOf(filtered[start+i]);
   let isNew=addedParam&&p.shri===addedParam;
   html+=`<tr class="${isNew?'highlight':''}"><td><div class="sl">${start+i+1}</div></td><td><b>${p.name}</b></td><td><span class="aadhar">${p.aadhar||'-'}</span></td><td><span class="shri">${p.shri}</span></td><td>${p.contact}</td><td>${p.pmjay}</td><td>${p.addr}</td><td><button class="btnEdit" onclick="openEdit(${realIdx})">Edit</button><button class="btnDel" onclick="deletePatient(${realIdx})">Delete</button></td></tr>`;
 });
 document.getElementById('tbl').innerHTML=html;
 document.getElementById('info').textContent=`${filtered.length?start+1:0}-${Math.min(start+pageSize,filtered.length)} of ${filtered.length} patients - Firebase connected - All changes saved to all devices`;
 let pg='';for(let i=1;i<=Math.min(totalPages,10);i++) pg+=`<button class="pg ${i===curPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
 document.getElementById('pager').innerHTML=pg;
}
async function init(){
 allPatients=(typeof patientData!=='undefined'?patientData:[]).map(p=>({
   name:String(p.patientName||p.name||'').trim(),
   aadhar:String(p.aadharNo||p.aadhar||'').trim(),
   shri:String(p.shriId||p.shri||'').trim(),
   contact:String(p.contactNo||p.contact||'').trim(),
   pmjay:String(p.pmjayId||p.pmjay||'').trim(),
   addr:String(p.address||p.addr||'').trim(),
   age:p.age||30, gender:p.gender||'Male'
 }));
 let added=new URLSearchParams(location.search).get('added');
 if(added) document.getElementById('search').value=added;
 applyFilter();
 try{
   const snap=await getDocs(collection(db,"patients"));
   snap.forEach(d=>{
     let c=d.data(); if(c.deleted) return;
     let shriId=(c.shriId||c.shri||d.id).toString().trim(); if(!shriId) return;
     let ex=allPatients.find(x=>x.shri===shriId);
     if(ex){
       ex.name=c.patientName||c.name||ex.name;
       ex.aadhar=c.aadharNo||c.aadhar||ex.aadhar;
       ex.contact=c.contactNo||c.contact||ex.contact;
       ex.pmjay=c.pmjayId||c.pmjay||ex.pmjay;
       ex.addr=c.address||c.addr||ex.addr;
     }else{
       allPatients.push({name:String(c.patientName||c.name||'').trim(),aadhar:String(c.aadharNo||c.aadhar||'').trim(),shri:shriId,contact:String(c.contactNo||c.contact||'').trim(),pmjay:String(c.pmjayId||c.pmjay||'').trim(),addr:String(c.address||c.addr||'').trim(),age:c.age||30,gender:c.gender||'Male'});
     }
   });
   applyFilter();
 }catch(e){ document.getElementById('info').textContent='Firebase error: '+e.message; }
}
window.saveEdit=async()=>{
 let p=allPatients[editIndex];
 let oldShri=p.shri;
 let updated={
   patientName:document.getElementById('eName').value.trim(),
   aadharNo:document.getElementById('eAadhar').value.trim(),
   aadhar:document.getElementById('eAadhar').value.trim(),
   shriId:document.getElementById('eShri').value.trim(),
   shri:document.getElementById('eShri').value.trim(),
   contactNo:document.getElementById('eContact').value.trim(),
   contact:document.getElementById('eContact').value.trim(),
   pmjayId:document.getElementById('ePmjay').value.trim(),
   pmjay:document.getElementById('ePmjay').value.trim(),
   address:document.getElementById('eAddr').value.trim(),
   addr:document.getElementById('eAddr').value.trim(),
   name:document.getElementById('eName').value.trim(),
   age:p.age, gender:p.gender, updatedAt:new Date()
 };
 if(!updated.shriId){alert('SHRI ID required');return;}
 p.name=updated.name; p.aadhar=updated.aadhar; p.shri=updated.shri; p.contact=updated.contact; p.pmjay=updated.pmjay; p.addr=updated.addr;
 closeEdit(); applyFilter();
 document.getElementById('info').textContent='Saving '+updated.shriId+' to Firebase...';
 try{
   await setDoc(doc(db,"patients",updated.shriId),updated,{merge:true});
   if(oldShri!==updated.shriId){ await setDoc(doc(db,"patients",oldShri),{deleted:true,deletedAt:new Date()},{merge:true}); }
   document.getElementById('info').textContent='Saved '+updated.shriId+' - Updated on all PC and mobile';
 }catch(e){ document.getElementById('info').textContent='Save failed: '+e.message; alert(e.message); }
};
init();
</script>
</body>
</html>
