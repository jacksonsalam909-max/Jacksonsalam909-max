<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add Patient - SHIJA Dialysis</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
body{background:#f6f7fb}
.top{height:68px;background:#0b1b32;display:flex;align-items:center;padding:0 18px;color:#fff;font-weight:900;font-size:22px}
.side{position:fixed;left:0;top:68px;bottom:0;width:260px;background:#0b1b32;padding:18px 10px;display:flex;flex-direction:column;gap:6px}
.side a{padding:13px 14px;border-radius:10px;text-decoration:none;color:#8ea0bf;font-weight:600}
.side a.active{background:#132845;color:#fff;border-left:3px solid #1868db}
.content{margin-left:260px;padding:30px}
.card{background:#fff;border:1.5px solid #e2e8f0;border-radius:14px;padding:22px;max-width:600px}
.card input,.card select{width:100%;padding:12px;border:1.5px solid #cbd5e1;border-radius:10px;margin:8px 0;font-size:14px;outline:0}
.card input:focus{border-color:#1868db}
.btn{padding:12px 20px;border:0;border-radius:10px;background:#1868db;color:#fff;font-weight:800;cursor:pointer;width:100%;margin-top:12px;font-size:14px}
.btn:disabled{opacity:.5}
.status{margin-top:12px;font-size:13px;color:#64748b}
</style>
</head>
<body>
<div class="top">SHIJA Dialysis - Add Patient</div>
<div class="side"><a href="index.html">Home</a><a href="total.html">Total Patient</a><a href="daily.html">Daily Dialysis</a><a href="add.html" class="active">Add Patient</a><a href="bill.html">Bill</a></div>
<div class="content">
<h1 style="font-size:28px;font-weight:900">Add New Patient</h1>
<p style="color:#64748b;margin:6px 0 18px">Will be visible to all PC & Mobile instantly and appear in Total Patients</p>
<div class="card">
<input id="name" placeholder="Patient Name *">
<input id="shri" placeholder="SHRI ID * (e.g. SHRI12345)">
<input id="contact" placeholder="Contact No *">
<input id="pmjay" placeholder="PMJAY ID">
<input id="address" placeholder="Address">
<input id="age" type="number" placeholder="Age">
<select id="gender"><option value="Male">Male</option><option value="Female">Female</option><option value="Other">Other</option></select>
<button class="btn" id="addBtn" onclick="addPatient()">Add Patient & Go to Total</button>
<p id="status" class="status"></p>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC4Z-2vV3I9...",
  authDomain: "shija-dialysis.firebaseapp.com",
  projectId: "shija-dialysis",
  storageBucket: "shija-dialysis.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123:web:abc123"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.addPatient = async () => {
  let name=document.getElementById('name').value.trim();
  let shri=document.getElementById('shri').value.trim();
  let contact=document.getElementById('contact').value.trim();
  let pmjay=document.getElementById('pmjay').value.trim();
  let address=document.getElementById('address').value.trim();
  let age=parseInt(document.getElementById('age').value)||30;
  let gender=document.getElementById('gender').value;

  if(!name||!shri){ alert("Name and SHRI ID required"); return; }

  let btn=document.getElementById('addBtn');
  let status=document.getElementById('status');
  btn.disabled=true;
  btn.textContent="Adding...";
  status.textContent="Saving to cloud for all devices...";

  try{
    await setDoc(doc(db,"patients",shri),{
      patientName:name,
      shriId:shri,
      contactNo:contact,
      pmjayId:pmjay,
      address:address,
      age:age,
      gender:gender,
      createdAt:new Date(),
      updatedAt:new Date()
    },{merge:true});

    status.textContent="✓ Saved! Going to Total Patients...";
    // REDIRECT TO TOTAL.HTML
    window.location.href="total.html?added="+encodeURIComponent(shri);

  }catch(e){
    status.textContent="Error: "+e.message;
    btn.disabled=false;
    btn.textContent="Add Patient & Go to Total";
  }
}
</script>
</body>
</html>
