<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Total Patients - SHIJA Dialysis</title>
<script src="Patient.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui}
body{background:linear-gradient(135deg,#081a26,#0c2a3a,#123d4f,#144e62);min-height:100vh;color:#e2f1f8;display:flex;flex-direction:column;overflow-x:hidden}
.top{height:64px;background:#081a26;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #184a5e;position:sticky;top:0;z-index:30}
.ham{width:38px;height:38px;border-radius:10px;background:#0e3a4e;border:1px solid #2a6a84;color:#22d3ee;font-size:20px;cursor:pointer;display:grid;place-items:center}
.logo{font-weight:900;font-size:20px;color:#fff}
.side{position:fixed;left:0;top:64px;bottom:0;width:240px;background:linear-gradient(180deg,#061a28,#0a2c3e);border-right:1px solid #184a5e;padding:20px 12px;display:flex;flex-direction:column;gap:6px;transform:translateX(0);transition:.35s;z-index:25;overflow-y:auto}
.side.closed{transform:translateX(-100%)}
.side a{padding:13px 14px;border-radius:12px;text-decoration:none;color:#8ab4c8;font-weight:600;font-size:14px;transition:.2s}
.side a.active{background:#0e3a4e;color:#22d3ee;border-left:3px solid #22d3ee}
.side a:hover{background:#10364a;color:#cde9f5}
.content{flex:1;margin-left:240px;padding:16px;transition:.35s}
.content.full{margin-left:0}
.overlay{position:fixed;inset:0;top:64px;background:#0006;z-index:20;display:none}
.overlay.show{display:block}
.box{background:linear-gradient(135deg,#0f2f42cc,#123f55cc);border:1px solid #1e5a73;border-radius:16px;padding:16px}
.statCard{background:linear-gradient(135deg,#0d3a4e,#15546b);border:1px solid #1e6a84;border-radius:14px;padding:14px 18px;display:flex;gap:14px;align-items:center;min-width:260px}
.tp{width:48px;height:48px;border-radius:12px;background:#0ea5e9;display:grid;place-items:center;font-weight:900;color:#fff}
table{width:100%;border-collapse:collapse;min-width:650px}
th{padding:10px 8px;font-size:11px;color:#7dd3fc;border-bottom:1px solid #1e5a73;text-align:left;text-transform:uppercase;white-space:nowrap}
td{padding:11px 8px;font-size:12px;border-bottom:1px solid #153a4a;color:#cfe8f3;white-space:nowrap}
@media(max-width:900px){.side{transform:translateX(-100%)}.side.open{transform:translateX(0)}.content{margin-left:0}}
</style>
</head>
<body>
<div class="top">
<div style="display:flex;gap:12px;align-items:center"><button class="ham" onclick="toggleSide()">☰</button><div class="logo">SHIJA Dialysis</div></div>
<div style="color:#fff;font-weight:700;font-size:13px">Admin</div>
</div>

<!-- SIDEBAR - ALL SLIDE TOGETHER -->
<div class="side" id="side">
<a href="index.html">Home</a>
<a href="total.html" class="active">Total Patient</a>
<a href="add.html">Add Patient</a>
<a href="kft.html">KFT Report</a>
<a href="discharge.html">Discharge Patient</a>
<a href="daily-dialysis.html">Daily Dialysis</a>
</div>

<div class="overlay" id="overlay" onclick="toggleSide()"></div>

<div class="content" id="content">
<div class="box">
<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;align-items:center">
<div><h1 style="color:#fff;font-size:26px;font-weight:900">Total Patients</h1><p style="color:#8ab4c8;font-size:12px">Manage and view all registered patients</p></div>
<div class="statCard"><div class="tp">TP</div><div><div style="font-size:13px;font-weight:700;color:#fff">Total Patients</div><h2 id="countTop" style="font-size:34px;color:#fff;font-weight:900">510</h2><p style="font-size:12px;color:#7dd3fc">All time<br>Total registered</p></div></div>
</div>
<input id="search" placeholder="Search by name, SHRI ID, contact..." oninput="render()" style="width:100%;margin:14px 0;padding:10px;border-radius:8px;background:#0a2536;border:1px solid #1e5a73;color:#fff">
<div style="overflow-x:auto"><table id="tbl"></table></div>
</div>
</div>

<script>
function toggleSide(){let s=document.getElementById('side'),c=document.getElementById('content'),o=document.getElementById('overlay');if(innerWidth<=900){s.classList.toggle('open');o.classList.toggle('show')}else{s.classList.toggle('closed');c.classList.toggle('full')}}
let patients=(typeof patientData!=='undefined'?patientData:[]).map((p,i)=>({name:p.patientName||`Patient ${i+1}`,shri:p.shriId||`SHRI-${10245+i}`,contact:p.contactNo||'9876543210',pmjay:p.pmjayId||'PMJAY-123',addr:p.address||'Imphal'}));
function render(){let q=(document.getElementById('search').value||'').toLowerCase();let f=patients.filter(p=>[p.name,p.shri].join(' ').toLowerCase().includes(q));document.getElementById('countTop').textContent=f.length||510;let h='<tr><th>SL</th><th>Name</th><th>SHRI ID</th><th>Contact</th><th>PMJAY</th><th>Address</th></tr>';f.forEach((p,i)=>{h+=`<tr><td>${String(i+1).padStart(2,'0')}</td><td style="color:#fff;font-weight:700">${p.name.toUpperCase()}</td><td style="color:#7dd3fc">${p.shri}</td><td>${p.contact}</td><td>${p.pmjay}</td><td>${p.addr}</td></tr>`});document.getElementById('tbl').innerHTML=h}
render();
</script>
</body>
</html>
