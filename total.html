<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Total Patients - SHIJA</title>
<script src="Patient.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
body{background:#f6f7fb;display:flex;flex-direction:column;min-height:100vh}
.top{height:64px;background:#0a1931;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:100}
.top h2{color:#fff;font-size:16px;font-weight:800}
.menuBtn{width:36px;height:36px;border-radius:8px;border:1.5px solid #1e2d55;background:#13264d;color:#fff;display:grid;place-items:center;cursor:pointer}
.mainWrap{display:flex;flex:1}
.side{width:230px;background:#0a1931;padding:16px 10px;position:fixed;left:0;top:64px;bottom:0;transition:transform.3s;z-index:90}
.side.closed{transform:translateX(-100%)}
.side a{padding:12px 14px;border-radius:10px;text-decoration:none;color:#8ea0c0;font-weight:600;font-size:14px;display:block;margin-bottom:4px}
.side a.active{background:#13264d;color:#fff;border-left:3px solid #1a56db}
.content{flex:1;padding:16px;margin-left:230px;transition:margin.3s}
.content.full{margin-left:0}
.tableWrap{background:#fff;border:1.5px solid #e2e8f0;border-radius:14px;overflow:hidden;margin-top:14px}
table{width:100%;border-collapse:collapse;min-width:800px}
th{padding:14px 12px;font-size:12px;color:#64748b;background:#f8fafc;text-align:left}
td{padding:14px 12px;font-size:13px;border-bottom:1px solid #f1f5f9}
.sl{background:#f1f5f9;width:36px;height:28px;display:grid;place-items:center;border-radius:6px;font-weight:800}
.shri{background:#1868db;color:#fff;padding:4px 10px;border-radius:6px;font-weight:700;font-size:12px}
.pager{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#f8fafc;border-top:1px solid #e2e8f0;flex-wrap:wrap;gap:8px}
.pBtn{padding:8px 14px;border-radius:8px;border:1.5px solid #cbd5e1;background:#fff;font-weight:700;cursor:pointer;font-size:13px}
.pBtn:disabled{opacity:0.5}
.pInfo{font-size:13px;font-weight:600;color:#475569}
@media(max-width:900px){.side{transform:translateX(-100%)}.side.open{transform:translateX(0)}.content{margin-left:0!important}}
</style>
</head>
<body>
<div class="top"><div style="display:flex;align-items:center;gap:10px"><button class="menuBtn" onclick="toggleSide()"><div style="display:flex;flex-direction:column;gap:4px"><div style="width:18px;height:2px;background:#fff"></div><div style="width:18px;height:2px;background:#fff"></div><div style="width:18px;height:2px;background:#fff"></div></div></button><h2>SHIJA Dialysis Management</h2></div><span style="color:#fff;font-weight:700">Admin</span></div>
<div class="mainWrap">
<div class="side" id="side">
<a href="index.html">Home</a>
<a href="total.html" class="active">Total Patient</a>
<a href="daily.html">Daily Dialysis</a>
<a href="discharge.html">Discharge Patient</a>
<a href="kft.html">KFT Report</a>
<a href="add.html">Add Patient</a>
<a href="bill.html">Bill</a>
</div>
<div class="content" id="content">
<h1>Total Patients</h1><p id="info" style="color:#64748b;font-size:13px">Loading...</p>
<div style="display:flex;gap:10px;margin:14px 0"><input id="search" style="flex:1;padding:11px 14px;border-radius:10px;border:1.5px solid #cbd5e1" placeholder="Search..." oninput="onSearch()"><select id="pageSize" onchange="changePageSize()" style="padding:10px;border-radius:8px;border:1.5px solid #cbd5e1;font-weight:700"><option value="10">10 / page</option><option value="20">20 / page</option><option value="30">30 / page</option><option value="40">40 / page</option><option value="50" selected>50 / page</option></select></div>
<div class="tableWrap"><div style="overflow-x:auto"><table id="tbl"></table></div><div class="pager"><div style="display:flex;gap:6px"><button class="pBtn" id="prevBtn" onclick="prevPage()">← Prev</button><button class="pBtn" id="nextBtn" onclick="nextPage()">Next →</button></div><div class="pInfo" id="pageInfo"></div><div style="display:flex;gap:6px" id="pageNums"></div></div></div>
</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let allPatients=[],filtered=[],currentPage=1,pageSize=50;
window.toggleSide=()=>{let s=document.getElementById('side');let c=document.getElementById('content');if(innerWidth<=900){s.classList.toggle('open');}else{s.classList.toggle('closed');c.classList.toggle('full');}};
window.onSearch=()=>{currentPage=1;applyFilter();};
window.changePageSize=()=>{pageSize=parseInt(document.getElementById('pageSize').value);currentPage=1;renderTable();};
window.applyFilter=()=>{let q=document.getElementById('search').value.toLowerCase();filtered=allPatients.filter(p=>!p.deleted && [p.name,p.shri,p.pmjay].join(' ').toLowerCase().includes(q));renderTable();};
window.renderTable=()=>{
 let totalPages=Math.max(1,Math.ceil(filtered.length/pageSize));
 if(currentPage>totalPages) currentPage=totalPages;
 let start=(currentPage-1)*pageSize;
 let data=filtered.slice(start,start+pageSize);
 let html='<tr><th>SL No</th><th>Patient</th><th>SHRI ID</th><th>Contact</th><th>PMJAY ID</th><th>Address</th></tr>';
 data.forEach((p,i)=>{html+=`<tr><td><div class="sl">${start+i+1}</div></td><td><b>${p.name}</b></td><td><span class="shri">${p.shri}</span></td><td>${p.contact||'-'}</td><td>${p.pmjay||'-'}</td><td>${p.addr||'-'}</td></tr>`;});
 if(data.length===0) html+='<tr><td colspan="6" style="text-align:center;padding:20px;color:#64748b">No patients found</td></tr>';
 document.getElementById('tbl').innerHTML=html;
 document.getElementById('info').textContent=filtered.length+' patients - Page '+currentPage+' of '+totalPages;
 document.getElementById('pageInfo').textContent='Showing '+(filtered.length?start+1:0)+'-'+Math.min(start+pageSize,filtered.length)+' of '+filtered.length;
 document.getElementById('prevBtn').disabled=currentPage<=1;
 document.getElementById('nextBtn').disabled=currentPage>=totalPages;
 let nums='';
 for(let i=1;i<=totalPages && i<=10;i++){ nums+=`<button class="pBtn" style="${i===currentPage?'background:#0a1931;color:#fff':''}" onclick="goPage(${i})">${i}</button>`; }
 if(totalPages>10) nums+=`<span style="padding:8px">... ${totalPages}</span>`;
 document.getElementById('pageNums').innerHTML=nums;
};
window.prevPage=()=>{if(currentPage>1){currentPage--;renderTable();}};
window.nextPage=()=>{let totalPages=Math.ceil(filtered.length/pageSize);if(currentPage<totalPages){currentPage++;renderTable();}};
window.goPage=(n)=>{currentPage=n;renderTable();};
async function init(){
 allPatients=(typeof patientData!=='undefined'?patientData:[]).map(p=>({name:String(p.patientName||p.name||'').trim(),shri:String(p.shriId||p.shri||'').trim(),contact:String(p.contactNo||p.contact||'').trim(),pmjay:String(p.pmjayId||p.pmjay||'').trim(),addr:String(p.address||p.addr||'').trim(),deleted:false}));
 try{const snap=await getDocs(collection(db,"patients"));snap.forEach(d=>{let c=d.data();let shriId=(c.shriId||c.shri||d.id).trim();let ex=allPatients.find(x=>x.shri===shriId);if(c.deleted){if(ex) ex.deleted=true;return;}if(ex){ex.name=c.patientName||c.name||ex.name;ex.contact=c.contactNo||c.contact||ex.contact;ex.pmjay=c.pmjayId||c.pmjay||ex.pmjay;ex.addr=c.address||c.addr||ex.addr;}else{allPatients.push({name:c.patientName||c.name||'',shri:shriId,contact:c.contactNo||c.contact||'',pmjay:c.pmjayId||c.pmjay||'',addr:c.address||c.addr||'',deleted:false});}});}catch(e){}
 applyFilter();
}
init();
</script>
</body>
</html>
