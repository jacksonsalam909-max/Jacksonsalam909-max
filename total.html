<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui}
body{
background: radial-gradient(ellipse at 20% 20%, #0f4c5c 0%, transparent 50%),
            radial-gradient(ellipse at 80% 10%, #0a2e44 0%, transparent 40%),
            radial-gradient(ellipse at 50% 80%, #0c3b4f 0%, transparent 50%),
            linear-gradient(135deg, #051822 0%, #0a2533 20%, #0c2f42 40%, #123e55 70%, #0e3144 100%);
min-height:100vh;color:#e2f1f8;display:flex;flex-direction:column;position:relative;overflow-x:hidden
}
/* GRAPHIC OVERLAY */
body::before{
content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
background: 
 url("data:image/svg+xml,%3Csvg width='600' height='400' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M-50 200 Q150 100 300 200 T650 200' stroke='%2322d3ee' stroke-opacity='0.08' stroke-width='1' fill='none'/%3E%3Cpath d='M-50 220 Q150 120 300 220 T650 220' stroke='%230ea5e9' stroke-opacity='0.06' stroke-width='1' fill='none'/%3E%3Ccircle cx='100' cy='100' r='2' fill='%2322d3ee' opacity='0.3'/%3E%3Ccircle cx='500' cy='300' r='3' fill='%2322d3ee' opacity='0.4'/%3E%3Ccircle cx='300' cy='150' r='1.5' fill='%23fff' opacity='0.5'/%3E%3C/svg%3E"),
 radial-gradient(circle at 15% 50%, #22d3ee22 0%, transparent 20%),
 radial-gradient(circle at 85% 30%, #0ea5e933 0%, transparent 15%),
 radial-gradient(circle at 50% 90%, #06b6d422 0%, transparent 25%);
}
.top{
height:64px;
background: linear-gradient(90deg, #071a25ee, #0d2f42ee);
backdrop-filter:blur(20px);
display:flex;align-items:center;justify-content:space-between;padding:0 24px;
border-bottom:1px solid #1a5a73;position:sticky;top:0;z-index:10
}
.logo{font-weight:900;font-size:22px;color:#fff;letter-spacing:.3px;text-shadow:0 0 20px #22d3ee60}
.right{display:flex;align-items:center;gap:10px;position:relative;z-index:11}
.ad{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#0e4a5e,#22d3ee);border:1px solid #22d3ee88;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;box-shadow:0 0 15px #22d3ee60}
.adminWrap{position:relative;cursor:pointer;display:flex;align-items:center;gap:6px;color:#fff}
.dropdown{position:absolute;top:100%;right:0;margin-top:10px;background:#fff;border-radius:10px;min-width:120px;box-shadow:0 10px 25px #0008;display:none;overflow:hidden;z-index:99}
.dropdown.show{display:block}
.dropItem{padding:10px 14px;font-size:13px;color:#0f172a;font-weight:600;cursor:pointer;background:#fff;border:0;width:100%;text-align:left}
.main{display:flex;flex:1;max-width:1400px;width:100%;margin:0 auto;position:relative;z-index:1}
.side{
width:220px;
background: linear-gradient(180deg, #081e2bcc, #0b2d3ecc);
backdrop-filter:blur(16px);
padding:16px 10px;border-right:1px solid #1a5a73;
border-radius:16px;margin:10px 0 10px 10px;
box-shadow:0 8px 32px #0006, inset 0 1px 0 #ffffff10
}
.side a{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;text-decoration:none;color:#8ab4c8;font-weight:600;font-size:14px;margin-bottom:6px;transition:.3s}
.side a.active{background:linear-gradient(90deg, #0e4a5e, #125a73);color:#22d3ee;border-left:3px solid #22d3ee;box-shadow:0 0 20px #22d3ee40, inset 0 1px 0 #ffffff20}
.side a:hover{background:#103d52;color:#cde9f5;box-shadow:0 0 15px #22d3ee20}
.content{flex:1;padding:20px}
.box{
background: linear-gradient(135deg, #0e2f42dd, #123f55dd, #10364add);
border:1px solid #22d3ee33;border-radius:20px;padding:22px;
box-shadow:0 20px 60px #000a, 0 0 0 1px #22d3ee15, inset 0 1px 0 #ffffff15, 0 0 40px #0ea5e915;
backdrop-filter:blur(20px);position:relative;overflow:hidden
}
.box::before{
content:"";position:absolute;top:-50%;left:-20%;width:80%;height:60%;
background:radial-gradient(ellipse, #22d3ee12, transparent 70%);pointer-events:none
}
.box::after{
content:"";position:absolute;bottom:0;left:0;right:0;height:1px;
background:linear-gradient(90deg, transparent, #22d3ee60, transparent)
}
.head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px;position:relative;z-index:1}
.head h1{font-size:28px;font-weight:900;color:#fff;text-shadow:0 0 20px #22d3ee40}
.head p{color:#8ab4c8;font-size:13px;margin-top:4px}
.searchRow{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;position:relative;z-index:1}
.searchRow input{
background:#0a2536cc;border:1px solid #1e5a73;color:#e0f2fe;
padding:10px 14px;border-radius:12px;outline:0;min-width:280px;backdrop-filter:blur(10px);
box-shadow:inset 0 1px 0 #ffffff10, 0 0 0 1px #22d3ee10
}
.searchRow input:focus{border-color:#22d3ee;box-shadow:0 0 15px #22d3ee40, inset 0 1px 0 #ffffff10}
.pSize{background:#0a2536cc;border:1px solid #1e5a73;color:#cbd5e1;padding:8px 12px;border-radius:10px}
table{width:100%;border-collapse:collapse;position:relative;z-index:1}
th{padding:12px 8px;font-size:12px;color:#7dd3fc;text-align:left;border-bottom:1px solid #22d3ee30;text-transform:uppercase;letter-spacing:.8px}
td{padding:13px 8px;font-size:13px;border-bottom:1px solid #164a5e55;color:#cfe8f3}
.badgeSHRI{color:#22d3ee;font-weight:700;text-shadow:0 0 10px #22d3ee60}
.btnEdit{
background:linear-gradient(135deg,#0ea5e9,#22d3ee);color:#fff;border:0;
padding:7px 16px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;
box-shadow:0 0 15px #0ea5e9aa, inset 0 1px 0 #ffffff40;transition:.3s
}
.btnEdit:hover{transform:translateY(-1px);box-shadow:0 0 25px #22d3ee, inset 0 1px 0 #ffffff60}
.pager{display:flex;gap:6px;justify-content:flex-end;margin-top:18px;position:relative;z-index:1}
.pg{padding:6px 12px;border-radius:10px;border:1px solid #1e5a73;background:#0a2536aa;color:#8ab4c8;cursor:pointer;font-weight:700;backdrop-filter:blur(10px)}
.pg.active{background:linear-gradient(135deg,#0ea5e9,#22d3ee);color:#082f3f;border-color:#22d3ee;box-shadow:0 0 15px #22d3ee80}
.info{color:#8ab4c8;font-size:12px;margin-top:16px;position:relative;z-index:1}
@media(max-width:800px){.side{width:70px}.side a span{display:none}}
</style>
</head>
<body>
<script>if(localStorage.getItem('shija_logged')!=='1'){location.href='login.html'}</script>

<div class="top">
<div class="logo">SHIJA Dialysis</div>
<div class="right">
<div class="ad">AD</div>
<div class="adminWrap" onclick="toggleDrop(event)">
<span class="adminName">Admin</span> ▼
<div class="dropdown" id="drop"><button class="dropItem" onclick="logout()">Logout</button></div>
</div>
</div>
</div>

<div class="main">
<div class="side">
<a href="index.html"><span>Home</span></a>
<a href="total.html" class="active"><span>Total Patient</span></a>
<a href="add.html"><span>Add Patient</span></a>
<a href="kft.html"><span>KFT Report</span></a>
<a href="discharge.html"><span>Discharge Patient</span></a>
</div>

<div class="content">
<div class="box">
<div class="head">
<div><h1>Total Patients</h1><p>Manage and view all registered patients</p></div>
<div style="font-size:12px;color:#8ab4c8" id="totalCount">24 total patients</div>
</div>

<div class="searchRow">
<input id="search" placeholder="Search by name, SHRI ID, contact..." oninput="render()">
<select class="pSize" id="pageSize" onchange="changeSize()"><option value="5">Page size: 5</option><option value="10" selected>Page size: 10</option><option value="20">20</option></select>
</div>

<table id="tbl"></table>
<div class="info" id="info"></div>
<div class="pager" id="pager"></div>
</div>
</div>
</div>

<script>
function toggleDrop(e){e.stopPropagation();document.getElementById('drop').classList.toggle('show')}
function logout(){localStorage.removeItem('shija_logged');location.href='login.html'}
document.addEventListener('click',()=>{document.getElementById('drop').classList.remove('show')});
let curPage=1,pageSize=10;
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const config={apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app=initializeApp(config);const db=getFirestore(app);
async function load(){
 try{let snap=await getDocs(collection(db,"patients"));let arr=[];snap.forEach(d=>{let p=d.data();arr.push({name:p.patientName||p.name||'',shri:p.shriId||p.shri||'',contact:p.contactNo||p.contact||'',pmjay:p.pmjayId||p.pmjay||'',addr:p.address||'',docId:d.id})});if(arr.length===0) throw 'empty';window.patients=arr;render();}catch(e){let raw=(typeof patientData!=='undefined')?patientData:[];window.patients=raw.map((p,i)=>({name:p.patientName||p.name||`Patient ${i+1}`,shri:p.shriId||`SHRI-${10245+i}`,contact:p.contactNo||'+91 98765 43210',pmjay:p.pmjayId||`PMJAY-${78901123+i}`,addr:p.address||'Imphal, Manipur',docId:null}));render();}
}
load();
</script>

<script>
function render(){
 let q=(document.getElementById('search').value||'').toLowerCase();
 let patients=(window.patients||[]).filter(p=>[p.name,p.shri,p.contact,p.pmjay,p.addr].some(s=>(s||'').toLowerCase().includes(q)));
 document.getElementById('totalCount').textContent=`${patients.length} total patients`;
 let totalPages=Math.ceil(patients.length/pageSize)||1;if(curPage>totalPages)curPage=totalPages;
 let s=(curPage-1)*pageSize,e=s+pageSize;let data=patients.slice(s,e);
 let html='<tr><th>SL</th><th>Name</th><th>SHRI ID</th><th>Contact</th><th>PMJAY ID</th><th>Address</th><th>Action</th></tr>';
 data.forEach((p,i)=>{
  let sl=String(s+i+1).padStart(2,'0');
  html+=`<tr><td style="color:#6a9ab0">${sl}</td><td style="font-weight:700;color:#fff">${p.name}</td><td class="badgeSHRI">${p.shri}</td><td>${p.contact}</td><td>${p.pmjay}</td><td>${p.addr}</td><td><button class="btnEdit" onclick="editPatient('${p.docId||''}','${p.name}')">Edit</button></td></tr>`;
 });
 if(data.length===0) html+='<tr><td colspan="7" style="text-align:center;padding:20px;color:#6a9ab0">No patients found</td></tr>';
 document.getElementById('tbl').innerHTML=html;
 document.getElementById('info').textContent=`Showing ${patients.length?s+1:0} to ${Math.min(e,patients.length)} of ${patients.length} entries`;
 let h=`<button class="pg" onclick="go(${curPage-1})">‹ Prev</button>`;
 for(let i=1;i<=Math.min(totalPages,5);i++) h+=`<button class="pg ${i===curPage?'active':''}" onclick="go(${i})">${i}</button>`;
 h+=`<button class="pg" onclick="go(${curPage+1})">Next ›</button>`;
 document.getElementById('pager').innerHTML=h;
}
function go(n){let tp=Math.ceil((window.patients||[]).length/pageSize)||1;if(n<1||n>tp)return;curPage=n;render();}
function changeSize(){pageSize=parseInt(document.getElementById('pageSize').value);curPage=1;render();}
function editPatient(id,name){if(id){location.href=`add.html?edit=${id}`}else{location.href=`add.html?name=${encodeURIComponent(name)}`}}
</script>
</body>
</html>
