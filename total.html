<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Total Patients - SHIJA</title>
<script src="Patient.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
body{background:#f6f7fb;display:flex;flex-direction:column;min-height:100vh}
.top{height:64px;background:#0a1931;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:100}
.top h2{color:#fff;font-size:16px;font-weight:800}
.menuBtn{width:36px;height:36px;border-radius:8px;border:1.5px solid #1e2d55;background:#13264d;color:#fff;display:grid;place-items:center;cursor:pointer}
.mainWrap{display:flex;flex:1}
.side{width:230px;background:#0a1931;padding:16px 10px;position:fixed;left:0;top:64px;bottom:0;transition:transform.3s;z-index:90;overflow-y:auto}
.side.closed{transform:translateX(-100%)}
.side a{padding:12px 14px;border-radius:10px;text-decoration:none;color:#8ea0c0;font-weight:600;font-size:14px;display:block;margin-bottom:4px}
.side a.active{background:#13264d;color:#fff;border-left:3px solid #1a56db}
.content{flex:1;padding:16px;margin-left:230px;transition:margin.3s}
.content.full{margin-left:0}
.tableWrap{background:#fff;border:1.5px solid #e2e8f0;border-radius:14px;overflow:hidden;margin-top:14px}
table{width:100%;border-collapse:collapse;min-width:900px}
th{padding:14px 12px;font-size:12px;color:#64748b;background:#f8fafc;text-align:left}
td{padding:14px 12px;font-size:13px;border-bottom:1px solid #f1f5f9}
.sl{background:#f1f5f9;width:36px;height:28px;display:grid;place-items:center;border-radius:6px;font-weight:800}
.shri{background:#1868db;color:#fff;padding:4px 10px;border-radius:6px;font-weight:700;font-size:12px}
.btnEdit{padding:6px 14px;border-radius:6px;border:0;background:#facc15;font-weight:700;font-size:12px;cursor:pointer;margin-right:4px}
.btnDel{padding:6px 14px;border-radius:6px;border:0;background:#ef4444;color:#fff;font-weight:700;font-size:12px;cursor:pointer}
.modal{position:fixed;inset:0;background:#0006;display:none;place-items:center;z-index:99}.modal.show{display:grid}
.modalBox{background:#fff;border-radius:14px;padding:18px;width:90%;max-width:420px}.modalBox input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;margin:6px 0}
.modalBox input:disabled{background:#f1f5f9}
.mBtns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.save{background:#1868db;color:#fff;padding:8px 14px;border-radius:8px;border:0;font-weight:700;cursor:pointer}.cancel{background:#f1f5f9;padding:8px 14px;border-radius:8px;border:0;font-weight:700;cursor:pointer}
@media(max-width:900px){.side{transform:translateX(-100%)}.side.open{transform:translateX(0)}.content{margin-left:0!important}}
</style>
</head>
<body>
<div class="top"><div style="display:flex;align-items:center;gap:10px"><button class="menuBtn" onclick="toggleSide()"><div style="display:flex;flex-direction:column;gap:4px"><div style="width:18px;height:2px;background:#fff"></div><div style="width:18px;height:2px;background:#fff"></div><div style="width:18px;height:2px;background:#fff"></div></div></button><h2>SHIJA Dialysis Management</h2></div><span style="color:#fff;font-weight:700">Admin</span></div>

<div class="mainWrap">
<div class="side" id="side">
<a href="index.html">Home</a>
<a href="total.html" class="active">Total Patient</a>
<a href="daily.html">Daily Dialysis</a>
<a href="discharge.html">Discharge Patient</a>
<a href="kft.html">KFT Report</a>
<a href="add.html">Add Patient</a>
<a href="bill.html">Bill</a>
</div>

<div class="content" id="content">
<h1>Total Patients</h1><p id="info" style="color:#64748b;font-size:13px">Loading...</p>
<div style="display:flex;gap:10px;margin:14px 0"><input id="search" style="flex:1;padding:11px 14px;border-radius:10px;border:1.5px solid #cbd5e1" placeholder="Search..." oninput="applyFilter()"><select id="pageSize" onchange="renderTable()"><option value="10">10</option><option value="50" selected>50</option><option value="9999">All</option></select></div>
<div class="tableWrap"><div style="overflow-x:auto"><table id="tbl"></table></div></div>
</div>
</div>

<div class="modal" id="editModal"><div class="modalBox"><h3>Edit - Same Patient</h3><input id="eName" placeholder="Name"><input id="eShri" disabled><input id="eContact" placeholder="Contact"><input id="ePmjay" placeholder="PMJAY"><input id="eAddr" placeholder="Address"><div class="mBtns"><button class="cancel" onclick="closeEdit()">Cancel</button><button class="save" onclick="saveEdit()">Update</button></div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let allPatients=[],filtered=[],editIndex=-1;
window.toggleSide=()=>{let s=document.getElementById('side');let c=document.getElementById('content');if(innerWidth<=900){s.classList.toggle('open');}else{s.classList.toggle('closed');c.classList.toggle('full');}};
window.closeEdit=()=>document.getElementById('editModal').classList.remove('show');
window.openEdit=(idx)=>{editIndex=idx;let p=allPatients[idx];document.getElementById('eName').value=p.name;document.getElementById('eShri').value=p.shri;document.getElementById('eContact').value=p.contact;document.getElementById('ePmjay').value=p.pmjay;document.getElementById('eAddr').value=p.addr;document.getElementById('editModal').classList.add('show');};
window.applyFilter=()=>{let q=document.getElementById('search').value.toLowerCase();filtered=allPatients.filter(p=>!p.deleted && [p.name,p.shri].join(' ').toLowerCase().includes(q));renderTable();};
window.renderTable=()=>{let size=parseInt(document.getElementById('pageSize').value);let data=filtered.slice(0,size>=9999?filtered.length:size);let html='<tr><th>SL No</th><th>Patient</th><th>SHRI ID</th><th>Contact</th><th>PMJAY ID</th><th>Address</th><th>Action</th></tr>';data.forEach((p)=>{let realIdx=allPatients.indexOf(p);html+=`<tr><td><div class="sl">${filtered.indexOf(p)+1}</div></td><td><b>${p.name}</b></td><td><span class="shri">${p.shri}</span></td><td>${p.contact||'-'}</td><td>${p.pmjay||'-'}</td><td>${p.addr||'-'}</td><td><button class="btnEdit" onclick="openEdit(${realIdx})">Edit</button><button class="btnDel" onclick="deletePatient(${realIdx})">Delete</button></td></tr>`;});document.getElementById('tbl').innerHTML=html;document.getElementById('info').textContent=filtered.length+' patients';};
window.deletePatient=async(idx)=>{
 let p=allPatients[idx];
 if(!confirm('DELETE '+p.name+' ('+p.shri+') from ALL devices?')) return;
 document.getElementById('info').textContent='Deleting '+p.shri+'...';
 try{ await setDoc(doc(db,"patients",p.shri),{deleted:true,deletedAt:new Date().toISOString(),shriId:p.shri,shri:p.shri},{merge:true}); p.deleted=true; applyFilter(); document.getElementById('info').textContent='DELETED '+p.shri+' - All devices'; }catch(e){ alert('Delete failed: '+e.message); }
};
async function init(){
 allPatients=(typeof patientData!=='undefined'?patientData:[]).map(p=>({name:String(p.patientName||p.name||'').trim(),shri:String(p.shriId||p.shri||'').trim(),contact:String(p.contactNo||p.contact||'').trim(),pmjay:String(p.pmjayId||p.pmjay||'').trim(),addr:String(p.address||p.addr||'').trim(),deleted:false}));
 try{const snap=await getDocs(collection(db,"patients"));snap.forEach(d=>{let c=d.data();let shriId=(c.shriId||c.shri||d.id).trim();let ex=allPatients.find(x=>x.shri===shriId);if(c.deleted){if(ex) ex.deleted=true;return;}if(ex){ex.name=c.patientName||c.name||ex.name;ex.contact=c.contactNo||c.contact||ex.contact;ex.pmjay=c.pmjayId||c.pmjay||ex.pmjay;ex.addr=c.address||c.addr||ex.addr;}else{allPatients.push({name:c.patientName||c.name||'',shri:shriId,contact:c.contactNo||c.contact||'',pmjay:c.pmjayId||c.pmjay||'',addr:c.address||c.addr||'',deleted:false});}});}catch(e){}
 applyFilter();
}
window.saveEdit=async()=>{
 let p=allPatients[editIndex];
 let shriId=document.getElementById('eShri').value.trim();
 let updated={patientName:document.getElementById('eName').value.trim(),name:document.getElementById('eName').value.trim(),shriId:shriId,shri:shriId,contactNo:document.getElementById('eContact').value.trim(),contact:document.getElementById('eContact').value.trim(),pmjayId:document.getElementById('ePmjay').value.trim(),pmjay:document.getElementById('ePmjay').value.trim(),address:document.getElementById('eAddr').value.trim(),addr:document.getElementById('eAddr').value.trim(),deleted:false,updatedAt:new Date().toISOString()};
 p.name=updated.name;p.contact=updated.contact;p.pmjay=updated.pmjay;p.addr=updated.addr;p.deleted=false;
 closeEdit();applyFilter();
 try{ await setDoc(doc(db,"patients",shriId),updated,{merge:true}); document.getElementById('info').textContent='Updated '+shriId+' - Same patient (not new)'; }catch(e){ alert(e.message); }
};
init();
</script>
</body>
</html>
