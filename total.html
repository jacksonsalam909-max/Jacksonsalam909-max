<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Total Patients - SHIJA Dialysis</title>
<script src="Patient.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Segoe UI',system-ui}
body{background:#f6f7fb;color:#1a2332;display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}
.top{height:68px;background:#0b1b32;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #132845;position:sticky;top:0;z-index:40}
.logoText{line-height:1}
.shija{font-size:28px;font-weight:900;color:#ffffff!important}
.dialysis{font-size:15px;font-weight:600;color:#ffffff!important;opacity:1;margin-top:1px;letter-spacing:0.5px}
.ham{width:38px;height:38px;border-radius:10px;background:#132845;border:1px solid #1e3a5f;color:#fff;font-size:20px;cursor:pointer;display:grid;place-items:center}
.admin{display:flex;align-items:center;gap:10px;color:#fff}
.ad{width:44px;height:44px;border-radius:50%;background:#1868db;color:#fff;display:grid;place-items:center;font-weight:800}
.side{position:fixed;left:0;top:68px;bottom:0;width:240px;background:#0b1b32;padding:18px 10px;display:flex;flex-direction:column;gap:6px;transition:.35s;z-index:30}
.side.closed{transform:translateX(-100%)}
.side a{padding:13px 14px;border-radius:10px;text-decoration:none;color:#8ea0bf;font-weight:600;font-size:14px}
.side a.active{background:#132845;color:#fff;border-left:3px solid #1868db}
.content{flex:1;margin-left:240px;padding:22px;transition:.35s}
.content.full{margin-left:0}
.overlay{position:fixed;inset:0;top:68px;background:#0003;z-index:20;display:none}
.overlay.show{display:block}
.hrow{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.hrow h1{font-size:36px;font-weight:900;color:#1e293b}
.hrow p{color:#64748b;font-size:15px;margin-top:4px}
.export{padding:8px 16px;border-radius:8px;border:1.5px solid #1868db;color:#1868db;background:#fff;font-weight:700;cursor:pointer}
.filterRow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.searchBox{flex:1;min-width:260px}
.searchBox input{width:100%;padding:11px 14px;border-radius:10px;border:1.5px solid #cbd5e1;background:#fff;color:#1e293b;outline:0;font-size:14px}
.sel{padding:8px 12px;border-radius:8px;border:1.5px solid #cbd5e1;background:#fff;font-weight:700;font-size:13px}
.tableWrap{background:#fff;border:1.5px solid #e2e8f0;border-radius:14px;overflow:hidden}
table{width:100%;border-collapse:collapse;min-width:850px}
th{padding:14px 12px;font-size:12px;color:#64748b;font-weight:600;text-align:left;background:#f8fafc;border-bottom:1px solid #e2e8f0}
td{padding:14px 12px;font-size:13px;border-bottom:1px solid #f1f5f9;color:#334155;vertical-align:middle}
tr.dataRow:hover{background:#f8fafc;cursor:pointer}
tr.dataRow.selected{background:#eef4ff}
.sl{font-weight:800;color:#0f172a;background:#f1f5f9;width:36px;height:28px;display:grid;place-items:center;border-radius:6px;font-size:12px}
.shri{background:#1868db;color:#fff;padding:4px 10px;border-radius:6px;font-weight:700;font-size:12px;display:inline-block}
.btnEdit{padding:6px 14px;border-radius:6px;border:0;background:#1868db;color:#fff;font-weight:700;font-size:12px;cursor:pointer}
.detailBox{margin-top:22px;background:#0b1b32;border-radius:14px;padding:24px;display:none}
.detailBox.show{display:block}
.detailBox h3{color:#fff;font-size:22px;font-weight:800;margin-bottom:18px}
.line{padding:14px 0;border-bottom:1px solid #132845;display:flex;gap:12px;font-size:15px}
.line b{width:140px;color:#8ea0bf;font-weight:600;flex-shrink:0}
.line span{color:#ffffff;font-weight:600}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap;gap:10px}
.pgBtns{display:flex;gap:6px}
.pg{padding:6px 12px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;color:#475569;cursor:pointer;font-weight:600;font-size:12px}
.pg.active{background:#1868db;color:#fff;border-color:#1868db}
.modal{position:fixed;inset:0;background:#0006;z-index:99;display:none;place-items:center}
.modal.show{display:grid}
.modalBox{background:#fff;border-radius:14px;padding:18px;width:90%;max-width:420px}
.modalBox input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;margin:6px 0}
.mBtns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.mBtns button{padding:8px 14px;border-radius:8px;border:0;cursor:pointer;font-weight:700}
.save{background:#1868db;color:#fff}.cancel{background:#f1f5f9;color:#334155}
@media(max-width:900px){.side{transform:translateX(-100%)}.side.open{transform:translateX(0)}.content{margin-left:0}}
</style>
</head>
<body>
<div class="top">
<div style="display:flex;gap:12px;align-items:center">
<button class="ham" onclick="toggleSide()">☰</button>
<div class="logoText"><div class="shija">SHIJA</div><div class="dialysis">Dialysis</div></div>
</div>
<div class="admin"><div style="text-align:right"><div style="font-weight:800;font-size:15px;color:#fff">Admin</div><div style="font-size:12px;color:#8ea0bf">AD</div></div><div class="ad">AD</div></div>
</div>

<div class="side" id="side">
<a href="index.html">Home</a>
<a href="total.html" class="active">Total Patient</a>
<a href="add.html">Add Patient</a>
<a href="kft.html">KFT Report</a>
<a href="discharge.html">Discharge Patient</a>
<a href="daily-dialysis.html">Daily Dialysis</a>
</div>
<div class="overlay" id="overlay" onclick="toggleSide()"></div>

<div class="content" id="content">
<div class="hrow"><div><h1>Total Patients</h1><p>Manage all patients</p></div><div style="display:flex;gap:10px;align-items:center"><span id="info" style="color:#64748b;font-size:13px"></span><button class="export">Export</button></div></div>

<div class="filterRow">
<div class="searchBox"><input id="search" placeholder="Search by name, SHRI ID, contact, address" oninput="onSearch()"></div>
<select id="pageSize" class="sel" onchange="changeSize()"><option value="10" selected>10</option><option value="20">20</option><option value="30">30</option><option value="40">40</option><option value="50">50</option><option value="9999">All</option></select>
</div>

<div class="tableWrap"><div style="overflow-x:auto"><table id="tbl"></table></div></div>
<div class="pager"><div></div><div class="pgBtns" id="pager"></div></div>

<div class="detailBox" id="detailBox">
<div style="display:flex;justify-content:space-between;align-items:center"><h3>Selected Patient Detail</h3><button onclick="closeDetail()" style="background:#132845;border:1px solid #1e3a5f;color:#fff;padding:6px 12px;border-radius:6px;cursor:pointer">Close</button></div>
<div id="detailLines"></div>
</div>

</div>

<div class="modal" id="editModal">
<div class="modalBox"><h3 style="color:#0f172a;margin-bottom:8px">Edit Patient</h3><input id="eName" placeholder="Patient Name"><input id="eShri" placeholder="SHRI ID"><input id="eContact" placeholder="Contact"><input id="ePmjay" placeholder="PMJAY ID"><input id="eAddr" placeholder="Address"><div class="mBtns"><button class="cancel" onclick="closeEdit()">Cancel</button><button class="save" onclick="saveEdit()">Save</button></div></div>
</div>

<script>
function toggleSide(){let s=document.getElementById('side'),c=document.getElementById('content'),o=document.getElementById('overlay');if(innerWidth<=900){s.classList.toggle('open');o.classList.toggle('show')}else{s.classList.toggle('closed');c.classList.toggle('full')}}
let allPatients=(typeof patientData!=='undefined'?patientData:[]).map((p,i)=>({name:p.patientName||p.name||['Ramesh Sharma','Priya Agarwal','Arjun Kumar','Sunita Kulkarni','Vikram Mehta','Neha Lal'][i%6],shri:p.shriId||`SHRI-${10042+i}`,contact:p.contactNo||`+91 98${765+i} 43210`,pmjay:p.pmjayId||`PMJAY-2210${9+i}`,addr:p.address||['Pune, Maharashtra','Nagpur, Maharashtra','Nashik, Maharashtra','Mumbai, Maharashtra','Aurangabad, Maharashtra','Kolhapur, Maharashtra'][i%6],age:p.age||[58,45,62,51,39,47][i%6],gender:p.gender||(i%2==0?'Male':'Female')}));
let filtered=[],curPage=1,pageSize=10,editIndex=-1,selectedIndex=-1;
function onSearch(){curPage=1;applyFilter();}
function changeSize(){pageSize=parseInt(document.getElementById('pageSize').value);curPage=1;renderTable();}
function applyFilter(){let q=(document.getElementById('search').value||'').toLowerCase();filtered=allPatients.filter(p=>[p.name,p.shri,p.contact,p.addr].join(' ').toLowerCase().includes(q));renderTable();}
function renderTable(){
 let totalPages=pageSize>=9999?1:Math.ceil(filtered.length/pageSize)||1; if(curPage>totalPages) curPage=totalPages;
 let start=(curPage-1)*pageSize; let end=pageSize>=9999?filtered.length:start+pageSize; let data=filtered.slice(start,end);
 let html='<tr><th>SL No</th><th>Patient</th><th>SHRI ID</th><th>Contact</th><th>PMJAY ID</th><th>Address</th><th>Action</th></tr>';
 data.forEach((p,i)=>{
  let realIdx=filtered.indexOf(p); let sl=start+i+1; let sel=realIdx===selectedIndex?'selected':'';
  html+=`<tr class="dataRow ${sel}" onclick="selectPatient(${realIdx},${sl})"><td><div class="sl">${sl}</div></td><td><div><div style="font-weight:800;color:#0f172a">${p.name}</div><div style="font-size:12px;color:#64748b">${p.gender} - ${p.age} yrs</div></div></td><td><span class="shri">${p.shri}</span></td><td style="font-weight:600">${p.contact}</td><td>${p.pmjay}</td><td>${p.addr}</td><td onclick="event.stopPropagation()"><button class="btnEdit" onclick="openEdit(${realIdx})">Edit</button></td></tr>`;
 });
 if(data.length===0) html+='<tr><td colspan="7" style="text-align:center;padding:24px;color:#94a3b8">No patients found</td></tr>';
 document.getElementById('tbl').innerHTML=html;
 document.getElementById('info').textContent=`${filtered.length?start+1:0}-${Math.min(end,filtered.length)} of ${filtered.length} patients`;
 let pgHtml=`<button class="pg" ${curPage<=1?'disabled':''} onclick="goPage(${curPage-1})">Prev</button>`; for(let i=1;i<=Math.min(totalPages,6);i++) pgHtml+=`<button class="pg ${i===curPage?'active':''}" onclick="goPage(${i})">${i}</button>`; if(totalPages>6) pgHtml+=`<span style="color:#64748b;padding:6px">...${totalPages}</span>`; pgHtml+=`<button class="pg" ${curPage>=totalPages?'disabled':''} onclick="goPage(${curPage+1})">Next</button>`; document.getElementById('pager').innerHTML=pgHtml;
}
function goPage(n){curPage=n; renderTable();}
function selectPatient(idx, sl){
 selectedIndex=idx; let p=filtered[idx];
 document.getElementById('detailLines').innerHTML=`
 <div class="line"><b>SL No :</b><span>${sl}</span></div>
 <div class="line"><b>Patient Name :</b><span>${p.name}</span></div>
 <div class="line"><b>SHRI ID :</b><span>${p.shri}</span></div>
 <div class="line"><b>Contact No :</b><span>${p.contact}</span></div>
 <div class="line"><b>PMJAY ID :</b><span>${p.pmjay}</span></div>
 <div class="line"><b>Address :</b><span>${p.addr}</span></div>
 <div class="line"><b>Age :</b><span>${p.age} years</span></div>
 <div class="line"><b>Gender :</b><span>${p.gender}</span></div>`;
 document.getElementById('detailBox').classList.add('show');
 renderTable();
 document.getElementById('detailBox').scrollIntoView({behavior:'smooth'});
}
function closeDetail(){document.getElementById('detailBox').classList.remove('show'); selectedIndex=-1; renderTable();}
function openEdit(idx){editIndex=idx; let p=filtered[idx]; document.getElementById('eName').value=p.name; document.getElementById('eShri').value=p.shri; document.getElementById('eContact').value=p.contact; document.getElementById('ePmjay').value=p.pmjay; document.getElementById('eAddr').value=p.addr; document.getElementById('editModal').classList.add('show');}
function closeEdit(){document.getElementById('editModal').classList.remove('show');}
function saveEdit(){let p=filtered[editIndex]; p.name=document.getElementById('eName').value; p.shri=document.getElementById('eShri').value; p.contact=document.getElementById('eContact').value; p.pmjay=document.getElementById('ePmjay').value; p.addr=document.getElementById('eAddr').value; closeEdit(); renderTable(); if(selectedIndex===editIndex) selectPatient(editIndex, editIndex+1);}
applyFilter();
</script>
</body>
</html>
