<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Total Patients - SHIJA Dialysis</title>
<script src="Patient.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Segoe UI',system-ui}
body{background:#f6f7fb;color:#1a2332;display:flex;flex-direction:column;min-height:100vh}
.top{height:68px;background:#0b1b32;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:100}
.shija{font-size:28px;font-weight:900;color:#fff}.dialysis{font-size:15px;font-weight:600;color:#fff}
.hamSide{width:46px;height:36px;border-radius:10px;background:#1868db;border:0;color:#fff;font-size:20px;cursor:pointer;display:grid;place-items:center}
.ad{width:44px;height:44px;border-radius:50%;background:#1868db;color:#fff;display:grid;place-items:center;font-weight:800}
.side{position:fixed;left:0;top:68px;bottom:0;width:260px;background:#0b1b32;padding:18px 10px;display:flex;flex-direction:column;gap:6px;z-index:90}
.side a{padding:13px 14px;border-radius:10px;text-decoration:none;color:#8ea0bf;font-weight:600;font-size:14px}
.side a.active{background:#132845;color:#fff;border-left:3px solid #1868db}
.content{flex:1;padding:22px;margin-left:260px}
.filterRow{display:flex;gap:10px;margin-bottom:14px}
.searchBox{flex:1;min-width:260px}.searchBox input{width:100%;padding:11px 14px;border-radius:10px;border:1.5px solid #cbd5e1;background:#fff;outline:0}
.sel{padding:8px 12px;border-radius:8px;border:1.5px solid #cbd5e1;background:#fff;font-weight:700}
.tableWrap{background:#fff;border:1.5px solid #e2e8f0;border-radius:14px;overflow:hidden}
table{width:100%;border-collapse:collapse;min-width:900px}
th{padding:14px 12px;font-size:12px;color:#64748b;text-align:left;background:#f8fafc;border-bottom:1px solid #e2e8f0}
td{padding:14px 12px;font-size:13px;border-bottom:1px solid #f1f5f9;color:#334155}
.sl{font-weight:800;background:#f1f5f9;width:36px;height:28px;display:grid;place-items:center;border-radius:6px;font-size:12px}
.shri{background:#1868db;color:#fff;padding:4px 10px;border-radius:6px;font-weight:700;font-size:12px;display:inline-block}
.pmjayPlain{font-weight:600;color:#334155}
.pmjayCell{cursor:pointer}.pmjayCell:hover.pmjayPlain{color:#1868db;text-decoration:underline}
.btnView{padding:6px 10px;border-radius:6px;border:0;background:#10b981;color:#fff;font-weight:800;font-size:12px;cursor:pointer;margin-right:4px}
.btnEdit{padding:6px 14px;border-radius:6px;border:0;background:#1868db;color:#fff;font-weight:700;font-size:12px;cursor:pointer}
.detailBox{margin-top:14px;background:#fff;border:1.5px solid #1868db;border-radius:10px;display:none;overflow:hidden}.detailBox.show{display:block}
.detailHead{display:flex;justify-content:space-between;padding:10px 14px;background:#f8fafc;border-bottom:1px solid #e2e8f0}
.detailGrid{display:grid;grid-template-columns:50px 180px 110px 110px 130px 1fr 70px;gap:0}
.detailGrid div{padding:14px 10px;font-size:13px;border-right:1px solid #f1f5f9}
.pg{padding:6px 12px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;cursor:pointer;font-weight:600;font-size:12px}.pg.active{background:#1868db;color:#fff}
.modal{position:fixed;inset:0;background:#0006;z-index:99;display:none;place-items:center}.modal.show{display:grid}
.modalBox{background:#fff;border-radius:14px;padding:18px;width:90%;max-width:420px}.modalBox input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;margin:6px 0}
.mBtns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.mBtns button{padding:8px 14px;border-radius:8px;border:0;font-weight:700;cursor:pointer}.save{background:#1868db;color:#fff}.cancel{background:#f1f5f9}
</style>
</head>
<body>
<div class="top"><div style="display:flex;gap:12px;align-items:center"><button class="hamSide" onclick="document.getElementById('side').classList.toggle('closed');document.getElementById('content').classList.toggle('full')">☰</button><div><div class="shija">SHIJA</div><div class="dialysis">Dialysis</div></div></div><div class="ad">AD</div></div>
<div class="side" id="side"><a href="index.html">Home</a><a href="total.html" class="active">Total Patient</a><a href="daily.html">Daily Dialysis</a><a href="discharge.html">Discharge Patient</a><a href="kft.html">KFT Report</a><a href="add.html">Add Patient</a><a href="bill.html">Bill</a></div>
<div class="content" id="content">
<h1>Total Patients</h1><p style="color:#64748b;margin-bottom:14px">Manage all patients - <span id="info"></span></p>
<div class="filterRow"><div class="searchBox"><input id="search" placeholder="Search PMJAY ID, name, SHRI..." oninput="onSearch()"></div><select id="pageSize" class="sel" onchange="changeSize()"><option value="10" selected>10</option><option value="20">20</option><option value="50">50</option><option value="9999">All</option></select></div>
<div class="tableWrap"><div style="overflow-x:auto"><table id="tbl"></table></div></div>
<div style="margin-top:10px;text-align:right" id="pager"></div>
<div class="detailBox" id="detailBox"><div class="detailHead"><h3>Selected Patient</h3><button onclick="closeDetail()" style="padding:4px 10px;border-radius:6px;border:1px solid #cbd5e1;cursor:pointer">Close</button></div><div class="detailGrid" id="detailLines"></div></div>
</div>
<div class="modal" id="editModal"><div class="modalBox"><h3>Edit Patient</h3><input id="eName" placeholder="Name"><input id="eShri" placeholder="SHRI ID"><input id="eContact" placeholder="Contact"><input id="ePmjay" placeholder="PMJAY ID"><input id="eAddr" placeholder="Address"><div class="mBtns"><button class="cancel" onclick="closeEdit()">Cancel</button><button class="save" onclick="saveEdit()">Save</button></div></div></div>
<script>
let allPatients=(typeof patientData!=='undefined'?patientData:[]).map(p=>({name:String(p.patientName||p.name||'').trim(),shri:String(p.shriId||p.shri||'').trim(),contact:String(p.contactNo||p.contact||'').trim(),pmjay:String(p.pmjayId||p.pmjay||'').trim(),addr:String(p.address||p.addr||'').trim(),age:p.age||'',gender:p.gender||''}));
let filtered=[],curPage=1,pageSize=10,editIndex=-1,selectedIndex=-1;
function onSearch(){curPage=1;applyFilter();}
function changeSize(){pageSize=parseInt(document.getElementById('pageSize').value);curPage=1;renderTable();}
function applyFilter(){let q=document.getElementById('search').value.toLowerCase().trim();filtered=allPatients.filter(p=>[p.name,p.shri,p.contact,p.addr,p.pmjay].join(' ').toLowerCase().includes(q));renderTable();}
function copyPmjay(id, el){
 let cleanId=String(id).trim();
 navigator.clipboard.writeText(cleanId);
 let span=el.querySelector?el.querySelector('.pmjayPlain'):el;
 let orig=span.innerText; span.innerText='Copied!'; setTimeout(()=>span.innerText=orig,800);
}
function renderTable(){
 let totalPages=pageSize>=9999?1:Math.ceil(filtered.length/pageSize)||1; if(curPage>totalPages) curPage=totalPages;
 let start=(curPage-1)*pageSize; let end=pageSize>=9999?filtered.length:start+pageSize; let data=filtered.slice(start,end);
 let html='<tr><th>SL No</th><th>Patient</th><th>SHRI ID</th><th>Contact</th><th>PMJAY ID</th><th>Address</th><th>Action</th></tr>';
 data.forEach((p,i)=>{
  let realIdx=filtered.indexOf(p); let sl=start+i+1;
  let pmjayClean=String(p.pmjay).trim();
  html+=`<tr><td><div class="sl">${sl}</div></td><td><b>${p.name}</b><div style="font-size:11px;color:#64748b">${p.gender} ${p.age}</div></td><td><span class="shri">${p.shri}</span></td><td>${p.contact}</td><td class="pmjayCell" onclick="copyPmjay('${pmjayClean}', this)" title="Click anywhere to copy PMJAY ID"><span class="pmjayPlain">${pmjayClean}</span></td><td>${p.addr}</td><td><button class="btnView" onclick="selectPatient(${realIdx},${sl})">V</button><button class="btnEdit" onclick="openEdit(${realIdx})">Edit</button></td></tr>`;
 });
 document.getElementById('tbl').innerHTML=html;
 document.getElementById('info').textContent=`${filtered.length?start+1:0}-${Math.min(end,filtered.length)} of ${filtered.length}`;
 let pgHtml=''; for(let i=1;i<=Math.min(totalPages,6);i++) pgHtml+=`<button class="pg ${i===curPage?'active':''}" onclick="goPage(${i})">${i}</button>`; document.getElementById('pager').innerHTML=pgHtml;
}
function goPage(n){curPage=n;renderTable();}
function selectPatient(idx, sl){
 selectedIndex=idx; let p=filtered[idx]; let pmjayClean=String(p.pmjay).trim();
 document.getElementById('detailLines').innerHTML=`<div><div class="sl">${sl}</div></div><div><b>${p.name}</b></div><div><span class="shri">${p.shri}</span></div><div>${p.contact}</div><div class="pmjayCell" onclick="copyPmjay('${pmjayClean}', this)"><span class="pmjayPlain">${pmjayClean}</span></div><div>${p.addr}</div><div><button onclick="closeDetail()">Close</button></div>`;
 document.getElementById('detailBox').classList.add('show');
}
function closeDetail(){document.getElementById('detailBox').classList.remove('show');}
function openEdit(idx){editIndex=idx;let p=filtered[idx];document.getElementById('eName').value=p.name.trim();document.getElementById('eShri').value=p.shri.trim();document.getElementById('eContact').value=p.contact.trim();document.getElementById('ePmjay').value=p.pmjay.trim();document.getElementById('eAddr').value=p.addr.trim();document.getElementById('editModal').classList.add('show');}
function closeEdit(){document.getElementById('editModal').classList.remove('show');}
function saveEdit(){let p=filtered[editIndex];p.name=document.getElementById('eName').value.trim();p.shri=document.getElementById('eShri').value.trim();p.contact=document.getElementById('eContact').value.trim();p.pmjay=document.getElementById('ePmjay').value.trim();p.addr=document.getElementById('eAddr').value.trim();closeEdit();renderTable();}
applyFilter();
</script>
</body>
</html>
