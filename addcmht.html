<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add CMHT Patient - SHIJA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter}
body{background:#f6f7fb;display:flex;flex-direction:column;min-height:100vh}
.top{height:64px;background:#0a1931;display:flex;align-items:center;padding:0 14px;justify-content:space-between;position:fixed;top:0;left:0;right:0;z-index:9999}
.top h2{color:#fff;font-size:16px;font-weight:800}
.menuBtn{width:44px;height:44px;border-radius:8px;border:1.5px solid #1e2d55;background:#13264d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.menuBtn span{display:block;width:20px;height:2px;background:#fff;pointer-events:none}
.mainWrap{display:flex;flex:1;margin-top:64px}
.side{width:260px;background:#0a1931;padding:16px 10px;position:fixed;left:0;top:64px;bottom:0;z-index:9998;overflow-y:auto;transition:0.3s;transform:translateX(-100%)}
.side.show{transform:translateX(0)!important}
.side a{padding:12px 14px;border-radius:10px;text-decoration:none;color:#8ea0c0;font-weight:600;font-size:14px;display:block;margin-bottom:4px}
.side a.active{background:#13264d;color:#fff}
.content{flex:1;padding:20px}
.sideOverlay{position:fixed;inset:0;top:64px;background:rgba(0,0,0,0.5);z-index:9997;display:none}
.sideOverlay.show{display:block}
.box{background:#fff;border:1.5px solid #e2e8f0;border-radius:14px;padding:24px;max-width:700px;width:100%}
.box input{width:100%;padding:13px;border:1.5px solid #cbd5e1;border-radius:10px;margin:9px 0}
.box label{font-size:12px;font-weight:700;color:#475569;margin-top:4px;display:block}
.btn{width:100%;padding:13px;background:#8b5cf6;color:#fff;border:0;border-radius:10px;font-weight:800;cursor:pointer;margin-top:14px}
.msg{margin:10px 0;padding:10px;border-radius:8px;font-size:13px;display:none}.msg.ok{display:block;background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}.msg.err{display:block;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.remarkTag{background:#ede9fe;color:#6d28d9;padding:6px 10px;border-radius:6px;font-weight:800;font-size:12px;display:inline-block;border:1px solid #ddd6fe}
</style>
</head>
<body>
<div class="top"><div style="display:flex;align-items:center;gap:10px"><div class="menuBtn" id="menuBtn" onclick="toggleMenu()"><span></span><span></span><span></span></div><h2>SHIJA Dialysis Management</h2></div><span style="color:#fff">Admin</span></div>
<div class="sideOverlay" id="overlay" onclick="toggleMenu()"></div>
<div class="mainWrap">
<div class="side" id="side">
<a href="index.html">Home</a>
<a href="total.html">PMJAY Total Patient</a>
<a href="cmht.html">CMHT Total Patient</a>
<a href="daily.html">Daily Dialysis</a>
<a href="discharge.html">Discharge Patient</a>
<a href="kft.html">PMJAY KFT REPORT</a>
<a href="add.html">ADD PMJAY Patient</a>
<a href="addcmht.html" class="active">Add CMHT Patient</a>
<a href="bill.html">Bill</a>
</div>
<div class="content" id="content">
<h1>Add CMHT Patient</h1><p style="color:#64748b;font-size:13px">Remark CMHT will be auto-added for every patient</p>
<div id="msgBox" class="msg"></div>
<div class="box">
<label>Patient Name *</label><input id="name" placeholder="Patient Name">
<label>SHRI ID</label><input id="shri" placeholder="e.g. SHRI123 - auto if empty">
<label>CMHT ID *</label><input id="cmht" placeholder="CMHT Card Number">
<label>Contact Number</label><input id="contact" placeholder="Contact Number">
<label>Aadhaar Number</label><input id="aadhaar" placeholder="12 digit Aadhaar" maxlength="12">
<label>Address</label><input id="addr" placeholder="Address">
<label>Remark</label><div style="margin:9px 0"><span class="remarkTag">CMHT</span> <small style="color:#64748b">Auto-added</small></div>
<input id="remark" type="hidden" value="CMHT">
<button class="btn" id="addBtn" onclick="addCMHT()">Add CMHT Patient</button>
</div>
</div>
</div>
<script>
function toggleMenu(){
 var s=document.getElementById('side');
 var o=document.getElementById('overlay');
 if(s.className.indexOf('show')===-1){
   s.className='side show';
   o.className='sideOverlay show';
 }else{
   s.className='side';
   o.className='sideOverlay';
 }
}
document.addEventListener('DOMContentLoaded',function(){
 var b=document.getElementById('menuBtn');
 if(b){
   b.addEventListener('touchstart',function(e){e.preventDefault();toggleMenu();},{passive:false});
 }
});
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);
function showMsg(t,ok){let b=document.getElementById('msgBox');b.textContent=t;b.className='msg '+(ok?'ok':'err');}
window.addCMHT=async()=>{
 let name=document.getElementById('name').value.trim();
 let shri=document.getElementById('shri').value.trim();
 let cmht=document.getElementById('cmht').value.trim();
 let contact=document.getElementById('contact').value.trim();
 let aadhaar=document.getElementById('aadhaar').value.trim();
 let addr=document.getElementById('addr').value.trim();
 let remark="CMHT";
 if(!name){showMsg('Enter Patient Name',false);return;}
 if(!cmht){showMsg('Enter CMHT ID',false);return;}
 if(!shri) shri='CMHT_'+Date.now().toString().slice(-6);
 let btn=document.getElementById('addBtn');btn.disabled=true;btn.textContent='Saving to Firebase...';
 let data={patientName:name,name:name,shriId:shri,shri:shri,cmhtId:cmht,cmht:cmht,pmjay:cmht,contactNo:contact,contact:contact,aadhaarNo:aadhaar,aadhaar:aadhaar,address:addr,addr:addr,remark:remark,remarks:remark,scheme:'CMHT',key:shri,createdAt:new Date().toISOString()};
 try{await setDoc(doc(db,"cmht_patients",shri),data);showMsg('✅ Added '+name+' ('+shri+') with Remark: CMHT - Now open CMHT Total Patient page',true);document.getElementById('name').value='';document.getElementById('shri').value='';document.getElementById('cmht').value='';document.getElementById('contact').value='';document.getElementById('aadhaar').value='';document.getElementById('addr').value='';btn.disabled=false;btn.textContent='Add CMHT Patient';}catch(e){btn.disabled=false;btn.textContent='Add CMHT Patient';showMsg('Error: '+e.message,false);}
};
</script>
</body>
</html>
