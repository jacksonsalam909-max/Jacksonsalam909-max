<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add CMHT Patient - SHIJA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
body{background:#f6f7fb;display:flex;flex-direction:column;min-height:100vh}
.top{height:64px;background:#0a1931;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:fixed;top:0;left:0;right:0;z-index:9999}
.top h2{color:#fff;font-size:16px;font-weight:800}
.menuBtn{width:44px;height:44px;border-radius:8px;border:1.5px solid #1e2d55;background:#13264d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}
.menuBtn span{display:block;width:20px;height:2px;background:#fff;pointer-events:none}
.mainWrap{display:flex;flex:1;margin-top:64px}
.side{width:260px;background:#0a1931;padding:16px 10px;position:fixed;left:0;top:64px;bottom:0;z-index:9998;overflow-y:auto;transition:0.3s;transform:translateX(-100%)}
.side.show{transform:translateX(0)!important}
.side a{padding:12px 14px;border-radius:10px;text-decoration:none;color:#8ea0c0;font-weight:600;font-size:14px;display:block;margin-bottom:4px}
.side a.active{background:#1a56db;color:#fff;font-weight:700}
.content{flex:1;padding:12px;width:100%;max-width:100%}
.sideOverlay{position:fixed;inset:0;top:64px;background:rgba(0,0,0,0.5);z-index:9997;display:none}
.sideOverlay.show{display:block}
.card{background:#fff;border:1.5px solid #e2e8f0;border-radius:16px;padding:16px;width:100%}
label{font-size:12px;font-weight:700;color:#334155;display:block;margin:14px 0 6px}
input,textarea,select{width:100%;padding:13px 14px;border:1.5px solid #e2e8f0;border-radius:10px;outline:0;font-size:15px;font-weight:600;background:#fff}
input:focus,textarea:focus,select:focus{border-color:#1868db}
textarea{height:80px;resize:none}
.row{display:flex;gap:10px}
.row>div{flex:1}
.btn{width:100%;padding:14px;border:0;border-radius:10px;font-weight:800;font-size:15px;cursor:pointer;margin-top:18px}
.btnBlue{background:#1868db;color:#fff}
.status{margin-top:12px;padding:10px;border-radius:8px;font-size:12px;font-weight:700;display:none}
.status.ok{background:#dcfce7;color:#166534;display:block}
.status.err{background:#fee2e2;color:#991b1b;display:block}
.status.load{background:#eff6ff;color:#1e40af;display:block}
</style>
</head>
<body>
<div class="top">
<div style="display:flex;align-items:center;gap:10px">
<button type="button" class="menuBtn" id="menuBtn"><span></span><span></span><span></span></button>
<h2>SHIJA Dialysis Management</h2>
</div>
<span style="color:#10b981;font-weight:700;font-size:12px" id="fbStatus">Firebase Connected</span>
</div>
<div class="sideOverlay" id="overlay"></div>
<div class="mainWrap">
<div class="side" id="side">
<a href="index.html">HOME</a>
<a href="total.html">TOTAL PATIENT</a>
<a href="cmht.html">CMHT TOTAL PATIENT</a>
<a href="cmhtkft.html">CMHT KFT REPORT</a>
<a href="cmhtdaily.html">CMHT DAILY DIALYSIS</a>
<a href="addcmht.html" class="active">CMHT ADD PATIENT</a>
<a href="daily.html">DAILY DIALYSIS</a>
<a href="discharge.html">DISCHARGE PATIENT</a>
<a href="kft.html">KFT REPORT</a>
<a href="add.html">ADD PATIENT</a>
<a href="bill.html">BILL</a>
<a href="dischargesummary.html">DISCHARGE SUMMARY</a>
<a href="upload.html" style="background:#1868db;color:#fff;font-weight:800;margin-top:10px;border-radius:10px;padding:12px 14px;text-align:center">UPLOAD PATIENTS</a>
</div>
<div class="content">
<div class="card">

<label>PATIENT NAME *</label>
<input id="pName">

<label>SHRI ID *</label>
<input id="shriId">

<label>CONTACT NUMBER</label>
<input id="contact">

<label>CMHT ID *</label>
<input id="cmhtId">

<label>AADHAAR NUMBER</label>
<input id="aadhaar" maxlength="12">

<div class="row">
<div>
<label>AGE</label>
<input id="age" type="number" placeholder="">
</div>
<div>
<label>SEX</label>
<select id="sex">
<option value=""></option>
<option value="MALE">MALE</option>
<option value="FEMALE">FEMALE</option>
<option value="OTHER">OTHER</option>
</select>
</div>
</div>

<label>ADDRESS</label>
<textarea id="address"></textarea>

<button class="btn btnBlue" id="saveBtn" onclick="savePatient()">SAVE TO FIREBASE - CMHT</button>
<div id="status" class="status"></div>
</div>
</div>
</div>

<script>
function toggleMenu(){ var s=document.getElementById('side'); var o=document.getElementById('overlay'); s.classList.toggle('show'); o.classList.toggle('show'); }
document.addEventListener('DOMContentLoaded',function(){
 var b=document.getElementById('menuBtn'); var o=document.getElementById('overlay'); var lastTap=0;
 function handle(e){ var now=Date.now(); if(now-lastTap<400) return; lastTap=now; if(e){ e.preventDefault(); e.stopPropagation(); } toggleMenu(); }
 if(b){ b.addEventListener('click', handle); b.addEventListener('touchend', handle, {passive:false}); }
 if(o){ o.addEventListener('click', toggleMenu); o.addEventListener('touchend', handle, {passive:false}); }
});
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
function showStatus(msg,type){ let s=document.getElementById('status'); s.textContent=msg; s.className='status '+type; }
window.savePatient = async () => {
 let name=document.getElementById('pName').value.trim();
 let shri=document.getElementById('shriId').value.trim();
 let contact=document.getElementById('contact').value.trim();
 let cmht=document.getElementById('cmhtId').value.trim();
 let aadhaar=document.getElementById('aadhaar').value.trim();
 let age=document.getElementById('age').value.trim();
 let sex=document.getElementById('sex').value.trim();
 let addr=document.getElementById('address').value.trim();
 if(!name || !shri || !cmht){ showStatus('Fill Name, SHRI ID, CMHT ID','err'); return; }
 let btn=document.getElementById('saveBtn'); btn.disabled=true; btn.textContent='SAVING...'; showStatus('Saving...','load');
 let key = shri.replace(/[^a-zA-Z0-9]/g,'_');
 let data = { patientName:name, name:name, shriId:shri, shri:shri, contactNo:contact, contact:contact, cmhtId:cmht, aadhaarNo:aadhaar, aadhaar:aadhaar, age:age, sex:sex, address:addr, addr:addr, key:key, deleted:false, createdAt:new Date().toISOString(), timestamp:serverTimestamp() };
 try{
   await setDoc(doc(db,"cmht_patients",key), data, {merge:true});
   showStatus('SAVED! '+name+' - Synced All PCs','ok');
   btn.textContent='SAVED - ADD ANOTHER'; btn.disabled=false;
   document.getElementById('pName').value=''; document.getElementById('shriId').value=''; document.getElementById('contact').value=''; document.getElementById('cmhtId').value=''; document.getElementById('aadhaar').value=''; document.getElementById('age').value=''; document.getElementById('sex').value=''; document.getElementById('address').value='';
 }catch(e){ showStatus('Error: '+e.message,'err'); btn.disabled=false; btn.textContent='SAVE TO FIREBASE - CMHT'; }
};
</script>
</body>
</html>
