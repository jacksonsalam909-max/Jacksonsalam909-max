<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHIJA Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{
  height:100vh;width:100vw;
  background: #000 url('shija_dome_night.jpg') center/cover no-repeat;
  display:flex;justify-content:flex-end;align-items:center;
  padding-right:5vw;overflow:hidden;position:relative;
}
.top{position:absolute;top:24px;left:28px;z-index:10;color:#fff;font-size:15px;letter-spacing:1.5px;font-weight:500}
.card{
  position:relative;z-index:10;width:440px;max-width:92vw;
  background:rgba(10,15,25,.32);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.18);
  border-radius:24px;padding:32px 28px;
}
.card h1{color:#fff;font-size:32px;text-align:left;font-weight:700}
.card .sub{color:#d0d9e6;font-size:14px;margin:8px 0 24px}
.field{
  background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.22);
  border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center;margin:12px 0;
}
.field input{flex:1;background:transparent;border:0;outline:none;color:#fff;font-size:15px}
.field input::placeholder{color:#aab8ca}
.btn{width:100%;background:#f8d210;border:0;border-radius:14px;padding:15px;font-weight:800;font-size:16px;cursor:pointer;margin-top:16px}
.foot{text-align:center;color:#9aa8b8;font-size:11px;letter-spacing:1.5px;margin-top:22px}
@media(max-width:700px){body{justify-content:center;padding-right:0} .top{font-size:12px}}
</style>
</head>
<body>
<div class="top">SHIJA HOSPITALS • Dialysis Dashboard</div>
<div class="card">
  <h1>Welcome Back</h1>
  <p class="sub">Enter your details to access your account</p>
  <div class="field">👤<input id="u" placeholder="Username"></div>
  <div class="field">🔒<input id="p" type="password" placeholder="Password"></div>
  <button class="btn" onclick="login()">Sign In</button>
  <div class="foot">OR CONTINUE WITH</div>
</div>
<script>
function login(){
 let u=document.getElementById('u').value;
 let p=document.getElementById('p').value;
 if(u==='shija' && p==='shija123'){
   localStorage.setItem('shija_login','yes');
   location.href='index.html';
 }else alert('Username: shija  Password: shija123');
}
</script>
</body>
</html>
