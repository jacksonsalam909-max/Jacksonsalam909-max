<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHIJA Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{background:linear-gradient(135deg,#06182e,#0f4c75,#1e7bb8);min-height:100vh;display:flex;align-items:center;justify-content:center}
.box{background:#fff;border-radius:18px;padding:28px 22px;width:92%;max-width:360px;box-shadow:0 16px 32px #0004;text-align:center}
.box h2{color:#0f4c75;margin-bottom:6px}
.box p{color:#64748b;font-size:13px;margin-bottom:18px}
input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin:8px 0;outline:0}
input:focus{border-color:#1e7bb8}
.btn{width:100%;padding:12px;border:0;border-radius:10px;background:#0f4c75;color:#fff;font-weight:800;cursor:pointer;margin-top:10px}
.small{font-size:11px;color:#94a3b8;margin-top:10px}
</style></head><body>
<div class="box">
<h2>SHIJA HOSPITALS</h2>
<p>Dialysis Management Login</p>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button class="btn" onclick="doLogin()">Login</button>
<p class="small">Username: <b>admin</b> | Password: <b>shija123</b></p>
<p id="msg" style="color:red;font-size:13px;margin-top:8px"></p>
</div>
<script>
function doLogin(){
 let u=document.getElementById('user').value.trim();
 let p=document.getElementById('pass').value.trim();
 // YOUR PASSWORD AND USERNAME
 if(u==='admin' && p==='shija123'){
   localStorage.setItem('shija_logged','1');
   location.href='index.html';
 }else{
   document.getElementById('msg').textContent='Wrong username or password! Use admin / shija123';
 }
}
</script>
</body></html>
