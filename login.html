<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name=viewport content="width=device-width,initial-scale=1"><title>SHIJA Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{min-height:100vh;background:#06182e;background-image:url('Shija_dome_night.jpg');background-size:cover;background-position:center;position:relative;overflow:hidden}
.box{position:absolute;left:24px;bottom:24px;background:rgba(255,255,255,0.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:22px;padding:18px 18px 16px;width:300px;box-shadow:0 10px 30px #0004;border:1px solid rgba(255,255,255,0.6)}
label{font-size:11px;font-weight:600;color:#1a365d;display:block;margin:8px 0 4px 2px;text-align:left}
.input-wrap{position:relative}
.input-wrap span{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px}
.input-wrap input{width:100%;padding:7px 10px 7px 28px;border:0;border-radius:7px;background:#ffffffee;font-size:12px;outline:0;box-shadow:0 1px 3px #0001}
.btn{width:100%;padding:8px;border:0;border-radius:8px;background:#1565d8;color:#fff;font-weight:700;font-size:12px;cursor:pointer;margin-top:12px}
#msg{font-size:11px;color:#d32f2f;margin-top:6px;min-height:10px}
@media(max-width:600px){.box{left:50%;bottom:30px;transform:translateX(-50%);width:85%;max-width:320px}}
</style></head><body>
<div class="box">
<label>Username</label>
<div class="input-wrap"><span>👤</span><input id="user" value="admin"></div>
<label>Password</label>
<div class="input-wrap"><span>🔒</span><input id="pass" type="password" value="shija123"></div>
<button class="btn" onclick="login()">Login</button>
<p id="msg"></p>
</div>
<script>
function login(){
 let u=document.getElementById('user').value.trim();
 let p=document.getElementById('pass').value.trim();
 if(u==='admin' && p==='shija123'){
   localStorage.setItem('shija_logged','1');
   location.href='index.html';
 }else{document.getElementById('msg').innerText='Wrong password';}
}
</script>
</body></html>
