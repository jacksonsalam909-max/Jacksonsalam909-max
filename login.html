<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SHIJA DIALYSIS - LOGIN</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui}
body{background:#f1f5f9;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background-color:#f8fafc;background-image:radial-gradient(circle at 1px 1px, rgba(37,99,235,0.08) 1px, transparent 0);background-size:22px 22px}
.wrap{width:100%;max-width:420px}
.logoBox{text-align:center;margin-bottom:18px}
.logoBox img{width:72px;height:72px;object-fit:contain;background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:8px}
.logoBox h1{font-size:26px;font-weight:900;color:#0f172a;margin-top:10px;letter-spacing:-0.5px}
.logoBox p{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-top:4px}
.card{background:#fff;border:1.5px solid #e2e8f0;border-radius:18px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,0.06)}
.card h2{font-size:18px;font-weight:900;color:#0f172a}
.card p{font-size:13px;color:#64748b;font-weight:500;margin-top:4px}
.label{font-size:11px;font-weight:800;color:#475569;text-transform:uppercase;margin:16px 0 6px}
.input{width:100%;height:48px;padding:0 14px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:15px;font-weight:600;color:#0f172a;outline:none;background:#fff}
.input:focus{border-color:#2563eb}
.btn{width:100%;height:48px;border:0;border-radius:10px;font-weight:800;font-size:14px;cursor:pointer;margin-top:16px}
.btnAdmin{background:#0f172a;color:#fff}
.btnAdmin:hover{background:#2563eb}
.btnPublic{background:#fff;color:#0f172a;border:1.5px solid #e2e8f0;margin-top:10px}
.btnPublic:hover{border-color:#2563eb;color:#2563eb}
.divider{display:flex;align-items:center;gap:10px;margin:18px 0 0;color:#94a3b8;font-size:11px;font-weight:800;text-transform:uppercase}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:#e2e8f0}
.error{display:none;margin-top:10px;background:#fef2f2;border:1px solid #fecaca;color:#dc2626;font-size:12.5px;font-weight:700;padding:9px 10px;border-radius:8px}
.foot{text-align:center;margin-top:14px;font-size:11px;color:#94a3b8;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="logoBox">
    <img src="logoc.png" onerror="this.style.display='none'">
    <h1>SHIJA</h1>
    <p>Dialysis Care</p>
  </div>

  <div class="card">
    <h2>Admin Login</h2>
    <p>Admin only. For dialysis list, discharge, bill.</p>

    <div class="label">Admin Password</div>
    <input type="password" id="adminPass" class="input" placeholder="Enter admin password" autocomplete="current-password">

    <div class="error" id="loginError">Wrong password</div>

    <button class="btn btnAdmin" onclick="adminLogin()">LOGIN AS ADMIN →</button>

    <div class="divider">Public Access</div>

    <button class="btn btnPublic" onclick="goPublic()">Continue as Public User →</button>
    <p style="text-align:center;margin-top:10px;font-size:12px">No login needed for public / user pages.</p>
  </div>

  <div class="foot">System Online • SHIJA Hospital</div>
</div>

<script>
// === CHANGE ONLY THIS PASSWORD IF NEEDED ===
var ADMIN_PASSWORD = "shija123";

function adminLogin(){
  var p=document.getElementById('adminPass').value;
  if(p===ADMIN_PASSWORD){
    localStorage.setItem('shija_logged','1');
    localStorage.setItem('shija_login_time',Date.now().toString());
    location.href='index.html';
  }else{
    document.getElementById('loginError').style.display='block';
  }
}

function goPublic(){
  // Public user - NO login, NO password, NO localStorage check
  location.href='userindex.html';
}

document.getElementById('adminPass').addEventListener('keydown',function(e){
  if(e.key==='Enter') adminLogin();
});

// If already admin-logged in, go straight to admin home
if(localStorage.getItem('shija_logged')==='1'){
  // Don't auto-redirect, let user choose Admin / Public
}
</script>
</body>
</html>
