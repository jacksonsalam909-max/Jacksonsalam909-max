<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name=viewport content="width=device-width,initial-scale=1"><title>SHIJA Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{min-height:100vh;position:relative;overflow:hidden;background:#06182e}
.bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.25);z-index:1}
.box{position:fixed;left:24px;bottom:24px;z-index:2;background:rgba(255,255,255,0.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:20px;padding:16px;width:290px;box-shadow:0 10px 30px #0005}
label{font-size:11px;font-weight:600;color:#1a365d;display:block;margin:8px 0 4px 2px}
.input-wrap{position:relative}
.input-wrap span{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px}
.input-wrap input{width:100%;padding:7px 10px 7px 28px;border:0;border-radius:7px;background:#fff;font-size:12px;outline:0}
.btn{width:100%;padding:8px;border:0;border-radius:8px;background:#1565d8;color:#fff;font-weight:700;font-size:12px;cursor:pointer;margin-top:12px}
#msg{font-size:11px;color:red;margin-top:6px}
@media(max-width:600px){
 .box{left:50%;bottom:20px;transform:translateX(-50%);width:86%;max-width:310px}
 .bg{object-position:center top}
}
</style></head><body>

<!-- THIS IS YOUR IMAGE - WORKS ON MOBILE -->
<img class="bg" id="bgImg" src="Shija_dome_night.jpg" alt="SHIJA">
<div class="overlay"></div>

<div class="box">
<label>Username</label>
<div class="input-wrap"><span>👤</span><input id="user" value="admin"></div>
<label>Password</label>
<div class="input-wrap"><span>🔒</span><input id="pass" type="password" value="shija123"></div>
<button class="btn" onclick="login()">Login</button>
<p id="msg"></p>
</div>

<script>
// If capital S fails, try small s automatically (mobile fix)
document.getElementById('bgImg').onerror = function(){
  this.onerror=null;
  this.src='shija_dome_night.jpg';
  // second fallback
  this.onerror=function(){this.src='Shija_dome_night.JPG';}
};

function login(){
 let u=document.getElementById('user').value.trim();
 let p=document.getElementById('pass').value.trim();
 if(u==='admin' && p==='shija123'){
   localStorage.setItem('shija_logged','1');
   location.href='index.html';
 }else{document.getElementById('msg').innerText='Wrong password';}
}
</script>
</body></html>
