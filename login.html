<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHIJA Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0f4c75;display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{background:#fff;padding:30px 25px;border-radius:12px;width:90%;max-width:320px;text-align:center}
h2{color:#0f4c75;margin-bottom:20px}
input{width:100%;padding:11px;margin:6px 0;border:1px solid #ccc;border-radius:8px;outline:0}
button{width:100%;padding:11px;margin-top:10px;border:0;border-radius:8px;background:#0f4c75;color:#fff;font-weight:700;cursor:pointer}
p{font-size:12px;color:#666;margin-top:12px}
#msg{color:red;font-size:13px;margin-top:8px}
</style>
</head>
<body>
<div class="box">
<h2>SHIJA Login</h2>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p>Username: admin<br>Password: shija123</p>
<p id="msg"></p>
</div>

<script>
function login(){
 let u = document.getElementById('user').value;
 let p = document.getElementById('pass').value;
 if(u==='admin' && p==='shija123'){
   localStorage.setItem('shija_logged','1');
   location.href='index.html';
 } else {
   document.getElementById('msg').innerText='Wrong password';
 }
}
</script>
</body>
</html>
