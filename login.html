<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>SHIJA Hospitals - Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{min-height:100vh;display:flex;background:#f8fafc}
.left{flex:1.1;position:relative;background:#0f172a;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:24px 28px}
.left img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:1}
.left::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.1),rgba(0,0,0,0.85) 90%)}
.left .top,.left .bottom{position:relative;z-index:2;color:#fff}
.top-logo{font-weight:800;font-size:18px}
.bottom p{font-size:13px;opacity:.95;margin-top:8px;font-weight:600}
.bottom small{opacity:.75;font-size:11px}
.right{flex:1;background:#f1f5f9;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:420px;background:#fff;border-radius:22px;padding:28px;box-shadow:0 20px 60px #0002}
.card .logo{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.card .logo img{width:48px;height:48px;border-radius:10px;background:#fff;object-fit:contain;padding:2px;border:1px solid #e2e8f0}
.card .logo b{color:#0f4c75;font-size:26px;letter-spacing:.3px}
.card h2{font-size:26px;color:#0f172a;margin:14px 0 6px;font-weight:800}
.card .sub{font-size:13px;color:#64748b;margin-bottom:20px}
label{font-size:11px;font-weight:700;color:#334155;margin:14px 0 6px;display:block}
.input input{width:100%;padding:12px 12px;border:1.5px solid #e2e8f0;border-radius:11px;outline:0;font-size:13px}
.input input:focus{border-color:#dc2626;box-shadow:0 0 0 3px #fecaca}
.row{display:flex;justify-content:space-between;align-items:center;margin:14px 0;font-size:12px;color:#475569}
.btn{width:100%;padding:13px;border:0;border-radius:11px;background:#dc2626;color:#fff;font-weight:800;font-size:14px;cursor:pointer;margin-top:10px}
.foot{margin-top:20px;text-align:center;font-size:11px;color:#94a3b8}
.roleRow{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.roleRow label{margin:0;font-size:10px;font-weight:700;color:#334155;white-space:nowrap}
.roleSelect{padding:4px 6px;border:1.5px solid #e2e8f0;border-radius:6px;background:#f8fafc;font-weight:700;font-size:11px;outline:0;cursor:pointer;color:#0f172a}
</style>
</head><body>
<div class="left">
<img class="bg" src="shija.jpg?v=999" alt="SHIJA" onerror="this.src='shijabg.jpeg'">
<div class="top"><div class="top-logo">Shija Hospitals</div></div>
<div class="bottom"><p>Trusted Healthcare • Compassionate Care • 24/7 Emergency</p></div>
</div>
<div class="right">
<div class="card">
<div class="logo"><img src="logoc.png?v=999" alt="logo" onerror="this.src='logob.png'"><b>SHIJA Hospitals</b></div>
<h2>Welcome Back</h2><div class="sub">Sign in to your hospital portal</div>
<div class="roleRow">
<label>Login As</label>
<select id="roleSelect" class="roleSelect">
<option value="ADMIN">ADMIN</option>
<option value="USER">USER</option>
</select>
</div>
<label>Username</label><div class="input"><input id="user" placeholder="Enter username"></div>
<label>Password</label><div class="input"><input id="pass" type="password" placeholder="Enter password"></div>
<div class="row"><label style="margin:0;display:flex;align-items:center;gap:6px;font-weight:600"><input type="checkbox" style="width:auto"> Remember me</label><a href="#" style="color:#dc2626;text-decoration:none;font-weight:700">Forgot password?</a></div>
<button class="btn" onclick="doLogin()">Login</button>
<div class="foot">© 2024 SHIJA Hospitals • Secure & Protected</div>
</div>
</div>
<script>
// FORCE ADMIN DEFAULT - 100%
window.onload = function(){
  document.getElementById('roleSelect').value = 'ADMIN';
};
document.addEventListener('DOMContentLoaded', function(){
  document.getElementById('roleSelect').value = 'ADMIN';
});
function doLogin(){
 let role=document.getElementById('roleSelect').value;
 let u=document.getElementById('user').value.trim();
 let p=document.getElementById('pass').value.trim();
 let isAdmin = (u==='shija' && p==='shija321');
 let isUser = (u==='admin' && p==='admin123');
 if(isAdmin){ role='ADMIN'; }
 if(isUser && !isAdmin){ role='USER'; }
 if(isAdmin || isUser){
   localStorage.setItem('shija_logged','1');
   localStorage.setItem('shija_role', role);
   localStorage.setItem('shija_login_time', Date.now().toString());
   if(role==='ADMIN') location.href='index.html';
   else location.href='user-index.html';
 }else{
   alert('Invalid login!');
 }
}
document.addEventListener('keydown',e=>{if(e.key==='Enter') doLogin();});
</script>
</body></html>
