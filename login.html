<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHIJA Login - Dome Night</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  background: #06182e;
  /* YOUR DOME NIGHT IMAGE */
  background-image: url('shija_dome_night.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  position:relative;
}
/* Dark blue overlay for readability */
body::before{
  content:'';
  position:absolute;inset:0;
  background: linear-gradient(135deg, rgba(6,24,46,0.75) 0%, rgba(15,76,117,0.65) 50%, rgba(30,123,184,0.55) 100%);
}
.box{
  position:relative;z-index:2;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(12px);
  border-radius:22px;
  padding:32px 26px;
  width:92%;max-width:390px;
  box-shadow:0 20px 40px rgba(0,0,0,0.4), 0 0 80px rgba(30,123,184,0.3);
  text-align:center;
  border:1px solid rgba(255,255,255,0.3);
}
.logo-circle{
  width:78px;height:78px;
  background:linear-gradient(135deg,#0f4c75,#1e7bb8);
  border-radius:50%;margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:900;font-size:32px;
  box-shadow:0 8px 20px rgba(30,123,184,0.5);
  border:2px solid rgba(255,255,255,0.6);
}
.box h2{color:#0f4c75;margin-bottom:4px;letter-spacing:.5px;font-size:22px}
.box p.sub{color:#5a7fa6;font-size:13px;margin-bottom:22px;font-weight:600}
input{
  width:100%;padding:13px 14px;
  border:1.5px solid #cfe0f5;border-radius:12px;
  margin:7px 0;outline:0;background:#ffffff;
  transition:.2s;font-size:14px;
}
input:focus{border-color:#1e7bb8;box-shadow:0 0 0 3px rgba(30,123,184,0.2)}
.btn{
  width:100%;padding:13px;border:0;border-radius:12px;
  background:linear-gradient(90deg,#0a2a4a,#0f4c75,#1e7bb8);
  color:#fff;font-weight:800;cursor:pointer;margin-top:14px;
  box-shadow:0 8px 18px rgba(15,76,117,0.4);font-size:15px;letter-spacing:.3px;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(15,76,117,0.5)}
.small{font-size:11px;color:#7a9abf;margin-top:14px;background:#f1f6ff;padding:9px;border-radius:8px;border:1px solid #dbe8ff}
#msg{color:#ef4444;font-size:13px;margin-top:10px;min-height:16px;font-weight:600}
.footer-light{
  position:relative;z-index:2;
  position:absolute;bottom:18px;left:0;right:0;text-align:center;
  color:rgba(255,255,255,0.75);font-size:11px;letter-spacing:.5px;
  text-shadow:0 1px 4px #000;
}
</style></head><body>
<div class="box">
<div class="logo-circle">S</div>
<h2>SHIJA HOSPITALS</h2>
<p class="sub">Dialysis Management System</p>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button class="btn" onclick="doLogin()">Login</button>
<p class="small">Username: <b>admin</b> | Password: <b>shija123</b></p>
<p id="msg"></p>
</div>
<div class="footer-light">SHIJA Dome • Night View</div>
<script>
function doLogin(){
 let u=document.getElementById('user').value.trim();
 let p=document.getElementById('pass').value.trim();
 if(u==='admin' && p==='shija123'){
   localStorage.setItem('shija_logged','1');
   location.href='index.html';
 }else{
   document.getElementById('msg').textContent='Wrong! Use admin / shija123';
 }
}
</script>
</body></html>
