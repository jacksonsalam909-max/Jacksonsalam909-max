<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, getDocs, collection } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app=initializeApp(cfg,"view_"+Math.random());const db=getFirestore(app);
window._fb={db,doc,getDoc,getDocs,collection};

<script>
let allPatients=[],filteredPatients=[],currentPage=1,pageSize=12,currentView='grid',masterMap={},photoMap={},photoMapDigits={};
function getTodayIST(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function formatDisplay(iso){if(!iso)return'';let p=iso.split('-');if(p.length!==3)return iso;return `${p[2]}-${p[1]}-${p[0]}`;}
function openDatePicker(){let i=document.getElementById('fDate');if(i.showPicker)i.showPicker();else i.click();}
function updateDateDisplay(){document.getElementById('dateDisplay').innerText=formatDisplay(document.getElementById('fDate').value);}
function shiftDate(d){let input=document.getElementById('fDate');let dt=input.value?new Date(input.value):new Date();dt.setDate(dt.getDate()+d);input.value=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;updateDateDisplay();onDateChange();}
let urlParams=new URLSearchParams(window.location.search);
document.getElementById('fDate').value=urlParams.get('date')&&urlParams.get('force')==='1'?urlParams.get('date'):getTodayIST();
if(urlParams.get('scheme'))document.getElementById('fType').value=urlParams.get('scheme');
function toggleWhiteBar(){if(window.innerWidth<=900){document.getElementById('whiteBar').classList.toggle('mOpen');document.getElementById('mobOverlay').classList.toggle('show');}else{document.getElementById('whiteBar').classList.toggle('folded');}}
function closeMob(){document.getElementById('whiteBar').classList.remove('mOpen');document.getElementById('mobOverlay').classList.remove('show');}
document.addEventListener('DOMContentLoaded',function(){
 document.getElementById('menuBtnTop').addEventListener('click',function(e){e.preventDefault();toggleWhiteBar();});
 document.getElementById('datePrev').addEventListener('click',()=>shiftDate(-1));
 document.getElementById('dateNext').addEventListener('click',()=>shiftDate(1));
 document.getElementById('dateDisplay').addEventListener('click',openDatePicker);
 updateDateDisplay();
 switchView('grid');
});
function switchView(view){currentView=view;document.getElementById('btnListView').classList.toggle('active',view==='list');document.getElementById('btnGridView').classList.toggle('active',view==='grid');let sheet=document.getElementById('sheetWrap');let grid=document.getElementById('gridWrap');if(view==='grid'){sheet.classList.add('hide');grid.classList.add('show');}else{sheet.classList.remove('hide');grid.classList.remove('show');}renderPagination();}
function clearFiltersDirect(){document.getElementById('filterTime').value='';document.getElementById('filterBlock').value='';let s=document.getElementById('searchName');if(s)s.value='';applyFilter();}
function initials(name){if(!name)return'?';let w=name.trim().split(/\s+/);if(w.length===1)return w[0].substring(0,2).toUpperCase();return (w[0][0]+w[1][0]).toUpperCase();}
function digitsOnly(s){return String(s||'').replace(/[^0-9]/g,'');}
function rebuildChunkPhoto(p){
  if(!p) return '';
  let direct=p.photoUrl||p.photoURL||'';
  if(direct && (String(direct).startsWith('data:')||String(direct).startsWith('http'))) return String(direct);
  let arr=p.photoChunks||p.photo_parts||p.photoParts||p.chunks||p.parts||null;
  if(Array.isArray(arr)&&arr.length>0){let j=arr.join('');if(j.startsWith('data:'))return j;return 'data:image/jpeg;base64,'+j;}
  let keys=Object.keys(p).filter(k=>/^(photo|image|chunk|part)[_\-]?(\d+)$/i.test(k));
  if(keys.length>0){keys.sort((a,b)=>parseInt(a.match(/(\d+)$/)[1])-parseInt(b.match(/(\d+)$/)[1]));let j=keys.map(k=>String(p[k]||'')).join('');if(j.startsWith('data:'))return j;return 'data:image/jpeg;base64,'+j;}
  let s=p.photo||p.image||''; if(s&&String(s).length>100){if(String(s).startsWith('data:'))return String(s);return 'data:image/jpeg;base64,'+String(s);}
  return '';
}
async function fetchSubChunks(docId){
  for(let sub of ['photoChunks','chunks','photo_chunks']){
    try{let snap=await window._fb.getDocs(window._fb.collection(window._fb.db,'patients',docId,sub));if(snap.size>0){let arr=[];snap.forEach(d=>{let data=d.data();let idx=data.index??parseInt(d.id.replace(/[^0-9]/g,''))??0;arr[idx]=data.chunk||data.data||data.value||'';});let j=arr.join('');if(j)return j.startsWith('data:')?j:'data:image/jpeg;base64,'+j;}}catch(e){}
  } return '';
}
async function buildMasterMap(){
  masterMap={};photoMap={};photoMapDigits={};
  try{let snap=await window._fb.getDocs(window._fb.collection(window._fb.db,'patients'));for(let d of snap.docs){let p=d.data();if(p.deleted)continue;let shri=String(p.shriId||p.shri||d.id||'').trim().toUpperCase();if(!shri)continue;masterMap[shri]={pmjayId:String(p.pmjayId||p.pmjay||'').trim().toUpperCase(),pmjayName:String(p.patientName||p.name||'').trim().toUpperCase(),cmhtId:'',cmhtName:''};let ph=rebuildChunkPhoto(p);if(!ph)ph=await fetchSubChunks(d.id);if(ph){photoMap[shri]=ph;let dg=digitsOnly(shri);if(dg)photoMapDigits[dg]=ph;}}}catch(e){}
  try{let snap2=await window._fb.getDocs(window._fb.collection(window._fb.db,'cmht_patients'));snap2.forEach(d=>{let p=d.data();if(p.deleted)return;let shri=String(p.shriId||p.shri||d.id||'').trim().toUpperCase();if(!shri)return;if(!masterMap[shri])masterMap[shri]={pmjayId:'',pmjayName:'',cmhtId:'',cmhtName:''};masterMap[shri].cmhtId=String(p.cmhtId||p.cmht||p.pmjayId||'').trim().toUpperCase();masterMap[shri].cmhtName=String(p.patientName||p.name||'').trim().toUpperCase();let ph=rebuildChunkPhoto(p);if(ph){photoMap[shri]=ph;let dg=digitsOnly(shri);if(dg)photoMapDigits[dg]=ph;}});}catch(e){}
}
function enrichPatient(p){let k=String(p.shri||'').trim().toUpperCase();let m=masterMap[k];if(m){let scheme=document.getElementById('fType').value;if(scheme==='PMJAY'){if(m.pmjayName)p.name=m.pmjayName;if(m.pmjayId)p.pmjayCmhtId=m.pmjayId;}else{if(m.cmhtName)p.name=m.cmhtName;if(m.cmhtId)p.pmjayCmhtId=m.cmhtId;}}if(!p.patientStatus)p.patientStatus='ENHANCEMENT';let ph=rebuildChunkPhoto(p)||photoMap[k]||photoMapDigits[digitsOnly(k)]||'';if(ph)p._photo=ph;return p;}
async function onDateChange(){updateDateDisplay();let date=document.getElementById('fDate').value;let scheme=document.getElementById('fType').value;let docId=date+'_'+scheme;try{let snap=await window._fb.getDoc(window._fb.doc(window._fb.db,'daily_dialysis_lists',docId));let patients=snap.exists()?(snap.data().patients||[]):[];patients=patients.map((p,i)=>{let e=enrichPatient({...p,sl:i+1});e.sl=i+1;return e;});if(scheme==='PMJAY')patients=patients.filter(p=>(p.patientStatus||'ENHANCEMENT')!=='DISCHARGE');allPatients=patients;filteredPatients=[...allPatients];currentPage=1;applyFilter();}catch(e){}}
function normalizeTime(t){if(!t)return'';let s=String(t).toUpperCase().trim();let m=s.match(/(\d{1,2})(?::(\d{1,2}))?\s*([AP]M)?/);if(!m)return s;return `${parseInt(m[1])}:${(m[2]||'00').padStart(2,'0')} ${m[3]||''}`.trim();}
function applyFilter(){
  let search=(document.getElementById('searchName').value||'').toLowerCase().trim();
  let timeFilter=document.getElementById('filterTime').value;
  let blockFilter=document.getElementById('filterBlock').value;
  filteredPatients=allPatients.filter(p=>{
    if(search){let n=String(p.name||'').toLowerCase();let sh=String(p.shri||'').toLowerCase();let pid=String(p.pmjayCmhtId||'').toLowerCase();if(!n.includes(search)&&!sh.includes(search)&&!pid.includes(search))return false;}
    if(timeFilter&&normalizeTime(p.time)!==normalizeTime(timeFilter))return false;
    if(blockFilter&&p.block!==blockFilter)return false;
    return true;
  });
  currentPage=1;renderPagination();updateBottomStats();
}
function updateBottomStats(){document.getElementById('bottomStats').innerText=`Total: ${allPatients.length} | Filtered: ${filteredPatients.length} | Time: ${document.getElementById('filterTime').value||'ALL'} | Block: ${document.getElementById('filterBlock').value||'ALL'} | Scheme: ${document.getElementById('fType').value}`;document.getElementById('filterNoMid').innerText=`Filtered: ${filteredPatients.length}`;}
function renderPagination(){
  pageSize=parseInt(document.getElementById('rowsPerPage').value)||12;
  let totalPages=Math.max(1,Math.ceil(filteredPatients.length/pageSize));if(currentPage>totalPages)currentPage=totalPages;
  let pag=document.getElementById('pagination');pag.innerHTML='';
  function addBtn(i){let b=document.createElement('button');b.className='pageBtn'+(i===currentPage?' active':'');b.innerText=i;b.onclick=()=>{currentPage=i;renderTable();renderGrid();renderPagination();};pag.appendChild(b);}
  if(totalPages<=5){for(let i=1;i<=totalPages;i++)addBtn(i);}else{addBtn(1);addBtn(2);addBtn(3);if(currentPage>4){let s=document.createElement('span');s.innerText='...';pag.appendChild(s);}if(currentPage>3&&currentPage<totalPages)addBtn(currentPage);if(currentPage<totalPages-1){let s=document.createElement('span');s.innerText='...';pag.appendChild(s);}addBtn(totalPages);}
  renderTable();renderGrid();
}
function photoHTML(p,cls){let ph=p._photo||'';if(ph)return `<div class="${cls}"><img src="${ph}" onerror="this.parentNode.classList.add('noPhoto');this.remove();this.parentNode.innerHTML='<span>${initials(p.name)}</span>'"></div>`;return `<div class="${cls} noPhoto"><span>${initials(p.name)}</span></div>`;}
function renderTable(){
  let tbody=document.getElementById('tbody');tbody.innerHTML='';
  let start=(currentPage-1)*pageSize;let page=filteredPatients.slice(start,start+pageSize);
  page.forEach((p,idx)=>{let tr=document.createElement('tr');tr.innerHTML=`<td><div class="sl">${p.sl||start+idx+1}</div></td><td class="nameCol"><div class="photoName">${photoHTML(p,'pPhoto')}<div class="nameInner">${p.name||''}</div></div></td><td><span class="pmjayTable">${p.pmjayCmhtId||'-'}</span></td><td><span class="shriTable">${p.shri||'No ID'}</span></td><td>${p.time||''}</td><td>${p.block||''}</td><td>${p.prev||''}</td>`;tbody.appendChild(tr);});
  if(page.length===0){let tr=document.createElement('tr');tr.innerHTML=`<td colspan="7" style="padding:16px;text-align:center;font-size:12px">NO PATIENTS</td>`;tbody.appendChild(tr);}
}
function renderGrid(){
  let grid=document.getElementById('gridWrap');grid.innerHTML='';
  let start=(currentPage-1)*pageSize;let page=filteredPatients.slice(start,start+pageSize);
  page.forEach((p,idx)=>{let div=document.createElement('div');div.className='pCard';div.innerHTML=`<div class="pCardTop"><span class="pCardSL">#${p.sl||start+idx+1}</span></div>${photoHTML(p,'pPhotoBig')}<div class="pCardName">${p.name||'NO NAME'}</div><div class="pCardSub">${(p.pmjayCmhtId||'NO ID')}| SHRI: ${p.shri||''}</div><div class="pCardInfo"><span>${p.time||''}</span><span>${p.block||''}</span><span>PREV: ${p.prev||'-'}</span></div>`;grid.appendChild(div);});
  if(page.length===0){grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:24px;background:#fff;border-radius:12px;border:1px solid #e2e8f0;font-size:12px;font-weight:700">No patients</div>';}
}
function changePage(d){let totalPages=Math.max(1,Math.ceil(filteredPatients.length/pageSize));currentPage+=d;if(currentPage<1)currentPage=1;if(currentPage>totalPages)currentPage=totalPages;renderPagination();}
document.getElementById('fType').addEventListener('change',onDateChange);
document.getElementById('rowsPerPage').addEventListener('change',renderPagination);
document.getElementById('searchName').addEventListener('input',applyFilter);
document.getElementById('filterTime').addEventListener('change',applyFilter);
document.getElementById('filterBlock').addEventListener('change',applyFilter);
document.getElementById('fDate').addEventListener('change',onDateChange);
window.addEventListener('load',async()=>{updateDateDisplay();await buildMasterMap();setTimeout(onDateChange,200);});
</script>
<script type="module" src="maintenance.js"></script>
</body>
