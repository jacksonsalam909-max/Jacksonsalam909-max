<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIST - MAIN PAGE</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f1f5f9}
.top{height:58px;background:#0a1931;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;position:fixed;top:0;left:0;right:0;z-index:1000}
.btn{padding:7px 11px;border:0;border-radius:8px;font-weight:900;font-size:11px;cursor:pointer}
.btnGreen{background:#10b981;color:#fff}.btnBlue{background:#2563eb;color:#fff}.btnDark{background:#0f172a;color:#fff}.btnPurple{background:#7c3aed;color:#fff}
.input{padding:7px 10px;border:1.5px solid #e2e8f0;border-radius:8px;font-weight:700;font-size:12px;background:#fff}
.content{max-width:1450px;margin:66px auto 0;padding:10px}
.card{background:#fff;border-radius:12px;padding:10px;margin-bottom:8px;border:1px solid #e2e8f0}
.sheetWrap{overflow:auto;border:2px solid #000;background:#fff;max-height:70vh}
table{border-collapse:collapse;width:100%;min-width:1100px}
th{position:sticky;top:0;background:#0a1931;color:#fff;padding:10px 4px;font-size:10px;text-align:center;border:1px solid #000;z-index:2}
td{border:1px solid #d1d5db;padding:8px 4px;height:42px;font-size:11px;font-weight:700;text-align:center;text-transform:uppercase;background:#fff}
td.nameCol{text-align:left;padding-left:8px}
td.slCol{background:#f1f5f9;font-weight:900}
td.idCol{background:#eff6ff;color:#1e40af;font-weight:900}
.status{font-size:11px;font-weight:800;padding:5px 10px;border-radius:20px}.status.saved{background:#dcfce7;color:#14532d}.status.blank{background:#f3f4f6}
.pagination{display:flex;gap:4px;flex-wrap:wrap}.pageBtn{padding:8px 12px;border-radius:7px;border:1.5px solid #e2e8f0;background:#fff;font-weight:900;cursor:pointer;font-size:11px}.pageBtn.active{background:#0a1931;color:#fff;border-color:#0a1931}
.actionCell{display:flex;gap:6px;justify-content:center;align-items:center;height:100%}
.btnEdit{background:#FFD60A;color:#000;font-weight:900;font-size:11px;padding:8px 16px;border-radius:6px;border:0;cursor:pointer;min-width:56px}
.btnDelete{background:#EF4444;color:#fff;font-weight:900;font-size:11px;padding:8px 12px;border-radius:6px;border:0;cursor:pointer;min-width:56px}
#btnSaveFirebase, #btnLoadMaster, #btnClear{display:none !important}

/* MENU ON LEFT SIDE - OPPOSITE */
.menuBtn{font-size:26px;background:none;border:0;color:#fff;cursor:pointer;padding:4px 10px}
.menuDrawer{position:fixed;top:58px;left:-320px;width:300px;height:calc(100vh - 58px);background:#0f172a;color:#fff;z-index:9999;transition:0.3s;overflow:auto;padding:10px;border-right:3px solid #7c3aed}
.menuDrawer.open{left:0}
.menuItem{display:block;width:100%;padding:14px 16px;margin:6px 0;background:#1e293b;border:1px solid #334155;border-radius:10px;color:#fff;font-weight:900;font-size:13px;text-align:left;cursor:pointer;text-transform:uppercase}
.menuItem:hover{background:#7c3aed}
.menuOverlay{position:fixed;top:58px;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);display:none;z-index:9998}
.menuOverlay.open{display:block}
.filterRow{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:8px}
.readOnlyCell{pointer-events:none;user-select:none}
</style>
</head>
<body>
<div class="top">
<div style="display:flex;align-items:center;gap:8px">
<button class="menuBtn" onclick="toggleMenu()">☰</button>
<div style="font-weight:900;font-size:14px">DIALYSIS LIST</div>
<div id="status" class="status saved">READY</div>
</div>
<div style="display:flex;align-items:center;gap:8px">
<button class="btn btnGreen" onclick="exportPDF()">📄 PDF</button>
<button id="btnSaveFirebase" class="btn btnBlue">SAVE</button>
<button class="btn btnPurple" onclick="openAddPatientPage()" style="padding:10px 16px">➕ ADD PATIENT</button>
</div>
</div>

<div class="menuOverlay" id="menuOverlay" onclick="toggleMenu()"></div>
<div class="menuDrawer" id="menuDrawer">
<div style="font-weight:900;font-size:14px;padding:10px 4px;border-bottom:1px solid #334155;margin-bottom:10px">MENU - ALL PAGES</div>
<button class="menuItem" onclick="goPage('index.html')">🏠 DASHBOARD</button>
<button class="menuItem" onclick="goPage('total.html')">📋 TOTAL PATIENTS</button>
<button class="menuItem" onclick="goPage('cmht.html')">🏥 CMHT PATIENTS</button>
<button class="menuItem" onclick="goPage('list.html')">📄 DIALYSIS LIST</button>
<button class="menuItem" onclick="goPage('addlist.html')">➕ ADD PATIENT LIST</button>
<button class="menuItem" onclick="goPage('discharge.html')">📤 DISCHARGE</button>
<button class="menuItem" onclick="goPage('followup.html')">🔁 FOLLOW UP</button>
<button class="menuItem" onclick="goPage('report.html')">📊 REPORTS</button>
<button class="menuItem" onclick="goPage('settings.html')">⚙️ SETTINGS</button>
<button class="menuItem" onclick="goPage('backup.html')">💾 BACKUP</button>
<div style="margin-top:20px;padding:10px;background:#1e293b;border-radius:8px;font-size:10px">
<div style="font-weight:900;margin-bottom:4px">CURRENT:</div>
<div id="menuCurrentInfo">DATE + SCHEME</div>
</div>
</div>

<div class="content">
<div class="card">
<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:end">
<div><label style="font-size:9px;font-weight:800">DATE *</label><br><input type="date" id="fDate" class="input" onchange="onDateChange()"></div>
<div><label style="font-size:9px;font-weight:800">SCHEME *</label><br><select id="fType" class="input" onchange="onSchemeChange()" style="background:#fef3c7;border:2px solid #f59e0b;font-weight:900"><option value="PMJAY" selected>PMJAY</option><option value="CMHT">CMHT</option></select></div>
<div><label style="font-size:9px;font-weight:800">SHOW</label><br><select id="rowsPerPage" class="input" onchange="renderPagination()"><option value="10" selected>10</option><option value="20">20</option><option value="30">30</option><option value="40">40</option><option value="50">50</option></select></div>
<div><label style="font-size:9px;font-weight:800">SEARCH</label><br><input type="text" id="searchName" class="input" placeholder="NAME/SHRI/ID..." oninput="applyFilter()" style="width:120px"></div>
<div style="margin-left:auto;display:flex;gap:8px">
<button id="btnLoadMaster" class="btn btnDark">LOAD</button>
<button id="btnClear" class="btn btnDark">CLEAR</button>
</div>
</div>

<div class="filterRow">
<div><label style="font-size:9px;font-weight:800">FILTER BY TIME</label><br><select id="filterTime" class="input" onchange="applyFilter()"><option value="">ALL TIME</option><option value="7:00 AM">7:00 AM</option><option value="12:00 PM">12:00 PM</option><option value="5:00 PM">5:00 PM</option><option value="9:00 PM">9:00 PM</option></select></div>
<div><label style="font-size:9px;font-weight:800">FILTER BY BLOCK</label><br><select id="filterBlock" class="input" onchange="applyFilter()"><option value="">ALL BLOCK</option><option value="MAIN">MAIN</option><option value="ITOCHA">ITOCHA</option></select></div>
<div style="margin-left:auto;display:flex;align-items:center;gap:6px"><span id="filterCount" style="font-weight:900;font-size:11px;background:#0a1931;color:#fff;padding:6px 12px;border-radius:20px">0 PATIENTS</span><button class="btn btnDark" onclick="clearFilters()">CLEAR FILTERS</button></div>
</div>
<div id="masterInfo" style="font-size:11px;font-weight:800;margin-top:8px;background:#eff6ff;padding:8px;border-radius:6px">LOADING...</div>
</div>

<div class="card" style="padding:0">
<div class="sheetWrap"><table><thead><tr><th style="width:50px">SL.NO</th><th style="width:135px">PMJAY / CMHT ID</th><th style="width:210px">PATIENT NAME</th><th style="width:110px">SHRI ID</th><th style="width:110px">TIME</th><th style="width:90px">BLOCK</th><th style="width:110px">PREV</th><th style="width:130px">ACTION</th></tr></thead><tbody id="tbody"></tbody></table></div>
<div style="padding:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
<div class="pagination" id="pagination"></div>
<div style="display:flex;gap:6px;margin-left:auto"><button class="btn btnDark" onclick="changePage(-1)">◀ PREV</button><button class="btn btnDark" onclick="changePage(1)">NEXT ▶</button></div>
<span id="pageInfo" style="font-weight:800;font-size:11px;width:100%;margin-top:6px"></span>
</div>
</div>
</div>

<div id="editModal" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:9999"><div style="background:#fff;border-radius:14px;padding:16px;width:90%;max-width:420px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><span style="font-weight:900" id="editTitle">EDIT PATIENT</span><button class="btn btnDark" onclick="closeModal()">X</button></div><div style="display:flex;flex-direction:column;gap:8px"><input id="editName" class="input" placeholder="PATIENT NAME"><input id="editShri" class="input" placeholder="SHRI ID"><input id="editId" class="input" placeholder="PMJAY/CMHT ID"><input id="editTime" class="input" placeholder="TIME - 7:00 AM"><input id="editBlock" class="input" placeholder="BLOCK - MAIN"><input id="editPrev" class="input" placeholder="PREV - 10/20/2026"><button class="btn btnGreen" style="padding:12px" onclick="saveEdit()">💾 SAVE CHANGES</button><div style="font-size:10px;font-weight:800;background:#fef3c7;padding:6px;border-radius:6px">EDIT ONLY HERE - Main table is read-only until you click EDIT</div></div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, getDocs, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);window._fb={db,doc,setDoc,getDoc,getDocs,collection,deleteDoc};
</script>

<script>
let allPatients=[],filteredPatients=[],currentPage=1,pageSize=10,editIndex=-1;
document.getElementById('fDate').valueAsDate=new Date();
let urlParams=new URLSearchParams(window.location.search);
if(urlParams.get('date')) document.getElementById('fDate').value=urlParams.get('date');
if(urlParams.get('scheme')) document.getElementById('fType').value=urlParams.get('scheme');

function toggleMenu(){document.getElementById('menuDrawer').classList.toggle('open');document.getElementById('menuOverlay').classList.toggle('open');}
function goPage(page){
  let date=document.getElementById('fDate').value;
  let scheme=document.getElementById('fType').value;
  if(page==='list.html' || page==='addlist.html'){
    window.location.href=`${page}?date=${date}&scheme=${scheme}`;
  } else {
    window.location.href=page;
  }
}
function openAddPatientPage(){let date=document.getElementById('fDate').value;let scheme=document.getElementById('fType').value;window.location.href=`addlist.html?date=${date}&scheme=${scheme}`;}

async function loadMasterFromFirebase(){
  try{
    let countPM=0,countCM=0;
    for(let col of ['pmjay_patients','total']){try{let snap=await window._fb.getDocs(window._fb.collection(window._fb.db,col));countPM+=snap.size;}catch(e){}}
    for(let col of ['cmht_patients','cmht']){try{let snap=await window._fb.getDocs(window._fb.collection(window._fb.db,col));countCM+=snap.size;}catch(e){}}
    document.getElementById('masterInfo').innerHTML=`✅ PMJAY: ${countPM} PATIENTS | CMHT: ${countCM} PATIENTS | CURRENT: ${document.getElementById('fType').value} | PAGE SHOWS 10 ONLY - NOT EDITABLE UNTIL EDIT CLICK`;
    document.getElementById('menuCurrentInfo').innerText=`${document.getElementById('fDate').value} | ${document.getElementById('fType').value}`;
  }catch(e){}
}

function getTableData(){return allPatients;}
function setStatus(t,m){let el=document.getElementById('status');el.className='status '+t;el.innerText=m;}

async function autoSaveToFirebase(){
  let date=document.getElementById('fDate').value;
  let scheme=document.getElementById('fType').value;
  let docId=date+'_'+scheme;
  setStatus('saving','SAVING...');
  try{
    await window._fb.setDoc(window._fb.doc(window._fb.db,'daily_dialysis_lists',docId),{
      date:date, scheme:scheme, type:scheme, patients:allPatients, count:allPatients.length, updatedAt:new Date().toISOString()
    });
    setStatus('saved',`SAVED ${allPatients.length}`);
  }catch(e){}
}

async function onDateChange(){
  let date=document.getElementById('fDate').value;
  let scheme=document.getElementById('fType').value;
  let docId=date+'_'+scheme;
  setStatus('saving','LOADING...');
  try{
    let snap=await window._fb.getDoc(window._fb.doc(window._fb.db,'daily_dialysis_lists',docId));
    let patients=snap.exists()?(snap.data().patients||[]):[];
    allPatients=patients.map((p,i)=>({...p, sl:i+1}));
    filteredPatients=[...allPatients];
    currentPage=1;
    pageSize=parseInt(document.getElementById('rowsPerPage').value)||10;
    if(patients.length===0){
      document.getElementById('masterInfo').innerHTML=`📋 BLANK - DATE: ${date} | SCHEME: ${scheme} | NO DATA - USE ADD PATIENT`;
      setStatus('blank','BLANK');
    } else {
      document.getElementById('masterInfo').innerHTML=`✅ ${patients.length} PATIENTS FOR ${date} ${scheme} - SHOWING 10 PER PAGE - READ-ONLY UNTIL EDIT`;
      setStatus('saved',`${patients.length} PATIENTS`);
    }
    applyFilter();
  }catch(e){ setStatus('saved','ERROR'); }
}

async function onSchemeChange(){
  allPatients=[]; filteredPatients=[]; currentPage=1;
  await onDateChange();
}

function applyFilter(){
  let search=document.getElementById('searchName').value.toLowerCase().trim();
  let timeFilter=document.getElementById('filterTime').value;
  let blockFilter=document.getElementById('filterBlock').value;
  
  filteredPatients=allPatients.filter(p=>{
    if(search && !p.name.toLowerCase().includes(search) && !p.shri.toLowerCase().includes(search) && !p.pmjayCmhtId.toLowerCase().includes(search)) return false;
    if(timeFilter && p.time!==timeFilter) return false;
    if(blockFilter && p.block!==blockFilter) return false;
    return true;
  });
  
  document.getElementById('filterCount').innerText=`${filteredPatients.length} / ${allPatients.length} PATIENTS`;
  currentPage=1;
  renderPagination();
}

function clearFilters(){
  document.getElementById('filterTime').value='';
  document.getElementById('filterBlock').value='';
  document.getElementById('searchName').value='';
  applyFilter();
}

function renderPagination(){
  pageSize=parseInt(document.getElementById('rowsPerPage').value)||10;
  let totalPages=Math.max(1,Math.ceil(filteredPatients.length/pageSize));
  if(currentPage>totalPages) currentPage=totalPages;
  let pag=document.getElementById('pagination');
  pag.innerHTML='';
  for(let i=1;i<=totalPages;i++){
    let b=document.createElement('button');
    b.className='pageBtn'+(i===currentPage?' active':'');
    b.innerText=i;
    b.onclick=()=>{currentPage=i; renderTable(); renderPagination();};
    pag.appendChild(b);
  }
  renderTable();
}

function renderTable(){
  let tbody=document.getElementById('tbody');
  tbody.innerHTML='';
  
  let start=(currentPage-1)*pageSize;
  let end=start+pageSize;
  let pagePatients=filteredPatients.slice(start,end);
  
  pagePatients.forEach((p,idx)=>{
    let globalIdx=allPatients.indexOf(p);
    let tr=document.createElement('tr');
    tr.innerHTML=`
      <td class="slCol">${p.sl||start+idx+1}</td>
      <td class="idCol">${p.pmjayCmhtId||''}</td>
      <td class="nameCol">${p.name||''}</td>
      <td>${p.shri||''}</td>
      <td>${p.time||''}</td>
      <td>${p.block||''}</td>
      <td>${p.prev||''}</td>
      <td><div class="actionCell"><button class="btnEdit" onclick="openEdit(${globalIdx})">EDIT</button><button class="btnDelete" onclick="deleteRow(${globalIdx})">DELETE</button></div></td>
    `;
    tbody.appendChild(tr);
  });
  
  if(pagePatients.length===0){
    let tr=document.createElement('tr');
    tr.innerHTML=`<td colspan="8" style="padding:20px;text-align:center;background:#f8fafc">NO PATIENTS - USE ADD PATIENT BUTTON</td>`;
    tbody.appendChild(tr);
  }
  
  document.getElementById('pageInfo').innerText=`SCHEME: ${document.getElementById('fType').value} | PAGE ${currentPage} OF ${Math.max(1,Math.ceil(filteredPatients.length/pageSize))} | SHOWING ${pagePatients.length} OF ${filteredPatients.length} PATIENTS | 10 PER PAGE - NOT EDITABLE UNTIL EDIT`;
}

function changePage(d){
  let totalPages=Math.max(1,Math.ceil(filteredPatients.length/pageSize));
  currentPage+=d;
  if(currentPage<1) currentPage=1;
  if(currentPage>totalPages) currentPage=totalPages;
  renderPagination();
}

function openEdit(globalIdx){
  editIndex=globalIdx;
  let p=allPatients[globalIdx];
  if(!p) return;
  document.getElementById('editTitle').innerText=`EDIT: ${p.name}`;
  document.getElementById('editName').value=p.name||'';
  document.getElementById('editShri').value=p.shri||'';
  document.getElementById('editId').value=p.pmjayCmhtId||'';
  document.getElementById('editTime').value=p.time||'';
  document.getElementById('editBlock').value=p.block||'';
  document.getElementById('editPrev').value=p.prev||'';
  document.getElementById('editModal').style.display='flex';
}

function saveEdit(){
  if(editIndex<0) return;
  allPatients[editIndex].name=document.getElementById('editName').value.toUpperCase();
  allPatients[editIndex].shri=document.getElementById('editShri').value.toUpperCase();
  allPatients[editIndex].pmjayCmhtId=document.getElementById('editId').value.toUpperCase();
  allPatients[editIndex].time=document.getElementById('editTime').value.toUpperCase();
  allPatients[editIndex].block=document.getElementById('editBlock').value.toUpperCase();
  allPatients[editIndex].prev=document.getElementById('editPrev').value;
  closeModal();
  applyFilter();
  autoSaveToFirebase();
}

function closeModal(){document.getElementById('editModal').style.display='none';}

function deleteRow(globalIdx){
  if(!confirm('DELETE THIS PATIENT?')) return;
  allPatients.splice(globalIdx,1);
  allPatients.forEach((p,i)=>p.sl=i+1);
  applyFilter();
  autoSaveToFirebase();
}

function exportPDF(){
  if(filteredPatients.length===0){alert('No data');return;}
  let date=document.getElementById('fDate').value;
  let type=document.getElementById('fType').value;
  const { jsPDF }=window.jspdf;
  let docPdf=new jsPDF('landscape','mm','a4');
  docPdf.setFontSize(13);
  docPdf.text(`${date} ${type} - Total: ${filteredPatients.length}`,14,12);
  let rows=filteredPatients.map(p=>[p.sl,p.pmjayCmhtId,p.name,p.shri,p.time,p.block,p.prev]);
  docPdf.autoTable({startY:16,head:[['SL','ID','PATIENT NAME','SHRI ID','TIME','BLOCK','PREV']],body:rows,theme:'grid',styles:{fontSize:8,halign:'center'},headStyles:{fillColor:[10,25,49]}});
  docPdf.save(`${date}_${type}_LIST.pdf`);
}

window.addEventListener('load',()=>{ loadMasterFromFirebase(); setTimeout(onDateChange,800); });
</script>
</body>
</html>
