<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIST - DAILY DIALYSIS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f1f5f9}
.top{height:60px;background:#0a1931;color:#fff;display:flex;align-items:center;padding:0 14px;position:fixed;top:0;left:0;right:0;z-index:999;font-weight:900}
.content{max-width:1300px;margin:70px auto;padding:14px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid #e2e8f0}
.upload{border:3px dashed #2563eb;background:#eff6ff;border-radius:12px;padding:25px;text-align:center;cursor:pointer;font-weight:900}
.btn{padding:10px 16px;border:0;border-radius:8px;font-weight:900;cursor:pointer;font-size:11px}
.input{padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-weight:700}
.paper{background:#fff;border:2px solid #000}
.title{text-align:center;font-weight:900;padding:10px;border-bottom:2px solid #000;text-transform:uppercase;font-size:18px}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #000;padding:5px 6px;font-size:11px;text-align:left}
th{background:#f1f5f9;font-weight:800;text-align:center;font-size:10px}
td{font-weight:600;text-transform:uppercase}
.center{text-align:center}
</style>
</head>
<body>
<div class="top">DAILY DIALYSIS LIST - list.html</div>
<div class="content">

<div class="card">
<div style="display:flex;gap:10px;flex-wrap:wrap">
<input type="date" id="date" class="input" onchange="loadDate()">
<select id="type" class="input"><option>PMJAY</option><option>CMHT</option></select>
<input type="text" id="search" class="input" placeholder="SEARCH NAME..." oninput="doSearch()" style="flex:1;min-width:200px;border:2px solid #000">
<button class="btn" style="background:#0f172a;color:#fff" onclick="loadDate()">LOAD DATE</button>
</div>

<div class="upload" style="margin-top:12px" onclick="document.getElementById('file').click()">
📤 CLICK TO UPLOAD EXCEL - LIST WILL SHOW BELOW
<input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
</div>
<div id="msg" style="margin-top:8px;font-weight:800;color:#2563eb;font-size:12px"></div>
</div>

<div class="paper" id="paper">
<div class="title" id="paperTitle">DIALYSIS LIST</div>
<table id="mainTable">
<thead>
<tr>
<th>SL.NO</th><th>NAME</th><th>SHRI</th><th>TIME</th><th>BLOCK</th><th>PREV DIALYSIS</th>
<th>SL.NO</th><th>NAME</th><th>SHRI</th><th>TIME</th><th>BLOCK</th><th>PREV DIALYSIS</th>
</tr>
</thead>
<tbody id="body">
<tr><td colspan="12" style="text-align:center;padding:20px">UPLOAD EXCEL TO DISPLAY LIST</td></tr>
</tbody>
</table>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);window._fb={db,doc,setDoc,getDoc};
</script>

<script>
let allRows=[]; // raw rows from excel
let displayRows=[];

document.getElementById('date').valueAsDate=new Date();

document.getElementById('file').addEventListener('change', e=>{
  if(e.target.files[0]) readExcel(e.target.files[0]);
});

function readExcel(file){
  document.getElementById('msg').innerText='Reading '+file.name+'...';
  let reader=new FileReader();
  reader.onload=function(evt){
    let data=evt.target.result;
    let wb=XLSX.read(data,{type:'array'});
    let ws=wb.Sheets[wb.SheetNames[0]];
    let rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});
    
    // Remove empty rows
    rows=rows.filter(r=> r.join('').trim()!=='');
    
    if(rows.length===0){ document.getElementById('msg').innerText='Excel empty'; return; }
    
    // Assume first row is header like SL.NO, NAME... - keep it but don't display as data
    let header=rows[0];
    let dataRows=rows.slice(1); // everything after header
    
    // Save raw dataRows for display - EXACT COPY
    allRows=dataRows;
    displayRows=dataRows;
    
    document.getElementById('msg').innerText='✅ Loaded '+dataRows.length+' rows from Excel - Showing now';
    renderTable(displayRows);
    
    // Save to Firebase for this date
    saveToFirebase(dataRows);
  };
  reader.readAsArrayBuffer(file);
}

function renderTable(rows){
  let tbody=document.getElementById('body');
  tbody.innerHTML='';
  
  if(rows.length===0){
    tbody.innerHTML='<tr><td colspan="12" style="text-align:center;padding:20px">NO DATA</td></tr>';
    return;
  }
  
  // Your Excel already has 2 sides (12 columns) - show exactly as is
  // If your Excel has 6 columns, we show it as single side, and duplicate to look like photo
  
  rows.forEach(r=>{
    let tr=document.createElement('tr');
    // If row has 12 columns (like your photo) - show directly
    if(r.length>=12){
      let html='';
      for(let i=0;i<12;i++){
        html+=`<td class="${i===0||i===2||i===3||i===4||i===5||i===6||i===8||i===9||i===10||i===11?'center':''}">${r[i]||''}</td>`;
      }
      tr.innerHTML=html;
    } 
    // If row has 6 columns (SL,NAME,SHRI,TIME,BLOCK,PREV) - show left side only, right empty
    else if(r.length>=6){
      tr.innerHTML=`
        <td class="center">${r[0]||''}</td><td>${r[1]||''}</td><td class="center">${r[2]||''}</td><td class="center">${r[3]||''}</td><td class="center">${r[4]||''}</td><td class="center">${r[5]||''}</td>
        <td></td><td></td><td></td><td></td>
      `;
    }
    // If row is section like "MORNING 7AM MAIN" (1 column)
    else if(r.length===1 && r[0].toString().length>3){
      tr.innerHTML=`<td colspan="12" style="text-align:center;background:#fffbe6;font-weight:900;padding:6px">${r[0]}</td>`;
    }
    else{
      // Generic - show whatever is there
      let html='';
      for(let i=0;i<12;i++) html+=`<td>${r[i]||''}</td>`;
      tr.innerHTML=html;
    }
    tbody.appendChild(tr);
  });
  
  updateTitle();
}

function updateTitle(){
  let d=document.getElementById('date').value;
  let ds=d? new Date(d).toLocaleDateString('en-GB') : new Date().toLocaleDateString('en-GB');
  document.getElementById('paperTitle').innerText=ds+' '+document.getElementById('type').value+' DIALYSIS LIST';
}

async function saveToFirebase(rows){
  let date=document.getElementById('date').value;
  let type=document.getElementById('type').value;
  if(!date) return;
  let docId=date+'_'+type;
  try{
    await window._fb.setDoc(window._fb.doc(window._fb.db,'daily_dialysis_lists',docId),{
      date:date, type:type, rows:rows, count:rows.length, updatedAt:new Date().toISOString()
    });
    document.getElementById('msg').innerText+=' | ✅ Saved to Firebase for '+date;
  }catch(e){ console.log(e); }
}

async function loadDate(){
  let date=document.getElementById('date').value;
  let type=document.getElementById('type').value;
  if(!date) return;
  let docId=date+'_'+type;
  document.getElementById('msg').innerText='Loading '+date+' from Firebase...';
  try{
    let snap=await window._fb.getDoc(window._fb.doc(window._fb.db,'daily_dialysis_lists',docId));
    if(!snap.exists()){
      document.getElementById('msg').innerText='❌ No data for '+date+' - Please upload Excel';
      document.getElementById('body').innerHTML=`<tr><td colspan="12" style="text-align:center;padding:20px">NO DATA FOR ${date}</td></tr>`;
      return;
    }
    let data=snap.data();
    allRows=data.rows||[];
    displayRows=allRows;
    renderTable(displayRows);
    document.getElementById('msg').innerText='✅ Loaded '+allRows.length+' rows for '+date+' from Firebase';
  }catch(e){
    document.getElementById('msg').innerText='Error loading: '+e.message;
  }
}

function doSearch(){
  let q=document.getElementById('search').value.toLowerCase().trim();
  if(!q){ displayRows=allRows; renderTable(displayRows); return; }
  displayRows=allRows.filter(r=> r.join(' ').toLowerCase().includes(q));
  renderTable(displayRows);
  document.getElementById('msg').innerText='Filtered: '+displayRows.length+' / '+allRows.length;
}

window.addEventListener('load',()=>{ updateTitle(); });
</script>
</body>
</html>
