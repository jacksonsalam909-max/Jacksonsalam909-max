<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pikachu Walk Middle - Video</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;cursor:none}
body{
  height:100vh;
  width:100vw;
  background:#ffffff;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}
.center-stage{
  position:relative;
  width:100%;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}
.pikachu-video{
  width:300px;
  height:300px;
  z-index:2;
  border-radius:20px;
  overflow:hidden;
}
.pikachu-video video{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}
.shadow{
  width:120px;
  height:16px;
  background:rgba(0,0,0,.20);
  border-radius:50%;
  margin-top:-10px;
  animation: shadowPulse .4s ease-in-out infinite alternate;
  z-index:1;
}
.mouse{
  width:24px;
  height:24px;
  background:#fff782;
  border-radius:50%;
  position:absolute;
  left:0; top:0;
  z-index:9999;
  pointer-events:none;
  animation: mousePulse .5s infinite ease-in-out alternate;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
}
@keyframes shadowPulse{
  from{ transform:scaleX(1); opacity:.2; }
  to{ transform:scaleX(0.7); opacity:.35; }
}
@keyframes mousePulse{
  from{ width:24px; height:24px; }
  to{ width:14px; height:14px; }
}
</style>
</head>
<body>

<div class="center-stage">
  <div class="pikachu-video">
    <video autoplay loop muted playsinline>
      <source src="pikachu.mp4" type="video/mp4">
    </video>
  </div>
  <div class="shadow"></div>
  <div class="mouse" id="mouse"></div>
</div>

<script>
const mouse = document.getElementById('mouse');
document.addEventListener('mousemove',(e)=>{
  mouse.style.left = e.pageX - 12 + 'px';
  mouse.style.top = e.pageY - 12 + 'px';
});
</script>

</body>
</html>
