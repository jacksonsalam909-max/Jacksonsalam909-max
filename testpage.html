<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHIJA - NEW TEAL</title>
<script src="Patient.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
body{background:#f0fdfa;display:flex;min-height:100vh}
.whiteBar{position:fixed;left:0;top:0;bottom:0;width:260px;background:#042f2e;color:#99f6e0;display:flex;flex-direction:column;z-index:90}
.sHead{padding:16px;background:#fff;color:#042f2e;display:flex;align-items:center;gap:10px;border-bottom:1px solid #ccfbf1}
.sHead b{color:#0f766e;font-size:18px;font-weight:900}
.sMenu{flex:1;padding:10px;overflow:auto}
.sMenu a{display:flex;gap:10px;padding:11px 12px;border-radius:10px;text-decoration:none;color:#5eead4;font-size:12px;font-weight:600;margin-bottom:3px}
.sMenu a.active{background:#0f766e;color:#fff}
.mainWrap{flex:1;margin-left:260px;background:#f0fdfa;min-height:100vh;display:flex;flex-direction:column;width:calc(100% - 260px)}
.top{height:64px;background:#fff;border-bottom:1px solid #ccfbf1;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:10}
.content{padding:16px;flex:1}
.headCard{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;border-radius:14px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 20px rgba(15,118,110,.25);margin-bottom:12px}
.headCard h1{font-size:20px;font-weight:900}
.ctrl{background:#fff;border:1px solid #ccfbf1;border-radius:12px;padding:10px;display:flex;gap:8px;margin-bottom:12px}
.ctrl input{flex:1;padding:10px 12px;border-radius:9px;border:1.5px solid #ccfbf1;background:#f0fdfa;font-weight:600;outline:0}
.vBtn{width:36px;height:32px;border-radius:8px;border:1px solid #ccfbf1;background:#fff;font-weight:800;cursor:pointer;color:#0f766e}
.vBtn.active{background:#0f766e;color:#fff;border-color:#0f766e}
.addBtn{background:#fff;color:#0f766e;padding:8px 14px;border-radius:8px;font-weight:800;text-decoration:none;font-size:12px}

/* NEW TEAL MATCHING - 100% */
.tableWrap{background:#fff;border:1px solid #ccfbf1;border-radius:14px;overflow:hidden;box-shadow:0 4px 16px rgba(15,118,110,.08)}
table{width:100%;border-collapse:collapse;min-width:1050px}
th{padding:14px 10px;font-size:10px;color:#fff;background:#0f766e;text-transform:uppercase;font-weight:800;letter-spacing:.7px;white-space:nowrap}
td{padding:12px 10px;border-bottom:1px solid #f0fdfa;vertical-align:middle;white-space:nowrap}
tr:hover td{background:#ccfbf1!important}
.tSL{width:32px;height:32px;background:#0f766e;color:#fff;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:12px}
.tPhoto{width:58px;height:58px;border-radius:10px;background:#ccfbf1;border:1.5px solid #99f6e0;display:grid;place-items:center;font-weight:900;color:#0f766e;cursor:pointer;overflow:hidden}
.tPhoto img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.tName{font-weight:800;color:#042f2e;font-size:14px}
.tBadge{background:#ccfbf1;border:1px solid #99f6e0;color:#0f766e;padding:5px 10px;border-radius:20px;font-weight:700;font-size:11px;display:inline-block}
.tAddr{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tEdit{background:#0f766e;color:#fff;border:0;padding:7px 12px;border-radius:7px;font-weight:700;font-size:11px;cursor:pointer}
.tDel{background:#fff;border:1px solid #ccfbf1;color:#5f9c95;padding:7px 12px;border-radius:7px;font-weight:700;font-size:11px;cursor:pointer;margin-left:4px}

/* GRID TEAL */
.gridWrap{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.gCard{background:#fff;border:1px solid #ccfbf1;border-radius:14px;padding:14px;text-align:center;transition:.2s}
.gCard:hover{border-color:#99f6e0;box-shadow:0 8px 20px rgba(15,118,110,.12)}
.gSL{position:absolute;top:12px;left:12px;width:28px;height:28px;background:#0f766e;color:#fff;border-radius:7px;display:grid;place-items:center;font-weight:800;font-size:11px}
.gPhoto{width:74px;height:74px;border-radius:50%;background:#ccfbf1;border:2px solid #99f6e0;margin:6px auto 10px;display:grid;place-items:center;font-weight:900;color:#0f766e;font-size:20px;overflow:hidden;cursor:pointer;position:relative}
.gPhoto img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.gName{font-weight:800;font-size:15px;color:#042f2e}
.gSmall{font-size:10px;color:#5f9c95;font-weight:600;margin-bottom:8px}
.gLine{display:flex;justify-content:space-between;background:#f0fdfa;border:1px solid #ccfbf1;border-radius:7px;padding:6px 8px;margin-bottom:4px}
.gLab{font-size:9px;font-weight:800;color:#0f766e;text-transform:uppercase}
.gVal{font-size:11px;font-weight:700;color:#042f2e;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gAct{display:flex;gap:6px;margin-top:10px}
.gAct button{flex:1;padding:8px;border-radius:8px;font-weight:700;font-size:11px;cursor:pointer;border:0}
.gAct .edit{background:#0f766e;color:#fff}
.gAct .del{background:#f0fdfa;color:#5f9c95;border:1px solid #ccfbf1}

.hidden{display:none!important}
.pager{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid #ccfbf1;border-radius:10px;padding:10px;margin-top:12px}
.pBtn{padding:7px 12px;border-radius:7px;border:1px solid #ccfbf1;background:#fff;font-weight:700;cursor:pointer;font-size:11px;color:#0f766e}
#photoModal{display:none;position:fixed;inset:0;background:rgba(4,47,46,.85);z-index:9999;align-items:center;justify-content:center;flex-direction:column}
#photoModal.show{display:flex}
#photoView{width:90vw;max-width:380px;aspect-ratio:1/1;object-fit:cover;border-radius:50%;border:4px solid #fff}
#photoView.squareMode{border-radius:12px!important}
@media(max-width:1100px){.gridWrap{grid-template-columns:repeat(2,1fr)}} 
@media(max-width:700px){.whiteBar{display:none} .mainWrap{margin-left:0;width:100%} .gridWrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<script>if(localStorage.getItem('shija_logged')!=='1'){location.href='login.html'}</script>
<div class="whiteBar"><div class="sHead"><b>SHIJA TEAL</b></div><div class="sMenu"><a class="active">TOTAL PATIENT</a><a>CMHT TOTAL</a><a>CLAIM</a><a>SEARCH</a><a>ADD PATIENT</a></div></div>
<div class="mainWrap">
<div class="top"><b style="color:#0f766e">SHIJA Dialysis - Teal New</b></div>
<div class="content">
<div class="headCard"><h1>Total Patients NEW <span id="count" style="font-size:12px;opacity:.9;margin-left:6px"></span></h1><a href="add.html" class="addBtn">+ Add</a></div>
<div class="ctrl"><input id="search" placeholder="Search name, SHRI, PMJAY, address..." oninput="onSearch()"><button class="vBtn active" id="listBtn" onclick="setView('list')">☰</button><button class="vBtn" id="gridBtn" onclick="setView('grid')">⊞</button></div>
<div class="tableWrap" id="tableWrap"><div style="overflow:auto"><table id="tbl"></table></div></div>
<div class="gridWrap hidden" id="gridWrap"></div>
<div class="pager"><button class="pBtn" onclick="prevPage()">← Prev</button><div id="pageInfo" style="font-weight:800;font-size:12px;color:#0f766e"></div><button class="pBtn" onclick="nextPage()">Next →</button></div>
</div>
</div>
<div id="photoModal" onclick="this.classList.remove('show')"><img id="photoView"><div id="photoName" style="color:#fff;margin-top:12px;font-weight:800"></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app = initializeApp(firebaseConfig,"tealNew");const db = getFirestore(app);
let allPatients=[],filtered=[],currentPage=1,pageSize=12,photoCache={},view='list';
function getKey(p){return String(p.key||p.shri||p.id||p.name).trim()}
function getDel(){try{return JSON.parse(localStorage.getItem('deletedKeys')||'[]')}catch{return[]}}
function getInit(n){return (n||'P').charAt(0).toUpperCase()}
window.onSearch=()=>{currentPage=1;applyFilter()}
window.applyFilter=()=>{let q=document.getElementById('search').value.toLowerCase();filtered=allPatients.filter(p=>!p.deleted && [p.name,p.shri,p.pmjay,p.addr].join(' ').toLowerCase().includes(q));renderAll()}
window.triggerPhoto=(shri)=>{document.getElementById('file_'+shri.replace(/[^a-zA-Z0-9]/g,'_'))?.click()}
async function getFullPhoto(shri){try{let clean=shri.replace(/[^a-zA-Z0-9]/g,'_');let snap=await getDocs(collection(db,"patient_photos",clean+"_photo","chunks"));let a=[];snap.forEach(d=>a.push(d.data()));a.sort((x,y)=>x.index-y.index);return a.map(x=>x.data).join('')}catch{return null}}
window.openPhoto=(shri,name,mode)=>{let d=photoCache[shri];if(!d){triggerPhoto(shri);return}let v=document.getElementById('photoView');v.className='';if(mode==='square')v.classList.add('squareMode');document.getElementById('photoName').textContent=name;v.src=d;document.getElementById('photoModal').classList.add('show')}
window.uploadPhoto=async(file,shri)=>{if(!file)return;let b64=await new Promise(r=>{let fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(file)});let clean=shri.replace(/[^a-zA-Z0-9]/g,'_');let id=clean+"_photo";let ch=[];for(let i=0;i<b64.length;i+=800000)ch.push(b64.substring(i,i+800000));await setDoc(doc(db,"patient_photos",id),{shri,cleanShri:clean,chunkCount:ch.length});for(let j=0;j<ch.length;j++)await setDoc(doc(db,"patient_photos",id,"chunks",String(j)),{index:j,data:ch[j]});photoCache[shri]=b64;renderAll()}
async function loadPhotos(){try{let snap=await getDocs(collection(db,"patient_photos"));for(let d of snap.docs){let shri=d.data().shri;let full=await getFullPhoto(shri);if(full)photoCache[shri]=full}renderAll()}catch{}}
window.renderAll=()=>{
 let tp=Math.max(1,Math.ceil(filtered.length/pageSize));if(currentPage>tp)currentPage=tp;
 let st=(currentPage-1)*pageSize;let data=filtered.slice(st,st+pageSize);
 let html='<tr><th>SL</th><th>Photo</th><th>Patient Name</th><th>PMJAY ID</th><th>SHRI ID</th><th>Patient Address</th><th>Action</th></tr>';
 data.forEach((p,i)=>{let clean=p.shri.replace(/[^a-zA-Z0-9]/g,'_');let photo=photoCache[p.shri];let av=photo?`<img src="${photo}">`:`${getInit(p.name)}`;let sl=st+i+1;html+=`<tr><td><div class="tSL">${sl}</div></td><td><div class="tPhoto" onclick="openPhoto('${p.shri}','${p.name}','square')">${av}</div><input type="file" id="file_${clean}" style="display:none" accept="image/*" onchange="uploadPhoto(this.files[0],'${p.shri}')"></td><td><div class="tName">${p.name}</div></td><td><span class="tBadge">${p.pmjay||'-'}</span></td><td><span class="tBadge">${p.shri||'-'}</span></td><td><span class="tBadge tAddr">${p.addr||'-'}</span></td><td><button class="tEdit" onclick="editP(${allPatients.indexOf(p)})">Edit</button><button class="tDel" onclick="delP(${allPatients.indexOf(p)})">Del</button></td></tr>`});
 document.getElementById('tbl').innerHTML=html;
 let gridHtml='';data.forEach((p,i)=>{let clean=p.shri.replace(/[^a-zA-Z0-9]/g,'_');let photo=photoCache[p.shri];let av=photo?`<img src="${photo}">`:`${getInit(p.name)}`;let sl=st+i+1;gridHtml+=`<div class="gCard" style="position:relative"><div class="gSL">${sl}</div><div class="gPhoto" onclick="openPhoto('${p.shri}','${p.name}','circle')">${av}</div><div class="gName">${p.name}</div><div class="gSmall">${p.addr||''}</div><div class="gLine"><span class="gLab">PMJAY</span><span class="gVal">${p.pmjay||'-'}</span></div><div class="gLine"><span class="gLab">SHRI</span><span class="gVal">${p.shri||'-'}</span></div><div class="gLine"><span class="gLab">Address</span><span class="gVal">${p.addr||'-'}</span></div><div class="gAct"><button class="edit" onclick="editP(${allPatients.indexOf(p)})">Edit</button><button class="del" onclick="delP(${allPatients.indexOf(p)})">Delete</button></div><input type="file" id="file_${clean}" style="display:none" accept="image/*" onchange="uploadPhoto(this.files[0],'${p.shri}')"></div>`});
 document.getElementById('gridWrap').innerHTML=gridHtml;
 document.getElementById('count').textContent=filtered.length+' Patients';
 document.getElementById('pageInfo').textContent='Page '+currentPage+' / '+tp;
};
window.setView=(v)=>{view=v;document.getElementById('listBtn').classList.toggle('active',v==='list');document.getElementById('gridBtn').classList.toggle('active',v==='grid');document.getElementById('tableWrap').classList.toggle('hidden',v!=='grid');document.getElementById('gridWrap').classList.toggle('hidden',v!=='list');if(v==='list'){document.getElementById('tableWrap').classList.remove('hidden');document.getElementById('gridWrap').classList.add('hidden')}else{document.getElementById('tableWrap').classList.add('hidden');document.getElementById('gridWrap').classList.remove('hidden')}renderAll()};
window.prevPage=()=>{if(currentPage>1){currentPage--;renderAll()}};
window.nextPage=()=>{let tp=Math.ceil(filtered.length/pageSize);if(currentPage<tp){currentPage++;renderAll()}};
window.delP=async(idx)=>{let p=allPatients[idx];if(!confirm('DELETE '+p.name+'?'))return;let k=getKey(p);let l=getDel();l.push(k);localStorage.setItem('deletedKeys',JSON.stringify(l));p.deleted=true;applyFilter();try{await setDoc(doc(db,"patients",k),{deleted:true},{merge:true})}catch{}};
window.editP=(idx)=>{let p=allPatients[idx];let n=prompt('Edit Name',p.name);if(n){p.name=n;renderAll()}};
async function init(){
 let del=getDel();let map={};
 function add(raw,over){let key=String(raw.shri||raw.id||raw.name).trim();if(!key)return;let isDel=del.includes(key)||raw.deleted;let obj={key,name:String(raw.patientName||raw.name||'').trim(),shri:String(raw.shri||raw.shriId||'').trim(),pmjay:String(raw.pmjay||raw.pmjayId||'').trim(),addr:String(raw.addr||raw.address||'').trim(),deleted:isDel};if(over||!map[key])map[key]=obj}
 if(typeof patientData!=='undefined')patientData.forEach(pd=>add(pd,false));
 try{let snap=await getDocs(collection(db,"patients"));snap.forEach(d=>{if(d.data().deleted){if(map[d.id])map[d.id].deleted=true;return}add({id:d.id,...d.data()},true)})}catch{}
 allPatients=Object.values(map).filter(p=>!p.deleted);allPatients.sort((a,b)=>a.name.localeCompare(b.name));applyFilter();setTimeout(loadPhotos,600);
}
init();
</script>
</body>
</html>
