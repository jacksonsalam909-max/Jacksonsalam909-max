<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHIJA - CLAIM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter}
html,body{background:#f8fafc!important;overflow-x:hidden}
body{display:flex}
.whiteBar{position:fixed;left:0;top:0;bottom:0;width:270px;min-width:270px;height:100vh;background:#0f172a;display:flex;flex-direction:column;justify-content:space-between;z-index:90;transition:.32s;scrollbar-width:none!important;-ms-overflow-style:none!important}
.whiteBar.folded{width:72px!important;min-width:72px!important}
.mainWrap{flex:1;margin-left:270px;transition:.32s;background:#f8fafc!important;width:calc(100% - 270px)}
.whiteBar.folded ~ .mainWrap{margin-left:72px!important;width:calc(100% - 72px)!important}
.sHead{padding:18px 14px;display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid #e2e8f0}
.sLogo{width:46px;height:46px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;border:1px solid #e2e8f0;overflow:hidden}
.sLogo img{width:100%;height:100%;object-fit:contain}
.sTitle b{color:#0f172a;font-size:18px;font-weight:900;display:block;line-height:1}
.sTitle span{font-size:11px;color:#64748b;text-transform:uppercase;font-weight:700;display:block;margin-top:2px}
.whiteBar.folded .sTitle,.whiteBar.folded .ml{display:none}
.sMenu{flex:1;padding:8px;overflow-y:auto;scrollbar-width:none!important}
.sMenu::-webkit-scrollbar,.whiteBar::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}
.sMenu a{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:12px;text-decoration:none;color:#94a3b8;font-size:13.5px;font-weight:500;margin-bottom:2px;white-space:nowrap;transition:all .28s cubic-bezier(.34,1.56,.64,1)!important;border-left:3px solid transparent}
.sMenu a:hover{background:#1e293b!important;color:#fff!important;transform:translateX(6px) scale(1.02);border-left-color:#2563eb;box-shadow:0 4px 12px rgba(37,99,235,.25)}
.sMenu a.active{background:#1e293b;color:#fff;font-weight:600;border-left-color:#2563eb}
.mi{width:34px;min-width:34px;height:34px;display:grid;place-items:center;background:#1e293b;border-radius:8px;transition:.28s}
.mi svg{width:18px;height:18px;stroke:#94a3b8;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sMenu a:hover .mi{transform:scale(1.1);background:#2563eb}
.sMenu a:hover .mi svg,.sMenu a.active .mi svg{stroke:#fff}
.sMenu a.active .mi{background:#3c25eb}
.sFoot{padding:12px;border-top:1px solid #1e293b;font-size:11px;color:#64748b;text-align:center}
.whiteBar.folded .sMenu a{justify-content:center!important;padding:12px 0!important;gap:0!important}
.whiteBar.folded .sHead{justify-content:center!important;padding:12px 0!important}
.top{height:72px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;color:#0f172a}
.menuBtnTop{width:42px;height:40px;background:#fff;border:none!important;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.menuBtnTop span{display:block;width:22px;height:2.6px;background:#0f172a;border-radius:2px}
#mobOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:89}
#mobOverlay.show{display:block}
.content{padding:12px;background:#f8fafc!important;position:relative}
.card{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;border:1.5px solid #e2e8f0;position:relative;overflow:hidden}
.dataCard{position:relative;z-index:1;min-height:520px;background:#fff;border:1.5px solid #e2e8f0;border-radius:16px;box-shadow:0 4px 16px #00000006}
.tableWatermark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:420px;max-width:70%;z-index:5!important;pointer-events:none!important;opacity:0.14!important}
.tableWatermark img{width:100%;height:auto;display:block;filter:grayscale(0.1)}
.sheetWrap{overflow:auto;background:rgba(255,255,255,0.92)!important;max-height:78vh;border-radius:0;position:relative;z-index:2}
table{width:100%;border-collapse:collapse;min-width:1000px}
th{padding:14px 10px;font-size:11px;color:#fff;background:#022a5e;text-align:center;position:sticky;top:0;z-index:2;font-weight:900;text-transform:uppercase}
td{padding:13px 10px;font-size:14px;border-bottom:1px solid #f1f5f9;text-align:center;background:#fff;font-weight:700;text-transform:uppercase;transition:.28s}
td.nameCol{text-align:left;max-width:240px;white-space:normal}
.nameInner{font-size:14px;font-weight:800;color:#0f172a;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
.claimPill{background:#7c3aed;color:#fff;padding:6px 12px;border-radius:20px;font-weight:900;font-size:11px;display:inline-block;min-width:80px}
.shriTable{background:#2563eb;color:#fff;padding:6px 12px;border-radius:8px;font-weight:800;font-size:12px;display:inline-block;min-width:80px}
.gridWrap{display:none;grid-template-columns:repeat(3,1fr);gap:14px;padding:8px;position:relative;z-index:2}
.gridWrap.show{display:grid!important}
.pCard{background:#fff!important;border:1.5px solid #e2e8f0;border-radius:12px;padding:16px;box-shadow:0 3px 8px rgba(0,0,0,0.06);transition:all .32s cubic-bezier(.34,1.56,.64,1);display:flex;flex-direction:column;justify-content:space-between}
.pCard:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 18px 32px rgba(37,99,235,0.22)!important;border-color:#2563eb!important}
.pCardSL{background:#0a1931;color:#fff;font-weight:900;font-size:12px;padding:5px 10px;border-radius:10px;transition:.28s}
.pCard:hover .pCardSL{transform:scale(1.1);background:#2563eb}
.pCardName{font-weight:900;font-size:16px;text-transform:uppercase;color:#0f172a;margin:8px 0;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.filterBar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.fInput{height:36px;padding:0 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-weight:700;font-size:13px;background:#fff;outline:0}
.fInput:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.15)}
@media(max-width:900px){.whiteBar{transform:translateX(-100%)}.whiteBar.mOpen{transform:translateX(0)}.mainWrap{margin-left:0!important;width:100%!important}.gridWrap.show{grid-template-columns:1fr!important}}
</style>
<script>function toggleWhiteBar(){if(window.innerWidth<=900){document.getElementById('whiteBar').classList.toggle('mOpen');document.getElementById('mobOverlay').classList.toggle('show');}else{document.getElementById('whiteBar').classList.toggle('folded');}}function closeMob(){document.getElementById('whiteBar').classList.remove('mOpen');document.getElementById('mobOverlay').classList.remove('show');}</script>
</head>
<body>
<div id="mobOverlay" onclick="closeMob()"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app=initializeApp(cfg,"claim_final");
const db=getFirestore(app);
window._fb={db,collection,getDocs,doc,deleteDoc};
</script>
<div class="whiteBar" id="whiteBar"><div style="display:flex;flex-direction:column;height:100%;overflow:hidden"><div class="sHead"><div class="sLogo"><img src="logoc.png"></div><div class="sTitle"><b>SHIJA</b><span>DIALYSIS CARE</span></div></div><div class="sMenu">
<a href="index.html"><span class="mi"><svg viewBox="0 0 24 24"><path d="M3 9L12 2l9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span><span class="ml">HOME</span></a>
<a href="claim.html" class="active"><span class="mi"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span><span class="ml">CLAIM</span></a>
<a href="discharge.html"><span class="mi"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span><span class="ml">DISCHARGE PATIENT</span></a>
<a href="discharge_upload.html"><span class="mi"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></span><span class="ml">UPLOAD FILES</span></a>
</div></div><div class="sFoot">SHIJA • CLAIM</div></div>
<div class="mainWrap"><div class="top"><div class="logo"><button type="button" class="menuBtnTop" onclick="toggleWhiteBar()"><span></span><span></span><span></span></button> CLAIM LIST <div id="countBadge" style="background:#dcfce7;color:#14532d;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:900;margin-left:10px">0 CLAIMED</div></div></div>
<div class="content">
<div class="card">
<div class="filterBar">
<input type="search" id="searchInput" class="fInput" placeholder="Search SHRI / PMJAY / Name / Claim ID" style="min-width:260px;flex:1" oninput="applyFilter()">
<input type="date" id="fDate" class="fInput" onchange="applyFilter()">
<select id="fBlock" class="fInput" onchange="applyFilter()"><option value="">ALL BLOCK</option><option>MAIN</option><option>ITOCHA</option></select>
<button class="fInput" style="background:#0f172a;color:#fff;font-weight:800;cursor:pointer" onclick="clearF()">CLEAR</button>
</div>
</div>
<div class="card dataCard">
<div class="tableWatermark"><img src="loko.png"></div>
<div class="sheetWrap" id="tableWrap"><table><thead><tr><th>SL</th><th>PATIENT NAME</th><th>SHRI ID</th><th>PMJAY ID</th><th>CLAIM ID</th><th>DATE</th><th>BLOCK</th><th>ACTION</th></tr></thead><tbody id="tbody"><tr><td colspan="8" style="padding:20px;text-align:center;font-weight:800">LOADING CLAIMS...</td></tr></tbody></table></div>
<div class="gridWrap" id="gridWrap"></div>
</div>
</div></div>
<script>
let all=[],filtered=[];
function getToday(){return new Date().toISOString().slice(0,10);}
async function loadAll(){
let snapClaims=await window._fb.getDocs(window._fb.collection(window._fb.db,'claims'));
let snapDis=await window._fb.getDocs(window._fb.collection(window._fb.db,'discharges'));
let map={};
snapDis.forEach(d=>{let o=d.data();o._id=d.id;if(o.claimId) map[d.id]=o;});
snapClaims.forEach(d=>{let o=d.data();o._id=d.id;map[d.id]= {...(map[d.id]||{}), ...o, _id:d.id};});
all=Object.values(map);
all.sort((a,b)=>new Date(b.claimedAt||0)-new Date(a.claimedAt||0));
applyFilter();
}
function applyFilter(){
let search=document.getElementById('searchInput').value.toLowerCase().trim();
let date=document.getElementById('fDate').value;
let block=document.getElementById('fBlock').value;
filtered=all.filter(p=>{
if(date && p.date!==date && p.claimDate!==date) return false;
if(block && (p.block||'').toUpperCase()!==block) return false;
if(search){
let s=`${p.patientName||p.name||''} ${p.shri||p.shriId||''} ${p.pmjayCmhtId||''} ${p.claimId||''}`.toLowerCase();
if(s.indexOf(search)===-1) return false;
}
return true;
});
document.getElementById('countBadge').innerText=`${filtered.length} CLAIMED`;
render();
}
function render(){
let tbody=document.getElementById('tbody');
let grid=document.getElementById('gridWrap');
tbody.innerHTML=''; grid.innerHTML='';
if(filtered.length===0){
tbody.innerHTML='<tr><td colspan="8" style="padding:20px;text-align:center;font-weight:800;color:#64748b">NO CLAIMS YET - Add from discharge_upload.html</td></tr>';
grid.innerHTML='<div style="grid-column:1/-1;padding:20px;text-align:center;font-weight:800;color:#64748b">NO CLAIMS</div>';
return;
}
filtered.forEach((p,i)=>{
let shri=p.shri||p.shriId||''; let pmjay=p.pmjayCmhtId||p.pmjayId||''; let name=(p.patientName||p.name||'').toUpperCase(); let claim=p.claimId||'';
let tr=document.createElement('tr');
tr.innerHTML=`<td>${i+1}</td><td class="nameCol"><div class="nameInner">${name}</div></td><td><span class="shriTable">${shri}</span></td><td>${pmjay}</td><td><span class="claimPill">${claim}</span></td><td>${p.date||p.claimDate||''}</td><td>${p.block||''}</td><td><button onclick="removeClaim('${p._id}')" style="background:#fff;border:1.5px solid #fecaca;color:#ef4444;padding:5px 10px;border-radius:6px;font-weight:800;cursor:pointer">DELETE</button></td>`;
tbody.appendChild(tr);
let card=document.createElement('div'); card.className='pCard';
card.innerHTML=`<div style="display:flex;justify-content:space-between"><span class="pCardSL">#${i+1}</span><span class="claimPill">${claim}</span></div><div class="pCardName">${name}</div><div style="font-size:12px;font-weight:700;color:#475569;background:#f8fafc;padding:6px 10px;border-radius:6px;margin-bottom:8px">SHRI: ${shri} | PMJAY: ${pmjay}</div><div style="display:flex;gap:6px"><span style="background:#f1f5f9;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:800">${p.block||''}</span><span style="background:#f1f5f9;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:800">${p.date||p.claimDate||''}</span></div>`;
grid.appendChild(card);
});
}
function clearF(){document.getElementById('searchInput').value='';document.getElementById('fDate').value='';document.getElementById('fBlock').value='';applyFilter();}
async function removeClaim(id){
if(!confirm('Remove claim?')) return;
await window._fb.deleteDoc(window._fb.doc(window._fb.db,'claims',id));
await window._fb.deleteDoc(window._fb.doc(window._fb.db,'discharges',id)).catch(()=>{});
loadAll();
}
window.addEventListener('load',()=>{
document.getElementById('fDate').value=getToday();
setTimeout(loadAll,500);
document.getElementById('tableWrap').style.display='block';
});
</script>
</body>
</html>
