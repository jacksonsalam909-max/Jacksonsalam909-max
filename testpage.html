<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui}
body{background:#f1f5f9;display:flex;min-height:100vh;overflow-x:hidden}
.whiteBar{position:fixed;left:0;top:0;bottom:0;width:270px;min-width:270px;height:100vh;background:#0f172a;color:#94a3b8;display:flex;flex-direction:column;justify-content:space-between;z-index:90;overflow:hidden;transition:width .32s ease}
.whiteBar.folded{width:72px!important;min-width:72px!important}
.mainWrap{flex:1;margin-left:270px;transition:margin-left .32s ease;min-height:100vh;display:flex;flex-direction:column;background:#eef2ff;width:calc(100% - 270px)}
.whiteBar.folded ~ .mainWrap{margin-left:72px!important;width:calc(100% - 72px)}
.sHead{padding:18px 14px;display:flex;align-items:center;gap:12px;background:#fff!important;border-bottom:1px solid #e2e8f0}
.sLogo{width:46px;min-width:46px;height:46px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;border:1px solid #e2e8f0}
.sLogo img{width:100%;height:100%;object-fit:contain}
.sTitle b{color:#0f172a;font-size:18px;font-weight:900}
.sTitle span{font-size:11px;color:#64748b;text-transform:uppercase;font-weight:700}
.whiteBar.folded .sTitle{display:none}
.sMenu{flex:1;padding:8px;overflow-y:auto}
.sMenu a{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:12px;text-decoration:none;color:#94a3b8;font-size:13.5px;margin-bottom:2px;white-space:nowrap}
.sMenu a.active{background:#1e293b;color:#fff;border-left:3px solid #facc15}
.mi{width:34px;min-width:34px;height:34px;display:grid;place-items:center;background:#1e293b;border-radius:8px}
.mi svg{width:18px;height:18px;stroke:#94a3b8;stroke-width:1.8;fill:none}
.sMenu a.active .mi{background:#3c25eb}
.sMenu a.active .mi svg{stroke:#fff}
.ml{overflow:hidden;text-overflow:ellipsis}
.whiteBar.folded .ml{display:none!important}
.sFoot{padding:12px;border-top:1px solid #1e293b;font-size:11px;color:#64748b;text-align:center}
.top{height:72px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;color:#0f172a}
.menuBtnTop{width:40px;height:36px;background:transparent!important;border:none!important;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.menuBtnTop span{display:block;width:22px;height:2.6px;background:#0f172a;border-radius:2px}
.badgeBlue{background:#f59e0b;color:#000;padding:7px 14px;border-radius:20px;font-weight:900;font-size:13px;border:1px solid #f59e0b}
.content{flex:1;padding:22px 24px;background:#f8fafc}
.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;border:1.5px solid #e2e8f0}
.label{font-size:11px;font-weight:900;color:#475569;margin-bottom:6px;text-transform:uppercase}
.btn{padding:10px 16px;border:0;border-radius:9px;font-weight:800;font-size:13px;cursor:pointer}
.btnDark{background:#3c25eb!important;color:#fff!important}
.btnSmall{padding:8px 12px!important;font-size:12px!important}
.btnGreen{background:#3c25eb!important;color:#fff!important}
.input{padding:11px 14px;border:1.5px solid #cbd5e1;border-radius:9px;font-weight:700;font-size:14px;background:#fff;width:100%;outline:0}
.inputSmall{padding:9px 12px!important;font-size:13px!important;height:40px!important}
.shriGray{background:#f1f5f9;color:#334155;padding:6px 10px;border-radius:8px;font-weight:800;font-size:12px;display:inline-block;min-width:75px;text-align:center;border:1px solid #e2e8f0}
.pmjayBlue{background:#f1f5f9;color:#334155;padding:6px 10px;border-radius:8px;font-weight:800;font-size:12px;display:inline-block;min-width:85px;text-align:center;border:1px solid #e2e8f0}
.searchBox{position:relative}
.searchResults{position:absolute;top:52px;left:0;right:0;background:#fff;border:2px solid #3c25eb;border-radius:12px;max-height:380px;overflow:auto;z-index:500;display:none;box-shadow:0 12px 32px rgba(0,0,0,0.2)}
.searchResults.open{display:block}
.sItem{padding:14px;border-bottom:1px solid #f1f5f9;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.sItem:hover{background:#eff6ff}
.sName{font-weight:900;font-size:14px;color:#0f172a}
.sMeta{font-size:12px;color:#64748b;font-weight:700;margin-top:3px}
.addPanel{max-height:0;overflow:hidden;transition:max-height .4s ease;background:#fff;border:0 solid #3c25eb;border-radius:12px;margin-top:0;padding:0 14px}
.addPanel.open{max-height:700px;border-width:2px;margin-top:12px;padding:18px}
.sheetWrap{background:#fff;border:1.5px solid #e2e8f0;overflow:auto;max-height:78vh;border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:900px;table-layout:fixed}
th{position:sticky;top:0;background:#0f172a;color:#fff;padding:14px 8px;font-size:12px;text-align:center;font-weight:800;white-space:nowrap}
td{border-bottom:1px solid #e2e8f0;padding:12px 8px;height:64px;font-size:14px;font-weight:700;text-align:center;text-transform:uppercase;background:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
th:nth-child(1),td:nth-child(1){width:55px}
th:nth-child(2),td:nth-child(2){width:220px}
th:nth-child(3),td:nth-child(3){width:120px}
th:nth-child(4),td:nth-child(4){width:130px}
th:nth-child(5),td:nth-child(5){width:85px}
th:nth-child(6),td:nth-child(6){width:85px}
th:nth-child(7),td:nth-child(7){width:140px}
td.nameCol{text-align:left;padding-left:10px}
.badge{background:#0f172a;color:#fff;padding:6px 12px;border-radius:20px;font-weight:900;font-size:11px}
.openBtn{background:#facc15!important;color:#000!important;width:28px!important;min-width:28px!important;height:28px!important;border-radius:7px!important;border:1.2px solid #eab308!important;font-weight:900!important;font-size:14px!important;cursor:pointer;display:grid;place-items:center;transition:.2s}
.openBtn:hover{background:#000!important;color:#facc15!important;transform:scale(1.15)}
.delBtn{background:#ef4444!important;color:#fff!important;width:28px!important;min-width:28px!important;height:28px!important;border-radius:7px!important;border:1.2px solid #dc2626!important;font-weight:900!important;font-size:12px!important;cursor:pointer;display:grid;place-items:center;transition:.2s}
.delBtn:hover{background:#000!important;color:#ef4444!important;transform:scale(1.15)}
.filterBox2{display:flex;flex-direction:column;gap:12px}
.filterRow1{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.filterRow2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid #f1f5f9;padding-top:12px}
.dateArrowBtn{width:36px;height:36px;border-radius:9px;border:1.5px solid #e2e8f0;background:#fff;color:#0f172a;font-weight:900;font-size:13px;cursor:pointer;display:grid;place-items:center}
.dateNavWrap{display:flex;align-items:center;gap:6px;background:#fff!important;border:1.5px solid #e2e8f0;border-radius:10px;padding:3px 6px}
#fDate{width:150px;border:none!important;background:#fff!important;color:#0f172a!important;font-weight:800;text-align:center;font-size:14px}
#mobOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:89}
#mobOverlay.show{display:block}
@media(max-width:900px){.whiteBar{transform:translateX(-100%);width:270px!important}.whiteBar.mOpen{transform:translateX(0)}.mainWrap{margin-left:0!important;width:100%!important}}
</style>
<script>function toggleWhiteBar(){if(innerWidth<=900){document.getElementById('whiteBar').classList.toggle('mOpen');document.getElementById('mobOverlay').classList.toggle('show');}else{var bar=document.getElementById('whiteBar');bar.classList.toggle('folded');}}function closeMob(){document.getElementById('whiteBar').classList.remove('mOpen');document.getElementById('mobOverlay').classList.remove('show');}</script>
</head>
<body>
<div id="mobOverlay" onclick="closeMob()"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app=initializeApp(cfg,"app_"+Math.random());
const db=getFirestore(app);
window._fb={db,collection,getDocs,doc,setDoc,deleteDoc,_docsCache:{}};
</script>
<div class="whiteBar" id="whiteBar">
<div style="display:flex;flex-direction:column;height:100%;overflow:hidden">
<div class="sHead"><div class="sLogo"><img src="logoc.png"></div><div class="sTitle"><b>SHIJA</b><span>DIALYSIS CARE</span></div></div>
<div class="sMenu">
<a href="index.html"><span class="mi"><svg viewBox="0 0 24 24"><path d="M3 9L12 2l9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span><span class="ml">HOME</span></a>
<a href="discharge.html" class="active"><span class="mi"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></svg></span><span class="ml">DISCHARGE PATIENT</span></a>
<a href="claim.html"><span class="mi"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg></span><span class="ml">CLAIM</span></a>
</div></div><div class="sFoot"><span>SHIJA</span></div></div>
<div class="mainWrap">
<div class="top"><div class="logo"><button type="button" class="menuBtnTop" onclick="toggleWhiteBar()"><span></span><span></span><span></span></button> DISCHARGE PATIENT <div class="badgeBlue">PMJAY</div></div></div>
<div class="content">
<div class="card">
<div class="label">ADD DISCHARGE PATIENT - ONLY PMJAY</div>
<div class="searchBox"><input type="search" id="searchTotal" class="input" placeholder="SEARCH PMJAY PATIENT..."><div class="searchResults" id="searchResults"></div></div>
<div class="addPanel" id="addPanel"><div style="display:flex;justify-content:space-between"><div id="addPanelInfo"></div><button class="btn btnDark btnSmall" onclick="closeAddPanel()">✕</button></div><div style="display:flex;gap:12px;margin:12px 0"><select id="addTimeSelect" class="input inputSmall" style="width:160px"><option value="">SELECT TIME</option><option>7:00 AM</option><option>12:00 PM</option><option>5:00 PM</option><option>9:00 PM</option></select><select id="addBlockSelect" class="input inputSmall" style="width:140px"><option value="">SELECT BLOCK</option><option>MAIN</option><option>ITOCHA</option></select></div><button class="btn btnGreen" onclick="confirmAddDischarge()">ADD TO DISCHARGE →</button></div></div>
<div class="card"><div class="filterBox2"><div class="filterRow1"><div><div class="label" style="font-size:11px">DATE - TODAY</div><div class="dateNavWrap"><button type="button" class="dateArrowBtn" onclick="changeDateBy(-1)">◀</button><input type="date" id="fDate"><button type="button" class="dateArrowBtn" onclick="changeDateBy(1)">▶</button></div></div><div><div class="label" style="font-size:11px">TIME</div><select id="fTime" class="input inputSmall" style="width:130px"><option value="">ALL TIME</option><option>7:00 AM</option><option>12:00 PM</option><option>5:00 PM</option><option>9:00 PM</option></select></div><div><div class="label" style="font-size:11px">BLOCK</div><select id="fBlock" class="input inputSmall" style="width:110px"><option value="">ALL BLOCK</option><option>MAIN</option><option>ITOCHA</option></select></div><div><div class="label" style="font-size:11px">ACTION</div><button class="btn btnDark btnSmall" onclick="clearFilters()">CLEAR</button></div></div><div class="filterRow2"><input type="search" id="fSearch" class="input inputSmall" placeholder="Search..." style="max-width:320px;border-radius:20px"><div class="badge" id="badgeD">0</div><span id="pageInfo"></span><button class="btn btnDark btnSmall" onclick="changePage(-1)">PREV</button><button class="btn btnDark btnSmall" onclick="changePage(1)">NEXT</button></div></div></div>
<div class="card" style="padding:10px"><div class="sheetWrap"><table><thead><tr><th>SL</th><th>PATIENT NAME</th><th>SHRI ID</th><th>PMJAY ID</th><th>TIME</th><th>BLOCK</th><th>ACTION</th></tr></thead><tbody id="tbody"><tr><td colspan="7" style="padding:30px;text-align:center">LOADING...</td></tr></tbody></table></div></div>
</div></div>
<script>
function getToday(){var d=new Date();return new Date(Date.now()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
var allDischarge=[],filtered=[],masterPatients=[],selectedPatient=null,currentPage=1,pageSize=12;
async function loadMaster(){masterPatients=[];var map={};function addToMap(raw){var shri=String(raw.shri||raw.shriId||'').trim().toUpperCase();var name=String(raw.name||raw.patientName||'').trim().toUpperCase();var pmjay=String(raw.pmjay||raw.pmjayId||'').trim().toUpperCase();if(!shri)return false;if(map[shri])return false;map[shri]={shri:shri,name:name||'UNKNOWN',pmjayId:pmjay};return true;}try{if(typeof patientData!=='undefined'){patientData.forEach(r=>addToMap(r));}}catch(e){}try{var snap=await window._fb.getDocs(window._fb.collection(window._fb.db,"patients"));snap.forEach(d=>addToMap(d.data()));}catch(e){}Object.keys(map).forEach(k=>masterPatients.push(map[k]));}
async function loadAll(){var snap=await window._fb.getDocs(window._fb.collection(window._fb.db,'discharges'));allDischarge=[];snap.forEach(d=>{var o=d.data();o._id=d.id;allDischarge.push(o);});allDischarge.sort((a,b)=>new Date(b.dischargedAt||0)-new Date(a.dischargedAt||0));applyFilter();}
function applyFilter(){var date=document.getElementById('fDate').value;var time=document.getElementById('fTime').value;var block=document.getElementById('fBlock').value;var search=document.getElementById('fSearch').value.toLowerCase().trim();filtered=allDischarge.filter(p=>{if(date&&p.date!==date)return false;if(time&&(p.time||'')!==time)return false;if(block&&(p.block||'').toUpperCase()!==block.toUpperCase())return false;if(search){var s=(p.patientName||'')+" "+(p.shriId||'')+" "+(p.pmjayCmhtId||'');if(s.toLowerCase().indexOf(search)===-1)return false;}return true;});currentPage=1;render();}
function render(){
var tbody=document.getElementById('tbody');tbody.innerHTML='';
var tp=Math.max(1,Math.ceil(filtered.length/12));if(currentPage>tp)currentPage=tp;var start=(currentPage-1)*12;var page=filtered.slice(start,start+12);
document.getElementById('badgeD').innerText="Discharged - "+filtered.length;document.getElementById('pageInfo').innerText="Page "+currentPage+" of "+tp;
if(page.length===0){tbody.innerHTML='<tr><td colspan="7" style="padding:20px;text-align:center">NO DISCHARGED</td></tr>';return;}
page.forEach((p,i)=>{
var shriVal=p.shriId||p.shri||'';var nameVal=p.patientName||p.name||'';var pmjayShow=p.pmjayCmhtId||p.pmjayId||'';var dateVal=p.date||'';var timeVal=p.time||'';var blockVal=p.block||'';
var tr=document.createElement('tr');tr.className='mainRow';
tr.innerHTML='<td>'+(start+i+1)+'</td><td class="nameCol">'+nameVal+'</td><td><span class="shriGray">'+shriVal+'</span></td><td><span class="pmjayBlue">'+pmjayShow+'</span></td><td>'+timeVal+'</td><td>'+blockVal+'</td><td><div style="display:flex;gap:6px;justify-content:center;align-items:center"><button class="openBtn" onclick="goToUpload(\''+shriVal+'\',\''+nameVal.replace(/\'/g,"\\'")+'\',\''+pmjayShow+'\',\''+dateVal+'\',\''+timeVal+'\',\''+blockVal+'\',\''+p._id+'\')">></button><button class="delBtn" onclick="delDischarge(\''+p._id+'\')">X</button></div></td>';
tbody.appendChild(tr);
});
}
function goToUpload(shri,name,pmjay,date,time,block,id){location.href='discharge_upload.html?shri='+encodeURIComponent(shri)+'&name='+encodeURIComponent(name)+'&pmjay='+encodeURIComponent(pmjay)+'&date='+encodeURIComponent(date)+'&time='+encodeURIComponent(time)+'&block='+encodeURIComponent(block)+'&id='+encodeURIComponent(id);}
function changePage(d){var tp=Math.max(1,Math.ceil(filtered.length/12));currentPage+=d;if(currentPage<1)currentPage=1;if(currentPage>tp)currentPage=tp;render();}
function clearFilters(){document.getElementById('fDate').value=getToday();document.getElementById('fTime').value='';document.getElementById('fBlock').value='';document.getElementById('fSearch').value='';applyFilter();}
function changeDateBy(days){var input=document.getElementById('fDate');var base=input.value?new Date(input.value):new Date();base.setDate(base.getDate()+days);input.value=base.toISOString().slice(0,10);applyFilter();}
async function delDischarge(id){if(!confirm('DELETE?'))return;await window._fb.deleteDoc(window._fb.doc(window._fb.db,'discharges',id));loadAll();}
function setupSearch(){var s=document.getElementById('searchTotal');var r=document.getElementById('searchResults');s.addEventListener('input',e=>{var q=e.target.value.toLowerCase().trim();if(q.length<1){r.classList.remove('open');return;}var f=masterPatients.filter(p=>(p.name+" "+p.shri+" "+p.pmjayId).toLowerCase().indexOf(q)!==-1).slice(0,30);var html='';f.forEach(p=>{html+='<div class="sItem" onclick="openAddPanel(\''+p.shri+'\')"><div><div class="sName">'+p.name+'</div><div class="sMeta">SHRI: '+p.shri+' | PMJAY: '+p.pmjayId+'</div></div><div class="btn btnGreen btnSmall">SELECT</div></div>';});r.innerHTML=html;r.classList.add('open');});}
function openAddPanel(shri){var p=masterPatients.find(x=>x.shri===shri);selectedPatient=p;document.getElementById('searchResults').classList.remove('open');document.getElementById('searchTotal').value='';document.getElementById('addPanelInfo').innerText='PATIENT: '+p.name+' | SHRI: '+p.shri;document.getElementById('addPanel').classList.add('open');}
function closeAddPanel(){document.getElementById('addPanel').classList.remove('open');selectedPatient=null;}
async function confirmAddDischarge(){var time=document.getElementById('addTimeSelect').value;var block=document.getElementById('addBlockSelect').value;if(!selectedPatient||!time||!block){alert('Select TIME and BLOCK');return;}var date=document.getElementById('fDate').value||getToday();var docId=date+"_"+selectedPatient.shri+"_"+Date.now();await window._fb.setDoc(window._fb.doc(window._fb.db,'discharges',docId),{date:date,shriId:selectedPatient.shri,shri:selectedPatient.shri,patientName:selectedPatient.name,name:selectedPatient.name,pmjayCmhtId:selectedPatient.pmjayId,time:time,block:block,dischargedAt:new Date().toISOString()});closeAddPanel();loadAll();}
addEventListener('load',()=>{setupSearch();loadMaster().then(()=>{document.getElementById('fDate').value=getToday();loadAll();});fTime.addEventListener('change',applyFilter);fBlock.addEventListener('change',applyFilter);fSearch.addEventListener('input',applyFilter);fDate.addEventListener('change',applyFilter);});
</script>
</body>
</html>
