<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHIJA Dialysis - Patient Details</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
html,body{background:#ffffff!important}
body{display:flex;min-height:100vh;color:#0f172a}

/* UNIVERSAL LOKO - SAME ON DESKTOP AND MOBILE */
.bgLogo{
  position:absolute;
  top:160px; /* LITTLE DOWN FROM SEARCH BAR - NO OVERLAP */
  left:50%;
  transform:translateX(-50%);
  width:420px;
  height:420px;
  max-width:85vw;
  max-height:85vw;
  pointer-events:none;
  z-index:1;
  display:grid;
  place-items:center;
}
.bgLogo img{width:100%;height:100%;object-fit:contain}

.whiteBar{position:fixed;left:0;top:0;bottom:0;width:72px;height:100vh;background:#0f172a;z-index:90}
.whiteBar.open{width:270px}
.mainWrap{flex:1;margin-left:72px;background:#ffffff!important;position:relative;min-height:100vh}
.whiteBar.open~.mainWrap{margin-left:270px}
.sHead{height:60px;display:flex;align-items:center;justify-content:center;background:#fff;border-bottom:1px solid #e2e8f0}
.sLogo{width:42px;height:42px;background:#fff;border-radius:8px;display:grid;place-items:center;padding:3px;border:1.5px solid #e2e8f0}
.sLogo img{width:100%;height:100%;object-fit:contain}
.sMenu{padding:8px;background:#0f172a;height:calc(100vh - 60px);overflow-y:auto}
.sMenu a{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;text-decoration:none;color:#94a3b8;font-size:13px;margin-bottom:2px;justify-content:center}
.whiteBar.open .sMenu a{justify-content:flex-start}
.sMenu a.active{background:#1e293b;color:#fff}
.mi{width:36px;height:36px;background:#1e293b;border-radius:10px;display:grid;place-items:center;flex-shrink:0}
.mi svg{width:18px;height:18px;stroke:#94a3b8;stroke-width:1.8;fill:none}
.sMenu a.active .mi{background:#2563eb}
.sMenu a.active .mi svg{stroke:#fff}
.ml{display:none}.whiteBar.open .ml{display:inline}

.top{height:60px;background:#fff!important;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;padding:0 14px;position:sticky;top:0;z-index:20}
.menuBtn{width:36px;height:36px;background:#fff!important;border:1.5px solid #e2e8f0;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.menuBtn span{width:16px;height:2px;background:#0f172a;display:block;border-radius:2px}
.logo{font-weight:800;margin-left:10px}

.main{max-width:1100px;margin:0 auto;padding:18px 14px;width:100%;position:relative;min-height:100vh;background:#fff!important}
.pageHead{position:relative;z-index:10;margin-bottom:12px}
.pageHead h1{font-size:24px;font-weight:900}
.pageHead p{font-size:12px;color:#64748b;margin-top:2px}

.searchTab{position:relative;z-index:10;background:#fff!important;border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-bottom:20px}
.searchRow{display:flex;gap:8px}
.searchRow input{flex:1;background:#fff!important;border:1.5px solid #e2e8f0;padding:10px 14px;border-radius:8px;font-size:13px;outline:0}
.searchBtn{padding:11px 18px;background:#0f172a;color:#fff;border:0;border-radius:8px;font-weight:800;font-size:11px;cursor:pointer}

/* PATIENT CARDS - LITTLE TRANSPARENT SO LOKO VISIBLE, WORDS NOT TRANSPARENT */
.patientCard{
  position:relative;
  z-index:10;
  background:rgba(255,255,255,0.82)!important; /* TRANSPARENT BG SO LOKO VISIBLE */
  border:1px solid #e2e8f0;
  border-radius:12px;
  padding:14px;
  margin-bottom:10px;
  backdrop-filter:blur(1px);
}
.patientCard h3{color:#0f172a!important;opacity:1!important;font-size:15px;font-weight:800} /* WORDS NOT TRANSPARENT */
.patientCard p{color:#334155!important;opacity:1!important;font-size:12px;margin-top:4px} /* WORDS NOT TRANSPARENT */
.patientCard span{color:#0f172a!important;opacity:1!important;font-weight:600}

/* SAME SIZE ON ALL DEVICES - NO DIFFERENT MEDIA QUERY */
@media(max-width:768px){
  .mainWrap{margin-left:0!important}
  .whiteBar{transform:translateX(-100%);width:270px}
  .whiteBar.open{transform:translateX(0)}
  .bgLogo{
    top:150px; /* SAME DOWN FROM SEARCH ON MOBILE */
    width:380px;
    height:380px;
    left:50%;
    transform:translateX(-50%);
  }
}
</style>
<script>function toggleBar(){document.getElementById('whiteBar').classList.toggle('open')}</script>
</head>
<body>
<div class="whiteBar" id="whiteBar">
<div class="sHead"><div class="sLogo"><img src="logoc.png"></div></div>
<div class="sMenu">
<a href="index.html"><span class="mi"><svg viewBox="0 0 24 24"><path d="M3 9L12 2l9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span><span class="ml">HOME</span></a>
<a href="total.html"><span class="mi"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></span><span class="ml">TOTAL PATIENT</span></a>
<a href="cmht.html"><span class="mi"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></span><span class="ml">CMHT TOTAL PATIENT</span></a>
<a href="searchpatient.html" class="active"><span class="mi"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span><span class="ml">SEARCH PATIENT</span></a>
</div>
</div>

<div class="mainWrap">
<div class="top"><button class="menuBtn" onclick="toggleBar()"><span></span><span></span><span></span></button><div class="logo">SHIJA Dialysis</div></div>
<div class="main">
<div class="pageHead"><h1>Patient Details</h1><p>Search any patient by Name, SHRI ID, PMJAY/CMHT ID</p></div>
<div class="searchTab"><div class="searchRow"><input id="searchIn" type="text" placeholder="Search patient - Name / SHRI ID..." oninput="filterPatients()"><button class="searchBtn" onclick="filterPatients()">SEARCH</button></div><div style="margin-top:8px;font-size:10px;color:#64748b"><span id="count">Loading...</span></div></div>

<!-- LOKO.PNG - LITTLE DOWN FROM SEARCH BAR, SAME ON DESKTOP/MOBILE, NO OVERLAP -->
<div class="bgLogo"><img src="loko.png" alt="SHRI Watermark"></div>

<!-- PATIENT LIST FROM total.html + cmht.html -->
<div id="patientList" style="position:relative;z-index:10"></div>
</div>
</div>

<script>
// REPLACE WITH YOUR FIREBASE CONFIG FROM total.html
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let allPatients = [];
async function loadPatients(){
  try{
    const [pmjaySnap, cmhtSnap] = await Promise.all([
      db.collection("patients").get().catch(()=>({docs:[]})),
      db.collection("cmhtPatients").get().catch(()=>db.collection("cmht").get().catch(()=>({docs:[]})))
    ]);
    const pmjay = pmjaySnap.docs.map(d=>({id:d.id,...d.data(),scheme:'PMJAY'}));
    const cmht = cmhtSnap.docs.map(d=>({id:d.id,...d.data(),scheme:'CMHT'}));
    allPatients = [...pmjay,...cmht];
    if(allPatients.length===0){
      // Fallback if collections named total.html / l.html
      const alt = await db.collection("dialysisPatients").get().catch(()=>({docs:[]}));
      allPatients = alt.docs.map(d=>({id:d.id,...d.data()}));
    }
    document.getElementById('count').innerText = allPatients.length + ' patients loaded';
    render(allPatients);
  }catch(e){
    document.getElementById('count').innerText = 'Error loading';
    console.log(e);
  }
}
function render(list){
  const el = document.getElementById('patientList');
  if(list.length===0){el.innerHTML='<div class="patientCard"><h3>No patients found</h3></div>';return}
  el.innerHTML = list.map(p=>`
    <div class="patientCard">
      <h3>${p.name||p.patientName||'Unknown'} - ${p.shriId||p.id||''}</h3>
      <p><span>SHRI ID:</span> ${p.shriId||p.id||'-'} | <span>${p.scheme||p.type||''}</span> | <span>PMJAY/CMHT:</span> ${p.pmjayId||p.cmhtId||p.beneficiaryId||'-'}</p>
      <p><span>Phone:</span> ${p.phone||p.mobile||'-'} | <span>Age:</span> ${p.age||'-'}</p>
    </div>
  `).join('');
}
function filterPatients(){
  const q = document.getElementById('searchIn').value.toLowerCase();
  if(!q){render(allPatients);return}
  const f = allPatients.filter(p=> 
    (p.name||'').toLowerCase().includes(q) ||
    (p.shriId||'').toLowerCase().includes(q) ||
    (p.pmjayId||'').toLowerCase().includes(q) ||
    (p.cmhtId||'').toLowerCase().includes(q)
  );
  render(f);
}
loadPatients();
</script>
</body>
</html>
