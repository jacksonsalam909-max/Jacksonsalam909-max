<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SHIJA Hospitals - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Segoe UI',Arial}
html,body{height:100%;width:100%;overflow:hidden}
body{min-height:100vh;min-height:100dvh;display:flex;background:#f8fafc}
.container{display:flex;width:100%;height:100vh;height:100dvh}
.left{
  flex:1;position:relative;background:#0f172a;overflow:hidden;
  display:flex;flex-direction:column;justify-content:space-between;padding:28px 32px
}
.left img.bg{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center center;
}
.left::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.25) 40%, rgba(0,0,0,0.82) 85%)
}
.left .top,.left .bottom{position:relative;z-index:2;color:#fff}
.top-logo{
  display:flex;align-items:center;gap:10px;
  font-weight:800;font-size:18px;background:rgba(255,255,255,0.12);
  backdrop-filter:blur(8px);padding:6px 12px 6px 6px;border-radius:30px;width:fit-content;
  border:1px solid rgba(255,255,255,0.15)
}
.top-logo img{
  width:34px;height:34px;object-fit:contain;background:white;
  border-radius:50%;padding:4px;box-shadow:0 2px 8px rgba(0,0,0,0.2)
}
.bottom h2{font-size:30px;font-weight:800;line-height:1.1;margin-bottom:10px}
.bottom p{font-size:12.5px;opacity:.9;font-weight:500;line-height:1.5;max-width:90%}

.right{
  flex:1;background:#eef2f7;display:flex;align-items:center;justify-content:center;
  padding:24px;overflow-y:auto
}
.card{
  width:100%;max-width:400px;background:#fff;border-radius:20px;
  padding:28px 24px;box-shadow:0 20px 60px rgba(0,0,0,0.12)
}
.card .logo{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.card .logo img{
  width:58px;height:58px;border-radius:12px;background:#fff;object-fit:contain;
  padding:3px;border:1px solid #e2e8f0;box-shadow:0 4px 10px rgba(0,0,0,0.06)
}
.card .logo b{color:#0f4c75;font-size:22px;font-weight:800}
.card h2{font-size:26px;color:#0f172a;margin:16px 0 5px;font-weight:800}
.card .sub{font-size:12.5px;color:#64748b;margin-bottom:16px}
.roleRow{display:flex;align-items:center;gap:8px;margin-bottom:14px;background:#f8fafc;padding:5px 9px;border-radius:8px;border:1px solid #f1f5f9}
.roleRow label{margin:0;font-size:8.5px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.5px}
.roleSelect{padding:2px 6px;border:1.5px solid #e2e8f0;border-radius:5px;background:#fff;font-weight:700;font-size:9px;color:#0f172a}
label{font-size:10px;font-weight:700;color:#334155;margin:12px 0 6px;display:block;text-transform:uppercase;letter-spacing:0.3px}
.input input{width:100%;padding:12px 13px;border:1.5px solid #e2e8f0;border-radius:10px;outline:0;font-size:13px;background:#f8fafc;transition:0.2s;font-weight:500}
.input input:focus{border-color:#dc2626;box-shadow:0 0 0 3px #fecaca;background:#fff}
.row{display:flex;justify-content:space-between;align-items:center;margin:16px 0;font-size:11px;color:#475569}
.btn{width:100%;padding:13px;border:0;border-radius:10px;background:#dc2626;color:#fff;font-weight:800;font-size:13px;cursor:pointer;margin-top:6px;box-shadow:0 10px 20px rgba(220,38,38,0.25);transition:0.2s}
.btn:hover{background:#b91c1c;transform:translateY(-1px)}
.foot{margin-top:18px;text-align:center;font-size:10px;color:#94a3b8}
.error{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:9px 11px;border-radius:8px;font-size:11px;margin-bottom:12px;display:none}

@media(max-width:900px){
  html,body{overflow:auto}
  .container{flex-direction:column;height:auto;min-height:100vh;min-height:100dvh}
  .left{flex:none;width:100%;height:52vh;height:52dvh;min-height:360px;max-height:520px;padding:20px 22px}
  .left img.bg{object-fit:cover;object-position:center 35%}
  .right{flex:none;width:100%;min-height:48vh;min-height:48dvh;padding:20px 16px;align-items:flex-start;padding-top:22px}
  .bottom h2{font-size:22px}
  .card{max-width:100%;padding:22px 18px}
  .card .logo img{width:50px;height:50px}
}
@media(max-width:480px){
  .left{height:48vh;height:48dvh;min-height:300px}
  .right{min-height:52vh;min-height:52dvh}
}
@media(min-width:901px){
  .container,.left,.right{height:100vh;height:100dvh}
}
</style>
</head>
<body>

<div class="container">
  <div class="left">
    <!-- YOUR FILE: shijabg.jpg - EQUAL FIT -->
    <img class="bg" src="shijabg.jpg?v=999" alt="SHIJA Hospitals">
    <div class="top">
      <div class="top-logo">
        <!-- LOGO IN IMAGE PART -->
        <img src="loginlogo.png?v=999" alt="logo">
        Shija Hospitals
      </div>
    </div>
    <div class="bottom">
      <h2>Trusted Healthcare</h2>
      <p>Compassionate Care • 24/7 Emergency • Advanced Medical Excellence</p>
    </div>
  </div>

  <div class="right">
    <div class="card">
      <div class="logo">
        <!-- BIGGER LOGO -->
        <img src="loginlogo.png?v=999" alt="logo">
        <b>SHIJA Hospitals</b>
      </div>
      <h2>Welcome Back</h2>
      <div class="sub">Sign in to your hospital portal</div>
      <div id="errorBox" class="error"></div>
      <div class="roleRow">
        <label>Login As</label>
        <select class="roleSelect" disabled><option selected>ADMIN</option></select>
      </div>
      <label>Username</label>
      <div class="input"><input id="user" placeholder="Enter username" value="shija"></div>
      <label>Password</label>
      <div class="input"><input id="pass" type="password" placeholder="Enter password" value="shija321"></div>
      <div class="row">
        <label style="margin:0;display:flex;align-items:center;gap:6px;font-weight:600;text-transform:none;font-size:11px">
          <input type="checkbox" style="width:14px;height:14px;accent-color:#dc2626"> Remember me
        </label>
        <a href="#" style="color:#dc2626;text-decoration:none;font-weight:700">Forgot password?</a>
      </div>
      <button class="btn" onclick="doLogin()">Login</button>
      <div class="foot">© 2024 SHIJA Hospitals • Secure & Protected • v2.1</div>
    </div>
  </div>
</div>

<script>
function showError(m){
  let b=document.getElementById('errorBox');
  b.textContent=m;b.style.display='block';
  setTimeout(()=>b.style.display='none',3000);
}
function doLogin(){
 let u=document.getElementById('user').value.trim();
 let p=document.getElementById('pass').value.trim();
 if(!u||!p){showError('Enter username & password');return;}
 if(u==='shija' && p==='shija321'){
   localStorage.setItem('shija_logged','1');
   document.querySelector('.btn').textContent='Success...';
   document.querySelector('.btn').style.background='#16a34a';
   setTimeout(()=>location.href='index.html',400);
 }else{showError('Invalid! Use shija / shija321');}
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
</script>

</body>
</html>
