<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, serverTimestamp, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",
  authDomain: "discharge-b9528.firebaseapp.com",
  projectId: "discharge-b9528",
  storageBucket: "discharge-b9528.firebasestorage.app",
  messagingSenderId: "1076050472607",
  appId: "1:1076050472607:web:736e0688a41462460efcaa",
  measurementId: "G-RXBJ1FD2E4"
};
const app = initializeApp(firebaseConfig,"billMainApp");
const db = getFirestore(app);
window.db = db;
window.saveToSameStorage = async function(){
  const billNo = document.getElementById('billNo').value || "SHIC"+Date.now();
  const payload = {
    block: document.getElementById('bedNo').value,
    name: document.getElementById('pName').value,
    shriId: document.getElementById('uhid').value,
    uhid: document.getElementById('uhid').value,
    pmjayId: "PMJAY",
    date: document.getElementById('admDateOnly').value,
    prevDate: document.getElementById('admDateOnly').value,
    time: document.getElementById('admTimeOnly').value,
    localTime: document.getElementById('billTimeShow').value,
    billNo: billNo,
    ipNo: document.getElementById('ipNo').value,
    mobile: document.getElementById('mobile').value,
    address: document.getElementById('address').value,
    amount: document.getElementById('amt').value,
    bedNo: document.getElementById('bedNo').value,
    ageSex: document.getElementById('ageSex').value,
    createdAt: serverTimestamp(),
    type: "BILL"
  };
  try{
    document.getElementById('fbStatus').innerText="Saving...";
    await setDoc(doc(db, "bills", billNo), payload);
    document.getElementById('fbStatus').innerText="✓ Saved in bills/"+billNo;
  }catch(e){ document.getElementById('fbStatus').innerText="Error: "+e.message; alert(e.message); }
}
window.allPatients = [];
async function loadMasterPatients(){
  try{
    const snap = await getDocs(collection(db,"patients"));
    let fbPatients=[];
    snap.forEach(d=>{
      let p=d.data();
      if(p.deleted) return;
      fbPatients.push({
        patientName: p.patientName || p.name || '',
        shriId: p.shriId || p.shri || '',
        pmjayId: p.pmjayId || p.PMJAY || p.pmjay || '',
        contactNo: p.contactNo || p.contact || '',
        address: p.address || p.addr || ''
      });
    });
    let extra=[];
    try{ extra=JSON.parse(localStorage.getItem('shija_patients')||'[]'); }catch(e){}
    let seen=new Set();
    let merged=[...fbPatients,...extra].filter(p=>{
      let key=((p.shriId||'').toLowerCase()+'|'+(p.patientName||'').toLowerCase()).trim();
      if(seen.has(key)) return false;
      seen.add(key);
      return true;
    });
    window.allPatients=merged;
  }catch(e){}
}
loadMasterPatients();
window.loadMasterPatients=loadMasterPatients;
</script>
