<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Total Patients - SHIJA</title>
<script src="Patient.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui}
body{background:#f1f5f9;display:flex;min-height:100vh}
.whiteBar{position:fixed;left:0;top:0;bottom:0;width:270px;min-width:270px;height:100vh;background:#0f172a;color:#94a3b8;display:flex;flex-direction:column;justify-content:space-between;z-index:90;overflow:hidden;transition:width .32s ease}
.whiteBar.folded{width:72px!important;min-width:72px!important}
.mainWrap{flex:1;margin-left:270px;transition:margin-left .32s ease;min-height:100vh;display:flex;flex-direction:column;background:#eef2ff}
.whiteBar.folded ~ .mainWrap{margin-left:72px!important}
.sHead{padding:16px 12px;display:flex;align-items:center;gap:12px;background:#fff!important;border-bottom:1px solid #e2e8f0;flex-shrink:0;overflow:hidden}
.sLogo{width:42px;min-width:42px;height:42px;background:#fff;border-radius:12px;display:grid;place-items:center;overflow:hidden;padding:3px;border:1px solid #e2e8f0}
.sTitle b{color:#0f172a;font-size:16px;font-weight:900}
.sTitle span{font-size:9px;color:#64748b;text-transform:uppercase;font-weight:700}
.whiteBar.folded .sTitle{display:none}
.whiteBar.folded .sHead{justify-content:center;padding:14px 0}
.sMenu{flex:1;padding:8px 8px;overflow-y:auto}
.sMenu a{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:12px;text-decoration:none;color:#94a3b8;font-size:13px;font-weight:500;margin-bottom:2px;white-space:nowrap;overflow:hidden}
.sMenu a.active{background:#1e293b;color:#fff;font-weight:600}
.mi{width:36px;min-width:36px;height:36px;display:grid;place-items:center;background:#1e293b;border-radius:10px}
.mi svg{width:18px;height:18px;stroke:#94a3b8;stroke-width:1.8;fill:none}
.ml{overflow:hidden;text-overflow:ellipsis}
.whiteBar.folded .ml{display:none}
.whiteBar.folded .sMenu a{justify-content:center;padding:12px 0}
.sFoot{padding:12px;border-top:1px solid #1e293b;font-size:10px;color:#64748b;overflow:hidden;white-space:nowrap}
.whiteBar.folded .sFoot{display:none}
.top{height:68px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;color:#0f172a}
.menuBtnTop{width:40px;height:36px;background:transparent!important;border:none!important;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.menuBtnTop span{display:block;width:20px;height:2.5px;background:#0f172a;border-radius:2px}
.content{flex:1;padding:20px 24px;background:#f8fafc}
.pageHead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.pageHead h1{font-size:26px;font-weight:900;color:#0f172a}
.patientGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.pCard{border-radius:14px;overflow:hidden;background:#fff;border:1px solid #e2e8f0}
.pCardTop{height:52px;padding:10px 12px;display:flex;align-items:center;color:#fff}
.pCardAvatar{width:30px;height:30px;background:#fff;border-radius:8px;display:grid;place-items:center;font-weight:900;color:#0f172a;font-size:12px}
.pCardBody{padding:10px 12px}
.pCardNameRow{display:flex;justify-content:space-between;align-items:center}
.pCardName{font-weight:800;font-size:13px;color:#0f172a}
.pmjayBlue{background:#dbeafe;color:#1d4ed8;padding:2px 8px;border-radius:20px;font-weight:800;font-size:9px}
.shri{background:#2563eb;color:#fff;padding:3px 8px;border-radius:20px;font-weight:800;font-size:9.5px;display:inline-flex;margin-top:4px}
.pCardRow{display:flex;justify-content:space-between;margin-top:4px;font-size:11px}
.pCardRow span{color:#64748b;font-weight:600;font-size:10px}
.pCardRow b{color:#0f172a;font-weight:700;font-size:11px}
.pCardActions{display:flex;gap:8px;margin-top:8px}
.btnEdit{flex:1;padding:7px 10px;border-radius:7px;border:0;background:#facc15;font-weight:800;font-size:11px;cursor:pointer}
.btnDel{flex:1;padding:7px 10px;border-radius:7px;border:0;background:#ef4444;color:#fff;font-weight:700;font-size:11px;cursor:pointer}
.gc1{background:linear-gradient(135deg,#C850C0,#4158D0)} .gc2{background:linear-gradient(135deg,#FF5E3A,#FF2A68)} .gc3{background:linear-gradient(135deg,#38BDF8,#2563EB)} .gc4{background:linear-gradient(135deg,#6366F1,#4F46E5)} .gc5{background:linear-gradient(135deg,#43cea2,#185a9d)} .gc6{background:linear-gradient(135deg,#ff9966,#ff5e62)} .gc7{background:linear-gradient(135deg,#7F00FF,#E100FF)} .gc8{background:linear-gradient(135deg,#00c6ff,#0072ff)} .gc9{background:linear-gradient(135deg,#f7971e,#ffd200)} .gc10{background:linear-gradient(135deg,#56ab2f,#a8e063)}
.tableWrap{background:#fff;border:1.5px solid #e2e8f0;border-radius:16px;overflow:hidden;margin-top:16px}
table{width:100%;border-collapse:collapse;min-width:900px}
th{padding:14px 12px;font-size:11px;color:#64748b;background:#f8fafc;text-align:left;text-transform:uppercase;white-space:nowrap}
td{padding:14px 12px;font-size:13px;border-bottom:1px solid #f1f5f9;white-space:nowrap}
.pmjayTable{background:#dbeafe;color:#1d4ed8;padding:4px 10px;border-radius:20px;font-weight:700;font-size:11px}
.shriTable{background:#e0e7ff;color:#4338ca;padding:4px 10px;border-radius:20px;font-weight:700;font-size:11px}
.sl{width:28px;height:28px;background:#f1f5f9;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:11px}
.hidden{display:none!important}
.addBtn{background:#2563eb;color:#fff;padding:10px 18px;border-radius:10px;border:0;font-weight:800;font-size:13px;text-decoration:none;display:inline-flex;gap:6px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#fff;border:1.5px solid #e2e8f0;padding:12px;border-radius:16px;margin-bottom:12px}
.controls input{flex:1;min-width:180px;padding:11px 14px;border-radius:10px;border:1.5px solid #cbd5e1;font-size:13px;outline:0;background:#f8fafc}
.viewToggle{display:flex;background:#f1f5f9;border-radius:10px;padding:3px;border:1px solid #e2e8f0}
.vBtn{width:42px;height:36px;border-radius:8px;border:0;background:transparent;font-weight:700;font-size:18px;cursor:pointer;display:grid;place-items:center}
.vBtn.active{background:#0f172a;color:#fff}
.pSelect{padding:10px;border-radius:8px;border:1.5px solid #cbd5e1;font-weight:700;background:#fff}
.pager{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#fff;border-top:1px solid #e2e8f0;flex-wrap:wrap;gap:10px}
.pBtn{padding:8px 12px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;font-weight:700;cursor:pointer}
.pBtn:disabled{opacity:.4}
.adminBtnTop{background:#0f172a;color:#fff;padding:9px 16px;border-radius:10px;border:0;font-weight:800;font-size:12px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
</style>
</head>
<body>
<div class="whiteBar" id="whiteBar">
<div style="display:flex;flex-direction:column;height:100%;overflow:hidden">
<div class="sHead"><div class="sLogo"><img src="logoc.png" onerror="this.style.display='none'"></div><div class="sTitle"><b>SHIJA</b><span>DIALYSIS CARE</span></div></div>
<div class="sMenu">
<a href="total.html" class="active"><span class="mi"><svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg></span><span class="ml">TOTAL PATIENT</span></a>
<a href="discharge.html"><span class="mi"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span><span class="ml">DISCHARGE PATIENT</span></a>
<a href="admin.html"><span class="mi"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></span><span class="ml">ADMIN</span></a>
</div>
</div>
<div class="sFoot">System Online • SHIJA</div>
</div>
<div class="mainWrap">
<div class="top"><div class="logo"><button type="button" class="menuBtnTop" id="menuBtnTop"><span></span><span></span><span></span></button> SHIJA Dialysis</div><div style="display:flex;gap:8px;align-items:center"><a href="admin.html" class="adminBtnTop">ADMIN</a></div></div>
<div class="content">
<div class="pageHead"><div><h1>PMJAY Total Patients</h1><p id="info">Loading...</p></div><a href="add.html" class="addBtn">+ Add Patient</a></div>
<div class="controls">
<input id="search" placeholder="Search..." oninput="onSearch()">
<div class="viewToggle"><button class="vBtn" id="gridBtn" onclick="setView('grid')">⊞</button><button class="vBtn active" id="tableBtn" onclick="setView('table')">☰</button></div>
<select id="pageSize" class="pSelect" onchange="changePageSize()"><option value="12">12 / page</option><option value="24">24 / page</option><option value="48">48 / page</option></select>
</div>
<div class="patientGrid hidden" id="patientGrid"></div>
<div class="tableWrap" id="tableWrap"><div style="overflow-x:auto"><table id="tbl"></table></div><div class="pager"><div style="display:flex;gap:8px;align-items:center"><button class="pBtn" id="prevBtn" onclick="prevPage()">Prev</button><span id="pageInfo">Page 1</span><button class="pBtn" id="nextBtn" onclick="nextPage()">Next</button></div><div id="pageNums" style="display:flex;gap:6px"></div></div></div>
</div>
</div>

<script>
function toggleWhiteBar(){document.getElementById('whiteBar').classList.toggle('folded');}
document.getElementById('menuBtnTop').addEventListener('click',function(e){e.preventDefault();toggleWhiteBar();});
let currentView='table';
window.setView=(v)=>{currentView=v;document.getElementById('gridBtn').classList.toggle('active',v==='grid');document.getElementById('tableBtn').classList.toggle('active',v==='table');document.getElementById('patientGrid').classList.toggle('hidden',v!=='grid');document.getElementById('tableWrap').classList.toggle('hidden',v!=='table');renderAll();};
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app = initializeApp(firebaseConfig,"totalMain_"+Date.now());
const db = getFirestore(app);
let allPatients=[],filtered=[],currentPage=1,pageSize=12;
let dischargeList = [];
let TODAY = new Date().toISOString().slice(0,10); // TODAY = 2026-11-03, TOMORROW AUTO 2026-11-04

function getKey(p){ return String(p.key||p.shri||p.id||p.name).trim(); }
function getDeleted(){ try{return JSON.parse(localStorage.getItem('deletedKeys')||'[]');}catch{return [];} }
function getEdited(){ try{return JSON.parse(localStorage.getItem('editedKeys')||'{}');}catch{return {};} }
function addDeleted(key){ let l=getDeleted(); if(!l.includes(key)){l.push(key); localStorage.setItem('deletedKeys',JSON.stringify(l));} }
window.onSearch=()=>{currentPage=1;applyFilter();};
window.changePageSize=()=>{pageSize=parseInt(document.getElementById('pageSize').value);currentPage=1;renderAll();};
window.applyFilter=()=>{let q=document.getElementById('search').value.toLowerCase();filtered=allPatients.filter(p=>!p.deleted && [p.name,p.shri,p.pmjay,p.contact].join(' ').toLowerCase().includes(q));renderAll();};
function getGradient(i){ const g=['gc1','gc2','gc3','gc4','gc5','gc6','gc7','gc8','gc9','gc10']; return g[i%10]; }
function getInitial(name){ return (name||'P').trim().charAt(0).toUpperCase(); }

async function loadDischarges(){
  dischargeList = [];
  try{ const snap = await getDocs(collection(db,"discharges")); snap.forEach(d=>{ let data=d.data(); dischargeList.push({ shri: String(data.shriId||data.shri||'').trim().toUpperCase(), pmjay: String(data.pmjayId||data.pmjay||data.pmjayCmhtId||'').trim().toUpperCase(), name: String(data.patientName||data.name||'').trim().toUpperCase(), date: String(data.dischargeDate||data.date||'').slice(0,10) }); }); }catch(e){}
}

// TODAY LOGIC: 3 Nov only 3 Nov * , 4 Nov only 4 Nov * , 3 Nov * gone on 4 Nov
function isDischargedToday(p){
  let pShri = String(p.shri||'').trim().toUpperCase();
  let pPmjay = String(p.pmjay||'').trim().toUpperCase();
  let pName = String(p.name||'').trim().toUpperCase();
  return dischargeList.some(d=>{
    if(d.date !== TODAY) return false;
    if(d.shri && pShri && d.shri === pShri) return true;
    if(d.pmjay && pPmjay && d.pmjay === pPmjay) return true;
    if(d.name && pName && d.name === pName) return true;
    return false;
  });
}

window.renderAll=()=>{
 let totalPages=Math.max(1,Math.ceil(filtered.length/pageSize));
 if(currentPage>totalPages) currentPage=totalPages;
 let start=(currentPage-1)*pageSize;
 let data=filtered.slice(start,start+pageSize);
 let gridHtml='';
 data.forEach((p,idx)=>{
   let grad=getGradient(start+idx);
   let discharged = isDischargedToday(p);
   gridHtml+=`<div class="pCard"><div class="pCardTop ${grad}"><div class="pCardAvatar">${getInitial(p.name)}</div></div><div class="pCardBody"><div class="pCardNameRow"><div class="pCardName">${p.name||'Unknown'}${discharged?' <span style="color:#ef4444;font-weight:900">*</span>':''}</div><span class="pmjayBlue">${p.pmjay||'No PMJAY'}</span></div><div class="pCardRow"><span>SHRI ID</span><b>${p.shri||'-'}</b></div><div class="pCardRow"><span>Contact</span><b>${p.contact||'-'}</b></div><div style="margin-top:4px"><span class="shri">${p.shri||'No SHRI'}</span></div></div></div>`;
 });
 if(data.length===0) gridHtml='<div style="grid-column:1/-1;text-align:center;padding:40px;background:#fff;border-radius:16px;border:1px solid #e2e8f0">No patients</div>';
 document.getElementById('patientGrid').innerHTML=gridHtml;
 let html='<tr><th>SL No</th><th>Patient</th><th>PMJAY ID</th><th>SHRI ID</th><th>Contact</th><th>Address</th></tr>';
 data.forEach((p)=>{
   let discharged = isDischargedToday(p);
   html+=`<tr><td><div class="sl">${start+filtered.indexOf(p)+1}</div></td><td><b>${p.name}${discharged?' <span style="color:#ef4444;font-weight:900">*</span>':''}</b></td><td><span class="pmjayTable">${p.pmjay||'-'}</span></td><td><span class="shriTable">${p.shri||'No ID'}</span></td><td>${p.contact||'-'}</td><td>${(p.addr||'-').substring(0,24)}</td></tr>`;
 });
 if(data.length===0) html+='<tr><td colspan="6" style="text-align:center;padding:20px">No patients</td></tr>';
 document.getElementById('tbl').innerHTML=html;
 let c=filtered.filter(p=>isDischargedToday(p)).length;
 document.getElementById('info').textContent=filtered.length+' patients • Today '+TODAY+' • '+c+' discharged today';
 let pInfo=document.getElementById('pageInfo'); let prevBtn=document.getElementById('prevBtn'); let nextBtn=document.getElementById('nextBtn'); let numsEl=document.getElementById('pageNums'); if(pInfo) pInfo.textContent='Page '+currentPage+' of '+totalPages; if(prevBtn) prevBtn.disabled=currentPage<=1; if(nextBtn) nextBtn.disabled=currentPage>=totalPages; if(numsEl){ let nums=''; for(let i=1;i<=Math.min(totalPages,8);i++){ nums+=`<button class="pBtn" style="${i===currentPage?'background:#0f172a;color:#fff':''}" onclick="goPage(${i})">${i}</button>`; } numsEl.innerHTML=nums; }
};
window.prevPage=()=>{if(currentPage>1){currentPage--;renderAll();}};
window.nextPage=()=>{let totalPages=Math.ceil(filtered.length/pageSize);if(currentPage<totalPages){currentPage++;renderAll();}};
window.goPage=(n)=>{currentPage=n;renderAll();};

async function init(){
 await loadDischarges();
 let deletedLocal=getDeleted(); let editedLocal=getEdited(); let map={};
 function addToMap(raw, overwrite){
   let rawShri=String(raw.shri||raw.shriId||'').trim(); let rawId=String(raw.id||raw.key||'').trim(); let key=rawShri||rawId||String(raw.name||'').trim(); if(!key) return;
   let isDel = deletedLocal.includes(key) || deletedLocal.includes(rawId) || deletedLocal.includes(rawShri) || raw.deleted===true;
   let edited = editedLocal[key]||editedLocal[rawId]||editedLocal[rawShri];
   let obj={ key:key, id:rawId||key, name:String((edited&&edited.name)||raw.patientName||raw.name||'').trim(), shri:String((edited&&edited.shri)||rawShri||'').trim(), contact:String((edited&&edited.contact)||raw.contact||raw.contactNo||'').trim(), pmjay:String((edited&&edited.pmjay)||raw.pmjay||raw.pmjayId||'').trim(), addr:String((edited&&edited.addr)||raw.addr||raw.address||'').trim(), deleted:isDel };
   if(overwrite ||!map[key]) map[key]=obj; else if(obj.name) map[key]=obj;
 }
 (typeof patientData!=='undefined'?patientData:[]).forEach(pd=>addToMap(pd,false));
 Object.values(editedLocal).forEach(v=>addToMap(v,true));
 try{ const snap=await getDocs(collection(db,"patients")); snap.forEach(d=>{ let data=d.data(); if(data.deleted===true){ if(map[d.id]) map[d.id].deleted=true; return;} addToMap({key:d.id, id:d.id,...data}, true); }); }catch(e){}
 allPatients=Object.values(map).filter(p=>!p.deleted); allPatients.sort((a,b)=>(a.name||'').toLowerCase().localeCompare((b.name||'').toLowerCase())); applyFilter();
 try{ onSnapshot(collection(db,"discharges"), async()=>{ await loadDischarges(); renderAll(); }); }catch(e){}
 // AUTO REMOVE * WHEN DATE CHANGES FROM 3 NOV TO 4 NOV
 setInterval(()=>{ let newToday = new Date().toISOString().slice(0,10); if(newToday !== TODAY){ TODAY = newToday; renderAll(); } }, 60000);
}
init();
</script>
</body>
