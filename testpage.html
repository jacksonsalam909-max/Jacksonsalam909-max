<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>SHIJA Hospitals - Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Inter,Arial}
body{min-height:100vh;background:#a78bfa;display:flex;align-items:center;justify-content:center;padding:0}
.wrapper{width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#a78bfa;padding:20px}
.container{width:100%;max-width:900px;background:#fff;border-radius:14px;overflow:hidden;display:flex;box-shadow:0 20px 60px rgba(0,0,0,0.2);min-height:520px}
.left{flex:1.2;background:#6d28d9;position:relative;padding:40px;color:#fff;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.left-bg{position:absolute;inset:0;background:linear-gradient(135deg,#8b5cf6 0%,#7c3aed 30%,#6d28d9 100%)}
.left svg.graphic{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.left-content{position:relative;z-index:2}
.left h1{font-size:32px;font-weight:800;margin-bottom:10px}
.left p{font-size:13px;opacity:0.9;line-height:1.6;max-width:260px}

.right{flex:1;background:#fff;padding:30px 32px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.logo-area{text-align:center;margin-bottom:12px;width:100%}
.logo-area img{width:180px;height:auto;max-height:120px;object-fit:contain}
.right-inner{width:100%}
.right h2{font-size:20px;font-weight:700;color:#1f2937;margin-bottom:18px;text-align:center}
label{font-size:11px;font-weight:600;color:#374151;margin-bottom:5px;display:block;margin-top:12px}
.input-wrap{position:relative}
.input-wrap input,.input-wrap select{width:100%;padding:10px 14px;border:1.2px solid #e5e7eb;border-radius:20px;outline:0;font-size:12px;background:#fff}
.input-wrap input:focus,.input-wrap select:focus{border-color:#7c3aed;box-shadow:0 0 0 2px #ede9fe}
.input-wrap select{font-weight:600;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;margin:14px 0;font-size:11px;width:100%}
.row a{color:#6b7280;text-decoration:none;font-size:11px}
.row label{margin:0;font-weight:500;display:flex;align-items:center;gap:5px;font-size:11px;color:#4b5563}
.btn{width:100%;padding:10px;border:0;border-radius:20px;background:#6d28d9;color:#fff;font-weight:600;font-size:12px;cursor:pointer;margin-top:8px}
.foot{text-align:center;margin-top:16px;font-size:9px;color:#9ca3af;width:100%}
@media(max-width:768px){.container{flex-direction:column;max-width:380px}.left{min-height:200px;padding:28px}.logo-area img{width:150px}}
</style>
</head><body>
<div class="wrapper">
<div class="container">
<div class="left">
<div class="left-bg"></div>
<!-- EXACT GRAPHIC SAME AS REFERENCE IMAGE -->

  <g opacity="0.7">

    <path d="M 350 505 Q 390 475 410 435 Q 430 395 470 385 Q 505 375 515 345 Q 525 315 495 295" fill="none" stroke="white" stroke-width="1.2" opacity="0.6"/>
    <path d="M 380 510 Q 415 480 435 440 Q 455 400 490 390 Q 520 380 530 350" fill="none" stroke="white" stroke-width="1" opacity="0.4"/>

  <path d="M 200 310 Q 280 270 380 300" fill="none" stroke="white" stroke-width="1.2" opacity="0.25"/>

<div class="left-content">
<h1>Welcome back!</h1>
<p>You can sign in to access with your SHIJA Hospitals portal.</p>
</div>
</div>
<div class="right">
<div class="logo-area">
<img src="loginlogo.png" alt="SHIJA Logo">
</div>
<div class="right-inner">
<h2>Sign In</h2>
<label>Login As</label>
<div class="input-wrap"><select id="roleSelect"><option value="ADMIN">ADMIN</option><option value="USER">USER</option></select></div>
<label>Username</label>
<div class="input-wrap"><input id="user" placeholder="Enter username" autocomplete="off"></div>
<label>Password</label>
<div class="input-wrap"><input id="pass" type="password" placeholder="Enter password" autocomplete="off"></div>
<div class="row"><label><input type="checkbox" checked> Remember me</label><a href="#">Forgot password?</a></div>
<button class="btn" onclick="doLogin()">Sign In</button>
<div class="foot">© 2024 SHIJA Hospitals - Secure and Protected</div>
</div>
</div>
</div>
</div>
<script>
setInterval(()=>{let s=document.getElementById('roleSelect'); if(s && s.value!=='ADMIN') s.value='ADMIN';},100);
window.onload=()=>{document.getElementById('roleSelect').value='ADMIN';};
function doLogin(){
 let u=document.getElementById('user').value.trim();
 let p=document.getElementById('pass').value.trim();
 let isAdmin=(u==='shija' && p==='shija321');
 let isUser=(u==='admin' && p==='admin123');
 let role=isAdmin?'ADMIN':'USER';
 if(isAdmin||isUser){
   localStorage.setItem('shija_logged','1');
   localStorage.setItem('shija_role',role);
   localStorage.setItem('shija_login_time',Date.now().toString());
   location.href=role==='ADMIN'?'index.html':'user-index.html';
 }else{alert('Invalid credentials.');}
}
document.addEventListener('keydown',e=>{if(e.key==='Enter') doLogin();});
</script>
</body></html>
