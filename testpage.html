<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SHIJA - FINAL FULL</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="Patient.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui}
html,body{width:100%;overflow-x:hidden}
body{background:#f1f5f9;display:flex;min-height:100vh}
.whiteBar{position:fixed;left:0;top:0;bottom:0;width:270px;min-width:270px;height:100vh;background:#0f172a;color:#94a3b8;display:flex;flex-direction:column;justify-content:space-between;z-index:90;overflow:hidden;transition:width .32s ease, transform .32s ease}
.whiteBar.folded{width:72px!important;min-width:72px!important}
.mainWrap{flex:1;margin-left:270px;display:flex;flex-direction:column;background:#eef2ff;width:calc(100% - 270px);overflow-x:hidden;transition:margin-left .32s ease}
.whiteBar.folded ~ .mainWrap{margin-left:72px!important;width:calc(100% - 72px)}
.sHead{padding:16px 12px;display:flex;align-items:center;gap:12px;background:#fff!important;border-bottom:1px solid #e2e8f0}
.sLogo{width:42px;min-width:42px;height:42px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;border:1px solid #e2e8f0}
.sLogo img{width:100%;height:100%;object-fit:contain}
.sTitle b{color:#0f172a;font-size:16px;font-weight:900;display:block;line-height:1}
.sTitle span{font-size:9px;color:#64748b;text-transform:uppercase;font-weight:700;display:block;margin-top:2px}
.whiteBar.folded .sTitle{display:none}
.whiteBar.folded .sHead{justify-content:center;padding:14px 0}
.sMenu{flex:1;padding:8px;overflow-y:auto}
.sMenu a{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:12px;text-decoration:none;color:#94a3b8;font-size:12.5px;font-weight:500;margin-bottom:2px;white-space:nowrap;overflow:hidden}
.sMenu a.active{background:#1e293b;color:#fff;font-weight:600}
.mi{width:32px;min-width:32px;height:32px;display:grid;place-items:center;background:#1e293b;border-radius:8px;flex-shrink:0}
.mi svg{width:16px;height:16px;stroke:#94a3b8;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sMenu a.active .mi{background:#3c25eb}
.sMenu a.active .mi svg{stroke:#fff}
.ml{overflow:hidden;text-overflow:ellipsis}
.whiteBar.folded .ml{display:none!important}
.whiteBar.folded .sMenu a{justify-content:center;padding:12px 0}
.sFoot{padding:12px;border-top:1px solid #1e293b;font-size:10px;color:#64748b;text-align:center}
.whiteBar.folded .sFoot .footFull{display:none}
.whiteBar:not(.folded) .sFoot .footFold{display:none}
.top{height:68px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;color:#0f172a}
.menuBtnTop{width:40px;height:36px;background:transparent;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.menuBtnTop span{display:block;width:22px;height:2.6px;background:#0f172a;border-radius:2px}
.badgeBlue{background:#f59e0b;color:#000;padding:6px 12px;border-radius:20px;font-weight:900;font-size:11px;border:1px solid #f59e0b}
.content{flex:1;padding:12px 8px;background:#f8fafc;overflow-x:hidden}
.card{background:#fff;border-radius:12px;padding:10px;margin-bottom:10px;border:1.5px solid #e2e8f0;width:100%;overflow:hidden}
.label{font-size:10px;font-weight:900;color:#64748b;margin-bottom:4px;text-transform:uppercase}
.btn{padding:8px 14px;border:0;border-radius:8px;font-weight:800;font-size:11px;cursor:pointer}
.btnDark{background:#3c25eb!important;color:#fff!important;border:1.5px solid #3c25eb!important}
.btnSmall{padding:6px 10px!important;font-size:9px!important;border-radius:6px!important}
.input{padding:8px 10px;border:1.5px solid #cbd5e1;border-radius:6px;font-weight:700;font-size:11px;background:#fff;width:100%;outline:0}
.inputSmall{padding:6px 8px!important;font-size:10px!important;border-radius:6px!important;height:32px!important}
.shriGray,.pmjayBlue{background:#f1f5f9;color:#475569;padding:3px 5px;border-radius:5px;font-weight:800;font-size:8px;display:inline-block;border:1px solid #e2e8f0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.searchBox{position:relative}
.searchResults{position:absolute;top:48px;left:0;right:0;background:#fff;border:2px solid #3c25eb;border-radius:10px;max-height:350px;overflow:auto;z-index:500;display:none}
.searchResults.open{display:block}
.sItem{padding:12px;border-bottom:1px solid #f1f5f9;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.sName{font-weight:900;font-size:12px;color:#0f172a}
.sMeta{font-size:10px;color:#64748b;font-weight:700;margin-top:2px}
.addPanel{max-height:0;overflow:hidden;transition:.3s;background:#fff;border:0 solid #3c25eb;border-radius:12px;margin-top:0;padding:0 14px}
.addPanel.open{max-height:600px;border-width:2px;margin-top:12px;padding:14px}
.sheetWrap{background:#fff;border:1.5px solid #e2e8f0;overflow:hidden;max-height:75vh;border-radius:12px;width:100%;overflow-x:hidden;transition:all .25s ease}
table{border-collapse:collapse;width:100%;table-layout:fixed;transition:all .25s ease}
th{background:#0f172a;color:#fff;padding:8px 1px;font-size:6px;text-align:center;font-weight:800;white-space:nowrap;transition:all .25s ease;position:sticky;top:0;z-index:2}
td{border-bottom:1px solid #e2e8f0;padding:6px 1px;height:44px;font-size:7px;font-weight:700;text-align:center;text-transform:uppercase;background:#fff;vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all .25s ease}
th:nth-child(1),td:nth-child(1){width:5%}
th:nth-child(2),td:nth-child(2){width:18%}
th:nth-child(3),td:nth-child(3){width:12%}
th:nth-child(4),td:nth-child(4){width:13%}
th:nth-child(5),td:nth-child(5){width:10%}
th:nth-child(6),td:nth-child(6){width:10%}
th:nth-child(7),td:nth-child(7){width:14%}
th:nth-child(8),td:nth-child(8){width:18%}
td.nameCol{text-align:left;padding-left:4px;overflow:hidden;text-overflow:ellipsis}
.badge{background:#0f172a;color:#fff;padding:5px 10px;border-radius:20px;font-weight:900;font-size:9px}
.claimBtn{background:#facc15!important;color:#000!important;padding:4px 8px;border-radius:20px;border:1.5px solid #eab308!important;font-weight:900;font-size:6px;cursor:pointer;min-width:36px;flex-shrink:0}
.delBtn{background:#ef4444;color:#fff;padding:4px 6px;border-radius:20px;border:0;font-weight:900;font-size:6px;cursor:pointer;min-width:20px;flex-shrink:0}
.gridWrap{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:6px;align-items:start}
.gridCard{background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:8px;min-height:140px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.gridName{font-weight:900;font-size:10px;color:#0f172a;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gridRow{display:flex;justify-content:space-between;font-size:8px;font-weight:700;color:#64748b;margin-bottom:2px}
.iconBtn{width:32px;height:32px;border-radius:8px;border:1.5px solid #e2e8f0;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.iconBtn.active{background:#3c25eb!important;color:#fff!important;border-color:#3c25eb!important}
.iconBtn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none}
.filterBox2{display:flex;flex-direction:column;gap:8px}
.filterRow1{display:flex;gap:5px;flex-wrap:wrap;align-items:end}
.filterRow2{display:flex;gap:5px;align-items:center;flex-wrap:wrap;border-top:1px solid #f1f5f9;padding-top:8px}
.actionCell{display:flex;align-items:center;gap:2px;width:100%;flex-wrap:nowrap;justify-content:center;overflow:hidden}
.claimWrap{display:flex;align-items:center;gap:2px;flex-wrap:nowrap;width:100%;min-width:0;overflow:hidden;justify-content:center}
.claimFold{display:none!important;align-items:center;background:#fff;border:1.5px solid #e5e7eb;border-radius:999px;padding:1px 1px 1px 5px;gap:1px;flex:1;min-width:0;max-width:100px;overflow:hidden}
.claimFold.show{display:inline-flex!important}
.claimFold input{flex:1;min-width:0;border:0;outline:0;font-weight:800;font-size:6px;background:transparent;text-transform:uppercase;color:#374151;width:100%}
.claimFold .addClaimBtn{background:#3c25eb;color:#fff;border:1px solid #3c25eb;padding:3px 6px;border-radius:999px;font-weight:900;font-size:5px;cursor:pointer;flex-shrink:0;min-width:18px}
.claimFold .addClaimBtn:disabled{background:#f3f4f6;color:#9ca3af;border-color:#e5e7eb}
.gridAction{display:flex;gap:2px;align-items:center;flex-wrap:nowrap;overflow:hidden;justify-content:flex-start}
.gridAction .claimFold{display:none!important;align-items:center;background:#fff;border:1.5px solid #3c25eb;border-radius:24px;padding:2px 2px 2px 6px;gap:2px;flex:1;max-width:110px}
.gridAction .claimFold.show{display:inline-flex!important}
.gridAction .claimFold input{width:100%;flex:1;padding:4px 6px;border:0;border-radius:20px;font-weight:800;font-size:7px;background:#f1f5f9;outline:0;text-transform:uppercase}
.gridAction .claimFold .addClaimBtn{background:#3c25eb;color:#fff;padding:4px 8px;border-radius:20px;border:0;font-weight:900;font-size:6px;cursor:pointer;margin-left:2px}
.uploadBtnFold{background:#fff!important;color:#0f172a!important;padding:3px 6px!important;border-radius:20px;border:1.5px solid #3c25eb!important;font-weight:800;font-size:6px!important;cursor:pointer;min-width:44px!important;height:20px!important}
.uploadBtnFold.done{background:#f0fdf4!important;color:#16a34a!important;border-color:#86efac!important}
.slideRow{display:none}.slideRow.show{display:table-row}
.slideCell{padding:0!important;background:#f8fafc!important;border-bottom:1px solid #e2e8f0!important;border-top:1px solid #3c25eb!important}
.slideInner{padding:6px!important;background:#f8fafc}
.horizontalBtns{display:flex;gap:6px!important;justify-content:center;flex-wrap:wrap}
.cardWrap{flex:1;display:flex;align-items:center;gap:3px;max-width:320px;min-width:0}
.hCard{flex:1;padding:4px 3px!important;border-radius:6px!important;border:1.5px dashed #cbd5e1;background:#fff;font-size:7px;font-weight:700;color:#64748b;cursor:pointer;text-align:center;min-height:38px!important;height:38px!important;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hCard b{font-size:6px!important;color:#0f172a}
.hCard .sub{font-size:5px!important;color:#94a3b8}
.hCard.summary.done{background:#eef2ff;border-style:solid;border-color:#3c25eb}
.hCard.photo.done{background:#fff7ed;border-style:solid;border-color:#fb923c}
.hCard.feedback.done{background:#faf5ff;border-style:solid;border-color:#c084fc}
.delNextToCard{width:18px!important;min-width:18px!important;height:18px!important;background:#ef4444;color:#fff;border-radius:50%;display:grid;place-items:center;font-size:8px!important;font-weight:900;cursor:pointer;border:2px solid #fff}
#mobOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:89}
#mobOverlay.show{display:block}
.sheetWrap.claimOpen th:nth-child(1), .sheetWrap.claimOpen td:nth-child(1){width:0!important;padding:0!important;opacity:0;overflow:hidden;border:0!important}
.sheetWrap.claimOpen th:nth-child(2), .sheetWrap.claimOpen td:nth-child(2){width:16%!important}
.sheetWrap.claimOpen th:nth-child(8), .sheetWrap.claimOpen td:nth-child(8){width:32%!important}
@media(max-width:900px){
.whiteBar{transform:translateX(-100%);width:270px!important;min-width:270px!important}
.whiteBar.mOpen{transform:translateX(0)}
.mainWrap{margin-left:0!important;width:100%!important}
.content{padding:8px}
.gridWrap{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px){
.gridWrap{grid-template-columns:1fr}
th:nth-child(1),td:nth-child(1){width:5%}
th:nth-child(5),td:nth-child(5),th:nth-child(6),td:nth-child(6){display:none}
th:nth-child(2),td:nth-child(2){width:24%}
th:nth-child(3),td:nth-child(3){width:14%}
th:nth-child(4),td:nth-child(4){width:14%}
th:nth-child(7),td:nth-child(7){width:16%}
th:nth-child(8),td:nth-child(8){width:18%}
.sheetWrap.claimOpen th:nth-child(1), .sheetWrap.claimOpen td:nth-child(1){display:none!important}
.sheetWrap.claimOpen th:nth-child(2), .sheetWrap.claimOpen td:nth-child(2){width:20%!important}
.sheetWrap.claimOpen th:nth-child(8), .sheetWrap.claimOpen td:nth-child(8){width:36%!important}
.claimFold{max-width:88px}
}
#fileModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:99999;align-items:center;justify-content:center;padding:16px}
#fileModal.show{display:flex}
.popupCard{background:#fff;border-radius:12px;width:82%;max-width:580px;max-height:78vh;display:flex;flex-direction:column;overflow:hidden}
.popupHead{padding:8px 10px;background:#7c3aed;color:#fff;display:flex;justify-content:space-between;align-items:center}
.popupHead b{font-size:11px;color:#fff;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.popupBody{flex:1;overflow:auto;background:#f8fafc;display:flex;align-items:flex-start;justify-content:center}
.paperBox{background:#fff;transition:transform .15s ease;transform-origin:top center}
.paperBox img{display:block;width:100%;max-width:560px;max-height:62vh;object-fit:contain}
.paperBox iframe{display:block;width:560px;max-width:80vw;height:62vh;border:0}
.headRight{display:flex;gap:5px;align-items:center}
.iconTop{width:30px;height:30px;background:rgba(255,255,255,0.18);color:#fff;border:0;border-radius:6px;font-weight:900;font-size:16px;cursor:pointer;display:grid;place-items:center}
.zoomBar{padding:5px 10px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center}
.zoomBtn{height:26px;min-width:26px;padding:0 6px;background:#fff;color:#0f172a;border:1px solid #e2e8f0;border-radius:5px;font-weight:900;font-size:13px;cursor:pointer;display:grid;place-items:center}
.zoomLabel{font-size:9px;font-weight:800;color:#0f172a;min-width:36px;text-align:center}
</style>
</head>
<body>
</body>
</html>
