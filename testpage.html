<!DOCTYPE html>
<html>
<head>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f1f5f9}
.top{height:52px;background:#0a1931;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 10px;position:fixed;top:0;left:0;right:0;z-index:1000}
.btn{padding:6px 10px;border:0;border-radius:6px;font-weight:900;font-size:10px;cursor:pointer}
.btnDark{background:#0f172a;color:#fff}.btnPurple{background:#7c3aed;color:#fff}
.input{padding:6px 8px;border:1px solid #e2e8f0;border-radius:6px;font-weight:700;font-size:11px;background:#fff}
.content{max-width:1450px;margin:60px auto 0;padding:8px}
.card{background:#fff;border-radius:10px;padding:8px;margin-bottom:6px;border:1px solid #e2e8f0}
.sheetWrap{overflow:auto;border:1px solid #000;background:#fff;max-height:68vh}
table{border-collapse:collapse;width:100%;min-width:1100px}
th{position:sticky;top:0;background:#0a1931;color:#fff;padding:8px 3px;font-size:9px;text-align:center;border:1px solid #000;z-index:2}
td{border:1px solid #d1d5db;padding:6px 3px;height:36px;font-size:10px;font-weight:700;text-align:center;text-transform:uppercase;background:#fff}
td.nameCol{text-align:left;padding-left:6px}
td.slCol{background:#f1f5f9;font-weight:900}
td.idCol{background:#eff6ff;color:#1e40af;font-weight:900}
.status{font-size:10px;font-weight:800;padding:4px 8px;border-radius:12px}.status.saved{background:#dcfce7;color:#14532d}.status.blank{background:#f3f4f6}
.pagination{display:flex;gap:3px;flex-wrap:wrap}.pageBtn{padding:6px 10px;border-radius:6px;border:1px solid #e2e8f0;background:#fff;font-weight:900;cursor:pointer;font-size:10px}.pageBtn.active{background:#0a1931;color:#fff}
.actionCell{display:flex;gap:3px;justify-content:center}
.btnEdit{background:#FFD60A;color:#000;font-weight:900;font-size:9px;padding:5px 8px;border-radius:4px;border:0;cursor:pointer}
.btnDelete{background:#EF4444;color:#fff;font-weight:900;font-size:9px;padding:5px 8px;border-radius:4px;border:0;cursor:pointer}
.menuBtn{font-size:22px;background:none;border:0;color:#fff;cursor:pointer;padding:4px 8px}
.menuDrawer{position:fixed;top:52px;left:-300px;width:280px;height:calc(100vh - 52px);background:#fff;color:#0f172a;z-index:9999;transition:left 0.25s ease;overflow:auto;padding:0;border-right:1px solid #e2e8f0;box-shadow:4px 0 20px rgba(0,0,0,0.15)}
.menuDrawer.open{left:0}
.menuItem{display:block;width:100%;padding:12px 16px;background:#fff;border:0;border-bottom:1px solid #f1f5f9;color:#334155;font-weight:700;font-size:12px;text-align:left;cursor:pointer}
.menuOverlay{position:fixed;top:52px;left:0;right:0;bottom:0;background:rgba(0,0,0,0.2);display:none;z-index:9998}
.menuOverlay.open{display:block}
.filterRow{display:flex;gap:6px;flex-wrap:wrap;align-items:end;margin-top:6px}
.filterSelect{padding:5px 6px;border-radius:5px;font-weight:700;font-size:10px;border:1px solid #d1d5db;background:#fff;color:#0f172a;cursor:pointer;min-width:105px}
.gridWrap{display:none;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;max-height:68vh;overflow:auto}
.gridWrap.show{display:grid}
.sheetWrap.hide{display:none}
.pCard{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px}
.pCardTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.pCardSL{background:#0a1931;color:#fff;font-weight:900;font-size:9px;padding:3px 6px;border-radius:10px}
.pCardName{font-weight:900;font-size:12px;text-transform:uppercase;margin-bottom:3px}
.pCardMeta{font-size:9px;font-weight:700;color:#475569;display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.pCardMeta span{background:#f1f5f9;padding:2px 5px;border-radius:4px;border:1px solid #e2e8f0}
.viewToggle{display:flex;gap:2px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:8px;padding:2px;height:36px;align-items:center}
.viewBtn{width:32px;height:28px;border-radius:6px;border:0;background:transparent;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.viewBtn.active{background:#0a1931;color:#fff}
.status-col.hidden{display:none !important}
.searchRow{display:flex;gap:6px;align-items:end;margin-top:8px;width:100%}
.searchRow input{flex:1;min-width:0;padding:8px 10px;font-size:12px;border:2px solid #0a1931;border-radius:8px;background:#fff;font-weight:900}

/* ADMIN LIKE YOUR IMAGE */
.adminWrap{position:relative}
.adminCircle{width:34px;height:34px;border-radius:50%;background:#1e88e5;color:#fff;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:0;box-shadow:0 2px 6px rgba(0,0,0,0.2)}
.adminDropdown{position:absolute;top:42px;right:0;background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,0.25);width:200px;display:none;z-index:2000;overflow:hidden;border:0;padding:6px}
.adminDropdown.open{display:block}
.adminDropItem{width:100%;padding:14px 16px;border:0;background:#fff;text-align:left;font-weight:700;font-size:14px;cursor:pointer;border-radius:10px}
.adminDropItem:first-child{color:#111}
.adminDropItem.logoutAll{color:#ef4444}
.adminDropItem:hover{background:#f5f5f5}
</style>
</head>
<body>
<script>
if(localStorage.getItem('shija_logged')!=='1'){location.href='login.html'}
</script>

<div class="top">
<div style="display:flex;align-items:center;gap:6px">
<button class="menuBtn" id="menuBtn">☰</button>
<div style="font-weight:900;font-size:13px">SHIJA DIALYSIS MANAGMENT</div>

</div>

<!-- BLUE CIRCLE A LIKE IMAGE -->

</div>

<div class="menuOverlay" id="menuOverlay"></div>
<div class="menuDrawer" id="menuDrawer">
<div style="font-weight:900;padding:12px 14px;border-bottom:2px solid #0a1931;font-size:13px;background:#0a1931;color:#fff">MENU</div>
<button class="menuItem" onclick="goPage('index.html')">HOME</button>
<button class="menuItem" onclick="goPage('total.html')">TOTAL PATIENT</button>

<button class="menuItem" onclick="goPage('bill.html')">BILL</button>

<div class="content">
<div class="card">
<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:end">
<div><label style="font-size:8px;font-weight:800">DATE</label><br><input type="date" id="fDate" class="input"></div>
<div><label style="font-size:8px;font-weight:800">SCHEME</label><br><select id="fType" class="input" style="background:#fef3c7;border:2px solid #f59e0b;font-weight:900"><option value="PMJAY" selected>PMJAY</option><option value="CMHT">CMHT</option></select></div>
<div><label style="font-size:8px;font-weight:800">SHOW</label><br><select id="rowsPerPage" class="input"><option value="10" selected>10</option><option value="20">20</option><option value="30">30</option><option value="40">40</option><option value="50">50</option></select></div>
<div><label style="font-size:8px;font-weight:800">TIME</label><br><select id="filterTime" class="input"><option value="">ALL</option><option value="7:00 AM">7 AM</option><option value="12:00 PM">12 PM</option><option value="5:00 PM">5 PM</option><option value="9:00 PM">9 PM</option><option value="12:00 AM">12 AM</option><option value="2:00 AM">2 AM</option></select></div>
<div><label style="font-size:8px;font-weight:800">BLOCK</label><br><select id="filterBlock" class="input"><option value="">ALL</option><option value="MAIN">MAIN</option><option value="ITOCHA">ITOCHA</option></select></div>
<div style="margin-left:auto;display:flex;gap:4px;align-items:end"><span id="filterCount" style="font-weight:900;font-size:10px;background:#0a1931;color:#fff;padding:6px 10px;border-radius:14px;height:30px;display:flex;align-items:center">0</span><button class="btn btnDark" onclick="clearFilters()" style="height:30px">CLEAR</button><button class="btn btnPurple" onclick="openAddPatientPage()" style="height:30px">+ ADD</button></div>
</div>

<div id="masterInfo" style="font-size:10px;font-weight:800;margin-top:6px;background:#eff6ff;padding:6px;border-radius:5px">LOADING...</div>

<div class="searchRow">
<input type="text" id="searchName" placeholder="SEARCH NAME / SHRI / PMJAY ID..." autocomplete="off">
<div class="viewToggle">
<button class="viewBtn active" id="btnListView" onclick="switchView('list')">☰</button>
<button class="viewBtn" id="btnGridView" onclick="switchView('grid')">⊞</button>
</div>
</div>
</div>

<div class="card" style="padding:0">
<div class="sheetWrap" id="sheetWrap"><table><thead><tr><th style="width:35px">SL</th><th style="width:110px">PMJAY/CMHT ID</th><th style="width:170px">PATIENT NAME</th><th class="status-col" id="thStatus" style="width:115px">STATUS</th><th style="width:80px">SHRI ID</th><th style="width:70px">TIME</th><th style="width:60px">BLOCK</th><th style="width:70px">PREV</th><th style="width:90px">ACTION</th></tr></thead><tbody id="tbody"></tbody></table></div>
<div class="gridWrap" id="gridWrap"></div>
<div style="padding:8px;display:flex;gap:4px;align-items:center"><div class="pagination" id="pagination"></div><div style="display:flex;gap:4px;margin-left:auto"><button class="btn btnDark" onclick="changePage(-1)">◀</button><button class="btn btnDark" onclick="changePage(1)">▶</button></div><span id="pageInfo" style="font-weight:800;font-size:9px;margin-left:8px"></span></div>
</div>
</div>

<div id="editModal" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:9999"><div style="background:#fff;border-radius:10px;padding:12px;width:90%;max-width:380px"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><span style="font-weight:900" id="editTitle">EDIT</span><button class="btn btnDark" onclick="closeModal()">X</button></div><div style="display:flex;flex-direction:column;gap:6px"><input id="editName" class="input" placeholder="PATIENT NAME"><input id="editShri" class="input" placeholder="SHRI ID"><input id="editId" class="input" placeholder="PMJAY/CMHT ID"><input id="editTime" class="input" placeholder="TIME"><input id="editBlock" class="input" placeholder="BLOCK"><input id="editPrev" class="input" placeholder="PREV"><button class="btn" style="background:#10b981;color:#fff;padding:10px" onclick="saveEdit()">SAVE</button></div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, getDocs, collection } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app=initializeApp(firebaseConfig,"listMain_"+Math.random());const db=getFirestore(app);window._fb={db,doc,setDoc,getDoc,getDocs,collection};
const app2=initializeApp(firebaseConfig,"logout_"+Math.random());const db2=getFirestore(app2);window._fb2={db:db2,doc,setDoc};
</script>
<script>
let allPatients=[],filteredPatients=[],currentPage=1,pageSize=10,editIndex=-1,currentView='list',masterMap={};
function getTodayIST(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
document.getElementById('fDate').value=getTodayIST();
let urlParams=new URLSearchParams(window.location.search);
if(urlParams.get('date')&&urlParams.get('force')==='1'){document.getElementById('fDate').value=urlParams.get('date');}
if(urlParams.get('scheme')){document.getElementById('fType').value=urlParams.get('scheme');}
const menuBtn=document.getElementById('menuBtn'),menuDrawer=document.getElementById('menuDrawer'),menuOverlay=document.getElementById('menuOverlay');
function toggleMenu(){menuDrawer.classList.toggle('open');menuOverlay.classList.toggle('open');}
function closeMenu(){menuDrawer.classList.remove('open');menuOverlay.classList.remove('open');}
menuBtn.addEventListener('click', toggleMenu);menuOverlay.addEventListener('click', closeMenu);
function goPage(page){closeMenu();document.getElementById('adminDropdown').classList.remove('open');location.href=page;}
function openAddPatientPage(){let date=document.getElementById('fDate').value;let scheme=document.getElementById('fType').value;location.href=`addlist.html?date=${date}&scheme=${scheme}&force=1`;}
function switchView(view){currentView=view;document.getElementById('btnListView').classList.toggle('active', view==='list');document.getElementById('btnGridView').classList.toggle('active', view==='grid');document.getElementById('sheetWrap').classList.toggle('hide', view==='grid');document.getElementById('gridWrap').classList.toggle('show', view==='grid');renderPagination();}
function toggleAdmin(){document.getElementById('adminDropdown').classList.toggle('open');}
function doLogout(){if(confirm('LOGOUT?')){localStorage.removeItem('shija_logged');localStorage.removeItem('shija_login_time');location.href='login.html';}}
async function doLogoutAll(){
  if(!confirm('LOGOUT ALL DEVICES?')) return;
  try{
    await window._fb2.setDoc(window._fb2.doc(window._fb2.db,'system','global_logout'),{logoutTime:Date.now()});
    localStorage.removeItem('shija_logged');
    localStorage.removeItem('shija_login_time');
    alert('All devices logged out');
    location.href='login.html';
  }catch(e){
    localStorage.removeItem('shija_logged');
    location.href='login.html';
  }
}
document.addEventListener('click', e=>{if(!e.target.closest('.adminWrap')){document.getElementById('adminDropdown').classList.remove('open');}});
function updateStatusVisibility(){let scheme=document.getElementById('fType').value;document.getElementById('thStatus').classList.toggle('hidden', scheme!=='PMJAY');}
async function buildMasterMap(){
  masterMap={};
  try{let snap=await window._fb.getDocs(window._fb.collection(window._fb.db,'patients'));snap.forEach(d=>{let p=d.data();if(p.deleted)return;let shri=String(p.shriId||p.shri||d.id||'').trim().toUpperCase();let pmjay=String(p.pmjayId||p.pmjay||'').trim().toUpperCase();let name=String(p.patientName||p.name||'').trim().toUpperCase();if(!shri)return;masterMap[shri]={shri:shri,pmjayId:pmjay,pmjayName:name,cmhtId:'',cmhtName:''};});}catch(e){}
  try{let snap2=await window._fb.getDocs(window._fb.collection(window._fb.db,'cmht_patients'));snap2.forEach(d=>{let p=d.data();if(p.deleted)return;let shri=String(p.shriId||p.shri||d.id||'').trim().toUpperCase();let cmht=String(p.cmhtId||p.cmht||p.pmjayId||p.pmjay||'').trim().toUpperCase();let name=String(p.patientName||p.name||'').trim().toUpperCase();if(!shri)return;if(!masterMap[shri])masterMap[shri]={shri:shri,pmjayId:'',pmjayName:'',cmhtId:'',cmhtName:''};masterMap[shri].cmhtId=cmht;masterMap[shri].cmhtName=name;});}catch(e){}
  document.getElementById('masterInfo').innerHTML=`MASTER: ${Object.keys(masterMap).length}`;return masterMap;
}
function enrichPatient(p){let shriKey=String(p.shri||'').trim().toUpperCase();if(!shriKey)return p;let m=masterMap[shriKey];if(!m)return p;let scheme=document.getElementById('fType').value;if(scheme==='PMJAY'){if(m.pmjayName)p.name=m.pmjayName;if(m.pmjayId)p.pmjayCmhtId=m.pmjayId;}else if(scheme==='CMHT'){if(m.cmhtName)p.name=m.cmhtName;if(m.cmhtId)p.pmjayCmhtId=m.cmhtId;else if(m.pmjayId)p.pmjayCmhtId=m.pmjayId;}if(!p.patientStatus){p.patientStatus='ENHANCEMENT';}return p;}
function setStatus(t,m){let el=document.getElementById('status');el.className='status '+t;el.innerText=m;}
async function autoSaveToFirebase(){let date=document.getElementById('fDate').value;let scheme=document.getElementById('fType').value;let docId=date+'_'+scheme;setStatus('saving','SAVING...');try{await window._fb.setDoc(window._fb.doc(window._fb.db,'daily_dialysis_lists',docId),{date:date,scheme:scheme,patients:allPatients,count:allPatients.length,updatedAt:new Date().toISOString()});setStatus('saved',`SAVED ${allPatients.length}`);}catch(e){setStatus('saved','SAVED LOCAL');}}
async function onDateChange(){let date=document.getElementById('fDate').value;let scheme=document.getElementById('fType').value;let docId=date+'_'+scheme;updateStatusVisibility();setStatus('saving','LOADING...');try{let snap=await window._fb.getDoc(window._fb.doc(window._fb.db,'daily_dialysis_lists',docId));let patients=snap.exists()?(snap.data().patients||[]):[];patients=patients.map((p,i)=>{let enriched=enrichPatient({...p,sl:i+1});enriched.sl=i+1;if(!enriched.patientStatus)enriched.patientStatus='ENHANCEMENT';return enriched;});if(scheme==='PMJAY'){patients=patients.filter(p=>(p.patientStatus||'ENHANCEMENT')!=='DISCHARGE');}allPatients=patients;filteredPatients=[...allPatients];currentPage=1;if(patients.length===0){setStatus('blank','BLANK');}else{setStatus('saved',`${patients.length} PATIENTS`);}applyFilter();}catch(e){setStatus('saved','ERROR');}}
async function onSchemeChange(){allPatients=[];filteredPatients=[];currentPage=1;await onDateChange();}
function normalizeTime(t){if(!t)return'';let s=String(t).toUpperCase().trim().replace(/\s+/g,' ').replace(/\./g,'');let m=s.match(/(\d{1,2})(?::(\d{1,2}))?\s*([AP]M)?/);if(!m)return s;let hour=parseInt(m[1]);let min=m[2]?m[2].padStart(2,'0'):'00';let ap=m[3]||'';if(!ap){if(s.includes('AM'))ap='AM';else if(s.includes('PM'))ap='PM';}if(ap){return`${hour}:${min} ${ap}`;}return`${hour}:${min}`;}
function applyFilter(){let search=document.getElementById('searchName').value.toLowerCase().trim();let timeFilter=document.getElementById('filterTime').value;let timeFilterNorm=normalizeTime(timeFilter);let blockFilter=document.getElementById('filterBlock').value;filteredPatients=allPatients.filter(p=>{if(search&&!String(p.name||'').toLowerCase().includes(search)&&!String(p.shri||'').toLowerCase().includes(search)&&!String(p.pmjayCmhtId||'').toLowerCase().includes(search))return false;if(timeFilter){let pTimeNorm=normalizeTime(p.time);if(pTimeNorm!==timeFilterNorm)return false;}if(blockFilter&&p.block!==blockFilter)return false;return true;});document.getElementById('filterCount').innerText=`${filteredPatients.length}/${allPatients.length}`;currentPage=1;renderPagination();}
function clearFilters(){document.getElementById('filterTime').value='';document.getElementById('filterBlock').value='';document.getElementById('searchName').value='';applyFilter();}
function renderPagination(){pageSize=parseInt(document.getElementById('rowsPerPage').value)||10;let totalPages=Math.max(1,Math.ceil(filteredPatients.length/pageSize));if(currentPage>totalPages)currentPage=totalPages;let pag=document.getElementById('pagination');pag.innerHTML='';for(let i=1;i<=totalPages;i++){let b=document.createElement('button');b.className='pageBtn'+(i===currentPage?' active':'');b.innerText=i;b.onclick=()=>{currentPage=i;renderTable();renderPagination();};pag.appendChild(b);}renderTable();renderGrid();}
function renderTable(){let tbody=document.getElementById('tbody');tbody.innerHTML='';let start=(currentPage-1)*pageSize;let end=start+pageSize;let pagePatients=filteredPatients.slice(start,end);let scheme=document.getElementById('fType').value;let isPMJAY=scheme==='PMJAY';pagePatients.forEach((p,idx)=>{let globalIdx=allPatients.indexOf(p);let status=p.patientStatus||'ENHANCEMENT';let tr=document.createElement('tr');let statusCell=isPMJAY?`<td class="status-col"><select class="filterSelect" onchange="handleStatusChange(${globalIdx}, this.value)"><option value="ENHANCEMENT" ${status==='ENHANCEMENT'?'selected':''}>ENHANCEMENT</option><option value="DISCHARGE" ${status==='DISCHARGE'?'selected':''}>DISCHARGE</option></select></td>`:`<td class="status-col hidden"></td>`;tr.innerHTML=`<td class="slCol">${p.sl||start+idx+1}</td><td class="idCol">${p.pmjayCmhtId||''}</td><td class="nameCol">${p.name||''}</td>${statusCell}<td>${p.shri||''}</td><td>${p.time||''}</td><td>${p.block||''}</td><td>${p.prev||''}</td><td><div class="actionCell"><button class="btnEdit" onclick="openEdit(${globalIdx})">EDIT</button><button class="btnDelete" onclick="deleteRow(${globalIdx})">DEL</button></div></td>`;tbody.appendChild(tr);});if(pagePatients.length===0){let tr=document.createElement('tr');tr.innerHTML=`<td colspan="9" style="padding:12px;text-align:center">NO PATIENTS</td>`;tbody.appendChild(tr);}document.getElementById('pageInfo').innerText=`${document.getElementById('fDate').value} | ${document.getElementById('fType').value} | P${currentPage}/${Math.max(1,Math.ceil(filteredPatients.length/pageSize))}`;}
function renderGrid(){let grid=document.getElementById('gridWrap');grid.innerHTML='';let start=(currentPage-1)*pageSize;let end=start+pageSize;let pagePatients=filteredPatients.slice(start,end);let scheme=document.getElementById('fType').value;let isPMJAY=scheme==='PMJAY';pagePatients.forEach((p,idx)=>{let globalIdx=allPatients.indexOf(p);let status=p.patientStatus||'ENHANCEMENT';let div=document.createElement('div');div.className='pCard';let statusDropdown=isPMJAY?`<select class="filterSelect" onchange="handleStatusChange(${globalIdx}, this.value)"><option value="ENHANCEMENT" ${status==='ENHANCEMENT'?'selected':''}>ENHANCEMENT</option><option value="DISCHARGE" ${status==='DISCHARGE'?'selected':''}>DISCHARGE</option></select>`:'';div.innerHTML=`<div class="pCardTop"><span class="pCardSL">#${p.sl||start+idx+1}</span>${statusDropdown}</div><div class="pCardName">${p.name||'NO NAME'}</div><div class="pCardMeta"><span>${p.pmjayCmhtId||'NO ID'}</span><span>SHRI:${p.shri||''}</span><span>${p.time||''}</span><span>${p.block||''}</span></div><div class="actionCell" style="margin-top:6px"><button class="btnEdit" onclick="openEdit(${globalIdx})">EDIT</button><button class="btnDelete" onclick="deleteRow(${globalIdx})">DEL</button></div>`;grid.appendChild(div);});}
function changePage(d){let totalPages=Math.max(1,Math.ceil(filteredPatients.length/pageSize));currentPage+=d;if(currentPage<1)currentPage=1;if(currentPage>totalPages)currentPage=totalPages;renderPagination();}
function openEdit(globalIdx){editIndex=globalIdx;let p=allPatients[globalIdx];if(!p)return;document.getElementById('editTitle').innerText=`EDIT: ${p.name}`;document.getElementById('editName').value=p.name||'';document.getElementById('editShri').value=p.shri||'';document.getElementById('editId').value=p.pmjayCmhtId||'';document.getElementById('editTime').value=p.time||'';document.getElementById('editBlock').value=p.block||'';document.getElementById('editPrev').value=p.prev||'';document.getElementById('editModal').style.display='flex';}
function saveEdit(){if(editIndex<0)return;allPatients[editIndex].name=document.getElementById('editName').value.toUpperCase();allPatients[editIndex].shri=document.getElementById('editShri').value.toUpperCase();allPatients[editIndex].pmjayCmhtId=document.getElementById('editId').value.toUpperCase();allPatients[editIndex].time=document.getElementById('editTime').value.toUpperCase();allPatients[editIndex].block=document.getElementById('editBlock').value.toUpperCase();allPatients[editIndex].prev=document.getElementById('editPrev').value;allPatients[editIndex]=enrichPatient(allPatients[editIndex]);closeModal();applyFilter();autoSaveToFirebase();}
function closeModal(){document.getElementById('editModal').style.display='none';}
function deleteRow(globalIdx){if(!confirm('DELETE?'))return;allPatients.splice(globalIdx,1);allPatients.forEach((p,i)=>p.sl=i+1);applyFilter();autoSaveToFirebase();}
async function handleStatusChange(globalIdx,newStatus){let p=allPatients[globalIdx];if(!p)return;let scheme=document.getElementById('fType').value;if(scheme!=='PMJAY')return;if(newStatus==='DISCHARGE'){if(!confirm(`DISCHARGE ${p.name}?`)){renderPagination();return;}p.patientStatus='DISCHARGE';let date=document.getElementById('fDate').value;try{await window._fb.setDoc(window._fb.doc(window._fb.db,'discharges', `${date}_${p.shri}_${Date.now()}` ), {date:date,scheme:scheme,shriId:p.shri,shri:p.shri,patientName:p.name,name:p.name,pmjayCmhtId:p.pmjayCmhtId,time:p.time,block:p.block,prev:p.prev,status:'DISCHARGE',dischargedAt:new Date().toISOString(),from:'list.html'});}catch(e){}allPatients.splice(globalIdx,1);allPatients.forEach((x,i)=>x.sl=i+1);await autoSaveToFirebase();applyFilter();}else{p.patientStatus='ENHANCEMENT';await autoSaveToFirebase();applyFilter();}}
function exportPDF(){if(filteredPatients.length===0){alert('No data');return;}let date=document.getElementById('fDate').value;let type=document.getElementById('fType').value;const { jsPDF }=window.jspdf;let docPdf=new jsPDF('landscape','mm','a4');docPdf.setFontSize(12);docPdf.text(`${date} ${type} - ${filteredPatients.length}`,14,12);let isPMJAY=type==='PMJAY';let rows=filteredPatients.map(p=>isPMJAY?[p.sl,p.pmjayCmhtId,p.name,p.patientStatus||'ENHANCEMENT',p.shri,p.time,p.block,p.prev]:[p.sl,p.pmjayCmhtId,p.name,p.shri,p.time,p.block,p.prev]);let head=isPMJAY?[['SL','ID','NAME','STATUS','SHRI','TIME','BLOCK','PREV']]:[['SL','ID','NAME','SHRI','TIME','BLOCK','PREV']];docPdf.autoTable({startY:16,head:head,body:rows,theme:'grid',styles:{fontSize:7,halign:'center'},headStyles:{fillColor:[10,25,49]}});docPdf.save(`${date}_${type}.pdf`);}
document.getElementById('fDate').addEventListener('change', onDateChange);
document.getElementById('fType').addEventListener('change', onSchemeChange);
document.getElementById('rowsPerPage').addEventListener('change', renderPagination);
document.getElementById('searchName').addEventListener('input', applyFilter);
document.getElementById('filterTime').addEventListener('change', applyFilter);
document.getElementById('filterBlock').addEventListener('change', applyFilter);
window.addEventListener('load', async ()=>{document.getElementById('fDate').value=getTodayIST();await buildMasterMap();updateStatusVisibility();setTimeout(onDateChange,200);});
</script>
