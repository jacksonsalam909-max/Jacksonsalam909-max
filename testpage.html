function getPageSize(){return 20;}
function normalizeTime(t){let s=String(t).toUpperCase().trim();let m=s.match(/(\d{1,2})(?::(\d{1,2}))?\s*([AP]M)?/);if(!m)return s;let h=parseInt(m[1]),mi=m[2]?m[2].padStart(2,'0'):'00',ap=m[3]||'';if(!ap){if(s.includes('AM'))ap='AM';else if(s.includes('PM'))ap='PM';}return ap?`${h}:${mi} ${ap}`:`${h}:${mi}`;}
async function buildMasterMap(){masterMap={};try{let snap=await db.collection('patients').get();snap.forEach(d=>{let p=d.data();if(p.deleted)return;let shri=String(p.shriId||p.shri||d.id||'').trim().toUpperCase();let name=String(p.patientName||p.name||'').trim().toUpperCase();if(!shri)return;let pmjay=String(p.pmjayId||p.pmjay||p.pmjayCard||p.cardNo||'').trim();masterMap[shri]={pmjayName:name,cmhtName:'',pmjayId:pmjay,cmhtId:''};});}catch(e){}try{let snap2=await db.collection('cmht_patients').get();snap2.forEach(d=>{let p=d.data();if(p.deleted)return;let shri=String(p.shriId||p.shri||d.id||'').trim().toUpperCase();let name=String(p.patientName||p.name||'').trim().toUpperCase();let pmjay=String(p.pmjayId||p.pmjay||p.pmjayCard||p.cardNo||p.cmhtId||'').trim();if(!shri)return;if(!masterMap[shri])masterMap[shri]={pmjayName:'',cmhtName:'',pmjayId:'',cmhtId:''};masterMap[shri].cmhtName=name;if(pmjay)masterMap[shri].cmhtId=pmjay;if(!masterMap[shri].pmjayId)masterMap[shri].pmjayId=pmjay;});}catch(e){}}
function enrichPatient(p){let k=String(p.shri||'').trim().toUpperCase();let m=masterMap[k];if(!m)return p;let scheme=document.getElementById('fType').value;if(scheme==='PMJAY'){if(m.pmjayName)p.name=m.pmjayName;if(m.pmjayId&&!p.pmjayId)p.pmjayId=m.pmjayId;}else{if(m.cmhtName)p.name=m.cmhtName;if(m.cmhtId&&!p.pmjayId)p.pmjayId=m.cmhtId;else if(m.pmjayId&&!p.pmjayId)p.pmjayId=m.pmjayId;}return p;}
async function loadData(){try{let d=document.getElementById('fDate').value,s=document.getElementById('fType').value,id=d+'_'+s;document.getElementById('doneMeta').innerText="Loading...";await buildMasterMap();let snap=await db.collection('daily_dialysis_lists').doc(id).get();let patients=snap.exists?(snap.data().patients||[]):[];patients=patients.map((p,i)=>{let e=enrichPatient({...p});e.sl=i+1;return e;});allPatients=patients;let sSnap=await db.collection('daily_photo_opd').doc(id).get();statusMap=sSnap.exists?(sSnap.data().status||{}):{};render();}catch(e){document.getElementById('doneMeta').innerText="Error: "+(e.message||e);}}
async function saveStatus(){let d=document.getElementById('fDate').value,s=document.getElementById('fType').value,id=d+'_'+s;await db.collection('daily_photo_opd').doc(id).set({date:d,scheme:s,status:statusMap,updatedAt:new Date().toISOString()},{merge:true});}
function showConfirm(sh,type){pendingShri=sh;pendingType=type;let p=allPatients.find(x=>String(x.shri||'').toUpperCase()===sh);let name=p?p.name:sh;let st=statusMap[sh]||{photoTaken:false,opdDone:false};let isDone=type==='photo'?st.photoTaken:st.opdDone;let typeTxt=type==='photo'?'PHOTO':'OPD';document.getElementById('confirmTitle').innerText='Are you sure?';document.getElementById('confirmSub').innerText=isDone?typeTxt+' UNDO for '+name:typeTxt+' done for '+name;document.getElementById('confirmModal').style.display='flex';}
function hideConfirm(){document.getElementById('confirmModal').style.display='none';pendingShri=null;pendingType=null;}
function getNowTime(){let d=new Date();let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),da=String(d.getDate()).padStart(2,'0'),h=String(d.getHours()).padStart(2,'0'),mi=String(d.getMinutes()).padStart(2,'0'),s=String(d.getSeconds()).padStart(2,'0');return `${y}-${m}-${da} ${h}:${mi}:${s}`;}
async function confirmSure(){if(!pendingShri||!pendingType)return;let btn=document.getElementById('btnSure');btn.innerText='...';btn.disabled=true;try{if(!statusMap[pendingShri])statusMap[pendingShri]={photoTaken:false,opdDone:false};let st=statusMap[pendingShri];let isDone=pendingType==='photo'?st.photoTaken:st.opdDone;if(!isDone){if(pendingType==='photo'){st.photoTaken=true;st.photoTime=getNowTime();}else{st.opdDone=true;st.opdTime=getNowTime();}}await saveStatus();hideConfirm();render();}catch(e){alert('Error: '+(e.message||e));}finally{btn.innerText='SURE';btn.disabled=false;}}
async function confirmNotSure(){if(!pendingShri||!pendingType)return;let btn=document.getElementById('btnNotSure');btn.innerText='...';btn.disabled=true;try{if(!statusMap[pendingShri])statusMap[pendingShri]={photoTaken:false,opdDone:false};let st=statusMap[pendingShri];let isDone=pendingType==='photo'?st.photoTaken:st.opdDone;if(isDone){if(pendingType==='photo'){st.photoTaken=false;st.photoTime='';}else{st.opdDone=false;st.opdTime='';}await saveStatus();}hideConfirm();render();}catch(e){alert('Error: '+(e.message||e));}finally{btn.innerText='NOT SURE';btn.disabled=false;}}
function getInit(n){return(n||'A').charAt(0).toUpperCase();}
function getCol(name){const colors=['#8B5CF6','#3B82F6','#22C55E','#F59E0B','#EF4444'];let h=0;for(let i=0;i<name.length;i++){h=name.charCodeAt(i)+((h<<5)-h);}return colors[Math.abs(h)%colors.length];}
function getFiltered(){let tn=normalizeTime(activeTimeFilter);let bf=document.getElementById('filterBlock').value;let sq=searchQuery.toLowerCase().trim();return allPatients.filter(p=>{let sh=String(p.shri||'').toUpperCase();if(!sh)return false;if(activeTimeFilter&&normalizeTime(p.time)!==tn)return false;if(bf&&p.block!==bf)return false;let st=statusMap[sh]||{photoTaken:false,opdDone:false};if(st.photoTaken&&st.opdDone)return false;if(sq){let nameL=String(p.name||'').toLowerCase();let shriL=sh.toLowerCase();let pmjayL=String(p.pmjayId||'').toLowerCase();if(!nameL.includes(sq)&&!shriL.includes(sq)&&!pmjayL.includes(sq))return false;}return true;});}
function updateToggleBtn(){let b=document.getElementById('toggleViewBtn');if(b){b.innerHTML=isListView?listIconSVG:gridIconSVG;}}
function getPmjayId(p){return String(p.pmjayId||p.pmjay||p.pmjayCard||p.cardNo||'').trim();}
function render(){
  let grid=document.getElementById('grid');if(!grid)return;
  grid.classList.toggle('listView',isListView);
  let filtered=getFiltered();let done=0;
  allPatients.forEach(p=>{let sh=String(p.shri||'').toUpperCase();let st=statusMap[sh];if(st&&st.photoTaken&&st.opdDone)done++;});
  let ps=getPageSize();let pages=Math.max(1,Math.ceil(filtered.length/ps));
  if(currentPage>pages)currentPage=pages;if(currentPage<1)currentPage=1;
  let items=filtered.slice((currentPage-1)*ps,currentPage*ps);
  grid.innerHTML='';
  items.forEach(p=>{
    let sh=String(p.shri||'').toUpperCase();
    let pmjay=getPmjayId(p);
    let st=statusMap[sh]||{photoTaken:false,opdDone:false,photoTime:'',opdTime:''};
    let photoBadge=st.photoTaken?`<span class="capBadge captured">Captured</span>`:`<span class="capBadge pending">Pending</span>`;
    let opdBadge=st.opdDone?`<span class="capBadge captured">Captured</span>`:`<span class="capBadge pending">Pending</span>`;
    let photoTime=st.photoTime||'';
    let opdTime=st.opdTime||'';
    let photoBtnText=st.photoTaken?'↩ Undo':'✓ Capture';
    let opdBtnText=st.opdDone?'↩ Undo':'✓ Capture';
    let photoBtnClass=st.photoTaken?'btnUndo active':'btnUndo';
    let opdBtnClass=st.opdDone?'btnUndo active':'btnUndo';
    let sl=p.sl||1;
    let block=p.block||'Main';
    let time=p.time||'Morning / 7am';
    let avatarHtml=p.photoUrl?`<div class="avatarPhoto"><img src="${p.photoUrl}" onerror="this.parentElement.innerHTML='${getInit(p.name)}';this.parentElement.style.background='${getCol(p.name||'A')}'"></div>`:`<div class="avatarPhoto" style="background:${getCol(p.name||'A')}">${getInit(p.name)}</div>`;
    let div=document.createElement('div');div.className='card';
    div.innerHTML=`
      <div class="cardHead">
        ${avatarHtml}
        <div class="nameWrap">
          <div class="pName">${p.name||''}</div>
          <span class="pBadge">PMJAY #${sl}</span>
        </div>
      </div>
      <div class="infoGrid">
        <div class="infoBox"><div class="infoLabel">PMJAY ID</div><div class="infoValue">${pmjay||'-'}</div></div>
        <div class="infoBox"><div class="infoLabel">SHRI ID</div><div class="infoValue">${sh}</div></div>
        <div class="infoBox"><div class="infoLabel">BLOCK</div><div class="infoValue">${block}</div></div>
        <div class="infoBox"><div class="infoLabel">SHIFT / TIME</div><div class="infoValue">${time}</div></div>
      </div>
      <div class="captureRow">
        <div class="capCol">
          <div class="capTitle">Patient photo captured</div>
          ${photoBadge}
          <div class="capTime">${photoTime}</div>
          <button class="${photoBtnClass}" data-shri="${sh}" data-type="photo">${photoBtnText}</button>
        </div>
        <div class="capCol">
          <div class="capTitle">OPD slip captured</div>
          ${opdBadge}
          <div class="capTime">${opdTime}</div>
          <button class="${opdBtnClass}" data-shri="${sh}" data-type="opd">${opdBtnText}</button>
        </div>
      </div>`;
    grid.appendChild(div);
  });
  if(filtered.length===0){grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:30px;background:#fff;border-radius:14px;color:#0f172a;font-weight:700">All done ✓ - Check DONE tab</div>`;}
  document.getElementById('pageIndicator').innerText=`${currentPage}/${pages}`;
  document.getElementById('prevBtn').disabled=currentPage<=1;
  document.getElementById('nextBtn').disabled=currentPage>=pages;
  document.getElementById('doneB').innerText=done;
  document.getElementById('searchInfo').innerText=`Showing ${((currentPage-1)*ps)+1}-${Math.min(currentPage*ps,filtered.length)} of ${filtered.length} patients`;
  document.getElementById('doneMeta').innerText=`${done} done • ${filtered.length} pending`;
  updateToggleBtn();
  document.querySelectorAll('.btnUndo').forEach(btn=>{
    const h=(e)=>{e.preventDefault();e.stopPropagation();showConfirm(btn.getAttribute('data-shri'),btn.getAttribute('data-type'));};
    btn.addEventListener('click',h);btn.addEventListener('touchend',h,{passive:false});
  });
}
let startX=0;const scrollEl=document.getElementById('scroll');scrollEl.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;},{passive:true});scrollEl.addEventListener('touchend',e=>{let diff=e.changedTouches[0].clientX-startX;if(Math.abs(diff)>70){if(diff<0)goNextPage();else goPrevPage();}},{passive:true});
function goNextPage(){let ps=getPageSize();let pages=Math.max(1,Math.ceil(getFiltered().length/ps));if(currentPage<pages){currentPage++;render();}}
function goPrevPage(){if(currentPage>1){currentPage--;render();}}
function goToCompleted(){let d=document.getElementById('fDate').value,t=document.getElementById('fType').value;location.href='gdacompleted.html?date='+encodeURIComponent(d)+'&type='+encodeURIComponent(t);}
function addUniversal(el,fn){if(!el)return;el.addEventListener('click',fn);el.addEventListener('touchend',e=>{e.preventDefault();fn(e);},{passive:false});}
document.querySelectorAll('.chip').forEach(c=>{addUniversal(c,()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');activeTimeFilter=c.dataset.time;currentPage=1;render();});});
document.getElementById('filterBlock')?.addEventListener('change',()=>{currentPage=1;render();});
document.getElementById('fType')?.addEventListener('change',loadData);
addUniversal(document.getElementById('tabSync'),()=>location.reload());
addUniversal(document.getElementById('tabDone'),goToCompleted);
addUniversal(document.getElementById('tabHome'),()=>location.href='index.html');
addUniversal(document.getElementById('toggleViewBtn'),()=>{isListView=!isListView;localStorage.setItem('gda_view',isListView?'list':'grid');currentPage=1;render();});
addUniversal(document.getElementById('prevBtn'),()=>goPrevPage());
addUniversal(document.getElementById('nextBtn'),()=>goNextPage());
addUniversal(document.getElementById('btnSure'),()=>confirmSure());
addUniversal(document.getElementById('btnNotSure'),()=>confirmNotSure());
document.getElementById('confirmModal')?.addEventListener('click',e=>{if(e.target.id==='confirmModal')hideConfirm();});
const searchInput=document.getElementById('searchName');
const clearBtn=document.getElementById('clearSearch');
searchInput?.addEventListener('input',e=>{searchQuery=e.target.value;if(clearBtn)clearBtn.style.display=searchQuery?'flex':'none';currentPage=1;render();});
addUniversal(clearBtn,()=>{searchInput.value='';searchQuery='';clearBtn.style.display='none';currentPage=1;render();});
const ADMIN_PASSWORD="jack8189";
try{db.collection("system").doc("global_logout").onSnapshot((snap)=>{if(!snap.exists) return; let lt=snap.data().logoutTime||0; let my=parseInt(localStorage.getItem('shija_login_time')||'0'); if(lt>my && my!==0){localStorage.removeItem('shija_logged');localStorage.removeItem('shija_login_time');location.href='login.html';}});}catch(e){}
document.addEventListener('DOMContentLoaded',()=>{
  const adminBtn=document.getElementById('adminBtn');const adminDropdown=document.getElementById('adminDropdown');
  adminBtn?.addEventListener('click',(e)=>{e.stopPropagation();adminDropdown.style.display=adminDropdown.style.display==='none'||adminDropdown.style.display===''?'block':'none';});
  document.addEventListener('click',(e)=>{if(!e.target.closest('#adminMenuWrap'))adminDropdown.style.display='none';});
  document.getElementById('btnLogout')?.addEventListener('click',()=>{if(confirm('Logout from this device?')){localStorage.removeItem('shija_logged');localStorage.removeItem('shija_login_time');location.href='login.html';}});
  document.getElementById('btnLogoutAll')?.addEventListener('click',()=>{adminDropdown.style.display='none';document.getElementById('logoutAllModal').style.display='flex';});
  document.getElementById('cancelLogoutAll')?.addEventListener('click',()=>{document.getElementById('logoutAllModal').style.display='none';});
  document.getElementById('logoutAllModal')?.addEventListener('click',(e)=>{if(e.target.id==='logoutAllModal')e.currentTarget.style.display='none';});
  document.getElementById('confirmLogoutAll')?.addEventListener('click',async()=>{let pass=document.getElementById('adminPassInput').value.trim();if(pass!==ADMIN_PASSWORD){document.getElementById('passError').style.display='block';return;}document.getElementById('passError').style.display='none';let btn=document.getElementById('confirmLogoutAll');btn.innerText='...';btn.disabled=true;try{await db.collection("system").doc("global_logout").set({logoutTime:Date.now(),timestamp:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});alert('All devices logged out!');localStorage.removeItem('shija_logged');localStorage.removeItem('shija_login_time');location.href='login.html';}catch(err){alert(err.message);btn.innerText='Logout All';btn.disabled=false;}});
});
window.addEventListener('load',()=>{setTimeout(()=>{updateToggleBtn();loadData();},300);});
window.addEventListener('resize',()=>{render();});
</script>
</body>
</html>
