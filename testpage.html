<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SHIJA Dialysis - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui}
body{min-height:100vh;display:grid;place-items:center;position:relative;overflow:hidden;background:#0f172a}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.bg img{width:100%;height:100%;object-fit:cover;filter:blur(14px) brightness(0.85);transform:scale(1.15)} /* STRONG BLUR LIKE YOUR PHOTO */
.bg::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,0.12)} /* light wash */
.card{position:relative;z-index:2;width:92%;max-width:720px;background:rgba(255,255,255,0.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.9);border-radius:20px;box-shadow:0 24px 64px rgba(15,23,42,0.30);display:flex;overflow:hidden;min-height:440px}
.left{width:42%;background:linear-gradient(180deg,#f8fafc,#eef2ff);padding:32px 28px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid #e2e8f0}
.logoWrap{display:flex;align-items:center;gap:10px}
.logoIcon{width:52px;height:52px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;display:grid;place-items:center;padding:6px}
.logoIcon img{width:100%;height:100%;object-fit:contain}
.logoText{font-weight:900;font-size:28px;color:#0f172a}
.subLogo{font-size:12px;font-weight:700;color:#64748b;letter-spacing:1px;text-transform:uppercase;margin-top:4px}
.leftContent{margin-top:20px}
.leftContent h2{font-size:22px;font-weight:900;color:#0f172a;line-height:1.2}
.leftContent p{font-size:13px;color:#64748b;margin-top:8px;line-height:1.5}
.right{width:58%;padding:30px 32px;display:flex;flex-direction:column;justify-content:center}
.right h1{font-size:26px;font-weight:900;color:#0f172a}
.right p.desc{font-size:13px;color:#64748b;margin-top:6px;margin-bottom:20px}
.field{margin-top:14px}
.field label{font-size:11px;font-weight:700;color:#0f172a;margin-bottom:6px;display:block;text-transform:uppercase}
.inputBox{display:flex;align-items:center;background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:0 12px;height:46px;transition:.2s}
.inputBox:focus-within{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb12}
.inputBox input{flex:1;height:100%;border:0;outline:0;font-size:13.5px;background:transparent}
.inputBox svg{width:18px;height:18px;stroke:#94a3b8;stroke-width:1.8;fill:none;margin-right:8px}
.row{display:flex;justify-content:space-between;align-items:center;margin:14px 0 18px}
.check{display:flex;align-items:center;gap:6px;font-size:12px;color:#475569}
.link{font-size:12px;font-weight:600;color:#2563eb;cursor:pointer}
.btn{width:100%;height:46px;background:#2563eb;color:#fff;border:0;border-radius:12px;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 6px 16px #2563eb30}
.error{display:none;background:#fef2f2;border:1px solid #fecaca;color:#dc2626;padding:8px 12px;border-radius:10px;font-size:12px;font-weight:600;margin-bottom:8px}
.bottom{text-align:center;margin-top:16px;font-size:12px;color:#64748b}
.bottom b{color:#2563eb;cursor:pointer}
.trap{position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;opacity:0}
.popup{position:fixed;inset:0;background:rgba(15,23,42,0.55);display:none;place-items:center;z-index:9999}
.popupBox{background:#fff;border-radius:14px;padding:20px;width:90%;max-width:320px;text-align:center}
.popupBox h3{font-size:14px;font-weight:800;color:#0f172a;margin-bottom:6px}
.popupBox p{font-size:13px;color:#475569;font-weight:600;margin-bottom:14px}
.popupBox button{width:100%;height:40px;background:#2563eb;color:#fff;border:0;border-radius:10px;font-weight:700;cursor:pointer}
@media(max-width:700px){.card{flex-direction:column;max-width:400px}.left{width:100%;padding:20px 24px}.leftContent{display:none}.right{width:100%;padding:24px}}
</style>
</head>
<body>
<div class="trap"><form autocomplete="on"><input type="text" autocomplete="username"><input type="password" autocomplete="current-password"></form></div>
<div class="bg"><img src="newlogin.jpg" alt="BG"></div>
<div class="card">
  <div class="left">
    <div>
      <div class="logoWrap"><div class="logoIcon"><img src="Logoc.png" onerror="this.src='logoc.png'"></div><div class="logoText">SHIJA</div></div>
      <div class="subLogo">Dialysis Care</div>
      <div class="leftContent"><h2>Welcome to<br>Dialysis Portal</h2><p>Secure • Reliable • Monitored 24/7</p></div>
    </div>
  </div>
  <div class="right">
    <h1>Sign in</h1><p class="desc">Welcome back. Please sign in to your account.</p>
    <div id="errBox" class="error"></div>
    <form autocomplete="off" onsubmit="return false">
      <div class="field"><label>Username</label><div class="inputBox"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><input id="shija_user_x9271" type="text" placeholder="Enter your username" autocomplete="off" readonly onfocus="this.removeAttribute('readonly')"></div></div>
      <div class="field"><label>Password</label><div class="inputBox"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input id="shija_pass_x9271" type="password" placeholder="••••••••" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly')"><svg onclick="togglePass()" style="width:18px;cursor:pointer;margin-left:6px" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="#94a3b8" fill="none"/><circle cx="12" cy="12" r="3" stroke="#94a3b8" fill="none"/></svg></div></div>
      <div class="row"><label class="check"><input type="checkbox"> Remember me</label><a class="link" onclick="showPopup('Contact Admin - Jacky','Please contact Jacky')">Forgot password?</a></div>
      <button id="loginBtn" class="btn" type="button" onclick="doLogin()">Sign in</button>
    </form>
    <div class="bottom">Don't have an account? <b onclick="showPopup('Contact Admin','9233287710')">Contact Admin</b></div>
  </div>
</div>
<div id="popup" class="popup" onclick="if(event.target.id==='popup') hidePopup()"><div class="popupBox"><h3 id="popupTitle"></h3><p id="popupMsg"></p><button onclick="hidePopup()">OK</button></div></div>
<script>
function clearAll(){let u=document.getElementById('shija_user_x9271'),p=document.getElementById('shija_pass_x9271');if(u){u.value='';u.setAttribute('readonly','readonly')}if(p){p.value='';p.setAttribute('readonly','readonly')}}
function togglePass(){let p=document.getElementById('shija_pass_x9271');p.type=p.type==='password'?'text':'password';p.focus()}
function showPopup(t,m){document.getElementById('popupTitle').textContent=t;document.getElementById('popupMsg').textContent=m;document.getElementById('popup').style.display='grid'}
function hidePopup(){document.getElementById('popup').style.display='none'}
function doLogin(){let uEl=document.getElementById('shija_user_x9271'),pEl=document.getElementById('shija_pass_x9271');uEl.removeAttribute('readonly');pEl.removeAttribute('readonly');let u=uEl.value.trim(),p=pEl.value.trim(),err=document.getElementById('errBox'),btn=document.getElementById('loginBtn');if(!u||!p){err.textContent='Please enter username and password';err.style.display='block';return}err.style.display='none';btn.textContent='Signing in...';btn.disabled=true;setTimeout(()=>{if(p==='jack8189'||u.toLowerCase().includes('shija')){localStorage.setItem('shija_logged','1');localStorage.setItem('shija_login_time',Date.now().toString());location.href='index.html'}else{err.textContent='Invalid';err.style.display='block';btn.textContent='Sign in';btn.disabled=false;pEl.value=''}},600)}
document.addEventListener('DOMContentLoaded',()=>{clearAll();[10,100,300,600,1000,2000].forEach(t=>setTimeout(clearAll,t))});
window.addEventListener('load',clearAll);window.addEventListener('pageshow',clearAll);document.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
</script>
</body>
</html>
