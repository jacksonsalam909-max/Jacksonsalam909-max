<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHIJA Dialysis - No Double Line</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui}
body{background:#f1f5f9;color:#0f172a;min-height:100vh;display:flex}
.whiteBar{width:270px;min-width:270px;background:#0f172a;color:#94a3b8;display:flex;flex-direction:column;justify-content:space-between;position:sticky;top:0;height:100vh;z-index:90;transition:width .32s ease, min-width .32s ease;overflow:hidden;flex-shrink:0;border:none;outline:none}
.whiteBar.folded{width:0;min-width:0}
.whiteBar.folded .sHead,.whiteBar.folded .sMenu,.whiteBar.folded .sFoot{opacity:0;pointer-events:none}
.sHead{padding:18px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #1e293b;white-space:nowrap}
/* S ICON - WHITE BOX */
.sLogo{width:38px;height:38px;min-width:38px;background:#ffffff;border-radius:10px;display:grid;place-items:center;color:#0f172a;font-weight:900;font-size:18px}
.sTitle b{color:#fff;font-size:16px;display:block;line-height:1}
.sTitle span{font-size:9px;letter-spacing:1px;color:#64748b;text-transform:uppercase}
.sMenu{flex:1;padding:12px 10px;overflow-y:auto;white-space:nowrap}
.sMenu::-webkit-scrollbar{display:none}
.sMenu a{display:block;padding:11px 12px;border-radius:10px;text-decoration:none;color:#94a3b8;font-weight:500;font-size:13px;margin-bottom:3px}
.sMenu a:hover{background:#1e293b;color:#fff}
.sMenu a.active{background:#1e293b;color:#fff;font-weight:600;border-left:3px solid #FF6CAB}
.sFoot{padding:12px;border-top:1px solid #1e293b;font-size:11px;color:#64748b;white-space:nowrap}
.mainWrap{flex:1;min-width:0;display:flex;flex-direction:column;background:#f1f5f9;min-height:100vh}
.top{height:64px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:12px;font-weight:900;font-size:17px;color:#0f172a}
/* 3-LINE MENU - BORDERLESS - NO BORDER NO BOX */
.menuBtnTop{width:40px;height:40px;border:none;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;flex-shrink:0;outline:none;box-shadow:none}
.menuBtnTop:hover{background:#f1f5f9;border-radius:8px}
.menuBtnTop span{display:block;width:20px;height:2.5px;background:#0f172a;border-radius:2px}
.content{flex:1;padding:20px 24px;max-width:1400px;width:100%;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{border-radius:18px;padding:18px;min-height:140px;text-decoration:none;color:#fff;display:flex;flex-direction:column;justify-content:space-between}
.c1{background:linear-gradient(135deg,#FF6CAB,#7366FF)}
.c7{background:linear-gradient(135deg,#FFA62E,#EA4D2C)}
@media(max-width:900px){.whiteBar{position:fixed;left:0;top:0;bottom:0;width:270px;min-width:270px;height:100vh;transform:translateX(0);transition:transform .32s ease}.whiteBar.folded{transform:translateX(-100%);width:270px;min-width:270px}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="whiteBar" id="whiteBar">
<div style="flex:1;display:flex;flex-direction:column;overflow:hidden">
<div class="sHead"><div class="sLogo">S</div><div class="sTitle"><b>SHIJA</b><span>DIALYSIS CARE • V2.1</span></div></div>
<div class="sMenu">
<a href="index.html" class="active">HOME</a>
<a href="total.html">TOTAL PATIENT</a>
<a href="cmht.html">CMHT TOTAL PATIENT</a>
<a href="claim.html">CLAIM</a>
<a href="searchpatient.html">SEARCH PATIENT</a>
<a href="gda.html">OFFICE ASSISTANT LIST</a>
<a href="kft.html">KFT REPORT</a>
<a href="list.html">DAILY DIALYSIS LIST</a>
<a href="add.html">ADD PATIENT</a>
<a href="bill.html">BILL</a>
</div>
</div>
<div class="sFoot"><b style="color:#fff">System Status: Online</b></div>
</div>
<div class="mainWrap">
<div class="top">
<div class="logo"><button type="button" class="menuBtnTop" onclick="toggleFold()"><span></span><span></span><span></span></button> SHIJA Dialysis</div>
</div>
<div class="content">
<div class="grid">
<a class="card c1"><div><b>PMJAY Total Patient 530</b></div></a>
<a class="card c7"><div><b>CMHT Total Patient 127</b></div></a>
</div>
</div>
</div>
<script>
function toggleFold(){document.getElementById('whiteBar').classList.toggle('folded');}
</script>
</body>
</html>
