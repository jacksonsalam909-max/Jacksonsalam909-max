<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHIJA - Professional</title>
<script src="Patient.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
body{background:#f8fafc;display:flex;min-height:100vh;color:#0f172a}
.whiteBar{position:fixed;left:0;top:0;bottom:0;width:260px;background:#ffffff;border-right:1px solid #e2e8f0;display:flex;flex-direction:column;z-index:90}
.sBrand{padding:18px 18px 14px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:10px}
.sBrand b{font-size:16px;font-weight:800;color:#0f172a;letter-spacing:-.2px}
.sMenu{flex:1;padding:10px 8px}
.sMenu a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;text-decoration:none;color:#475569;font-size:12.5px;font-weight:600;margin-bottom:2px}
.sMenu a.active{background:#eff6ff;color:#1e40af;border:1px solid #dbeafe}
.sFoot{padding:12px;border-top:1px solid #f1f5f9;font-size:11px;color:#94a3b8;font-weight:600}
.mainWrap{flex:1;margin-left:260px;background:#f8fafc;min-height:100vh;width:calc(100% - 260px);display:flex;flex-direction:column}
.top{height:56px;background:#ffffff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:10}
.top b{font-size:13px;font-weight:700;color:#0f172a}
.top span{font-size:11px;color:#64748b;font-weight:600;background:#f1f5f9;padding:5px 9px;border-radius:20px;border:1px solid #e2e8f0}
.content{padding:20px;flex:1;max-width:1280px;margin:0 auto;width:100%}
.bread{font-size:11px;color:#64748b;font-weight:600;margin-bottom:10px}
.bread b{color:#0f172a}
.head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px;gap:12px;flex-wrap:wrap}
.head h1{font-size:22px;font-weight:800;letter-spacing:-.5px;color:#0f172a}
.head p{font-size:12.5px;color:#64748b;font-weight:500;margin-top:3px}
.headActions{display:flex;gap:8px;align-items:center}
.ctrl{display:flex;gap:8px;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:8px;box-shadow:0 1px 2px rgba(15,23,42,.04);margin-bottom:14px}
.ctrl input{flex:1;padding:9px 12px;border-radius:8px;border:1px solid #e2e8f0;background:#f8fafc;font-weight:500;outline:0;font-size:13px}
.ctrl input:focus{border-color:#93c5fd;background:#fff}
.vBtn{width:32px;height:32px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;font-weight:700;cursor:pointer;color:#475569;font-size:13px}
.vBtn.active{background:#1e3a8a;color:#fff;border-color:#1e3a8a}
.addBtn{background:#1e3a8a;color:#fff;padding:8px 14px;border-radius:8px;font-weight:700;text-decoration:none;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.tableCard{background:#fff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(15,23,42,.04)}
table{width:100%;border-collapse:collapse;min-width:1020px}
thead th{padding:12px 12px;font-size:10px;color:#64748b;background:#f8fafc;text-transform:uppercase;font-weight:700;letter-spacing:.6px;white-space:nowrap;border-bottom:1px solid #e2e8f0;text-align:left}
tbody td{padding:11px 12px;border-bottom:1px solid #f1f5f9;vertical-align:middle;white-space:nowrap;text-align:left;font-size:13px}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#f8fafc}
.pSL{font-size:11px;font-weight:700;color:#94a3b8;min-width:20px}
.pPhoto{width:40px;height:40px;border-radius:8px;background:#f1f5f9;border:1px solid #e2e8f0;display:grid;place-items:center;font-weight:700;color:#334155;font-size:12px;cursor:pointer;overflow:hidden}
.pPhoto img{width:100%;height:100%;object-fit:cover}
.pName{font-weight:700;color:#0f172a;font-size:13.5px;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.pPill{display:inline-flex;background:#f8fafc;border:1px solid #e2e8f0;color:#334155;padding:4px 9px;border-radius:20px;font-weight:600;font-size:11px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pAct{display:flex;gap:12px}
.pAct button{background:none;border:0;cursor:pointer;font-weight:700;font-size:11.5px;padding:0}
.pAct .edit{color:#1e40af}
.pAct .del{color:#94a3b8}
.pAct .del:hover{color:#ef4444}
.gridWrap{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.gCard{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(15,23,42,.04);transition:.15s}
.gCard:hover{border-color:#cbd5e1;box-shadow:0 8px 16px rgba(15,23,42,.06)}
.gTop{display:flex;gap:12px;align-items:center}
.gSL{font-size:10px;font-weight:700;color:#94a3b8}
.gPhoto{width:48px;height:48px;min-width:48px;border-radius:50%;background:#f1f5f9;border:1px solid #e2e8f0;display:grid;place-items:center;font-weight:700;color:#334155;cursor:pointer;overflow:hidden}
.gPhoto img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.gName{font-weight:700;font-size:14px;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gAddr{font-size:11px;color:#64748b;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gMeta{display:flex;flex-direction:column;gap:6px}
.gRow{display:flex;justify-content:space-between;align-items:center;background:#f8fafc;border:1px solid #f1f5f9;border-radius:8px;padding:6px 8px}
.gLab{font-size:9px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.5px}
.gVal{font-size:11px;font-weight:600;color:#0f172a;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gActions{display:flex;gap:10px;border-top:1px solid #f1f5f9;padding-top:10px;margin-top:2px}
.gActions button{flex:1;padding:7px;border-radius:8px;font-weight:700;font-size:11px;cursor:pointer;border:1px solid #e2e8f0;background:#fff;color:#334155}
.gActions .edit{background:#0f172a;color:#fff;border-color:#0f172a}
.hidden{display:none!important}
.pager{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px 12px;margin-top:12px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.pBtn{padding:6px 10px;border-radius:7px;border:1px solid #e2e8f0;background:#fff;font-weight:600;cursor:pointer;font-size:11px;color:#334155}
.pInfo{font-size:11px;color:#64748b;font-weight:600}
#photoModal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.75);z-index:9999;align-items:center;justify-content:center;flex-direction:column;backdrop-filter:blur(4px)}
#photoModal.show{display:flex}
#photoView{width:90vw;max-width:360px;aspect-ratio:1/1;object-fit:cover;border-radius:12px;border:1px solid #e2e8f0;box-shadow:0 20px 40px rgba(0,0,0,.3)}
#photoView.circleMode{border-radius:50%!important}
@media(max-width:1100px){.gridWrap{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.whiteBar{display:none} .mainWrap{margin-left:0;width:100%} .gridWrap{grid-template-columns:1fr} .content{padding:12px}}
</style>
</head>
<body>
<script>if(localStorage.getItem('shija_logged')!=='1'){location.href='login.html'}</script>
<div class="whiteBar"><div class="sBrand"><div style="width:28px;height:28px;background:#1e3a8a;border-radius:7px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px">S</div><b>SHIJA Dialysis</b></div><div class="sMenu"><a class="active">Total Patients</a><a>CMHT Total</a><a>Claim Status</a><a>Search</a><a>Add Patient</a></div><div class="sFoot">Professional • v2.6 • SHIJA Hospital</div></div>
<div class="mainWrap">
<div class="top"><b>Total Patients • Professional View</b><span id="countTop">0 patients</span></div>
<div class="content">
<div class="bread">Dashboard / <b>Patients</b></div>
<div class="head"><div><h1>Patients</h1><p id="count">Professional matching design — SL + Square photo + Name + PMJAY + SHRI + Address + Action</p></div><div class="headActions"><a href="add.html" class="addBtn">+ New Patient</a></div></div>
<div class="ctrl"><input id="search" placeholder="Filter by name, SHRI, PMJAY, address..." oninput="onSearch()"><button class="vBtn active" id="listBtn" onclick="setView('list')">☰</button><button class="vBtn" id="gridBtn" onclick="setView('grid')">⊞</button></div>
<div class="tableCard" id="tableWrap"><div style="overflow:auto"><table id="tbl"></table></div></div>
<div class="gridWrap hidden" id="gridWrap"></div>
<div class="pager"><button class="pBtn" onclick="prevPage()">← Previous</button><div class="pInfo" id="pageInfo"></div><button class="pBtn" onclick="nextPage()">Next →</button></div>
</div>
</div>
<div id="photoModal" onclick="this.classList.remove('show')"><img id="photoView"><div id="photoName" style="color:#fff;margin-top:12px;font-weight:700;font-size:13px"></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app = initializeApp(firebaseConfig,"professionalFinal");const db = getFirestore(app);
let allPatients=[],filtered=[],currentPage=1,pageSize=12,photoCache={},view='list';
function getKey(p){return String(p.key||p.shri||p.id||p.name).trim()}
function getDel(){try{return JSON.parse(localStorage.getItem('deletedKeys')||'[]')}catch{return[]}}
function getInit(n){return (n||'P').charAt(0).toUpperCase()}
window.onSearch=()=>{currentPage=1;applyFilter()}
window.applyFilter=()=>{let q=document.getElementById('search').value.toLowerCase();filtered=allPatients.filter(p=>!p.deleted && [p.name,p.shri,p.pmjay,p.addr].join(' ').toLowerCase().includes(q));renderAll()}
window.triggerPhoto=(shri)=>{document.getElementById('file_'+shri.replace(/[^a-zA-Z0-9]/g,'_'))?.click()}
async function getFullPhoto(shri){try{let clean=shri.replace(/[^a-zA-Z0-9]/g,'_');let snap=await getDocs(collection(db,"patient_photos",clean+"_photo","chunks"));let a=[];snap.forEach(d=>a.push(d.data()));a.sort((x,y)=>x.index-y.index);return a.map(x=>x.data).join('')}catch{return null}}
window.openPhoto=(shri,name,mode)=>{let d=photoCache[shri];if(!d){triggerPhoto(shri);return}let v=document.getElementById('photoView');v.className='';if(mode==='circle')v.classList.add('circleMode');document.getElementById('photoName').textContent=name;v.src=d;document.getElementById('photoModal').classList.add('show')}
window.uploadPhoto=async(file,shri)=>{if(!file)return;let b64=await new Promise(r=>{let fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(file)});let clean=shri.replace(/[^a-zA-Z0-9]/g,'_');let id=clean+"_photo";let ch=[];for(let i=0;i<b64.length;i+=800000)ch.push(b64.substring(i,i+800000));await setDoc(doc(db,"patient_photos",id),{shri,cleanShri:clean,chunkCount:ch.length});for(let j=0;j<ch.length;j++)await setDoc(doc(db,"patient_photos",id,"chunks",String(j)),{index:j,data:ch[j]});photoCache[shri]=b64;renderAll()}
async function loadPhotos(){try{let snap=await getDocs(collection(db,"patient_photos"));for(let d of snap.docs){let shri=d.data().shri;let full=await getFullPhoto(shri);if(full)photoCache[shri]=full}renderAll()}catch{}}
window.renderAll=()=>{
 let tp=Math.max(1,Math.ceil(filtered.length/pageSize));if(currentPage>tp)currentPage=tp;
 let st=(currentPage-1)*pageSize;let data=filtered.slice(st,st+pageSize);
 let html='<thead><tr><th>SL No</th><th>Photo</th><th>Patient Name</th><th>PMJAY ID</th><th>SHRI ID</th><th>Patient Address</th><th>Action</th></tr></thead><tbody>';
 data.forEach((p,i)=>{let clean=p.shri.replace(/[^a-zA-Z0-9]/g,'_');let photo=photoCache[p.shri];let av=photo?`<img src="${photo}">`:`${getInit(p.name)}`;let sl=st+i+1;html+=`<tr><td><div class="pSL">${sl}</div></td><td><div class="pPhoto" onclick="openPhoto('${p.shri}','${p.name}','square')">${av}</div><input type="file" id="file_${clean}" style="display:none" accept="image/*" onchange="uploadPhoto(this.files[0],'${p.shri}')"></td><td><div class="pName">${p.name}</div></td><td><span class="pPill">${p.pmjay||'-'}</span></td><td><span class="pPill">${p.shri||'-'}</span></td><td><span class="pPill" style="max-width:200px">${p.addr||'-'}</span></td><td><div class="pAct"><button class="edit" onclick="editP(${allPatients.indexOf(p)})">Edit</button><button class="del" onclick="delP(${allPatients.indexOf(p)})">Delete</button></div></td></tr>`});
 html+='</tbody>';document.getElementById('tbl').innerHTML=html;
 let gridHtml='';data.forEach((p,i)=>{let clean=p.shri.replace(/[^a-zA-Z0-9]/g,'_');let photo=photoCache[p.shri];let av=photo?`<img src="${photo}">`:`${getInit(p.name)}`;let sl=st+i+1;gridHtml+=`<div class="gCard"><div class="gTop"><div class="gPhoto" onclick="openPhoto('${p.shri}','${p.name}','circle')">${av}</div><div style="flex:1;min-width:0"><div style="display:flex;gap:8px;align-items:center"><span class="gSL">#${sl}</span><div class="gName">${p.name}</div></div><div class="gAddr">${p.addr||'No address'}</div></div></div><div class="gMeta"><div class="gRow"><span class="gLab">PMJAY</span><span class="gVal">${p.pmjay||'-'}</span></div><div class="gRow"><span class="gLab">SHRI</span><span class="gVal">${p.shri||'-'}</span></div><div class="gRow"><span class="gLab">Address</span><span class="gVal">${p.addr||'-'}</span></div></div><div class="gActions"><button class="edit" onclick="editP(${allPatients.indexOf(p)})">Edit</button><button onclick="delP(${allPatients.indexOf(p)})">Delete</button></div><input type="file" id="file_${clean}" style="display:none" accept="image/*" onchange="uploadPhoto(this.files[0],'${p.shri}')"></div>`});
 document.getElementById('gridWrap').innerHTML=gridHtml;
 document.getElementById('count').textContent=filtered.length+' patients • Professional • Square 40px list / Circle 48px grid • 100% matching';
 document.getElementById('countTop').textContent=filtered.length+' patients';
 document.getElementById('pageInfo').textContent='Page '+currentPage+' of '+tp+' • '+filtered.length+' total';
};
window.setView=(v)=>{view=v;document.getElementById('listBtn').classList.toggle('active',v==='list');document.getElementById('gridBtn').classList.toggle('active',v==='grid');document.getElementById('tableWrap').classList.toggle('hidden',v!=='list');document.getElementById('gridWrap').classList.toggle('hidden',v!=='grid');renderAll()};
window.prevPage=()=>{if(currentPage>1){currentPage--;renderAll()}};
window.nextPage=()=>{let tp=Math.ceil(filtered.length/pageSize);if(currentPage<tp){currentPage++;renderAll()}};
window.delP=async(idx)=>{let p=allPatients[idx];if(!confirm('DELETE '+p.name+'?'))return;let k=getKey(p);let l=getDel();l.push(k);localStorage.setItem('deletedKeys',JSON.stringify(l));p.deleted=true;applyFilter();try{await setDoc(doc(db,"patients",k),{deleted:true},{merge:true})}catch{}};
window.editP=(idx)=>{let p=allPatients[idx];let n=prompt('Edit Name',p.name);if(n){p.name=n;renderAll()}};
async function init(){
 let del=getDel();let map={};
 function add(raw,over){let key=String(raw.shri||raw.id||raw.name).trim();if(!key)return;let isDel=del.includes(key)||raw.deleted;let obj={key,name:String(raw.patientName||raw.name||'').trim(),shri:String(raw.shri||raw.shriId||'').trim(),pmjay:String(raw.pmjay||raw.pmjayId||'').trim(),addr:String(raw.addr||raw.address||'').trim(),deleted:isDel};if(over||!map[key])map[key]=obj}
 if(typeof patientData!=='undefined')patientData.forEach(pd=>add(pd,false));
 try{let snap=await getDocs(collection(db,"patients"));snap.forEach(d=>{if(d.data().deleted){if(map[d.id])map[d.id].deleted=true;return}add({id:d.id,...d.data()},true)})}catch{}
 allPatients=Object.values(map).filter(p=>!p.deleted);allPatients.sort((a,b)=>a.name.localeCompare(b.name));applyFilter();setTimeout(loadPhotos,600);
}
init();
</script>
</body>
</html>
