<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>DINO GAME</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f8fafc;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}
h2{font-weight:900;color:#0f172a;margin-bottom:8px}
#game{border:2px solid #0f172a;background:#fff;border-radius:8px;touch-action:manipulation}
.info{margin-top:8px;display:flex;gap:12px;font-weight:800;font-size:12px}
.btn{padding:6px 16px;border-radius:20px;border:1.5px solid #0f172a;background:#fff;font-weight:800;cursor:pointer}
#score{color:#3c25eb}
</style>
</head>
<body>
<h2>🦖 SHIJA DINO</h2>
<canvas id="game" width="800" height="250"></canvas>
<div class="info">
<span>SCORE: <b id="score">0</b></span>
<span>HIGH: <b id="high">0</b></span>
<button class="btn" onclick="resetGame()">RESTART (SPACE)</button>
</div>
<div style="font-size:10px;color:#64748b;margin-top:6px">SPACE / TAP / CLICK = JUMP</div>

<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let score=0,high=parseInt(localStorage.getItem('dinoHigh')||0),speed=6,frame=0,gameOver=false;
document.getElementById('high').textContent=high;

const dino={x:50,y:170,w:40,h:40,vy:0,jumping:false};
const ground=210;
let obstacles=[];

function drawDino(){
 ctx.fillStyle='#0f172a';
 ctx.fillRect(dino.x,dino.y,dino.w,dino.h);
 // eye
 ctx.fillStyle='#fff';
 ctx.fillRect(dino.x+25,dino.y+8,6,6);
}
function drawGround(){
 ctx.fillStyle='#e2e8f0';
 ctx.fillRect(0,ground,800,4);
 // dots
 ctx.fillStyle='#cbd5e1';
 for(let i=0;i<800;i+=40){ ctx.fillRect((i-frame)%800,ground+10,2,2); }
}
function drawObstacles(){
 ctx.fillStyle='#ef4444';
 obstacles.forEach(o=>{
  ctx.fillRect(o.x,o.y,o.w,o.h);
  // cactus spikes
  ctx.fillStyle='#dc2626';
  ctx.fillRect(o.x-3,o.y+10,3,10);
  ctx.fillStyle='#ef4444';
 });
}
function update(){
 if(gameOver) return;
 frame++;
 if(frame%6===0) score++;
 document.getElementById('score').textContent=score;
 if(score>high){high=score;localStorage.setItem('dinoHigh',high);document.getElementById('high').textContent=high;}

 // dino physics
 if(dino.jumping){
  dino.vy+=0.8;
  dino.y+=dino.vy;
  if(dino.y>=170){dino.y=170;dino.jumping=false;dino.vy=0;}
 }

 // obstacles
 if(frame%90===0){
  obstacles.push({x:800,y:180,w:20+Math.random()*20,h:30});
 }
 obstacles.forEach(o=>o.x-=speed);
 obstacles=obstacles.filter(o=>o.x>-30);

 // collision
 obstacles.forEach(o=>{
  if(dino.x < o.x+o.w && dino.x+dino.w > o.x && dino.y < o.y+o.h && dino.y+dino.h > o.y){
   gameOver=true;
  }
 });

 if(score%200===0 && speed<12) speed+=0.3;
}

function render(){
 ctx.clearRect(0,0,800,250);
 drawGround();
 drawDino();
 drawObstacles();
 if(gameOver){
  ctx.fillStyle='rgba(0,0,0,0.6)';
  ctx.fillRect(0,0,800,250);
  ctx.fillStyle='#fff';
  ctx.font='900 24px system-ui';
  ctx.fillText('GAME OVER',320,120);
  ctx.font='700 14px system-ui';
  ctx.fillText('Press SPACE / TAP to restart',290,145);
 }
}

function loop(){ update(); render(); requestAnimationFrame(loop); }

function jump(){
 if(gameOver){resetGame();return;}
 if(!dino.jumping){dino.jumping=true;dino.vy=-12;}
}
function resetGame(){
 score=0;speed=6;obstacles=[];gameOver=false;dino.y=170;dino.vy=0;dino.jumping=false;frame=0;
}

document.addEventListener('keydown',e=>{ if(e.code==='Space') jump(); });
canvas.addEventListener('touchstart',e=>{e.preventDefault();jump();});
canvas.addEventListener('mousedown',jump);

// responsive
function resize(){
 if(window.innerWidth<820){canvas.width=window.innerWidth-20; canvas.style.width=canvas.width+'px';}
}
resize();
window.addEventListener('resize',resize);
loop();
</script>
</body>
</html>
