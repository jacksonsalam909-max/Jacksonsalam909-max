<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pikachu Walk Middle</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;cursor:none}
body{
  height:100vh;
  width:100vw;
  background:#ffffff;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}
.center-stage{
  position:relative;
  width:400px;
  height:400px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.pikachu{
  width:280px;
  animation: middleWalk .45s ease-in-out infinite alternate;
  z-index:2;
}
.pikachu img{
  width:100%;
  display:block;
}
.shadow{
  position:absolute;
  bottom:30px;
  width:120px;
  height:16px;
  background:rgba(0,0,0,.22);
  border-radius:50%;
  z-index:1;
  animation: shadowPulse .45s ease-in-out infinite alternate;
}
.mouse{
  width:24px;
  height:24px;
  background:#fff782;
  border-radius:50%;
  position:absolute;
  left:0; top:0;
  z-index:9999;
  pointer-events:none;
  animation: mousePulse .5s infinite ease-in-out alternate;
}

@keyframes middleWalk{
  0%{
    transform: translateY(0) rotate(-2deg) scale(1,1);
  }
  100%{
    transform: translateY(-14px) rotate(2deg) scale(1.02,.98);
  }
}
@keyframes shadowPulse{
  0%{ transform: scaleX(1); opacity:.22; }
  100%{ transform: scaleX(0.75); opacity:.35; }
}
@keyframes mousePulse{
  from{ width:24px; height:24px; }
  to{ width:14px; height:14px; }
}
</style>
</head>
<body>

<div class="center-stage">
  <div class="shadow"></div>
  <div class="pikachu">
    <img src="pikachu.png" alt="Pikachu walking in middle">
  </div>
  <div class="mouse" id="mouse"></div>
</div>

<script>
const mouse = document.getElementById('mouse');
document.addEventListener('mousemove',(e)=>{
  mouse.style.left = e.pageX - 12 + 'px';
  mouse.style.top = e.pageY - 12 + 'px';
});
</script>

</body>
</html>
