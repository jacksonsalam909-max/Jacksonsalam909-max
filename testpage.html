<script>
var allDischarge=[],filtered=[],masterPatients=[],selectedPatient=null,currentPage=1,pageSize=12;
function getToday(){var d=new Date();var tz=d.getTimezoneOffset()*60000;var local=new Date(Date.now()-tz);return local.toISOString().slice(0,10);}
function getDocsForShri(shri){return window._fb._docsCache[shri]||[];}
async function loadMaster(){masterPatients=[];var map={};function add(r){var shri=String(r.shri||r.shriId||'').trim().toUpperCase();var name=String(r.name||r.patientName||'').trim().toUpperCase();var pmjay=String(r.pmjay||r.pmjayId||'').trim().toUpperCase();if(!shri||map[shri])return;map[shri]={shri,name,pmjayId:pmjay};}try{if(typeof patientData!=='undefined'&&Array.isArray(patientData)){patientData.forEach(add);}}catch(e){}try{var snap=await window._fb.getDocs(window._fb.collection(window._fb.db,"patients"));snap.forEach(d=>add(d.data()));}catch(e){}Object.keys(map).forEach(k=>masterPatients.push(map[k]));}
async function loadDocsCache(){try{var snap=await window._fb.getDocs(window._fb.collection(window._fb.db,"patient_docs"));snap.forEach(d=>{var data=d.data();data._id=d.id;if(!window._fb._docsCache[data.shri])window._fb._docsCache[data.shri]=[];window._fb._docsCache[data.shri].push(data);});render();}catch(e){}}
async function loadAll(){try{var snap=await window._fb.getDocs(window._fb.collection(window._fb.db,'discharges'));allDischarge=[];snap.forEach(d=>{var o=d.data();o._id=d.id;allDischarge.push(o);});allDischarge.sort((a,b)=>{var da=a.date||'';var db=b.date||'';if(da!==db)return db.localeCompare(da);return new Date(b.dischargedAt||0)-new Date(a.dischargedAt||0);});applyFilter();}catch(e){document.getElementById('tbody').innerHTML='<tr><td colspan="9">ERROR '+e.message+'</td></tr>';}}
function applyFilter(){
var date=document.getElementById('fDate').value;
var time=document.getElementById('fTime').value;
var block=document.getElementById('fBlock').value;
var search=document.getElementById('fSearch').value.toLowerCase().trim();
pageSize=parseInt(document.getElementById('perPage').value)||12;
filtered=allDischarge.filter(p=>{
if(date && p.date!==date) return false;
if(time && (p.time||'')!==time) return false;
if(block && (p.block||'').toUpperCase()!==block.toUpperCase()) return false;
if(search){var s=(p.patientName||p.name||'')+" "+(p.shriId||p.shri||'')+" "+(p.pmjayCmhtId||'');if(s.toLowerCase().indexOf(search)===-1) return false;}
return true;
});
currentPage=1;render();
}
function render(){
var tbody=document.getElementById('tbody');tbody.innerHTML='';
var tp=Math.max(1,Math.ceil(filtered.length/pageSize));if(currentPage>tp)currentPage=tp;var start=(currentPage-1)*pageSize;var page=filtered.slice(start,start+pageSize);
document.getElementById('badgeD').innerText="Discharged - "+filtered.length + (document.getElementById('fDate').value ? " ("+document.getElementById('fDate').value+")" : " (ALL DATES)");
document.getElementById('pageInfo').innerText="Page "+currentPage+" of "+tp;
if(page.length===0){tbody.innerHTML='<tr><td colspan="9" style="padding:20px;text-align:center">NO DATA - Click ALL</td></tr>';return;}
page.forEach((p,i)=>{
var shriVal=p.shriId||p.shri||'';var nameVal=p.patientName||p.name||'';var pmjayShow=p.pmjayCmhtId||p.pmjayId||'';var docs=getDocsForShri(shriVal);var cleanShri=shriVal.replace(/[^a-zA-Z0-9]/g,'_');
var hasSummary=docs.some(d=>d.type==='discharge_summary');
var hasPhoto=docs.some(d=>d.type==='discharge_photo');
var hasFeedback=docs.some(d=>d.type==='feedback_form');
var tr=document.createElement('tr');
tr.innerHTML='<td>'+(start+i+1)+'</td><td class="nameCol">'+nameVal+'</td><td><span class="shriGray">'+shriVal+'</span></td><td><span class="pmjayBlue">'+pmjayShow+'</span></td><td style="font-size:10px">'+(p.date||'')+'</td><td>'+(p.time||'')+'</td><td>'+(p.block||'')+'</td>'
+'<td><div class="upload3">'
+'<button class="uploadBtn '+(hasSummary?'done':'')+'" onclick="triggerUpload(\''+cleanShri+'\',\'discharge_summary\')">'+(hasSummary?'✓ DISCHARGE SUMMARY':'DISCHARGE SUMMARY')+'</button>'
+'<button class="uploadBtn '+(hasPhoto?'done':'')+'" onclick="triggerUpload(\''+cleanShri+'\',\'discharge_photo\')">'+(hasPhoto?'✓ DISCHARGE PHOTO':'DISCHARGE PHOTO')+'</button>'
+'<button class="uploadBtn '+(hasFeedback?'done':'')+'" onclick="triggerUpload(\''+cleanShri+'\',\'feedback_form\')">'+(hasFeedback?'✓ FEEDBACK FORM':'FEEDBACK FORM')+'</button>'
+'</div>'
+'<input type="file" id="file_'+cleanShri+'_discharge_summary" style="display:none" accept=".pdf,.jpg,.jpeg,.png" onchange="uploadFile(this.files[0],\''+shriVal+'\',\''+nameVal.replace(/'/g,"\\'")+'\',\''+pmjayShow+'\',\'discharge_summary\',this)">'
+'<input type="file" id="file_'+cleanShri+'_discharge_photo" style="display:none" accept=".jpg,.jpeg,.png,.pdf" onchange="uploadFile(this.files[0],\''+shriVal+'\',\''+nameVal.replace(/'/g,"\\'")+'\',\''+pmjayShow+'\',\'discharge_photo\',this)">'
+'<input type="file" id="file_'+cleanShri+'_feedback_form" style="display:none" accept=".pdf,.jpg,.jpeg,.png" onchange="uploadFile(this.files[0],\''+shriVal+'\',\''+nameVal.replace(/'/g,"\\'")+'\',\''+pmjayShow+'\',\'feedback_form\',this)">'
+'</td><td><button class="delBtn" onclick="delDischarge(\''+p._id+'\')">X</button></td>';
tbody.appendChild(tr);
});
}
function triggerUpload(cleanShri,type){var el=document.getElementById('file_'+cleanShri+'_'+type);if(el){el.value='';el.click();}}
async function uploadFile(file,shri,name,pmjay,type,inputEl){
try{
if(!file)return;
var cleanShri=shri.replace(/[^a-zA-Z0-9]/g,'_');
var base64=await new Promise((res,rej)=>{var r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej('Read failed');r.readAsDataURL(file);});
var id=cleanShri+'_'+type+'_'+Date.now();
var chunks=[];for(var i=0;i<base64.length;i+=window._fb.CHUNK_SIZE){chunks.push(base64.substring(i,i+window._fb.CHUNK_SIZE));}
await window._fb.setDoc(window._fb.doc(window._fb.db,'patient_docs',id),{type:type,shri:shri,cleanShri:cleanShri,patientName:name,ip:pmjay,fileName:file.name,fileType:file.type,size:file.size,chunkCount:chunks.length,createdAt:Date.now()});
for(var j=0;j<chunks.length;j++){await window._fb.setDoc(window._fb.doc(window._fb.db,'patient_docs',id,'chunks',String(j)),{index:j,data:chunks[j]});}
if(!window._fb._docsCache[shri])window._fb._docsCache[shri]=[];
window._fb._docsCache[shri].push({_id:id,type:type,shri:shri,fileName:file.name});
if(inputEl)inputEl.value='';
alert('✓ Uploaded: '+type);
render();
}catch(e){alert('Upload failed: '+(e.message||e));}
}
function changePage(d){var tp=Math.max(1,Math.ceil(filtered.length/pageSize));currentPage+=d;if(currentPage<1)currentPage=1;if(currentPage>tp)currentPage=tp;render();}
function clearFilters(){document.getElementById('fDate').value='';document.getElementById('fTime').value='';document.getElementById('fBlock').value='';document.getElementById('fSearch').value='';applyFilter();}
function clearDateFilter(){document.getElementById('fDate').value='';applyFilter();}
function changeDateBy(days){var input=document.getElementById('fDate');if(!input)return;var base=input.value?new Date(input.value):new Date();base.setDate(base.getDate()+days);var y=base.getFullYear();var m=String(base.getMonth()+1).padStart(2,'0');var d=String(base.getDate()).padStart(2,'0');input.value=y+'-'+m+'-'+d;applyFilter();}
function setupSearch(){
var sIn=document.getElementById('searchTotal');var sRes=document.getElementById('searchResults');
sIn.addEventListener('input',function(e){
var q=e.target.value.toLowerCase().trim();if(q.length<1){sRes.classList.remove('open');return;}
var f=masterPatients.filter(p=>(p.name+" "+p.shri+" "+p.pmjayId).toLowerCase().indexOf(q)!==-1).slice(0,20);
if(f.length===0){sRes.innerHTML='<div class="sItem">No patient</div>';sRes.classList.add('open');return;}
var h='';f.forEach(p=>{h+='<div class="sItem" onclick="openAddPanel(\''+p.shri+'\')"><div><div class="sName">'+p.name+'</div><div class="sMeta">SHRI: '+p.shri+' | PMJAY: '+p.pmjayId+'</div></div><div class="btn btnDark btnSmall">SELECT</div></div>';});
sRes.innerHTML=h;sRes.classList.add('open');
});
document.addEventListener('click',e=>{if(!e.target.closest('.searchBox')){sRes.classList.remove('open');}});
}
function openAddPanel(shri){var p=masterPatients.find(x=>x.shri===shri);if(!p)return;selectedPatient=p;document.getElementById('searchResults').classList.remove('open');document.getElementById('searchTotal').value='';document.getElementById('addPanelInfo').innerHTML='PATIENT: '+p.name+' | SHRI: '+p.shri+' | PMJAY: '+p.pmjayId;document.getElementById('addPanel').classList.add('open');}
function closeAddPanel(){document.getElementById('addPanel').classList.remove('open');selectedPatient=null;}
async function confirmAddDischarge(){var time=document.getElementById('addTimeSelect').value;var block=document.getElementById('addBlockSelect').value;if(!selectedPatient||!time||!block){alert('Select TIME and BLOCK');return;}var date=document.getElementById('fDate').value||getToday();var id=date+"_"+selectedPatient.shri+"_"+Date.now();try{await window._fb.setDoc(window._fb.doc(window._fb.db,'discharges',id),{date:date,shriId:selectedPatient.shri,shri:selectedPatient.shri,patientName:selectedPatient.name,name:selectedPatient.name,pmjayCmhtId:selectedPatient.pmjayId,pmjayId:selectedPatient.pmjayId,time:time,block:block,status:'DISCHARGE',dischargedAt:new Date().toISOString()});closeAddPanel();loadAll();}catch(e){alert(e.message);}}
async function delDischarge(id){if(!confirm('DELETE?'))return;try{await window._fb.deleteDoc(window._fb.doc(window._fb.db,'discharges',id));loadAll();}catch(e){alert(e.message);}}
window.addEventListener('load',function(){
