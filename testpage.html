<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui}
body{background:#f1f5f9;display:flex;min-height:100vh;overflow-x:hidden}
.whiteBar{position:fixed;left:0;top:0;bottom:0;width:270px;min-width:270px;height:100vh;background:#0f172a;color:#94a3b8;display:flex;flex-direction:column;justify-content:space-between;z-index:90;overflow:hidden;transition:width .32s ease, transform .32s ease}
.whiteBar.folded{width:72px!important;min-width:72px!important}
.mainWrap{flex:1;margin-left:270px;transition:margin-left .32s ease;min-height:100vh;display:flex;flex-direction:column;background:#eef2ff;width:calc(100% - 270px)}
.whiteBar.folded ~ .mainWrap{margin-left:72px!important;width:calc(100% - 72px)}
.sHead{padding:16px 12px;display:flex;align-items:center;gap:12px;background:#fff!important;border-bottom:1px solid #e2e8f0;flex-shrink:0;overflow:hidden}
.sLogo{width:42px;min-width:42px;height:42px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0;border:1px solid #e2e8f0}
.sLogo img{width:100%;height:100%;object-fit:contain;display:block}
.sTitle b{color:#0f172a;font-size:16px;font-weight:900;display:block;line-height:1}
.sTitle span{font-size:9px;color:#64748b;text-transform:uppercase;font-weight:700;display:block;margin-top:2px}
.whiteBar.folded .sTitle{display:none}
.whiteBar.folded .sHead{justify-content:center;padding:14px 0}
.sMenu{flex:1;padding:8px 8px;overflow-y:auto}
.sMenu::-webkit-scrollbar{width:0}
.sMenu a{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:12px;text-decoration:none;color:#94a3b8;font-size:13px;font-weight:500;margin-bottom:2px;white-space:nowrap;overflow:hidden;transition:.22s}
.sMenu a:hover{background:#1e293b;color:#fff;transform:translateX(3px)}
.sMenu a.active{background:#1e293b;color:#fff;font-weight:600;box-shadow:inset 0 0 0 1px #334155}
.mi{width:36px;min-width:36px;height:36px;display:grid;place-items:center;background:#1e293b;border-radius:10px;flex-shrink:0}
.mi svg{width:18px;height:18px;stroke:#94a3b8;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sMenu a.active .mi{background:#2563eb}
.sMenu a.active .mi svg{stroke:#fff}
.ml{overflow:hidden;text-overflow:ellipsis}
.whiteBar.folded .ml{display:none}
.whiteBar.folded .sMenu a{justify-content:center;padding:12px 0}
.sFoot{padding:12px;border-top:1px solid #1e293b;font-size:10px;color:#64748b}
.whiteBar.folded .sFoot{display:none}
.top{height:68px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;color:#0f172a}
.menuBtnTop{width:40px;height:36px;background:transparent!important;border:none!important;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.menuBtnTop span{display:block;width:20px;height:2.5px;background:#0f172a;border-radius:2px}
.badgeBlue{background:#1a56db;color:#fff;padding:6px 12px;border-radius:20px;font-weight:900;font-size:11px;border:1px solid #1a56db}
.content{flex:1;padding:20px 24px;background-color:#f8fafc;background-image: radial-gradient(circle at 1px 1px, rgba(37,99,235,0.08) 1px, transparent 0);background-size:22px 22px;max-width:100%}
.filterBox{background:#fff;border:1.5px solid #e2e8f0;border-radius:14px;padding:16px;margin:14px 0;display:flex;flex-direction:column;gap:12px}
.filterRow1{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filterRow1 select{padding:10px 12px;border-radius:8px;border:1.5px solid #cbd5e1;font-weight:700;font-size:13px;background:#fff;outline:0}
.filterRow2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid #f1f5f9;padding-top:12px}
.searchInput{flex:1;min-width:220px;max-width:400px;padding:10px 14px;border-radius:20px;border:1.5px solid #1a56db;background:#f0f7ff;font-weight:600;font-size:12px;outline:0}
.btnBlue{background:#1a56db;color:#fff;border:0;padding:10px 16px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer}
.btnExp{background:#0a1931;color:#fff;border:0;padding:10px 14px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer}
.viewIcons{display:flex;gap:6px;margin-left:auto;align-items:center}
.btnViewIcon{width:34px;height:34px;border-radius:8px;border:1.5px solid #cbd5e1;background:#fff;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.btnViewIcon.active{background:#0f172a;border-color:#0f172a}
.btnViewIcon.active svg{stroke:#fff}
.btnViewIcon svg{width:16px;height:16px;stroke:#0f172a;stroke-width:2;fill:none}
.tableWrap{background:#fff;border:1.5px solid #e2e8f0;border-radius:14px;overflow:visible;margin-top:12px;position:relative;min-height:520px}
table{width:100%;border-collapse:collapse;min-width:900px;position:relative;z-index:2}
th{padding:14px 12px;font-size:12px;color:#64748b;background:#f8fafc;text-align:left;font-weight:800;text-transform:uppercase;position:relative;z-index:2;white-space:nowrap}
td{padding:14px 12px;font-size:13px;border-bottom:1px solid #f1f5f9;position:relative;z-index:2;white-space:nowrap;overflow:visible!important}
.sl{background:#dbeafe;width:36px;height:28px;display:grid;place-items:center;border-radius:6px;font-weight:800;color:#1e40af}
.shri{background:#1a56db;color:#fff;padding:4px 10px;border-radius:6px;font-weight:700;font-size:12px;white-space:nowrap!important;display:inline-block}
.gridWrap{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:12px;position:relative;min-height:520px;background:#fff;border:1.5px solid #e2e8f0;border-radius:14px;padding:12px}
.gridCard{background:#fff;border:1.5px solid #e2e8f0;border-radius:14px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;text-align:center;position:relative;z-index:2;overflow:visible}
.iconOnly{width:56px;height:56px;border-radius:14px;background:#dbeafe;display:grid;place-items:center}
.iconOnly svg{width:28px;height:28px;stroke:#1a56db;stroke-width:1.8;fill:none}

.hidden{display:none!important}
.pageBar{background:#fff;border:1.5px solid #e2e8f0;border-radius:14px;padding:12px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:12px}
.pageBtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pageBtns button{padding:8px 12px;border-radius:8px;border:1.5px solid #cbd5e1;background:#fff;font-weight:800;cursor:pointer}
.pageBtns button.active{background:#0a1931;color:#fff;border-color:#0a1931}
.tableWrap .tableWatermark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:420px;max-width:70%;z-index:1!important;pointer-events:none!important;opacity:0.28}
.tableWrap .tableWatermark img{width:100%;height:auto;display:block}
.gridWrap .tableWatermark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:420px;max-width:70%;z-index:10!important;pointer-events:none!important;opacity:0.35}
.gridWrap .tableWatermark img{width:100%;height:auto;display:block}

/* === SLIDE FROM BUTTON - VISIBLE FIX === */
.kftCell{position:relative;display:inline-flex;align-items:center;overflow:visible!important}
.badgeRecv{background:#dcfce7;color:#166534;border-radius:20px;font-weight:800;font-size:11px;cursor:pointer;border:1px solid #bbf7d0;display:inline-flex!important;align-items:center;justify-content:center;white-space:nowrap!important;min-width:110px;height:30px;padding:0 14px;gap:4px;line-height:1;position:relative;z-index:2;transition:.18s}
.badgeNot{background:#fee2e2;color:#991b1b;border-radius:20px;font-weight:800;font-size:11px;cursor:pointer;border:1px solid #fecaca;display:inline-flex!important;align-items:center;justify-content:center;white-space:nowrap!important;min-width:128px;height:30px;padding:0 14px;gap:4px;line-height:1;position:relative;z-index:2;transition:.18s}
.kftSlide{position:absolute;left:0;top:0;height:32px;background:#0f172a;border-radius:20px;display:flex;align-items:center;overflow:hidden;width:0;opacity:0;pointer-events:none;transition:width .32s cubic-bezier(.34,1.56,.64,1), opacity .2s ease;z-index:999;box-shadow:0 10px 24px rgba(0,0,0,0.35);border:1px solid #334155}
.kftSlide.show{width:220px!important;opacity:1;pointer-events:auto}
.kftSlide .q{color:#fff;font-size:10px;font-weight:700;padding-left:12px;white-space:nowrap;flex:1}
.kftSlide button{height:100%;border:0;font-weight:900;font-size:10px;cursor:pointer;padding:0 14px;white-space:nowrap;min-width:52px;flex-shrink:0}
.kftSlide .yes{background:#22c55e;color:#fff}
.kftSlide .no{background:#fff;color:#0f172a;border-left:1px solid #e2e8f0}
.kftSlide .yes:hover{background:#16a34a}
.gridCard .kftSlide{left:50%;transform:translateX(-50%);top:-2px}
.gridCard .kftSlide.show{width:190px!important;left:50%;transform:translateX(-50%)}
@media(max-width:900px){
  .whiteBar{transform:translateX(-100%);width:270px!important;min-width:270px!important}
  .whiteBar.mOpen{transform:translateX(0)}
  .mainWrap{margin-left:0!important;width:100%!important}
  .whiteBar.folded ~ .mainWrap{margin-left:0!important;width:100%!important}
  .content{padding:10px!important}
  .filterBox{padding:10px!important;gap:8px!important}
  .filterRow1{gap:6px!important}
  .filterRow1 select{font-size:10px!important;padding:6px 7px!important}
  .filterRow1 label{font-size:9px!important}
  .searchInput{font-size:10px!important;padding:7px 10px!important;min-width:140px!important}
  .btnBlue,.btnExp{font-size:9px!important;padding:6px 9px!important}
  .btnViewIcon{width:26px!important;height:26px!important}
  th{font-size:8px!important;padding:6px 4px!important}
  td{font-size:10px!important;padding:6px 4px!important}
  .sl{width:26px!important;height:20px!important;font-size:10px!important}
  .shri{font-size:9px!important;padding:3px 6px!important}
  .badgeRecv,.badgeNot{font-size:8px!important;min-width:78px!important;height:24px!important;padding:0 8px!important}
  .kftSlide{height:26px!important}
  .kftSlide.show{width:185px!important}
  .kftSlide .q{font-size:8px!important;padding-left:8px!important}
  .kftSlide button{font-size:8px!important;min-width:44px!important;padding:0 10px!important}
  .gridCard .kftSlide.show{width:160px!important}
  .gridCard{padding:8px!important;gap:5px!important}
  .iconOnly{width:36px!important;height:36px!important}
  .iconOnly svg{width:18px!important;height:18px!important}
  .gridCard b{font-size:10px!important}
}
@media(max-width:600px){
  .top{height:52px!important;padding:0 8px!important}
  .logo{font-size:12px!important}
  .content{padding:8px!important}
  .tableWrap,.gridWrap{min-height:380px!important}
  th{font-size:7px!important}
  td{font-size:9px!important}
  .badgeRecv,.badgeNot{font-size:7px!important;min-width:72px!important;height:22px!important}
  .kftSlide{height:24px!important}
  .kftSlide.show{width:165px!important}
  .gridCard .kftSlide.show{width:148px!important}
}
</style>
</head>

document.addEventListener('DOMContentLoaded',function(){ document.getElementById('menuBtnTop').addEventListener('click',function(e){e.preventDefault();toggleWhiteBar();}); });
let viewMode='list';
window.setView=(mode)=>{viewMode=mode;document.getElementById('btnList').classList.toggle('active', mode==='list');document.getElementById('btnGrid').classList.toggle('active', mode==='grid');document.getElementById('tableWrap').classList.toggle('hidden', mode==='grid');document.getElementById('gridWrap').classList.toggle('hidden', mode==='list');if(mode==='grid'){ let sel=document.getElementById('pageSizeSel'); if(sel.value!=='12'){ sel.value='12'; pageSize=12; currentPage=1; } } renderTable();};

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, query, where, serverTimestamp, setDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app = initializeApp(firebaseConfig,"kftMain_"+Math.random());
const db = getFirestore(app);
let yearSel=document.getElementById('yearSel'),now=new Date();
for(let y=now.getFullYear()-2;y<=now.getFullYear()+1;y++){let o=document.createElement('option');o.value=y;o.textContent=y;if(y===now.getFullYear())o.selected=true;yearSel.appendChild(o);}
document.getElementById('monthSel').value=now.getMonth();
let patients=[];let currentPage=1;let pageSize=12;let selDate='1';let firebaseStatusMap={};
let openSlideId=null;

async function loadMasterPatients(){
  try{
    const snap = await getDocs(collection(db,"patients"));
    let fbPatients=[];snap.forEach(d=>{let p=d.data();if(p.deleted) return;fbPatients.push({patientName:p.patientName||p.name||'',shriId:p.shriId||p.shri||'',pmjayId:p.pmjayId||p.PMJAY||'',contactNo:p.contactNo||p.contact||'',address:p.address||''});});
    fbPatients.sort((a,b)=>(a.patientName||'').localeCompare(b.patientName||''));patients=fbPatients;loadFromFirebase();
  }catch(e){ console.error(e); }
}
function getFiltered(){let searchQ=document.getElementById('searchAdded').value.toLowerCase().trim();if(!searchQ) return patients;return patients.filter(p=> (p.patientName||'').toLowerCase().includes(searchQ)|| (p.shriId||'').toLowerCase().includes(searchQ));}
function renderPageBtns(total, totalPages){
  let wrap=document.getElementById('pageBtns');let info=document.getElementById('pageInfo');
  if(totalPages<=1){ wrap.innerHTML=''; info.textContent = total>0 ? `Showing 1 - ${total} of ${total} patients` : ''; return; }
  let start=(currentPage-1)*pageSize+1; let end=Math.min(currentPage*pageSize, total);
  info.textContent=`Showing ${start} - ${end} of ${total} patients | Page ${currentPage} of ${totalPages}`;
  let html=`<button onclick="goToPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹ Prev</button>`;
  let s=Math.max(1, currentPage-2); let e=Math.min(totalPages, s+4); if(e-s<4) s=Math.max(1, e-4);
  for(let i=s;i<=e;i++){ html+=`<button onclick="goToPage(${i})" class="${i===currentPage?'active':''}">${i}</button>`; }
  html+=`<button onclick="goToPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>Next ›</button>`; wrap.innerHTML=html;
}
window.goToPage=(p)=>{ let filtered=getFiltered(); let totalPages = Math.max(1, Math.ceil(filtered.length/pageSize)); if(p<1) p=1; if(p>totalPages) p=totalPages; currentPage=p; renderTable(); };
window.changePageSize=()=>{ let v=document.getElementById('pageSizeSel').value; pageSize = parseInt(v); currentPage=1; renderTable(); };
window.resetPageAndLoad=()=>{ currentPage=1; renderTable(); };
window.setDate=(d)=>{ selDate=d; loadFromFirebase(); };
window.loadFromFirebase=async()=>{
 let y=document.getElementById('yearSel').value,m=document.getElementById('monthSel').value;
 try{
  let q=query(collection(db,"kft_reports"), where("year","==",String(y)), where("month","==",String(m)), where("day","==",String(selDate)));
  let snap=await getDocs(q);firebaseStatusMap={};snap.forEach(d=>{let data=d.data();firebaseStatusMap[data.shriId]=data.statusBool;});currentPage=1; renderTable();
 }catch(e){ firebaseStatusMap={}; renderTable(); }
};
function closeAllSlides(){ document.querySelectorAll('.kftSlide.show').forEach(el=>el.classList.remove('show')); openSlideId=null; }
document.addEventListener('click',(e)=>{ if(!e.target.closest('.kftCell')) closeAllSlides(); });
window.toggleSlide=(shri, id)=>{
  let el=document.getElementById(id);
  if(!el) return;
  let isOpen=el.classList.contains('show');
  closeAllSlides();
  if(!isOpen){ el.classList.add('show'); openSlideId=id; }
};
window.confirmYes=async(shri, pname)=>{
  closeAllSlides();
  let y=document.getElementById('yearSel').value,m=document.getElementById('monthSel').value;
  let cur=firebaseStatusMap[shri]||false; let newVal=!cur;
  firebaseStatusMap[shri]=newVal; renderTable();
  try{ const docId = `${y}_${m}_${selDate}_${shri}`.replace(/[^a-zA-Z0-9_]/g,'_'); await setDoc(doc(db, "kft_reports", docId), {year: String(y), month: String(m), day: String(selDate), shriId: shri, patientName: pname||shri, status: newVal? "Submitted":"Not-yet", statusBool: newVal, createdAt: serverTimestamp(), localTime: new Date().toLocaleString()});}catch(e){}
};
window.confirmNo=()=>{ closeAllSlides(); };
function renderTable(){
 let filtered=getFiltered();let totalPages=Math.max(1,Math.ceil(filtered.length/pageSize));if(currentPage>totalPages)currentPage=totalPages;
 let pageItems=filtered.slice((currentPage-1)*pageSize,currentPage*pageSize);let startIndex=(currentPage-1)*pageSize;
 let y=document.getElementById('yearSel').value,m=document.getElementById('monthSel').value;
 let dateKey=`${y}-${String(parseInt(m)+1).padStart(2,'0')}-${selDate}`;
 let html='<tr><th>SL No</th><th>Patient Name</th><th>SHRI ID</th><th>Contact</th><th>KFT Status</th><th>Date</th></tr>';
 let gridHtml='<div class="tableWatermark"><img src="loko.png" alt="SHIJA Logo"></div>';
 for(let i=0;i<pageItems.length;i++){
  let p=pageItems[i];let cur=firebaseStatusMap[p.shriId]||false;
  let safeShri=(p.shriId||'').replace(/'/g,"\\'");
  let safeName=(p.patientName||'').replace(/'/g,"\\'");
  let slideId=`slide_${startIndex+i}`;
  let gridSlideId=`gslide_${startIndex+i}`;
  let badge=cur?
    `<div class="kftCell"><span class="badgeRecv" onclick="event.stopPropagation();toggleSlide('${safeShri}','${slideId}')">RECEIVED ✓</span><div class="kftSlide" id="${slideId}"><span class="q">Mark NOT-RECEIVED?</span><button class="yes" onclick="event.stopPropagation();confirmYes('${safeShri}','${safeName}')">YES</button><button class="no" onclick="event.stopPropagation();confirmNo()">NO</button></div></div>`
    :
    `<div class="kftCell"><span class="badgeNot" onclick="event.stopPropagation();toggleSlide('${safeShri}','${slideId}')">NOT-RECEIVED ✗</span><div class="kftSlide" id="${slideId}"><span class="q">Mark RECEIVED?</span><button class="yes" onclick="event.stopPropagation();confirmYes('${safeShri}','${safeName}')">YES</button><button class="no" onclick="event.stopPropagation();confirmNo()">NO</button></div></div>`;
  html+=`<tr><td><div class="sl">${startIndex+i+1}</div></td><td><b>${p.patientName}</b></td><td><span class="shri">${p.shriId||''}</span></td><td>${p.contactNo||'-'}</td><td>${badge}</td><td>${dateKey}</td></tr>`;
  let iconColor=cur?'#10b981':'#ef4444'; let bgColor=cur?'#dcfce7':'#fee2e2';
  let gridBadge=cur?
    `<div class="kftCell"><span class="badgeRecv" onclick="event.stopPropagation();toggleSlide('${safeShri}','${gridSlideId}')">RECEIVED ✓</span><div class="kftSlide" id="${gridSlideId}"><span class="q">NOT-RECEIVED?</span><button class="yes" onclick="event.stopPropagation();confirmYes('${safeShri}','${safeName}')">YES</button><button class="no" onclick="event.stopPropagation();confirmNo()">NO</button></div></div>`
    :
    `<div class="kftCell"><span class="badgeNot" onclick="event.stopPropagation();toggleSlide('${safeShri}','${gridSlideId}')">NOT-RECEIVED ✗</span><div class="kftSlide" id="${gridSlideId}"><span class="q">RECEIVED?</span><button class="yes" onclick="event.stopPropagation();confirmYes('${safeShri}','${safeName}')">YES</button><button class="no" onclick="event.stopPropagation();confirmNo()">NO</button></div></div>`;
  gridHtml+=`<div class="gridCard"><div class="iconOnly" style="background:${bgColor}"><svg viewBox="0 0 24 24" style="stroke:${iconColor}"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><b>${p.patientName||'No Name'}</b><span class="shriSmall">${p.shriId||''}</span><div>${gridBadge}</div></div>`;
 }
 if(filtered.length===0) html+=`<tr><td colspan="6" style="text-align:center;padding:20px">No patient found</td></tr>`;
 document.getElementById('tbl').innerHTML=html;
 document.getElementById('gridWrap').innerHTML=gridHtml;
 renderPageBtns(filtered.length, totalPages);
}
window.renderTable=renderTable;
window.exportExcel=()=>{
  let y=document.getElementById('yearSel').value,m=document.getElementById('monthSel').value;
  let months=["January","February","March","April","May","June","July","August","September","October","November","December"];
  let dateKey=`${months[m]}_${selDate}_${y}`;let filtered=getFiltered();
  let rows=filtered.map((p,i)=>{let cur=firebaseStatusMap[p.shriId]||false;return {SL:i+1,Name:p.patientName,SHRI_ID:p.shriId,Contact:p.contactNo||'',KFT_Status:cur?'Received':'Not-Received',Date:dateKey};});
  let ws=XLSX.utils.json_to_sheet(rows);let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"KFT "+dateKey);XLSX.writeFile(wb,`KFT_${dateKey}.xlsx`);
};

document.getElementById('adminPassInput')?.addEventListener('keydown',(e)=>{ if(e.key==='Enter') document.getElementById('confirmLogoutAll').click(); });
loadMasterPatients();
