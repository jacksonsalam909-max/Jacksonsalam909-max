<div id="fileModal"><div class="popupCard"><div class="popupHead"><b id="modalFileName">FILE</b><div class="headRight"><button class="iconTop" onclick="zoomIn()">+</button><button class="iconTop" onclick="zoomOut()">−</button><button class="iconTop" onclick="downloadCurrent()">⬇</button><button class="iconTop" onclick="closeModal()">✕</button></div></div><div class="zoomBar"><span id="modalFileMeta">IMAGE</span><div style="display:flex;gap:4px;align-items:center"><button class="zoomBtn" onclick="zoomOut()">−</button><div class="zoomLabel" id="zoomLabel">100%</div><button class="zoomBtn" onclick="zoomIn()">+</button><button class="zoomBtn" onclick="resetZoom()">⟲</button></div></div><div class="popupBody"><div class="paperBox" id="paperBox"></div></div></div></div>
<script>
var allDischarge=[],filtered=[],masterPatients=[],selectedPatient=null,currentPage=1,pageSize=12,isGrid=false,openGridSet=new Set(),lastOpenCleanShri=null,currentFileData=null,currentFileName=null;
const CHUNK_SIZE=800000;
function getToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0')+"-"+String(d.getDate()).padStart(2,'0');}
function setView(mode){isGrid=(mode==='grid');document.getElementById('tableWrap').style.display=isGrid?'none':'block';document.getElementById('gridWrap').style.display=isGrid?'grid':'none';document.getElementById('btnList').classList.toggle('active',!isGrid);document.getElementById('btnGrid').classList.toggle('active',isGrid);currentPage=1;render();}
function getDocsForShri(shri){return window._fb._docsCache[shri]||[];}
async function loadMasterFAST(){masterPatients=[];var map={};function addToMap(raw){var shri=String(raw.shri||raw.shriId||'').trim().toUpperCase();var name=String(raw.name||raw.patientName||'').trim().toUpperCase();var pmjay=String(raw.pmjay||raw.pmjayId||'').trim().toUpperCase();if(!shri||map[shri])return false;map[shri]={shri:shri,name:name||'UNKNOWN',pmjayId:pmjay};return true;}try{if(typeof patientData!=='undefined'&&Array.isArray(patientData)){patientData.forEach(r=>addToMap(r));}}catch(e){}Object.keys(map).forEach(k=>masterPatients.push(map[k]));try{localStorage.setItem('shija_pat_cache_v2',JSON.stringify(masterPatients));}catch(e){}}
async function loadAllFAST(){try{if(!window._fb){setTimeout(loadAllFAST,300);return;}var snap=await window._fb.getDocs(window._fb.collection(window._fb.db,'discharges'));allDischarge=[];snap.forEach(d=>{var o=d.data();o._id=d.id;if(o.claimId&&String(o.claimId).trim()!=='')return;allDischarge.push(o);});allDischarge.sort((a,b)=>new Date(b.dischargedAt||0)-new Date(a.dischargedAt||0));}catch(e){}applyFilter();}
function applyFilter(){var date=document.getElementById('fDate').value;var time=document.getElementById('fTime').value;var block=document.getElementById('fBlock').value;var search=document.getElementById('fSearch').value.toLowerCase().trim();pageSize=parseInt(document.getElementById('perPage').value)||12;filtered=allDischarge.filter(function(p){if(date&&p.date!==date)return false;if(time&&(p.time||'')!==time)return false;if(block&&(p.block||'').toUpperCase()!==block.toUpperCase())return false;if(search){var s=(p.patientName||p.name||'')+" "+(p.shriId||p.shri||'')+" "+(p.pmjayCmhtId||'');if(s.toLowerCase().indexOf(search)===-1)return false;}return true;});currentPage=1;render();}
function render(){
var tbody=document.getElementById('tbody');var grid=document.getElementById('gridWrap');if(!tbody||!grid)return;
tbody.innerHTML='';grid.innerHTML='';
var totalPages=Math.max(1,Math.ceil(filtered.length/pageSize));if(currentPage>totalPages)currentPage=totalPages;
var start=(currentPage-1)*pageSize;var page=filtered.slice(start,start+pageSize);
document.getElementById('badgeD').innerText="Discharged - "+filtered.length;
document.getElementById('pageInfo').innerText="Page "+currentPage+" of "+totalPages;
document.getElementById('dateInfo').innerText=(document.getElementById('fTime').value||'ALL TIME')+" | "+(document.getElementById('fBlock').value||'ALL BLOCK');
if(page.length===0){tbody.innerHTML='<tr><td colspan="8" style="padding:20px;text-align:center">NO DISCHARGED</td></tr>';return;}
page.forEach(function(p,i){
var pmjayShow=p.pmjayCmhtId||p.pmjayId||'';var shriVal=p.shriId||p.shri||'';var nameVal=p.patientName||p.name||'';
var docs=getDocsForShri(shriVal);var mapCount={discharge_summary:0,discharge_photo:0,feedback_form:0};docs.forEach(function(d){if(mapCount.hasOwnProperty(d.type))mapCount[d.type]++;});
var totalUp=mapCount.discharge_summary+mapCount.discharge_photo+mapCount.feedback_form;
var cleanShri=shriVal.replace(/[^a-zA-Z0-9]/g,'_');
var tr=document.createElement('tr');tr.className='mainRow';tr.id='tr_'+cleanShri;
tr.innerHTML='<td>'+(start+i+1)+'</td><td class="nameCol" title="'+nameVal+'">'+nameVal+'</td><td><span class="shriGray">'+shriVal+'</span></td><td><span class="pmjayBlue">'+pmjayShow+'</span></td><td>'+(p.time||'')+'</td><td>'+(p.block||'')+'</td><td><button class="uploadBtnFold '+(totalUp>0?'done':'')+'" onclick="toggleSlideList(\''+cleanShri+'\',\''+shriVal+'\')">'+(totalUp>0?'✓ '+totalUp:'UPLOAD')+' '+(lastOpenCleanShri===cleanShri?'▲':'▼')+'</button></td><td class="actionTd"><div class="actionCell"><div class="claimWrap"><button class="claimBtn" onclick="openClaimInline(\''+p._id+'\')">Claim</button><div class="claimFold" id="fold-'+p._id+'"><input type="text" id="input-'+p._id+'" placeholder="CLAIM ID" oninput="checkClaimInput(\''+p._id+'\')"><button class="addClaimBtn" id="addBtn-'+p._id+'" onclick="saveClaimInline(\''+p._id+'\')" disabled>→</button></div><button class="delBtn" onclick="delDischarge(\''+p._id+'\')">X</button></div></div></td>';
tbody.appendChild(tr);
var slideTr=document.createElement('tr');slideTr.className='slideRow';slideTr.id='slide_'+cleanShri;
slideTr.innerHTML='<td colspan="8" class="slideCell"><div class="slideInner"><div class="horizontalBtns"><div class="cardWrap"><div class="hCard summary '+(mapCount.discharge_summary?'done':'')+'" onclick="triggerUpload(\''+cleanShri+'\',\'discharge_summary\',\''+shriVal+'\')"><b>SUMMARY</b><div class="sub">'+(mapCount.discharge_summary?'✓':'Drop')+'</div></div>'+(mapCount.discharge_summary?'<div class="delNextToCard" onclick="deleteSpecific(\''+shriVal+'\',\'discharge_summary\')">X</div>':'')+'</div><div class="cardWrap"><div class="hCard photo '+(mapCount.discharge_photo?'done':'')+'" onclick="triggerUpload(\''+cleanShri+'\',\'discharge_photo\',\''+shriVal+'\')"><b>PHOTO</b><div class="sub">'+(mapCount.discharge_photo?'✓':'Drop')+'</div></div>'+(mapCount.discharge_photo?'<div class="delNextToCard" onclick="deleteSpecific(\''+shriVal+'\',\'discharge_photo\')">X</div>':'')+'</div><div class="cardWrap"><div class="hCard feedback '+(mapCount.feedback_form?'done':'')+'" onclick="triggerUpload(\''+cleanShri+'\',\'feedback_form\',\''+shriVal+'\')"><b>FEEDBACK</b><div class="sub">'+(mapCount.feedback_form?'✓':'Drop')+'</div></div>'+(mapCount.feedback_form?'<div class="delNextToCard" onclick="deleteSpecific(\''+shriVal+'\',\'feedback_form\')">X</div>':'')+'</div></div><input type="file" id="file_'+cleanShri+'_discharge_summary" style="display:none" onchange="uploadFile(this.files[0],\''+shriVal+'\',\''+nameVal.replace(/\'/g,"\\'")+'\',\''+pmjayShow+'\',\'discharge_summary\')"><input type="file" id="file_'+cleanShri+'_discharge_photo" style="display:none" onchange="uploadFile(this.files[0],\''+shriVal+'\',\''+nameVal.replace(/\'/g,"\\'")+'\',\''+pmjayShow+'\',\'discharge_photo\')"><input type="file" id="file_'+cleanShri+'_feedback_form" style="display:none" onchange="uploadFile(this.files[0],\''+shriVal+'\',\''+nameVal.replace(/\'/g,"\\'")+'\',\''+pmjayShow+'\',\'feedback_form\')"></div></td>';
tbody.appendChild(slideTr);
});
if(lastOpenCleanShri){var s=document.getElementById('slide_'+lastOpenCleanShri);var r=document.getElementById('tr_'+lastOpenCleanShri);if(s)s.classList.add('show');if(r)r.classList.add('openRow');}
}
function checkClaimInput(id){var inp=document.getElementById('input-'+id);var btn=document.getElementById('addBtn-'+id);if(!inp||!btn)return;btn.disabled=inp.value.trim().length===0;}
function changePage(d){var tp=Math.max(1,Math.ceil(filtered.length/pageSize));currentPage+=d;if(currentPage<1)currentPage=1;if(currentPage>tp)currentPage=tp;render();}
function clearFilters(){document.getElementById('fTime').value='';document.getElementById('fBlock').value='';document.getElementById('fSearch').value='';applyFilter();}
function setupSearch(){
var searchTotal=document.getElementById('searchTotal');var searchResults=document.getElementById('searchResults');
searchTotal.addEventListener('input',function(e){
var q=e.target.value.toLowerCase().trim();if(q.length<1){searchResults.classList.remove('open');return;}
var filteredSearch=masterPatients.filter(function(p){var combined=(p.name+" "+p.shri+" "+p.pmjayId).toLowerCase();return combined.indexOf(q)!==-1;}).slice(0,20);
if(filteredSearch.length===0){searchResults.innerHTML='<div class="sItem"><div><div class="sName">No patient</div></div></div>';searchResults.classList.add('open');return;}
var html='';filteredSearch.forEach(function(p){html+='<div class="sItem" onclick="openAddPanel(\''+p.shri+'\')"><div><div class="sName">'+p.name+'</div><div class="sMeta">SHRI: '+p.shri+' | PMJAY: '+p.pmjayId+'</div></div><div class="btn btnDark btnSmall">SELECT</div></div>';});
searchResults.innerHTML=html;searchResults.classList.add('open');
});
document.addEventListener('click',function(e){
if(!e.target.closest('.searchBox')){document.getElementById('searchResults').classList.remove('open');}
if(!e.target.closest('.claimWrap')){document.querySelectorAll('.claimFold').forEach(function(f){f.classList.remove('show');});var tw=document.getElementById('tableWrap');if(tw)tw.classList.remove('claimOpen');}
});
}
function openAddPanel(shri){var p=masterPatients.find(function(x){return x.shri===shri;});if(!p)return;selectedPatient=p;document.getElementById('searchResults').classList.remove('open');document.getElementById('searchTotal').value='';document.getElementById('addPanelInfo').innerHTML='PATIENT: '+p.name+' | SHRI: '+p.shri+' | PMJAY: '+p.pmjayId;document.getElementById('addTimeSelect').value='';document.getElementById('addBlockSelect').value='';document.getElementById('addPanel').classList.add('open');}
function closeAddPanel(){document.getElementById('addPanel').classList.remove('open');selectedPatient=null;}
async function confirmAddDischarge(){var time=document.getElementById('addTimeSelect').value;var block=document.getElementById('addBlockSelect').value;if(!selectedPatient||!time||!block){alert('Select TIME and BLOCK');return;}var date=document.getElementById('fDate').value||getToday();var docId=date+"_"+selectedPatient.shri+"_"+Date.now();try{await window._fb.setDoc(window._fb.doc(window._fb.db,'discharges',docId),{date:date,shriId:selectedPatient.shri,shri:selectedPatient.shri,patientName:selectedPatient.name,name:selectedPatient.name,pmjayCmhtId:selectedPatient.pmjayId,pmjayId:selectedPatient.pmjayId,time:time,block:block,status:'DISCHARGE',dischargedAt:new Date().toISOString()});closeAddPanel();loadAllFAST();}catch(e){alert(e.message);}}
async function delDischarge(id){if(!confirm('DELETE?'))return;try{await window._fb.deleteDoc(window._fb.doc(window._fb.db,'discharges',id));loadAllFAST();}catch(e){alert(e.message);}}
async function ensureDocsLoaded(shri){if(window._fb._docsCache[shri]&&window._fb._docsCache[shri].length>0)return window._fb._docsCache[shri];if(window._fb._docsLoaded)return getDocsForShri(shri);try{var snap=await window._fb.getDocs(window._fb.collection(window._fb.db,'patient_docs'));snap.forEach(d=>{var data=d.data();data._id=d.id;if(!window._fb._docsCache[data.shri])window._fb._docsCache[data.shri]=[];if(!window._fb._docsCache[data.shri].some(x=>x._id===data._id))window._fb._docsCache[data.shri].push(data);});window._fb._docsLoaded=true;}catch(e){}return getDocsForShri(shri);}
async function toggleSlideList(cleanShri,shri){var slide=document.getElementById('slide_'+cleanShri);var isShow=slide&&slide.classList.contains('show');document.querySelectorAll('.slideRow').forEach(r=>r.classList.remove('show'));document.querySelectorAll('.mainRow').forEach(r=>r.classList.remove('openRow'));if(!isShow){await ensureDocsLoaded(shri);if(slide)slide.classList.add('show');var row=document.getElementById('tr_'+cleanShri);if(row)row.classList.add('openRow');lastOpenCleanShri=cleanShri;render();}else{lastOpenCleanShri=null;}}
function triggerUpload(cleanShri,type,shri){var docs=getDocsForShri(shri).filter(d=>d.type===type);if(docs.length>0){openFileModal(docs[0]._id,shri);}else{document.getElementById('file_'+cleanShri+'_'+type).click();}}
async function uploadFile(file,shri,name,pmjay,type){if(!file)return;if(file.size>10*1024*1024){alert('Max 10MB');return;}var cleanShri=shri.replace(/[^a-zA-Z0-9]/g,'_');var base64=await new Promise(res=>{var r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(file);});var id=cleanShri+'_'+type+'_'+Date.now();try{var chunks=[];for(var i=0;i<base64.length;i+=CHUNK_SIZE){chunks.push(base64.substring(i,i+CHUNK_SIZE));}await window._fb.setDoc(window._fb.doc(window._fb.db,'patient_docs',id),{type:type,shri:shri,cleanShri:cleanShri,patientName:name,ip:pmjay,fileName:file.name,fileType:file.type||'application/octet-stream',size:file.size,chunkCount:chunks.length,createdAt:Date.now()});for(var j=0;j<chunks.length;j++){await window._fb.setDoc(window._fb.doc(window._fb.db,'patient_docs',id,'chunks',String(j)),{index:j,data:chunks[j]});}if(!window._fb._docsCache[shri])window._fb._docsCache[shri]=[];window._fb._docsCache[shri].push({_id:id,type:type,shri:shri,fileName:file.name,fileType:file.type,size:file.size});render();}catch(e){alert(e.message);}}
async function getFullData(id){try{var snap=await window._fb.getDocs(window._fb.collection(window._fb.db,'patient_docs',id,'chunks'));var arr=[];snap.forEach(d=>arr.push(d.data()));arr.sort((a,b)=>a.index-b.index);return arr.map(a=>a.data).join('');}catch(e){return null;}}
async function openFileModal(id,shri){window._fb._currentZoom=1;var snap=await window._fb.getDocs(window._fb.collection(window._fb.db,'patient_docs'));var meta=null;snap.forEach(d=>{if(d.id===id)meta=d.data();});if(!meta)return;var data=await getFullData(id);if(!data)return;currentFileData=data;currentFileName=meta.fileName;document.getElementById('modalFileName').textContent=meta.fileName;document.getElementById('modalFileMeta').textContent=(meta.fileType.includes('pdf')?'PDF':'IMAGE')+' • '+(meta.size/1024/1024).toFixed(2)+' MB';var box=document.getElementById('paperBox');if(data.startsWith('data:application/pdf')){box.innerHTML='<iframe src="'+data+'"></iframe>';}else if(data.startsWith('data:image')){box.innerHTML='<img src="'+data+'">';}else{box.innerHTML='<div style="padding:20px;text-align:center"><b>'+meta.fileName+'</b></div>';}applyZoom();document.getElementById('fileModal').classList.add('show');}
function downloadCurrent(){if(!currentFileData)return;var a=document.createElement('a');a.href=currentFileData;a.download=currentFileName||'file';a.click();}
function zoomIn(){window._fb._currentZoom=Math.min(window._fb._currentZoom+0.25,3);applyZoom();}
function zoomOut(){window._fb._currentZoom=Math.max(window._fb._currentZoom-0.25,0.5);applyZoom();}
function resetZoom(){window._fb._currentZoom=1;applyZoom();}
function applyZoom(){var box=document.getElementById('paperBox');if(box)box.style.transform='scale('+window._fb._currentZoom+')';document.getElementById('zoomLabel').textContent=Math.round(window._fb._currentZoom*100)+'%';}
function closeModal(){document.getElementById('fileModal').classList.remove('show');}
async function delDoc(id,shri){var csnap=await window._fb.getDocs(window._fb.collection(window._fb.db,'patient_docs',id,'chunks'));for(var d of csnap.docs){await window._fb.deleteDoc(window._fb.doc(window._fb.db,'patient_docs',id,'chunks',d.id));}await window._fb.deleteDoc(window._fb.doc(window._fb.db,'patient_docs',id));if(window._fb._docsCache[shri]){window._fb._docsCache[shri]=window._fb._docsCache[shri].filter(d=>d._id!==id);}render();}
async function deleteSpecific(shri,type){var docs=getDocsForShri(shri).filter(d=>d.type===type);if(docs.length===0)return;await delDoc(docs[0]._id,shri);}
function openClaimInline(id){
var fold=document.getElementById('fold-'+id);if(!fold)return;
var tw=document.getElementById('tableWrap');
var isShow=fold.classList.contains('show');
document.querySelectorAll('.claimFold').forEach(function(f){f.classList.remove('show');});
if(tw)tw.classList.remove('claimOpen');
if(!isShow){fold.classList.add('show');if(tw)tw.classList.add('claimOpen');setTimeout(function(){var inp=document.getElementById('input-'+id);if(inp){inp.focus();checkClaimInput(id);}},50);}
}
async function saveClaimInline(id){
var inp=document.getElementById('input-'+id);var btn=document.getElementById('addBtn-'+id);
var claimId=inp.value.trim().toUpperCase();if(!claimId||btn.disabled){inp.focus();return;}
var data=allDischarge.find(x=>x._id===id);if(!data)return;
try{btn.disabled=true;btn.textContent='...';await window._fb.setDoc(window._fb.doc(window._fb.db,'discharges',id),{claimId:claimId,claimedAt:new Date().toISOString()},{merge:true});await window._fb.setDoc(window._fb.doc(window._fb.db,'claims',id),{...data,claimId:claimId,claimedAt:new Date().toISOString(),patientName:data.patientName||data.name,shriId:data.shriId||data.shri,pmjayId:data.pmjayCmhtId||data.pmjayId},{merge:true});var tw=document.getElementById('tableWrap');if(tw)tw.classList.remove('claimOpen');document.getElementById('fold-'+id).classList.remove('show');loadAllFAST();location.href='claim.html?claimId='+encodeURIComponent(claimId);}catch(e){alert(e.message);btn.disabled=false;btn.textContent='→';}
}
</script>
<script>
window.addEventListener('load',function(){
var fDate=document.getElementById('fDate');if(fDate)fDate.value=getToday();
setupSearch();setView('list');
var cached=localStorage.getItem('shija_pat_cache_v2');
if(cached){try{masterPatients=JSON.parse(cached);}catch(e){}loadAllFAST();setTimeout(()=>{loadMasterFAST();},500);}else{loadMasterFAST().then(()=>{loadAllFAST();});}
document.getElementById('fTime').addEventListener('change',applyFilter);
document.getElementById('fBlock').addEventListener('change',applyFilter);
document.getElementById('perPage').addEventListener('change',applyFilter);
document.getElementById('fSearch').addEventListener('input',applyFilter);
if(fDate)fDate.addEventListener('change',applyFilter);
});
</script>
</body>
</html>
