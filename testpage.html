<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHIJA DISCHARGE - YELLOW > + RED X</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="Patient.js?v=YELLOW_RED"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui}
html,body{width:100%;overflow-x:hidden}
body{background:#f1f5f9;display:flex;min-height:100vh}
.whiteBar{position:fixed;left:0;top:0;bottom:0;width:270px;min-width:270px;height:100vh;background:#0f172a;color:#94a3b8;display:flex;flex-direction:column;justify-content:space-between;z-index:90;transition:.32s}
.whiteBar.folded{width:72px!important;min-width:72px!important}
.mainWrap{flex:1;margin-left:270px;transition:.32s;min-height:100vh;display:flex;flex-direction:column;background:#eef2ff;width:calc(100% - 270px);max-width:calc(100% - 270px);overflow-x:hidden}
.whiteBar.folded ~ .mainWrap{margin-left:72px!important;width:calc(100% - 72px)!important;max-width:calc(100% - 72px)!important}
.sHead{padding:18px 14px;display:flex;align-items:center;gap:12px;background:#fff!important;border-bottom:1px solid #e2e8f0}
.sLogo{width:46px;min-width:46px;height:46px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;border:1px solid #e2e8f0}
.sLogo img{width:100%;height:100%;object-fit:contain}
.sTitle b{color:#0f172a;font-size:18px;font-weight:900}
.sTitle span{font-size:11px;color:#64748b;text-transform:uppercase;font-weight:700}
.whiteBar.folded .sTitle{display:none}
.whiteBar.folded .sHead{justify-content:center}
.sMenu{flex:1;padding:8px;overflow-y:auto}
.sMenu a{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:12px;text-decoration:none;color:#94a3b8;font-size:13.5px;margin-bottom:2px;white-space:nowrap}
.sMenu a.active{background:#1e293b;color:#fff}
.mi{width:34px;min-width:34px;height:34px;display:grid;place-items:center;background:#1e293b;border-radius:8px}
.mi svg{width:18px;height:18px;stroke:#94a3b8;stroke-width:1.8;fill:none}
.sMenu a.active .mi{background:#3c25eb}
.sMenu a.active .mi svg{stroke:#fff}
.ml{overflow:hidden;text-overflow:ellipsis}
.whiteBar.folded .ml{display:none!important}
.whiteBar.folded .sMenu a{justify-content:center}
.sFoot{padding:12px;border-top:1px solid #1e293b;font-size:11px;color:#64748b;text-align:center}
.whiteBar.folded .sFoot span{display:none}
.top{height:72px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:20;width:100%;max-width:100%}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;color:#0f172a;flex-wrap:wrap}
.menuBtnTop{width:40px;min-width:40px;height:36px;background:transparent;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.menuBtnTop span{width:22px;height:2.6px;background:#0f172a;display:block;border-radius:2px}
.badgeBlue{background:#f59e0b;color:#000;padding:6px 12px;border-radius:20px;font-weight:900;font-size:12px;border:1px solid #f59e0b;white-space:nowrap}
.content{flex:1;padding:16px;width:100%;max-width:100%;overflow-x:hidden}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;border:1.5px solid #e2e8f0;width:100%;max-width:100%;overflow:hidden}
.label{font-size:11px;font-weight:900;color:#475569;margin-bottom:6px;text-transform:uppercase}
.btn{padding:10px 16px;border:0;border-radius:9px;font-weight:800;font-size:13px;cursor:pointer}
.btnDark{background:#3c25eb!important;color:#fff!important}
.btnSmall{padding:8px 12px!important;font-size:12px!important}
.input{padding:11px 14px;border:1.5px solid #cbd5e1;border-radius:9px;font-weight:700;font-size:14px;background:#fff;width:100%;outline:0;max-width:100%}
.inputSmall{padding:9px 12px!important;font-size:13px!important;height:36px!important}
.shriGray{background:#eef2ff;color:#3c25eb;padding:4px 8px;border-radius:6px;font-weight:800;font-size:11px;display:inline-block;border:1px solid #c7d2fe;max-width:90px;overflow:hidden;text-overflow:ellipsis}
.pmjayBlue{background:#f1f5f9;color:#334155;padding:4px 8px;border-radius:6px;font-weight:800;font-size:11px;display:inline-block;border:1px solid #e2e8f0;max-width:90px;overflow:hidden;text-overflow:ellipsis}
.sheetWrap{background:#fff;border:1.5px solid #e2e8f0;overflow:auto;border-radius:14px;width:100%;max-width:100%}
table{border-collapse:collapse;width:100%;table-layout:auto;min-width:0}
th{position:sticky;top:0;background:#0f172a;color:#fff;padding:10px 6px;font-size:11px;text-align:center;font-weight:800;white-space:nowrap}
td{border-bottom:1px solid #e2e8f0;padding:8px 5px;height:50px;font-size:12px;font-weight:700;text-align:center;text-transform:uppercase;background:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
td.nameCol{text-align:left;padding-left:8px;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
tr.mainRow:hover td{background:#fffbeb!important}
.dateArrowBtn{width:32px;height:32px;border-radius:8px;border:1.5px solid #e2e8f0;background:#fff;font-weight:900;cursor:pointer;display:grid;place-items:center}
.dateNavWrap{display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid #e2e8f0;border-radius:10px;padding:3px 6px;flex-wrap:wrap}
#fDate{width:125px;border:none!important;font-weight:800;text-align:center;font-size:13px}
.badge{background:#0f172a;color:#fff;padding:6px 10px;border-radius:20px;font-weight:900;font-size:11px;white-space:nowrap}

/* > BUTTON - YELLOW COLOUR */
.gtBtn{width:40px;min-width:40px;height:36px;border-radius:10px;border:1.5px solid #eab308;background:#facc15!important;color:#000!important;font-weight:900;font-size:18px;cursor:pointer;display:grid;place-items:center;transition:.22s;box-shadow:0 2px 8px rgba(250,204,21,0.35)}
.gtBtn:hover{background:#eab308!important;color:#000!important;transform:scale(1.05)}
.gtBtn.done{background:#facc15!important;color:#000!important;border-color:#eab308!important;box-shadow:0 2px 10px rgba(34,197,94,0.25)}
/* DELETE X - RED COLOUR */
.delBtn{width:40px;min-width:40px;height:36px;border-radius:10px;background:#ef4444!important;color:#fff!important;border:1.5px solid #dc2626!important;font-weight:900;font-size:16px;cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 8px rgba(239,68,68,0.25)}
.delBtn:hover{background:#dc2626!important;transform:scale(1.05)}

#mobOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:89}
#mobOverlay.show{display:block}
@media(max-width:1200px){th{padding:8px 4px;font-size:10px}td{padding:6px 4px;font-size:11px;height:46px;max-width:110px}td.nameCol{max-width:120px}}
@media(max-width:900px){.whiteBar{transform:translateX(-100%);width:270px!important}.whiteBar.mOpen{transform:translateX(0)}.mainWrap{margin-left:0!important;width:100%!important;max-width:100%!important}.content{padding:10px}.card{padding:10px}table{table-layout:fixed}td{max-width:80px;font-size:10px}td.nameCol{max-width:90px}.logo{font-size:15px}}
</style>
<script>
function toggleWhiteBar(){
  if(window.innerWidth<=900){
    document.getElementById('whiteBar').classList.toggle('mOpen');
    document.getElementById('mobOverlay').classList.toggle('show');
  }else{
    var bar=document.getElementById('whiteBar');
    bar.classList.toggle('folded');
    localStorage.setItem('shija_menu_folded', bar.classList.contains('folded')?'1':'0');
  }
}
function closeMob(){document.getElementById('whiteBar').classList.remove('mOpen');document.getElementById('mobOverlay').classList.remove('show');}
window.addEventListener('load',()=>{
  if(localStorage.getItem('shija_menu_folded')==='1' && window.innerWidth>900){
    document.getElementById('whiteBar').classList.add('folded');
  }
});
</script>
</head>
<body>
<div id="mobOverlay" onclick="closeMob()"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app=initializeApp(cfg,"app_"+Math.random());
const db=getFirestore(app);
window._fb={db,collection,getDocs,doc,setDoc,deleteDoc,_docsCache:{},CHUNK_SIZE:800000};
</script>
<div class="whiteBar" id="whiteBar">
<div style="display:flex;flex-direction:column;height:100%">
<div class="sHead"><div class="sLogo"><img src="logoc.png"></div><div class="sTitle"><b>SHIJA</b><br><span>DIALYSIS CARE</span></div></div>
<div class="sMenu">
<a href="index.html"><span class="mi"><svg viewBox="0 0 24 24"><path d="M3 9L12 2l9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span><span class="ml">HOME</span></a>
<a href="total.html"><span class="mi"><svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="4"/></svg></span><span class="ml">TOTAL PATIENT</span></a>
<a href="cmht.html"><span class="mi"><svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="4"/></svg></span><span class="ml">CMHT TOTAL</span></a>
<a href="claim.html"><span class="mi"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg></span><span class="ml">CLAIM</span></a>
<a href="discharge.html" class="active"><span class="mi"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></svg></span><span class="ml">DISCHARGE PATIENT</span></a>
<a href="kft.html"><span class="mi"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg></span><span class="ml">KFT</span></a>
<a href="bill.html"><span class="mi"><svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/></svg></span><span class="ml">BILL</span></a>
</div></div><div class="sFoot"><span>SHIJA • YELLOW > + RED X</span></div></div>
<div class="mainWrap">
<div class="top"><div class="logo"><button type="button" class="menuBtnTop" onclick="toggleWhiteBar()"><span></span><span></span><span></span></button> DISCHARGE PATIENT <div class="badgeBlue">ALL DATES</div></div></div>
<div class="content">
<div class="card">
<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:end;width:100%">
<div><div class="label">DATE - ALL DATES + ARROW ◀ ▶</div><div class="dateNavWrap"><button class="dateArrowBtn" onclick="changeDateBy(-1)">◀</button><input type="date" id="fDate"><button class="dateArrowBtn" onclick="changeDateBy(1)">▶</button><button class="btn btnDark btnSmall" onclick="clearDateFilter()">ALL</button></div></div>
<div><div class="label">TIME</div><select id="fTime" class="input inputSmall" style="width:105px"><option value="">ALL</option><option>7:00 AM</option><option>12:00 PM</option><option>5:00 PM</option><option>9:00 PM</option><option>12:00 AM</option><option>2:00 AM</option></select></div>
<div><div class="label">BLOCK</div><select id="fBlock" class="input inputSmall" style="width:90px"><option value="">ALL</option><option>MAIN</option><option>ITOCHA</option></select></div>
<div><div class="label">PER PAGE</div><select id="perPage" class="input inputSmall" style="width:85px"><option value="12" selected>12</option><option value="24">24</option><option value="48">48</option><option value="96">96</option></select></div>
<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn btnDark btnSmall" onclick="clearFilters()">CLEAR</button><button class="btn btnDark btnSmall" onclick="changePage(-1)">PREV</button><button class="btn btnDark btnSmall" onclick="changePage(1)">NEXT</button></div>
<div style="margin-left:auto;display:flex;gap:8px;align-items:center"><span class="badge" id="badgeD">0</span> <span id="pageInfo" style="font-size:11px;font-weight:800"></span></div>
</div>
<div style="margin-top:12px;width:100%"><input type="search" id="fSearch" class="input inputSmall" placeholder="Search discharged..." style="max-width:320px;border-radius:20px"></div>
</div>
<div class="card" style="padding:8px"><div class="sheetWrap"><table><thead><tr><th style="width:5%">SL</th><th style="width:22%">PATIENT NAME</th><th style="width:12%">SHRI ID</th><th style="width:12%">PMJAY ID</th><th style="width:10%">DATE</th><th style="width:9%">TIME</th><th style="width:9%">BLOCK</th><th style="width:10%">OPEN ></th><th style="width:11%">DELETE X</th></tr></thead><tbody id="tbody"><tr><td colspan="9">LOADING...</td></tr></tbody></table></div></div>
</div></div>
<script>
var allDischarge=[],filtered=[],currentPage=1,pageSize=12;
function getDocsForShri(shri){return window._fb._docsCache[shri]||[];}
async function loadDocsCache(){try{var snap=await window._fb.getDocs(window._fb.collection(window._fb.db,"patient_docs"));window._fb._docsCache={};snap.forEach(d=>{var data=d.data();data._id=d.id;if(!window._fb._docsCache[data.shri])window._fb._docsCache[data.shri]=[];window._fb._docsCache[data.shri].push(data);});render();}catch(e){}}
async function loadAll(){try{var snap=await window._fb.getDocs(window._fb.collection(window._fb.db,'discharges'));allDischarge=[];snap.forEach(d=>{var o=d.data();o._id=d.id;allDischarge.push(o);});allDischarge.sort((a,b)=>{var da=a.date||'';var db=b.date||'';if(da!==db)return db.localeCompare(da);return new Date(b.dischargedAt||0)-new Date(a.dischargedAt||0);});applyFilter();}catch(e){document.getElementById('tbody').innerHTML='<tr><td colspan="9">ERROR</td></tr>';}}
function applyFilter(){
var date=document.getElementById('fDate').value;
var time=document.getElementById('fTime').value;
var block=document.getElementById('fBlock').value;
var search=document.getElementById('fSearch').value.toLowerCase().trim();
pageSize=parseInt(document.getElementById('perPage').value)||12;
filtered=allDischarge.filter(p=>{
if(date && p.date!==date) return false;
if(time && (p.time||'')!==time) return false;
if(block && (p.block||'').toUpperCase()!==block.toUpperCase()) return false;
if(search){var s=(p.patientName||p.name||'')+" "+(p.shriId||p.shri||'')+" "+(p.pmjayCmhtId||'');if(s.toLowerCase().indexOf(search)===-1) return false;}
return true;
});
currentPage=1;render();
}
function render(){
var tbody=document.getElementById('tbody');tbody.innerHTML='';
var tp=Math.max(1,Math.ceil(filtered.length/pageSize));if(currentPage>tp)currentPage=tp;var start=(currentPage-1)*pageSize;var page=filtered.slice(start,start+pageSize);
document.getElementById('badgeD').innerText="Discharged - "+filtered.length + (document.getElementById('fDate').value ? " ("+document.getElementById('fDate').value+")" : " (ALL DATES)");
document.getElementById('pageInfo').innerText="Page "+currentPage+" of "+tp;
if(page.length===0){tbody.innerHTML='<tr><td colspan="9" style="padding:20px;text-align:center">NO DATA - Click ALL</td></tr>';return;}
page.forEach((p,i)=>{
var shriVal=p.shriId||p.shri||'';var nameVal=p.patientName||p.name||'';var pmjayShow=p.pmjayCmhtId||p.pmjayId||'';var docs=getDocsForShri(shriVal);var totalFiles=docs.length;
var tr=document.createElement('tr');tr.className='mainRow';
tr.innerHTML='<td>'+(start+i+1)+'</td><td class="nameCol" title="'+nameVal+'">'+nameVal+'</td><td><span class="shriGray">'+shriVal+'</span></td><td><span class="pmjayBlue">'+pmjayShow+'</span></td><td style="font-size:11px">'+(p.date||'')+'</td><td>'+(p.time||'')+'</td><td>'+(p.block||'')+'</td>'
+'<td><button class="gtBtn '+(totalFiles>0?'done':'')+'" onclick="openUploadPage(\''+shriVal+'\',\''+nameVal.replace(/'/g,"\\'")+'\',\''+pmjayShow+'\',\''+(p.date||'')+'\',\''+(p.time||'')+'\',\''+(p.block||'')+'\',\''+p._id+'\')" title="'+totalFiles+' files">></button></td>'
+'<td><button class="delBtn" onclick="delDischarge(\''+p._id+'\')">X</button></td>';
tbody.appendChild(tr);
});
}
function openUploadPage(shri,name,pmjay,date,time,block,dischargeId){
  var url = 'discharge_upload.html?shri='+encodeURIComponent(shri)+'&name='+encodeURIComponent(name)+'&pmjay='+encodeURIComponent(pmjay)+'&date='+encodeURIComponent(date)+'&time='+encodeURIComponent(time)+'&block='+encodeURIComponent(block)+'&id='+encodeURIComponent(dischargeId);
  window.location.href = url;
}
function changePage(d){var tp=Math.max(1,Math.ceil(filtered.length/pageSize));currentPage+=d;if(currentPage<1)currentPage=1;if(currentPage>tp)currentPage=tp;render();}
function clearFilters(){document.getElementById('fDate').value='';document.getElementById('fTime').value='';document.getElementById('fBlock').value='';document.getElementById('fSearch').value='';applyFilter();}
function clearDateFilter(){document.getElementById('fDate').value='';applyFilter();}
function changeDateBy(days){var input=document.getElementById('fDate');if(!input)return;var base=input.value?new Date(input.value):new Date();base.setDate(base.getDate()+days);var y=base.getFullYear();var m=String(base.getMonth()+1).padStart(2,'0');var d=String(base.getDate()).padStart(2,'0');input.value=y+'-'+m+'-'+d;applyFilter();}
async function delDischarge(id){if(!confirm('DELETE?'))return;try{await window._fb.deleteDoc(window._fb.doc(window._fb.db,'discharges',id));loadAll();}catch(e){alert(e.message);}}
window.addEventListener('load',function(){
document.getElementById('fDate').value='';
loadAll();
setTimeout(loadDocsCache,800);
document.getElementById('fTime').addEventListener('change',applyFilter);
document.getElementById('fBlock').addEventListener('change',applyFilter);
document.getElementById('perPage').addEventListener('change',applyFilter);
document.getElementById('fSearch').addEventListener('input',applyFilter);
document.getElementById('fDate').addEventListener('change',applyFilter);
});
</script>
</body>
</html>
