<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CMHT KFT Report - SHIJA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui}
body{background:#f1f5f9;display:flex;min-height:100vh}
.whiteBar{position:fixed;left:0;top:0;bottom:0;width:270px;min-width:270px;height:100vh;background:#0f172a;color:#94a3b8;display:flex;flex-direction:column;justify-content:space-between;z-index:90;overflow:hidden;transition:width .32s ease}
.whiteBar.folded{width:72px!important;min-width:72px!important}
.mainWrap{flex:1;margin-left:270px;transition:margin-left .32s ease;min-height:100vh;display:flex;flex-direction:column;background:#eef2ff}
.whiteBar.folded ~ .mainWrap{margin-left:72px!important}
.sHead{padding:16px 12px;display:flex;align-items:center;gap:12px;background:#fff!important;border-bottom:1px solid #e2e8f0;flex-shrink:0;overflow:hidden}
.sLogo{width:42px;min-width:42px;height:42px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0;border:1px solid #e2e8f0}
.sLogo img{width:100%;height:100%;object-fit:contain;display:block}
.sTitle b{color:#0f172a;font-size:16px;font-weight:900;display:block;line-height:1}
.sTitle span{font-size:9px;color:#64748b;text-transform:uppercase;font-weight:700;display:block;margin-top:2px}
.whiteBar.folded .sTitle{display:none}
.whiteBar.folded .sHead{justify-content:center;padding:14px 0}
.sMenu{flex:1;padding:8px 8px;overflow-y:auto}
.sMenu::-webkit-scrollbar{width:0}
.sMenu a{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:12px;text-decoration:none;color:#94a3b8;font-size:13px;font-weight:500;margin-bottom:2px;white-space:nowrap;overflow:hidden;transition:.2s}
.sMenu a:hover{background:#1e293b;color:#fff}
.sMenu a.active{background:#1e293b;color:#fff;font-weight:600;box-shadow:inset 0 0 0 1px #334155}
.mi{width:36px;min-width:36px;height:36px;display:grid;place-items:center;background:#1e293b;border-radius:10px;flex-shrink:0}
.mi svg{width:18px;height:18px;stroke:#94a3b8;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sMenu a.active .mi{background:#2563eb}
.sMenu a.active .mi svg{stroke:#fff}
.ml{overflow:hidden;text-overflow:ellipsis}
.whiteBar.folded .ml{display:none}
.whiteBar.folded .sMenu a{justify-content:center;padding:12px 0}
.sFoot{padding:12px;border-top:1px solid #1e293b;font-size:10px;color:#64748b}
.whiteBar.folded .sFoot{display:none}
.top{height:68px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;color:#0f172a}
.menuBtnTop{width:40px;height:36px;background:transparent!important;border:none!important;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.menuBtnTop span{display:block;width:20px;height:2.5px;background:#0f172a;border-radius:2px}
.badgeBlue{background:#06b6d4;color:#fff;padding:6px 12px;border-radius:20px;font-weight:900;font-size:11px;border:1px solid #06b6d4}
.content{flex:1;padding:20px 24px;background-color:#f8fafc;background-image: radial-gradient(circle at 1px 1px, rgba(37,99,235,0.08) 1px, transparent 0);background-size:22px 22px}
.filterBox{background:#fff;border:1.5px solid #e2e8f0;border-radius:14px;padding:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0;position:relative;padding-bottom:52px}
.filterBox select,.filterBox input{padding:10px 12px;border-radius:8px;border:1.5px solid #cbd5e1;font-weight:700;font-size:13px;background:#fff;outline:0}
.searchAddedWrap{display:flex;gap:6px;align-items:center;border-left:1.5px solid #e2e8f0;padding-left:10px}
.searchAddedWrap input{padding:9px 12px;border-radius:20px;border:1.5px solid #8b5cf6;min-width:220px;background:#faf5ff;font-weight:600;font-size:12px}
.btnBlue{background:#8b5cf6;color:#fff;border:0;padding:9px 14px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer}
/* BOTTOM CORNER SMALL - NO OVERLAP */
.viewCorner{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;background:#f8fafc;border:1px solid #e2e8f0;padding:5px;border-radius:10px;z-index:2}
.btnViewIcon{width:30px;height:30px;border-radius:8px;border:1.5px solid #cbd5e1;background:#fff;display:grid;place-items:center;cursor:pointer;transition:.2s;flex-shrink:0}
.btnViewIcon.active{background:#0f172a;border-color:#0f172a}
.btnViewIcon.active svg{stroke:#fff}
.btnViewIcon svg{width:15px;height:15px;stroke:#0f172a;stroke-width:2;fill:none}
.tableWrap{background:#fff;border:1.5px solid #e2e8f0;border-radius:14px;overflow:hidden;margin-top:12px}
table{width:100%;border-collapse:collapse;min-width:800px}
th{padding:14px 12px;font-size:12px;color:#64748b;background:#f8fafc;text-align:left;font-weight:800;text-transform:uppercase}
td{padding:14px 12px;font-size:13px;border-bottom:1px solid #f1f5f9}
.sl{background:#f3e8ff;width:36px;height:28px;display:grid;place-items:center;border-radius:6px;font-weight:800;color:#6b21a8}
.shri{background:#8b5cf6;color:#fff;padding:4px 10px;border-radius:6px;font-weight:700;font-size:12px}
.badgeRecv{background:#dcfce7;color:#166534;padding:5px 12px;border-radius:20px;font-weight:800;font-size:11px;cursor:pointer;border:1px solid #bbf7d0}
.badgeNot{background:#fee2e2;color:#991b1b;padding:5px 12px;border-radius:20px;font-weight:800;font-size:11px;cursor:pointer;border:1px solid #fecaca}
.btn{padding:8px 14px;border-radius:8px;border:0;font-weight:700;cursor:pointer}
.btnExp{background:#0a1931;color:#fff}
.gridWrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:12px}
.gridCard{background:#fff;border:1.5px solid #e2e8f0;border-radius:14px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;transition:.2s;text-align:center}
.gridCard:hover{border-color:#8b5cf6;box-shadow:0 4px 12px rgba(139,92,246,.15);transform:translateY(-2px)}
.iconOnly{width:56px;height:56px;border-radius:14px;background:#f3e8ff;display:grid;place-items:center}
.iconOnly svg{width:28px;height:28px;stroke:#8b5cf6;stroke-width:1.8;fill:none}
.gridCard b{font-size:13px;color:#0f172a;line-height:1.2;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.gridCard span.shriSmall{background:#f1f5f9;color:#475569;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700}
.hidden{display:none!important}
.pageBar{background:#fff;border:1.5px solid #e2e8f0;border-radius:14px;padding:12px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:12px}
.pageBtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pageBtns button{padding:8px 12px;border-radius:8px;border:1.5px solid #cbd5e1;background:#fff;font-weight:800;cursor:pointer}
.pageBtns button:disabled{opacity:.4;cursor:not-allowed}
.pageBtns button.active{background:#0a1931;color:#fff;border-color:#0a1931}
@media(max-width:900px){.searchAddedWrap{border-left:0;padding-left:0}.filterBox{padding-bottom:16px}.viewCorner{position:static;margin-left:auto}}
</style>
</head>
<body>
<script>if(localStorage.getItem('shija_logged')!=='1'){location.href='login.html'}</script>
<div class="whiteBar" id="whiteBar">
<div style="display:flex;flex-direction:column;height:100%;overflow:hidden">
<div class="sHead"><div class="sLogo"><img src="logoc.png"><b id="logoFallback" style="display:none">S</b></div><div class="sTitle"><b>SHIJA</b><span>DIALYSIS CARE</span></div></div>

</div></div><div class="sFoot">System Online • SHIJA</div></div>
<div class="mainWrap">
<div class="top"><div class="logo"><button type="button" class="menuBtnTop" id="menuBtnTop"><span></span><span></span><span></span></button> CMHT KFT REPORT <div class="badgeBlue">CMHT KFT</div></div></div>
<div class="content">
<h1 style="font-size:20px;font-weight:900;color:#0f172a">CMHT KFT Report</h1><p id="info" style="color:#64748b;font-size:13px;margin:4px 0 0;font-weight:600">Shows all patients - Click status to toggle</p>
<div class="filterBox">
<label style="font-size:12px;font-weight:800">Year:</label><select id="yearSel" onchange="loadKFT()"></select>
<label style="font-size:12px;font-weight:800">Month:</label><select id="monthSel" onchange="loadKFT()"><option value="01">Jan</option><option value="02">Feb</option><option value="03">Mar</option><option value="04">Apr</option><option value="05">May</option><option value="06">Jun</option><option value="07">Jul</option><option value="08">Aug</option><option value="09">Sep</option><option value="10">Oct</option><option value="11">Nov</option><option value="12">Dec</option></select>
<label style="font-size:12px;font-weight:800">Date:</label><select id="daySel" onchange="loadKFT()"><option value="01">1st</option><option value="15">15th</option></select>
<button class="btn btnExp" onclick="exportExcel()">Export Excel</button>
<div class="searchAddedWrap"><input id="searchAdded" placeholder="Search Patient" oninput="resetPageAndLoad()" autocomplete="off"><button class="btnBlue" onclick="resetPageAndLoad()">Search</button></div>
<span id="countInfo" style="font-weight:700;color:#475569;font-size:12px"></span>
<div class="viewCorner">
<button class="btnViewIcon active" id="btnList" onclick="setView('list')" title="List View"><svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg></button>
<button class="btnViewIcon" id="btnGrid" onclick="setView('grid')" title="Grid Icon View"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></button>
</div>
</div>
<div class="tableWrap" id="tableWrap"><div style="overflow-x:auto"><table id="tbl"></table></div></div>
<div class="gridWrap hidden" id="gridWrap"></div>
<div class="pageBar"><div style="display:flex;gap:8px;align-items:center"><label style="font-size:12px;font-weight:800">Show:</label><select id="pageSizeSel" onchange="changePageSize()"><option value="10" selected>10</option><option value="20">20</option><option value="30">30</option><option value="40">40</option><option value="50">50</option><option value="all">All</option></select></div><div class="pageBtns" id="pageBtns"></div><span id="pageInfo" style="font-size:12px;font-weight:700;color:#475569"></span></div>
</div>
</div>
<script>
function toggleWhiteBar(){document.getElementById('whiteBar').classList.toggle('folded');}
document.addEventListener('DOMContentLoaded',function(){ document.getElementById('menuBtnTop').addEventListener('click',function(e){e.preventDefault();toggleWhiteBar();}); });
let viewMode='list';
window.setView=(mode)=>{
 viewMode=mode;
 document.getElementById('btnList').classList.toggle('active', mode==='list');
 document.getElementById('btnGrid').classList.toggle('active', mode==='grid');
 document.getElementById('tableWrap').classList.toggle('hidden', mode==='grid');
 document.getElementById('gridWrap').classList.toggle('hidden', mode==='list');
 loadKFT(true);
};
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app=initializeApp(firebaseConfig,"cmhtkftMain_"+Math.random());const db=getFirestore(app);
let allCMHT=[];let currentPage=1;let pageSize=10;
let yearSel=document.getElementById('yearSel');
for(let y=2024;y<=2030;y++){let o=document.createElement('option');o.value=y;o.textContent=y;if(y==2026)o.selected=true;yearSel.appendChild(o);}
let monthSel=document.getElementById('monthSel');monthSel.value=new Date().toISOString().slice(5,7);
function getDateKey(){return `${yearSel.value}-${monthSel.value}-${document.getElementById('daySel').value}`;}
async function init(){const snap=await getDocs(collection(db,"cmht_patients"));allCMHT=[];snap.forEach(d=>{let c=d.data();allCMHT.push({key:d.id,name:c.patientName||c.name||'',shri:c.shriId||c.shri||d.id,contact:c.contactNo||c.contact||''});});loadKFT();}
function getFiltered(){let searchQ=document.getElementById('searchAdded').value.toLowerCase().trim();return allCMHT.filter(p=>{if(!searchQ) return true;return (p.name||'').toLowerCase().includes(searchQ) || (p.shri||'').toLowerCase().includes(searchQ) || (p.contact||'').toLowerCase().includes(searchQ);});}
function renderPageBtns(total,totalPages){let wrap=document.getElementById('pageBtns');let info=document.getElementById('pageInfo');if(pageSize==='all' || totalPages<=1){wrap.innerHTML='';info.textContent=total>0?`Showing 1 - ${total}`:'';return;}let start=(currentPage-1)*pageSize+1;let end=Math.min(currentPage*pageSize,total);info.textContent=`${start}-${end} of ${total} | Page ${currentPage}/${totalPages}`;let html=`<button onclick="goToPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹ Prev</button>`;let s=Math.max(1,currentPage-2);let e=Math.min(totalPages,s+4);if(e-s<4)s=Math.max(1,e-4);for(let i=s;i<=e;i++){html+=`<button onclick="goToPage(${i})" class="${i===currentPage?'active':''}">${i}</button>`;}html+=`<button onclick="goToPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>Next ›</button>`;wrap.innerHTML=html;}
window.goToPage=(p)=>{let filtered=getFiltered();let totalPages=pageSize==='all'?1:Math.max(1,Math.ceil(filtered.length/pageSize));if(p<1)p=1;if(p>totalPages)p=totalPages;currentPage=p;loadKFT(true);};
window.changePageSize=()=>{let v=document.getElementById('pageSizeSel').value;pageSize=v==='all'?'all':parseInt(v);currentPage=1;loadKFT(true);};
window.resetPageAndLoad=()=>{currentPage=1;loadKFT();};
window.loadKFT=async(keepPage)=>{let dateKey=getDateKey();let filtered=getFiltered();let totalPages=pageSize==='all'?1:Math.max(1,Math.ceil(filtered.length/pageSize));if(currentPage>totalPages)currentPage=totalPages;let pageItems=pageSize==='all'?filtered:filtered.slice((currentPage-1)*pageSize,currentPage*pageSize);let startIndex=pageSize==='all'?0:(currentPage-1)*pageSize;let html='<tr><th>SL No</th><th>Patient Name</th><th>SHRI ID</th><th>Contact</th><th>KFT Status</th><th>Date</th></tr>';let gridHtml='';for(let i=0;i<pageItems.length;i++){let p=pageItems[i];let docId=`${p.shri}_${dateKey}`;let status='Not-Received';try{let d=await getDoc(doc(db,"cmht_kft_reports",docId));if(d.exists())status=d.data().status||'Not-Received';}catch(e){}let badge=status==='Received'?`<span class="badgeRecv" onclick="toggleStatus('${p.shri}','${dateKey}','${status}')">RECEIVED ✓</span>`:`<span class="badgeNot" onclick="toggleStatus('${p.shri}','${dateKey}','${status}')">NOT-RECEIVED ✗</span>`;html+=`<tr><td><div class="sl">${startIndex+i+1}</div></td><td><b>${p.name}</b></td><td><span class="shri">${p.shri}</span></td><td>${p.contact||'-'}</td><td>${badge}</td><td>${dateKey}</td></tr>`;let iconColor=status==='Received'?'#10b981':'#ef4444';let bgColor=status==='Received'?'#dcfce7':'#fee2e2';gridHtml+=`<div class="gridCard" onclick="toggleStatus('${p.shri}','${dateKey}','${status}')"><div class="iconOnly" style="background:${bgColor}"><svg viewBox="0 0 24 24" style="stroke:${iconColor}"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><b>${p.name||'No Name'}</b><span class="shriSmall">${p.shri}</span><div>${badge}</div></div>`;}if(filtered.length===0){html+=`<tr><td colspan="6" style="text-align:center;padding:20px">No patient</td></tr>`;gridHtml=`<div style="grid-column:1/-1;text-align:center;padding:20px;background:#fff;border-radius:14px">No patient</div>`;}document.getElementById('tbl').innerHTML=html;document.getElementById('gridWrap').innerHTML=gridHtml;document.getElementById('info').textContent=`CMHT KFT Report for ${dateKey} - ${viewMode==='grid'?'GRID ICON':'LIST'} View`;document.getElementById('countInfo').textContent=filtered.length+' / '+allCMHT.length;renderPageBtns(filtered.length,totalPages);};
window.toggleStatus=async(shri,dateKey,cur)=>{let newStatus=cur==='Received'?'Not-Received':'Received';let docId=`${shri}_${dateKey}`;try{await setDoc(doc(db,"cmht_kft_reports",docId),{shriId:shri,date:dateKey,status:newStatus,updatedAt:new Date().toISOString()});loadKFT(true);}catch(e){alert(e.message);}};
window.exportExcel=()=>{let dateKey=getDateKey();let rows=[];let trs=document.querySelectorAll('#tbl tr');trs.forEach((tr,idx)=>{if(idx===0)return;let tds=tr.querySelectorAll('td');if(tds.length<5)return;rows.push({SL:tds[0].innerText,Name:tds[1].innerText,SHRI_ID:tds[2].innerText,Contact:tds[3].innerText,KFT_Status:tds[4].innerText,Date:dateKey});});let ws=XLSX.utils.json_to_sheet(rows);let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"CMHT KFT "+dateKey);XLSX.writeFile(wb,`CMHT_KFT_${dateKey}.xlsx`);};
init();
</script>
</body>
