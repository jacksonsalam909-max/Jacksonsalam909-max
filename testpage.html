<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Daily Dialysis List - SHIJA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui}
body{background:#f1f5f9;display:flex;min-height:100vh;overflow-x:hidden}
.whiteBar{position:fixed;left:0;top:0;bottom:0;width:270px;min-width:270px;height:100vh;background:#0f172a;color:#94a3b8;display:flex;flex-direction:column;justify-content:space-between;z-index:90;overflow:hidden;transition:width .32s ease, transform .32s ease}
.whiteBar.folded{width:72px!important;min-width:72px!important}
.mainWrap{flex:1;margin-left:270px;transition:margin-left .32s ease;min-height:100vh;display:flex;flex-direction:column;background:#eef2ff;width:calc(100% - 270px)}
.whiteBar.folded ~ .mainWrap{margin-left:72px!important;width:calc(100% - 72px)}
.sHead{padding:16px 12px;display:flex;align-items:center;gap:12px;background:#fff!important;border-bottom:1px solid #e2e8f0;flex-shrink:0;overflow:hidden}
.sLogo{width:42px;min-width:42px;height:42px;background:#fff;border-radius:12px;display:grid;place-items:center;overflow:hidden;padding:3px;border:1px solid #e2e8f0}
.sLogo img{width:100%;height:100%;object-fit:contain}
.sTitle b{color:#0f172a;font-size:16px;font-weight:900}
.sTitle span{font-size:9px;color:#64748b;text-transform:uppercase;font-weight:700}
.whiteBar.folded .sTitle{display:none}
.whiteBar.folded .sHead{justify-content:center;padding:14px 0}
.sMenu{flex:1;padding:8px 8px;overflow-y:auto}
.sMenu::-webkit-scrollbar{width:0}
.sMenu a{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:12px;text-decoration:none;color:#94a3b8;font-size:13px;font-weight:500;margin-bottom:2px;white-space:nowrap;overflow:hidden;transition:.2s}
.sMenu a:hover{background:#1e293b;color:#fff}
.sMenu a.active{background:#1e293b;color:#fff;font-weight:600;box-shadow:inset 0 0 0 1px #334155}
.mi{width:36px;min-width:36px;height:36px;display:grid;place-items:center;background:#1e293b;border-radius:10px;flex-shrink:0}
.mi svg{width:18px;height:18px;stroke:#94a3b8;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sMenu a:hover .mi{background:#334155}
.sMenu a:hover .mi svg{stroke:#fff}
.sMenu a.active .mi{background:#2563eb}
.sMenu a.active .mi svg{stroke:#fff}
.ml{overflow:hidden;text-overflow:ellipsis}
.whiteBar.folded .ml{display:none}
.whiteBar.folded .sMenu a{justify-content:center;padding:12px 0}
.sFoot{padding:12px;border-top:1px solid #1e293b;font-size:10px;color:#64748b;overflow:hidden;white-space:nowrap}
.whiteBar.folded .sFoot{display:none}
.top{height:68px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:20;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;color:#0f172a}
.menuBtnTop{width:40px;height:36px;background:transparent!important;border:none!important;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.menuBtnTop span{display:block;width:20px;height:2.5px;background:#0f172a;border-radius:2px}
.content{flex:1;padding:20px 24px;position:relative;background-color:#f8fafc;background-image: radial-gradient(circle at 1px 1px, rgba(37,99,235,0.08) 1px, transparent 0);background-size:22px 22px;max-width:100%}
.pageHead{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:18px;position:relative;z-index:2}
.pageHead h1{font-size:26px;font-weight:900;color:#0f172a}
.pageHead p{color:#64748b;font-size:13px;font-weight:600;margin-top:4px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#fff;border:1.5px solid #e2e8f0;padding:12px;border-radius:16px;box-shadow:0 4px 12px #00000006;position:relative;z-index:2}
.controls input,.controls select{padding:11px 14px;border-radius:10px;border:1.5px solid #cbd5e1;font-size:13px;outline:0;background:#f8fafc;font-weight:600}
.controls input:focus,.controls select:focus{border-color:#2563eb;background:#fff}
.dataCard{background:#fff;border:1.5px solid #e2e8f0;border-radius:16px;overflow:hidden;margin-top:16px;box-shadow:0 4px 16px #00000006;position:relative;min-height:420px}
table{width:100%;border-collapse:collapse;min-width:1100px}
th{padding:14px 12px;font-size:11px;color:#64748b;background:rgba(248,250,252,0.85);text-align:left;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;position:relative;z-index:3}
td{padding:14px 12px;font-size:13px;border-bottom:1px solid #f1f5f9;vertical-align:middle;white-space:nowrap;position:relative;z-index:2;background:rgba(255,255,255,0.78)}
.pBtn{padding:8px 14px;border-radius:8px;border:1.5px solid #cbd5e1;background:#fff;font-weight:700;cursor:pointer;font-size:13px}
#mobOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:89}
#mobOverlay.show{display:block}
/* === WATERMARK INSIDE TABLE BEHIND ROWS === */
.tableWatermark{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:420px;
  max-width:65%;
  z-index:1;
  pointer-events:none;
  opacity:0.16;
}
.tableWatermark img{width:100%;height:auto;display:block;}
@media(max-width:900px){
  .whiteBar{transform:translateX(-100%);width:270px!important;min-width:270px!important}
  .whiteBar.mOpen{transform:translateX(0)}
  .mainWrap{margin-left:0!important;width:100%!important}
  .content{padding:12px}
  .tableWatermark{width:320px;max-width:75%;opacity:0.14}
}
</style>
</head>
<body>
<div id="mobOverlay" onclick="closeMob()"></div>
<script>if(localStorage.getItem('shija_logged')!=='1'){location.href='login.html'}</script>
<div class="whiteBar" id="whiteBar"><div style="display:flex;flex-direction:column;height:100%;overflow:hidden"><div class="sHead"><div class="sLogo"><img src="loko.png"></div><div class="sTitle"><b>SHIJA</b><span>DIALYSIS CARE</span></div></div><div class="sMenu">
<a href="index.html"><span class="mi"><svg viewBox="0 0 24 24"><path d="M3 9L12 2l9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span><span class="ml">HOME</span></a>
<a href="list.html?scheme=PMJAY&force=1" class="active"><span class="mi"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M8 2v4"/><path d="M16 2v4"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span><span class="ml">DAILY DIALYSIS LIST</span></a>
<a href="total.html"><span class="mi"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg></span><span class="ml">TOTAL PATIENT</span></a>
</div></div><div class="sFoot">System Online • SHIJA</div></div>
<div class="mainWrap"><div class="top"><div class="logo"><button type="button" class="menuBtnTop" id="menuBtnTop"><span></span><span></span><span></span></button> SHIJA Dialysis</div></div>
<div class="content">
<div class="pageHead"><div><h1>Daily Dialysis List</h1><p id="dateInfo">Loading...</p></div></div>
<div class="controls"><input id="search" placeholder="Search..." oninput="filter()"><select id="filterScheme"><option value="">All Scheme</option><option value="PMJAY">PMJAY</option><option value="CMHT">CMHT</option></select><input type="date" id="datePick"></div>
<div class="dataCard" id="dataCard">
  <div class="tableWatermark"><img src="loko.png" alt="SHIJA Logo"></div>
  <div style="overflow-x:auto;position:relative;z-index:2"><table id="tbl"><tr><th>Loading...</th></tr></table></div>
  <div style="padding:12px;background:#f8fafc;border-top:1px solid #e2e8f0;position:relative;z-index:3;display:flex;justify-content:space-between"><span id="count"></span><div style="display:flex;gap:6px"><button class="pBtn" onclick="prev()">←</button><button class="pBtn" onclick="next()">→</button></div></div>
</div>
</div></div>
<script>
function toggleWhiteBar(){if(window.innerWidth<=900){document.getElementById('whiteBar').classList.toggle('mOpen');document.getElementById('mobOverlay').classList.toggle('show');}else{let bar=document.getElementById('whiteBar');bar.classList.toggle('folded');localStorage.setItem('whiteBarFolded', bar.classList.contains('folded') ? 'true' : 'false');}}
function closeMob(){document.getElementById('whiteBar').classList.remove('mOpen');document.getElementById('mobOverlay').classList.remove('show');}
document.addEventListener('DOMContentLoaded',function(){let saved=localStorage.getItem('whiteBarFolded');if(saved==='true'&&window.innerWidth>900)document.getElementById('whiteBar').classList.add('folded');document.getElementById('menuBtnTop').addEventListener('click',function(e){e.preventDefault();toggleWhiteBar();})});
</script>
</body>
</html>
