<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHIJA Hospitals - Admin Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{
  min-height:100vh;
  background:#eef2f7;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px
}
.login-container{
  width:1100px;
  max-width:100%;
  height:620px;
  display:flex;
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,0.18)
}
/* LEFT COLUMN - shijabg.jpg */
.left{
  width:53%;
  background: linear-gradient(135deg, rgba(8,25,55,0.92) 0%, rgba(8,25,55,0.65) 100%), url('shijabg.jpg');
  background-size:cover;
  background-position:center;
  padding:45px;
  color:white;
  display:flex;
  flex-direction:column;
  position:relative
}
.logo-top{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:24px;
  font-weight:700;
  letter-spacing:0.2px
}
.logo-top img{
  width:42px;
  height:42px;
  object-fit:contain;
  filter:brightness(0) invert(1)
}
.welcome{
  margin-top:auto;
  margin-bottom:20px
}
.welcome h1{
  font-size:56px;
  font-weight:800;
  line-height:1.0;
  margin-bottom:16px;
  letter-spacing:-1px
}
.welcome p{
  font-size:15px;
  line-height:1.6;
  opacity:0.85;
  max-width:360px;
  font-weight:400
}

/* RIGHT COLUMN - LOGIN */
.right{
  width:47%;
  background:white;
  padding:50px 48px;
  display:flex;
  flex-direction:column;
  justify-content:center
}
.right h2{
  font-size:44px;
  font-weight:800;
  color:#0f2340;
  line-height:1.05;
  margin-bottom:32px;
  letter-spacing:-1px
}
.input-group{
  margin-bottom:18px
}
.input-group label{
  font-size:13px;
  font-weight:600;
  color:#0f2340;
  display:block;
  margin-bottom:8px
}
.input-group input,
.input-group select{
  width:100%;
  padding:14px 16px;
  border:1.5px solid #e2e8f0;
  border-radius:10px;
  font-size:14px;
  outline:none;
  background:#f8fafc;
  transition:0.2s;
  color:#0f2340
}
.input-group input::placeholder{
  color:#94a3b8
}
.input-group input:focus,
.input-group select:focus{
  border-color:#8B1A1A;
  background:white;
  box-shadow:0 0 0 3px rgba(139,26,26,0.08)
}
.input-group select{
  font-weight:600;
  cursor:pointer
}
.options{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:18px 0 22px 0;
  font-size:13px
}
.options label{
  display:flex;
  align-items:center;
  gap:7px;
  color:#334155;
  cursor:pointer
}
.options a{
  color:#8B1A1A;
  text-decoration:none;
  font-weight:600
}
.options a:hover{
  text-decoration:underline
}
.btn-signin{
  width:100%;
  padding:15px;
  background:#8B1A1A;
  color:white;
  border:none;
  border-radius:11px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  letter-spacing:0.5px;
  box-shadow:0 12px 24px rgba(139,26,26,0.3), 0 4px 8px rgba(139,26,26,0.2);
  transition:all 0.2s ease
}
.btn-signin:hover{
  transform:translateY(-2px);
  box-shadow:0 18px 32px rgba(139,26,26,0.38), 0 6px 12px rgba(139,26,26,0.25);
  background:#9e1e1e
}
.btn-signin:active{
  transform:translateY(0)
}
.footer{
  text-align:center;
  font-size:11px;
  color:#8B1A1A;
  margin-top:32px;
  opacity:0.65;
  letter-spacing:0.2px
}

/* MOBILE */
@media(max-width:900px){
  .login-container{
    flex-direction:column;
    height:auto;
    border-radius:16px
  }
  .left,.right{
    width:100%
  }
  .left{
    height:400px;
    padding:32px 28px
  }
  .welcome h1{
    font-size:40px
  }
  .right{
    padding:36px 28px
  }
  .right h2{
    font-size:34px;
    margin-bottom:24px
  }
}
</style>
</head>
<body>

<div class="login-container">
  <!-- LEFT with shijabg.jpg -->
  <div class="left">
    <div class="logo-top">
      <img src="loginlogo.png" alt="SHIJA Hospitals">
      SHIJA Hospitals
    </div>
    <div class="welcome">
      <h1>Welcome<br>Back</h1>
      <p>Monitor, manage, and access the hospital admin portal securely.</p>
    </div>
  </div>

  <!-- RIGHT Login -->
  <div class="right">
    <h2>Login As<br>ADMIN</h2>
    <form method="POST" action="">
      <div class="input-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter your username" required>
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter your password" required>
      </div>
      <div class="options">
        <label><input type="checkbox" style="width:16px;height:16px;accent-color:#8B1A1A;"> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <button type="submit" class="btn-signin">SIGN IN</button>
      <div class="footer">© 2024 SHIJA Hospitals • Secure Admin Portal • Version 2.1</div>
    </form>
  </div>
</div>

</body>
</html>
