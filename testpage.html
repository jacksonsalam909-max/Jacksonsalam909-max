<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Total Patients - SHIJA NEW</title>
<script src="Patient.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
body{background:#f8fafc;display:flex;min-height:100vh}
.whiteBar{position:fixed;left:0;top:0;bottom:0;width:270px;height:100vh;background:#0f172a;display:flex;flex-direction:column;justify-content:space-between;z-index:90;transition:.3s}
.mainWrap{flex:1;margin-left:270px;width:calc(100% - 270px);background:#f8fafc;display:flex;flex-direction:column;min-height:100vh}
.top{height:64px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:20}
.content{flex:1;padding:18px}
.pageHead{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:14px 16px;border-radius:12px;border:1px solid #e2e8f0;margin-bottom:12px}
.pageHead h1{font-size:20px;font-weight:900;color:#0f172a}
.controls{display:flex;gap:8px;background:#fff;padding:10px;border-radius:12px;border:1px solid #e2e8f0;margin-bottom:12px}
.controls input{flex:1;padding:11px 12px;border-radius:10px;border:1.5px solid #e2e8f0;background:#f8fafc;font-weight:600;outline:0}
.vBtn{width:38px;height:34px;border-radius:8px;border:0;cursor:pointer;font-weight:800}
.vBtn.active{background:#2563eb;color:#fff}
.pSelect{padding:8px 10px;border-radius:8px;border:1px solid #e2e8f0;font-weight:700}
.addBtn{background:#2563eb;color:#fff;padding:9px 14px;border-radius:8px;font-weight:800;text-decoration:none;font-size:13px}

/* NEW DESIGN - 100% MATCHING */
.tableWrap{background:#fff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse;min-width:1050px}
th{padding:13px 10px;font-size:10px;color:#fff;background:#2563eb;text-transform:uppercase;font-weight:800;letter-spacing:.7px;white-space:nowrap}
td{padding:12px 10px;border-bottom:1px solid #f1f5f9;vertical-align:middle;white-space:nowrap}
tr:hover td{background:#eff6ff!important}
.nSL{width:32px;height:32px;background:#2563eb;color:#fff;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:12px}
.nPhoto{width:56px;height:56px;border-radius:12px;background:#eff6ff;border:1.5px solid #bfdbfe;display:grid;place-items:center;font-weight:900;color:#2563eb;cursor:pointer;overflow:hidden}
.nPhoto img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.nName{font-weight:800;color:#0f172a;font-size:14px}
.nBadge{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;padding:5px 10px;border-radius:20px;font-weight:700;font-size:11px;display:inline-block}
.nAddr{max-width:180px;overflow:hidden;text-overflow:ellipsis;background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;padding:5px 10px;border-radius:20px;font-weight:600;font-size:11px;display:inline-block}
.nEdit{background:#2563eb;color:#fff;border:0;padding:7px 12px;border-radius:7px;font-weight:700;font-size:11px;cursor:pointer}
.nDel{background:#fff;border:1px solid #e2e8f0;color:#64748b;padding:7px 12px;border-radius:7px;font-weight:700;font-size:11px;cursor:pointer;margin-left:4px}

/* GRID NEW */
.patientGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.gCard{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px;transition:.2s}
.gCard:hover{border-color:#bfdbfe;box-shadow:0 8px 20px rgba(37,99,235,.1)}
.gTop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.gSL{width:28px;height:28px;background:#2563eb;color:#fff;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:11px}
.gPhoto{width:72px;height:72px;border-radius:50%;background:#eff6ff;border:2px solid #bfdbfe;display:grid;place-items:center;font-weight:900;color:#2563eb;font-size:20px;overflow:hidden;cursor:pointer}
.gPhoto img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.gName{font-weight:800;font-size:15px;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gAddrSmall{font-size:10px;color:#64748b;font-weight:600}
.gRow{display:flex;justify-content:space-between;padding:7px 9px;background:#eff6ff;border:1px solid #dbeafe;border-radius:8px;margin-bottom:4px}
.gLab{font-size:9px;font-weight:800;color:#2563eb;text-transform:uppercase}
.gVal{font-size:11px;font-weight:700;color:#0f172a;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gAct{display:flex;gap:6px;margin-top:10px}
.gAct button{flex:1;padding:9px;border-radius:8px;font-weight:700;font-size:11px;cursor:pointer;border:0}
.gAct .e{background:#2563eb;color:#fff}
.gAct .d{background:#f1f5f9;color:#475569}

.hidden{display:none!important}
.pager{display:flex;justify-content:space-between;padding:10px;background:#fff;border-top:1px solid #e2e8f0}
.pBtn{padding:8px 12px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;font-weight:700;cursor:pointer;font-size:12px}
#photoModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:9999;align-items:center;justify-content:center;flex-direction:column}
#photoModal.show{display:flex}
#photoView{width:90vw;max-width:400px;aspect-ratio:1/1;object-fit:cover;border-radius:50%;border:4px solid #fff}
#photoView.squareMode{border-radius:14px!important}
@media(max-width:1000px){.patientGrid{grid-template-columns:repeat(2,1fr)} .whiteBar{transform:translateX(-100%)} .mainWrap{margin-left:0;width:100%}}
@media(max-width:600px){.patientGrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<script>if(localStorage.getItem('shija_logged')!=='1'){location.href='login.html'}</script>
<div class="whiteBar" id="whiteBar"></div>
<div class="mainWrap">
<div class="top"><div style="font-weight:900">SHIJA Dialysis</div><div>Admin</div></div>
<div class="content">
<div class="pageHead"><div><h1>Total Patients - NEW DESIGN</h1><p id="info">Loading...</p></div><a href="add.html" class="addBtn">+ Add</a></div>
<div class="controls"><input id="search" placeholder="Search..." oninput="onSearch()"><button class="vBtn active" id="tableBtn" onclick="setView('table')">☰</button><button class="vBtn" id="gridBtn" onclick="setView('grid')">⊞</button><select id="pageSize" class="pSelect" onchange="changePageSize()"><option value="12">12</option><option value="24">24</option></select></div>
<div class="patientGrid hidden" id="patientGrid"></div>
<div class="tableWrap" id="tableWrap"><div style="overflow:auto"><table id="tbl"></table></div><div class="pager"><button class="pBtn" onclick="prevPage()">Prev</button><div id="pageInfo"></div><button class="pBtn" onclick="nextPage()">Next</button></div></div>
</div>
</div>
<div id="photoModal" onclick="this.classList.remove('show')"><img id="photoView"><div id="photoName" style="color:#fff;margin-top:10px;font-weight:800"></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app = initializeApp(firebaseConfig,"new1");const db = getFirestore(app);
let allPatients=[],filtered=[],currentPage=1,pageSize=12,photoCache={},currentPhotoShri=null;
function getKey(p){return String(p.key||p.shri||p.id||p.name).trim()}
function getDeleted(){try{return JSON.parse(localStorage.getItem('deletedKeys')||'[]')}catch{return[]}}
function getEdited(){try{return JSON.parse(localStorage.getItem('editedKeys')||'{}')}catch{return{}}}
function getInitial(n){return (n||'P').charAt(0).toUpperCase()}
window.onSearch=()=>{currentPage=1;applyFilter()}
window.changePageSize=()=>{pageSize=parseInt(document.getElementById('pageSize').value);currentPage=1;renderAll()}
window.applyFilter=()=>{let q=document.getElementById('search').value.toLowerCase();filtered=allPatients.filter(p=>!p.deleted && [p.name,p.shri,p.pmjay,p.addr].join(' ').toLowerCase().includes(q));renderAll()}
window.triggerPhoto=(shri)=>{let id='file_'+shri.replace(/[^a-zA-Z0-9]/g,'_');document.getElementById(id)?.click()}
async function getFullPhoto(shri){try{let clean=shri.replace(/[^a-zA-Z0-9]/g,'_');let snap=await getDocs(collection(db,"patient_photos",clean+"_photo","chunks"));let arr=[];snap.forEach(d=>arr.push(d.data()));arr.sort((a,b)=>a.index-b.index);return arr.map(a=>a.data).join('')}catch{return null}}
window.openPhoto=(shri,name,mode)=>{let data=photoCache[shri];if(!data){triggerPhoto(shri);return}currentPhotoShri=shri;let v=document.getElementById('photoView');v.className='';if(mode==='square')v.classList.add('squareMode');document.getElementById('photoName').textContent=name;v.src=data;document.getElementById('photoModal').classList.add('show')}
window.uploadPhoto=async(file,shri)=>{if(!file)return;let base64=await new Promise(r=>{let fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(file)});let clean=shri.replace(/[^a-zA-Z0-9]/g,'_');let id=clean+"_photo";let chunks=[];for(let i=0;i<base64.length;i+=800000)chunks.push(base64.substring(i,i+800000));await setDoc(doc(db,"patient_photos",id),{shri,cleanShri:clean,chunkCount:chunks.length});for(let j=0;j<chunks.length;j++)await setDoc(doc(db,"patient_photos",id,"chunks",String(j)),{index:j,data:chunks[j]});photoCache[shri]=base64;renderAll()}
async function loadPhotoCache(){try{let snap=await getDocs(collection(db,"patient_photos"));for(let d of snap.docs){let shri=d.data().shri;let full=await getFullPhoto(shri);if(full)photoCache[shri]=full}renderAll()}catch{}}
window.renderAll=()=>{
 let totalPages=Math.max(1,Math.ceil(filtered.length/pageSize));if(currentPage>totalPages)currentPage=totalPages;
 let start=(currentPage-1)*pageSize;let data=filtered.slice(start,start+pageSize);
 let gridHtml='';data.forEach((p,i)=>{let realIdx=allPatients.indexOf(p);let photo=photoCache[p.shri];let clean=p.shri.replace(/[^a-zA-Z0-9]/g,'_');let avatar=photo?`<img src="${photo}">`:`${getInitial(p.name)}`;let slNo=start+i+1;gridHtml+=`<div class="gCard"><div class="gTop"><div class="gSL">${slNo}</div><div class="gPhoto" onclick="openPhoto('${p.shri}','${p.name}','circle')">${avatar}</div><div><div class="gName">${p.name}</div><div class="gAddrSmall">${p.addr||''}</div></div></div><div class="gRow"><span class="gLab">PMJAY</span><span class="gVal">${p.pmjay||'-'}</span></div><div class="gRow"><span class="gLab">SHRI</span><span class="gVal">${p.shri||'-'}</span></div><div class="gRow"><span class="gLab">Address</span><span class="gVal">${p.addr||'-'}</span></div><div class="gAct"><button class="e" onclick="openEdit(${realIdx})">Edit</button><button class="d" onclick="deletePatient(${realIdx})">Del</button></div><input type="file" id="file_${clean}" style="display:none" accept="image/*" onchange="uploadPhoto(this.files[0],'${p.shri}')"></div>`});
 document.getElementById('patientGrid').innerHTML=gridHtml;
 let html='<tr><th>SL</th><th>Photo</th><th>Patient Name</th><th>PMJAY ID</th><th>SHRI ID</th><th>Patient Address</th><th>Action</th></tr>';
 data.forEach((p,i)=>{let realIdx=allPatients.indexOf(p);let photo=photoCache[p.shri];let clean=p.shri.replace(/[^a-zA-Z0-9]/g,'_');let thumb=photo?`<img src="${photo}">`:`${getInitial(p.name)}`;let slNo=start+i+1;html+=`<tr><td><div class="nSL">${slNo}</div></td><td><div class="nPhoto" onclick="openPhoto('${p.shri}','${p.name}','square')">${thumb}</div><input type="file" id="file_${clean}" style="display:none" accept="image/*" onchange="uploadPhoto(this.files[0],'${p.shri}')"></td><td><div class="nName">${p.name}</div></td><td><span class="nBadge">${p.pmjay||'-'}</span></td><td><span class="nBadge">${p.shri||'-'}</span></td><td><span class="nAddr">${p.addr||'-'}</span></td><td><button class="nEdit" onclick="openEdit(${realIdx})">Edit</button><button class="nDel" onclick="deletePatient(${realIdx})">Del</button></td></tr>`});
 document.getElementById('tbl').innerHTML=html;
 document.getElementById('info').textContent=filtered.length+' Patients • New Design • Page '+currentPage;
 document.getElementById('pageInfo').textContent='Page '+currentPage+' / '+totalPages;
};
window.prevPage=()=>{if(currentPage>1){currentPage--;renderAll()}};
window.nextPage=()=>{let tp=Math.ceil(filtered.length/pageSize);if(currentPage<tp){currentPage++;renderAll()}};
window.setView=(v)=>{document.getElementById('gridBtn').classList.toggle('active',v==='grid');document.getElementById('tableBtn').classList.toggle('active',v==='table');document.getElementById('patientGrid').classList.toggle('hidden',v!=='grid');document.getElementById('tableWrap').classList.toggle('hidden',v!=='table');renderAll()};
window.deletePatient=async(idx)=>{let p=allPatients[idx];if(!confirm('DELETE '+p.name+'?'))return;let k=getKey(p);let l=getDeleted();l.push(k);localStorage.setItem('deletedKeys',JSON.stringify(l));p.deleted=true;applyFilter();try{await setDoc(doc(db,"patients",k),{deleted:true},{merge:true})}catch{}};
window.openEdit=(idx)=>{let p=allPatients[idx];let n=prompt('Name',p.name);if(n)p.name=n;renderAll()};
async function init(){
 let del=getDeleted();let edt=getEdited();let map={};
 function add(raw,over){let key=String(raw.shri||raw.id||raw.name).trim();if(!key)return;let isDel=del.includes(key)||raw.deleted;let obj={key,name:String(raw.patientName||raw.name||'').trim(),shri:String(raw.shri||raw.shriId||'').trim(),pmjay:String(raw.pmjay||raw.pmjayId||'').trim(),addr:String(raw.addr||raw.address||'').trim(),deleted:isDel};if(over||!map[key])map[key]=obj}
 if(typeof patientData!=='undefined')patientData.forEach(pd=>add(pd,false));
 try{let snap=await getDocs(collection(db,"patients"));snap.forEach(d=>{if(d.data().deleted){if(map[d.id])map[d.id].deleted=true;return}add({id:d.id,...d.data()},true)})}catch{}
 allPatients=Object.values(map).filter(p=>!p.deleted);allPatients.sort((a,b)=>a.name.localeCompare(b.name));applyFilter();setTimeout(loadPhotoCache,500)
}
init();
</script>
</body>
</html>
