<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UPLOAD FILES - EVERYDAY DISCHARGE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter}
html,body{background:#f8fafc;min-height:100vh;overflow-x:hidden}
body{display:flex}
.whiteBar{position:fixed;left:0;top:0;bottom:0;width:72px;min-width:72px;height:100vh;background:#0f172a;display:flex;flex-direction:column;z-index:90}
.mainWrap{flex:1;margin-left:72px;width:calc(100% - 72px);min-height:100vh}
.top{height:64px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:17px;color:#0f172a}
.menuBtnTop{width:40px;height:36px;background:#fff;border:none;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer}
.menuBtnTop span{width:20px;height:2.5px;background:#0f172a;border-radius:2px;display:block}
.btnBack{background:#fff!important;color:#0f172a!important;border:1.5px solid #cbd5e1!important;border-radius:6px!important;padding:8px 18px!important;font-weight:800!important;text-decoration:none!important}
.content{padding:14px;background:#f8fafc}
.dailyControls{background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:14px}
.filterLeft{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filterWrap{position:relative}
.filterBtn{padding:8px 12px;border-radius:8px;border:1.5px solid #e2e8f0;background:#fff;font-weight:800;font-size:12px;color:#0f172a;cursor:pointer;display:flex;align-items:center;gap:6px}
.filterBtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;transition:.2s}
.filterBtn.open svg{transform:rotate(180deg)}
.dropdown{position:absolute;top:110%;left:0;background:#fff;border:1.5px solid #e2e8f0;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;display:none;z-index:20;min-width:150px}
.dropdown.show{display:block}
.dropdown div{padding:8px 10px;border-radius:6px;cursor:pointer;font-weight:700;font-size:13px}
.dropdown div:hover{background:#f1f5f9}
.dateNav{display:flex;align-items:center;gap:4px;background:#fff;border:1.5px solid #e2e8f0;border-radius:8px;padding:2px 4px}
.dateArrow{width:28px;height:28px;border-radius:6px;border:1.5px solid #e2e8f0;background:#fff;cursor:pointer;display:grid;place-items:center;font-weight:900}
.dateNav input{border:none;font-weight:800;font-size:13px;width:125px;text-align:center;outline:0;background:#fff}
.pager{display:flex;gap:8px;align-items:center}
.pager button{padding:8px 14px;border-radius:6px;border:1.5px solid #e2e8f0;background:#fff;font-weight:800;cursor:pointer}
.pager button:disabled{opacity:.4}
.pager span{font-weight:800;font-size:13px}
.patientBlock{margin-bottom:20px}
.headerTop{background:#fff;border:1.5px solid #e2e8f0;border-radius:14px 14px 0 0;padding:12px 14px}
.pTitle{font-size:13px;font-weight:900;color:#0f172a}
.pTags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pTags span{background:#f8fafc;border:1px solid #e2e8f0;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;color:#64748b}
.uploadSection{position:relative;display:flex;gap:10px;flex-wrap:wrap;padding:12px 12px 62px;background:#fff;border:1.5px solid #e2e8f0;border-top:0;border-radius:0 0 14px 14px}
.uploadCol{flex:1;min-width:200px;max-width:360px;background:#f8fafc;border-radius:10px;padding:10px;border:1px solid #f1f5f9;display:flex;flex-direction:column;align-items:center}
.uploadCol b{font-size:10px;font-weight:900}
.yellowBox{width:100%;border:2px dashed #facc15;border-radius:8px;background:#fffef0;padding:8px;font-size:11px;font-weight:700;min-height:42px;height:42px;display:flex;align-items:center;justify-content:center;cursor:pointer;text-align:center}
.yellowBox.uploaded{background:#f0fdf4!important;border-color:#86efac!important;border-style:solid!important}
.delIcon{width:26px;min-width:26px;height:26px;background:#fff;border:1.5px solid #e2e8f0;border-radius:6px;display:grid;place-items:center;cursor:pointer;margin-left:6px}
.delIcon svg{width:11px;height:11px;stroke:#94a3b8;stroke-width:2;fill:none}
.bottomBar{position:absolute;bottom:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center}
.leftActions{display:flex;gap:6px}
.rightActions{position:relative;margin-left:auto;display:flex;align-items:center}
.btn{padding:8px 14px;border-radius:8px;border:0;font-weight:800;font-size:11px;cursor:pointer}
.btnEdit{background:#fff;border:1.5px solid #e2e8f0!important;color:#0f172a}
.btnSave{background:#22c55e;color:#fff;border:1.5px solid #16a34a}
.btnYellow{background:#facc15;color:#000;border:1.5px solid #eab308}
.claimSlide{position:absolute;right:100%;top:50%;margin-right:8px;transform:translateY(-50%) translateX(15px);width:260px;background:#fff;border:1.5px solid #e2e8f0;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:7px 8px;display:flex;gap:6px;align-items:center;opacity:0;pointer-events:none;transition:.3s;z-index:20}
.claimSlide.open{opacity:1;pointer-events:auto;transform:translateY(-50%) translateX(0)}
.claimInput{border:2px solid #6366f1;border-radius:8px;padding:7px 9px;font-weight:800;flex:1;background:#f0f4ff;outline:0;font-size:11px}
#fileModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;align-items:center;justify-content:center;padding:16px}
#fileModal.show{display:flex}
.popupCard{background:#fff;border-radius:12px;width:92%;max-width:700px;max-height:88vh;overflow:hidden;display:flex;flex-direction:column}
.popupHead{padding:10px 12px;background:#0f172a;color:#fff;display:flex;justify-content:space-between;align-items:center}
.popupBody{flex:1;overflow:auto;background:#f8fafc;display:grid;place-items:center}
.popupBody iframe{width:100%;height:68vh;border:0}
.popupBody img{max-width:100%;max-height:68vh;border-radius:8px}
.sMenu{display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:12px}
.sMenu a{width:42px;height:42px;display:grid;place-items:center;border-radius:10px;color:#94a3b8;text-decoration:none}
.sMenu a.active{background:#3c25eb;color:#fff}
.sMenu a svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app=initializeApp(cfg,"everyday_upload");
const db=getFirestore(app);
window._fb={db,collection,getDocs,doc,setDoc,deleteDoc,CHUNK_SIZE:800000};
</script>
</head>
<body>
<div class="whiteBar"><div class="sMenu">
<a href="index.html"><svg viewBox="0 0 24 24"><path d="M3 9L12 2l9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></a>
<a href="discharge.html" class="active"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></svg></a>
<a href="claim.html"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg></a>
</div></div>
<div class="mainWrap">
<div class="top"><div class="logo"><button class="menuBtnTop"><span></span><span></span><span></span></button> UPLOAD FILES</div><a href="discharge.html" class="btnBack">← BACK</a></div>
<div class="content">
<div class="dailyControls">
<div class="filterLeft">
<div class="dateNav"><button class="dateArrow" onclick="changeDate(-1)">◀</button><input type="date" id="fDate"><button class="dateArrow" onclick="changeDate(1)">▶</button></div>
<div class="filterWrap"><button class="filterBtn" id="timeBtn" onclick="toggleDrop('timeDrop','timeBtn')">TIME <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button><div class="dropdown" id="timeDrop"><div onclick="setTime('All')">All Time</div><div onclick="setTime('7AM')">7AM</div><div onclick="setTime('12PM')">12PM</div><div onclick="setTime('5PM')">5PM</div><div onclick="setTime('9PM')">9PM</div></div></div>
<div class="filterWrap"><button class="filterBtn" id="blockBtn" onclick="toggleDrop('blockDrop','blockBtn')">BLOCK <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button><div class="dropdown" id="blockDrop"><div onclick="setBlock('All')">All Blocks</div><div onclick="setBlock('MAIN')">MAIN</div><div onclick="setBlock('ITOCHA')">ITOCHA</div></div></div>
</div>
<div class="pager"><button id="prevBtn" onclick="prevPage()">PREV</button><span id="pageInfo">1 / 1</span><button id="nextBtn" onclick="nextPage()">NEXT</button></div>
</div>
<div id="allPatients"><div style="background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:20px;text-align:center;font-weight:700">Loading everyday discharge patients...</div></div>
</div>
</div>
<div id="fileModal"><div class="popupCard"><div class="popupHead"><b id="modalName">FILE</b><div style="display:flex;gap:6px"><button class="btn" style="background:#3c25eb;color:#fff" onclick="downloadCurrent()">Download</button><button class="btn" style="background:#fff;color:#000" onclick="closeModal()">CLOSE</button></div></div><div id="paperBox" class="popupBody"></div></div></div>
<input type="file" id="hiddenFile" style="display:none">

<script>
function toggleDrop(id,btn){document.querySelectorAll('.dropdown').forEach(d=>{if(d.id!==id)d.classList.remove('show')});document.querySelectorAll('.filterBtn').forEach(b=>{if(b.id!==btn)b.classList.remove('open')});document.getElementById(id).classList.toggle('show');document.getElementById(btn).classList.toggle('open');}
let all=[],filtered=[],currentPage=1,perPage=3,docsCache={},fTime='All',fBlock='All';
function getToday(){return new Date().toISOString().slice(0,10);}
async function loadAll(){
let snap=await window._fb.getDocs(window._fb.collection(window._fb.db,"discharges"));
all=[];snap.forEach(d=>{let o=d.data();o._id=d.id;if(!o.claimId)all.push(o);});
let snap2=await window._fb.getDocs(window._fb.collection(window._fb.db,"patient_docs"));
docsCache={};snap2.forEach(d=>{let data=d.data();data._id=d.id;let k=data.shri||data.shriId;if(!k)return;if(!docsCache[k])docsCache[k]=[];docsCache[k].push(data);});
document.getElementById('fDate').value=getToday();
applyFilter();
}
function applyFilter(){
let date=document.getElementById('fDate').value;
filtered=all.filter(p=>{if(date&&p.date!==date)return false;if(fTime!=='All'&& (p.time||'').toUpperCase()!==fTime.toUpperCase())return false;if(fBlock!=='All'&& (p.block||'').toUpperCase()!==fBlock.toUpperCase())return false;return true;});
filtered.sort((a,b)=>new Date(b.dischargedAt||0)-new Date(a.dischargedAt||0));
currentPage=1;renderPage();
}
function setTime(t){fTime=t;document.getElementById('timeDrop').classList.remove('show');document.getElementById('timeBtn').classList.remove('open');document.getElementById('timeBtn').innerHTML=(t==='All'?'TIME':t)+' <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';applyFilter();}
function setBlock(b){fBlock=b;document.getElementById('blockDrop').classList.remove('show');document.getElementById('blockBtn').classList.remove('open');document.getElementById('blockBtn').innerHTML=(b==='All'?'BLOCK':b)+' <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';applyFilter();}
function changeDate(d){let inp=document.getElementById('fDate');let base=inp.value?new Date(inp.value):new Date();base.setDate(base.getDate()+d);inp.value=base.toISOString().slice(0,10);applyFilter();}
document.getElementById('fDate').addEventListener('change',applyFilter);
function renderPage(){
let total=Math.ceil(filtered.length/perPage)||1;
if(currentPage>total)currentPage=total;
document.getElementById('pageInfo').textContent=currentPage+' / '+total;
document.getElementById('prevBtn').disabled=currentPage<=1;
document.getElementById('nextBtn').disabled=currentPage>=total;
let start=(currentPage-1)*perPage;
let pageData=filtered.slice(start,start+perPage);
let html='';
pageData.forEach(p=>{
let shri=p.shri||p.shriId||'';let pmjay=p.pmjayCmhtId||p.pmjayId||p.pmjay||'';let docs=docsCache[shri]||[];let get=(t)=>docs.find(d=>d.type===t);
let s=get('discharge_summary');let ph=get('discharge_photo');let fb=get('feedback_form');
html+=`<div class="patientBlock">
<div class="headerTop"><div class="pTitle">PATIENT</div><div class="pTags"><span>SHRI: ${shri||'-'}</span><span>PMJAY: ${pmjay||'-'}</span><span>DATE: ${p.date||'-'} • TIME: ${p.time||'-'} • BLOCK: ${p.block||'-'}</span></div></div>
<div class="uploadSection" data-shri="${shri}" data-id="${p._id}" data-name="${(p.patientName||'').replace(/"/g,'')}" data-pmjay="${pmjay}">
<div class="uploadCol"><b>DISCHARGE SUMMARY</b><div style="display:flex;width:100%;margin-top:8px"><div class="yellowBox ${s?'uploaded':''}" onclick="handleBox('${shri}','discharge_summary')">${s?s.fileName:'Click or Drop'}</div><button class="delIcon" onclick="delFile('${shri}','discharge_summary')"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div></div>
<div class="uploadCol"><b>DISCHARGE PHOTO</b><div style="display:flex;width:100%;margin-top:8px"><div class="yellowBox ${ph?'uploaded':''}" onclick="handleBox('${shri}','discharge_photo')">${ph?ph.fileName:'Click or Drop'}</div><button class="delIcon" onclick="delFile('${shri}','discharge_photo')"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div></div>
<div class="uploadCol"><b>FEEDBACK FORM</b><div style="display:flex;width:100%;margin-top:8px"><div class="yellowBox ${fb?'uploaded':''}" onclick="handleBox('${shri}','feedback_form')">${fb?fb.fileName:'Click or Drop'}</div><button class="delIcon" onclick="delFile('${shri}','feedback_form')"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div></div>
<div class="bottomBar"><div class="leftActions"><button class="btn btnEdit" onclick="editP('${shri}')">EDIT</button><button class="btn btnSave" onclick="saveP('${shri}')">SAVE</button></div><div class="rightActions"><div id="claim_${shri}" class="claimSlide"><input id="inp_${shri}" class="claimInput" placeholder="CLAIM ID"><button class="btn btnSave" onclick="doClaim('${shri}','${p._id}')">ADD</button><button class="btn btnEdit" onclick="toggleClaim('${shri}')">✕</button></div><button class="btn btnYellow" onclick="toggleClaim('${shri}')">CLAIM</button></div></div>
</div></div>`;
});
if(html==='')html='<div style="background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:30px;text-align:center;font-weight:800;color:#64748b">No discharge patients for '+document.getElementById('fDate').value+'<br><small>Add patients from discharge.html</small></div>';
document.getElementById('allPatients').innerHTML=html;
}
function prevPage(){if(currentPage>1){currentPage--;renderPage();}}
function nextPage(){let t=Math.ceil(filtered.length/perPage)||1;if(currentPage<t){currentPage++;renderPage();}}
let pendShri=null,pendType=null;
function handleBox(shri,type){let docs=docsCache[shri]||[];let d=docs.find(x=>x.type===type);if(d)openFile(shri,type);else trig(shri,type);}
function editP(shri){trig(shri,'discharge_summary');}
function saveP(shri){alert('✓ Saved '+(docsCache[shri]?.length||0)+' files for '+shri);}
function trig(shri,type){pendShri=shri;pendType=type;let i=document.getElementById('hiddenFile');i.value='';i.click();}
document.getElementById('hiddenFile').addEventListener('change',async function(){
let file=this.files[0];if(!file||!pendShri)return;
let shri=pendShri,type=pendType;let sec=document.querySelector(`.uploadSection[data-shri="${shri}"]`);let pname=sec?.dataset.name||'';let pmjay=sec?.dataset.pmjay||'';
let clean=shri.replace(/[^a-zA-Z0-9]/g,'_');
let b64=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});
let id=clean+'_'+type+'_'+Date.now();let chunks=[];for(let i=0;i<b64.length;i+=window._fb.CHUNK_SIZE){chunks.push(b64.substring(i,i+window._fb.CHUNK_SIZE));}
await window._fb.setDoc(window._fb.doc(window._fb.db,'patient_docs',id),{type:type,shri:shri,fileName:file.name,createdAt:Date.now(),saved:true});
for(let j=0;j<chunks.length;j++){await window._fb.setDoc(window._fb.doc(window._fb.db,'patient_docs',id,'chunks',String(j)),{index:j,data:chunks[j]});}
if(!docsCache[shri])docsCache[shri]=[];docsCache[shri]=docsCache[shri].filter(x=>x.type!==type);docsCache[shri].push({_id:id,type:type,shri:shri,fileName:file.name});renderPage();
});
async function getFull(id){let snap=await window._fb.getDocs(window._fb.collection(window._fb.db,'patient_docs',id,'chunks'));let arr=[];snap.forEach(d=>arr.push(d.data()));arr.sort((a,b)=>a.index-b.index);return arr.map(a=>a.data).join('');}
async function openFile(shri,type){let docs=docsCache[shri]||[];let doc=docs.find(d=>d.type===type);if(!doc)return;let data=await getFull(doc._id);window._fb.curData=data;window._fb.curName=doc.fileName;document.getElementById('modalName').textContent=doc.fileName;let box=document.getElementById('paperBox');if(data.startsWith('data:application/pdf')||doc.fileName.toLowerCase().endsWith('.pdf'))box.innerHTML='<iframe src="'+data+'"></iframe>';else box.innerHTML='<img src="'+data+'">';document.getElementById('fileModal').style.display='flex';document.getElementById('fileModal').classList.add('show');}
function closeModal(){document.getElementById('fileModal').style.display='none';}
function downloadCurrent(){let a=document.createElement('a');a.href=window._fb.curData;a.download=window._fb.curName;a.click();}
async function delFile(shri,type){let docs=docsCache[shri]||[];let doc=docs.find(d=>d.type===type);if(!doc)return;if(!confirm('Delete '+doc.fileName+' ?'))return;let csnap=await window._fb.getDocs(window._fb.collection(window._fb.db,'patient_docs',doc._id,'chunks'));for(let c of csnap.docs){await window._fb.deleteDoc(window._fb.doc(window._fb.db,'patient_docs',doc._id,'chunks',c.id));}await window._fb.deleteDoc(window._fb.doc(window._fb.db,'patient_docs',doc._id));docsCache[shri]=docsCache[shri].filter(x=>x._id!==doc._id);renderPage();}
function toggleClaim(shri){document.getElementById('claim_'+shri).classList.toggle('open');}
async function doClaim(shri,did){let inp=document.getElementById('inp_'+shri);let cid=inp.value.trim().toUpperCase();if(!cid){alert('Enter CLAIM ID');return;}await window._fb.setDoc(window._fb.doc(window._fb.db,'discharges',did),{claimId:cid,claimedAt:new Date().toISOString(),status:'claimed'},{merge:true});all=all.filter(x=>x._id!==did);applyFilter();alert('✓ '+cid+' moved to claim.html');}
window.addEventListener('load',()=>{setTimeout(loadAll,700);document.getElementById('fileModal').addEventListener('click',e=>{if(e.target.id==='fileModal')closeModal();});});
window.addEventListener('click',e=>{if(!e.target.closest('.filterWrap')){document.querySelectorAll('.dropdown').forEach(d=>d.classList.remove('show'));document.querySelectorAll('.filterBtn').forEach(b=>b.classList.remove('open'));}});
</script>
</body>
</html>
