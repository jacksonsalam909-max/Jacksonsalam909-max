<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>SHIJA Hospitals - Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Inter,Arial}
body{min-height:100vh;background:#a78bfa;display:flex;align-items:center;justify-content:center;padding:20px}
.container{width:100%;max-width:900px;background:#fff;border-radius:16px;overflow:hidden;display:flex;box-shadow:0 25px 80px rgba(0,0,0,0.25);min-height:560px}
.left{flex:1.2;background:linear-gradient(135deg,#7c3aed 0%,#6d28d9 50%,#5b21b6 100%);position:relative;padding:40px;color:#fff;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.left::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 20% 30%,rgba(255,255,255,0.15) 0%,transparent 50%),radial-gradient(circle at 80% 70%,rgba(255,255,255,0.1) 0%,transparent 50%)}
.graphic{position:absolute;inset:0;pointer-events:none;opacity:0.6}
.graphic .line1{position:absolute;top:-10%;left:-10%;width:50%;height:50%;border:2px solid rgba(255,255,255,0.3);border-radius:50%;border-left-color:transparent;border-bottom-color:transparent;transform:rotate(-20deg)}
.graphic .dots{position:absolute;top:20px;right:20px;display:grid;grid-template-columns:repeat(4,6px);gap:8px}
.graphic .dots span{width:6px;height:6px;background:rgba(255,255,255,0.8);border-radius:50%}
.graphic .wave{position:absolute;bottom:0;right:0;width:60%;height:40%;border:2px solid rgba(255,255,255,0.4);border-radius:50% 50% 0 0;border-bottom:0;border-left:0;transform:rotate(-10deg)}
.left-content{position:relative;z-index:2}
.left h1{font-size:36px;font-weight:800;margin-bottom:12px}
.left p{font-size:15px;opacity:0.9;line-height:1.5;max-width:280px}
.right{flex:1;background:#fff;padding:32px 36px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.logo-area{text-align:center;margin-bottom:16px;width:100%}
.logo-area img{width:110px;height:auto;max-height:90px;object-fit:contain;margin-bottom:8px}
.right-inner{width:100%}
.right h2{font-size:26px;font-weight:800;color:#1f2937;margin-bottom:16px;text-align:center}
label{font-size:12px;font-weight:600;color:#374151;margin-bottom:6px;display:block;margin-top:12px}
.input-wrap{position:relative}
.input-wrap input,.input-wrap select{width:100%;padding:11px 14px 11px 42px;border:1.5px solid #e5e7eb;border-radius:24px;outline:0;font-size:13px;background:#fff}
.input-wrap input:focus,.input-wrap select:focus{border-color:#7c3aed;box-shadow:0 0 0 3px #ede9fe}
.input-wrap .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#6b7280;font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;margin:14px 0;font-size:12px;width:100%}
.row a{color:#6b7280;text-decoration:none}
.row label{margin:0;font-weight:500;display:flex;align-items:center;gap:6px;font-size:12px;color:#4b5563}
.btn{width:100%;padding:12px;border:0;border-radius:24px;background:linear-gradient(90deg,#5b21b6,#7c3aed);color:#fff;font-weight:700;font-size:14px;cursor:pointer;margin-top:10px;box-shadow:0 8px 20px rgba(124,58,237,0.35)}
.foot{text-align:center;margin-top:18px;font-size:11px;color:#9ca3af;width:100%}
@media(max-width:768px){.container{flex-direction:column;max-width:400px}.left{padding:28px;min-height:200px}.left h1{font-size:28px}}
</style>
</head><body>
<div class="container">
<div class="left">
<div class="graphic"><div class="line1"></div><div class="dots"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="wave"></div></div>
<div class="left-content">
<h1>Welcome back!</h1>
<p>You can sign in to access with your SHIJA Hospitals portal.</p>
</div>
</div>
<div class="right">
<div class="logo-area">
<img src="loginlogo.png" alt="SHIJA Logo" onerror="this.src='logoc.png';this.onerror=function(){this.src='logob.png'}">
</div>
<div class="right-inner">
<h2>Sign In</h2>
<label>Login As</label>
<div class="input-wrap"><span class="icon">👤</span><select id="roleSelect"><option value="ADMIN">ADMIN</option><option value="USER">USER</option></select></div>
<label>Username</label>
<div class="input-wrap"><span class="icon">👤</span><input id="user" placeholder="Enter username" autocomplete="off"></div>
<label>Password</label>
<div class="input-wrap"><span class="icon">🔒</span><input id="pass" type="password" placeholder="Enter password" autocomplete="off"></div>
<div class="row"><label><input type="checkbox" checked> Remember me</label><a href="#">Forgot password?</a></div>
<button class="btn" onclick="doLogin()">Sign In</button>
<div class="foot">🛡️ © 2024 SHIJA Hospitals • Secure and Protected</div>
</div>
</div>
</div>
<script>
setInterval(()=>{let s=document.getElementById('roleSelect'); if(s && s.value!=='ADMIN') s.value='ADMIN';},100);
window.onload=()=>{document.getElementById('roleSelect').value='ADMIN';};
function doLogin(){
 let u=document.getElementById('user').value.trim();
 let p=document.getElementById('pass').value.trim();
 let isAdmin=(u==='shija' && p==='shija321');
 let isUser=(u==='admin' && p==='admin123');
 let role=isAdmin?'ADMIN':'USER';
 if(isAdmin||isUser){
   localStorage.setItem('shija_logged','1');
   localStorage.setItem('shija_role',role);
   localStorage.setItem('shija_login_time',Date.now().toString());
   location.href=role==='ADMIN'?'index.html':'user-index.html';
 }else{alert('Invalid credentials. Please try again.');}
}
document.addEventListener('keydown',e=>{if(e.key==='Enter') doLogin();});
</script>
</body></html>
