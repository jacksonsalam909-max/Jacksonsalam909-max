<input type="file" id="hiddenFile" style="display:none">

<script>
let allDischarge=[], filtered=[], currentPage=1, perPage=3;
let docsCache={};
function formatName(n){if(!n) return '';return String(n).trim().split(/\s+/).join('  ');}
async function loadAll(){
let snap=await window._fb.getDocs(window._fb.collection(window._fb.db,"discharges"));
allDischarge=[];
snap.forEach(d=>{let data=d.data();data._id=d.id;if(!data.claimId){allDischarge.push(data);}});
allDischarge.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
let snap2=await window._fb.getDocs(window._fb.collection(window._fb.db,"patient_docs"));
docsCache={};
snap2.forEach(d=>{let data=d.data();data._id=d.id;if(!docsCache[data.shri])docsCache[data.shri]=[];docsCache[data.shri].push(data);});
await autoDeleteExpired();
filtered=[...allDischarge];
renderPage();
}
async function autoDeleteExpired(){
let now=Date.now(),limit=48*60*60*1000;
for(let shri in docsCache){
for(let doc of [...docsCache[shri]]){
if(doc.createdAt && (now-doc.createdAt)>limit){
try{
let csnap=await window._fb.getDocs(window._fb.collection(window._fb.db,'patient_docs',doc._id,'chunks'));
for(let c of csnap.docs){await window._fb.deleteDoc(window._fb.doc(window._fb.db,'patient_docs',doc._id,'chunks',c.id));}
await window._fb.deleteDoc(window._fb.doc(window._fb.db,'patient_docs',doc._id));
docsCache[shri]=docsCache[shri].filter(x=>x._id!==doc._id);
}catch(e){}
}
}
}
}
function filterSearch(){
let q=document.getElementById('searchInput').value.toLowerCase().trim();
if(!q) filtered=[...allDischarge];
else filtered=allDischarge.filter(x=> (x.shri||'').toLowerCase().includes(q) || (x.patientName||'').toLowerCase().includes(q) || (x.pmjay||'').toLowerCase().includes(q) );
currentPage=1; renderPage();
}
function renderPage(){
let total=Math.ceil(filtered.length/perPage)||1;
if(currentPage>total) currentPage=total;
document.getElementById('pageInfo').textContent=currentPage+' / '+total;
document.getElementById('prevBtn').disabled=currentPage<=1;
document.getElementById('nextBtn').disabled=currentPage>=total;
let start=(currentPage-1)*perPage;
let pageData=filtered.slice(start,start+perPage);
let html='';
pageData.forEach(p=>{
let shri=p.shri||'';
let docs=docsCache[shri]||[];
let getFile=(t)=>docs.find(d=>d.type===t);
let summary=getFile('discharge_summary');
let photo=getFile('discharge_photo');
let feedback=getFile('feedback_form');
html+=`
<div class="patientBlock">
<div class="headerTop">
<div class="pName">PATIENT</div>
<div class="pMeta">
<span>SHRI: ${shri}</span>
<span>PMJAY: ${p.pmjay||'-'}</span>
<span>DATE: ${p.date||'-'} • TIME: ${p.time||'-'} • BLOCK: ${p.block||'-'}</span>
</div>
</div>
<div class="uploadSection" data-shri="${shri}" data-name="${(p.patientName||'').replace(/"/g,'&quot;')}" data-pmjay="${p.pmjay||''}" data-id="${p._id}">
<div class="uploadCol"><b>DISCHARGE SUMMARY</b><div style="display:flex;gap:6px;width:100%;margin-top:8px;align-items:center"><div class="yellowBox ${summary?'uploaded':''}" data-type="discharge_summary" onclick="handleBoxClick('${shri}','discharge_summary')">${summary?summary.fileName:'Click or Drop'}</div><button class="delIcon" onclick="delFile('${shri}','discharge_summary')"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div></div>
<div class="uploadCol"><b>DISCHARGE PHOTO</b><div style="display:flex;gap:6px;width:100%;margin-top:8px;align-items:center"><div class="yellowBox ${photo?'uploaded':''}" data-type="discharge_photo" onclick="handleBoxClick('${shri}','discharge_photo')">${photo?photo.fileName:'Click or Drop'}</div><button class="delIcon" onclick="delFile('${shri}','discharge_photo')"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div></div>
<div class="uploadCol"><b>FEEDBACK FORM</b><div style="display:flex;gap:6px;width:100%;margin-top:8px;align-items:center"><div class="yellowBox ${feedback?'uploaded':''}" data-type="feedback_form" onclick="handleBoxClick('${shri}','feedback_form')">${feedback?feedback.fileName:'Click or Drop'}</div><button class="delIcon" onclick="delFile('${shri}','feedback_form')"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div></div>
<div class="bottomBar">
<div class="leftActions"><button class="btn btnEdit" onclick="editPatient('${shri}')">EDIT</button><button class="btn btnSave" onclick="savePatient('${shri}')">SAVE</button></div>
<div class="rightActions">
<div id="claimSlide_${shri}" class="claimSlideHorizontal"><input id="claimInput_${shri}" class="claimInput" placeholder="CLAIM ID"><button class="btn btnSave" onclick="saveClaim('${shri}','${p._id}')">ADD</button><button class="btn btnEdit" onclick="toggleClaim('${shri}')">✕</button></div>
<button class="btn btnYellow" onclick="toggleClaim('${shri}')">CLAIM</button>
</div>
</div>
</div>
</div>`;
});
if(html==='') html='<div style="background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:20px;text-align:center;font-weight:700;color:#64748b">No patients found</div>';
document.getElementById('allPatients').innerHTML=html;
setupDrop();
}
function prevPage(){if(currentPage>1){currentPage--; renderPage();}}
function nextPage(){let t=Math.ceil(filtered.length/perPage)||1; if(currentPage<t){currentPage++; renderPage();}}
let pendingShri=null, pendingType=null;
function handleBoxClick(shri,type){
let docs=docsCache[shri]||[]; let doc=docs.find(d=>d.type===type);
if(doc){openFile(shri,type);} else{triggerUpload(shri,type);}
}
function editPatient(shri){triggerUpload(shri,'discharge_summary');}
function savePatient(shri){let docs=docsCache[shri]||[];alert('✓ Saved '+docs.length+' files for '+shri);}
function triggerUpload(shri,type){pendingShri=shri; pendingType=type; let inp=document.getElementById('hiddenFile'); inp.value=''; inp.click();}
document.getElementById('hiddenFile').addEventListener('change', async function(){
let file=this.files[0]; if(!file||!pendingShri) return;
let shri=pendingShri, type=pendingType;
let section=document.querySelector(`.uploadSection[data-shri="${shri}"]`);
let pname=section?section.dataset.name:''; let pmjay=section?section.dataset.pmjay:'';
let clean=shri.replace(/[^a-zA-Z0-9]/g,'_');
let base64=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});
let id=clean+'_'+type+'_'+Date.now();
let chunks=[];for(let i=0;i<base64.length;i+=window._fb.CHUNK_SIZE){chunks.push(base64.substring(i,i+window._fb.CHUNK_SIZE));}
await window._fb.setDoc(window._fb.doc(window._fb.db,'patient_docs',id),{type:type,shri:shri,cleanShri:clean,patientName:pname,ip:pmjay,fileName:file.name,fileType:file.type,size:file.size,chunkCount:chunks.length,createdAt:Date.now(),expireAt:Date.now()+48*60*60*1000,saved:true});
for(let j=0;j<chunks.length;j++){await window._fb.setDoc(window._fb.doc(window._fb.db,'patient_docs',id,'chunks',String(j)),{index:j,data:chunks[j]});}
if(!docsCache[shri]) docsCache[shri]=[];
docsCache[shri]=docsCache[shri].filter(x=>x.type!==type);
docsCache[shri].push({_id:id,type:type,shri:shri,fileName:file.name,createdAt:Date.now()});
renderPage();
});
async function getFull(id){let snap=await window._fb.getDocs(window._fb.collection(window._fb.db,'patient_docs',id,'chunks'));let arr=[];snap.forEach(d=>arr.push(d.data()));arr.sort((a,b)=>a.index-b.index);return arr.map(a=>a.data).join('');}
async function openFile(shri,type){
let docs=docsCache[shri]||[]; let doc=docs.find(d=>d.type===type); if(!doc) return;
let data=await getFull(doc._id);
window._fb.curData=data; window._fb.curName=doc.fileName;
document.getElementById('modalName').textContent=doc.fileName;
let box=document.getElementById('paperBox');
if(data.startsWith('data:application/pdf')||doc.fileName.toLowerCase().endsWith('.pdf')){box.innerHTML='<iframe src="'+data+'"></iframe>';}else{box.innerHTML='<img src="'+data+'">';}
document.getElementById('fileModal').style.display='flex';document.getElementById('fileModal').classList.add('show');
}
function closeModal(){document.getElementById('fileModal').style.display='none';}
function downloadCurrent(){let a=document.createElement('a');a.href=window._fb.curData;a.download=window._fb.curName;a.click();}
async function delFile(shri,type){
let docs=docsCache[shri]||[]; let doc=docs.find(d=>d.type===type); if(!doc) return;
if(!confirm('Delete '+doc.fileName+' ?'))return;
let csnap=await window._fb.getDocs(window._fb.collection(window._fb.db,'patient_docs',doc._id,'chunks'));
for(let c of csnap.docs){await window._fb.deleteDoc(window._fb.doc(window._fb.db,'patient_docs',doc._id,'chunks',c.id));}
await window._fb.deleteDoc(window._fb.doc(window._fb.db,'patient_docs',doc._id));
docsCache[shri]=docsCache[shri].filter(x=>x._id!==doc._id);
renderPage();
}
function toggleClaim(shri){document.getElementById('claimSlide_'+shri).classList.toggle('open');}
async function saveClaim(shri,did){
let inp=document.getElementById('claimInput_'+shri);
let claimId=inp.value.trim().toUpperCase();
if(!claimId){alert('Enter CLAIM ID');return;}
await window._fb.setDoc(window._fb.doc(window._fb.db,'discharges',did),{claimId:claimId,claimedAt:new Date().toISOString(),status:'claimed'},{merge:true});
allDischarge=allDischarge.filter(x=>x._id!==did);
filtered=filtered.filter(x=>x._id!==did);
renderPage();
alert('✓ CLAIM ID '+claimId+' moved to CLAIM page');
}
function setupDrop(){
document.querySelectorAll('.uploadSection').forEach(sec=>{
sec.querySelectorAll('.yellowBox').forEach(box=>{
let type=box.dataset.type; let shri=sec.dataset.shri;
box.addEventListener('dragover',e=>{e.preventDefault(); box.style.borderColor='#3c25eb';});
box.addEventListener('dragleave',()=>box.style.borderColor='#facc15');
box.addEventListener('drop',async e=>{
e.preventDefault(); box.style.borderColor='#facc15';
let f=e.dataTransfer.files[0]; if(!f) return;
pendingShri=shri; pendingType=type;
let pname=sec.dataset.name, pmjay=sec.dataset.pmjay;
let clean=shri.replace(/[^a-zA-Z0-9]/g,'_');
let base64=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});
let id=clean+'_'+type+'_'+Date.now();
let chunks=[];for(let i=0;i<base64.length;i+=window._fb.CHUNK_SIZE){chunks.push(base64.substring(i,i+window._fb.CHUNK_SIZE));}
await window._fb.setDoc(window._fb.doc(window._fb.db,'patient_docs',id),{type:type,shri:shri,cleanShri:clean,patientName:pname,ip:pmjay,fileName:f.name,fileType:f.type,size:f.size,chunkCount:chunks.length,createdAt:Date.now(),expireAt:Date.now()+48*60*60*1000,saved:true});
for(let j=0;j<chunks.length;j++){await window._fb.setDoc(window._fb.doc(window._fb.db,'patient_docs',id,'chunks',String(j)),{index:j,data:chunks[j]});}
if(!docsCache[shri]) docsCache[shri]=[];
docsCache[shri]=docsCache[shri].filter(x=>x.type!==type);
docsCache[shri].push({_id:id,type:type,shri:shri,fileName:f.name,createdAt:Date.now()});
renderPage();
});
});
});
}
window.addEventListener('load',()=>{setTimeout(loadAll,600); document.getElementById('fileModal').addEventListener('click',e=>{if(e.target.id==='fileModal')closeModal();});});
</script>
</body>
</html>
