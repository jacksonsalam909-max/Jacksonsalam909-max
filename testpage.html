<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SHIJA - CHAT DESIGN I</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui}
body{background:#f1f5f9;display:flex;min-height:100vh}
.whiteBar{position:fixed;left:0;top:0;bottom:0;width:270px;height:100vh;background:#0f172a;color:#94a3b8;display:flex;flex-direction:column;justify-content:space-between;z-index:91;transition:transform .32s}
.whiteBar.folded{width:72px!important;min-width:72px!important}
.mainWrap{flex:1;margin-left:270px;transition:margin-left .32s;min-height:100vh;display:flex;flex-direction:column;background:#f1f5f9;width:calc(100% - 270px)}
.whiteBar.folded ~ .mainWrap{margin-left:72px;width:calc(100% - 72px)}
.sHead{padding:16px 12px;display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid #e2e8f0}
.sLogo{width:42px;height:42px;background:#fff;border-radius:12px;display:grid;place-items:center;border:1px solid #e2e8f0}
.sLogo img{width:100%;height:100%;object-fit:contain}
.sTitle b{color:#0f172a;font-size:16px;font-weight:900;display:block}
.sTitle span{font-size:9px;color:#64748b;font-weight:700}
.sMenu{flex:1;padding:8px;overflow-y:auto}
.sMenu a{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:10px;text-decoration:none;color:#94a3b8;font-size:12.5px;font-weight:600;margin-bottom:2px}
.sMenu a.active{background:#2563eb;color:#fff}
.sFoot{padding:12px;border-top:1px solid #1e293b;font-size:10px;color:#64748b}
.top{height:60px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:16px;color:#0f172a}
.menuBtnTop{width:40px;height:36px;background:#fff;border:0;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.menuBtnTop span{width:18px;height:2.5px;background:#0f172a;border-radius:2px;display:block}
.content{flex:1;padding:8px;display:flex;flex-direction:column;gap:8px}
.topFilters{background:#fff;border-radius:12px;padding:10px;border:1px solid #e2e8f0;display:flex;flex-direction:column;gap:8px}
.searchRow{display:flex;gap:6px}
.searchInput{flex:1;height:38px;border:1.5px solid #d0d9ea;background:#f4f7fd;padding:0 14px;border-radius:8px;font-weight:600;font-size:13px;outline:none}
.timePager{display:flex;align-items:center;gap:3px;background:#f4f7fd;border:1.5px solid #d0d9ea;border-radius:100px;padding:2px 3px;height:36px}
.pageBtnSmall{height:26px;min-width:24px;border-radius:100px;border:0;background:#fff;font-weight:900}
.pageIndicatorSmall{font-weight:900;font-size:11px;min-width:28px;text-align:center}
.row3{display:flex;gap:5px}
.dateBoxNew{display:flex;align-items:center;border:1.5px solid #cbd5e1;border-radius:8px;height:40px;background:#fff;flex:1.6}
.dateArrowBox{width:38px;height:100%;border:0;background:#f8fafc;border-right:1.5px solid #cbd5e1;font-size:20px;font-weight:800}
.dateArrowBox.right{border-right:0;border-left:1.5px solid #cbd5e1}
.dateMiddle{flex:1;display:flex;justify-content:space-between;padding:0 8px;align-items:center;font-weight:800;font-size:12px}
.dateBox2{flex:1;border-radius:8px;height:40px;display:flex;align-items:center;padding:0 6px;background:#f8fafc;border:1.5px solid #d0d9ea}
.dateBox2 select{border:0;width:100%;font-weight:700;font-size:12px;background:transparent;outline:none}
.chipsWrap{display:flex;gap:5px;overflow-x:auto;flex:1}
.chip{height:30px;padding:0 12px;border-radius:100px;border:1.5px solid #d0d9ea;background:#f4f7fd;font-weight:800;font-size:11px;white-space:nowrap}
.chip.on{background:#0f172a;color:#fff}
.viewIconSingle{width:32px;height:32px;border-radius:100px;border:1.5px solid #0f172a;background:#fff;display:flex;align-items:center;justify-content:center}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 12px;padding-bottom:80px}
.searchMeta{font-size:9.5px;font-weight:700;color:#5a7196;display:flex;justify-content:space-between}

/* DESIGN I - CHAT BUBBLE GRID */
.card{
  width:100%;min-height:132px;
  background:#fff;
  border-radius:18px 18px 18px 4px;
  padding:12px 12px 10px;
  display:flex;flex-direction:column;
  border:1px solid #e2e8f0;
  box-shadow:0 6px 18px rgba(15,23,42,0.08);
  position:relative;
}
.card::after{
  content:'';
  position:absolute;
  left:10px;bottom:-10px;
  width:16px;height:16px;
  background:#fff;
  border-left:1px solid #e2e8f0;
  border-bottom:1px solid #e2e8f0;
  clip-path:polygon(0 0, 100% 0, 0 100%);
  transform:rotate(-8deg);
}
.cardTop{display:flex;gap:10px;align-items:flex-start}
.avatarSq{
  width:44px!important;height:44px!important;min-width:44px!important;
  border-radius:50%!important;
  background:linear-gradient(135deg,#3b82f6,#2563eb)!important;
  display:flex!important;align-items:center!important;justify-content:center!important;
  font-size:18px!important;font-weight:900!important;color:#fff!important;
  box-shadow:0 4px 10px rgba(37,99,235,0.3)!important;
}
.infoMain{flex:1;overflow:hidden}
.card .name{font-size:13px;font-weight:800;color:#0f172a;text-transform:uppercase;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmjayIdText{margin-top:3px;font-size:9.5px;font-weight:600;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timeText{font-size:10px;font-weight:600;color:#94a3b8;text-align:right;margin-top:6px}
.actions{display:flex;gap:8px;margin-top:auto;padding-top:10px}
.btnAct{flex:1;height:34px;border-radius:100px;font-weight:800;font-size:11.5px;display:flex;align-items:center;justify-content:center;border:1.5px solid #2563eb;cursor:pointer}
.btnPhoto{background:#2563eb;color:#fff;border-color:#2563eb}
.btnPhoto.done{background:#22c55e!important;border-color:#22c55e!important}
.btnOpd{background:#fff;color:#2563eb}
.btnOpd.done{background:#22c55e!important;color:#fff!important;border-color:#22c55e!important}

.grid.listView{grid-template-columns:1fr!important;display:flex!important;flex-direction:column!important;gap:14px}
.grid.listView .card{border-radius:20px 20px 20px 4px;min-height:78px;height:78px;flex-direction:row;align-items:center;padding:10px 14px}
.grid.listView .card::after{left:14px}
.grid.listView .cardTop{flex:1}
.grid.listView .timeText{margin-top:0;margin-left:8px}
.grid.listView .actions{min-width:120px;margin-left:auto;margin-top:0;padding-top:0}
.grid.listView .btnAct{height:30px;font-size:10.5px}

.bottomBar{position:fixed;bottom:0;left:270px;right:0;background:#fff;border-top:1px solid #e2e8f0;display:flex;justify-content:space-around;padding:5px 0;z-index:20}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9px;font-weight:700;color:#8aa0c5;cursor:pointer}
.tab .ic{width:22px;height:22px;border-radius:7px;background:#e2e8f0;display:flex;align-items:center;justify-content:center}
.tab.active{color:#0f172a}.tab.active .ic{background:#0f172a;color:#fff}
#confirmModal{position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,0.55)}.confirmBox{background:#fff;width:86%;max-width:320px;border-radius:16px;padding:20px 16px;text-align:center}
.confirmTitle{font-size:14px;font-weight:900}.confirmSub{font-size:11px;color:#6f84a8;margin:6px 0 16px}.confirmBtns{display:flex;gap:8px}.btnNoSure{flex:1;height:38px;border-radius:8px;border:1.5px solid #d0d9ea;background:#f4f7fd;font-weight:800}.btnSure{flex:1;height:38px;border-radius:8px;border:0;background:#0f172a;color:#fff;font-weight:800}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:90;display:none}#overlay.show{display:block}
@media(max-width:900px){
.whiteBar{transform:translateX(-100%)!important}.whiteBar.mOpen{transform:translateX(0)!important}
.mainWrap{margin-left:0!important;width:100%!important}
.bottomBar{left:0!important}
.content{padding:6px}
.grid{grid-template-columns:repeat(2,1fr)!important;gap:16px 8px}
}
</style>
</head>
<body>
<script>if(localStorage.getItem('shija_logged')!=='1'){location.href='login.html'}</script>
<div id="overlay"></div>
<div class="whiteBar" id="whiteBar"><div style="display:flex;flex-direction:column;height:100%"><div class="sHead"><div class="sLogo"><img src="logoc.png"></div><div class="sTitle"><b>SHIJA</b><span>DIALYSIS CARE</span></div></div><div class="sMenu"><a href="index.html"><span>HOME</span></a><a href="gda.html" class="active"><span>OFFICE ASSISTANT LIST</span></a></div></div><div class="sFoot">System Online</div></div>
<div class="mainWrap"><div class="top"><div class="logo"><button class="menuBtnTop" id="menuBtnTop"><span></span><span></span><span></span></button> SHIJA - OFFICE ASSISTANT</div></div>
<div class="content"><div class="topFilters"><div class="searchRow"><input id="searchName" class="searchInput" placeholder="Search name, SHRI or PMJAY..."><div class="timePager"><button class="pageBtnSmall" id="prevBtn">‹</button><div class="pageIndicatorSmall" id="pageIndicator">1/1</div><button class="pageBtnSmall" id="nextBtn">›</button></div></div><div class="row3"><div class="dateBoxNew"><button class="dateArrowBox" id="datePrev">‹</button><div class="dateMiddle" id="dateCenter"><span id="dateDisplay">03-11-2026</span><span>📅</span></div><button class="dateArrowBox right" id="dateNext">›</button></div><div class="dateBox2"><select id="filterBlock"><option value="">All Block</option><option value="MAIN">MAIN</option></select></div><div class="dateBox2"><select id="fType"><option>PMJAY</option><option>CMHT</option></select></div></div><input type="date" id="fDate" style="position:absolute;opacity:0;width:0;height:0;"><div style="display:flex;gap:8px;align-items:center"><div class="chipsWrap"><button class="chip on" data-time="">ALL</button><button class="chip" data-time="7:00 AM">7 AM</button><button class="chip" data-time="12:00 PM">12 PM</button><button class="chip" data-time="5:00 PM">5 PM</button></div><button id="toggleViewBtn" class="viewIconSingle">⊞</button></div><div class="searchMeta"><span id="searchInfo"></span><span id="doneMeta"></span></div></div><div class="grid" id="grid"></div></div><div class="bottomBar"><div class="tab active" id="tabHome"><div class="ic">⌂</div>Home</div><div class="tab" id="tabDone"><div class="ic">✓</div>Done <span id="doneB">0</span></div><div class="tab" id="tabSync"><div class="ic">↻</div>Sync</div></div></div>
<div id="confirmModal"><div class="confirmBox"><div class="confirmTitle" id="confirmTitle">Are you sure?</div><div class="confirmSub" id="confirmSub"></div><div class="confirmBtns"><button class="btnNoSure" id="btnNotSure">NOT SURE</button><button class="btnSure" id="btnSure">SURE</button></div></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
function toggleWhiteBar(){const bar=document.getElementById('whiteBar');const over=document.getElementById('overlay');if(window.innerWidth<=900){bar.classList.toggle('mOpen');over.classList.toggle('show');}else{bar.classList.toggle('folded');}}
document.getElementById('menuBtnTop').addEventListener('click',toggleWhiteBar);
document.getElementById('overlay').addEventListener('click',()=>{document.getElementById('whiteBar').classList.remove('mOpen');document.getElementById('overlay').classList.remove('show');});
function getTodayIST(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function formatDisplayDMY(s){if(!s)return'';let p=s.split('-');return `${p[2]}-${p[1]}-${p[0]}`;}
function addDays(s,days){let d=new Date(s+'T00:00:00');d.setDate(d.getDate()+days);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
let fDateEl=document.getElementById('fDate');fDateEl.value=new URLSearchParams(location.search).get('date')||getTodayIST();document.getElementById('dateDisplay').innerText=formatDisplayDMY(fDateEl.value);
document.getElementById('datePrev').addEventListener('click',()=>{fDateEl.value=addDays(fDateEl.value,-1);document.getElementById('dateDisplay').innerText=formatDisplayDMY(fDateEl.value);loadData();});
document.getElementById('dateNext').addEventListener('click',()=>{fDateEl.value=addDays(fDateEl.value,1);document.getElementById('dateDisplay').innerText=formatDisplayDMY(fDateEl.value);loadData();});
document.getElementById('dateCenter').addEventListener('click',()=>{try{fDateEl.showPicker()}catch(e){}});
fDateEl.addEventListener('change',()=>{document.getElementById('dateDisplay').innerText=formatDisplayDMY(fDateEl.value);loadData();});
let allPatients=[],statusMap={},activeTimeFilter='',searchQuery='',isListView=false,currentPage=1,pendingShri=null,pendingType=null;
if(localStorage.getItem('gda_view')==='list')isListView=true;
function getPageSize(){return isListView?12:12;}
function normalizeTime(t){let s=String(t).toUpperCase().trim();let m=s.match(/(\d{1,2})(?::(\d{1,2}))?\s*([AP]M)?/);if(!m)return s;let h=parseInt(m[1]),mi=m[2]?m[2].padStart(2,'0'):'00',ap=m[3]||'';if(!ap){if(s.includes('AM'))ap='AM';else if(s.includes('PM'))ap='PM';}return ap?`${h}:${mi} ${ap}`:`${h}:${mi}`;}
async function loadData(){try{let d=fDateEl.value,s=document.getElementById('fType').value,id=d+'_'+s;document.getElementById('doneMeta').innerText="Loading...";let snap=await db.collection('daily_dialysis_lists').doc(id).get();allPatients=snap.exists?(snap.data().patients||[]):[];let sSnap=await db.collection('daily_photo_opd').doc(id).get();statusMap=sSnap.exists?(sSnap.data().status||{}):{};render();}catch(e){document.getElementById('doneMeta').innerText="Error";}}
async function saveStatus(){let d=fDateEl.value,s=document.getElementById('fType').value,id=d+'_'+s;await db.collection('daily_photo_opd').doc(id).set({date:d,scheme:s,status:statusMap,updatedAt:new Date().toISOString()},{merge:true});}
function showConfirm(sh,type){pendingShri=sh;pendingType=type;let p=allPatients.find(x=>String(x.shri||'').toUpperCase()===sh);document.getElementById('confirmSub').innerText=(type==='photo'?'PHOTO':'OPD')+' for '+(p?p.name:sh);document.getElementById('confirmModal').style.display='flex';}
function hideConfirm(){document.getElementById('confirmModal').style.display='none';pendingShri=null;pendingType=null;}
async function confirmSure(){if(!pendingShri)return;let btn=document.getElementById('btnSure');btn.innerText='...';try{if(!statusMap[pendingShri])statusMap[pendingShri]={photoTaken:false,opdDone:false};if(pendingType==='photo')statusMap[pendingShri].photoTaken=true;else statusMap[pendingShri].opdDone=true;await saveStatus();hideConfirm();render();}finally{btn.innerText='SURE';}}
async function confirmNotSure(){if(!pendingShri)return;let btn=document.getElementById('btnNotSure');btn.innerText='...';try{if(statusMap[pendingShri]){if(pendingType==='photo')statusMap[pendingShri].photoTaken=false;else statusMap[pendingShri].opdDone=false;await saveStatus();}hideConfirm();render();}finally{btn.innerText='NOT SURE';}}
function getInit(n){let parts=String(n||'').trim().split(/\s+/);if(parts.length>=2)return (parts[0][0]+parts[1][0]).toUpperCase();return (n||'A').substring(0,2).toUpperCase();}
function getFiltered(){let tn=normalizeTime(activeTimeFilter);let bf=document.getElementById('filterBlock').value;let sq=searchQuery.toLowerCase().trim();return allPatients.filter(p=>{let sh=String(p.shri||'').toUpperCase();if(!sh)return false;if(activeTimeFilter&&normalizeTime(p.time)!==tn)return false;if(bf&&p.block!==bf)return false;let st=statusMap[sh]||{photoTaken:false,opdDone:false};if(st.photoTaken&&st.opdDone)return false;if(sq){let nl=String(p.name||'').toLowerCase();let sl=sh.toLowerCase();let pl=String(p.pmjayId||'').toLowerCase();if(!nl.includes(sq)&&!sl.includes(sq)&&!pl.includes(sq))return false;}return true;});}
function getPmjayId(p){return String(p.pmjayId||'').trim();}
function render(){
  let grid=document.getElementById('grid');grid.classList.toggle('listView',isListView);
  let filtered=getFiltered();let done=0;allPatients.forEach(p=>{let sh=String(p.shri||'').toUpperCase();let st=statusMap[sh];if(st&&st.photoTaken&&st.opdDone)done++;});
  let ps=getPageSize();let pages=Math.max(1,Math.ceil(filtered.length/ps));if(currentPage>pages)currentPage=pages;
  let items=filtered.slice((currentPage-1)*ps,currentPage*ps);
  grid.innerHTML='';
  items.forEach(p=>{
    let sh=String(p.shri||'').toUpperCase();let pmjay=getPmjayId(p);let st=statusMap[sh]||{photoTaken:false,opdDone:false};
    let photoClass=st.photoTaken?'btnAct btnPhoto done':'btnAct btnPhoto';let opdClass=st.opdDone?'btnAct btnOpd done':'btnAct btnOpd';
    let photoTxt=st.photoTaken?'✓ DONE':'PHOTO';let opdTxt=st.opdDone?'✓ DONE':'OPD';
    let div=document.createElement('div');div.className='card';
    div.innerHTML=`<div class="cardTop"><div class="avatarSq">${getInit(p.name)}</div><div class="infoMain"><div class="name">${p.name||''}</div><div class="pmjayIdText">SHRI ${sh} • PMJAY ${pmjay||'P8VNJY5Y4'}</div></div></div><div class="timeText">${p.time||'7AM'}</div><div class="actions"><button class="${photoClass}" data-shri="${sh}" data-type="photo">${photoTxt}</button><button class="${opdClass}" data-shri="${sh}" data-type="opd">${opdTxt}</button></div>`;
    grid.appendChild(div);
  });
  if(filtered.length===0)grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:24px;background:#fff;border-radius:12px;font-weight:700">All done ✓</div>`;
  document.getElementById('pageIndicator').innerText=`${currentPage}/${pages}`;document.getElementById('doneB').innerText=done;
  document.getElementById('searchInfo').innerText=`${filtered.length} patients • ${currentPage}/${pages}`;document.getElementById('doneMeta').innerText=`${done} done • ${filtered.length} pending`;
  document.querySelectorAll('.btnAct').forEach(btn=>{btn.addEventListener('click',()=>showConfirm(btn.dataset.shri,btn.dataset.type));});
}
document.querySelectorAll('.chip').forEach(c=>{c.addEventListener('click',()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');activeTimeFilter=c.dataset.time;currentPage=1;render();});});
document.getElementById('filterBlock')?.addEventListener('change',()=>{currentPage=1;render();});
document.getElementById('fType')?.addEventListener('change',loadData);
document.getElementById('tabSync')?.addEventListener('click',()=>location.reload());
document.getElementById('tabDone')?.addEventListener('click',()=>{let d=fDateEl.value,t=document.getElementById('fType').value;location.href='gdacompleted.html?date='+encodeURIComponent(d)+'&type='+encodeURIComponent(t);});
document.getElementById('tabHome')?.addEventListener('click',()=>location.href='index.html');
document.getElementById('toggleViewBtn')?.addEventListener('click',()=>{isListView=!isListView;localStorage.setItem('gda_view',isListView?'list':'grid');currentPage=1;render();});
document.getElementById('prevBtn')?.addEventListener('click',()=>{if(currentPage>1){currentPage--;render();}});
document.getElementById('nextBtn')?.addEventListener('click',()=>{let ps=getPageSize();let pages=Math.max(1,Math.ceil(getFiltered().length/ps));if(currentPage<pages){currentPage++;render();}});
document.getElementById('btnSure')?.addEventListener('click',confirmSure);
document.getElementById('btnNotSure')?.addEventListener('click',confirmNotSure);
document.getElementById('confirmModal')?.addEventListener('click',e=>{if(e.target.id==='confirmModal')hideConfirm();});
document.getElementById('searchName')?.addEventListener('input',e=>{searchQuery=e.target.value;currentPage=1;render();});
window.addEventListener('load',()=>setTimeout(loadData,300));
</script>
</body>
</html>
