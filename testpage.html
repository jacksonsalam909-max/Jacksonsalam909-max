<script>
var allDischarge=[],filtered=[],masterPatients=[],selectedPatient=null,currentPage=1,pageSize=12,isGrid=false;
const CHUNK_SIZE=800000;
function setView(mode){isGrid=(mode==='grid');var t=document.getElementById('tableWrap');var g=document.getElementById('gridWrap');var bl=document.getElementById('btnList');var bg=document.getElementById('btnGrid');if(isGrid){t.style.display='none';g.style.display='grid';bg.classList.add('active');bl.classList.remove('active');bg.style.background='#3c25eb';bg.style.color='#fff';bl.style.background='transparent';bl.style.color='#0f172a';}else{t.style.display='block';g.style.display='none';bl.classList.add('active');bg.classList.remove('active');bl.style.background='#3c25eb';bl.style.color='#fff';bg.style.background='transparent';bg.style.color='#0f172a';}render();}
function getDocsForShri(shri){try{return window._fb._docsCache[shri]||[];}catch(e){return [];}}
async function loadMaster(){masterPatients=[];var map={};function addToMap(raw){if(!raw)return;var shri=String(raw.shri||raw.shriId||'').trim().toUpperCase();var name=String(raw.name||raw.patientName||'').trim().toUpperCase();var pmjay=String(raw.pmjay||raw.pmjayId||'').trim().toUpperCase();if(!shri||map[shri])return;map[shri]={shri:shri,name:name||'UNKNOWN',pmjayId:pmjay};}try{if(typeof patientData!=='undefined'&&Array.isArray(patientData)){patientData.forEach(addToMap);}}catch(e){}try{if(window._fb&&window._fb.db){var snap=await window._fb.getDocs(window._fb.collection(window._fb.db,"patients"));snap.forEach(function(d){addToMap(d.data());});}}catch(e){}Object.keys(map).forEach(function(k){masterPatients.push(map[k]);});try{if(window._fb&&window._fb.db){var snap2=await window._fb.getDocs(window._fb.collection(window._fb.db,"patient_docs"));snap2.forEach(function(d){var data=d.data();data._id=d.id;if(!window._fb._docsCache[data.shri])window._fb._docsCache[data.shri]=[];window._fb._docsCache[data.shri].push(data);});}}catch(e){}}
async function loadAll(){try{if(!window._fb||!window._fb.db){setTimeout(loadAll,500);return;}var snap=await window._fb.getDocs(window._fb.collection(window._fb.db,'discharges'));allDischarge=[];snap.forEach(function(d){var o=d.data();o._id=d.id;allDischarge.push(o);});allDischarge.sort(function(a,b){return new Date(b.dischargedAt||0)-new Date(a.dischargedAt||0);});}catch(e){allDischarge=[];}applyFilter();}
function applyFilter(){var dateEl=document.getElementById('fDate');var date=dateEl?dateEl.value:'';if(!date){date=getToday();if(dateEl)dateEl.value=date;}var time=document.getElementById('fTime')?document.getElementById('fTime').value:'';var block=document.getElementById('fBlock')?document.getElementById('fBlock').value:'';var search=document.getElementById('fSearch')?document.getElementById('fSearch').value.toLowerCase().trim():'';pageSize=parseInt(document.getElementById('perPage').value)||12;filtered=allDischarge.filter(function(p){if(date&&p.date!==date)return false;if(time&&p.time!==time)return false;if(block&&p.block.toUpperCase()!==block.toUpperCase())return false;if(search){var s=(p.patientName||'')+" "+(p.shriId||'')+" "+(p.pmjayCmhtId||'');if(s.toLowerCase().indexOf(search)===-1)return false;}return true;});currentPage=1;render();}
function render(){var tbody=document.getElementById('tbody');var grid=document.getElementById('gridWrap');if(!tbody||!grid)return;tbody.innerHTML='';grid.innerHTML='';var totalPages=Math.max(1,Math.ceil(filtered.length/pageSize));if(currentPage>totalPages)currentPage=totalPages;var start=(currentPage-1)*pageSize;var page=filtered.slice(start,start+pageSize);document.getElementById('badgeD').innerText="Discharged - "+filtered.length+" (TODAY)";document.getElementById('pageInfo').innerText="Page "+currentPage+" of "+totalPages;if(page.length===0){var d=document.getElementById('fDate').value||getToday();tbody.innerHTML='<tr><td colspan="8" style="padding:20px;text-align:center">NO DISCHARGED FOR TODAY ('+d+')<br><br><button class="btn btnDark btnSmall" onclick="loadAll()">RETRY LOAD</button> <button class="btn btnSmall" style="background:#fff;border:1px solid #e2e8f0;margin-left:6px" onclick="filtered=allDischarge;render()">SHOW ALL</button></td></tr>';grid.innerHTML='<div style="padding:20px;text-align:center;grid-column:1/-1">NO DISCHARGED FOR TODAY ('+d+')<br><br><button class="btn btnDark btnSmall" onclick="loadAll()">RETRY</button></div>';return;}page.forEach(function(p,i){var pmjayShow=p.pmjayCmhtId||p.pmjayId||'';var shriVal=p.shriId||p.shri||'';var nameVal=p.patientName||p.name||'';var docs=getDocsForShri(shriVal);var mc={discharge_summary:0,discharge_photo:0,feedback_form:0};docs.forEach(function(d){if(mc.hasOwnProperty(d.type))mc[d.type]++;});var totalUp=mc.discharge_summary+mc.discharge_photo+mc.feedback_form;var cleanShri=String(shriVal).replace(/[^a-zA-Z0-9]/g,'_');var btnTxt=p.claimId?'EDIT':'Claim';var tr=document.createElement('tr');tr.id='tr_'+cleanShri;tr.innerHTML='<td>'+(start+i+1)+'</td><td style="text-align:left;padding-left:6px">'+nameVal+'</td><td><span class="shriGray">'+shriVal+'</span></td><td><span class="pmjayBlue">'+pmjayShow+'</span></td><td>'+(p.time||'')+'</td><td>'+(p.block||'')+'</td><td><button class="uploadBtnFold '+(totalUp>0?'done':'')+'" onclick="toggleSlideList(\''+cleanShri+'\')">'+(totalUp>0?'✓'+totalUp:'UPLOAD')+' ▼</button></td><td><div class="actionCell"><button class="claimBtn" onclick="openClaimInline(\''+p._id+'\')">'+btnTxt+'</button><div class="claimFold" id="fold-'+p._id+'"><input type="text" id="input-'+p._id+'" value="'+(p.claimId||'')+'"><button class="btn btnDark btnSmall" onclick="saveClaimInline(\''+p._id+'\')">ADD</button><button class="btn btnSmall" style="background:#fff;border:1px solid #e2e8f0" onclick="closeClaimInline(\''+p._id+'\')">✕</button></div><button class="delBtn" onclick="delDischarge(\''+p._id+'\')">X</button></div></td>';tbody.appendChild(tr);var slideTr=document.createElement('tr');slideTr.className='slideRow';slideTr.id='slide_'+cleanShri;slideTr.innerHTML='<td colspan="8" class="slideCell"><div class="slideInner"><div class="horizontalBtns"><div class="cardWrap"><div class="hCard summary '+(mc.discharge_summary?'done':'')+'" onclick="triggerUpload(\''+cleanShri+'\',\'discharge_summary\',\''+shriVal+'\')"><b>SUMMARY</b><div class="sub">'+(mc.discharge_summary?'✓':'Click')+'</div></div>'+(mc.discharge_summary?'<div class="delNextToCard" onclick="deleteSpecific(\''+shriVal+'\',\'discharge_summary\')">X</div>':'')+'</div><div class="cardWrap"><div class="hCard photo '+(mc.discharge_photo?'done':'')+'" onclick="triggerUpload(\''+cleanShri+'\',\'discharge_photo\',\''+shriVal+'\')"><b>PHOTO</b><div class="sub">'+(mc.discharge_photo?'✓':'Click')+'</div></div>'+(mc.discharge_photo?'<div class="delNextToCard" onclick="deleteSpecific(\''+shriVal+'\',\'discharge_photo\')">X</div>':'')+'</div><div class="cardWrap"><div class="hCard feedback '+(mc.feedback_form?'done':'')+'" onclick="triggerUpload(\''+cleanShri+'\',\'feedback_form\',\''+shriVal+'\')"><b>FEEDBACK</b><div class="sub">'+(mc.feedback_form?'✓':'Click')+'</div></div>'+(mc.feedback_form?'<div class="delNextToCard" onclick="deleteSpecific(\''+shriVal+'\',\'feedback_form\')">X</div>':'')+'</div></div><input type="file" id="file_'+cleanShri+'_discharge_summary" style="display:none" onchange="uploadFile(this.files[0],\''+shriVal+'\',\''+nameVal.replace(/\'/g,"\\'")+'\',\''+pmjayShow+'\',\'discharge_summary\')"><input type="file" id="file_'+cleanShri+'_discharge_photo" style="display:none" onchange="uploadFile(this.files[0],\''+shriVal+'\',\''+nameVal.replace(/\'/g,"\\'")+'\',\''+pmjayShow+'\',\'discharge_photo\')"><input type="file" id="file_'+cleanShri+'_feedback_form" style="display:none" onchange="uploadFile(this.files[0],\''+shriVal+'\',\''+nameVal.replace(/\'/g,"\\'")+'\',\''+pmjayShow+'\',\'feedback_form\')"></div></td>';tbody.appendChild(slideTr);var gc=document.createElement('div');gc.className='gridCard';gc.innerHTML='<div><div class="gridName">'+nameVal+'</div><div class="gridRow"><span>SHRI</span><b>'+shriVal+'</b></div><div class="gridRow"><span>PMJAY</span><b>'+pmjayShow+'</b></div><div class="gridRow"><span>TIME</span><b>'+(p.time||'')+'</b></div><div class="gridRow"><span>BLOCK</span><b>'+(p.block||'')+'</b></div></div><div style="margin-top:8px"><div style="display:flex;gap:5px"><button class="uploadBtnFold '+(totalUp>0?'done':'')+'" onclick="toggleSlideGrid(\''+cleanShri+'\')" style="flex:1">'+(totalUp>0?'✓'+totalUp:'UPLOAD')+' ▼</button><button class="claimBtn" onclick="openClaimInlineGrid(\''+p._id+'\')">'+btnTxt+'</button><button class="delBtn" onclick="delDischarge(\''+p._id+'\')">X</button></div><div id="gridDocs_'+cleanShri+'" style="display:none;flex-direction:column;gap:6px;margin-top:6px"><div style="display:flex;gap:6px"><div class="hCard summary '+(mc.discharge_summary?'done':'')+'" style="flex:1" onclick="triggerUpload(\''+cleanShri+'\',\'discharge_summary\',\''+shriVal+'\')"><b>SUMMARY</b></div><div class="hCard photo '+(mc.discharge_photo?'done':'')+'" style="flex:1" onclick="triggerUpload(\''+cleanShri+'\',\'discharge_photo\',\''+shriVal+'\')"><b>PHOTO</b></div><div class="hCard feedback '+(mc.feedback_form?'done':'')+'" style="flex:1" onclick="triggerUpload(\''+cleanShri+'\',\'feedback_form\',\''+shriVal+'\')"><b>FEEDBACK</b></div></div></div></div>';grid.appendChild(gc);});}
function changePage(d){var tp=Math.max(1,Math.ceil(filtered.length/pageSize));currentPage+=d;if(currentPage<1)currentPage=1;if(currentPage>tp)currentPage=tp;render();}
function clearFilters(){document.getElementById('fDate').value=getToday();document.getElementById('fTime').value='';document.getElementById('fBlock').value='';document.getElementById('fSearch').value='';applyFilter();}
function setupSearch(){var s=document.getElementById('searchTotal');var r=document.getElementById('searchResults');s.addEventListener('input',function(e){var q=e.target.value.toLowerCase().trim();if(q.length<1){r.classList.remove('open');return;}if(!masterPatients||masterPatients.length===0){r.innerHTML='<div class="sItem">Loading patients...</div>';r.classList.add('open');loadMaster().then(function(){s.dispatchEvent(new Event('input'));});return;}var f=masterPatients.filter(function(p){return (p.name+" "+p.shri+" "+p.pmjayId).toLowerCase().indexOf(q)!==-1;}).slice(0,30);if(f.length===0){r.innerHTML='<div class="sItem">No patient for "'+q+'"</div>';r.classList.add('open');return;}var html='';f.forEach(function(p){html+='<div class="sItem" onclick="openAddPanel(\''+p.shri+'\')"><div><div class="sName">'+p.name+'</div><div class="sMeta">SHRI: '+p.shri+' | PMJAY: '+p.pmjayId+'</div></div><div class="btn btnGreen btnSmall">SELECT</div></div>';});r.innerHTML=html;r.classList.add('open');});document.addEventListener('click',function(e){if(!e.target.closest('.searchBox')){document.getElementById('searchResults').classList.remove('open');}});}
function openAddPanel(shri){var p=masterPatients.find(function(x){return x.shri===shri;});if(!p)return;selectedPatient=p;document.getElementById('searchResults').classList.remove('open');document.getElementById('searchTotal').value='';document.getElementById('addPanelInfo').innerHTML='PATIENT: '+p.name+' | SHRI: '+p.shri+' | PMJAY: '+p.pmjayId;document.getElementById('addTimeSelect').value='';document.getElementById('addBlockSelect').value='';document.getElementById('addPanel').classList.add('open');}
function closeAddPanel(){document.getElementById('addPanel').classList.remove('open');selectedPatient=null;}
async function confirmAddDischarge(){var time=document.getElementById('addTimeSelect').value;var block=document.getElementById('addBlockSelect').value;if(!selectedPatient||!time||!block){alert('Select TIME and BLOCK');return;}var date=document.getElementById('fDate').value||getToday();var docId=date+"_"+selectedPatient.shri+"_"+Date.now();try{await window._fb.setDoc(window._fb.doc(window._fb.db,'discharges',docId),{date:date,shriId:selectedPatient.shri,shri:selectedPatient.shri,patientName:selectedPatient.name,name:selectedPatient.name,pmjayCmhtId:selectedPatient.pmjayId,pmjayId:selectedPatient.pmjayId,time:time,block:block,status:'DISCHARGE',dischargedAt:new Date().toISOString()});closeAddPanel();loadAll();}catch(e){alert(e.message);}}
async function delDischarge(id){if(!confirm('DELETE?'))return;try{await window._fb.deleteDoc(window._fb.doc(window._fb.db,'discharges',id));loadAll();}catch(e){alert(e.message);}}
function toggleSlideList(cleanShri){var slide=document.getElementById('slide_'+cleanShri);var isShow=slide&&slide.classList.contains('show');document.querySelectorAll('.slideRow').forEach(function(r){r.classList.remove('show');});if(!isShow){slide.classList.add('show');}}
function toggleSlideGrid(cleanShri){var d=document.getElementById('gridDocs_'+cleanShri);if(!d)return;d.style.display=d.style.display==='flex'?'none':'flex';}
function triggerUpload(cleanShri,type,shri){var docs=getDocsForShri(shri).filter(function(d){return d.type===type;});if(docs.length>0){openFileModal(docs[0]._id,shri);}else{document.getElementById('file_'+cleanShri+'_'+type).click();}}
async function uploadFile(file,shri,name,pmjay,type){if(!file)return;var cleanShri=shri.replace(/[^a-zA-Z0-9]/g,'_');var base64=await new Promise(function(res){var r=new FileReader();r.onload=function(){res(r.result);};r.readAsDataURL(file);});var id=cleanShri+'_'+type+'_'+Date.now();try{var chunks=[];for(var i=0;i<base64.length;i+=CHUNK_SIZE){chunks.push(base64.substring(i,i+CHUNK_SIZE));}await window._fb.setDoc(window._fb.doc(window._fb.db,'patient_docs',id),{type:type,shri:shri,patientName:name,ip:pmjay,fileName:file.name,fileType:file.type,size:file.size,chunkCount:chunks.length,createdAt:Date.now()});for(var j=0;j<chunks.length;j++){await window._fb.setDoc(window._fb.doc(window._fb.db,'patient_docs',id,'chunks',String(j)),{index:j,data:chunks[j]});}if(!window._fb._docsCache[shri])window._fb._docsCache[shri]=[];window._fb._docsCache[shri].push({_id:id,type:type,shri:shri,fileName:file.name});render();}catch(e){alert(e.message);}}
async function getFullData(id){try{var snap=await window._fb.getDocs(window._fb.collection(window._fb.db,'patient_docs',id,'chunks'));var arr=[];snap.forEach(function(d){arr.push(d.data());});arr.sort(function(a,b){return a.index-b.index;});return arr.map(function(a){return a.data;}).join('');}catch(e){return null;}}
async function openFileModal(id,shri){window._fb._currentZoom=1;window._fb._currentRotate=0;try{var snap=await window._fb.getDocs(window._fb.collection(window._fb.db,'patient_docs'));var meta=null;snap.forEach(function(d){if(d.id===id)meta=d.data();});if(!meta)return;var data=await getFullData(id);if(!data)return;document.getElementById('modalFileName').textContent=meta.fileName;var box=document.getElementById('paperBox');if(data.startsWith('data:application/pdf')){box.innerHTML='<iframe src="'+data+'"></iframe>';}else if(data.startsWith('data:image')){box.innerHTML='<img id="popImg" src="'+data+'">';}else{box.innerHTML='<a href="'+data+'" download="'+meta.fileName+'">Download</a>';}document.getElementById('fileModal').classList.add('show');document.getElementById('modalDownBtn').onclick=function(){var a=document.createElement('a');a.href=data;a.download=meta.fileName;a.click();};}catch(e){alert(e.message);}}
function zoomIn(){window._fb._currentZoom=Math.min(window._fb._currentZoom+0.2,3.5);applyZoom();}
function zoomOut(){window._fb._currentZoom=Math.max(window._fb._currentZoom-0.2,0.4);applyZoom();}
function resetZoom(){window._fb._currentZoom=1;window._fb._currentRotate=0;applyZoom();}
function rotateImg(){window._fb._currentRotate=(window._fb._currentRotate+90)%360;applyZoom();}
function applyZoom(){var img=document.getElementById('popImg');var scale=window._fb._currentZoom;var rot=window._fb._currentRotate||0;if(img)img.style.transform='scale('+scale+') rotate('+rot+'deg)';}
function closeModal(){document.getElementById('fileModal').classList.remove('show');}
async function delDoc(id,shri){var csnap=await window._fb.getDocs(window._fb.collection(window._fb.db,'patient_docs',id,'chunks'));for(var d of csnap.docs){await window._fb.deleteDoc(window._fb.doc(window._fb.db,'patient_docs',id,'chunks',d.id));}await window._fb.deleteDoc(window._fb.doc(window._fb.db,'patient_docs',id));if(window._fb._docsCache[shri])window._fb._docsCache[shri]=window._fb._docsCache[shri].filter(function(d){return d._id!==id;});render();}
async function deleteSpecific(shri,type){var docs=getDocsForShri(shri).filter(function(d){return d.type===type;});if(docs.length===0)return;await delDoc(docs[0]._id,shri);}
function openClaimInline(id){var f=document.getElementById('fold-'+id);document.querySelectorAll('.claimFold').forEach(function(x){if(x.id!=='fold-'+id&&x.id.indexOf('gfold')===-1)x.classList.remove('show');});f.classList.add('show');}
function closeClaimInline(id){document.getElementById('fold-'+id).classList.remove('show');}
function openClaimInlineGrid(id){var f=document.getElementById('gfold-'+id);if(f)f.classList.toggle('show');}
async function saveClaimInline(id){var claimId=document.getElementById('input-'+id).value.trim().toUpperCase();if(!claimId)return;var data=allDischarge.find(function(x){return x._id===id;});try{await window._fb.setDoc(window._fb.doc(window._fb.db,'discharges',id),{claimId:claimId},{merge:true});await window._fb.setDoc(window._fb.doc(window._fb.db,'claims',id),{...data,claimId:claimId},{merge:true});location.href='claim.html?claimId='+encodeURIComponent(claimId);}catch(e){alert(e.message);}}
</script>
<script>
document.addEventListener('DOMContentLoaded',function(){
  var fd=document.getElementById('fDate');
  if(fd) fd.value=getToday();
  filtered=[]; allDischarge=[];
  try{render();}catch(e){}
  setupSearch();
  setTimeout(function(){loadMaster().then(function(){loadAll();setView('list');});},400);
  document.getElementById('fTime').addEventListener('change',applyFilter);
  document.getElementById('fBlock').addEventListener('change',applyFilter);
  document.getElementById('perPage').addEventListener('change',applyFilter);
  document.getElementById('fSearch').addEventListener('input',applyFilter);
  if(fd) fd.addEventListener('change',applyFilter);
});
</script>
</body>
</html>
