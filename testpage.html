<script>
function toggleWhiteBar(){
  var bar=document.getElementById('whiteBar');
  var over=document.getElementById('overlay');
  if(!bar) return;
  if(window.innerWidth<=900){
    if(bar.classList.contains('mOpen')){
      bar.classList.remove('mOpen');
      over.classList.remove('show');
    }else{
      bar.classList.remove('folded');
      bar.classList.add('mOpen');
      over.classList.add('show');
    }
  }else{
    bar.classList.remove('mOpen');
    over.classList.remove('show');
    bar.classList.toggle('folded');
  }
}
function closeMob(){
  var bar=document.getElementById('whiteBar');
  var over=document.getElementById('overlay');
  if(bar) bar.classList.remove('mOpen');
  if(over) over.classList.remove('show');
}
</script>

firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
function getTodayIST(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function formatDisplayDMY(s){if(!s)return'';let p=s.split('-');return `${p[2]}-${p[1]}-${p[0]}`;}
function addDays(s, days){let d=new Date(s+'T00:00:00');d.setDate(d.getDate()+days);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function updateDateDisplay(){document.getElementById('dateDisplay').innerText=formatDisplayDMY(document.getElementById('fDate').value);}
function openCalendar(){let el=document.getElementById('fDate');try{if(el.showPicker){el.showPicker();}}catch(e){}}
let fDateEl=document.getElementById('fDate');
let urlParams=new URLSearchParams(location.search);
fDateEl.value=getTodayIST();
let fTypeEl=document.getElementById('fType');if(urlParams.get('type'))fTypeEl.value=urlParams.get('type');updateDateDisplay();
document.getElementById('datePrev').addEventListener('click',function(){fDateEl.value=addDays(fDateEl.value,-1);updateDateDisplay();loadData();});
document.getElementById('dateNext').addEventListener('click',function(){fDateEl.value=addDays(fDateEl.value,1);updateDateDisplay();loadData();});
document.getElementById('dateCenter').addEventListener('click',function(e){e.preventDefault();openCalendar();});
document.getElementById('calIcon').addEventListener('click',function(e){e.preventDefault();e.stopPropagation();openCalendar();});
fDateEl.addEventListener('change',function(){updateDateDisplay();loadData();});
let allPatients=[],statusMap={},enhancementMap={},masterMap={},searchQuery='',isListView=false,currentPage=1,pendingAction=null,pendingShri=null,activeTimeFilter='';
if(localStorage.getItem('gda_view')==='list')isListView=true;
const gridIconSVG=`<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>`;
const listIconSVG=`<svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="4" rx="1"/><line x1="13" y1="6" x2="21" y2="6"/><rect x="3" y="10" width="7" height="4" rx="1"/><line x1="13" y1="12" x2="21" y2="12"/><rect x="3" y="16" width="7" height="4" rx="1"/><line x1="13" y1="18" x2="21" y2="18"/></svg>`;
function getPageSize(){ if(window.innerWidth > 900) return 12; return isListView ? 10 : 20; }
function normalizeTime(t){let s=String(t).toUpperCase().trim();let m=s.match(/(\d{1,2})(?::(\d{1,2}))?\s*([AP]M)?/);if(!m)return s;let h=parseInt(m[1]),mi=m[2]?m[2].padStart(2,'0'):'00',ap=m[3]||'';if(!ap){if(s.includes('AM'))ap='AM';else if(s.includes('PM'))ap='PM';}return ap?`${h}:${mi} ${ap}`:`${h}:${mi}`;}
async function buildMasterMap(){masterMap={};try{let snap=await db.collection('patients').get();snap.forEach(d=>{let p=d.data();if(p.deleted)return;let shri=String(p.shriId||p.shri||d.id||'').trim().toUpperCase();let name=String(p.patientName||p.name||'').trim().toUpperCase();if(!shri)return;masterMap[shri]={pmjayName:name,cmhtName:''};});}catch(e){}try{let snap2=await db.collection('cmht_patients').get();snap2.forEach(d=>{let p=d.data();if(p.deleted)return;let shri=String(p.shriId||p.shri||d.id||'').trim().toUpperCase();let name=String(p.patientName||p.name||'').trim().toUpperCase();if(!shri)return;if(!masterMap[shri])masterMap[shri]={pmjayName:'',cmhtName:''};masterMap[shri].cmhtName=name;});}catch(e){}}
function enrichPatient(p){let k=String(p.shri||'').trim().toUpperCase();let m=masterMap[k];if(!m)return p;let scheme=document.getElementById('fType').value;if(scheme==='PMJAY'){if(m.pmjayName)p.name=m.pmjayName;}else{if(m.cmhtName)p.name=m.cmhtName;}return p;}
async function loadData(){try{let d=document.getElementById('fDate').value,s=document.getElementById('fType').value,id=d+'_'+s;document.getElementById('doneMeta').innerText="Loading...";await buildMasterMap();let snap=await db.collection('daily_dialysis_lists').doc(id).get();let patients=snap.exists?(snap.data().patients||[]):[];patients=patients.map((p,i)=>{let e=enrichPatient({...p});e.sl=i+1;return e;});allPatients=patients;let sSnap=await db.collection('daily_photo_opd').doc(id).get();statusMap=sSnap.exists?(sSnap.data().status||{}):{};let eSnap=await db.collection('daily_enhancement').doc(id).get();enhancementMap=eSnap.exists?(eSnap.data().status||{}):{};render();}catch(e){document.getElementById('doneMeta').innerText="Error: "+(e.message||e);}}
async function savePhotoStatus(){let d=document.getElementById('fDate').value,s=document.getElementById('fType').value,id=d+'_'+s;await db.collection('daily_photo_opd').doc(id).set({date:d,scheme:s,status:statusMap,updatedAt:new Date().toISOString()},{merge:true});}
async function saveEnhancement(){let d=document.getElementById('fDate').value,s=document.getElementById('fType').value,id=d+'_'+s;await db.collection('daily_enhancement').doc(id).set({date:d,scheme:s,status:enhancementMap,updatedAt:new Date().toISOString()},{merge:true});}
function showConfirm(sh,action){pendingShri=sh;pendingAction=action;let p=allPatients.find(x=>String(x.shri||'').toUpperCase()===sh);let name=p?p.name:sh;if(action==='undo'){document.getElementById('confirmTitle').innerText='UNDO?';document.getElementById('confirmSub').innerText='Move '+name+' back to PENDING?';}else{document.getElementById('confirmTitle').innerText='ENHANCEMENT?';document.getElementById('confirmSub').innerText='Move '+name+' to ENHANCEMENT?';}document.getElementById('confirmModal').style.display='flex';}
function hideConfirm(){document.getElementById('confirmModal').style.display='none';pendingShri=null;pendingAction=null;}
async function confirmSure(){
  if(!pendingShri||!pendingAction)return;
  let btn=document.getElementById('btnSure');btn.innerText='...';btn.disabled=true;
  try{
    if(pendingAction==='undo'){
      if(!statusMap[pendingShri])statusMap[pendingShri]={photoTaken:false,opdDone:false};
      statusMap[pendingShri].photoTaken=false;statusMap[pendingShri].opdDone=false;
      await savePhotoStatus();hideConfirm();render();
      let t=document.getElementById('toast');t.innerText='Moved to Pending';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500);
    }else{
      if(!enhancementMap[pendingShri])enhancementMap[pendingShri]={enhanced:true}; else enhancementMap[pendingShri].enhanced=true;
      await saveEnhancement();hideConfirm();render();
      let t=document.getElementById('toast');t.innerText='Moved to Enhancement';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500);
    }
  }catch(e){alert(e.message);}finally{btn.innerText='SURE';btn.disabled=false;}
}
function getFiltered(){
  let tn=normalizeTime(activeTimeFilter);
  let bf=document.getElementById('filterBlock').value;
  let sq=searchQuery.toLowerCase().trim();
  if(sq.includes('admin')){ sq=''; searchQuery=''; let inp=document.getElementById('searchName'); if(inp) inp.value=''; let clr=document.getElementById('clearSearch'); if(clr) clr.style.display='none'; }
  return allPatients.filter(p=>{
    let sh=String(p.shri||'').toUpperCase();
    if(!sh)return false;
    if(bf&&p.block!==bf)return false;
    if(activeTimeFilter&&normalizeTime(p.time)!==tn)return false;
    let st=statusMap[sh]||{photoTaken:false,opdDone:false};
    if(!(st.photoTaken&&st.opdDone))return false;
    let enh=enhancementMap[sh];
    if(enh&&enh.enhanced)return false;
    if(sq){
      let nameL=String(p.name||'').toLowerCase();
      let shriL=sh.toLowerCase();
      if(!nameL.includes(sq)&&!shriL.includes(sq))return false;
    }
    return true;
  });
}
function updateToggleBtn(){let b=document.getElementById('toggleViewBtn');if(b){b.innerHTML=isListView?listIconSVG:gridIconSVG;}}
function render(){let grid=document.getElementById('grid');if(!grid)return;grid.classList.toggle('listView',isListView);let filtered=getFiltered();let ps=getPageSize();let pages=Math.max(1,Math.ceil(filtered.length/ps));if(currentPage>pages)currentPage=pages;if(currentPage<1)currentPage=1;let items=filtered.slice((currentPage-1)*ps,currentPage*ps);grid.innerHTML='';items.forEach(p=>{let sh=String(p.shri||'').toUpperCase();let div=document.createElement('div');div.className='card';div.innerHTML=`<div class="hoverPopup">${p.name||''} • ${sh} • ${p.time||''} ${p.block?'• '+p.block:''}</div><div class="cardTop"><div class="info"><div class="name">${p.name||''}</div><div class="sub">${p.time||''} • ${sh}</div></div></div><div class="actions"><button class="btnAct btnRed" data-shri="${sh}" data-action="undo">UNDO</button><button class="btnAct btnOrange" data-shri="${sh}" data-action="enhancement">ENHANCEMENT</button></div>`;grid.appendChild(div);});if(filtered.length===0){grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:30px;background:#fff;border-radius:14px;color:#0f172a;font-weight:700">No done patients</div>`;}document.getElementById('pageIndicator').innerText=`${currentPage}/${pages}`;document.getElementById('prevBtn').disabled=currentPage<=1;document.getElementById('nextBtn').disabled=currentPage>=pages;document.getElementById('doneB').innerText=filtered.length;document.getElementById('searchInfo').innerText=`${filtered.length} done • ${currentPage}/${pages}`;document.getElementById('doneMeta').innerText=`DONE ${filtered.length}`;updateToggleBtn();document.querySelectorAll('.btnAct').forEach(btn=>{const h=(e)=>{e.preventDefault();e.stopPropagation();showConfirm(btn.getAttribute('data-shri'),btn.getAttribute('data-action'));};btn.addEventListener('click',h);btn.addEventListener('touchend',h,{passive:false});});}
function goToPending(){let d=document.getElementById('fDate').value,t=document.getElementById('fType').value;location.href='gda.html?date='+encodeURIComponent(d)+'&type='+encodeURIComponent(t);}
function goToEnhancement(){let d=document.getElementById('fDate').value,t=document.getElementById('fType').value;location.href='enhancement.html?date='+encodeURIComponent(d)+'&type='+encodeURIComponent(t);}
function addUniversal(el,fn){if(!el)return;el.addEventListener('click',fn);el.addEventListener('touchend',e=>{e.preventDefault();fn(e);},{passive:false});}
document.querySelectorAll('.chip').forEach(c=>{addUniversal(c,()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');activeTimeFilter=c.dataset.time;currentPage=1;render();});});
document.getElementById('filterBlock')?.addEventListener('change',()=>{currentPage=1;render();});
document.getElementById('fType')?.addEventListener('change',loadData);
addUniversal(document.getElementById('tabSync'),()=>location.reload());
addUniversal(document.getElementById('tabPending'),goToPending);
addUniversal(document.getElementById('tabEnhance'),goToEnhancement);
addUniversal(document.getElementById('toggleViewBtn'),()=>{isListView=!isListView;localStorage.setItem('gda_view',isListView?'list':'grid');currentPage=1;render();});
addUniversal(document.getElementById('prevBtn'),()=>{currentPage--;if(currentPage<1)currentPage=1;render();});
addUniversal(document.getElementById('nextBtn'),()=>{currentPage++;render();});
addUniversal(document.getElementById('btnSure'),()=>confirmSure());
addUniversal(document.getElementById('btnNotSure'),()=>hideConfirm());
document.getElementById('confirmModal')?.addEventListener('click',e=>{if(e.target.id==='confirmModal')hideConfirm();});
const searchInput=document.getElementById('searchName');
const clearBtn=document.getElementById('clearSearch');
function killAdmin(){
  if((searchInput.value||'').toLowerCase().includes('admin')){
    searchInput.value=''; searchQuery=''; if(clearBtn) clearBtn.style.display='none'; currentPage=1; render(); return true;
  }
  return false;
}
searchInput?.addEventListener('input',e=>{ if(killAdmin()) return; searchQuery=e.target.value; if(clearBtn)clearBtn.style.display=searchQuery?'flex':'none'; currentPage=1;render(); });
searchInput?.addEventListener('focus',killAdmin);
addUniversal(clearBtn,()=>{searchInput.value='';searchQuery='';clearBtn.style.display='none';currentPage=1;render();});
const ADMIN_PASSWORD="jack8189";
try{
  db.collection("system").doc("global_logout").onSnapshot((snap)=>{
    if(!snap.exists) return;
    let lt=snap.data().logoutTime||0;
    let my=parseInt(localStorage.getItem('shija_login_time')||'0');
    if(lt>my && my!==0){
      localStorage.removeItem('shija_logged');localStorage.removeItem('shija_login_time');location.href='login.html';
    }
  });
}catch(e){}
document.addEventListener('DOMContentLoaded',()=>{
  fDateEl.value=getTodayIST(); updateDateDisplay();
  if(searchInput) searchInput.value='';
  searchQuery='';
  setTimeout(killAdmin,50); setTimeout(killAdmin,300); setTimeout(killAdmin,800);
  let iv=0; let timer=setInterval(()=>{ killAdmin(); iv++; if(iv>30) clearInterval(timer); },200);
  const adminBtn=document.getElementById('adminBtn');const adminDropdown=document.getElementById('adminDropdown');
  adminBtn?.addEventListener('click',(e)=>{e.stopPropagation(); adminDropdown.style.display = adminDropdown.style.display==='none' || adminDropdown.style.display==='' ? 'block':'none';});
  document.addEventListener('click',(e)=>{ if(!e.target.closest('#adminMenuWrap')) adminDropdown.style.display='none'; });
  document.getElementById('btnLogout')?.addEventListener('click',()=>{ if(confirm('Logout?')){ localStorage.removeItem('shija_logged'); localStorage.removeItem('shija_login_time'); location.href='login.html'; } });
  document.getElementById('btnLogoutAll')?.addEventListener('click',()=>{ adminDropdown.style.display='none'; document.getElementById('logoutAllModal').style.display='flex'; document.getElementById('adminPassInput').value=''; document.getElementById('passError').style.display='none'; });
  document.getElementById('cancelLogoutAll')?.addEventListener('click',()=>{ document.getElementById('logoutAllModal').style.display='none'; });
  document.getElementById('logoutAllModal')?.addEventListener('click',(e)=>{ if(e.target.id==='logoutAllModal') e.currentTarget.style.display='none'; });
  document.getElementById('confirmLogoutAll')?.addEventListener('click',async()=>{
    let pass=document.getElementById('adminPassInput').value.trim();
    if(pass!==ADMIN_PASSWORD){ document.getElementById('passError').style.display='block'; return; }
    document.getElementById('passError').style.display='none';
    let btn=document.getElementById('confirmLogoutAll'); btn.innerText='...'; btn.disabled=true;
    try{
      await db.collection("system").doc("global_logout").set({ logoutTime: Date.now(), timestamp: firebase.firestore.FieldValue.serverTimestamp(), triggeredBy:'admin' },{merge:true});
      alert('All devices logged out!');localStorage.removeItem('shija_logged'); localStorage.removeItem('shija_login_time'); location.href='login.html';
    }catch(err){ alert(err.message); btn.innerText='Logout All'; btn.disabled=false; }
  });
});
window.addEventListener('load',()=>{
  fDateEl.value=getTodayIST(); updateDateDisplay();
  if(searchInput) searchInput.value='';
  searchQuery='';
  if(clearBtn) clearBtn.style.display='none';
  setTimeout(()=>{updateToggleBtn();loadData();},300);
});
window.addEventListener('pageshow',()=>{
  fDateEl.value=getTodayIST(); updateDateDisplay();
  if(searchInput) searchInput.value='';
  searchQuery='';
  if(clearBtn) clearBtn.style.display='none';
  loadData();
});
window.addEventListener('resize',()=>{ render(); });
</script>
</body>
</html>
