<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHIJA Dialysis - Fold Only</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui}
body{background:#f1f5f9;color:#0f172a;min-height:100vh;display:flex}
/* FOLD ONLY - NO SLIDE */
.whiteBar{position:fixed;left:0;top:0;bottom:0;width:270px;min-width:270px;background:#0f172a;color:#94a3b8;display:flex;flex-direction:column;justify-content:space-between;transition:width .35s ease, min-width .35s ease;z-index:90;overflow:hidden;border:none}
.whiteBar.folded{width:0!important;min-width:0!important;overflow:hidden}
.whiteBar.folded .sHead,.whiteBar.folded .sMenu,.whiteBar.folded .sFoot{opacity:0;pointer-events:none}
.sHead{padding:16px 20px;display:flex;align-items:center;gap:12px;background:#ffffff;border-bottom:1px solid #e2e8f0}
.sLogo{width:44px;height:44px;min-width:44px;background:#ffffff;border-radius:12px;display:grid;place-items:center;overflow:hidden;padding:3px}
.sLogo img{width:100%;height:100%;object-fit:contain;display:block}
.sTitle b{color:#0f172a;font-size:18px;display:block;line-height:1}
.sTitle span{font-size:10px;letter-spacing:1px;color:#64748b;text-transform:uppercase}
.sMenu{flex:1;padding:12px 10px;overflow-y:auto}
.sMenu a{display:flex;padding:11px 12px;border-radius:10px;text-decoration:none;color:#94a3b8;font-size:13px;margin-bottom:3px}
.sMenu a.active{background:#1e293b;color:#fff;font-weight:600;border-left:3px solid #2563eb}
.sFoot{padding:12px;border-top:1px solid #1e293b;font-size:11px;color:#64748b}
.mainWrap{flex:1;min-width:0;display:flex;flex-direction:column;background:#f1f5f9;min-height:100vh;margin-left:270px;transition:margin-left .35s ease}
.whiteBar.folded ~ .mainWrap{margin-left:0!important}
.whiteOverlay{display:none!important}
.top{height:68px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;color:#0f172a}
.menuBtnTop{width:40px;height:36px;background:transparent;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.menuBtnTop span{display:block;width:20px;height:2.5px;background:#0f172a;border-radius:2px}
.main{flex:1;max-width:1400px;width:100%;margin:0 auto}
.content{flex:1;padding:20px 24px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{border-radius:18px;padding:18px;min-height:140px;color:#fff}
.c1{background:linear-gradient(135deg,#FF6CAB,#7366FF)} .c7{background:linear-gradient(135deg,#FFA62E,#EA4D2C)} .cClaim{background:linear-gradient(135deg,#0EA5E9,#6366F1)}
@media(max-width:1099px){.mainWrap{margin-left:0}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="whiteBar" id="whiteBar">
<div>
<div class="sHead"><div class="sLogo"><img src="logoc.png" alt="logo"></div><div class="sTitle"><b>SHIJA</b><span>DIALYSIS CARE • v2.1</span></div></div>
<div class="sMenu">
<a href="index.html" class="active">HOME</a>
<a href="total.html">TOTAL PATIENT</a>
<a href="cmht.html">CMHT TOTAL PATIENT</a>
<a href="claim.html">CLAIM</a>
<a href="searchpatient.html">SEARCH PATIENT</a>
<a href="gda.html">OFFICE ASSISTANT LIST</a>
<a href="kft.html">KFT REPORT</a>
<a href="list.html">DAILY DIALYSIS LIST</a>
<a href="add.html">ADD PATIENT</a>
<a href="bill.html">BILL</a>
</div>
</div>
<div class="sFoot"><b style="color:#fff">System Status: Online</b></div>
</div>

<div class="mainWrap">
<div class="top">
<div class="logo"><button type="button" class="menuBtnTop" onclick="toggleWhiteBar()"><span></span><span></span><span></span></button> SHIJA Dialysis</div>
</div>
<div class="main"><div class="content"><div class="grid"><div class="card c1">PMJAY 0</div><div class="card c7">CMHT 0</div></div></div></div>
</div>
<script>
function toggleWhiteBar(){document.getElementById('whiteBar').classList.toggle('folded');}
</script>
</body>
</html>
