<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHIJA Hospitals - Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{min-height:100vh;background:#e8eef5;display:flex;align-items:center;justify-content:center;padding:20px}
.wrap{width:1000px;max-width:100%;display:flex;justify-content:center;align-items:center;gap:30px}
.card{width:46%;height:540px;border-radius:22px;padding:32px;position:relative}
.left{background:white;box-shadow:0 10px 40px rgba(0,0,0,0.08);display:flex;flex-direction:column}
.left h2{font-size:18px;color:#1a2f4a;font-weight:400;line-height:1.3}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.center img{width:230px;max-width:90%;margin-bottom:12px;height:auto;object-fit:contain}
.center h3{font-size:28px;color:#1a2f4a;font-weight:700}
.btn-shadow{
  padding:14px 45px;background:white;color:#1a2f4a;border:none;
  border-radius:14px;font-weight:700;font-size:18px;cursor:pointer;
  box-shadow:0 12px 25px rgba(0,0,0,0.15),0 6px 10px rgba(0,0,0,0.1);
  transition:0.2s;margin:auto auto 10px auto
}
.btn-shadow:hover{transform:translateY(-2px);box-shadow:0 18px 30px rgba(0,0,0,0.2)}
.right{background:#1a2f4a;box-shadow:0 10px 40px rgba(0,0,0,0.2);color:white}
.right h2{font-size:32px;font-weight:700;margin-bottom:30px}
.input{margin-bottom:18px}
.input label{font-size:13px;color:#a0b8d0;display:block;margin-bottom:6px}
.input select,.input input{
  width:100%;padding:13px 15px;border:1.5px solid #2a4560;border-radius:10px;
  background:#223a56;color:white;outline:none;font-size:13px
}
.input input::placeholder{color:#7a9ab8}
.opts{display:flex;justify-content:space-between;font-size:12px;margin:18px 0;align-items:center}
.opts a{color:#8ab4ff;text-decoration:none}
.btns{display:flex;gap:12px;margin-top:10px}
.btns button{flex:1;padding:13px;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;transition:0.2s}
.btn-outline{background:transparent;border:1.5px solid white;color:white;box-shadow:0 8px 15px rgba(0,0,0,0.2)}
.btn-white{background:white;border:none;color:#1a2f4a;box-shadow:0 12px 20px rgba(0,0,0,0.3),0 4px 8px rgba(0,0,0,0.2)}
.btn-white:hover,.btn-outline:hover{transform:translateY(-2px);box-shadow:0 15px 25px rgba(0,0,0,0.35)}
.footer{text-align:center;font-size:10px;color:#6a8aaa;margin-top:28px}
@media(max-width:768px){
  .wrap{flex-direction:column}
  .card{width:92%;height:auto}
  .left{height:380px;border-radius:22px}
  .right{height:auto;border-radius:22px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="card left">
    <h2>Hello,<br>welcome to!</h2>
    <div class="center">
      <img src="loginlogo.png" alt="SHIJA Hospitals">
      <h3>SHIJA Hospitals</h3>
    </div>
    <button class="btn-shadow">SIGN IN</button>
  </div>
  <div class="card right">
    <h2>Sign In</h2>
    <form method="POST" action="">
      <div class="input">
        <label>Login As</label>
        <select name="role" required>
          <option value="ADMIN" selected>ADMIN</option>
        </select>
      </div>
      <div class="input">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter your username" required>
      </div>
      <div class="input">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter your password" required>
      </div>
      <div class="opts">
        <label><input type="checkbox" style="width:14px;height:14px"> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <div class="btns">
        <button type="button" class="btn-outline">SIGN UP</button>
        <button type="submit" class="btn-white">SIGN IN</button>
      </div>
      <div class="footer">Secure • Hospital Admin Portal • © 2024 SHIJA Hospitals</div>
    </form>
  </div>
</div>
</body>
</html>
