<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHIJA Dialysis - Patient Details</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{min-height:100vh;background:#fff;display:flex;color:#0f172a}
.bgLogo{position:fixed;top:50%;left:55%;transform:translate(-50%,-50%);width:520px;height:520px;opacity:0.16;pointer-events:none;z-index:1;display:grid;place-items:center}
.bgLogo img{width:100%;height:100%;object-fit:contain}
.whiteBar{position:fixed;left:0;top:0;bottom:0;width:270px;height:100vh;background:#0f172a;color:#94a3b8;display:flex;flex-direction:column;justify-content:space-between;z-index:90}
.whiteBar.folded{width:72px!important}
.mainWrap{flex:1;margin-left:270px;min-height:100vh;background:#f8fafc;position:relative;z-index:2}
.sHead{padding:12px;display:flex;align-items:center;gap:10px;background:#fff;border-bottom:1px solid #e2e8f0}
.sLogo{width:90px;height:90px;min-width:90px;background:#fff;border-radius:14px;display:grid;place-items:center;padding:6px;border:2px solid #e2e8f0;overflow:hidden}
.sLogo img{width:100%;height:100%;object-fit:contain;display:block}
.sTitle b{color:#0f172a;font-size:18px;font-weight:900;line-height:1}
.sTitle span{font-size:10px;color:#64748b;text-transform:uppercase;font-weight:700;display:block;margin-top:2px}
.whiteBar.folded .sTitle,.whiteBar.folded .sFoot,.whiteBar.folded .ml{display:none}
.whiteBar.folded .sHead{justify-content:center;padding:12px 0}
.whiteBar.folded .sLogo{width:50px;min-width:50px;height:50px}
.sMenu{flex:1;padding:8px;overflow-y:auto}
.sMenu a{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:12px;text-decoration:none;color:#94a3b8;font-size:13px;font-weight:500;margin-bottom:2px;white-space:nowrap;overflow:hidden}
.sMenu a:hover,.sMenu a.active{background:#1e293b;color:#fff;font-weight:600}
.mi{width:36px;min-width:36px;height:36px;display:grid;place-items:center;background:#1e293b;border-radius:10px}
.mi svg{width:18px;height:18px;stroke:#94a3b8;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sMenu a.active .mi{background:#2563eb}
.sMenu a.active .mi svg{stroke:#fff}
.sFoot{padding:12px;border-top:1px solid #1e293b;font-size:10px;color:#64748b}
.top{height:68px;background:#fff;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:20}
.main{max-width:1100px;margin:0 auto;padding:24px 16px;width:100%;position:relative;z-index:2}
.pageHead h1{font-size:30px;font-weight:900;color:#0f172a}
.pageHead p{color:#64748b;font-size:13px;margin-top:6px}
.searchTab{background:#fff;border-radius:16px;padding:14px;border:1px solid #e2e8f0;margin-bottom:16px;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.searchTab .searchRow{display:flex;gap:10px;align-items:center}
.searchTab input{flex:1;background:#f8fafc;border:1.5px solid #e2e8f0;color:#0f172a;padding:12px 14px;border-radius:12px;font-weight:700;font-size:13px;outline:0}
.searchBtn{padding:12px 16px;background:#0f172a;color:#fff;border:0;border-radius:12px;font-weight:800;font-size:12px;cursor:pointer}
.searchResults{position:absolute;top:100%;left:14px;right:14px;margin-top:8px;background:#fff;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.15);border:1px solid #e2e8f0;max-height:340px;overflow-y:auto;display:none;z-index:50}
.searchResults.show{display:block}
.sItem{padding:12px 14px;border-bottom:1px solid #f1f5f9;color:#0f172a;cursor:pointer}
.card{background:#fff;border-radius:20px;box-shadow:0 4px 20px rgba(0,0,0,.08);border:1px solid #e2e8f0;overflow:hidden;display:none}
.cardBody{padding:26px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.field{background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:14px 16px}
.field .label{font-size:10px;font-weight:800;color:#64748b;text-transform:uppercase}
.field .value{font-size:14.5px;font-weight:700;color:#0f172a;margin-top:6px}
</style>
<script>function toggleWhiteBar(){document.getElementById('whiteBar').classList.toggle('folded');}</script>
</head>
<body>
<!-- BACKGROUND WATERMARK - YOUR SHRI LOGO -->
<div class="bgLogo"><img src="hospital.jpg" alt="SHRI Watermark"></div>

<script>if(localStorage.getItem('shija_logged')!=='1'){location.href='login.html'}</script>
<div class="whiteBar" id="whiteBar">
<div style="display:flex;flex-direction:column;height:100%;overflow:hidden">
<div class="sHead"><div class="sLogo"><img src="hospital.jpg" alt="SHIJA"></div><div class="sTitle"><b>SHIJA</b><span>DIALYSIS CARE</span></div></div>
<div class="sMenu">
<a href="index.html"><span class="mi"><svg viewBox="0 0 24 24"><path d="M3 9L12 2l9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span><span class="ml">HOME</span></a>
<a href="searchpatient.html" class="active"><span class="mi"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span><span class="ml">SEARCH PATIENT</span></a>
<a href="total.html"><span class="mi"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></span><span class="ml">TOTAL PATIENT</span></a>
<a href="cmht.html"><span class="mi"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></span><span class="ml">CMHT TOTAL PATIENT</span></a>
</div>
</div>
<div class="sFoot">SHIJA • Dialysis Care</div>
</div>

<div class="mainWrap">
<div class="top"><div class="logo"><button type="button" class="menuBtnTop" onclick="toggleWhiteBar()"><span></span><span></span><span></span></button> SHIJA Dialysis</div></div>
<div class="main">
<div class="pageHead"><h1>Patient Details</h1><p>Search any patient by Name, SHRI ID</p></div>
<div class="searchTab"><div class="searchRow"><input type="text" id="patientSearch" placeholder="Search patient..." oninput="doSearch()" autocomplete="off"><button class="searchBtn" onclick="doSearch()">SEARCH</button></div><div class="searchResults" id="searchResults"></div></div>
<div id="loading" style="background:#ffffff;border-radius:20px;padding:28px;border:1px solid #e2e8f0;text-align:center;color:#64748b;font-weight:700">Loading...</div>
<div id="card" class="card"><div class="cardBody"><div class="grid"><div class="field"><div class="label">Patient Name</div><div class="value" id="pName">-</div></div><div class="field"><div class="label">SHRI ID</div><div class="value" id="pId">-</div></div><div class="field"><div class="label">PMJAY / CMHT ID</div><div class="value" id="pSchemeId">-</div></div><div class="field"><div class="label">Contact</div><div class="value" id="pPhone">-</div></div><div class="field full"><div class="label">Address</div><div class="value" id="pAddress">-</div></div></div></div></div>
</div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();let allPatients=[];
function showPatient(found){document.getElementById('loading').style.display='none';document.getElementById('pName').innerText=found.patientName||found.name||'-';document.getElementById('pId').innerText=found.shriId||found.shri||'-';document.getElementById('pSchemeId').innerText=found.pmjayId||found.cmhtId||'-';document.getElementById('pPhone').innerText=found.contactNo||'-';document.getElementById('pAddress').innerText=found.address||'-';document.getElementById('card').style.display='block';}
function doSearch(){let q=document.getElementById('patientSearch').value.toLowerCase().trim();let box=document.getElementById('searchResults');if(!q){box.classList.remove('show');return;}let filtered=allPatients.filter(p=>`${p.patientName||p.name||''} ${p.shriId||p.shri||''}`.toLowerCase().includes(q)).slice(0,20);let html='';filtered.forEach(p=>{let name=p.patientName||p.name||'Unknown';let shri=p.shriId||p.shri||'';html+=`<div class="sItem" onclick="selectPatient('${shri}')"><b>${name}</b> - ${shri}</div>`;});box.innerHTML=html;box.classList.add('show');}
function selectPatient(shri){document.getElementById('searchResults').classList.remove('show');let found=allPatients.find(p=>String(p.shriId||p.shri||'').toLowerCase()===shri.toLowerCase());if(found)showPatient(found);}
async function loadPatient(){let all=[];try{let s=await db.collection("patients").get();s.forEach(d=>{all.push(d.data())})}catch(e){}try{let s=await db.collection("cmht_patients").get();s.forEach(d=>{all.push(d.data())})}catch(e){}allPatients=all;document.getElementById('loading').style.display='none';}
loadPatient();
</script>
</body>
</html>
