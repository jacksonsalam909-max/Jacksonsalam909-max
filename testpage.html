<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pikachu | HTML CSS JavaScript</title>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<style>
* {
  cursor: none
}
body {
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0;
  padding: 0;
  height: 100vh;
  background: #fff;
}
.loading {
  background-color: #FFF;
  position: fixed;
  display: block;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 9999;
}
.loading img {
  display: block;
  min-height: 209px;
  min-width: 200px;
}
.mouse {
  width: 25px;
  height: 25px;
  border-radius: 100%;
  background-color: #fff782;
  position: absolute;
  animation: mouseAnimation .5s infinite ease-in-out alternate;
  left: 0;
  top: 0;
  pointer-events: none;
  z-index: 10000;
}
@keyframes mouseAnimation {
  from {
    width: 25px;
    height: 25px;
  }
  to {
    width: 15px;
    height: 15px;
  }
}
</style>
</head>
<body>

<div class="loading">
  <img src="http://a.top4top.net/p_1990j031.gif" alt="Loading">
</div>

<div class="mouse original"></div>

<script>
$(".loading").height($(window).height());
$(".loading").width($(window).width());

$(".loading img").css({
  paddingTop: ($(".loading").height() - $(".loading img").height()) / 2,
  paddingLeft: ($(".loading").width() - $(".loading img").width()) / 2
});

$(window).resize(function () {
  "use strict";
  $(".loading").height($(window).height());
  $(".loading").width($(window).width());
  $(".loading img").css({
    paddingTop: ($(".loading").height() - $(".loading img").height()) / 2,
    paddingLeft: ($(".loading").width() - $(".loading img").width()) / 2
  });
});

$(window).mousemove(function (e) {
  "use strict";
  $(".original").css({
    left: e.pageX - 16,
    top: e.pageY - 16
  });
});

$(window).on('load', function(){
  $(".loading").fadeOut(500);
});
</script>

</body>
</html>
