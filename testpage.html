<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DISCHARGE PATIENT - SHIJA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui}
body{display:flex;background:#f8fafc;min-height:100vh}
.whiteBar{position:fixed;left:0;top:0;bottom:0;width:270px;background:#0f172a;display:flex;flex-direction:column;justify-content:space-between;z-index:90;transition:.32s}
.whiteBar.folded{width:72px!important}
.mainWrap{flex:1;margin-left:270px;transition:.32s;width:calc(100% - 270px);min-height:100vh;background:#f8fafc}
.whiteBar.folded ~ .mainWrap{margin-left:72px!important;width:calc(100% - 72px)!important}
.sHead{padding:18px 14px;display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid #e2e8f0}
.sLogo{width:46px;height:46px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;border:1px solid #e2e8f0;overflow:hidden}
.sLogo img{width:100%;height:100%;object-fit:contain}
.sTitle b{color:#0f172a;font-size:18px;font-weight:900;display:block}
.sTitle span{font-size:11px;color:#64748b;font-weight:700;display:block;margin-top:2px}
.whiteBar.folded .sTitle,.whiteBar.folded .ml,.whiteBar.folded .footFull{display:none}
.sMenu{flex:1;padding:8px;overflow-y:auto}
.sMenu a{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:12px;text-decoration:none;color:#94a3b8;font-size:13.5px;font-weight:500;margin-bottom:2px;white-space:nowrap}
.sMenu a.active,.sMenu a:hover{background:#1e293b;color:#fff}
.mi{width:34px;min-width:34px;height:34px;display:grid;place-items:center;background:#1e293b;border-radius:8px}
.mi svg{width:18px;height:18px;stroke:#94a3b8;stroke-width:1.8;fill:none}
.sFoot{padding:12px;border-top:1px solid #1e293b;font-size:11px;color:#64748b;text-align:center}
.top{height:72px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:20}
.menuBtnTop{width:42px;height:40px;background:#fff;border:none;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.menuBtnTop span{display:block;width:22px;height:2.6px;background:#0f172a;border-radius:2px}
#mobOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:89}
#mobOverlay.show{display:block}
.content{padding:16px;background:#f8fafc}
/* TOP ROW SEARCH + NEXT PREV SAME ROW */
.topControls{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:12px 14px;margin-bottom:14px;flex-wrap:wrap}
.searchBox{flex:1;min-width:200px;max-width:400px;position:relative}
.searchBox input{width:100%;padding:10px 12px 10px 38px;border:1.5px solid #e2e8f0;border-radius:8px;font-weight:600;outline:0;background:#f8fafc}
.searchBox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:#64748b;fill:none}
.pager{display:flex;gap:8px;align-items:center;flex-shrink:0}
.pager button{padding:8px 14px;border-radius:6px;border:1.5px solid #e2e8f0;background:#fff;font-weight:800;cursor:pointer}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.pager span{font-weight:800;font-size:13px;color:#0f172a;padding:0 6px}
.patientCard{background:#fff;border:1.5px solid #e2e8f0;border-radius:14px;padding:14px;margin-bottom:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.patientCard b{font-weight:900;color:#0f172a}
.btnYellow{background:#facc15;color:#000;border:1.5px solid #eab308;padding:8px 14px;border-radius:8px;font-weight:800;cursor:pointer;text-decoration:none}
.btnDark{background:#0f172a;color:#fff;padding:8px 14px;border-radius:8px;font-weight:800;cursor:pointer;text-decoration:none}
@media(max-width:900px){.whiteBar{transform:translateX(-100%);width:270px!important}.whiteBar.mOpen{transform:translateX(0)}.mainWrap{margin-left:0!important;width:100%!important}.topControls{flex-direction:column;align-items:stretch}.pager{justify-content:space-between}}
</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app=initializeApp(cfg);
const db=getFirestore(app);
window._fb={db,collection,getDocs};
</script>
<script>function toggleWhiteBar(){if(window.innerWidth<=900){document.getElementById('whiteBar').classList.toggle('mOpen');document.getElementById('mobOverlay').classList.toggle('show');}else{document.getElementById('whiteBar').classList.toggle('folded');}}function closeMob(){document.getElementById('whiteBar').classList.remove('mOpen');document.getElementById('mobOverlay').classList.remove('show');}</script>
</head>
<body>
<div id="mobOverlay" onclick="closeMob()"></div>
<div class="whiteBar" id="whiteBar"><div style="display:flex;flex-direction:column;height:100%"><div class="sHead"><div class="sLogo"><img src="logoc.png"></div><div class="sTitle"><b>SHIJA</b><span>DIALYSIS CARE</span></div></div><div class="sMenu">
<a href="index.html"><span class="mi"><svg viewBox="0 0 24 24"><path d="M3 9L12 2l9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span><span class="ml">HOME</span></a>
<a href="discharge.html" class="active"><span class="mi"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></svg></span><span class="ml">DISCHARGE PATIENT</span></a>
</div></div><div class="sFoot"><span class="footFull">SHIJA</span><span class="footFold">☰</span></div></div>
<div class="mainWrap">
<div class="top"><div style="display:flex;align-items:center;gap:10px;font-weight:900"><button type="button" class="menuBtnTop" onclick="toggleWhiteBar()"><span></span><span></span><span></span></button> DISCHARGE PATIENT</div></div>
<div class="content">
<!-- SEARCH + NEXT PREV SAME ROW AT TOP -->
<div class="topControls">
<div class="searchBox">
<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
<input id="searchInput" type="text" placeholder="Search by SHRI / Name / PMJAY" oninput="filterSearch()">
</div>
<div class="pager">
<button id="prevBtn" onclick="prevPage()">PREV</button>
<span id="pageInfo">1 / 1</span>
<button id="nextBtn" onclick="nextPage()">NEXT</button>
</div>
</div>
<div id="patientList"></div>
</div>
</div>
<script>
let allData=[], filtered=[], currentPage=1, perPage=3;
async function load(){
let snap=await window._fb.getDocs(window._fb.collection(window._fb.db,"discharges"));
allData=[]; snap.forEach(d=>{ let data=d.data(); data._id=d.id; allData.push(data); });
allData.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
filtered=[...allData];
render();
}
function filterSearch(){
let q=document.getElementById('searchInput').value.toLowerCase().trim();
if(!q){filtered=[...allData];}else{
filtered=allData.filter(x=> (x.shri||'').toLowerCase().includes(q) || (x.patientName||'').toLowerCase().includes(q) || (x.pmjay||'').toLowerCase().includes(q) );
}
currentPage=1; render();
}
function render(){
let totalPages=Math.ceil(filtered.length/perPage)||1;
if(currentPage>totalPages) currentPage=totalPages;
let start=(currentPage-1)*perPage;
let pageData=filtered.slice(start,start+perPage);
document.getElementById('pageInfo').textContent=currentPage+' / '+totalPages;
document.getElementById('prevBtn').disabled=currentPage<=1;
document.getElementById('nextBtn').disabled=currentPage>=totalPages;
let html='';
if(pageData.length===0){html='<div style="background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:20px;text-align:center;font-weight:700;color:#64748b">No patients found</div>';}
else{
pageData.forEach(p=>{
html+=`<div class="patientCard">
<div><b style="font-size:15px">${(p.patientName||'').replace(/\s+/g,'  ')}</b><div style="font-size:12px;color:#64748b;margin-top:4px;font-weight:600">SHRI: ${p.shri||'-'} | PMJAY: ${p.pmjay||'-'} | ${p.date||''} ${p.time||''} ${p.block||''}</div></div>
<div style="display:flex;gap:8px;align-items:center"><a class="btnYellow" href="upload.html?shri=${encodeURIComponent(p.shri||'')}&name=${encodeURIComponent(p.patientName||'')}&pmjay=${encodeURIComponent(p.pmjay||'')}&date=${encodeURIComponent(p.date||'')}&time=${encodeURIComponent(p.time||'')}&block=${encodeURIComponent(p.block||'')}&id=${encodeURIComponent(p._id||'')}">UPLOAD</a></div>
</div>`;
});
}
document.getElementById('patientList').innerHTML=html;
}
function prevPage(){if(currentPage>1){currentPage--; render();}}
function nextPage(){let total=Math.ceil(filtered.length/perPage)||1; if(currentPage<total){currentPage++; render();}}
window.addEventListener('load',()=>{ setTimeout(load,500); });
</script>
</body>
</html>
