<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>SHIJA Hospitals - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Segoe UI',Arial}
html,body{width:100%;height:100%}
body{background:#eef2f7;display:block}
/* MOBILE FIRST - EQUAL 52/48 */
.container{display:flex;flex-direction:column;width:100vw;min-height:100vh;min-height:100dvh}
.left{
  position:relative;width:100vw;height:52vh;height:52dvh;min-height:380px;
  background:#0f172a;overflow:hidden;display:flex;flex-direction:column;
  justify-content:space-between;padding:18px 20px;flex-shrink:0
}
.left img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%}
.left::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.1) 40%,rgba(0,0,0,0.85) 90%)}
.left .top,.left .bottom{position:relative;z-index:2;color:#fff}
.top-logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;background:rgba(255,255,255,0.18);backdrop-filter:blur(10px);padding:5px 12px 5px 5px;border-radius:30px;width:fit-content;border:1px solid rgba(255,255,255,0.2)}
.top-logo img{width:28px;height:28px;background:#fff;border-radius:50%;padding:3px;object-fit:contain}
.bottom h2{font-size:22px;font-weight:800;margin-bottom:6px}
.bottom p{font-size:11px;opacity:.9}
.right{width:100vw;min-height:48vh;min-height:48dvh;background:#eef2f7;display:flex;justify-content:center;padding:18px 14px}
.card{width:100%;max-width:420px;background:#fff;border-radius:18px;padding:20px 18px;box-shadow:0 20px 60px rgba(0,0,0,0.15)}
.card .logo{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.card .logo img{width:48px;height:48px;border-radius:10px;background:#fff;object-fit:contain;padding:2px;border:1px solid #e2e8f0}
.card .logo b{color:#0f4c75;font-size:20px;font-weight:800}
.card h2{font-size:22px;color:#0f172a;margin:14px 0 4px;font-weight:800}
.card .sub{font-size:11.5px;color:#64748b;margin-bottom:14px}
.roleRow{display:flex;align-items:center;gap:6px;margin-bottom:12px;background:#f8fafc;padding:5px 8px;border-radius:7px;border:1px solid #f1f5f9}
.roleRow label{margin:0;font-size:8px;font-weight:700;color:#64748b;text-transform:uppercase}
.roleSelect{padding:2px 6px;border:1px solid #e2e8f0;border-radius:5px;background:#fff;font-weight:700;font-size:9px}
label{font-size:9.5px;font-weight:700;color:#334155;margin:10px 0 5px;display:block;text-transform:uppercase}
.input input{width:100%;padding:11px 12px;border:1.5px solid #e2e8f0;border-radius:9px;outline:0;font-size:12.5px;background:#f8fafc}
.input input:focus{border-color:#dc2626;box-shadow:0 0 0 3px #fecaca;background:#fff}
.row{display:flex;justify-content:space-between;align-items:center;margin:14px 0;font-size:10.5px}
.btn{width:100%;padding:12px;border:0;border-radius:9px;background:#dc2626;color:#fff;font-weight:800;font-size:12.5px;cursor:pointer;box-shadow:0 8px 18px rgba(220,38,38,0.28)}
.btn:hover{background:#b91c1c}
.foot{margin-top:14px;text-align:center;font-size:9.5px;color:#94a3b8}
.error{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:8px 10px;border-radius:7px;font-size:10.5px;margin-bottom:10px;display:none}
/* DESKTOP EQUAL 50/50 */
@media(min-width:901px){
  .container{flex-direction:row;height:100vh;height:100dvh}
  .left{width:50vw;height:100vh;height:100dvh;min-height:100vh;padding:28px 32px}
  .right{width:50vw;height:100vh;height:100dvh;min-height:100vh;align-items:center;padding:24px}
  .card{padding:28px 24px;border-radius:20px}
  .card .logo img{width:58px;height:58px}.bottom h2{font-size:30px}
}
</style>
</head>
<body>
<div class="container">
  <div class="left">
    <img class="bg" src="shijabg.jpg?v=final" alt="SHIJA Hospitals">
    <div class="top"><div class="top-logo"><img src="loginlogo.png?v=final" alt="logo">Shija Hospitals</div></div>
    <div class="bottom"><h2>Trusted Healthcare</h2><p>Compassionate Care • 24/7 Emergency • Excellence</p></div>
  </div>
  <div class="right">
    <div class="card">
      <div class="logo"><img src="loginlogo.png?v=final" alt="logo"><b>SHIJA Hospitals</b></div>
      <h2>Welcome Back</h2><div class="sub">Sign in to your hospital portal</div>
      <div id="errorBox" class="error"></div>
      <div class="roleRow"><label>Login As</label><select class="roleSelect" disabled><option selected>ADMIN</option></select></div>
      <label>Username</label><div class="input"><input id="user" placeholder="Enter username" value="shija"></div>
      <label>Password</label><div class="input"><input id="pass" type="password" placeholder="Enter password" value="shija321"></div>
      <div class="row">
        <label style="margin:0;display:flex;align-items:center;gap:5px;font-weight:600;text-transform:none;font-size:10.5px"><input type="checkbox" style="width:13px;height:13px;accent-color:#dc2626"> Remember me</label>
        <a href="#" style="color:#dc2626;text-decoration:none;font-weight:700">Forgot password?</a>
      </div>
      <button class="btn" onclick="doLogin()">Login</button>
      <div class="foot">© 2024 SHIJA Hospitals • Secure & Protected • v2.1</div>
    </div>
  </div>
</div>
<script>
function showError(m){let b=document.getElementById('errorBox');b.textContent=m;b.style.display='block';setTimeout(()=>b.style.display='none',3000)}
function doLogin(){
 let u=document.getElementById('user').value.trim();
 let p=document.getElementById('pass').value.trim();
 if(!u||!p){showError('Enter username & password');return}
 if(u==='shija' && p==='shija321'){
   localStorage.setItem('shija_logged','1');
   // DIRECT REDIRECT - NO SUCCESS WORD
   location.href='index.html';
 }else{
   showError('Invalid! Use shija / shija321');
 }
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()})
</script>
</body>
</html>
