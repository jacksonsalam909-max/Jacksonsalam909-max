<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, getDocs, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app=initializeApp(firebaseConfig,"listMain_"+Math.random());const db=getFirestore(app);window._fb={db,doc,setDoc,getDoc,getDocs,collection,deleteDoc};
</script>
<script>
let allPatients=[],filteredPatients=[],currentPage=1,pageSize=10,editIndex=-1;
let masterMap = {};
function getTodayIST(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
let urlParams=new URLSearchParams(window.location.search);
document.getElementById('fDate').value=getTodayIST();
if(urlParams.get('date')&&urlParams.get('force')==='1'){document.getElementById('fDate').value=urlParams.get('date');}
if(urlParams.get('scheme')){document.getElementById('fType').value=urlParams.get('scheme');}
const menuBtn=document.getElementById('menuBtn');
const menuDrawer=document.getElementById('menuDrawer');
const menuOverlay=document.getElementById('menuOverlay');
function toggleMenu(){menuDrawer.classList.toggle('open');menuOverlay.classList.toggle('open');}
function closeMenu(){menuDrawer.classList.remove('open');menuOverlay.classList.remove('open');}
menuBtn.addEventListener('click', toggleMenu);
menuOverlay.addEventListener('click', closeMenu);
function goPage(page){closeMenu();setTimeout(()=>{if(page.includes('list.html')){window.location.href=page;}else{window.location.href=page;}},150);}
function openAddPatientPage(){let date=document.getElementById('fDate').value;let scheme=document.getElementById('fType').value;window.location.href=`addlist.html?date=${date}&scheme=${scheme}&force=1`;}
async function buildMasterMap(){
  masterMap={};
  try{
    let snap=await window._fb.getDocs(window._fb.collection(window._fb.db,'patients'));
    snap.forEach(d=>{
      let p=d.data();if(p.deleted)return;
      let shri=String(p.shriId||p.shri||d.id||'').trim().toUpperCase();
      let pmjay=String(p.pmjayId||p.pmjay||'').trim().toUpperCase();
      let name=String(p.patientName||p.name||'').trim().toUpperCase();
      if(!shri)return;
      masterMap[shri]={shri:shri,pmjayId:pmjay,pmjayName:name,cmhtId:'',cmhtName:''};
    });
  }catch(e){}
  try{
    let snap2=await window._fb.getDocs(window._fb.collection(window._fb.db,'cmht_patients'));
    snap2.forEach(d=>{
      let p=d.data();if(p.deleted)return;
      let shri=String(p.shriId||p.shri||d.id||'').trim().toUpperCase();
      let cmht=String(p.cmhtId||p.cmht||p.pmjayId||p.pmjay||'').trim().toUpperCase();
      let name=String(p.patientName||p.name||'').trim().toUpperCase();
      if(!shri)return;
      if(!masterMap[shri])masterMap[shri]={shri:shri,pmjayId:'',pmjayName:'',cmhtId:'',cmhtName:''};
      masterMap[shri].cmhtId=cmht;masterMap[shri].cmhtName=name;
    });
  }catch(e){}
  document.getElementById('masterInfo').innerHTML=`✅ MASTER: ${Object.keys(masterMap).length} | PMJAY from total.html | CMHT from cmht.html`;
  return masterMap;
}
function enrichPatient(p){
  let shriKey=String(p.shri||'').trim().toUpperCase();if(!shriKey)return p;
  let m=masterMap[shriKey];if(!m)return p;
  let scheme=document.getElementById('fType').value;
  if(scheme==='PMJAY'){if(m.pmjayName)p.name=m.pmjayName;if(m.pmjayId)p.pmjayCmhtId=m.pmjayId;}
  else if(scheme==='CMHT'){if(m.cmhtName)p.name=m.cmhtName;if(m.cmhtId)p.pmjayCmhtId=m.cmhtId;else if(m.pmjayId)p.pmjayCmhtId=m.pmjayId;}
  return p;
}
function setStatus(t,m){let el=document.getElementById('status');el.className='status '+t;el.innerText=m;}
async function autoSaveToFirebase(){
  let date=document.getElementById('fDate').value;let scheme=document.getElementById('fType').value;let docId=date+'_'+scheme;
  setStatus('saving','SAVING...');
  try{await window._fb.setDoc(window._fb.doc(window._fb.db,'daily_dialysis_lists',docId),{date:date,scheme:scheme,patients:allPatients,count:allPatients.length,updatedAt:new Date().toISOString()});setStatus('saved',`SAVED ${allPatients.length}`);}catch(e){setStatus('saved','SAVED LOCAL');}
}
async function onDateChange(){
  let date=document.getElementById('fDate').value;let scheme=document.getElementById('fType').value;let docId=date+'_'+scheme;
  setStatus('saving','LOADING...');
  try{
    let snap=await window._fb.getDoc(window._fb.doc(window._fb.db,'daily_dialysis_lists',docId));
    let patients=snap.exists()?(snap.data().patients||[]):[];
    patients=patients.map((p,i)=>{let enriched=enrichPatient({...p,sl:i+1});enriched.sl=i+1;return enriched;});
    allPatients=patients;filteredPatients=[...allPatients];currentPage=1;
    if(patients.length===0){setStatus('blank','BLANK');}else{setStatus('saved',`${patients.length} PATIENTS`);}
    applyFilter();
  }catch(e){setStatus('saved','ERROR');}
}
async function onSchemeChange(){allPatients=[];filteredPatients=[];currentPage=1;await onDateChange();}
function normalizeTime(t){if(!t)return'';let s=String(t).toUpperCase().trim().replace(/\s+/g,' ').replace(/\./g,'');let m=s.match(/(\d{1,2})(?::(\d{1,2}))?\s*([AP]M)?/);if(!m)return s;let hour=parseInt(m[1]);let min=m[2]?m[2].padStart(2,'0'):'00';let ap=m[3]||'';if(!ap){if(s.includes('AM'))ap='AM';else if(s.includes('PM'))ap='PM';}if(ap){return`${hour}:${min} ${ap}`;}return`${hour}:${min}`;}
function applyFilter(){
  let search=document.getElementById('searchName').value.toLowerCase().trim();
  let timeFilter=document.getElementById('filterTime').value;
  let timeFilterNorm=normalizeTime(timeFilter);
  let blockFilter=document.getElementById('filterBlock').value;
  filteredPatients=allPatients.filter(p=>{
    if(search&&!String(p.name||'').toLowerCase().includes(search)&&!String(p.shri||'').toLowerCase().includes(search)&&!String(p.pmjayCmhtId||'').toLowerCase().includes(search))return false;
    if(timeFilter){let pTimeNorm=normalizeTime(p.time);if(pTimeNorm!==timeFilterNorm)return false;}
    if(blockFilter&&p.block!==blockFilter)return false;
    return true;
  });
  document.getElementById('filterCount').innerText=`${filteredPatients.length} / ${allPatients.length} PATIENTS`;
  currentPage=1;renderPagination();
}
function clearFilters(){document.getElementById('filterTime').value='';document.getElementById('filterBlock').value='';document.getElementById('searchName').value='';applyFilter();}
function renderPagination(){
  pageSize=parseInt(document.getElementById('rowsPerPage').value)||10;
  let totalPages=Math.max(1,Math.ceil(filteredPatients.length/pageSize));
  if(currentPage>totalPages)currentPage=totalPages;
  let pag=document.getElementById('pagination');pag.innerHTML='';
  for(let i=1;i<=totalPages;i++){let b=document.createElement('button');b.className='pageBtn'+(i===currentPage?' active':'');b.innerText=i;b.onclick=()=>{currentPage=i;renderTable();renderPagination();};pag.appendChild(b);}
  renderTable();
}
function renderTable(){
  let tbody=document.getElementById('tbody');tbody.innerHTML='';
  let start=(currentPage-1)*pageSize;let end=start+pageSize;
  let pagePatients=filteredPatients.slice(start,end);
  pagePatients.forEach((p,idx)=>{
    let globalIdx=allPatients.indexOf(p);
    let tr=document.createElement('tr');
    tr.innerHTML=`<td class="slCol">${p.sl||start+idx+1}</td><td class="idCol">${p.pmjayCmhtId||'<span style="color:#ef4444">NO ID</span>'}</td><td class="nameCol">${p.name||''}</td><td>${p.shri||''}</td><td>${p.time||''}</td><td>${p.block||''}</td><td>${p.prev||''}</td><td><div class="actionCell"><button class="btnEdit" onclick="openEdit(${globalIdx})">EDIT</button><button class="btnDelete" onclick="deleteRow(${globalIdx})">DELETE</button></div></td>`;
    tbody.appendChild(tr);
  });
  if(pagePatients.length===0){let tr=document.createElement('tr');tr.innerHTML=`<td colspan="8" style="padding:20px;text-align:center;background:#f8fafc">NO PATIENTS - TODAY: ${document.getElementById('fDate').value} | SCHEME: ${document.getElementById('fType').value}</td>`;tbody.appendChild(tr);}
  document.getElementById('pageInfo').innerText=`TODAY: ${document.getElementById('fDate').value} | SCHEME: ${document.getElementById('fType').value} | PAGE ${currentPage} OF ${Math.max(1,Math.ceil(filteredPatients.length/pageSize))}`;
}
function changePage(d){let totalPages=Math.max(1,Math.ceil(filteredPatients.length/pageSize));currentPage+=d;if(currentPage<1)currentPage=1;if(currentPage>totalPages)currentPage=totalPages;renderPagination();}
function openEdit(globalIdx){editIndex=globalIdx;let p=allPatients[globalIdx];if(!p)return;document.getElementById('editTitle').innerText=`EDIT: ${p.name}`;document.getElementById('editName').value=p.name||'';document.getElementById('editShri').value=p.shri||'';document.getElementById('editId').value=p.pmjayCmhtId||'';document.getElementById('editTime').value=p.time||'';document.getElementById('editBlock').value=p.block||'';document.getElementById('editPrev').value=p.prev||'';document.getElementById('editModal').style.display='flex';}
function saveEdit(){
  if(editIndex<0)return;
  allPatients[editIndex].name=document.getElementById('editName').value.toUpperCase();
  allPatients[editIndex].shri=document.getElementById('editShri').value.toUpperCase();
  allPatients[editIndex].pmjayCmhtId=document.getElementById('editId').value.toUpperCase();
  allPatients[editIndex].time=document.getElementById('editTime').value.toUpperCase();
  allPatients[editIndex].block=document.getElementById('editBlock').value.toUpperCase();
  allPatients[editIndex].prev=document.getElementById('editPrev').value;
  allPatients[editIndex]=enrichPatient(allPatients[editIndex]);
  closeModal();applyFilter();autoSaveToFirebase();
}
function closeModal(){document.getElementById('editModal').style.display='none';}
function deleteRow(globalIdx){if(!confirm('DELETE THIS PATIENT?'))return;allPatients.splice(globalIdx,1);allPatients.forEach((p,i)=>p.sl=i+1);applyFilter();autoSaveToFirebase();}
function exportPDF(){if(filteredPatients.length===0){alert('No data');return;}let date=document.getElementById('fDate').value;let type=document.getElementById('fType').value;const { jsPDF }=window.jspdf;let docPdf=new jsPDF('landscape','mm','a4');docPdf.setFontSize(13);docPdf.text(`${date} ${type} - Total: ${filteredPatients.length}`,14,12);let rows=filteredPatients.map(p=>[p.sl,p.pmjayCmhtId,p.name,p.shri,p.time,p.block,p.prev]);docPdf.autoTable({startY:16,head:[['SL','PMJAY/CMHT ID','PATIENT NAME','SHRI ID','TIME','BLOCK','PREV']],body:rows,theme:'grid',styles:{fontSize:8,halign:'center'},headStyles:{fillColor:[10,25,49]}});docPdf.save(`${date}_${type}_LIST.pdf`);}
document.getElementById('fDate').addEventListener('change', onDateChange);
document.getElementById('fType').addEventListener('change', onSchemeChange);
document.getElementById('rowsPerPage').addEventListener('change', renderPagination);
document.getElementById('searchName').addEventListener('input', applyFilter);
document.getElementById('filterTime').addEventListener('change', applyFilter);
document.getElementById('filterBlock').addEventListener('change', applyFilter);
window.addEventListener('load', async ()=>{
  document.getElementById('fDate').value=getTodayIST();
  await buildMasterMap();
  document.getElementById('menuCurrentInfo').innerText=`${document.getElementById('fDate').value} | ${document.getElementById('fType').value} | ${allPatients.length} PATIENTS`;
  setTimeout(onDateChange,200);
});
</script>
