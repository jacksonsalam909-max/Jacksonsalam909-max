<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHIJA DISCHARGE - FIXED LAYOUT</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* RESET Patient.js EXTRA HEADER */
header, .shri-header, #shriHeader, .top-banner, .institute-header{display:none!important}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui}
html,body{width:100%;overflow-x:hidden;background:#eef2ff}
body{display:flex;min-height:100vh}

/* SIDEBAR */
.whiteBar{position:fixed;left:0;top:0;bottom:0;width:270px;background:#0f172a;color:#94a3b8;display:flex;flex-direction:column;justify-content:space-between;z-index:100;transition:.3s;overflow-y:auto}
.whiteBar.folded{width:72px!important}
.mainWrap{flex:1;margin-left:270px;width:calc(100% - 270px);min-height:100vh;display:flex;flex-direction:column;background:#eef2ff;transition:.3s}
.whiteBar.folded ~ .mainWrap{margin-left:72px!important;width:calc(100% - 72px)!important}

.sHead{padding:16px 14px;display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid #e2e8f0}
.sLogo{width:42px;min-width:42px;height:42px;background:#fff;border-radius:10px;display:grid;place-items:center;border:1px solid #e2e8f0;overflow:hidden}
.sLogo img{width:100%;height:100%;object-fit:contain}
.sTitle b{color:#0f172a;font-size:16px;font-weight:900}
.sTitle span{font-size:10px;color:#64748b;font-weight:700;text-transform:uppercase}
.whiteBar.folded .sTitle{display:none}
.whiteBar.folded .sHead{justify-content:center}
.sMenu{flex:1;padding:8px}
.sMenu a{display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:10px;text-decoration:none;color:#94a3b8;font-size:13px;margin-bottom:3px;white-space:nowrap;transition:.2s}
.sMenu a:hover{color:#fff;background:#1e293b;transform:translateX(4px)}
.sMenu a.active{background:#1e293b;color:#fff}
.mi{width:32px;min-width:32px;height:32px;display:grid;place-items:center;background:#1e293b;border-radius:8px}
.mi svg{width:16px;height:16px;stroke:#94a3b8;stroke-width:1.8;fill:none}
.sMenu a.active .mi{background:#3c25eb}
.sMenu a.active .mi svg{stroke:#fff}
.ml{overflow:hidden;text-overflow:ellipsis}
.whiteBar.folded .ml{display:none}
.whiteBar.folded .sMenu a{justify-content:center}
.sFoot{padding:10px;text-align:center;font-size:10px;color:#475569;border-top:1px solid #1e293b}

/* TOP BAR */
.top{height:64px;min-height:64px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:50}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:17px;color:#0f172a}
.menuBtnTop{width:38px;height:34px;background:transparent;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:8px;transition:.2s}
.menuBtnTop:hover{background:#f1f5f9}
.menuBtnTop span{width:20px;height:2.5px;background:#0f172a;display:block;border-radius:2px}
.badgeBlue{background:#f59e0b;color:#000;padding:5px 10px;border-radius:20px;font-weight:900;font-size:11px;border:1px solid #f59e0b}

/* CONTENT */
.content{flex:1;padding:14px;width:100%;overflow-x:hidden}
.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;border:1px solid #e2e8f0;width:100%;overflow:hidden;transition:.2s}
.card:hover{box-shadow:0 6px 18px rgba(0,0,0,.06)}
.label{font-size:10px;font-weight:900;color:#475569;margin-bottom:5px;text-transform:uppercase}
.btn{padding:8px 12px;border:0;border-radius:8px;font-weight:800;font-size:12px;cursor:pointer;transition:.2s}
.btnDark{background:#3c25eb!important;color:#fff!important}
.btnDark:hover{background:#2a1bb8!important;transform:translateY(-1px)}
.btnSmall{padding:6px 10px!important;font-size:11px!important}
.input{padding:9px 12px;border:1.5px solid #cbd5e1;border-radius:8px;font-weight:700;font-size:13px;background:#fff;width:100%;outline:0;transition:.2s}
.input:focus{border-color:#3c25eb;box-shadow:0 0 0 3px rgba(60,37,235,.1)}
.inputSmall{padding:7px 10px!important;font-size:12px!important;height:32px!important}
.shriGray{background:#eef2ff;color:#3c25eb;padding:3px 7px;border-radius:5px;font-weight:800;font-size:10px;border:1px solid #c7d2fe}
.pmjayBlue{background:#f1f5f9;color:#334155;padding:3px 7px;border-radius:5px;font-weight:800;font-size:10px;border:1px solid #e2e8f0}
.sheetWrap{background:#fff;border:1px solid #e2e8f0;overflow:auto;border-radius:12px;width:100%}
table{border-collapse:collapse;width:100%;min-width:0}
th{position:sticky;top:0;background:#0f172a;color:#fff;padding:9px 5px;font-size:10px;text-align:center;font-weight:800;white-space:nowrap}
td{border-bottom:1px solid #e2e8f0;padding:7px 4px;height:42px;font-size:11px;font-weight:700;text-align:center;text-transform:uppercase;background:#fff;white-space:nowrap;max-width:130px;overflow:hidden;text-overflow:ellipsis;transition:.15s}
td.nameCol{text-align:left;padding-left:8px;max-width:150px}
tr.mainRow:hover td{background:#fffbeb!important}
tr.mainRow:hover td:first-child{border-left:3px solid #facc15}

.dateArrowBtn{width:28px;height:28px;border-radius:7px;border:1px solid #e2e8f0;background:#fff;font-weight:900;cursor:pointer;display:grid;place-items:center;transition:.2s}
.dateArrowBtn:hover{background:#0f172a;color:#fff;transform:scale(1.1)}
.dateNavWrap{display:flex;align-items:center;gap:5px;background:#fff;border:1px solid #e2e8f0;border-radius:9px;padding:3px 5px}
#fDate{width:115px;border:none!important;font-weight:800;text-align:center;font-size:12px}
.badge{background:#0f172a;color:#fff;padding:5px 9px;border-radius:20px;font-weight:900;font-size:10px}

/* YELLOW > + RED X - SMALL + HOVER */
.gtBtn{width:26px!important;min-width:26px!important;height:26px!important;border-radius:6px!important;border:1px solid #eab308!important;background:#facc15!important;color:#000!important;font-weight:900!important;font-size:13px!important;cursor:pointer;display:grid;place-items:center;transition:.2s}
.gtBtn:hover{background:#000!important;color:#facc15!important;transform:scale(1.15) rotate(3deg);box-shadow:0 4px 12px rgba(250,204,21,.4)}
.delBtn{width:26px!important;min-width:26px!important;height:26px!important;border-radius:6px!important;background:#ef4444!important;color:#fff!important;border:1px solid #dc2626!important;font-weight:900!important;font-size:11px!important;cursor:pointer;display:grid;place-items:center;transition:.2s}
.delBtn:hover{background:#000!important;color:#ef4444!important;transform:scale(1.15) rotate(-3deg);box-shadow:0 4px 12px rgba(239,68,68,.4)}

#mobOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90}
#mobOverlay.show{display:block}
@media(max-width:900px){.whiteBar{transform:translateX(-100%);width:270px!important}.whiteBar.mOpen{transform:translateX(0)}.mainWrap{margin-left:0!important;width:100%!important}.content{padding:8px}td{max-width:75px;font-size:10px}td.nameCol{max-width:85px}}
</style>
<script>
function toggleWhiteBar(){
  if(window.innerWidth<=900){
    document.getElementById('whiteBar').classList.toggle('mOpen');
    document.getElementById('mobOverlay').classList.toggle('show');
  }else{
    var bar=document.getElementById('whiteBar');
    bar.classList.toggle('folded');
    localStorage.setItem('shija_fold', bar.classList.contains('folded')?'1':'0');
  }
}
function closeMob(){document.getElementById('whiteBar').classList.remove('mOpen');document.getElementById('mobOverlay').classList.remove('show');}
window.addEventListener('load',()=>{if(localStorage.getItem('shija_fold')==='1' && innerWidth>900)document.getElementById('whiteBar').classList.add('folded')});
</script>
</head>
<body>
<div id="mobOverlay" onclick="closeMob()"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app=initializeApp(cfg,"app_"+Math.random());
const db=getFirestore(app);
window._fb={db,collection,getDocs,doc,setDoc,deleteDoc,_docsCache:{},CHUNK_SIZE:800000};
</script>

<div class="whiteBar" id="whiteBar">
<div style="display:flex;flex-direction:column;height:100%">
<div class="sHead"><div class="sLogo"><img src="logoc.png" onerror="this.innerHTML='S'"></div><div class="sTitle"><b>SHIJA</b><br><span>DIALYSIS CARE</span></div></div>
<div class="sMenu">
<a href="index.html"><span class="mi"><svg viewBox="0 0 24 24"><path d="M3 9L12 2l9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span><span class="ml">HOME</span></a>
<a href="discharge.html" class="active"><span class="mi"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></svg></span><span class="ml">DISCHARGE PATIENT</span></a>
<a href="claim.html"><span class="mi"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg></span><span class="ml">CLAIM</span></a>
</div></div><div class="sFoot"><span>SHIJA • FIXED</span></div></div>

<div class="mainWrap">
<div class="top"><div class="logo"><button type="button" class="menuBtnTop" onclick="toggleWhiteBar()"><span></span><span></span><span></span></button> DISCHARGE PATIENT <div class="badgeBlue" id="todayBadge">TODAY</div></div></div>
<div class="content">
<div class="card">
<div style="display:flex;gap:7px;flex-wrap:wrap;align-items:end;width:100%">
<div><div class="label">DATE</div><div class="dateNavWrap"><button class="dateArrowBtn" onclick="changeDateBy(-1)">◀</button><input type="date" id="fDate"><button class="dateArrowBtn" onclick="changeDateBy(1)">▶</button><button class="btn btnDark btnSmall" onclick="clearDateFilter()">ALL</button></div></div>
<div><div class="label">TIME</div><select id="fTime" class="input inputSmall" style="width:95px"><option value="">ALL</option><option>7:00 AM</option><option>12:00 PM</option><option>5:00 PM</option><option>9:00 PM</option></select></div>
<div><div class="label">BLOCK</div><select id="fBlock" class="input inputSmall" style="width:85px"><option value="">ALL</option><option>MAIN</option><option>ITOCHA</option></select></div>
<div><div class="label">PER PAGE</div><select id="perPage" class="input inputSmall" style="width:75px"><option value="12" selected>12</option><option value="24">24</option><option value="48">48</option></select></div>
<div style="display:flex;gap:5px"><button class="btn btnDark btnSmall" onclick="clearFilters()">CLEAR</button><button class="btn btnDark btnSmall" onclick="changePage(-1)">PREV</button><button class="btn btnDark btnSmall" onclick="changePage(1)">NEXT</button></div>
<div style="margin-left:auto;display:flex;gap:6px;align-items:center"><span class="badge" id="badgeD">0</span><span id="pageInfo" style="font-size:10px;font-weight:800"></span></div>
</div>
<div style="margin-top:10px"><input type="search" id="fSearch" class="input inputSmall" placeholder="Search..." style="max-width:300px;border-radius:20px"></div>
</div>
<div class="card" style="padding:6px"><div class="sheetWrap"><table><thead><tr><th>SL</th><th>PATIENT NAME</th><th>SHRI ID</th><th>PMJAY ID</th><th>DATE</th><th>TIME</th><th>BLOCK</th><th>OPEN</th><th>DELETE</th></tr></thead><tbody id="tbody"><tr><td colspan="9">LOADING...</td></tr></tbody></table></div></div>
</div></div>

<script>
var allDischarge=[],filtered=[],currentPage=1,pageSize=12;
function getTodayStr(){var d=new Date();return new Date(Date.now()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
function getDocsForShri(s){return window._fb._docsCache[s]||[];}
async function loadDocsCache(){try{var snap=await window._fb.getDocs(window._fb.collection(window._fb.db,"patient_docs"));window._fb._docsCache={};snap.forEach(d=>{var data=d.data();data._id=d.id;if(!window._fb._docsCache[data.shri])window._fb._docsCache[data.shri]=[];window._fb._docsCache[data.shri].push(data);});render();}catch(e){}}
async function loadAll(){try{var snap=await window._fb.getDocs(window._fb.collection(window._fb.db,'discharges'));allDischarge=[];snap.forEach(d=>{var o=d.data();o._id=d.id;allDischarge.push(o);});allDischarge.sort((a,b)=>{return (b.date||'').localeCompare(a.date||'')||new Date(b.dischargedAt||0)-new Date(a.dischargedAt||0);});applyFilter();}catch(e){document.getElementById('tbody').innerHTML='<tr><td colspan="9">ERROR</td></tr>';}}
function applyFilter(){
var date=document.getElementById('fDate').value;
var time=document.getElementById('fTime').value;
var block=document.getElementById('fBlock').value;
var search=document.getElementById('fSearch').value.toLowerCase().trim();
pageSize=parseInt(document.getElementById('perPage').value)||12;
filtered=allDischarge.filter(p=>{
if(date && p.date!==date) return false;
if(time && (p.time||'')!==time) return false;
if(block && (p.block||'').toUpperCase()!==block.toUpperCase()) return false;
if(search){var s=(p.patientName||p.name||'')+" "+(p.shriId||p.shri||'')+" "+(p.pmjayCmhtId||'');if(s.toLowerCase().indexOf(search)===-1) return false;}
return true;
});
currentPage=1;render();
}
function render(){
var tbody=document.getElementById('tbody');tbody.innerHTML='';
var tp=Math.max(1,Math.ceil(filtered.length/pageSize));if(currentPage>tp)currentPage=tp;var start=(currentPage-1)*pageSize;var page=filtered.slice(start,start+pageSize);
var dVal=document.getElementById('fDate').value;
document.getElementById('badgeD').innerText=filtered.length+(dVal?" ("+dVal+")":" (ALL)");
document.getElementById('pageInfo').innerText="Page "+currentPage+"/"+tp;
document.getElementById('todayBadge').innerText=dVal||"ALL";
if(page.length===0){tbody.innerHTML='<tr><td colspan="9" style="padding:20px">NO DATA FOR '+(dVal||'ALL')+'</td></tr>';return;}
page.forEach((p,i)=>{
var shriVal=p.shriId||p.shri||'';var nameVal=p.patientName||p.name||'';var pmjayShow=p.pmjayCmhtId||p.pmjayId||'';
var tr=document.createElement('tr');tr.className='mainRow';
tr.innerHTML='<td>'+(start+i+1)+'</td><td class="nameCol" title="'+nameVal+'">'+nameVal+'</td><td><span class="shriGray">'+shriVal+'</span></td><td><span class="pmjayBlue">'+pmjayShow+'</span></td><td>'+(p.date||'')+'</td><td>'+(p.time||'')+'</td><td>'+(p.block||'')+'</td>'
+'<td><button class="gtBtn" onclick="openUploadPage(\''+shriVal+'\',\''+nameVal.replace(/'/g,"\\'")+'\',\''+pmjayShow+'\',\''+(p.date||'')+'\',\''+(p.time||'')+'\',\''+(p.block||'')+'\',\''+p._id+'\')">></button></td>'
+'<td><button class="delBtn" onclick="delDischarge(\''+p._id+'\')">X</button></td>';
tbody.appendChild(tr);
});
}
function openUploadPage(shri,name,pmjay,date,time,block,id){location.href='discharge_upload.html?shri='+encodeURIComponent(shri)+'&name='+encodeURIComponent(name)+'&pmjay='+encodeURIComponent(pmjay)+'&date='+encodeURIComponent(date)+'&time='+encodeURIComponent(time)+'&block='+encodeURIComponent(block)+'&id='+encodeURIComponent(id);}
function changePage(d){var tp=Math.max(1,Math.ceil(filtered.length/pageSize));currentPage+=d;if(currentPage<1)currentPage=1;if(currentPage>tp)currentPage=tp;render();}
function clearFilters(){document.getElementById('fDate').value=getTodayStr();document.getElementById('fTime').value='';document.getElementById('fBlock').value='';document.getElementById('fSearch').value='';applyFilter();}
function clearDateFilter(){document.getElementById('fDate').value='';applyFilter();}
function changeDateBy(days){var input=document.getElementById('fDate');var base=input.value?new Date(input.value):new Date();base.setDate(base.getDate()+days);input.value=base.toISOString().slice(0,10);applyFilter();}
async function delDischarge(id){if(!confirm('DELETE?'))return;try{await window._fb.deleteDoc(window._fb.doc(window._fb.db,'discharges',id));loadAll();}catch(e){alert(e.message);}}
window.addEventListener('load',function(){
var today=getTodayStr();
document.getElementById('fDate').value=today;
document.getElementById('todayBadge').innerText=today;
loadAll();setTimeout(loadDocsCache,600);
document.getElementById('fTime').addEventListener('change',applyFilter);
document.getElementById('fBlock').addEventListener('change',applyFilter);
document.getElementById('perPage').addEventListener('change',applyFilter);
document.getElementById('fSearch').addEventListener('input',applyFilter);
document.getElementById('fDate').addEventListener('change',applyFilter);
});
</script>
</body>
</html>
