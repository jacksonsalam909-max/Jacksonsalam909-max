<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SHIJA Dialysis - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui}
body{min-height:100vh;display:grid;place-items:center;position:relative;overflow:hidden;background:#0f172a}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.bg img{width:100%;height:100%;object-fit:cover;filter:blur(10px) brightness(0.85);transform:scale(1.08)}
.bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0.12),rgba(15,23,42,0.25))}
.card{position:relative;z-index:2;width:92%;max-width:440px;background:rgba(255,255,255,0.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.85);border-radius:24px;box-shadow:0 24px 64px rgba(15,23,42,0.22),0 8px 24px rgba(15,23,42,0.12);padding:36px 32px}
.head{text-align:center;margin-bottom:28px}
.logoWrap{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px}
.logoIcon{width:56px;height:56px;background:#fff;border:1px solid #e2e8f0;border-radius:14px;display:grid;place-items:center;padding:6px;box-shadow:0 4px 12px #00000010}
.logoIcon img{width:100%;height:100%;object-fit:contain}
.logoText{font-weight:900;font-size:34px;color:#0f172a;letter-spacing:-0.5px}
.subLogo{font-size:15px;font-weight:700;color:#64748b;letter-spacing:0.5px;margin-top:2px;text-transform:uppercase}
.card h1{font-size:30px;font-weight:900;color:#0f172a;text-align:center;margin-top:18px}
.card p.desc{font-size:14px;color:#64748b;text-align:center;margin-top:8px;font-weight:500}
.field{margin-top:20px}
.field label{font-size:12px;font-weight:700;color:#0f172a;margin-bottom:8px;display:block}
.inputBox{display:flex;align-items:center;background:#fff;border:1.5px solid #e2e8f0;border-radius:14px;padding:0 14px;height:52px;transition:.2s}
.inputBox:focus-within{border-color:#2563eb;box-shadow:0 0 0 4px #2563eb14}
.inputBox input{flex:1;height:100%;border:0;outline:0;font-size:14px;font-weight:500;background:transparent}
.inputBox svg{width:20px;height:20px;stroke:#94a3b8;stroke-width:1.8;fill:none;margin-right:10px;flex-shrink:0}
.row{display:flex;justify-content:space-between;align-items:center;margin:18px 0 22px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:#475569}
.check input{width:16px;height:16px;accent-color:#2563eb}
.link{font-size:13px;font-weight:600;color:#2563eb;text-decoration:none}
.btn{width:100%;height:52px;background:#2563eb;color:#fff;border:0;border-radius:14px;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 8px 20px #2563eb30;transition:.2s}
.btn:hover{background:#1d4ed8;transform:translateY(-1px)}
.error{display:none;background:#fef2f2;border:1px solid #fecaca;color:#dc2626;padding:11px 14px;border-radius:12px;font-size:13px;font-weight:600;margin-bottom:8px}
.bottom{text-align:center;margin-top:22px;font-size:13px;color:#64748b}
.bottom b{color:#2563eb;cursor:pointer}
.footer{text-align:center;margin-top:18px;font-size:11px;color:#94a3b8}
.trap{position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;opacity:0}
</style>
</head>
<body>

<!-- FAKE INPUTS TO TRICK CHROME -->
<div class="trap"><form autocomplete="on"><input type="text" name="username" autocomplete="username"><input type="password" name="password" autocomplete="current-password"></form></div>

<!-- YOUR NEWLOGIN.JPG -->
<div class="bg"><img src="newlogin.jpg" alt="SHIJA" onerror="this.src='newlogin.png'"></div>

<div class="card">
  <div class="head">
    <div class="logoWrap">
      <!-- LOGOC.PNG - YOUR LOGO -->
      <div class="logoIcon"><img src="logoc.png" alt="SHIJA Logo"></div>
      <div class="logoText">SHIJA</div>
    </div>
    <div class="subLogo">Dialysis Care</div>
    <h1>Sign in</h1>
    <p class="desc">Welcome back. Please sign in to your account.</p>
  </div>

  <div id="errBox" class="error"></div>

  <form id="realLoginForm" autocomplete="off" onsubmit="return false">
    <div class="field">
      <label>Email address</label>
      <div class="inputBox">
        <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        <input id="shija_email_x9271" type="text" placeholder="you@clinic.com" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" readonly onfocus="this.removeAttribute('readonly')">
      </div>
    </div>

    <div class="field">
      <label>Password</label>
      <div class="inputBox">
        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input id="shija_pass_x9271" type="password" placeholder="••••••••" autocomplete="new-password" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" readonly onfocus="this.removeAttribute('readonly')">
        <svg onclick="togglePass()" style="width:20px;cursor:pointer;margin-left:8px" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="#94a3b8" fill="none"/><circle cx="12" cy="12" r="3" stroke="#94a3b8" fill="none"/></svg>
      </div>
    </div>

    <div class="row">
      <label class="check"><input type="checkbox" id="remember"> Remember me</label>
      <a class="link" href="#" onclick="alert('Contact Admin - jack8189');return false;">Forgot password?</a>
    </div>

    <button id="loginBtn" class="btn" type="button" onclick="doLogin()">Sign in</button>
  </form>

  <div class="bottom">Don't have an account? <b onclick="alert('Contact Admin')">"Contact Admin"</b></div>
  <div class="footer">SHIJA Dialysis • Manual Login Required</div>
</div>

<script>
function clearAll(){
  let u=document.getElementById('shija_email_x9271');
  let p=document.getElementById('shija_pass_x9271');
  if(u){ u.value=''; u.setAttribute('readonly','readonly'); }
  if(p){ p.value=''; p.setAttribute('readonly','readonly'); }
}
function togglePass(){
  let p=document.getElementById('shija_pass_x9271');
  p.type = p.type==='password' ? 'text' : 'password';
  p.focus();
}
function doLogin(){
  let uEl=document.getElementById('shija_email_x9271');
  let pEl=document.getElementById('shija_pass_x9271');
  uEl.removeAttribute('readonly'); pEl.removeAttribute('readonly');
  let u=uEl.value.trim(); let p=pEl.value.trim();
  let err=document.getElementById('errBox');
  let btn=document.getElementById('loginBtn');
  if(!u || !p){ err.textContent='Please enter email and password manually'; err.style.display='block'; return; }
  err.style.display='none'; btn.textContent='Signing in...'; btn.disabled=true;
  setTimeout(()=>{
    if(p==='jack8189' || u.toLowerCase().includes('shija')){
      localStorage.setItem('shija_logged','1');
      localStorage.setItem('shija_login_time',Date.now().toString());
      uEl.value=''; pEl.value='';
      location.href='index.html';
    }else{
      err.textContent='Invalid - please type manually'; err.style.display='block';
      btn.textContent='Sign in'; btn.disabled=false; pEl.value='';
    }
  },600);
}
document.addEventListener('DOMContentLoaded',()=>{
  clearAll();
  [10,100,300,600,1000,2000].forEach(t=>setTimeout(clearAll,t));
});
window.addEventListener('load',clearAll);
window.addEventListener('pageshow',clearAll);
document.addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
</script>
</body>
</html>
