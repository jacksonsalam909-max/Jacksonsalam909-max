<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROSTER FOR MONTH OF NOV 2026 - SHIJA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Calibri,Arial,sans-serif}
body{background:#c9c9c9;padding:8px}
.header{background:#92d050;color:#000;font-weight:900;padding:6px 10px;font-size:13px;border:2px solid #000}
.sheet{overflow:auto;max-height:85vh;background:#fff;border:2px solid #000}
table{border-collapse:collapse;width:100%;min-width:1200px}
th,td{border:1px solid #000;padding:4px 6px;font-size:11px;font-weight:700;text-align:center;min-width:95px;height:28px}
th{background:#92d050;color:#000;font-size:11px;position:sticky;top:0;z-index:2}
td.A{background:#92d050;text-align:left;font-size:12px;min-width:190px;position:sticky;left:0;z-index:1;font-weight:800}
th.A{position:sticky;left:0;z-index:3;background:#92d050;min-width:190px}
td.editable{cursor:pointer;background:#fff}
td.NIGHT{color:#ff0000;background:#fff}
td.DAYOFF{background:#fff;color:#000}
td.LEAVE{color:#ff0000}
td.YELLOW{background:#ffff00}
td.PINK{background:#f8cbad}
td.GREEN{background:#92d050}
td.BLUE{background:#00b0f0}
.toolbar{background:#fff;padding:8px;border:2px solid #000;border-bottom:0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{padding:6px 12px;border:1.5px solid #000;background:#92d050;font-weight:800;font-size:11px;cursor:pointer}
.input{padding:6px;border:1.5px solid #000;font-weight:700}
</style>
</head>
<body>
<div class="toolbar">
<b>ROSTER FOR THE MONTH OF <input type="month" id="month" value="2026-11" class="input"> - SHIJA HOSPITAL</b>
<button class="btn" onclick="save()">SAVE</button>
<button class="btn" onclick="window.print()">PRINT EXCEL</button>
<button class="btn" style="background:#ffff00" onclick="autoFill()">AUTO FILL LIKE PHOTO</button>
<span style="font-size:10px;font-weight:700">Click cell to edit shift | Colors: Yellow=3PM-6PM Pink=9A-5P Green=Leave White=Night</span>
</div>
<div class="header">ROSTER FOR THE MONTH OF NOV 2026 - DATA ENTRY OPERATORS & OFFICE ASSISTANT & GDA - Timing W.E.F 1st Nov 2026: MORNING-6:30AM TO 12 NOON, AFTERNOON-12N TO 5:30PM</div>
<div class="sheet"><table id="roster"></table></div>

<script>
const staff=[
{name:'RONALD',dept:'DATA ENTRY OPERATORS'},
{name:'SHINGLAI',dept:'DATA ENTRY OPERATORS'},
{name:'SURAJ',dept:'DATA ENTRY OPERATORS'},
{name:'LAXMIKANTA',dept:'DATA ENTRY OPERATORS'},
{name:'JACKSON',dept:'DATA ENTRY OPERATORS'},
{name:'CHALCHIA',dept:'DATA ENTRY OPERATORS'},
{name:'GINA',dept:'DATA ENTRY OPERATORS'},
{name:'--- OFFICE ASSISTANT & GDA ---',dept:'HEADER'},
{name:'NIKHIL',dept:'OFFICE ASSISTANT & GDA'},
{name:'NGANTHOIBA',dept:'OFFICE ASSISTANT & GDA'},
{name:'ELVISON',dept:'OFFICE ASSISTANT & GDA'},
{name:'KELLY',dept:'OFFICE ASSISTANT & GDA'},
{name:'TONDON',dept:'OFFICE ASSISTANT & GDA'},
{name:'DEV',dept:'OFFICE ASSISTANT & GDA'},
{name:'GUNACHANDRA',dept:'OFFICE ASSISTANT & GDA'},
];
const shifts=['','NIGHT','N/OFF','12N-5:30P (I/B)','6:30A-12N (I/B)','12N-5:30P','6:30A-12N','6AM-9AM (M)','9A-5P','7A-3P (M)','9A-3P','8A-4P (M)','DAY OFF','12N-5:30P (LEAVE)','6:30A-12N (LEAVE)','3PM-6PM','N-D-OFF','9:30AM-5:30PM','9:30A-5:30P'];

let data=JSON.parse(localStorage.getItem('shija_excel_roster')||'{}');

function getDays(){let v=document.getElementById('month').value;let [y,m]=v.split('-').map(Number);return new Date(y,m,0).getDate();}
function key(n,d){return document.getElementById('month').value+'_'+n+'_'+d;}

function render(){
 let days=getDays();
 let y=document.getElementById('month').value.split('-')[0],m=document.getElementById('month').value.split('-')[1];
 let head='<tr><th class="A">ROSTER / DATE</th>';for(let d=1;d<=days;d++){let dt=new Date(y,m-1,d);let dn=['SUN','MON','TUES','WED','THUR','FRI','SAT'][dt.getDay()];head+=`<th>${dn}<br>${d}</th>`;}head+='</tr>';
 let body='';
 staff.forEach(s=>{
  if(s.dept==='HEADER'){body+=`<tr><td class="A" style="background:#ffc000">${s.name}</td>`;for(let d=1;d<=days;d++)body+=`<td style="background:#ffc000"></td>`;body+='</tr>';return;}
  body+=`<tr><td class="A">${s.name}</td>`;
  for(let d=1;d<=days;d++){
   let val=data[key(s.name,d)]||'';
   let cls='editable';if(val.includes('NIGHT')||val.includes('N/OFF'))cls+=' NIGHT';if(val.includes('DAY OFF'))cls+=' DAYOFF';if(val.includes('LEAVE'))cls+=' LEAVE';if(val.includes('3PM-6PM'))cls+=' YELLOW';if(val.includes('9A-5P')||val.includes('9:30'))cls+=' PINK';if(val.includes('12N-5:30P (I/B)'))cls+=''; 
   body+=`<td class="${cls}" onclick="edit('${s.name}',${d})">${val}</td>`;
  }
  body+='</tr>';
 });
 document.getElementById('roster').innerHTML=head+body;
}

function edit(name,d){
 let cur=data[key(name,d)]||'';
 let sel=prompt(`Edit shift for ${name} Day ${d}\nOptions:\n${shifts.join(', ')}\n\nEnter shift:`,cur);
 if(sel===null)return;
 data[key(name,d)]=sel.toUpperCase();
 localStorage.setItem('shija_excel_roster',JSON.stringify(data));
 render();
}
function save(){localStorage.setItem('shija_excel_roster',JSON.stringify(data));alert('Saved '+Object.keys(data).length+' shifts ✓');}
function autoFill(){
 // Fill exactly like photo for 8-14 Nov
 let m=document.getElementById('month').value;
 let photo={
  'RONALD':{8:'NIGHT',9:'NIGHT',10:'N/OFF',11:'3PM-6PM',12:'12N-5:30P',13:'12N-5:30P (I/B)',14:'12N-5:30P (I/B)'},
  'SHINGLAI':{8:'6:30A-12N (I/B)',9:'6:30A-12N (I/B)',10:'NIGHT',11:'NIGHT',12:'NIGHT',13:'NIGHT',14:'N/OFF'},
  'SURAJ':{8:'DAY OFF',9:'9:30AM-5:30PM',10:'9:30AM-5:30PM',11:'6AM-9AM (M)',12:'9A-5P',13:'9A-5P',14:'NIGHT'},
  'LAXMIKANTA':{8:'12N-5:30P (I/B)',9:'6:30A-12N (I/B)',10:'6:30A-12N (I/B)',11:'3PM-6PM',12:'6:30A-12N (I/B)',13:'12N-5:30P',14:'12N-5:30P'},
  'JACKSON':{8:'9A-3P',9:'12N-5:30P (I/B)(LEAVE)',10:'12N-5:30P (I/B)',11:'12N-5:30P (I/B)',12:'12N-5:30P (I/B)',13:'6:30A-12N (I/B)',14:'6:30A-12N (I/B)'},
  'CHALCHIA':{8:'DAY OFF',9:'7A-3P (M)',10:'7A-3P (M)',11:'8A-4P (M)',12:'7A-3P (M)',13:'7A-3P (M)',14:'7A-3P (M)'},
  'GINA':{8:'DAY OFF',9:'9A-5P',10:'9A-5P',11:'9A-5P (CHAKOUBA)',12:'9A-5P',13:'9A-5P',14:'9A-5P'},
  'NIKHIL':{8:'6:30A-12N (LEAVE)',9:'6:30A-12N (I/B)',10:'6:30A-12N (I/B)',11:'6:30A-12N (I/B)',12:'6:30A-12N (I/B)',13:'12N-5:30P (I/B)',14:'12N-5:30P (I/B)'},
  'NGANTHOIBA':{8:'N-D-OFF',9:'12N-5:30P',10:'6:30A-12N',11:'3PM-6PM',12:'12N-5:30P',13:'6:30A-12N',14:'6:30A-12N'},
  'ELVISON':{8:'NIGHT',9:'NIGHT',10:'NIGHT',11:'N/OFF',12:'12N-5:30P (I/B)',13:'12N-5:30P',14:'12N-5:30P'},
  'KELLY':{8:'12N-5:30P',9:'6:30A-12N (LEAVE)',10:'12N-5:30P',11:'NIGHT',12:'NIGHT',13:'NIGHT',14:'NIGHT'},
  'TONDON':{8:'12N-5:30P (I/B)',9:'12N-5:30P (I/B)',10:'12N-5:30P (I/B)',11:'12N-5:30P (I/B) CHAKOUBA',12:'6:30A-12N',13:'6:30A-12N (I/B)',14:'6:30A-12N (I/B)'},
  'DEV':{8:'9:30A-5:30P',9:'9:30A-5:30P',10:'9:30A-5:30P',11:'9:30A-5:30P',12:'9:30A-5:30P',13:'9:30A-5:30P',14:'9:30A-5:30P'},
  'GUNACHANDRA':{8:'DAY OFF',9:'9:30A-5:30P',10:'9:30A-5:30P',11:'9:30A-5:30P (CHAKOUBA)',12:'9:30A-5:30P',13:'9:30A-5:30P',14:'9:30A-5:30P'},
 };
 Object.keys(photo).forEach(name=>{Object.keys(photo[name]).forEach(d=>{data[m+'_'+name+'_'+d]=photo[name][d];})});
 localStorage.setItem('shija_excel_roster',JSON.stringify(data));render();
 alert('Filled like your Excel photo for 8-14 Nov ✓ Now edit any day by clicking');
}

document.getElementById('month').addEventListener('change',render);
render();
</script>
</body>
</html>
