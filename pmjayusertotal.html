<script>
// USER ONLY + 30 MIN AUTO LOGOUT + GLOBAL LOGOUT GUARD
(function(){let l=localStorage.getItem('shija_logged'),r=localStorage.getItem('shija_role'),t=parseInt(localStorage.getItem('shija_login_time')||'0');if(l!=='1'||r!=='USER'||(Date.now()-t)>1800000){localStorage.clear();location.href='login.html';}else setTimeout(()=>{alert('Session expired - Auto logout after 30 minutes');localStorage.clear();location.href='login.html';},1800000-(Date.now()-t));})();
if(!localStorage.getItem('shija_login_time')){localStorage.setItem('shija_login_time',Date.now().toString())}
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
let app; try{ app=initializeApp(cfg,"guard_pmjayusertotal_"+Math.random()); }catch(e){ app=initializeApp(cfg,"guard_pmjayusertotal2_"+Math.random()); }
const dbGuard=getFirestore(app);
try{
  onSnapshot(doc(dbGuard,"system","global_logout"),(snap)=>{
    if(!snap.exists()) return;
    let lt=snap.data().logoutTime||0;
    let my=parseInt(localStorage.getItem('shija_login_time')||'0');
    if(lt>my && my!==0){
      localStorage.clear();
      alert('🔒 Logged out by Admin from all devices');
      location.href='login.html?reason=global';
    }
  });
}catch(e){}
try{
  window.addEventListener('storage',(e)=>{
    if(e.key==='shija_force_logout_this_device'){
      localStorage.clear();
      location.href='login.html';
    }
  });
  const bc=new BroadcastChannel('shija_logout');
  bc.onmessage=(ev)=>{ if(ev.data==='logout_this_device'){ localStorage.clear(); location.href='login.html'; } };
}catch(e){}
</script>

<script>
function toggleMenu(){
 var s=document.getElementById('side');
 var o=document.getElementById('overlay');
 if(s.className.indexOf('show')===-1){
   s.className='side show';
   o.className='sideOverlay show';
 }else{
   s.className='side';
   o.className='sideOverlay';
 }
}
document.addEventListener('DOMContentLoaded',function(){
 var b=document.getElementById('menuBtn');
 if(b){
   b.addEventListener('touchstart',function(e){e.preventDefault();toggleMenu();},{passive:false});
 }
});
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app = initializeApp(firebaseConfig,"pmjayusertotalMain_"+Math.random());
const db = getFirestore(app);
let allPatients=[],filtered=[],currentPage=1,pageSize=10;
function getKey(p){ return String(p.key||p.shri||p.id||p.name).trim(); }
function getDeleted(){ try{return JSON.parse(localStorage.getItem('deletedKeys')||'[]');}catch{return [];} }
function getEdited(){ try{return JSON.parse(localStorage.getItem('editedKeys')||'{}');}catch{return {};} }
window.onSearch=()=>{currentPage=1;applyFilter();};
window.changePageSize=()=>{pageSize=parseInt(document.getElementById('pageSize').value);currentPage=1;renderTable();};
window.applyFilter=()=>{let q=document.getElementById('search').value.toLowerCase();filtered=allPatients.filter(p=>!p.deleted && [p.name,p.shri,p.pmjay].join(' ').toLowerCase().includes(q));renderTable();};
window.renderTable=()=>{
 let totalPages=Math.max(1,Math.ceil(filtered.length/pageSize));
 if(currentPage>totalPages) currentPage=totalPages;
 let start=(currentPage-1)*pageSize;
 let data=filtered.slice(start,start+pageSize);
 let html='<tr><th>SL No</th><th>Patient</th><th>SHRI ID</th><th>Contact</th><th>PMJAY</th><th>Address</th></tr>';
 data.forEach((p)=>{html+=`<tr><td><div class="sl">${start+filtered.indexOf(p)+1}</div></td><td><b>${p.name}</b></td><td><span class="shri">${p.shri||'No ID'}</span></td><td>${p.contact||'-'}</td><td>${p.pmjay||'-'}</td><td>${(p.addr||'-').substring(0,30)}</td></tr>`;});
 if(data.length===0) html+='<tr><td colspan="6" style="text-align:center;padding:20px">No patients</td></tr>';
 document.getElementById('tbl').innerHTML=html;
 document.getElementById('info').textContent=filtered.length+' patients - Page '+currentPage+' of '+totalPages;
 document.getElementById('prevBtn').disabled=currentPage<=1;
 document.getElementById('nextBtn').disabled=currentPage>=totalPages;
 let nums=''; for(let i=1;i<=Math.min(totalPages,10);i++){ nums+=`<button class="pBtn" style="${i===currentPage?'background:#0a1931;color:#fff':''}" onclick="goPage(${i})">${i}</button>`; } document.getElementById('pageNums').innerHTML=nums;
};
window.prevPage=()=>{if(currentPage>1){currentPage--;renderTable();}};
window.nextPage=()=>{let totalPages=Math.ceil(filtered.length/pageSize);if(currentPage<totalPages){currentPage++;renderTable();}};
window.goPage=(n)=>{currentPage=n;renderTable();};
async function init(){
 let deletedLocal=getDeleted();let editedLocal=getEdited();
 try{
   const snap = await getDocs(collection(db,"patients"));
   let fbList=[];
   snap.forEach(d=>{
     let p=d.data();
     if(p.deleted) return;
     fbList.push({
       patientName: p.patientName || p.name || '',
       shriId: p.shriId || p.shri || '',
       contactNo: p.contactNo || p.contact || '',
       pmjayId: p.pmjayId || p.PMJAY || p.pmjay || '',
       address: p.address || p.addr || '',
       id: d.id
     });
   });
   let extra=[];
   try{ extra=JSON.parse(localStorage.getItem('shija_patients')||'[]'); }catch(e){}
   let seen=new Set();
   let merged=[...fbList,...extra].filter(p=>{
     let key=((p.shriId||'').toLowerCase()+'|'+(p.patientName||'').toLowerCase()).trim();
     if(seen.has(key)) return false;
     seen.add(key);
     return true;
   });
   allPatients=merged.map((pd,idx)=>{
     let rawShri=String(pd.shriId||pd.shri||'').trim();let rawId=String(pd.id||idx+1).trim();let key=rawShri||'ID_'+rawId;
     let isDel=deletedLocal.includes(key)||deletedLocal.includes(rawId)||deletedLocal.includes(rawShri);
     let edited=editedLocal[key]||editedLocal[rawId]||editedLocal[rawShri];
     if(edited){return {key:key,id:rawId,name:edited.name||pd.patientName||'',shri:edited.shri||rawShri,contact:edited.contact||pd.contactNo||'',pmjay:edited.pmjay||pd.pmjayId||'',addr:edited.addr||pd.address||'',deleted:isDel};}
     return {key:key,id:rawId,name:String(pd.patientName||'').trim(),shri:rawShri,contact:String(pd.contactNo||'').trim(),pmjay:String(pd.pmjayId||'').trim(),addr:String(pd.address||'').trim(),deleted:isDel};
   });
 }catch(e){
   console.error(e);
   document.getElementById('info').textContent='Firebase load error: '+e.message;
   allPatients=[];
 }
 applyFilter();
}
init();
</script>
