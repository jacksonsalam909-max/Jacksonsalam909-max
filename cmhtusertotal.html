<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CMHT Total Patient - View Only</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui}body{background:#f6f7fb} .top{height:64px;background:#1e293b;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:10}.top b{color:#fff;font-size:16px}.top button{padding:8px 14px;border-radius:8px;border:0;font-weight:700;cursor:pointer}.wrap{max-width:1200px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 4px 14px #0001}.head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:center}.head h1{font-size:22px}.badge{background:#8b5cf6;color:#fff;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.controls input{padding:10px;border:1.5px solid #e2e8f0;border-radius:10px;flex:1;min-width:160px;outline:0}.btn{padding:10px 16px;border:0;border-radius:10px;font-weight:800;cursor:pointer;color:#fff;background:#8b5cf6}.btnG{background:#16a34a}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #f1f5f9;text-align:left}th{background:#f8fafc}.wrap2{overflow-x:auto;max-height:70vh}.count{font-size:13px;color:#64748b;margin:8px 0}</style></head>
<body>
<script>(function(){let l=localStorage.getItem('shija_logged'),r=localStorage.getItem('shija_role'),t=parseInt(localStorage.getItem('shija_login_time')||'0');if(l!=='1'||r!=='USER'||(Date.now()-t)>1800000){localStorage.clear();location.href='login.html';}else setTimeout(()=>{alert('Session expired');localStorage.clear();location.href='login.html';},1800000-(Date.now()-t));})();</script>
<div class="top"><b>SHIJA • CMHT Total Patient <span style="color:#a78bfa;font-size:12px">VIEW ONLY</span></b><div><button onclick="location.href='user-index.html'">🏠 Home</button> <button onclick="localStorage.clear();location.href='login.html'">Logout</button></div></div>
<div class="wrap"><div class="card"><div class="head"><h1>CMHT Total Patient</h1><span class="badge">READ ONLY • No Edit / Delete</span></div>
<div class="controls"><input id="search" placeholder="Search Name / SHRI / CMHT ID / Contact..." oninput="render()"><button class="btn" onclick="render()">Search</button><button class="btn btnG" onclick="exportExcel()">Export Excel</button></div>
<div class="count" id="count">Loading...</div>
<div class="wrap2"><table><thead><tr><th>#</th><th>Name</th><th>SHRI ID</th><th>CMHT ID</th><th>Contact</th><th>Address</th></tr></thead><tbody id="tbody"></tbody></table></div>
<p style="font-size:11px;color:#94a3b8;margin-top:10px">🔒 View Only - Data comes from Admin. You cannot add, edit or delete.</p></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import {getFirestore,collection,getDocs} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const config={apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};const app=initializeApp(config);const db=getFirestore(app);
let all=[];
async function load(){ try{let snap=await getDocs(collection(db,"cmht_patients")); snap.forEach(d=>{let p=d.data(); if(!p.deleted) all.push({name:p.patientName||p.name||'',shri:p.shriId||p.shri||'',cmht:p.cmhtId||p.cmht||p.pmjay||'',contact:p.contactNo||p.contact||'',address:p.address||''});});}catch(e){} all.sort((a,b)=>a.name.localeCompare(b.name)); render(); let q=new URLSearchParams(location.search).get('search'); if(q){document.getElementById('search').value=q; render();} }
window.render=function(){let q=document.getElementById('search').value.toLowerCase().trim(); let f=all.filter(p=>[p.name,p.shri,p.cmht,p.contact,p.address].join(' ').toLowerCase().includes(q)); document.getElementById('count').textContent=`Showing ${f.length} of ${all.length} patients`; document.getElementById('tbody').innerHTML=f.map((p,i)=>`<tr><td>${i+1}</td><td><b>${p.name}</b></td><td>${p.shri}</td><td>${p.cmht}</td><td>${p.contact}</td><td>${p.address}</td></tr>`).join('')||'<tr><td colspan=6 style="text-align:center;padding:20px">No patient found</td></tr>'; window._filtered=f;};
window.exportExcel=function(){let data=(window._filtered||all).map((p,i)=>({Sl:i+1,Name:p.name,SHRI_ID:p.shri,CMHT_ID:p.cmht,Contact:p.contact,Address:p.address})); let ws=XLSX.utils.json_to_sheet(data); let wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"CMHT Total"); XLSX.writeFile(wb,"CMHT_Total_User.xlsx");};
load();
</script></body></html>
