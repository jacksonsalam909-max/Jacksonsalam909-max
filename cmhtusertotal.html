<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CMHT Total Patient - SHIJA - User View</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
body{background:#f6f7fb;display:flex;flex-direction:column;min-height:100vh}
.top{height:64px;background:#0a1931;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:fixed;top:0;left:0;right:0;z-index:9999}
.top h2{color:#fff;font-size:16px;font-weight:800}
.menuBtn{width:44px;height:44px;border-radius:8px;border:1.5px solid #1e2d55;background:#13264d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.menuBtn span{display:block;width:20px;height:2px;background:#fff;pointer-events:none}
.mainWrap{display:flex;flex:1;margin-top:64px}
.side{width:260px;background:#0a1931;padding:16px 10px;position:fixed;left:0;top:64px;bottom:0;z-index:9998;overflow-y:auto;transition:0.3s;transform:translateX(-100%)}
.side.show{transform:translateX(0)!important}
.side a{padding:12px 14px;border-radius:10px;text-decoration:none;color:#8ea0c0;font-weight:600;font-size:14px;display:block;margin-bottom:4px}
.side a.active{background:#13264d;color:#fff}
.content{flex:1;padding:16px}
.sideOverlay{position:fixed;inset:0;top:64px;background:rgba(0,0,0,0.5);z-index:9997;display:none}
.sideOverlay.show{display:block}
.tableWrap{background:#fff;border:1.5px solid #e2e8f0;border-radius:14px;overflow:hidden;margin-top:14px}
table{width:100%;border-collapse:collapse;min-width:1200px}
th{padding:14px 12px;font-size:12px;color:#64748b;background:#f8fafc;text-align:left}
td{padding:14px 12px;font-size:13px;border-bottom:1px solid #f1f5f9}
.sl{background:#f3e8ff;width:36px;height:28px;display:grid;place-items:center;border-radius:6px;font-weight:800;color:#6b21a8}
.shri{background:#8b5cf6;color:#fff;padding:4px 10px;border-radius:6px;font-weight:700;font-size:12px}
.remarkBadge{background:#ede9fe;color:#5b21b6;padding:5px 10px;border-radius:20px;font-weight:800;font-size:11px;border:1px solid #ddd6fe}
.pager{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#f8fafc;border-top:1px solid #e2e8f0;flex-wrap:wrap;gap:8px}
.pBtn{padding:8px 14px;border-radius:8px;border:1.5px solid #cbd5e1;background:#fff;font-weight:700;cursor:pointer;font-size:13px}
.pBtn:disabled{opacity:0.5}
.pInfo{font-size:13px;font-weight:600;color:#475569}
.viewBadge{background:#22c55e;color:#fff;font-size:11px;padding:4px 10px;border-radius:20px;font-weight:800;margin-left:8px}
</style>
</head>
<body>
<script>
// USER ONLY + 30 MIN AUTO LOGOUT
(function(){let l=localStorage.getItem('shija_logged'),r=localStorage.getItem('shija_role'),t=parseInt(localStorage.getItem('shija_login_time')||'0');if(l!=='1'||r!=='USER'||(Date.now()-t)>1800000){localStorage.clear();location.href='login.html';}else setTimeout(()=>{alert('Session expired - Auto logout after 30 minutes');localStorage.clear();location.href='login.html';},1800000-(Date.now()-t));})();</script>
<div class="top"><div style="display:flex;align-items:center;gap:10px"><div class="menuBtn" id="menuBtn"><span></span><span></span><span></span></div><h2>SHIJA - CMHT Total Patient <span class="viewBadge">USER • VIEW ONLY</span></h2></div><span style="color:#fff">User</span></div>
<div class="sideOverlay" id="overlay"></div>
<div class="mainWrap">
<div class="side" id="side">
<a href="user-index.html">Home</a>
<a href="pmjayusertotal.html">PMJAY TOTAL PATIENT</a>
<a href="cmhtusertotal.html" class="active">CMHT TOTAL PATIENT</a>
<a href="cmhtuserdaily.html">CMHT DAILY DIALYSIS</a>
<a href="pmjayuserdaily.html">PMJAY DAILY DIALYSIS</a>
</div>
<div class="content" id="content">
<h1>CMHT Total Patient</h1><p id="info" style="color:#64748b;font-size:13px">Loading from Firebase...</p>
<div style="display:flex;gap:10px;margin:14px 0;flex-wrap:wrap"><input id="search" style="flex:1;min-width:200px;padding:11px 14px;border-radius:10px;border:1.5px solid #cbd5e1" placeholder="Search..." oninput="onSearch()"><select id="pageSize" onchange="changePageSize()" style="padding:10px;border-radius:8px;border:1.5px solid #cbd5e1;font-weight:700"><option value="10" selected>10 / page</option><option value="20">20 / page</option><option value="50">50 / page</option></select></div>
<div class="tableWrap"><div style="overflow-x:auto"><table id="tbl"></table></div><div class="pager"><div style="display:flex;gap:6px"><button class="pBtn" id="prevBtn" onclick="prevPage()">← Prev</button><button class="pBtn" id="nextBtn" onclick="nextPage()">Next →</button></div><div class="pInfo" id="pageInfo"></div><div style="display:flex;gap:6px" id="pageNums"></div></div></div>
<p style="font-size:11px;color:#94a3b8;margin-top:10px;text-align:center">🔒 View Only — Same data as Admin. You cannot Edit or Delete.</p>
</div>
</div>
<script>
// UNIVERSAL 3-LINE BUTTON - Works on Mobile + Desktop + Tablet
function toggleMenu(){
  document.getElementById('side').classList.toggle('show');
  document.getElementById('overlay').classList.toggle('show');
}
document.addEventListener('DOMContentLoaded',function(){
  var b=document.getElementById('menuBtn');
  var o=document.getElementById('overlay');
  if(b){
    // Desktop click
    b.addEventListener('click',function(e){e.preventDefault();toggleMenu();});
    // Mobile touch - prevent double toggle
    b.addEventListener('touchstart',function(e){e.preventDefault();toggleMenu();},{passive:false});
  }
  if(o){
    o.addEventListener('click',function(){toggleMenu();});
    o.addEventListener('touchstart',function(e){e.preventDefault();toggleMenu();},{passive:false});
  }
  // Close menu when clicking a link inside sidebar
  document.querySelectorAll('#side a').forEach(function(a){
    a.addEventListener('click',function(){
      document.getElementById('side').classList.remove('show');
      document.getElementById('overlay').classList.remove('show');
    });
  });
});
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyB8Eu2ScZyR62gfkGXKs1sMp3ZudLtGdFE",authDomain:"discharge-b9528.firebaseapp.com",projectId:"discharge-b9528",storageBucket:"discharge-b9528.firebasestorage.app",messagingSenderId:"1076050472607",appId:"1:1076050472607:web:736e0688a41462460efcaa"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);
let allPatients=[],filtered=[],currentPage=1,pageSize=10;
window.onSearch=()=>{currentPage=1;applyFilter();};window.changePageSize=()=>{pageSize=parseInt(document.getElementById('pageSize').value);currentPage=1;renderTable();};
window.applyFilter=()=>{let q=document.getElementById('search').value.toLowerCase();filtered=allPatients.filter(p=>[p.name,p.shri,p.cmht,p.contact,p.aadhaar,p.addr,p.remark].join(' ').toLowerCase().includes(q));renderTable();};
window.renderTable=()=>{
 let totalPages=Math.max(1,Math.ceil(filtered.length/pageSize));if(currentPage>totalPages)currentPage=totalPages;
 let start=(currentPage-1)*pageSize;let data=filtered.slice(start,start+pageSize);
 let html='<tr><th>SL No</th><th>Patient Name</th><th>SHRI ID</th><th>CMHT ID</th><th>Contact</th><th>Aadhaar</th><th>Address</th><th>Remark</th></tr>';
 data.forEach((p,i)=>{let aadhaarShow=p.aadhaar?'XXXX-XXXX-'+p.aadhaar.slice(-4):'-';html+=`<tr><td><div class="sl">${start+i+1}</div></td><td><b>${p.name}</b></td><td><span class="shri">${p.shri||'-'}</span></td><td>${p.cmht||'-'}</td><td>${p.contact||'-'}</td><td title="${p.aadhaar}">${aadhaarShow}</td><td>${(p.addr||'-').substring(0,30)}</td><td><span class="remarkBadge">${p.remark||'CMHT'}</span></td></tr>`;});
 if(data.length===0) html+='<tr><td colspan="8" style="text-align:center;padding:20px">No CMHT patients</td></tr>';
 document.getElementById('tbl').innerHTML=html;document.getElementById('info').textContent=filtered.length+' CMHT patients (Remark: CMHT) from Firebase - Page '+currentPage+'/'+totalPages;document.getElementById('pageInfo').textContent='Showing '+(filtered.length?start+1:0)+'-'+Math.min(start+pageSize,filtered.length)+' of '+filtered.length;document.getElementById('prevBtn').disabled=currentPage<=1;document.getElementById('nextBtn').disabled=currentPage>=totalPages;
 let nums='';for(let i=1;i<=Math.min(totalPages,10);i++){nums+=`<button class="pBtn" style="${i===currentPage?'background:#0a1931;color:#fff':''}" onclick="goPage(${i})">${i}</button>`;}document.getElementById('pageNums').innerHTML=nums;
};
window.prevPage=()=>{if(currentPage>1){currentPage--;renderTable();}};window.nextPage=()=>{if(currentPage<Math.ceil(filtered.length/pageSize)){currentPage++;renderTable();}};window.goPage=(n)=>{currentPage=n;renderTable();};
async function init(){try{const snap=await getDocs(collection(db,"cmht_patients"));allPatients=[];snap.forEach(d=>{let c=d.data();allPatients.push({key:d.id,name:c.patientName||c.name||'',shri:c.shriId||c.shri||'',cmht:c.cmhtId||c.cmht||c.pmjay||'',contact:c.contactNo||c.contact||'',aadhaar:c.aadhaarNo||c.aadhaar||'',addr:c.address||c.addr||'',remark:c.remark||c.remarks||'CMHT'});});applyFilter();}catch(e){document.getElementById('info').textContent='Error: '+e.message;}}init();
</script>
</body>
</html>
